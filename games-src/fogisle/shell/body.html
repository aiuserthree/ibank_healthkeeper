<canvas id="fgView" tabindex="-1"></canvas>
<div id="fgHud" aria-hidden="true">
  <i id="fgDot"></i>
  <span id="fgTest">시험 판</span>
</div>
<section id="fgTitle" class="fg-ov">
  <h1 id="fgLogo">안개 군도 FPS</h1>
  <button id="fgGo" class="fg-btn fg-btn--main" type="button" disabled>바로 출격</button>
  <p id="fgWait" class="fg-note">작전 지역 준비 중</p>
</section>
<section id="fgPause" class="fg-ov">
  <h2><span class="fg-if-idle">잠시 멈춤</span><span class="fg-if-click">클릭하면 이어서 해요</span></h2>
  <button id="fgResume" class="fg-btn fg-btn--main" type="button">계속하기</button>
  <button id="fgQuit" class="fg-btn" type="button">임무 그만두기</button>
  <p id="fgHint" class="fg-note">한 번 더 눌러 주세요</p>
</section>
<section id="fgResult" class="fg-ov">
  <h2>작전 종료</h2>
  <p class="fg-score"><span id="fgScore">0</span> 점</p>
  <button id="fgAgain" class="fg-btn fg-btn--main" type="button">다시 하기</button>
  <button id="fgMenu" class="fg-btn" type="button">처음으로</button>
</section>
<section id="fgError" class="fg-ov">
  <h2>문제가 생겼어요</h2>
  <p id="fgErrorText" class="fg-note"></p>
  <button id="fgRestart" class="fg-btn fg-btn--main" type="button">다시 시작</button>
</section>
<section id="fgNoGl" class="fg-ov">
  <h2>3D 화면을 켤 수 없어요</h2>
  <p class="fg-note">이 브라우저에서 WebGL 이 꺼져 있어요. 크롬이나 엣지 최신판에서 다시 열어 주세요.</p>
</section>
