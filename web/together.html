<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>헬스키퍼 — 함께하기 · 동료랑 둘이서 하는 게임</title>
  <meta name="description" content="동료를 초대해 둘이서 하는 협동 · 대전 게임 모음. 손발을 맞추는 협동 게임과 1:1로 겨루는 대전 게임을 점심시간과 퇴근 후에 즐겨요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="헬스키퍼 아케이드">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="함께하기 — 동료랑 둘이서 한 판">
  <meta property="og:description" content="동료를 초대하면 Teams로 알려 드려요. 이어지는 이야기의 협동 게임부터 1:1 대전까지, 둘이서 하는 게임을 한곳에 모았어요.">
  <meta property="og:url" content="https://healthkeeper.ibank.co.kr/together">
  <meta property="og:image" content="https://healthkeeper.ibank.co.kr/assets/lounge/kitchen.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/coop-story.js"></script>
  <script src="/_shared/raid.js"></script>
  <style>
    /* 함께하기 — 둘이서 하는 게임 모음(협동 · 대전). 아케이드와 같은 큰 글씨 소개 페이지 */
    .tg { --tg-ink: #1d1d1f; --tg-gray: #6e6e73; --tg-mist: #f5f5f7; color: var(--tg-ink); background: #fff; overflow-x: clip; }
    .tg a:hover { text-decoration: none; }
    .tg-wrap { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
    .tg-kicker { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: #fdba74; }
    .tg-kicker.is-dark { color: #c2410c; }
    .tg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .12); color: #fff; font: inherit; font-size: 16px; font-weight: 800; text-decoration: none; cursor: pointer; transition: transform .15s ease, filter .15s ease; }
    .tg-btn:hover { filter: brightness(1.1); }
    .tg-btn:active { transform: scale(.97); }
    .tg-btn.is-main { background: #fff; color: #0f172a; }
    .tg-btn.is-ink { background: #0f172a; color: #fff; }

    /* 첫 화면 — 낮(주황)에서 밤(남색)으로 흐르는 바탕 + 하루 그림 넷 */
    .tg-hero { position: relative; overflow: hidden; isolation: isolate; padding: 54px 0 64px; color: #fff;
      background: radial-gradient(55% 80% at 0% 0%, rgba(249, 115, 22, .42), transparent 62%), radial-gradient(45% 70% at 100% 100%, rgba(250, 204, 21, .2), transparent 60%),
        linear-gradient(115deg, #3a1608 0%, #2a1250 36%, #0b1220 68%, #020617 100%); }
    .tg-hero__in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; gap: 48px; }
    .tg-back { display: inline-flex; align-items: center; min-height: 40px; margin-bottom: 14px; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .7); text-decoration: none; }
    .tg-back:hover { color: #fff; }
    .tg h1.tg-title { margin: 8px 0 0; font-size: clamp(56px, 7.4vw, 96px); line-height: 1; font-weight: 900; letter-spacing: -0.04em; color: #fff; }
    .tg-lead { margin: 18px 0 0; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.3; font-weight: 800; letter-spacing: -0.02em; word-break: keep-all; }
    .tg-desc { max-width: 520px; margin: 14px 0 0; font-size: 16.5px; line-height: 1.7; font-weight: 500; color: rgba(255, 255, 255, .78); word-break: keep-all; }
    .tg-live { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .tg-live a { display: inline-flex; align-items: baseline; gap: 6px; min-height: 44px; box-sizing: border-box; padding: 9px 14px; border-radius: 14px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .72); font-size: 14px; font-weight: 700; text-decoration: none; }
    .tg-live a b { font-size: 20px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .tg-live a.is-on { background: #fff; border-color: #fff; color: #0f172a; }
    .tg-live a.is-on b { color: #c2410c; }
    .tg-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .tg-hours { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 13.5px; font-weight: 600; color: rgba(255, 255, 255, .62); word-break: keep-all; }
    .tg-hero__art { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .tg-hero__art::before { content: ""; position: absolute; inset: 10% 6%; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(253, 186, 116, .35), transparent); filter: blur(10px); }
    .tg-tile { position: relative; overflow: hidden; aspect-ratio: 4 / 3; border-radius: 20px; background: var(--ch-deep); box-shadow: 0 18px 40px rgba(0, 0, 0, .4); }
    .tg-tile svg { display: block; width: 100%; height: 100%; }
    .tg-tile:nth-child(1) { transform: rotate(-2.5deg) translateY(10px); }
    .tg-tile:nth-child(2) { transform: rotate(2deg) translateY(-8px); }
    .tg-tile:nth-child(3) { transform: rotate(1.5deg) translateY(4px); }
    .tg-tile:nth-child(4) { transform: rotate(-2deg) translateY(-10px); }
    .tg-tile span { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: rgba(2, 6, 23, .74); font-size: 13px; font-weight: 800; color: #fff; }
    .tg-tile span i { padding: 2px 8px; border-radius: 999px; background: var(--ch-strong); font-style: normal; font-variant-numeric: tabular-nums; }
    .tg-closed { display: flex; align-items: center; gap: 10px; margin: 26px auto 0; padding: 14px 18px; border-radius: 16px; background: #fff3d6; color: #8a4b00; font-size: 15px; line-height: 1.5; word-break: keep-all; }

    /* 칸 공통 */
    .tg-sec { padding: 96px 0; }
    .tg-sec.is-mist { background: var(--tg-mist); }
    .tg-head { max-width: 760px; }
    .tg h2.tg-h2 { margin: 10px 0 0; font-size: clamp(34px, 4.4vw, 56px); line-height: 1.12; font-weight: 900; letter-spacing: -0.03em; color: var(--tg-ink); word-break: keep-all; }
    .tg-sub { margin: 16px 0 0; font-size: 18px; line-height: 1.65; font-weight: 600; color: var(--tg-gray); word-break: keep-all; }

    /* 협동 시리즈 — 진행 막대 · 하루 줄(12:00 → 23:30) */
    .tg-progress { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 28px; }
    .tg-progress b { font-size: 17px; font-weight: 800; }
    .tg-progress b em { font-style: normal; color: #c2410c; }
    .tg-progress i { flex: 1 1 220px; max-width: 360px; height: 10px; border-radius: 999px; background: #ececf0; overflow: hidden; }
    .tg-progress i em { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f97316, #8b5cf6, #38bdf8, #facc15); }
    .tg-progress small { font-size: 14px; color: var(--tg-gray); font-weight: 600; }
    .tg-day { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin: 44px 0 0; padding: 0; list-style: none; }
    .tg-day::before { content: ""; position: absolute; left: 6%; right: 6%; top: 15px; height: 4px; border-radius: 999px; background: linear-gradient(90deg, #f97316, #8b5cf6 36%, #38bdf8 70%, #facc15); opacity: .55; }
    .tg-ch { position: relative; display: flex; flex-direction: column; min-width: 0; }
    .tg-ch__clock { position: relative; z-index: 1; align-self: center; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--ch-deep); color: #fff; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 5px #fff; }
    .tg-ch__clock::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ch-accent); }
    .tg-ch__card { position: relative; display: flex; flex-direction: column; flex: 1; overflow: hidden; margin-top: 16px; border-radius: 22px; background: #fff; border: 1px solid #e8e8ed; color: inherit; text-decoration: none; box-shadow: 0 2px 4px rgba(15, 23, 42, .03); transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s ease, border-color .2s ease; }
    .tg-ch__card:hover { transform: translateY(-4px); border-color: var(--ch-accent); box-shadow: 0 18px 36px rgba(15, 23, 42, .1); }
    .tg-ch__art { position: relative; display: block; aspect-ratio: 16 / 10; background: var(--ch-deep); }
    .tg-ch__art svg { display: block; width: 100%; height: 100%; }
    .tg-ch__flags { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tg-flag { padding: 4px 10px; border-radius: 999px; background: rgba(2, 6, 23, .74); color: #fff; font-size: 12px; font-weight: 800; font-style: normal; }
    .tg-flag.is-hot { background: #ef4444; }
    .tg-flag.is-live { background: #2563eb; }
    .tg-flag.is-next { background: #fff; color: #0f172a; }
    .tg-ch__body { display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 16px 18px 18px; }
    .tg-ch__body small { font-size: 13px; font-weight: 800; color: var(--ch-strong); }
    .tg-ch__body b { font-size: 21px; font-weight: 900; letter-spacing: -0.02em; }
    .tg-ch__log { font-size: 14.5px; line-height: 1.6; color: #424245; word-break: keep-all; }
    .tg-ch__facts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .tg-ch__facts em { padding: 3px 9px; border-radius: 999px; background: var(--ch-soft); color: var(--ch-ink); font-size: 12px; font-style: normal; font-weight: 800; }
    .tg-ch__me { margin-top: auto; padding-top: 12px; font-size: 13.5px; font-weight: 700; color: var(--tg-gray); word-break: keep-all; }
    .tg-ch__me b { display: block; margin-bottom: 1px; font-size: 14px; font-weight: 900; color: #15803d; }
    .tg-ch__me em { display: block; margin-top: 2px; font-style: normal; font-size: 13px; font-weight: 600; color: var(--ch-ink); }
    .tg-ch__go { display: inline-flex; align-items: center; justify-content: space-between; margin-top: 10px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--ch-soft); color: var(--ch-ink); font-size: 14.5px; font-weight: 800; transition: background .2s ease, color .2s ease; }
    .tg-ch__card:hover .tg-ch__go { background: var(--ch-strong); color: #fff; }
    .tg-more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
    .tg-cast { margin-top: 64px; }
    .tg-cast h3 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
    .tg-cast > p { margin: 6px 0 0; font-size: 15px; color: var(--tg-gray); font-weight: 600; word-break: keep-all; }
    .tg-cast__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .tg-npc { display: flex; gap: 14px; padding: 18px; border-radius: 20px; background: var(--tg-mist); }
    .tg-npc svg { flex-shrink: 0; width: 64px; height: 64px; }
    .tg-npc b { display: block; font-size: 17px; font-weight: 900; }
    .tg-npc small { display: block; margin-top: 2px; font-size: 13px; font-weight: 800; color: var(--npc); }
    .tg-npc p { margin: 6px 0 0; font-size: 14px; line-height: 1.6; color: #424245; word-break: keep-all; }

    /* 대전 */
    .tg-vs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; }
    .tg-vs__card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); overflow: hidden; border-radius: 24px; background: #fff; color: inherit; text-decoration: none; transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s ease; }
    .tg-vs__card:hover { transform: translateY(-4px); box-shadow: 0 18px 36px rgba(15, 23, 42, .1); }
    .tg-vs__img { position: relative; min-height: 220px; background: #111; }
    .tg-vs__img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tg-vs__img.is-art { background: var(--ch-deep, #111); }
    .tg-vs__img.is-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .tg-extra { margin-top: 44px; }
    .tg-extra h3 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.02em; color: #0f172a; }
    .tg-extra p { margin: 6px 0 0; color: #475569; font-size: 15px; }
    .tg-extra + .tg-more { margin-top: 16px; }
    /* 번외편 카드는 한 줄에 셋이라 좁다 — 옆으로 놓으면 글 칸이 140px 쯤이라 제목이 글자 중간에서 끊긴다. 그림을 위에, 글을 아래에 */
    .tg-more .tg-vs__card { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .tg-more .tg-vs__img { min-height: 0; aspect-ratio: 2 / 1; }
    /* 대전 카드도 PC 에서는 한 줄에 셋, 그림(2:1)을 위에 — 옆에 두면 그림 칸이 세로로 길어 썸네일 속 글(1:1 퀴즈 · 숫자 야구)이 잘린다. 태블릿 · 폰은 아래 @media 대로 */
    @media (min-width: 1001px) {
      .tg-vs .tg-vs__card { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
      .tg-vs .tg-vs__img { min-height: 0; aspect-ratio: 2 / 1; }
    }
    .tg-vs__body { display: flex; flex-direction: column; gap: 6px; padding: 22px 22px 20px; }
    .tg-vs__body small { font-size: 13px; font-weight: 800; color: #2563eb; word-break: keep-all; }
    .tg-vs__body b { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; word-break: keep-all; }
    .tg-vs__body .tg-ch__me b { font-size: 14px; letter-spacing: 0; } /* 번외편 카드의 「✓ 함께 성공」은 제목 크기(24px)를 물려받지 않게 */
    .tg-vs__body p { margin: 0; font-size: 14.5px; line-height: 1.6; color: #424245; word-break: keep-all; }
    .tg-vs__flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tg-vs__flags .tg-flag { background: #f1f5f9; color: #475569; }
    .tg-vs__flags .tg-flag.is-hot { background: #fee2e2; color: #b91c1c; }
    .tg-vs__flags .tg-flag.is-live { background: #dcfce7; color: #166534; }
    .tg-vs__go { display: inline-flex; align-items: center; justify-content: space-between; margin-top: auto; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #0f172a; color: #fff; font-size: 14.5px; font-weight: 800; }

    /* 시작 방법 · 끝 */
    .tg-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 40px 0 0; padding: 0; list-style: none; counter-reset: tg; }
    .tg-steps li { padding: 26px 24px; border-radius: 22px; background: var(--tg-mist); }
    .tg-steps i { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #0f172a; color: #fff; font-size: 17px; font-style: normal; font-weight: 900; }
    .tg-steps b { display: block; margin-top: 14px; font-size: 20px; font-weight: 900; letter-spacing: -0.01em; }
    .tg-steps p { margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #424245; word-break: keep-all; }
    .tg-hourgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .tg-hourgrid div { padding: 14px 16px; border-radius: 16px; border: 1px solid #e8e8ed; }
    .tg-hourgrid small { display: block; font-size: 13px; font-weight: 800; color: #c2410c; }
    .tg-hourgrid b { display: block; margin-top: 2px; font-size: 17px; font-weight: 900; }
    .tg-end { padding: 90px 0 100px; text-align: center; color: #fff; background: linear-gradient(115deg, #3a1608 0%, #2a1250 40%, #020617 100%); }
    .tg-end p { margin: 0 0 24px; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.25; font-weight: 900; letter-spacing: -0.02em; word-break: keep-all; }
    .tg-end .tg-cta { justify-content: center; }

    @media (max-width: 1000px) {
      .tg-hero__in { grid-template-columns: minmax(0, 1fr); gap: 36px; }
      .tg-hero__art { max-width: 560px; }
      .tg-day { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 28px; }
      .tg-day::before { display: none; }
      .tg-vs { grid-template-columns: minmax(0, 1fr); }
      .tg-cast__grid, .tg-more { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tg-hourgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .tg-wrap { padding: 0 20px; }
      .tg-hero { padding: 26px 0 44px; }
      .tg h1.tg-title { font-size: 60px !important; line-height: 1 !important; }
      .tg h2.tg-h2 { font-size: 32px !important; line-height: 1.16 !important; }
      .tg-lead { font-size: 23px; }
      .tg-desc { font-size: 15.5px; }
      .tg-hero__art { gap: 10px; }
      .tg-tile { border-radius: 14px; }
      .tg-tile span { font-size: 12px; }
      .tg-sec { padding: 64px 0; }
      .tg-sub { font-size: 16px; }
      /* 하루 줄은 세로로 — 왼쪽에 시각, 오른쪽에 카드 */
      .tg-day { grid-template-columns: minmax(0, 1fr); gap: 22px; margin-top: 30px; padding-left: 26px; }
      .tg-day::before { display: block; left: 7px; right: auto; top: 6px; bottom: 6px; width: 4px; height: auto; background: linear-gradient(180deg, #f97316, #8b5cf6 36%, #38bdf8 70%, #facc15); }
      .tg-ch__clock { align-self: flex-start; margin-left: -26px; box-shadow: 0 0 0 4px #fff; }
      .tg-ch__card { margin-top: 10px; }
      .tg-cast__grid, .tg-more, .tg-steps { grid-template-columns: minmax(0, 1fr); }
      .tg-vs__card { grid-template-columns: minmax(0, 1fr); }
      .tg-vs__img { min-height: 0; aspect-ratio: 2 / 1; }
      .tg-end { padding: 64px 0 72px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tg-ch__card, .tg-vs__card, .tg-btn { transition: none; }
      .tg-ch__card:hover, .tg-vs__card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 함께하기 — 둘이서 하는 게임 모음(협동 · 대전). 홍보 링크(/together)로 처음 들어오는 화면
    //
    // ▶ 게임을 더할 때는 아래 배열에 한 줄만 더하면 된다.
    //   COOP   — 협동(2인 같은 방). room 은 서버 협동 방 key(escape.ALL_ROOMS), page 는 게임 주소.
    //            협동 시리즈 「오늘도 둘이서」의 화(HKCoopStory.chapters 에 있는 room)는 이야기 · 그림 · 시각을 거기서 가져와 하루 줄에 놓는다.
    //            시리즈 밖의 협동 게임은 title · blurb · img(/assets/lounge/….jpg) · facts 를 함께 적으면 「다른 협동 게임」 칸에 카드로 나온다.
    //   VERSUS — 대전(1:1). key 는 서버 대전 게임 key(match.MATCH_GAMES) — 받은 도전 · 내 차례를 HKApi.matchInbox() 에서 찾는다.
    //            go 는 카드 버튼 글자(없으면 「하러 가기」).
    //   소개 문구(meta · og · 아케이드 입구)에는 게임 이름을 적지 않는다 — 게임이 늘어도 고칠 필요 없게, Teams 미리보기 캐시가 낡지 않게.
    const COOP = [
      { room: "lunch", page: "/games/kitchen" },
      { room: "words", page: "/games/words" },
      { room: "overtime", page: "/games/escape" },
      { room: "parking", page: "/games/maze" },
      // 번외편 — 이야기 · 그림은 HKCoopStory.extraChapters 에서 가져온다(title 등은 이야기 파일이 없을 때만 쓴다)
      { room: "sync", page: "/games/sync", title: "통하는 사이", blurb: "같은 질문에 둘이 몰래 답하고, 서로의 답을 예상해요.", img: "/assets/lounge/sync.jpg", facts: ["5분 · 10문제"] },
      { room: "sketch", page: "/games/sketch", title: "화이트보드 그림 퀴즈", blurb: "한 사람은 그리고, 한 사람은 맞혀요.", img: "/assets/lounge/sketch.jpg", facts: ["3분", "번갈아 그리기"] },
      { room: "spotdiff", page: "/games/spotdiff", title: "틀린 그림 찾기", blurb: "사진을 한 장씩 나눠 보고, 말로 맞춰 다른 곳을 찾아요.", img: "/assets/lounge/spotdiff.jpg", facts: ["3분", "말로 맞추기"] },
    ];
    const VERSUS = [
      { key: "gomoku", page: "/games/gomoku", title: "사내 오목", blurb: "다섯 알을 먼저 나란히 놓으면 이겨요. 한 수는 24시간 안에만 두면 돼서 바쁜 날도 틈틈이 둘 수 있어요.", img: "/assets/lounge/gomoku.jpg", facts: ["1:1 대전", "번갈아 두기", "컴퓨터와 연습"], go: "두러 가기" },
      { key: "chess", page: "/games/chess", title: "사내 체스", blurb: "상대 킹을 꼼짝 못 하게 만들면 이겨요. 처음이라면 컴퓨터와 먼저 연습해 보세요.", img: "/assets/lounge/chess.jpg", facts: ["1:1 대전", "번갈아 두기", "컴퓨터와 연습"], go: "두러 가기" },
      { key: "soccer", page: "/games/soccer", title: "헤딩 축구", blurb: "옥상 미니 구장에서 2분 동안 머리로 골을 넣어요. 둘이 동시에 들어와 실시간으로 겨뤄요.", img: "/assets/lounge/soccer.jpg", facts: ["실시간 1:1", "2분 경기", "컴퓨터와 연습"], go: "경기하러 가기" },
      { key: "volley", page: "/games/volley", title: "옥상 배구", blurb: "네트 너머로 공을 넘겨 먼저 7점을 내면 이겨요. 강타 한 방이면 랠리가 끝나요.", img: "/assets/lounge/volley.jpg", facts: ["실시간 1:1", "7점 내기", "컴퓨터와 연습"], go: "경기하러 가기" },
      { key: "gostop", page: "/games/gostop", title: "고스톱", blurb: "둘이 치는 맞고. 점수를 내고 「고」를 외칠지 「스톱」할지, 판단이 승부를 갈라요.", img: "/assets/lounge/gostop.jpg", facts: ["1:1 대전", "번갈아 치기", "컴퓨터와 연습"], go: "치러 가기" },
      { key: "memory", page: "/games/memory", title: "도형 짝맞추기", blurb: "번갈아 카드 두 장을 뒤집어 같은 도형을 찾아요. 짝을 더 많이 모은 쪽이 이겨요.", img: "/assets/lounge/memory.jpg", facts: ["1:1 대전", "번갈아 뒤집기", "컴퓨터와 연습"] },
      { key: "quizduel", page: "/games/quizduel", title: "1:1 퀴즈 대결", blurb: "같은 10문제를 각자 편한 때 풀어요. 더 많이, 더 빨리 맞힌 쪽이 이겨요.", img: "/assets/lounge/quizduel.jpg", facts: ["1:1 대전", "24시간 안에 각자", "컴퓨터와 연습"], go: "풀러 가기" },
      { key: "baseball", page: "/games/baseball", title: "숫자 야구", blurb: "서로 몰래 정한 세 자리 숫자를 스트라이크 · 볼 힌트로 먼저 맞히면 이겨요.", img: "/assets/lounge/baseball.jpg", facts: ["1:1 대전", "번갈아 던지기", "컴퓨터와 연습"] },
      { key: "boxes", page: "/games/boxes", title: "칸 따먹기", blurb: "점 사이에 선을 번갈아 그어요. 네 변을 닫은 칸이 내 칸, 칸을 더 많이 가진 쪽이 이겨요.", img: "/assets/lounge/boxes.jpg", facts: ["1:1 대전", "번갈아 긋기", "컴퓨터와 연습"] },
    ];

    const esc = (t) => HKUI.escapeHtml(t);
    const S = window.HKCoopStory;

    function heroHtml(c) {
      const tiles = S ? S.order.map((k) => { const ch = S.chapters[k]; return `<div class="tg-tile" style="${S.vars(k)}">${S.scene(k)}<span><i>${esc(ch.time)}</i>${ch.no}화</span></div>`; }).join("") : "";
      const chip = (n, label, href) => `<a class="${n ? "is-on" : ""}" href="${href}"><b>${n}</b>${label}</a>`;
      return `<div class="tg-hero">
          <div class="tg-wrap tg-hero__in">
            <div class="tg-hero__copy">
              <a class="tg-back" href="/arcade">‹ 아케이드</a><br>
              <span class="tg-kicker">${HKUI.icon("users", 16, "currentColor")} 아케이드 · 새 카테고리</span>
              <h1 class="tg-title">함께하기</h1>
              <p class="tg-lead">혼자 하던 점심 한 판,<br>이제 동료랑 같이 해요.</p>
              <p class="tg-desc">동료를 찾아 초대하면 Teams로 알림이 가요. 수락하면 같은 방에서 바로 시작! 협동으로 손발을 맞추거나, 대전으로 한 수 겨뤄 보세요.</p>
              <div class="tg-live" aria-label="내 알림">
                ${chip(c.incoming, "받은 초대", c.coopIncoming || !c.matchIncoming ? "#tg-coop" : "#tg-versus")}
                ${chip(c.rooms, "같이 할 방", "#tg-coop")}
                ${chip(c.myTurn, "내 차례", "#tg-versus")}
              </div>
              <div class="tg-cta"><a class="tg-btn is-main" href="#tg-coop">협동 시리즈 보기</a><a class="tg-btn" href="#tg-versus">대전 보기</a></div>
              <div class="tg-hours">${HKUI.icon("clock", 16, "currentColor")} 점심 11:30~13:00 · 퇴근 후 18:00~ · 출근 전 ~09:00 · 주말 · 공휴일</div>
            </div>
            ${tiles ? `<div class="tg-hero__art" aria-hidden="true">${tiles}</div>` : ""}
          </div>
        </div>`;
    }

    // 협동 — 시리즈 화는 하루 줄에, 시리즈 밖 게임은 카드 칸에
    function coopHtml(ser, inbox) {
      const mine = (room) => (Array.isArray(ser) ? ser.find((x) => x.key === room) : null);
      const story = S ? COOP.filter((g) => S.chapters[g.room]).sort((a, b) => S.chapters[a.room].no - S.chapters[b.room].no) : [];
      const others = COOP.filter((g) => !story.includes(g));
      const done = story.filter((g) => (mine(g.room) || {}).cleared > 0).length;
      const nextUp = Array.isArray(ser) ? story.find((g) => !((mine(g.room) || {}).cleared > 0)) : null;
      const flags = (incoming, ready) => `${incoming ? `<em class="tg-flag is-hot">받은 초대 ${incoming}</em>` : ""}${ready ? `<em class="tg-flag is-live">같이 할 방 ${ready}</em>` : ""}`;
      const card = (g) => {
        const ch = S.chapters[g.room], s = mine(g.room);
        let me = "";
        if (s) {
          // cleared = 성공한 판(서버 series — 포기 · 시간 초과 · 점수 0 · 일찍 문 닫음은 빼고 센다)
          me = s.cleared > 0
            ? `<span class="tg-ch__me is-done"><b>✓ 함께 성공</b>${esc(ch.bestLabel)} ${esc(s.best != null ? ch.best(s.best) : "-")} · 함께한 동료 ${s.partners}명</span>`
            : `<span class="tg-ch__me">${s.played ? `${s.played}판 해 봤어요 · 아직 성공 전이에요` : "아직 안 해 봤어요"}${ch.goal ? `<em>성공하려면 · ${esc(ch.goal)}</em>` : ""}</span>`;
        }
        return `<li class="tg-ch" style="${S.vars(g.room)}">
            <span class="tg-ch__clock">${esc(ch.time)}</span>
            <a class="tg-ch__card" href="${esc(g.page)}">
              <span class="tg-ch__art">${S.scene(g.room)}<span class="tg-ch__flags">${g === nextUp ? `<em class="tg-flag is-next">다음 차례</em>` : ""}${s ? flags(s.incoming, s.ready) : ""}</span></span>
              <span class="tg-ch__body">
                <small>${ch.no}화 · ${esc(ch.place)}</small>
                <b>${esc(ch.title)}</b>
                <span class="tg-ch__log">${esc(ch.logline)}</span>
                <span class="tg-ch__facts">${["2인 협동", ...ch.facts].map((f) => `<em>${esc(f)}</em>`).join("")}</span>
                ${me}
                <span class="tg-ch__go">${s && s.cleared ? "다시 하러 가기" : "하러 가기"} <span aria-hidden="true">›</span></span>
              </span>
            </a>
          </li>`;
      };
      const other = (g) => {
        const n = (inbox && inbox.rooms && inbox.rooms[g.room]) || {};
        const s = mine(g.room) || {};
        // 번외편이면 이야기 파일의 그림 · 제목 · 줄거리를 쓴다
        const ch = S && S.chapter ? S.chapter(g.room) : null;
        const art = ch && S.scene(g.room) ? `<span class="tg-vs__img is-art" style="${S.vars(g.room)}">${S.scene(g.room)}</span>`
          : `<span class="tg-vs__img">${g.img ? `<img src="${esc(g.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
        const kick = ch ? `${esc(S.label(g.room))} · ${esc(ch.time)} · ${esc(ch.place)}` : "2인 협동";
        const best = ch && s.cleared > 0 && s.best != null ? `<span class="tg-ch__me is-done"><b>✓ 함께 성공</b>${esc(ch.bestLabel)} ${esc(ch.best(s.best))}</span>` : "";
        return `<a class="tg-vs__card" href="${esc(g.page)}">${art}
            <span class="tg-vs__body"><small>${kick}</small><b>${esc(ch ? ch.title : g.title || g.room)}</b><p>${esc(ch ? ch.logline : g.blurb || "")}</p>
              <span class="tg-vs__flags">${["2인 협동", ...((ch && ch.facts) || g.facts || [])].map((f) => `<em class="tg-flag">${esc(f)}</em>`).join("")}${flags(n.incoming || s.incoming, n.ready || s.ready)}</span>
              ${best}
              <span class="tg-vs__go">${s.cleared > 0 ? "다시 하러 가기" : "하러 가기"} <span aria-hidden="true">›</span></span></span></a>`;
      };
      const cast = S ? `<div class="tg-cast"><h3>오늘 만날 사람들</h3><p>화마다 다시 만나는 얼굴들. 앞 화에서 생긴 일이 뒤 화에서 이어져요.</p>
          <div class="tg-cast__grid">${S.series.npcs.map((n) => `<div class="tg-npc" style="--npc:${n.color}">${S.npcFace(n.name)}<div><b>${esc(n.name)}</b><small>${esc(n.role)}</small><p>${esc(n.about)}</p></div></div>`).join("")}</div></div>` : "";
      return `<div class="tg-sec" id="tg-coop"><div class="tg-wrap">
          <div class="tg-head">
            <span class="tg-kicker is-dark">${HKUI.icon("handshake", 16, "currentColor")} 협동 · 2인 · 이어지는 이야기</span>
            <h2 class="tg-h2">${S ? `「${esc(S.series.title)}」` : "협동"}</h2>
            <p class="tg-sub">${S ? `${esc(S.series.tagline)}. ${esc(S.series.logline)}` : "둘이 손발을 맞춰 함께 끝내요."}</p>
          </div>
          ${story.length && Array.isArray(ser) ? `<div class="tg-progress"><b>${story.length}화 중 <em>${done}화</em> 성공</b><i aria-hidden="true"><em style="width:${Math.round((done / story.length) * 100)}%"></em></i><small>동료와 함께 성공하면 ✓ 표시가 붙어요</small></div>` : ""}
          ${story.length ? `<ol class="tg-day">${story.map(card).join("")}</ol>` : ""}
          ${others.length ? `<div class="tg-extra"><h3>${esc((S && S.extrasInfo && S.extrasInfo.title) || "다른 협동 게임")}</h3><p>${esc((S && S.extrasInfo && S.extrasInfo.tagline) || "둘이 손발을 맞춰 함께 끝내요.")}</p></div><div class="tg-more">${others.map(other).join("")}</div>` : ""}
          ${cast}
        </div></div>`;
    }

    function versusHtml(mi) {
      const cards = VERSUS.map((g) => {
        const n = (mi && mi[g.key]) || {};
        const live = `${n.incoming ? `<em class="tg-flag is-hot">받은 도전 ${n.incoming}</em>` : ""}${n.myTurn ? `<em class="tg-flag is-live">내 차례 ${n.myTurn}</em>` : ""}`;
        return `<a class="tg-vs__card" href="${esc(g.page)}"><span class="tg-vs__img"><img src="${esc(g.img)}" alt="" loading="lazy" onerror="this.remove()"></span>
            <span class="tg-vs__body"><small>대전 · 1:1</small><b>${esc(g.title)}</b><p>${esc(g.blurb)}</p>
              <span class="tg-vs__flags">${live}${(g.facts || []).map((f) => `<em class="tg-flag">${esc(f)}</em>`).join("")}</span>
              <span class="tg-vs__go">${n.myTurn ? "내 차례 " : ""}${esc(g.go || "하러 가기")} <span aria-hidden="true">›</span></span></span></a>`;
      }).join("");
      return `<div class="tg-sec is-mist" id="tg-versus"><div class="tg-wrap">
          <div class="tg-head">
            <span class="tg-kicker is-dark">${HKUI.icon("swords", 16, "currentColor")} 대전 · 1:1</span>
            <h2 class="tg-h2">한 수, 겨뤄 볼까요?</h2>
            <p class="tg-sub">동료에게 도전장을 보내고 1:1로 겨뤄요. 이기면 사내 순위에 올라가요.</p>
          </div>
          <div class="tg-vs">${cards}</div>
        </div></div>`;
    }

    function howHtml() {
      return `<div class="tg-sec" id="tg-how"><div class="tg-wrap">
          <div class="tg-head"><span class="tg-kicker is-dark">${HKUI.icon("sparkles", 16, "currentColor")} 처음이라면</span><h2 class="tg-h2">이렇게 시작해요.</h2></div>
          <ol class="tg-steps">
            <li><i>1</i><b>동료 찾기</b><p>게임 화면의 「동료 초대하기」에서 이름이나 부서로 찾아 초대를 눌러요.</p></li>
            <li><i>2</i><b>Teams 알림</b><p>동료에게 Teams로 알림이 가요. 24시간 안에 수락하면 같이 할 방이 열려요.</p></li>
            <li><i>3</i><b>같이 시작</b><p>협동은 둘 다 「준비」를 누르면 바로 시작해요. 대전은 도전을 수락하면 바로 겨뤄요.</p></li>
          </ol>
          <div class="tg-hourgrid">
            <div><small>점심시간</small><b>11:30 ~ 13:00</b></div>
            <div><small>퇴근 후</small><b>18:00 ~</b></div>
            <div><small>출근 전</small><b>~ 09:00</b></div>
            <div><small>주말 · 공휴일</small><b>하루 종일</b></div>
          </div>
        </div></div>`;
    }

    function endHtml() {
      return `<div class="tg-end"><div class="tg-wrap">
          <p>같이 할 동료에게<br>이 페이지를 보내 보세요.</p>
          <div class="tg-cta"><button type="button" class="tg-btn is-main" data-share>${HKUI.icon("link", 18, "currentColor")} 링크 복사</button><a class="tg-btn" href="#tg-coop">게임 고르기</a></div>
        </div></div>`;
    }

    async function copyLink() {
      const url = `${location.origin}/together`;
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(url);
        else {
          const ta = document.createElement("textarea");
          ta.value = url; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        }
        HKUI.toast("링크를 복사했어요. Teams 대화방에 붙여 넣어 보세요");
      } catch (_) { HKUI.toast(url, "success"); }
    }

    HKMember.mountPage({
      active: "lounge",
      auth: true,
      render: () => `<div class="tg" id="tg-root"><div style="text-align:center;padding:120px 0"><span class="hk-spin"></span></div></div>`,
      afterMount: async () => {
        const root = document.getElementById("tg-root");
        const [st, ser, inbox, mi] = await Promise.all([
          HKApi.playStatus().catch(() => ({ open: true })),
          HKApi.coopSeries ? HKApi.coopSeries().catch(() => null) : null,
          HKApi.coopInbox().catch(() => null),
          HKApi.matchInbox().catch(() => null),
        ]);
        const sum = (list, k) => list.reduce((n, x) => n + (Number(x && x[k]) || 0), 0);
        const coopIncoming = inbox ? inbox.incoming || 0 : Array.isArray(ser) ? sum(ser, "incoming") : 0;
        const coopReady = inbox ? inbox.ready || 0 : Array.isArray(ser) ? sum(ser, "ready") : 0;
        const vs = mi ? VERSUS.map((g) => mi[g.key] || {}) : [];
        const matchIncoming = sum(vs, "incoming");
        const counts = { incoming: coopIncoming + matchIncoming, coopIncoming, matchIncoming, rooms: coopReady, myTurn: sum(vs, "myTurn") };
        const closed = st && st.open === false
          ? `<div class="tg-wrap"><div class="tg-closed">${HKUI.icon("briefcase", 18, "currentColor")}<span>지금은 업무 시간이라 게임을 시작할 수 없어요${st.opensAt ? ` · 오늘 <b>${esc(st.opensAt)}</b>에 다시 열려요` : ""}. 받은 초대와 기록은 언제든 볼 수 있어요.</span></div></div>` : "";
        root.innerHTML = heroHtml(counts) + closed + `<div class="tg-wrap"><div id="tg-raid" style="margin-top:28px" hidden></div></div>` + coopHtml(ser, inbox) + versusHtml(mi) + howHtml() + endHtml();
        HKUI.refreshIcons(root);
        if (window.HKRaid) HKRaid.renderWidget(document.getElementById("tg-raid")).catch(() => null);
        root.addEventListener("click", (e) => {
          const share = e.target.closest("[data-share]");
          if (share) { copyLink(); return; }
          const a = e.target.closest('a[href^="#tg-"]');
          if (!a) return;
          e.preventDefault();
          document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        });
        let jump = null;
        try { jump = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (_) { jump = null; }
        if (jump) jump.scrollIntoView(); // /together#tg-versus 처럼 칸 주소로 들어오면 그 칸으로
      },
    });
  </script>
</body>
</html>
