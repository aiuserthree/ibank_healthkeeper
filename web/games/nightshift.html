<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/_shared/no-zoom.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    /* 심야 편의점 전용 */
    .gm-shell { margin: 0 auto; max-width: 100%; user-select: none; -webkit-user-select: none; }
    .gm-hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 16px 16px 0 0; background: linear-gradient(135deg, #0b0f1a, #243049); color: #e2e8f0; }
    .gm-hud__item { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .gm-hud__item small { font-size: 11px; opacity: .7; font-weight: 600; }
    .gm-hud__item b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .gm-hud__mid { align-items: center; }
    .gm-hud__right { align-items: flex-end; }
    .gm-lives { display: inline-flex; gap: 3px; min-height: 18px; align-items: center; }
    .gm-lives i { width: 12px; height: 12px; border-radius: 50%; background: #facc15; box-shadow: 0 0 6px rgba(250, 204, 21, .6); }
    .gm-screen { position: relative; border-radius: 0 0 16px 16px; overflow: hidden; background: #05060c; }
    /* 꿀알바 시리즈 — 그림은 저해상도로 그려 크게 키운 픽셀풍, 글자만 위의 선명한 층에 */
    .gm-canvas { display: block; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
    .gm-ui { position: absolute; inset: 0; pointer-events: none; }
    .gm-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(5, 6, 12, .72); overflow-y: auto; }
    .gm-overlay[hidden] { display: none; }
    .gm-card { width: 100%; max-width: 320px; box-sizing: border-box; padding: 18px 16px 16px; border-radius: 16px; background: rgba(255,255,255,.97); color: var(--color-midnight-navy, #0f172a); text-align: center; }
    .gm-card h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
    .gm-card p { word-break: keep-all; margin: 0 0 10px; font-size: 13.5px; line-height: 1.55; color: var(--text-secondary, #475569); }
    .gm-card .gm-big { font-size: 34px; font-weight: 800; margin: 2px 0 8px; color: #243049; }
    .gm-keys { font-size: 12px; color: var(--text-muted, #64748b); margin: 0 0 14px; line-height: 1.6; word-break: keep-all; }
    .gm-keys kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border-radius: 5px; border: 1px solid #cbd5e1; background: #f8fafc; font: 600 11px/1.5 inherit; }
    .gm-go { width: 100%; border: 0; padding: 12px; border-radius: 12px; font-size: 15.5px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #0b0f1a, #3b4a6b); }
    .gm-note { padding: 7px 4px 0; font-size: 12px; color: var(--text-muted, #64748b); text-align: center; word-break: keep-all; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    HKPlay.mountGame({
      key: "nightshift",
      setup(stage, ctx) {
        const COLS = 15, ROWS = 23, CELL = 24;
        const W = COLS * CELL, H = ROWS * CELL;
        const HOUR_SEC = 40, HOURS = 6; // 게임 안의 1시간 = 40초 · 밤 12시부터 아침 6시까지 4분
        const LIGHT_RANGE = 170, LIGHT_HALF = 0.52, NEAR_LIGHT = 44;
        const SPRAY_RANGE = 125, SPRAY_EVERY = 0.3; // 손전등에 잡힌 가까운 벌레에게 살충제가 저절로 뿌려진다
        const BUG_HP = { roach: 1, rat: 3, spider: 4 }; // 살충제를 몇 번 맞아야 쓰러지는지
        const SHADOW_HITS = 3; // 그림자 손님은 빛을 세 번 비춰야 사라진다
        const BOSS_HP = 100, BOSS_BURN = 12, BOSS_PTS = 3000, BOSS_R = 24; // 냉동고의 그것 — 8초 남짓 비추면 쓰러진다
        const MAX_ENEMIES = 42;
        // 바닥에 나타나는 아이템 — 16초 안에 주워야 한다
        const ITEMS = {
          bat: { ch: "전", color: "#facc15", fg: "#422006", label: "건전지 · 빛이 강해져요!" },
          coffee: { ch: "커", color: "#92400e", fg: "#fff", label: "캔커피 · 빨라져요!" },
          lunch: { ch: "밥", color: "#22c55e", fg: "#fff", label: "도시락 · 체력 +1" },
          fuse: { ch: "퓨", color: "#38bdf8", fg: "#082f49", label: "퓨즈 · 두꺼비집 수리" },
          bomb: { ch: "폭", color: "#ef4444", fg: "#fff", label: "살충 폭탄 · 주변 소독!" },
        };
        const BAT_SEC = 9, FAST_SEC = 7, BOMB_R = 130, MAX_LIVES = 4;
        const LINES = [
          "새벽 1시 · 천장에서 뭔가 내려와요",
          "새벽 2시 · 문은 잠겼는데… 손님이 있어요",
          "새벽 3시 · 쥐들이 몰려와요",
          "새벽 4시 · 냉장고 문이 혼자 열렸어요",
          "새벽 5시 · 냉동고에서 뭔가 나와요!",
        ];

        stage.innerHTML = `
          <div class="gm-shell">
            <div class="gm-hud">
              <div class="gm-hud__item"><small>점수</small><b data-score>0</b></div>
              <div class="gm-hud__item gm-hud__mid"><small>시각</small><b data-clock>12:00</b></div>
              <div class="gm-hud__item gm-hud__right"><small>체력</small><span class="gm-lives" data-lives></span></div>
            </div>
            <div class="gm-screen">
              <canvas class="gm-canvas" aria-label="심야 편의점 게임 화면"></canvas>
              <canvas class="gm-ui" aria-hidden="true"></canvas>
              <div class="gm-overlay" data-overlay></div>
            </div>
            <div class="gm-note">방향키·WASD 또는 왼쪽 버튼을 누른 채 끌어 이동 · 마우스로 손전등 · Esc 일시정지 · 모바일은 왼쪽 이동, 오른쪽 손전등</div>
          </div>`;
        const shell = stage.querySelector(".gm-shell");
        const canvas = stage.querySelector(".gm-canvas");
        const g = canvas.getContext("2d");
        const uiCanvas = stage.querySelector(".gm-ui");
        const u = uiCanvas.getContext("2d");
        const overlay = stage.querySelector("[data-overlay]");
        const elScore = stage.querySelector("[data-score]");
        const elClock = stage.querySelector("[data-clock]");
        const elLives = stage.querySelector("[data-lives]");
        // 어둠은 더 낮은 해상도로 따로 그려 얹는다 — 빛 가장자리가 계단처럼 보이고, 계산도 적다
        const dark = document.createElement("canvas");
        dark.width = W / 2; dark.height = H / 2;
        const dg = dark.getContext("2d");

        // ---------- 가게 지도 (. 바닥 · # 진열대 · F 냉장고 · C 계산대) ----------
        const MAP = [
          "FFFFFFFFFFFFFFF",
          "...............",
          "...............",
          ".##..###..##...",
          ".##..###..##...",
          ".##..###..##...",
          ".##..###..##...",
          ".##..###..##...",
          "...............",
          "...............",
          "...............",
          ".##..###..##...",
          ".##..###..##...",
          ".##..###..##...",
          ".##..###..##...",
          ".##..###..##...",
          "...............",
          "...............",
          "...............",
          "....CCCCCCC....",
          "....CCCCCCC....",
          "...............",
          "...............",
        ];
        const wall = (c, r) => c < 0 || r < 0 || c >= COLS || r >= ROWS || MAP[r][c] !== ".";
        const PANEL_C = 7, PANEL_R = 18; // 두꺼비집은 계산대 앞 칸에 있다
        const PANEL = { x: (PANEL_C + 0.5) * CELL, y: (PANEL_R + 0.9) * CELL };
        const HOLES = [[0, 1], [14, 1], [0, 9], [14, 9], [0, 21], [14, 21], [14, 17], [0, 17]]; // 벌레가 기어 나오는 틈

        // 칸마다 목표까지 걸음 수 — 쥐·바퀴가 진열대를 돌아서 온다
        function flow(tc, tr) {
          const dist = new Int16Array(COLS * ROWS).fill(-1);
          const q = [tr * COLS + tc];
          dist[q[0]] = 0;
          for (let i = 0; i < q.length; i++) {
            const n = q[i], c = n % COLS, r = (n - c) / COLS;
            for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const nc = c + dc, nr = r + dr;
              if (wall(nc, nr)) continue;
              const k = nr * COLS + nc;
              if (dist[k] < 0) { dist[k] = dist[n] + 1; q.push(k); }
            }
          }
          return dist;
        }
        const panelFlow = flow(PANEL_C, PANEL_R);
        function stepDir(field, x, y) {
          const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
          let best = null, bd = 1e9;
          for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nc = c + dc, nr = r + dr;
            if (wall(nc, nr)) continue;
            const d = field[nr * COLS + nc];
            if (d >= 0 && d < bd) { bd = d; best = [nc, nr]; }
          }
          if (!best) return null;
          return [(best[0] + 0.5) * CELL - x, (best[1] + 0.5) * CELL - y];
        }

        // ---------- 판 ----------
        let state = "ready", S = null, raf = 0, last = 0;
        const keys = { left: false, right: false, up: false, down: false };
        const aimAt = { x: W / 2, y: 0 };
        const stick = { move: null, aim: null };
        let dragging = false; // PC 왼쪽 버튼을 누르고 끄는 중
        function newGame() {
          S = {
            t: 0, score: 0, lives: 3, kills: 0, x: (PANEL_C + 0.5) * CELL, y: 17.5 * CELL, a: -Math.PI / 2, inv: 0, step: 0,
            panel: 100, blackout: 0, flicker: 0, flickCd: 3, fireCd: 0, roachCd: 1.5, ratCd: 26, spiderCd: HOUR_SEC, shadowCd: HOUR_SEC * 2, slow: 0, dim: 0, bat: 0, fast: 0, itemCd: 12, items: [], boss: null, bossDown: false, rings: [], hour: 0, line: null, field: null, fieldCd: 0,
            en: [], webs: [], puffs: [], texts: [],
          };
          keys.left = keys.right = keys.up = keys.down = false;
          stick.move = stick.aim = null; dragging = false;
          hud();
        }
        function hud() {
          if (!S) return;
          elScore.textContent = S.score.toLocaleString("ko-KR");
          const m = S.t / HOUR_SEC, h = Math.min(HOURS, Math.floor(m)), mm = Math.floor((m - h) * 6) * 10;
          elClock.textContent = `${h === 0 ? 12 : h}:${String(h >= HOURS ? 0 : mm).padStart(2, "0")}`;
          if (elLives.childElementCount !== Math.max(0, S.lives)) elLives.innerHTML = "<i></i>".repeat(Math.max(0, S.lives));
        }
        function say(text, t = 2.6) { S.line = { text, t }; }

        function spawn(type, hole) {
          if (S.en.length >= MAX_ENEMIES) return;
          const [c, r] = hole || HOLES[Math.floor(Math.random() * HOLES.length)];
          const T = { rat: { sp: 88, r: 9, pts: 40 }, roach: { sp: 56 + Math.random() * 16, r: 6, pts: 10 } }[type];
          S.en.push({ type, ...T, x: (c + 0.5) * CELL, y: (r + 0.5) * CELL, ...fresh(), toPanel: Math.random() < (type === "rat" ? 0.3 : 0.55) });
        }
        const fresh = () => ({ a: 0, walk: Math.random() * 6, lit: false, flee: 0, fleeCd: 0, sprayed: 0, hurt: 0, wob: Math.random() * 6, toPanel: false });
        // 내 눈앞이 아닌 빈 바닥 칸 하나
        function farCell(min) {
          for (let i = 0; i < 60; i++) {
            const c = Math.floor(Math.random() * COLS), r = 1 + Math.floor(Math.random() * (ROWS - 1));
            if (wall(c, r)) continue;
            const x = (c + 0.5) * CELL, y = (r + 0.5) * CELL;
            if (Math.hypot(x - S.x, y - S.y) >= min) return { x, y };
          }
          return { x: CELL / 2, y: 1.5 * CELL };
        }
        // 거미 — 그림자로 먼저 알리고 천장에서 내려와, 거미줄을 쏴 발을 묶는다
        function spawnSpider() {
          if (S.en.filter((e) => e.type === "spider").length >= 4) return;
          S.en.push({ type: "spider", sp: 40, r: 9, pts: 80, ...farCell(110), ...fresh(), drop: 1.1, webCd: 1.6 });
        }
        // 그림자 손님 — 벽을 지나 천천히 다가온다. 빛을 비추면 사라져 다른 곳에 나타난다
        function spawnShadow() {
          if (S.en.filter((e) => e.type === "shadow").length >= 2) return;
          S.en.push({ type: "shadow", sp: 50, r: 9, pts: 150, ...farCell(170), ...fresh(), hits: 0, safe: 0 });
          ctx.sfx("ghost");
        }
        // 냉동고의 그것 — 새벽 5시에 냉동고 문을 열고 나와, 벽을 지나 천천히 쫓아온다
        function spawnBoss() {
          S.boss = { x: W / 2, y: 1.5 * CELL, hp: BOSS_HP, a: 0, t: 0, ringCd: 3, dimCd: 9, callCd: 6, charge: 0, hurt: 0 };
          ctx.sfx("growl");
        }
        function updateBoss(dt) {
          const B = S.boss;
          B.t += dt;
          if (B.hurt > 0) B.hurt -= dt;
          const d = Math.hypot(S.x - B.x, S.y - B.y);
          B.a = Math.atan2(S.y - B.y, S.x - B.x);
          let da = B.a + Math.PI - S.a;
          da = Math.atan2(Math.sin(da), Math.cos(da));
          const hit = d - BOSS_R < range() && Math.abs(da) < beamHalf() + Math.atan2(BOSS_R, d || 1);
          B.stun = Math.max(0, (B.stun || 0) - dt); // 내게 닿은 뒤에는 잠깐 멈춰 도망칠 틈을 준다
          const sp = B.stun > 0 ? 0 : hit ? 10 : 24;
          B.x += Math.cos(B.a) * sp * dt; B.y += Math.sin(B.a) * sp * dt;
          if (hit) {
            B.hp -= BOSS_BURN * dt; B.hurt = 0.05;
            if (B.hp <= 0) {
              S.score += BOSS_PTS; S.kills++; S.bossDown = true;
              for (let i = 0; i < 4; i++) burst(B.x + (Math.random() - 0.5) * 40, B.y + (Math.random() - 0.5) * 40, "#bae6fd", 14);
              S.en.forEach((e) => { e.dead = true; burst(e.x, e.y, "#94a3b8", 4); });
              S.boss = null; S.rings = []; S.webs = [];
              say(`냉동고의 그것을 물리쳤어요! +${BOSS_PTS.toLocaleString("ko-KR")}`, 3);
              ctx.sfx("win");
              return;
            }
          }
          // 찬 기운 고리 — 잠깐 움츠렸다 터지고, 닿으면 발이 묶인다
          B.ringCd -= dt;
          if (B.ringCd <= 0.7 && !B.charge) B.charge = 0.7;
          if (B.charge > 0) {
            B.charge -= dt;
            if (B.charge <= 0) { B.charge = 0; B.ringCd = 5; S.rings.push({ x: B.x, y: B.y, r: BOSS_R, hit: false }); ctx.sfx("whoosh"); }
          }
          // 손전등이 잠깐 약해진다
          B.dimCd -= dt;
          if (B.dimCd <= 0) { B.dimCd = 10; S.dim = 1.8; say("손전등이 흐려져요…", 1.2); ctx.sfx("buzz"); }
          // 바퀴벌레를 부른다
          B.callCd -= dt;
          if (B.callCd <= 0) {
            B.callCd = 7;
            const c = Math.min(COLS - 1, Math.max(0, Math.floor(B.x / CELL))), r = Math.max(1, Math.floor(B.y / CELL));
            if (!wall(c, r)) for (let i = 0; i < 3; i++) spawn("roach", [c, r]);
          }
          if (d < BOSS_R + 8 && S.inv <= 0) {
            S.lives--; S.inv = 1.8; B.stun = 2;
            ctx.sfx("hurt");
            burst(S.x, S.y, "#bae6fd", 12);
            hud();
            if (S.lives <= 0) finish(false);
          }
        }
        // 아이템은 내 바로 옆 칸에 — 두꺼비집을 지키다 멀리 주우러 가면 위험하다
        function nearCell() {
          const list = [];
          for (let r = 1; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
            if (wall(c, r)) continue;
            const x = (c + 0.5) * CELL, y = (r + 0.5) * CELL, d = Math.hypot(x - S.x, y - S.y);
            if (d >= 28 && d <= 62 && !S.items.some((it) => Math.hypot(it.x - x, it.y - y) < CELL)) list.push({ x, y });
          }
          return list.length ? list[Math.floor(Math.random() * list.length)] : farCell(30);
        }
        function pickKind() {
          const list = ["bat", "bat", "coffee", "coffee", "bomb"];
          if (S.lives < 3) list.push("lunch", "lunch");
          if (S.panel < 70) list.push("fuse", "fuse", "fuse");
          return list[Math.floor(Math.random() * list.length)];
        }
        function updateItems(dt) {
          S.itemCd -= dt;
          if (S.itemCd <= 0) {
            S.itemCd = 11 + Math.random() * 6;
            if (S.items.length < 3) S.items.push({ ...nearCell(), kind: pickKind(), life: 16 });
          }
          for (const it of S.items) {
            it.life -= dt;
            if (Math.hypot(it.x - S.x, it.y - S.y) < 19) { it.life = 0; takeItem(it); }
          }
          S.items = S.items.filter((it) => it.life > 0);
        }
        function takeItem(it) {
          ctx.sfx("powerup");
          S.score += 50;
          S.texts.push({ x: S.x, y: S.y - 20, text: ITEMS[it.kind].label, life: 1.2 });
          if (it.kind === "bat") S.bat = BAT_SEC;
          else if (it.kind === "coffee") S.fast = FAST_SEC;
          else if (it.kind === "lunch") S.lives = Math.min(MAX_LIVES, S.lives + 1);
          else if (it.kind === "fuse") { S.panel = Math.min(100, S.panel + 45); S.blackout = 0; }
          else {
            for (const e of S.en) if (e.type !== "shadow" && !(e.drop > 0) && Math.hypot(e.x - S.x, e.y - S.y) < BOMB_R) kill(e);
            for (let i = 0; i < 24; i++) { const a = (i / 24) * 6.28; S.puffs.push({ x: S.x, y: S.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 0.45, color: "#a5f3fc" }); }
            if (S.boss) { S.boss.hp -= 15; S.boss.hurt = 0.15; }
            ctx.sfx("explode");
          }
          hud();
        }
        function moveBody(o, dx, dy, r) {
          const nx = o.x + dx, ny = o.y + dy;
          const hit = (x, y) => wall(Math.floor((x - r) / CELL), Math.floor((y - r) / CELL)) || wall(Math.floor((x + r) / CELL), Math.floor((y - r) / CELL)) || wall(Math.floor((x - r) / CELL), Math.floor((y + r) / CELL)) || wall(Math.floor((x + r) / CELL), Math.floor((y + r) / CELL));
          if (!hit(nx, o.y)) o.x = nx;
          if (!hit(o.x, ny)) o.y = ny;
        }
        function clear(x0, y0, x1, y1) {
          const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 8);
          for (let i = 1; i < n; i++) {
            const x = x0 + ((x1 - x0) * i) / n, y = y0 + ((y1 - y0) * i) / n;
            if (wall(Math.floor(x / CELL), Math.floor(y / CELL))) return false;
          }
          return true;
        }
        function range() { return (S.blackout > 0 ? 95 : S.dim > 0 ? 105 : LIGHT_RANGE) * (S.bat > 0 ? 1.3 : 1); }
        function beamHalf() { return LIGHT_HALF + (S.bat > 0 ? 0.16 : 0); }
        // 손전등 빛 안인지 — 몸 주변은 보이기만 할 뿐, 빛을 비춰야 멈칫하고 살충제가 나간다
        function inBeam(e) {
          const d = Math.hypot(e.x - S.x, e.y - S.y);
          if (d > range()) return false;
          let da = Math.atan2(e.y - S.y, e.x - S.x) - S.a;
          da = Math.atan2(Math.sin(da), Math.cos(da));

            dg.globalCompositeOperation = "destination-out";
            const near = dg.createRadialGradient(S.x, S.y, 8, S.x, S.y, NEAR_LIGHT + 22);
            near.addColorStop(0, "rgba(0,0,0,.95)"); near.addColorStop(1, "rgba(0,0,0,0)");
            dg.fillStyle = near; dg.fillRect(0, 0, W, H);
            const beam = dg.createRadialGradient(S.x, S.y, 10, S.x, S.y, r);
            beam.addColorStop(0, "rgba(0,0,0,1)"); beam.addColorStop(0.75, "rgba(0,0,0,.92)"); beam.addColorStop(1, "rgba(0,0,0,0)");
            dg.fillStyle = beam;
            dg.beginPath(); dg.moveTo(S.x, S.y); dg.arc(S.x, S.y, r, S.a - beamHalf(), S.a + beamHalf()); dg.closePath(); dg.fill();
            // 두꺼비집 위치는 어둠 속에서도 어렴풋이
            if (S.blackout <= 0) {
              const p = dg.createRadialGradient(PANEL.x, PANEL.y, 2, PANEL.x, PANEL.y, 34);
              p.addColorStop(0, "rgba(0,0,0,.6)"); p.addColorStop(1, "rgba(0,0,0,0)");
              dg.fillStyle = p; dg.fillRect(PANEL.x - 34, PANEL.y - 34, 68, 68);
            }
            dg.restore();
          }
          g.drawImage(dark, 0, 0, W, H);
        }
        function draw() {
          g.setTransform(scale, 0, 0, scale, 0, 0);
          g.imageSmoothingEnabled = false;
          u.setTransform(uiScale, 0, 0, uiScale, 0, 0);
          u.clearRect(0, 0, W, H);
          drawStore();
          if (S) {
            for (const e of S.en) ({ rat: drawRat, roach: drawRoach, spider: drawSpider, shadow: drawShadow })[e.type](e);
            if (S.boss) drawBoss();
            g.fillStyle = "#e2e8f0";
            for (const w of S.webs) { g.beginPath(); g.arc(w.x, w.y, 3, 0, 6.3); g.fill(); }
            for (const p of S.puffs) { g.globalAlpha = Math.min(1, p.life * 3); g.fillStyle = p.color; g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
            g.globalAlpha = 1;
            drawPlayer();
          }
          drawDark();
          if (!S) return;
          drawItems(); // 아이템은 어둠 속에서도 보인다
          // 켜져 있는 아이템의 남은 시간
          let barY = H - 30;
          for (const [v, full, color, name] of [[S.bat, BAT_SEC, "#facc15", "건전지"], [S.fast, FAST_SEC, "#d97706", "캔커피"]]) {
            if (!(v > 0)) continue;
            g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(10, barY, 56, 5);
            g.fillStyle = color; g.fillRect(10, barY, 56 * Math.min(1, v / full), 5);
            u.font = "700 10px Pretendard, system-ui, sans-serif"; u.textAlign = "left"; u.textBaseline = "middle"; u.fillStyle = "#f1f5f9";
            u.fillText(name, 72, barY + 3);
            barY -= 13;
          }
          // 찬 기운 고리는 어둠 위로 보인다
          for (const q of S.rings) {
            g.strokeStyle = `rgba(186, 230, 253, ${Math.max(0.1, 0.85 - q.r / 280)})`; g.lineWidth = 4;
            g.beginPath(); g.arc(q.x, q.y, q.r, 0, 6.3); g.stroke();
          }
          if (S.boss) {
            const B = S.boss;
            // 어둠 속에서도 보이는 하나뿐인 눈
            g.fillStyle = "#f8fafc"; g.beginPath(); g.ellipse(B.x + Math.cos(B.a) * 8, B.y + Math.sin(B.a) * 8, 7, 7, 0, 0, 6.3); g.fill();
            g.fillStyle = "#dc2626"; g.beginPath(); g.arc(B.x + Math.cos(B.a) * 11, B.y + Math.sin(B.a) * 11, 3.2, 0, 6.3); g.fill();
            g.fillStyle = "rgba(2, 6, 23, .85)"; g.fillRect(40, 6, W - 80, 24);
            g.fillStyle = "#38bdf8"; g.fillRect(44, 21, (W - 88) * Math.max(0, B.hp / BOSS_HP), 6);
            u.font = "800 11px Pretendard, system-ui, sans-serif"; u.textAlign = "center"; u.textBaseline = "middle"; u.fillStyle = "#e0f2fe";
            u.fillText("냉동고의 그것", W / 2, 13);
          }
          // 어둠 속의 눈 — 빛 밖에 있는 쥐와 벌레가 빨갛게 보인다
          for (const e of S.en) {
            if (e.drop > 0) continue;
            if (e.type === "shadow") {
              // 그림자 손님은 어둠 속에서 하얀 눈만 보인다
              g.fillStyle = S.t < e.safe ? "rgba(241, 245, 249, .3)" : "rgba(241, 245, 249, .95)";
              g.beginPath(); g.arc(e.x - 2.2, e.y - 12, 1.2, 0, 6.3); g.arc(e.x + 2.2, e.y - 12, 1.2, 0, 6.3); g.fill();
              continue;
            }
            if (e.lit) continue;
            const blink = Math.sin(e.walk * 0.15 + e.wob) > -0.6;
            if (!blink) continue;
            g.fillStyle = e.type === "roach" ? "rgba(248, 113, 113, .4)" : "rgba(248, 113, 113, .9)";
            const s = e.type === "roach" ? 0.9 : 1.5, ox = Math.cos(e.a) * e.r, oy = Math.sin(e.a) * e.r, px = -Math.sin(e.a) * 2, py = Math.cos(e.a) * 2;
            g.beginPath(); g.arc(e.x + ox + px, e.y + oy + py, s, 0, 6.3); g.arc(e.x + ox - px, e.y + oy - py, s, 0, 6.3); g.fill();
          }
          u.font = "800 12px Pretendard, system-ui, sans-serif"; u.textAlign = "center"; u.textBaseline = "middle";
          for (const t of S.texts) { u.globalAlpha = Math.min(1, t.life * 3); u.fillStyle = "#fde68a"; u.fillText(t.text, t.x, t.y); }
          u.globalAlpha = 1;
          // 두꺼비집 체력
          g.fillStyle = "rgba(15, 23, 42, .8)"; g.fillRect(W / 2 - 62, H - 17, 124, 11);
          g.fillStyle = S.panel > 35 ? "#facc15" : "#ef4444"; g.fillRect(W / 2 - 60, H - 15, 120 * (S.panel / 100), 7);
          if (S.line) {
            u.globalAlpha = Math.min(1, S.line.t * 2);
            u.font = "800 14px Pretendard, system-ui, sans-serif";
            const tw = u.measureText(S.line.text).width + 26;
            u.fillStyle = "rgba(2, 6, 23, .82)"; u.fillRect(W / 2 - tw / 2, 42, tw, 28);
            u.fillStyle = "#f1f5f9"; u.fillText(S.line.text, W / 2, 57);
            u.globalAlpha = 1;
          }
          if (stick.move) drawStick(stick.move);
          if (stick.aim) drawStick(stick.aim);
        }
        function drawStick(s) {
          g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 2;
          g.beginPath(); g.arc(s.x0, s.y0, 30, 0, 6.3); g.stroke();
          g.fillStyle = "rgba(255,255,255,.35)";
          g.beginPath(); g.arc(s.x, s.y, 13, 0, 6.3); g.fill();
        }

        // ---------- 흐름 ----------
        function frame(now) {
          raf = 0;
          if (state !== "play") return;
          const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
          last = now;
          try { update(dt); if (state === "play") draw(); } catch (err) { console.error(err); }
          if (state === "play") raf = requestAnimationFrame(frame);
        }
        function run() {
          if (raf) cancelAnimationFrame(raf);
          last = performance.now();
          raf = requestAnimationFrame(frame);
        }
        function showOverlay(html) {
          overlay.innerHTML = html;
          overlay.hidden = false;
          const b = overlay.querySelector("button");
          if (b) b.focus({ preventScroll: true });
        }
        function showReady() {
          state = "ready";
          S = null;
          elScore.textContent = "0"; elClock.textContent = "12:00";
          elLives.innerHTML = "<i></i><i></i><i></i>";
          draw();
          showOverlay(`<div class="gm-card">
            <h2>심야 편의점</h2>
            <p>혼자 남은 새벽 근무. 손전등으로 비추면 살충제를 뿌려요.<br>거미줄을 피하고, 그림자 손님은 <b>세 번</b> 비춰야 사라져요.<br>바닥의 아이템은 밟으면 바로 써요.<br><b>아침 6시</b>까지 체력과 <b>두꺼비집</b>을 지켜요.</p>
            <div class="gm-keys">PC 방향키 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 마우스 왼쪽 버튼을 누른 채 끌어 이동 · 마우스로 손전등 · <kbd>Esc</kbd> 일시정지<br>모바일은 왼쪽을 끌어 이동, 오른쪽을 끌어 손전등</div>
            <button type="button" class="gm-go" data-act="start">시작</button>
          </div>`);
        }
        function start() {
          overlay.hidden = true;
          overlay.innerHTML = "";
          newGame();
          state = "play";
          say("밤 12시 · 근무 시작", 2);
          window.HKSound.ambient(true);
          run();
        }
        function pause() {
          if (state !== "play") return;
          state = "paused";
          window.HKSound.ambient(false);
          keys.left = keys.right = keys.up = keys.down = false;
          stick.move = stick.aim = null; dragging = false;
          showOverlay(`<div class="gm-card"><h2>잠깐 쉬는 중</h2><p>지금 시각 <b>${elClock.textContent}</b> · 점수 <b>${S.score.toLocaleString("ko-KR")}</b>점</p><button type="button" class="gm-go" data-act="resume">계속하기</button></div>`);
        }
        function resume() {
          if (state !== "paused" || document.querySelector(".hk-dialog__overlay")) return; // 나가기 확인 창이 떠 있으면 뒤에서 판이 다시 돌지 않게(스페이스가 「계속하기」를 눌러도)
          overlay.hidden = true;
          state = "play";
          window.HKSound.ambient(true);
          run();
        }
        function finish(won) {
          state = "over";
          window.HKSound.ambient(false);
          if (won) S.score += 2000 + S.lives * 500 + Math.round(S.panel) * 5; // 보스 점수는 쓰러뜨릴 때 이미 더했다
          hud();
          draw();
          ctx.sfx(won ? "win" : "lose");
          const score = S.score;
          showOverlay(`<div class="gm-card"><h2>${won ? "아침이 밝았어요" : "근무 종료"}</h2><p>${won ? S.bossDown ? "냉동고의 그것까지 물리치고 교대했어요!" : "무사히 교대했어요!" : `${elClock.textContent}까지 버텼어요`} · 벌레 ${S.kills}마리</p><div class="gm-big">${score.toLocaleString("ko-KR")}점</div><button type="button" class="gm-go" data-act="start">다시 하기</button></div>`);
          ctx.submit(score);
        }
        overlay.addEventListener("click", (e) => {
          const b = e.target.closest("[data-act]");
          if (!b) return;
          if (b.dataset.act === "start") start();
          else if (b.dataset.act === "resume") resume();
        });

        // ---------- 입력 ----------
        const dialogOpen = () => !!document.querySelector(".hk-dialog__overlay");
        window.addEventListener("keydown", (e) => {
          if (dialogOpen()) return;
          const c = e.code, game = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(c);
          if (state === "play") {
            if (game) e.preventDefault();
            if (c === "ArrowLeft" || c === "KeyA") keys.left = true;
            if (c === "ArrowRight" || c === "KeyD") keys.right = true;
            if (c === "ArrowUp" || c === "KeyW") keys.up = true;
            if (c === "ArrowDown" || c === "KeyS") keys.down = true;
            if (c === "KeyP" || c === "Escape") pause();
          } else if (state === "paused") {
            if (c === "Space" || c === "Enter" || c === "KeyP") { e.preventDefault(); resume(); }
          } else if (state === "ready") {
            if (c === "Space" || c === "Enter") { e.preventDefault(); start(); }
          }
        });
        window.addEventListener("keyup", (e) => {
          if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
          if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
          if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
          if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
        });
        window.addEventListener("blur", () => { keys.left = keys.right = keys.up = keys.down = false; dragging = false; });
        const toWorld = (e) => { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H }; };
        // 휴대폰 — 왼쪽 절반은 이동, 오른쪽 절반은 손전등. 손가락마다 따로 따라간다
        const REGRIP_MS = 700;
        let lastUp = { side: "", t: -1e9 };
        // 마우스는 게임 판 밖으로 나가도 손전등 방향을 계속 따라간다
        window.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          const p = toWorld(e);
          aimAt.x = p.x; aimAt.y = p.y;
        });
        // PC — 왼쪽 버튼을 누른 채 끌면 그쪽으로 걷는다. 게임 판 밖에서 놓아도 멈춘다
        canvas.addEventListener("pointerdown", (e) => {
          if (state !== "play" || e.pointerType !== "mouse" || e.button !== 0) return;
          e.preventDefault();
          const p = toWorld(e);
          aimAt.x = p.x; aimAt.y = p.y;
          dragging = true;
        });
        window.addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") dragging = false; });
        window.addEventListener("pointercancel", (e) => { if (e.pointerType === "mouse") dragging = false; });
        canvas.addEventListener("pointermove", (e) => {
          if (e.pointerType === "mouse") return;
          const p = toWorld(e);
          for (const s of [stick.move, stick.aim]) {
            if (!s || s.id !== e.pointerId) continue;
            const dx = p.x - s.x0, dy = p.y - s.y0, d = Math.hypot(dx, dy);
            const k = Math.min(1, 30 / (d || 1));
            s.x = s.x0 + dx * k; s.y = s.y0 + dy * k;
            s.dx = dx / 30; s.dy = dy / 30;
            if (d > 4) s.a = Math.atan2(dy, dx);
          }
        });
        canvas.addEventListener("pointerdown", (e) => {
          if (state !== "play" || e.pointerType === "mouse") return;
          e.preventDefault();
          const p = toWorld(e);
          // 손가락 하나가 이미 대고 있으면 남은 역할을 맡고, 방금 뗀 손가락이 다시 대면 하던 일을 잇는다
          // (손전등을 돌리다 잠깐 떼고 가운데 쪽을 다시 눌러도 이동으로 바뀌지 않게). 그 밖에는 화면 왼쪽 이동, 오른쪽 손전등
          let side = p.x < W / 2 ? "move" : "aim";
          if (stick.move && stick.aim) return;
          if (stick.move) side = "aim";
          else if (stick.aim) side = "move";
          else if (performance.now() - lastUp.t < REGRIP_MS) side = lastUp.side;
          stick[side] = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, dx: 0, dy: 0, a: S.a };
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        });
        const endStick = (e) => {
          for (const k of ["move", "aim"]) if (stick[k] && stick[k].id === e.pointerId) { stick[k] = null; lastUp = { side: k, t: performance.now() }; }
        };
        canvas.addEventListener("pointerup", endStick);
        canvas.addEventListener("pointercancel", endStick);
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

        // ---------- 시작 ----------
        ctx.onScore && ctx.onScore(() => (S ? S.score : 0));
        ctx.onRestart(start);
        ctx.onPause(pause);
        if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);
        window.addEventListener("resize", fit);
        showReady();
        fit();
      },
    });
  </script>
</body>
</html>
