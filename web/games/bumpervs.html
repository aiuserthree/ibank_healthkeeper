<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    /* 선다운 범퍼스 대전 — 3D 경주 본체(창) 위에 덮는 카드 */
    .bv-main { align-items: stretch !important; padding: 10px !important; }
    .hk-pf.is-playing .hk-pf__pause:not([hidden]) { display: inline-flex; }
    .hk-pf__tools > [hidden] { display: none !important; }
    .bv { position: relative; flex: 1; min-width: 0; min-height: 320px; border-radius: 16px; overflow: hidden; background: #1a0a2b; box-shadow: 0 10px 30px rgba(15, 23, 42, .16); }
    .bv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .bv-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fde8cf; font-size: 14px; }
    .bv-load[hidden] { display: none; }
    .bv-over { position: absolute; inset: 0; z-index: 5; display: flex; padding: 14px; overflow-y: auto; background: rgba(26, 10, 43, .46); box-sizing: border-box; }
    .bv-over[hidden] { display: none; }
    .bv-card { margin: auto; width: 100%; max-width: 560px; box-sizing: border-box; padding: 20px; border-radius: 18px; background: #fff; box-shadow: 0 18px 44px rgba(15, 23, 42, .32); color: var(--color-midnight-navy, #0b3558); }

    .bv-card.is-small { max-width: 420px; text-align: center; }
    .bv-card.is-wide { max-width: 760px; padding: 0; overflow: hidden; }
    .bv-card.is-wide .gk { padding: 18px 18px 24px; }
    .bv-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; text-align: left; }
    .bv-logo { flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #7c2d12, #fb923c); }
    .bv-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .bv-mode { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px; border-radius: 14px; border: 2px solid #e2e8f0; background: #fff; text-align: left; font: inherit; color: #0f172a; cursor: pointer; }

    /* 트랙 칸 그림(그림을 불러온 칸만 .has-art — 못 불러오면 위 모양 그대로) */
    .bv-tart { display: none; }
    .bv-grid.is-tracks button.has-art { position: relative; isolation: isolate; overflow: hidden; color: #fff; text-shadow: 0 1px 2px rgba(15, 10, 30, .9), 0 0 5px rgba(15, 10, 30, .55); }
    .bv-grid.is-tracks button.has-art .bv-tart { display: block; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .bv-tart img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
    .bv-tart::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(26, 10, 43, .74), rgba(26, 10, 43, .5)); }
    .bv-tart svg { position: absolute; right: 4px; top: 50%; width: 26%; height: 70%; transform: translateY(-50%); z-index: 1; opacity: .28; overflow: visible; }
    .bv-tart path { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .bv-tart path.o { stroke: rgba(26, 10, 43, .6); stroke-width: 3.5; }
    .bv-tart path.l { stroke: #fff2d8; stroke-width: 1.5; }

    .bv-grid.is-tracks button.has-art small { color: #fde8cf; }
    .bv-grid.is-tracks button.has-art.is-on .bv-tart::after { background: linear-gradient(90deg, rgba(26, 10, 43, .6), rgba(26, 10, 43, .22)); }
    .bv-grid.is-tracks button.has-art.is-on::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2.5px #fb923c; pointer-events: none; }

    .bv-face img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    .bv-grid.is-racers button.is-on .bv-face { box-shadow: 0 0 0 2px var(--rc); }
    .bv-rname { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.15; }
    .bv-grid.is-racers .bv-rname b { font-size: 13px; }
    .bv-grid.is-racers .bv-rname small { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .bv-dot { flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .9), 0 0 0 1px rgba(15, 23, 42, .18); }
    .bv-go { width: 100%; height: 50px; margin-top: 14px; font-size: 16px !important; }
    .bv-help { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #f8fafc; font-size: 12.5px; line-height: 1.7; color: #475569; word-break: keep-all; text-align: left; }
    .bv-help kbd, .bv-rules kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; border: 1px solid #cbd5e1; border-bottom-width: 2px; background: #fff; font: 700 11px/1 inherit; color: #0f172a; box-sizing: border-box; }
    .bv-badge { display: inline-flex; width: 56px; height: 56px; border-radius: 16px; align-items: center; justify-content: center; margin-bottom: 8px; background: #e2e8f0; color: #475569; }
    .bv-badge.is-win { background: linear-gradient(135deg, #ffd23f, #ff9f1c); color: #fff; }
    .bv-badge.is-lose { background: #ede9fe; color: #6d28d9; }
    .bv-who { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
    .bv-who div { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; padding: 10px 6px; border-radius: 12px; background: #f1f5f9; font-size: 13px; font-weight: 700; color: #475569; }
    .bv-who div span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bv-who div.is-on { background: #dcfce7; color: #15803d; }
    .bv-btnrow { display: flex; gap: 8px; margin-top: 16px; }
    .bv-btnrow .hk-btn { flex: 1; height: 46px; }
    .bv-mini { margin-top: 10px; font-size: 12px; line-height: 1.5; color: var(--text-muted); word-break: keep-all; }
    .bv-mini.is-ok { color: #15803d; font-weight: 700; }
    .bv-mini.is-bad { color: #b45309; font-weight: 700; }
    .bv-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
    .bv-stats div { padding: 10px 4px; border-radius: 12px; background: #f8fafc; }
    .bv-stats b { display: block; font-size: 17px; font-weight: 800; color: #0f172a; font-variant-numeric: tabular-nums; }
    .bv-stats small { font-size: 11.5px; color: var(--text-muted); }
    .bv-again { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #fff7ed; font-size: 13px; font-weight: 700; color: #c2410c; word-break: keep-all; }
    .bv-again[hidden] { display: none; }
    .bv-rules { max-width: 600px; text-align: left; }
    .bv-rules h3 { margin: 14px 0 4px; font-size: 15px; font-weight: 800; color: #0f172a; }
    .bv-rules ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); word-break: keep-all; }
    .bv-rules li + li { margin-top: 3px; }
    .bv-over--set { z-index: 6; }
    /* 게임 방법 — 아이템 20가지(아이콘 + 이름 + 한 줄). 접었다 펴고, 아이콘은 혼자 하기와 같은 생성 그림(못 불러오면 이모지) */
    .bv-items { margin-top: 6px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
    .bv-items summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 800; color: #0f172a; }
    .bv-items ul { list-style: none; margin: 0; padding: 4px 10px 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
    .bv-items li { display: grid; grid-template-columns: 36px 1fr; gap: 0 9px; align-items: center; align-content: center; margin: 0 !important; font-size: 12.5px; line-height: 1.4; color: #475569; word-break: keep-all; }
    .bv-items li b { font-size: 13px; font-weight: 800; color: #0f172a; }
    .bv-iic { grid-row: span 2; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #1a0a2b; font-size: 20px; line-height: 1; }
    .bv-iic span { display: none; width: 32px; height: 32px; background: url(/assets/games/sundown/item-icons-v1.webp) no-repeat; background-size: 512% 512%; }
    html.bv-icons .bv-iic span { display: block; }
    html.bv-icons .bv-iic em { display: none; }
    .bv-iic em { font-style: normal; }

      .bv-items ul { grid-template-columns: minmax(0, 1fr); }

      .bv { border-radius: 12px; }

      .bv-card { padding: 16px 14px; border-radius: 16px; }
      .bv-card h2 { font-size: 19px; }
      .bv-mode { padding: 10px 8px; }

      .bv-prow { flex-wrap: wrap; }

      .bv-row__k { padding-top: 12px; width: 40px; }

      .bv-grid.is-racers button { flex-direction: column; gap: 2px; }
      .bv-face { width: 36px; height: 36px; }

    @media (max-height: 560px) {

<body>
  <div id="app"></div>
  <script>
  (async function () {
    // 선다운 범퍼스 대전 — 컴퓨터와 연습(기록 안 함) · 동료와(실시간 1:1). 3D 경주는 혼자 하기 본체(/games/embed/sundown.html?vs=1)를 창으로 띄워 쓴다
    const esc = HKUI.escapeHtml;
    const KEY = "bumpervs";
    const TINT = "linear-gradient(135deg, #7c2d12, #fb923c)";
    // 시험용 — 한 브라우저 두 탭으로 온라인을 흉내 낸다(#rt-host · #rt-guest). 사용자에게는 보이지 않는다
    const DEV = HKLunch.isLocal() || /\.test$/.test(location.hostname) || (() => { try { return localStorage.getItem("hk-dev") === "1"; } catch (_) { return false; } })();
    const AUTO = DEV && (() => { try { return localStorage.getItem("hk-bumpervs-auto") === "1"; } catch (_) { return false; } })(); // 시험 — 차가 저절로 달린다
    const IS_TOUCH = matchMedia("(pointer: coarse)").matches;
    // 혼자 하기와 같은 레이서 · 트랙 (모양 · 이름만 — 대전에서는 성능이 모두 같다)
    const RACERS = [["bunny", "모찌", "토끼", "#ff5fa8"], ["fox", "불꽃", "여우", "#ff7a1f"], ["panda", "만두", "판다", "#2fd6a0"], ["frog", "폴짝이", "개구리", "#a5e02b"], ["penguin", "뒤뚱이", "펭귄", "#3f8cff"], ["pig", "트러플", "돼지", "#a765ff"]];
    const RID = RACERS.map((r) => r[0]);
    const okRid = (r) => RID.includes(r);
    const racerName = (r) => { const x = RACERS.find((y) => y[0] === r); return x ? `${x[2]} ${x[1]}` : ""; };
    const TRACKS = ["팝콘 퍼레이드", "솜사탕 찻잔 회오리", "네온 등불 루프", "사막 망치 협곡", "그랜드 노을 축제길", "밀림 유적 언덕길", "빗방울 물놀이장", "얼음 성 놀이공원", "별빛 우주 정거장", "바닷속 유리 터널", "장난감 공장 벨트길", "용암 화산 동굴", "구름 위 무지개길"];
    const LEVELS = [["easy", "쉬움"], ["normal", "보통"], ["hard", "어려움"]];
    const LEVEL_NAME = Object.fromEntries(LEVELS);
    const LIMIT = 300; // 경주 시간 상한(초, 3바퀴 경주는 보통 2분 남짓) — 엔진 versus_bumpervs.LIMIT_SEC 과 같다
    const PREF_KEY = "hk-bumpervs-pref";
    const pref = { mode: "cpu", level: "normal", track: 0, rid: "bunny" };
    try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch (_) { /* 처음 */ }

    // ───── 결과

      const tName = `트랙 ${r.track} · ${TRACKS[r.track - 1] || ""}`;
      const lead = P.online ? `${esc(P.rival.name)}님과의 경주 · ${esc(tName)}` : `${esc(P.rival.name)}와 연습 · ${esc(tName)}`;
      const anyFin = r.order[0] != null || r.order[1] != null;

      showOver(`<div class="bv-card is-small bv-result" role="dialog" aria-label="경주 결과">
          <span class="bv-badge ${won ? "is-win" : draw ? "" : "is-lose"}">${icon(won ? "trophy" : draw ? "handshake" : "flag", 28)}</span>

          <p>${lead}${how ? `<br><small>${how}</small>` : ""}</p>
          <div class="bv-stats">
            <div><b>${mine != null ? fmtSec(mine) : pct(r.dist && r.dist[mi])}</b><small>${mine != null ? "내 기록" : "내가 간 거리"}</small></div>
            <div><b>${theirs != null ? fmtSec(theirs) : pct(r.dist && r.dist[ri])}</b><small>${theirs != null ? "상대 기록" : "상대가 간 거리"}</small></div>
            <div><b>${timeText(r.sec)}</b><small>경주 시간</small></div>

          <div class="bv-again" id="bv-again" hidden></div>

            <button type="button" class="hk-btn hk-btn--secondary" data-act="menu">처음으로</button>

      box.textContent = `${playing.rival.name}님이 다시 도전했어요`;
      const mine = row.querySelector('[data-act="rematch"]');
      if (mine) mine.remove();
      const acc = row.querySelector('[data-act="accept"]');
      if (acc) acc.dataset.id = String(id);
      else row.insertAdjacentHTML("beforeend", `<button type="button" class="hk-btn hk-btn--primary" data-act="accept" data-id="${id}">다시 경주 수락</button>`);
    }
    // 연습 결과 · 대전 결과 모두 본체가 vs:end 로 알려 준다
    frameHandlers.add((m) => {
      if (m.type !== "vs:end" || !playing) return;
      if (!playing.online) { if (screen === "play" || screen === "pause") showResult(m.r); return; }
      if (playing.onEnd) playing.onEnd(m.r);
    });

    // ───── 동료와 — 실시간 1:1 (host 의 본체가 경주를 계산하고, guest 의 본체는 받아 그린다)
    // connect(matchId, h) 는 HKRt.connect(/_shared/rt.js) 와 같은 약속이다 — 시험용 devConnect 도 똑같이 군다
    //   h.onHello({ role, peerHere }) · h.onPeer(here) · h.onMessage(msg) · h.onClose({ final, text }) → { send(obj) → bool, close() }
    // 주고받는 말(바깥 화면끼리)
    //   guest → host: hi {rid, un, rd} · rd {on, rid} · in {a, s} · vis {h} · ping {c}
    //   host → guest: lb {ph, track, max, rids, rd} · go {e, track, rids} · s {d} · end {e, r} · vis {h} · pong {c}
    const PEER_GRACE = 20000; // 상대가 이만큼 안 돌아오면 「상대가 나갔어요」 (그동안 경주는 멈춰 있다)
    const AWAY_MAX = 20000; // 상대가 다른 탭에 가 있어도 이만큼 지나면 경주를 이어 간다
    let conn = null, sess = null;
    function closeConn() {
      if (sess) { sess.closed = true; clearTimeout(sess.graceT); clearTimeout(sess.awayT); clearInterval(sess.tick); sess = null; }
      if (conn) { try { conn.close(); } catch (_) { /* 이미 닫힘 */ } conn = null; }
    }
    function playOnline({ matchId, rival, track, connect, report, resign, check, fallbackRole }) {
      closeConn(); closeLayer();
      screen = "connect"; setPlaying(false); pauseBtn.hidden = true;
      showOver(cardHtml("wifi", "연결하는 중…", `${rival.name}님과 연결하고 있어요`, `<button type="button" class="hk-btn hk-btn--secondary" data-act="menu">그만두기</button>`));
      const S = { closed: false, graceT: 0, awayT: 0, tick: 0, role: null, peerHere: false, gotLb: false, lastHi: 0, lastPing: 0, phase: "wait",
        track: Number.isInteger(track) ? track : 0, max: 1, rids: ["bunny", "fox"], rd: [0, 0], e: 0, result: null, guestUn: 1, endSent: 0 };
      sess = S;
      const send = (o) => !S.closed && !!conn && conn.send(o);
      const names = () => (S.role === "host" ? [me.name, rival.name] : [rival.name, me.name]);
      const faces = () => (S.role === "host" ? [me.avatarUrl || null, rival.avatarUrl || null] : [rival.avatarUrl || null, me.avatarUrl || null]);
      const mi = () => (S.role === "guest" ? 1 : 0);
      const lost = async (title, sub) => {
        if (S.closed || S.phase === "end") return;
        closeConn();
        screen = "lost"; setPlaying(false);
        toFrame({ type: "vs:freeze", on: true, why: "lost" });
        showOver(cardHtml("wifi-off", title, sub || "경주를 이어 갈 수 없어요", `<button type="button" class="hk-btn hk-btn--primary" data-act="menu">처음으로</button>`));
        const d = check ? await check().catch(() => null) : null;
        if (d && d.status === "DONE" && screen === "lost") {
          const t = d.result === "win" ? "이 경주는 이겼어요" : d.result === "lose" ? "이 경주는 졌어요" : "이 경주는 비겼어요";
          showOver(cardHtml(d.result === "win" ? "trophy" : "flag", title, `${t}${d.reasonLabel ? ` · ${d.reasonLabel}` : ""}`, `<button type="button" class="hk-btn hk-btn--primary" data-act="menu">처음으로</button>`));
        }
      };
      // 경주 결과 — host 의 본체가 정한 것을 두 사람이 같이 쓴다
      const finish = (r) => {
        if (S.phase === "end" && S.result) return;
        S.phase = "end"; S.result = r;
        if (S.role === "host") { send({ t: "end", e: S.e, r }); S.endSent = Date.now(); }
        else toFrame({ type: "vs:end", r });
        playing.result = r;
        showResult(r);
      };
      playing = { mode: "online", online: true, role: null, rival, report, resign, matchId: typeof matchId === "number" ? matchId : null, onEnd: (r) => { if (S.role === "host") finish(r); } };
      // ── 준비 화면
      const myRid = () => (okRid(pref.rid) ? pref.rid : S.role === "guest" ? "fox" : "bunny");
      function paintLobby() {
        if (S.closed || S.phase !== "wait" || !S.role || !["connect", "ready"].includes(screen)) return;
        screen = "ready";
        const host = S.role === "host", i = mi();
        const who = (on, name, here, rid) => `<div class="${on ? "is-on" : ""}">${icon(on ? "check-circle-2" : here ? "circle" : "loader", 15)}${here && okRid(rid) ? `<span class="bv-dot" style="background:${RACERS.find((x) => x[0] === rid)[3]}"></span>` : ""}<span>${esc(name)} · ${on ? "준비 완료" : here ? "준비 전" : "들어오는 중…"}</span></div>`;
        const ready = !!S.rd[i];
        showOver(`<div class="bv-card" role="dialog" aria-label="경주 준비">
            <h2>경주를 준비해 주세요</h2>
            <p>${esc(rival.name)}님과 실시간 경주 · 트랙 ${S.track + 1} ${esc(TRACKS[S.track])}</p>
            <div class="bv-row"><span class="bv-row__k">트랙</span>${trackGrid("data-otrack", S.track, S.max, !host)}</div>
            <div class="bv-row"><span class="bv-row__k">레이서</span>${racerGrid("data-orid", S.rids[i])}</div>
            <div class="bv-who">${who(S.rd[i], "나", true, S.rids[i])}${who(S.rd[1 - i], rival.name, S.peerHere && (host ? S.gotHi : S.gotLb), S.rids[1 - i])}</div>
            <div class="bv-btnrow">
              <button type="button" class="hk-btn hk-btn--secondary" data-act="menu">그만두기</button>
              <button type="button" class="hk-btn hk-btn--primary" data-act="ready" data-on="${ready ? 0 : 1}">${ready ? "준비 취소" : "준비"}</button>
            </div>
            <div class="bv-mini">${host ? "트랙은 도전한 내가" : "트랙은 도전한 사람이"}, 레이서는 각자 골라요 · 모든 트랙을 고를 수 있어요 · 바꾸면 두 사람 준비가 풀려요 · 레이서는 모양만 달라요 · 두 사람 모두 준비하면 바로 출발 세기를 해요</div>
          </div>`);
      }
      // 본체를 준비 화면(출발선)으로 — 트랙 · 레이서가 바뀔 때마다
      let shownSetup = "";
      function frameWait() {
        if (S.phase !== "wait") return; // 경주 중 · 끝난 뒤에는 출발선으로 되돌리지 않는다
        const sig = `${S.track}.${S.rids}`;
        if (sig === shownSetup) return;
        shownSetup = sig;
        toFrame({ type: "vs:setup", role: S.role, track: S.track, rids: S.rids.slice(), names: names(), avatars: faces(), e: 0, mute: HKSound.isMuted() });
      }
      // host — 준비 상태 알리기
      const lbMsg = () => ({ t: "lb", ph: S.phase, track: S.track, max: S.max, rids: S.rids.slice(), rd: S.rd.slice() });
      function hostChanged() {
        if (S.role !== "host") return;
        if (S.phase === "wait") { S.max = Math.min(unlocked(), S.guestUn); if (S.track >= S.max) S.track = 0; } // 경주 중에는 트랙을 바꾸지 않는다
        send(lbMsg()); frameWait(); paintLobby(); maybeGo();
      }
      function maybeGo() {
        if (S.role !== "host" || S.phase !== "wait" || !S.rd[0] || !S.rd[1] || !S.peerHere) return;
        S.phase = "race"; S.e = 1 + Math.floor(Math.random() * 1e9); S.result = null;
        const go = { t: "go", e: S.e, track: S.track, rids: S.rids.slice() };
        toFrame({ type: "vs:setup", role: "host", track: S.track, rids: S.rids.slice(), names: names(), avatars: faces(), e: S.e, auto: AUTO, mute: HKSound.isMuted() });
        toFrame({ type: "vs:go" });
        shownSetup = "";
        send(go);
        startRace();
      }
      function startRace() {
        hideOver(); closeLayer();
        screen = "play"; setPlaying(true);
        playing.track = S.track;
        focusFrame();
      }
      // guest — 경주 시작(처음이든, 다시 들어와 중간에 붙든)
      function guestGo(m) {
        if (!Number.isInteger(m.e) || m.e === S.e) return;
        S.e = m.e; S.phase = "race"; S.result = null;
        S.track = clamp(m.track | 0, 0, TRACKS.length - 1);
        if (Array.isArray(m.rids)) S.rids = m.rids.map((r, i) => (okRid(r) ? r : i ? "fox" : "bunny"));
        toFrame({ type: "vs:setup", role: "guest", track: S.track, rids: S.rids.slice(), names: names(), avatars: faces(), e: S.e, auto: AUTO, mute: HKSound.isMuted() });
        toFrame({ type: "vs:go" });
        shownSetup = "";
        startRace();
      }
      // 경주 중 멈춤(host 본체) — 상대 연결이 끊기거나 다른 탭에 갔을 때 · 내가 다른 탭에 갔을 때
      const freeze = (on, why) => toFrame({ type: "vs:freeze", on, why, hold: 3 });
      const note = (text) => toFrame({ type: "vs:note", text: text || null });
      function peerAway() {
        clearTimeout(S.graceT);
        if (S.phase === "race") { if (S.role === "host") { freeze(true, "link"); toFrame({ type: "vs:in", a: 0, s: 0 }); } note("상대 연결이 끊겨 기다리는 중이에요"); }
        S.graceT = setTimeout(() => { if (!S.closed && !S.peerHere && S.phase === "race") lost("상대가 나갔어요"); }, PEER_GRACE);
        if (check) check().then((d) => { if (d && d.status === "DONE" && !S.closed && !S.peerHere) lost("상대가 나갔어요"); }).catch(() => null);
        if (S.phase === "wait") { if (S.role === "host") S.rd[1] = 0; paintLobby(); }
      }
      function peerBack() {
        clearTimeout(S.graceT);

        if (S.role === "host") send(lbMsg());
        paintLobby();
      }
      // 본체가 보낸 것 — host: 스냅숏을 guest 로 · guest: 입력을 host 로
      const onFrame = (m) => {
        if (S.closed) return;
        if (m.type === "vs:snap" && S.role === "host" && S.phase !== "wait" && m.d) send({ t: "s", d: m.d });
        else if (m.type === "vs:in" && S.role === "guest" && S.phase === "race") send({ t: "in", a: m.a ? 1 : 0, s: Number(m.s) || 0, u: Number.isInteger(m.u) ? m.u : 0, k: typeof m.k === "string" ? m.k.slice(-4) : "", ...(Number.isInteger(m.v) ? { v: m.v } : {}) });
      };
      frameHandlers.add(onFrame);
      S.offFrame = () => frameHandlers.delete(onFrame);
      S.onVis = (hidden) => {
        if (S.role === "host") { if (S.phase === "race") freeze(hidden, "self"); send({ t: "vis", h: hidden ? 1 : 0 }); }
        else send({ t: "vis", h: hidden ? 1 : 0 });
      };
      function onMsg(m) {
        if (!m || typeof m.t !== "string") return;
        if (m.t === "again" && Number.isInteger(m.id) && m.id > 0) { playing.againId = m.id; showAgain(m.id); return; }
        if (m.t === "ping") { send({ t: "pong", c: m.c }); return; }
        if (m.t === "pong") { const ms = performance.now() - Number(m.c); if (ms >= 0 && ms < 5000) toFrame({ type: "vs:rtt", ms }); return; }
        if (S.role === "host") {
          if (m.t === "hi") {
            S.gotHi = true;
            if (okRid(m.rid) && S.phase === "wait") S.rids[1] = m.rid;
            S.guestUn = Number.isInteger(m.un) && m.un >= 1 && m.un <= TRACKS.length ? m.un : TRACKS.length;
            if (S.phase === "wait") S.rd[1] = m.rd ? 1 : 0;
            if (S.phase === "race") send({ t: "go", e: S.e, track: S.track, rids: S.rids.slice() }); // 손님이 새로 들어와 중간에 붙는다
            else if (S.phase === "end" && S.result) send({ t: "end", e: S.e, r: S.result });
            hostChanged();
          } else if (m.t === "rd" && S.phase === "wait") {
            if (okRid(m.rid) && m.rid !== S.rids[1]) { S.rids[1] = m.rid; S.rd = [0, 0]; }
            else S.rd[1] = m.on ? 1 : 0;
            hostChanged();
          } else if (m.t === "in" && S.phase === "race") toFrame({ type: "vs:in", a: m.a ? 1 : 0, s: Number(m.s) || 0, ...(Number.isInteger(m.u) ? { u: m.u } : {}), ...(typeof m.k === "string" && /^[0-2]{0,4}$/.test(m.k) ? { k: m.k } : {}), ...(Number.isInteger(m.v) ? { v: m.v } : {}) });
          else if (m.t === "vis" && S.phase === "race") {
            clearTimeout(S.awayT);
            if (m.h) toFrame({ type: "vs:in", a: 0, s: 0 }); // 손님 조작은 놓은 것으로 — 돌아오면 새 입력이 온다
            freeze(!!m.h, "away");
            note(m.h ? "상대가 다른 화면으로 가서 기다리는 중이에요" : null);
            if (m.h) S.awayT = setTimeout(() => { if (!S.closed && S.phase === "race") { freeze(false, "away"); note(null); } }, AWAY_MAX);
          }
        } else {
          if (m.t === "lb") {
            S.gotLb = true;
            if (m.ph === "wait" && S.phase !== "wait") {
              // 주인이 다시 들어왔다 — 처음부터 다시
              S.phase = "wait"; S.e = 0; S.result = null; S.rd = [0, 0];
              if (screen === "play" || screen === "result") HKUI.toast("상대가 다시 들어와 처음부터 다시 달려요");
              screen = "ready"; setPlaying(false);
            }
            if (S.phase !== "wait") return;
            S.track = clamp(m.track | 0, 0, TRACKS.length - 1); S.max = clamp(m.max | 0, 1, 5);
            if (Array.isArray(m.rids)) { S.rids = [okRid(m.rids[0]) ? m.rids[0] : "bunny", S.rids[1]]; if (okRid(m.rids[1])) S.rids[1] = m.rids[1]; }
            if (Array.isArray(m.rd)) { S.rd = [m.rd[0] ? 1 : 0, m.rd[1] ? 1 : 0]; }
            frameWait(); paintLobby();
          } else if (m.t === "go") guestGo(m);
          else if (m.t === "s" && m.d && S.phase === "race" && m.d.e === S.e) toFrame({ type: "vs:snap", d: m.d });
          else if (m.t === "end" && m.r && (m.e === S.e || S.phase !== "end")) { if (m.e !== S.e && S.e) return; finish(m.r); }
          else if (m.t === "vis") note(m.h && S.phase === "race" ? "상대 화면이 잠깐 멈췄어요 · 돌아오면 3초 뒤 이어 가요" : null);
        }
      }
      function begin(role) {
        S.role = role;
        playing.role = role;
        S.rids = role === "host" ? [myRid(), "fox"] : ["bunny", myRid()];
        S.max = role === "host" ? 1 : 1;
        frameWait();
        // 1초마다 — host: 준비 상태 · 끝 소식 다시 보내기 · guest: 들어왔다고 알리기 · 둘 다: 지연 재기
        S.tick = setInterval(() => {
          if (S.closed) return;
          const now = performance.now();
          if (S.role === "host") {
            if (S.phase === "wait" && S.peerHere) send(lbMsg());
            if (S.phase === "end" && S.result && Date.now() - S.endSent < 6000) send({ t: "end", e: S.e, r: S.result });
          } else if (!S.gotLb || S.phase === "wait") {
            if (!S.gotLb || now - S.lastHi > 3000) { S.lastHi = now; send({ t: "hi", rid: S.rids[1], un: unlocked(), rd: S.rd[1] }); }
          }
          if (now - S.lastPing > 2000) { S.lastPing = now; send({ t: "ping", c: now }); }
        }, 500);
        paintLobby();
      }
      S.setReady = (on) => {
        if (S.phase !== "wait") return;
        const i = mi();
        S.rd[i] = on ? 1 : 0;
        if (S.role === "host") hostChanged();
        else { send({ t: "rd", on: on ? 1 : 0, rid: S.rids[1] }); paintLobby(); }
      };
      S.setTrack = (t) => {
        if (S.role !== "host" || S.phase !== "wait" || !(t >= 0 && t < S.max) || t === S.track) return;
        S.track = t; S.rd = [0, 0]; hostChanged();
      };
      S.setRid = (r) => {
        if (S.phase !== "wait" || !okRid(r)) return;
        const i = mi();
        if (S.rids[i] === r) return;
        S.rids[i] = r; S.rd = [0, 0];
        pref.rid = r; savePref();
        if (S.role === "host") hostChanged();
        else { send({ t: "rd", on: 0, rid: r }); frameWait(); paintLobby(); }
      };
      conn = connect(matchId, {
        onHello: (h) => {
          if (S.closed) return;
          if (!S.role) {
            const role = h && (h.role === "host" || h.role === "guest") ? h.role : fallbackRole;
            if (!role) { lost("연결하지 못했어요", "잠시 뒤 다시 들어와 주세요"); return; }
            begin(role);
          }
          S.peerHere = !!(h && h.peerHere);
          if (S.peerHere) peerBack(); else peerAway();
        },
        onPeer: (here) => {
          if (S.closed) return;
          S.peerHere = here === true || !!(here && here.here);
          if (!S.role) return;
          if (S.peerHere) { if (S.role === "guest") { S.gotLb = false; } peerBack(); } else peerAway();
        },
        onMessage: (m) => { if (!S.closed) onMsg(m); },
        onClose: (c) => {
          if (S.closed) return;
          if (c && c.final) lost(c.text || "연결이 끊겼어요");
          else if (S.phase === "race") note("다시 연결하는 중이에요");
        },
      });
    }
    function onVis(hidden) {
      if (sess && sess.onVis && playing && playing.online) sess.onVis(hidden);
      else if (hidden && screen === "play" && playing && !playing.online) pausePractice("다른 화면으로 가서 멈췄어요");
    }
    // 화면 숨김은 본체 창이 vs:vis 로 알려 준다(같은 탭이라 한 번만 받는다)
    async function giveUp() {
      if (!playing || !playing.online) return;
      const P = playing;
      const ok = await HKUI.confirmDialog("기권할까요?", "상대의 승리로 경주를 마쳐요.", { confirmLabel: "기권하기", cancelLabel: "계속하기" });
      if (!ok || playing !== P) return;
      if (P.resign) await P.resign();
      closeConn();
      if (P.matchId) openMatch(P.matchId); else showMenu();
    }
    function onEsc() {
      if (setOpen()) return closeLayer();
      if (screen === "play" && playing && !playing.online) return pausePractice();
      if (screen === "pause") return;
      if (screen === "play" && playing && playing.party) return partyQuit();
      if (screen === "play" && playing && playing.online) giveUp();
    }
    async function partyQuit() {
      const P = playing;
      const ok = await HKUI.confirmDialog("경주에서 나갈까요?", "나가면 이 경주 결과를 보내지 못해 기록에 남지 않아요. 다른 사람들은 계속 달려요.", { confirmLabel: "나가기", cancelLabel: "계속 달리기" });
      if (!ok || playing !== P) return;
      closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); showPartyLobby();
    }
    // 시험용 연결 — 같은 브라우저의 두 탭이 BroadcastChannel 로 주고받는다. HKRt.connect 와 같은 순서 · 모양으로 알린다
    function devConnect(matchId, h) {
      const role = /^#rt-host/.test(location.hash) ? "host" : "guest";
      const ch = new BroadcastChannel(`hk-bumpervs-dev-${matchId}`);
      const id = Math.random().toString(36).slice(2);
      let closed = false;
      const post = (o) => { if (closed) return false; try { ch.postMessage({ from: id, ...o }); return true; } catch (_) { return false; } };
      ch.onmessage = (e) => {
        const d = e.data;

          const el = $("#bv-mini");
          if (!el || screen !== "result" || playing !== P) return;
          const done = (x) => (x.result === "win" ? "대전 기록에 1승을 남겼어요" : x.endReason === "MISMATCH" || x.endReason === "NO_REPORT" ? `기록에 남지 않았어요 · ${x.reasonLabel || ""}` : `대전 기록에 남겼어요${x.reasonLabel ? ` · ${x.reasonLabel}` : ""}`);
          el.textContent = d ? (d.status === "DONE" ? done(d) : "결과를 보냈어요 · 다른 사람 결과가 오면 기록에 남아요") : "결과를 아직 저장하지 못했어요 · 목록에서 이 경주에 다시 들어오면 다시 보내요";
          el.classList.add(d ? "is-ok" : "is-bad");
          if (d && d.status !== "DONE") {
            clearInterval(sentPoll);
            sentPoll = setInterval(async () => {
              if (screen !== "result" || playing !== P) { clearInterval(sentPoll); return; }
              const x = await HKApi.partyDetail(S.id).catch(() => null);
              if (!x || x.status !== "DONE" || screen !== "result" || playing !== P) return;
              clearInterval(sentPoll);
              const m = $("#bv-mini");
              if (m) m.textContent = done(x);
            }, 4000);
          }
        });
      }
    }
    function showPartyAgain(id) {
      if (screen !== "result") return;
      const box = $("#bv-again"), row = $("#bv-endbtns");
      if (!box || !row) return;
      box.hidden = false; box.textContent = "같은 사람들과 다시 달려요 · 들어가면 대기실로 가요";
      if (!row.querySelector('[data-act="pjoin"]')) row.insertAdjacentHTML("beforeend", `<button type="button" class="hk-btn hk-btn--primary" data-act="pjoin" data-id="${id}">다시 경주 들어가기</button>`);
    }
    const partyData = (r) => ({ winner: r.winner == null ? null : r.winner, order: r.order.slice(), dist: (r.dist || r.order.map(() => 0)).slice(), track: r.track, sec: r.sec });
    async function partyReport(id, r) {
      const data = partyData(r);
      const earlyUntil = Date.now() + 60000;
      let fails = 0;
      saving++;
      try {
        while (fails < 3) {
          try {
            const d = await HKApi.partyReport(id, data);
            try { localStorage.removeItem(PART_REP(id)); } catch (_) { /* 없음 */ }
            return d;
          } catch (e) {
            if (e && e.code === "PARTY_TOO_SOON" && Date.now() < earlyUntil) { await sleep(3000); continue; }
            if (e && (e.code === "PARTY_NOT_RACING" || e.code === "PARTY_BAD_RESULT")) { try { localStorage.removeItem(PART_REP(id)); } catch (_) { /* 없음 */ } return null; }
            if (++fails < 3) await sleep(800 * fails);
          }
        }
        return null;
      } finally { saving--; }
    }
    function partySentScreen(id, resend) {
      screen = "sent"; playing = null; setPlaying(false);
      const back = `<button type="button" class="hk-btn hk-btn--primary" data-act="plobby">여러 명 경주 목록</button>`;
      showOver(cardHtml("send", resend ? "결과를 다시 보내는 중…" : "결과를 보냈어요", "다른 사람 결과가 오면 대전 기록에 남아요", back));
      const still = () => screen === "sent" && location.hash === `#p${id}`;
      (async () => {
        if (resend) await partyReport(id, resend);
        clearInterval(sentPoll);
        sentPoll = setInterval(async () => {
          if (!still()) { clearInterval(sentPoll); return; }
          const d = await HKApi.partyDetail(id).catch(() => null);
          if (!d || !still() || d.status === "RACING") return;
          clearInterval(sentPoll);
          if (d.status === "DONE") showPartyDone(d);
        }, 5000);
      })();
    }
    function showPartyDone(p) {
      screen = "lost"; setPlaying(false); pauseBtn.hidden = true;
      const f = p.final;
      const back = `<button type="button" class="hk-btn hk-btn--secondary" data-act="menu">처음으로</button><button type="button" class="hk-btn hk-btn--primary" data-act="plobby">여러 명 경주 목록</button>`;
      if (!f) return showOver(cardHtml("flag", "끝난 경주예요", `${p.host.name}님의 경주${p.reasonLabel ? ` · ${p.reasonLabel}` : ""}`, back));
      const g = { players: p.players, bots: p.bots, names: [...p.players.map((id) => { const s = p.seats.find((x) => x.id === id); return s ? s.name : "동료"; }), ...Array(PMAX).fill("컴퓨터")].slice(0, f.order.length) };
      const mi = p.players.indexOf(p.meId);
      const list = partyRows(f, g).map((x) => `<div class="bv-rank ${x.i === mi ? "is-me" : ""}"><b>${x.place}</b><span>${esc(x.i === mi ? "나" : x.name)}</span><em>${x.t != null ? fmtSec(x.t) : pct(x.d)}</em></div>`).join("");
      showOver(`<div class="bv-card is-small bv-result" role="dialog" aria-label="경주 결과">
          <span class="bv-badge ${p.result === "win" ? "is-win" : ""}">${icon(p.result === "win" ? "trophy" : "flag", 28)}</span>
          <h2>${p.result === "win" ? "1등 한 경주예요" : p.winner ? `${esc(p.winner.name)}님이 1등` : "끝난 경주예요"}</h2>
          <p>트랙 ${f.track} · ${esc(TRACKS[f.track - 1] || "")}${p.reasonLabel ? ` · ${esc(p.reasonLabel)}` : ""}</p>
          <div class="bv-ranks">${list}</div>
          <div class="bv-btnrow">${back}</div>
        </div>`);
    }

    // ───── 업무 시간이면 게임 대신 안내
    const status = await HKApi.playStatus().catch(() => ({ open: true }));
    function route() {
      const dev = /^#rt-(host|guest)/.exec(location.hash);
      const mm = /^#m(\d+)$/.exec(location.hash);
      if (dev && DEV) {
        const role = dev[1];
        return playOnline({ matchId: "dev", fallbackRole: role, track: 0, rival: { name: role === "host" ? "손님(시험)" : "주인(시험)" }, connect: devConnect });
      }
      if (mm) return openMatch(Number(mm[1]));
      const pp = /^#p(\d+)$/.exec(location.hash);
      if (pp) return openParty(Number(pp[1]));
      showMenu();
    }
    if (!status.open) {
      showOver(`<div class="bv-card is-small">${HKPlay.closedHtml(status.opensAt)}</div>`);
      const cl = over.querySelector(".hk-play-closed");
      if (cl) cl.style.cssText = "border:0;padding:8px 4px";
      setInterval(async () => { const st = await HKApi.playStatus().catch(() => null); if (st && st.open) location.reload(); }, 60000);
      return;
    }
    route();
    addEventListener("hashchange", () => { closeConn(); route(); });
    addEventListener("pagehide", closeConn);
    addEventListener("beforeunload", (e) => { if (saving > 0 && !leaving) { e.preventDefault(); e.returnValue = ""; } });

    // ───── 버튼
    const overClick = (e) => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      if (b.dataset.mode) { pref.mode = b.dataset.mode; savePref(); HKSound.play("select"); paintMenu(); b.blur(); return; }
      if (b.dataset.level) { pref.level = b.dataset.level; savePref(); HKSound.play("tap"); paintMenu(); b.blur(); return; }
      if (b.dataset.track) { pref.track = Number(b.dataset.track); savePref(); HKSound.play("tap"); paintMenu(); toFrame({ type: "vs:setup", role: "solo", track: pref.track, rids: [pref.rid, "fox"], names: [me.name, "컴퓨터"], avatars: [me.avatarUrl || null, null] }); b.blur(); return; }
      if (b.dataset.rid) { pref.rid = b.dataset.rid; savePref(); HKSound.play("tap"); paintMenu(); toFrame({ type: "vs:setup", role: "solo", track: pref.track, rids: [pref.rid, "fox"], names: [me.name, "컴퓨터"], avatars: [me.avatarUrl || null, null] }); b.blur(); return; }
      if (b.dataset.otrack) { if (sess && sess.setTrack) sess.setTrack(Number(b.dataset.otrack)); HKSound.play("tap"); return; }
      if (b.dataset.orid) { if (sess && sess.setRid) sess.setRid(b.dataset.orid); HKSound.play("tap"); return; }
      if (b.id === "bv-go") { if (pref.mode === "online") showOnlineLobby(); else if (pref.mode === "party") showPartyLobby(); else startPractice(); return; }
      if (b.dataset.ptrack) { if (sess && sess.setTrack) sess.setTrack(Number(b.dataset.ptrack)); HKSound.play("tap"); return; }
      if (b.dataset.prid) { if (sess && sess.setRid) sess.setRid(b.dataset.prid); HKSound.play("tap"); return; }
      const act = b.dataset.act;
      if (act === "setclose") { closeLayer(); return; }
      if (act === "resume") return resumePractice();
      if (act === "ready") { if (sess && sess.setReady) sess.setReady(b.dataset.on === "1"); HKSound.play("select"); return; }
      if (act === "again" && playing && !playing.online) return startPractice();
      if (act === "accept") {
        const id = Number(b.dataset.id);
        if (!(id > 0)) return;
        b.disabled = true;
        HKApi.matchAccept(id).then(() => { closeConn(); location.hash = `m${id}`; }).catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "rematch" && playing && playing.rival && playing.rival.id) {
        b.disabled = true;
        HKApi.matchCreate(Number(playing.rival.id), KEY).then((m) => {
          const id = m && Number(m.id);
          if (id > 0 && conn) { try { conn.send({ t: "again", id }); } catch (_) { /* 목록으로만 */ } }
          HKUI.toast("다시 도전장을 보냈어요 · 상대가 받으면 바로 들어가요");
          setTimeout(() => { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); showOnlineLobby(); }, 300);
        }).catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "menu") { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); return showMenu(); }
      // 여러 명 경주
      if (act === "plobby") { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); return showPartyLobby(); }
      if (act === "penter") { location.hash = `p${Number(b.dataset.id)}`; return; }
      if (act === "pjoin" || act === "pdecline") {
        const id = Number(b.dataset.id);
        if (!(id > 0)) return;
        b.disabled = true;
        (act === "pjoin" ? HKApi.partyAccept(id) : HKApi.partyDecline(id)).then(() => {
          closeConn();
          if (act === "pjoin") { if (location.hash === `#p${id}`) openParty(id); else location.hash = `p${id}`; }
          else { HKUI.toast("초대를 거절했어요"); if (location.hash) history.replaceState(null, "", location.pathname); showPartyLobby(); }
        }).catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "pcreate") {
        if (!pickSel.length) return;
        b.disabled = true;
        HKApi.partyCreate(KEY, pickSel.map((x) => x.id), pref.track + 1).then((d) => { HKUI.toast(`${pickSel.length}명에게 초대를 보냈어요`); location.hash = `p${d.id}`; })
          .catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "pready") { if (sess && sess.setReady) sess.setReady(b.dataset.on === "1"); HKSound.play("select"); return; }
      if (act === "pgo") { if (sess && sess.go_) sess.go_(b); return; }
      if (act === "pleave") { if (sess && sess.leave) sess.leave(); return; }
      if (act === "prematch" && sess && sess.party && sess.go) {
        const others = sess.go.players.filter((x) => x !== sess.me);
        b.disabled = true;
        HKApi.partyCreate(KEY, others, sess.track + 1).then((d) => {
          try { conn && conn.send({ t: "again", id: d.id }); } catch (_) { /* 목록으로만 */ }
          HKUI.toast("같은 사람들에게 다시 초대를 보냈어요");
          setTimeout(() => { closeConn(); location.hash = `p${d.id}`; }, 300);
        }).catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "lobby") { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); return showOnlineLobby(); }
    };
    over.addEventListener("click", overClick);
    setOver.addEventListener("click", overClick);
    pauseBtn.onclick = (e) => { e.currentTarget.blur(); pausePractice(); };
    $("#bv-rules").onclick = (e) => { e.currentTarget.blur(); if (setOpen()) closeLayer(); else openRules(); };
    // 「‹ 아케이드」 · 「대전 보기」 — 경주 중 · 결과 저장 중이면 확인 창을 거친 뒤 간다
    const guardLeave = async (e, go) => {
      if (saving > 0 && screen !== "play") {
        e.preventDefault();
        const ok = await HKUI.confirmDialog("결과를 남기는 중이에요", "지금 나가면 무승부가 될 수 있어요.", { confirmLabel: "나가기", cancelLabel: "기다리기" });
        if (ok) { leaving = true; closeConn(); go(); }
        return;
      }
      if (!["play", "pause", "ready"].includes(screen)) return;
      e.preventDefault();
      if (playing && playing.online) {
        const before = screen === "ready";
        const ok = await HKUI.confirmDialog("경주를 그만할까요?", playing.party ? (before ? "아직 출발 전이에요. 목록에서 다시 들어올 수 있어요." : "나가면 이 경주 결과가 기록에 남지 않아요.") : before ? "아직 출발 전이에요. 나중에 대전 목록에서 다시 들어올 수 있어요." : "그만하면 이 경주는 기권으로 져요.", { confirmLabel: "그만하기", cancelLabel: "계속하기" });
        if (!ok) return;
        if (!before && playing.resign) await playing.resign();
        closeConn(); go();
        return;
      }
      const was = screen === "play";
      if (was) pausePractice();
      if (await HKUI.confirmDialog("경주를 그만할까요?", "연습 경주는 저장되지 않아요.", { confirmLabel: "그만하기", cancelLabel: "계속하기" })) { closeConn(); go(); }
      else if (was) resumePractice();
    };
    $("#bv-back").addEventListener("click", (e) => guardLeave(e, HKGoArcade));
    $("#bv-vs").addEventListener("click", (e) => guardLeave(e, () => { location.href = "/together#tg-versus"; }));
    addEventListener("keydown", (e) => {
      if (document.querySelector(".hk-dialog__overlay")) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      if (e.code === "Escape" || e.code === "KeyP") {
        if (e.code === "KeyP" && !(screen === "play" && playing && !playing.online)) return;
        e.preventDefault();
        if (!e.repeat) onEsc();
        return;
      }
      if (keyFwd(e, true)) return;
      if (e.repeat) return;
      const onBtn = t && t.closest && t.closest("button, a");
      if ((e.code === "Enter" || e.code === "Space") && !onBtn && !setOpen()) {
        if (screen === "menu") { e.preventDefault(); $("#bv-go")?.click(); }
        else if (screen === "ready") { e.preventDefault(); over.querySelector('[data-act="ready"]')?.click(); }
      }
    });
    // 연습 — 다른 창으로 가면 멈춘다(돌아와도 저절로 이어 가지 않는다)
    addEventListener("blur", () => { setTimeout(() => { if (document.activeElement === frame) return; if (screen === "play" && playing && !playing.online) pausePractice("다른 창으로 가서 멈췄어요"); }, 0); });
  })();
  </script>
</body>
</html>
