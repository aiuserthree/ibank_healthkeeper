<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>비타민 특공대 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <script src="/_shared/vitamin.js"></script>
  <style>
    /* 비타민 특공대 — 레트로 오락실 런앤건 (본체: /_shared/vitamin.js)
       가로로 긴 화면이라 공통 창(세로 비율)을 이 게임만 가운데 영역 가득 넓힌다 */
    .hk-pf .hk-play-frame.vt-wide { width: 100% !important; height: 100% !important; max-width: 1240px; background: #140c2a; border-color: #2b2350; }
    .hk-pf .hk-play-stage > .vt-shell { flex: 1; }
    .vt-shell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 0; height: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .vt-screen { position: relative; line-height: 0; flex-shrink: 0; }
    .vt-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; border-radius: 6px; background: #0b0f1a; box-shadow: 0 0 0 2px #1e293b, 0 10px 30px rgba(0,0,0,.45); }
    .vt-hint { color: #94a3b8; font-size: 12.5px; line-height: 1.5; text-align: center; word-break: keep-all; }
    .vt-hint kbd { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 5px; border: 1px solid #334155; background: #111827; color: #e2e8f0; font: 700 11px/1.6 inherit; text-align: center; }
    .vt-shell[data-mode="below"] .vt-hint, .vt-shell[data-mode="over"] .vt-hint { display: none; }
    .vt-shell[data-mode="below"] { justify-content: flex-start; }
    .vt-padwrap { width: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .vt-shell[data-mode="pc"] .vt-pad { display: none; }
    /* 휴대폰 조작판 — 반투명 유리 느낌 + 픽셀 아이콘 */
    .vt-pad { position: relative; width: 100%; max-width: 560px; height: 190px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .vt-shell[data-mode="over"] .vt-pad { position: absolute; left: 0; right: 0; bottom: 4px; max-width: none; height: 160px; padding: 0 12px; opacity: .62; pointer-events: none; z-index: 2; }
    .vt-shell[data-mode="over"] .vt-pad > * { pointer-events: auto; }
    .vt-stick { width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .vt-stick__base { position: relative; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(46,38,92,.55) 0 54%, rgba(20,12,42,.6) 55%); border: 1px solid rgba(255,246,224,.35); box-shadow: inset 0 0 0 4px rgba(20,12,42,.35), 0 8px 24px rgba(0,0,0,.35); box-sizing: border-box; backdrop-filter: blur(3px); }
    .vt-shell[data-mode="over"] .vt-stick { width: 140px; height: 140px; }
    .vt-shell[data-mode="over"] .vt-stick__base { width: 120px; height: 120px; }
    .vt-stick__knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffc070, #ff8a3d 45%, #e8562e 75%, #a8323a); border: 1px solid rgba(255,246,224,.5); box-shadow: 0 3px 0 #5c1f3a, 0 0 18px rgba(255,138,61,.45); pointer-events: none; }
    .vt-ar { position: absolute; width: 0; height: 0; border: 8px solid transparent; opacity: .45; pointer-events: none; }
    .vt-ar.is-on { opacity: 1; filter: drop-shadow(0 0 4px #5ee6c8); }
    .vt-ar--u { left: 50%; top: 6px; margin-left: -8px; border-bottom: 10px solid #fff6e0; border-top: 0; }
    .vt-ar--d { left: 50%; bottom: 6px; margin-left: -8px; border-top: 10px solid #fff6e0; border-bottom: 0; }
    .vt-ar--l { top: 50%; left: 6px; margin-top: -8px; border-right: 10px solid #fff6e0; border-left: 0; }
    .vt-ar--r { top: 50%; right: 6px; margin-top: -8px; border-left: 10px solid #fff6e0; border-right: 0; }
    .vt-btns { position: relative; width: 196px; height: 170px; flex-shrink: 0; }
    .vt-btn { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 50%; color: #fff6e0; box-sizing: border-box; border: 1px solid rgba(255,246,224,.4); box-shadow: inset 0 0 0 3px rgba(20,12,42,.25), 0 6px 18px rgba(0,0,0,.35); backdrop-filter: blur(3px); touch-action: none; transition: transform .05s; }
    .vt-btn svg { width: 46%; height: 46%; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(20,12,42,.6)); }
    .vt-btn small { font: 700 12px/1 "Galmuri11", "GalmuriMono11", inherit; pointer-events: none; }
    .vt-btn.is-on { transform: translateY(3px) scale(.95); border-color: #fff6e0; box-shadow: inset 0 0 0 3px rgba(255,246,224,.25), 0 0 20px currentColor; }
    .vt-btn--fire { right: 0; bottom: 6px; width: 92px; height: 92px; color: #ff8a3d; background: radial-gradient(circle at 35% 30%, rgba(255,138,61,.75), rgba(168,50,58,.7) 70%); }
    .vt-btn--jump { right: 98px; bottom: 0; width: 80px; height: 80px; color: #5ee6c8; background: radial-gradient(circle at 35% 30%, rgba(94,230,200,.6), rgba(29,106,122,.7) 70%); }
    .vt-btn--gren { right: 58px; top: 0; width: 64px; height: 64px; color: #86e05a; background: radial-gradient(circle at 35% 30%, rgba(134,224,90,.6), rgba(31,106,54,.7) 70%); }
    .vt-btn--gren svg { width: 40%; height: 40%; }
    .vt-btn--gren small { color: #fff6e0; }
    .vt-shell[data-mode="over"] .vt-btns { width: 180px; height: 150px; }
    .vt-shell[data-mode="over"] .vt-btn--fire { width: 80px; height: 80px; }
    .vt-shell[data-mode="over"] .vt-btn--jump { right: 86px; width: 70px; height: 70px; }
    .vt-shell[data-mode="over"] .vt-btn--gren { right: 50px; width: 56px; height: 56px; }
    /* 안내 창 */
    .vt-ov { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; overflow-y: auto; }
    .vt-ov[hidden] { display: none; }
    .vt-ov.is-bottom { align-items: flex-end; padding-bottom: 6%; }
    .vt-shell[data-mode="below"] .vt-ov.is-bottom { align-items: flex-end; padding-bottom: 24px; }
    .vt-card { width: 100%; max-width: 340px; box-sizing: border-box; padding: 18px 16px 16px; border-radius: 6px; background: #1a1033; color: #fff6e0; text-align: center; border: 2px solid #ff8a3d; box-shadow: 0 0 0 3px #140c2a, 0 0 28px rgba(255,138,61,.35), 0 14px 40px rgba(0,0,0,.5); }
    .vt-card h2 { margin: 0 0 8px; font-family: "Galmuri14", inherit; font-size: 22px; font-weight: 900; color: #fde047; letter-spacing: -0.02em; text-shadow: 2px 2px 0 #7c2d12; }
    .vt-card p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; color: #cbd5e1; word-break: keep-all; }
    .vt-card p b { color: #fff; }
    .vt-big { margin: 2px 0 12px; font-size: 32px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 #c2410c; }
    .vt-card--title { max-width: 380px; padding: 12px 14px; background: rgba(26, 16, 51, .9); backdrop-filter: blur(3px); }
    .vt-pick { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .vt-pick__label { font-size: 12.5px; font-weight: 800; color: #94a3b8; margin-right: 2px; writing-mode: horizontal-tb; white-space: nowrap; }
    .vt-hero { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 6px; border: 2px solid #334155; background: #111827; color: #cbd5e1; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
    .vt-hero canvas { width: 44px; height: 52px; image-rendering: pixelated; margin: -4px 0; }
    .vt-hero.is-on { border-color: #fde047; color: #fff; background: #1e293b; box-shadow: 0 0 0 2px rgba(253,224,71,.25); }
    .vt-go { width: 100%; border: 0; padding: 12px; border-radius: 6px; font: inherit; font-size: 16px; font-weight: 900; color: #fff; cursor: pointer; background: linear-gradient(180deg, #fb923c, #ea580c); box-shadow: 0 4px 0 #9a3412; letter-spacing: 0.02em; }
    .vt-go:active { transform: translateY(2px); box-shadow: 0 2px 0 #9a3412; }
    .vt-go:focus-visible { outline: 3px solid #fde047; outline-offset: 2px; }
    .vt-tip { margin: 8px 0 0 !important; font-size: 12px !important; color: #94a3b8 !important; }
    .vt-card .hk-quit-wrap { display: flex; width: 100%; }
    @media (max-width: 640px) {
      .vt-card h2 { font-size: 20px; }
      .vt-big { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "vitamin",
    setup(stage, ctx) {
      HKVitamin.setup(stage, ctx);
    },
  });
  </script>
</body>
</html>
