<!DOCTYPE html>
<html lang="ko">
<head>

  <title>비타민 3매치 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">

  <style>
    .gm-wrap { margin: 0 auto; display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .gm-hud { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 9px 12px 12px 16px; border-radius: 14px; background: linear-gradient(135deg, #ff7a59, #ffb648); color: #fff; }
    .gm-hud__main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
    .gm-stagelbl { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gm-stagelbl b { padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.26); font-weight: 900; }
    .gm-total { display: flex; align-items: baseline; gap: 6px; }
    .gm-total b { font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .gm-total small { font-size: 11.5px; opacity: .9; font-weight: 700; }
    .gm-time { display: flex; align-items: center; gap: 5px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,.2); }
    .gm-time.is-low { background: #fff; color: #e5484d; animation: gm-blink 1s infinite; }
    @keyframes gm-blink { 50% { opacity: .65; } }
    .gm-hud__btn { width: 38px; height: 38px; border-radius: 11px; border: 0; background: rgba(255,255,255,.22); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .gm-hud__btn:hover { background: rgba(255,255,255,.32); }
    .gm-hud__btn:disabled { opacity: .45; cursor: default; }
    .gm-hud__timebar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.25); }
    .gm-hud__timebar i { display: block; height: 100%; width: 100%; background: #fff; border-radius: 0 99px 99px 0; }
    .gm-hud__timebar.is-low i { background: #ffe1e1; }
    .gm-meters { display: grid; grid-template-columns: 1.45fr 1fr; gap: 10px; }
    .gm-meter { background: var(--surface-card, #fff); border: 1px solid var(--border-default, #e3e8f2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
    .gm-meter__top { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--text-secondary, #475569); margin-bottom: 6px; white-space: nowrap; }
    .gm-meter__top em { margin-left: auto; font-style: normal; color: var(--text-muted, #64748b); font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
    .gm-meter--goal .gm-meter__top em { color: var(--color-midnight-navy, #0f1d3d); font-weight: 800; }
    .gm-bar { height: 8px; border-radius: 99px; background: var(--color-mist, #eef2f8); overflow: hidden; }
    .gm-bar i { display: block; height: 100%; width: 100%; border-radius: 99px; }
    .gm-bar--goal i { width: 0; background: linear-gradient(90deg, #ffb648, #ff7a59); transition: width .3s; }
    .gm-meter--goal.is-done { border-color: #86efac; background: #f0fdf4; }
    .gm-meter--goal.is-done .gm-bar--goal i { background: linear-gradient(90deg, #4ade80, #16a34a); }
    .gm-meter--goal.is-done .gm-meter__top em { color: #15803d; }
    .gm-bar--vit i { width: 0; background: linear-gradient(90deg, #8bd450, #22c55e); transition: width .25s; }
    .gm-meter.is-fever .gm-bar--vit i { background: linear-gradient(90deg, #ff7a59, #ffd23f, #ff7a59); background-size: 200% 100%; animation: gm-flow .8s linear infinite; transition: none; }
    .gm-meter.is-fever .gm-meter__top em { color: #ff6a3d; font-weight: 800; }
    @keyframes gm-flow { to { background-position: -200% 0; } }
    .gm-boardwrap { position: relative; align-self: center; border-radius: 18px; padding: 6px; background: #fff7ef; border: 1px solid #ffe6cf; transition: box-shadow .3s; }
    .gm-boardwrap.is-fever { animation: gm-fever .7s ease-in-out infinite alternate; border-color: #ffb648; }
    @keyframes gm-fever { from { box-shadow: 0 0 0 3px #ffb648, 0 0 14px 2px rgba(255,122,89,.45); } to { box-shadow: 0 0 0 4px #ff7a59, 0 0 30px 8px rgba(255,182,72,.75); } }
    .gm-board { position: relative; overflow: hidden; border-radius: 12px; touch-action: none; cursor: pointer; background: repeating-linear-gradient(135deg, rgba(205,150,105,.2) 0 4px, transparent 4px 10px); }
    /* 판 모양 — 유효 칸만 칠하고, 구멍은 빗금으로 비워 둔다 */
    .gm-cells { position: absolute; inset: 0; filter: drop-shadow(0 0 1px #e8925a) drop-shadow(0 0 1px #e8925a) drop-shadow(0 2px 4px rgba(200,110,50,.2)); }
    .gm-cell { position: absolute; background: #fffdf9; }
    .gm-cell.is-alt { background: #ffeedd; }
    .gm-tile { position: absolute; left: 0; top: 0; z-index: 1; transition-property: transform; transition-timing-function: ease; will-change: transform; }
    .gm-tile.is-new { animation: gm-in .22s ease-out; }
    @keyframes gm-in { from { opacity: 0; } }
    .gm-ball { position: absolute; inset: 7%; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden;
      background: radial-gradient(circle at 32% 28%, var(--c2) 0%, var(--c) 62%); box-shadow: inset 0 -3px 0 rgba(0,0,0,.13), 0 2px 4px rgba(120,60,20,.18);
      transition: transform .2s ease, opacity .2s ease; }
    .gm-ball svg { width: 56%; height: 56%; position: relative; z-index: 1; }
    .gm-tile.is-sel .gm-ball { transform: scale(1.08); box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px #ff7a59, 0 4px 10px rgba(255,122,89,.4); }
    .gm-tile.is-pop .gm-ball { transform: scale(.1); opacity: 0; transition: transform .22s ease-in, opacity .22s ease-in; }
    .gm-tile.is-row .gm-ball::after, .gm-tile.is-col .gm-ball::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
    .gm-tile.is-row .gm-ball::after { background: repeating-linear-gradient(0deg, transparent 0 17%, rgba(255,255,255,.5) 17% 25%); }
    .gm-tile.is-col .gm-ball::after { background: repeating-linear-gradient(90deg, transparent 0 17%, rgba(255,255,255,.5) 17% 25%); }
    .gm-tile.is-row .gm-ball, .gm-tile.is-col .gm-ball { box-shadow: 0 0 0 2.5px #fff, 0 0 10px 2px var(--c); }
    .gm-tile.is-all .gm-ball { background: conic-gradient(from 20deg, #ef4444, #f97316, #eab308, #65a30d, #7c3aed, #db2777, #ef4444); box-shadow: 0 0 0 2.5px #fff, 0 0 12px 3px rgba(255,160,60,.7); }
    .gm-tile.is-all .gm-ball svg { width: 62%; height: 62%; padding: 13%; box-sizing: border-box; border-radius: 50%; background: #fff; color: #ff6a3d; }
    .gm-tile.is-bomb .gm-ball { box-shadow: 0 0 0 2.5px #fff, 0 0 0 5px #111827, 0 0 14px 4px rgba(239,68,68,.7); animation: gm-bombpulse .9s ease-in-out infinite; }
    .gm-tile.is-bomb .gm-ball::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 2px dashed rgba(255,255,255,.85); }
    @keyframes gm-bombpulse { 50% { transform: scale(1.07); } }
    /* 아이템 — 빛나는 비타민 · 시계 · 점수 2배 */
    .gm-tile.is-glow::before { content: ""; position: absolute; inset: -4%; border-radius: 50%; pointer-events: none;
      background: conic-gradient(from 0deg, transparent 0 6%, rgba(255,236,140,.95) 9%, transparent 13% 31%, rgba(255,255,255,.95) 34%, transparent 38% 56%, rgba(255,236,140,.95) 59%, transparent 63% 81%, rgba(255,255,255,.95) 84%, transparent 88%);
      animation: gm-spin 2.6s linear infinite; }
    @keyframes gm-spin { to { transform: rotate(360deg); } }
    .gm-tile.is-glow .gm-ball { box-shadow: 0 0 0 2.5px #fff, 0 0 12px 4px rgba(255,214,90,.95), inset 0 0 10px rgba(255,255,255,.8); animation: gm-glow 1s ease-in-out infinite alternate; }
    @keyframes gm-glow { to { filter: brightness(1.22) saturate(1.1); } }
    .gm-tile.is-clock .gm-ball { box-shadow: 0 0 0 2.5px #fff, 0 0 0 5px #0ea5e9, 0 2px 6px rgba(14,165,233,.4); }
    .gm-tile.is-x2 .gm-ball { box-shadow: 0 0 0 2.5px #fff, 0 0 0 5px #f59e0b, 0 2px 6px rgba(245,158,11,.45); }
    .gm-badge { position: absolute; right: 2%; bottom: 2%; z-index: 2; width: 44%; height: 44%; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none;
      background: #fff; color: #0284c7; box-shadow: 0 1px 4px rgba(15,23,42,.3); font-weight: 900; font-size: 11px; letter-spacing: -.04em; }
    .gm-badge svg { width: 72%; height: 72%; }
    .gm-badge--x2 { background: linear-gradient(135deg, #fde047, #f59e0b); color: #7c2d12; border: 1.5px solid #fff; }
    .gm-tile.is-spawn .gm-ball { animation: gm-spawn .65s ease-out; }
    @keyframes gm-spawn { 0% { transform: scale(.3) rotate(-30deg); filter: brightness(2); } 55% { transform: scale(1.3) rotate(10deg); filter: brightness(1.5); } 100% { transform: scale(1); } }
    .gm-ring { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 4; border: 3px solid #ffd23f; box-shadow: 0 0 14px 4px rgba(255,210,63,.7); animation: gm-ring .6s ease-out forwards; }
    @keyframes gm-ring { from { transform: translate(-50%, -50%) scale(.2); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
    .gm-tile.is-zap .gm-ball { filter: brightness(1.8); box-shadow: 0 0 0 3px #fff, 0 0 16px 6px rgba(255,236,140,.95); }
    .gm-x2 { padding: 1px 8px; border-radius: 99px; background: #fde047; color: #92400e; font-size: 12px; font-weight: 900; animation: gm-blink .8s infinite; }
    .gm-x2[hidden] { display: none; }
    /* 얼음 — 타일 위에 씌운 반투명 얼음 덮개 */
    .gm-ice { position: absolute; inset: 3%; z-index: 2; border-radius: 24%; pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,.75) 0 14%, transparent 14% 30%, rgba(255,255,255,.45) 30% 36%, transparent 36%), rgba(186,230,253,.55);
      border: 2px solid rgba(255,255,255,.95); box-shadow: inset 0 0 0 2px rgba(56,189,248,.55), 0 0 0 1px rgba(14,165,233,.35), inset 0 -4px 8px rgba(14,165,233,.25); }
    .gm-ice.is-break { animation: gm-icebreak .3s ease-in forwards; }
    @keyframes gm-icebreak { to { transform: scale(1.25) rotate(8deg); opacity: 0; } }
    .gm-tile.is-ice.is-nope .gm-ice { animation: gm-nope .3s ease-in-out; }
    @keyframes gm-nope { 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
    /* 돌 — 칸을 막는 장애물, 두 번 맞으면 부서짐 */
    .gm-stone { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }
    .gm-stone::before { content: ""; position: absolute; inset: 6%; border-radius: 30% 36% 28% 34%;
      background: radial-gradient(circle at 34% 28%, #cbd5e1 0%, #94a3b8 45%, #64748b 100%);
      box-shadow: inset 0 -4px 0 rgba(15,23,42,.22), inset 2px 2px 0 rgba(255,255,255,.35), 0 2px 4px rgba(15,23,42,.25); }
    .gm-stone::after { content: ""; position: absolute; inset: 6%; border-radius: 30%; opacity: 0;
      background: linear-gradient(118deg, transparent 47%, #334155 47% 52%, transparent 52%), linear-gradient(28deg, transparent 58%, #334155 58% 62%, transparent 62%), linear-gradient(72deg, transparent 30%, #334155 30% 34%, transparent 34%); }
    .gm-stone.is-crack::after { opacity: .75; }
    .gm-stone.is-hit { animation: gm-stonehit .25s ease-out; }
    @keyframes gm-stonehit { 40% { transform: var(--pos) scale(.88); } }
    .gm-stone.is-break { animation: gm-stonebreak .32s ease-in forwards; }
    @keyframes gm-stonebreak { to { opacity: 0; transform: var(--pos) scale(.4) rotate(20deg); } }
    .gm-spark { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; pointer-events: none; z-index: 4; animation: gm-spark .5s ease-out forwards; }
    .gm-spark.is-shard { border-radius: 2px; }
    @keyframes gm-spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
    .gm-boom { position: absolute; transform: translate(-50%, -50%); border-radius: 18px; pointer-events: none; z-index: 4; background: radial-gradient(circle, #fff 0%, rgba(255,214,102,.9) 35%, rgba(255,122,89,.5) 60%, transparent 72%); animation: gm-boom .45s ease-out forwards; }
    @keyframes gm-boom { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.15); opacity: 0; } }
    .gm-boardwrap.is-shake { animation: gm-shake .32s ease-in-out; }
    .gm-boardwrap.is-shake2 { animation: gm-shake2 .42s ease-in-out; }
    .gm-boardwrap.is-fever.is-shake2 { animation: gm-shake2 .42s ease-in-out, gm-fever .7s ease-in-out infinite alternate; }
    @keyframes gm-shake2 { 15% { translate: -9px 4px; rotate: -.6deg; } 30% { translate: 8px -4px; rotate: .6deg; } 50% { translate: -6px 3px; } 70% { translate: 5px -2px; } 85% { translate: -2px 1px; } }
    .gm-spark.is-star { width: 12px; height: 12px; margin: -6px 0 0 -6px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); box-shadow: none; }
    .gm-chain { position: absolute; left: 50%; top: 22%; z-index: 7; pointer-events: none; transform: translate(-50%, -50%); text-align: center; line-height: 1.05; white-space: nowrap; animation: gm-chain .9s ease-out forwards; }
    .gm-chain b { display: block; font-size: var(--fs, 26px); font-weight: 900; letter-spacing: -.02em; color: #fff; -webkit-text-stroke: 1.5px #ea580c; paint-order: stroke fill; text-shadow: 0 3px 0 #c2410c, 0 6px 16px rgba(234,88,12,.45); }
    .gm-chain small { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 99px; background: #fff; color: #ea580c; font-size: 13px; font-weight: 900; box-shadow: 0 3px 10px rgba(234,88,12,.3); }
    .gm-chain.is-hot b { color: #fff7c2; -webkit-text-stroke-color: #dc2626; text-shadow: 0 3px 0 #b91c1c, 0 0 22px rgba(255,200,60,.9); }
    @keyframes gm-chain { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); } 30% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.95); } }
    .gm-float.is-big { font-size: 21px; padding: 4px 12px; background: rgba(220, 38, 38, .92); }
    .gm-boardwrap.is-fever.is-shake { animation: gm-shake .32s ease-in-out, gm-fever .7s ease-in-out infinite alternate; }
    @keyframes gm-shake { 20% { translate: -5px 2px; } 40% { translate: 5px -2px; } 60% { translate: -3px 1px; } 80% { translate: 3px 0; } }
    .gm-time.is-plus { animation: gm-plus .5s ease-out; }
    @keyframes gm-plus { 30% { transform: scale(1.18); background: #22c55e; color: #fff; } }
    .gm-tile.is-born .gm-ball { animation: gm-born .4s ease-out; }
    @keyframes gm-born { 0% { transform: scale(.4); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .gm-tile.is-hint .gm-ball { animation: gm-hint 1.1s ease-in-out infinite; }
    @keyframes gm-hint { 0%, 60%, 100% { transform: scale(1); } 20% { transform: scale(1.12) rotate(-8deg); } 40% { transform: scale(1.12) rotate(8deg); } }
    .gm-beam { position: absolute; pointer-events: none; border-radius: 99px; z-index: 4; animation: gm-beam .38s ease-out forwards; }
    .gm-beam--row { left: 0; right: 0; background: linear-gradient(90deg, rgba(255,122,89,.2), #fff 30%, #fff 70%, rgba(255,122,89,.2)); box-shadow: 0 0 0 3px rgba(255,182,72,.9), 0 0 22px 8px rgba(255,122,89,.75); }
    .gm-beam--col { top: 0; bottom: 0; background: linear-gradient(180deg, rgba(255,122,89,.2), #fff 30%, #fff 70%, rgba(255,122,89,.2)); box-shadow: 0 0 0 3px rgba(255,182,72,.9), 0 0 22px 8px rgba(255,122,89,.75); }
    @keyframes gm-beam { from { opacity: 1; } to { opacity: 0; } }
    .gm-float { position: absolute; pointer-events: none; transform: translate(-50%, -50%); font-weight: 900; font-size: 17px; line-height: 1.15; color: #fff; white-space: nowrap; padding: 3px 10px; border-radius: 99px; background: rgba(240, 90, 50, .92); box-shadow: 0 3px 10px rgba(200,70,30,.35); animation: gm-float .9s ease-out forwards; z-index: 5; }
    .gm-float.is-time { background: rgba(14,165,233,.95); box-shadow: 0 3px 10px rgba(14,116,144,.35); }
    .gm-float small { display: block; text-align: center; font-size: 11px; font-weight: 800; color: #ffe7a8; }
    @keyframes gm-float { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -26px; } }
    .gm-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; z-index: 6; padding: 10px 18px; border-radius: 14px; font-size: 18px; font-weight: 900; line-height: 1.3; text-align: center; color: #fff; width: max-content; box-sizing: border-box; word-break: keep-all; background: linear-gradient(135deg, #ff7a59, #ffb648); box-shadow: 0 8px 20px rgba(255,122,89,.45); animation: gm-banner 1.3s ease-out forwards; }
    .gm-banner small { display: block; font-size: 12.5px; font-weight: 800; opacity: .95; }
    .gm-banner.is-long { animation-duration: 2.2s; }
    @keyframes gm-banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 20% { transform: translate(-50%, -50%) scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
    .gm-overlay { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; text-align: center; border-radius: 18px; overflow: auto; color: var(--color-midnight-navy, #0f1d3d); background: rgba(255, 250, 244, .92); backdrop-filter: blur(3px); }
    .gm-overlay[hidden] { display: none; }
    .gm-overlay h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .gm-overlay p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text-secondary, #475569); }
    .gm-rules { display: grid; gap: 6px; text-align: left; font-size: 12.5px; line-height: 1.45; color: var(--text-secondary, #475569); background: #fff; border: 1px solid #ffe0c2; border-radius: 12px; padding: 10px 12px; max-width: 340px; }
    .gm-rules div { display: flex; gap: 8px; align-items: flex-start; }
    .gm-rules i, .gm-rules svg { flex-shrink: 0; margin-top: 1px; }
    .gm-start { border: 0; border-radius: 12px; padding: 12px 30px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(135deg, #ff7a59, #ffb648); box-shadow: 0 6px 16px rgba(255, 122, 89, .4); display: inline-flex; align-items: center; gap: 6px; }
    .gm-start:hover { filter: brightness(1.05); }
    .gm-big { font-size: 30px; font-weight: 900; color: #ff6a3d; }
    /* 단계 클리어 카드 */
    .gm-overlay.is-clear { background: rgba(255, 250, 244, .8); }
    .gm-clear { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 22px; border-radius: 16px; background: #fff; border: 1px solid #ffe0c2; box-shadow: 0 10px 28px rgba(255,122,89,.25); animation: gm-pop .35s ease-out; }
    @keyframes gm-pop { from { transform: scale(.8); opacity: 0; } }
    .gm-clear__icon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #ff7a59, #ffb648); box-shadow: 0 6px 14px rgba(255,122,89,.4); }
    .gm-clear__bonus { font-size: 14px; font-weight: 700; color: var(--text-secondary, #475569); font-variant-numeric: tabular-nums; }
    .gm-clear__bonus b { color: #16a34a; font-size: 18px; }
    .gm-clear__next { margin-top: 4px; padding: 5px 12px; border-radius: 99px; background: #fff3e6; color: #c2410c; font-size: 13px; font-weight: 800; }
    .gm-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .gm-chip { padding: 3px 10px; border-radius: 99px; background: #fff; border: 1px solid #ffe0c2; font-size: 12.5px; font-weight: 700; color: var(--text-secondary, #475569); }
    .gm-chip b { color: #ff6a3d; }
    /* 휴대폰 — 알이 칸을 거의 꽉 채우게 */
    @media (max-width: 520px) {
      .gm-ball { inset: 3%; }
      .gm-ball svg { width: 60%; height: 60%; }
    }
    @media (max-width: 420px) {

            <div class="gm-meter" data-v="vitbox"><div class="gm-meter__top">${HKUI.icon("pill", 14, "#22c55e")}게이지<em data-v="vitlbl">0%</em></div><div class="gm-bar gm-bar--vit"><i data-v="vitbar"></i></div></div>

        let S = 50, NR = 8, NC = 8;
        const BASE_DIM = Math.max(...MAPS.map((mp) => Math.max(mp.m.length, mp.m[0].length)));
        let mask = [], stoneHp = [], stoneEl = [], board = [], cellsEl = null;
        let stageNo = 1, C = cfg(1), mapIdx = 0, mapOrder = [];

        const at = (k) => board[rOf(k)][cOf(k)];
        const N4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];

          const narrow = W < 480, edge = narrow ? 2 : 6;

        // ---------- 타일 ----------
        function look(t) {

          el.dataset.sp = t.sp || "";
          const ball = el.firstChild;
          if (t.sp === "all") { ball.innerHTML = SVG.pill; ball.style.removeProperty("--c"); }
          else {
            const k = KINDS[t.k];
            ball.innerHTML = SVG[k.icon];
            ball.style.setProperty("--c", k.c);
            ball.style.setProperty("--c2", lighten(k.c, 0.42));

        }
        function setIce(t, on) {

          t.el.classList.toggle("is-ice", on);

          if (on && !old) { const ice = document.createElement("div"); ice.className = "gm-ice"; t.el.appendChild(ice); }
          if (!on && old) { old.classList.add("is-break"); setTimeout(() => old.remove(), 320); }
        }
        function makeTile(k, r, c, startRow) {
          const el = document.createElement("div");

          el.innerHTML = `<div class="gm-ball"></div>`;
          el.style.width = el.style.height = S + "px";
          const t = { id: ++uid, k, sp: null, ice: false, r, c, el };
          look(t);
          el.style.transitionDuration = "0ms";
          el.style.transform = `translate(${c * S}px, ${(startRow ?? r) * S}px)`;
          el.dataset.r = r; el.dataset.c = c;

        }
        function place(t, ms, ease) {
          t.el.style.transitionDuration = ms + "ms";
          t.el.style.transitionTimingFunction = ease || "ease";
          t.el.style.transform = `translate(${t.c * S}px, ${t.r * S}px)`;
          t.el.dataset.r = t.r; t.el.dataset.c = t.c;
        }
        function posStone(el, r, c) {
          const pos = `translate(${c * S}px, ${r * S}px)`;
          el.style.width = el.style.height = S + "px";
          el.style.transform = pos;
          el.style.setProperty("--pos", pos);
        }
        const kAt = (r, c) => (valid(r, c) && board[r][c] && board[r][c].sp !== "all" ? board[r][c].k : null);
        const rndKind = () => Math.floor(Math.random() * C.kinds);

        // ---------- 종류 격자로 하는 판정 (g[r][c] = null | {k, sp, ice}) ----------
        const gk = (g, r, c) => { if (!inb(r, c)) return null; const x = g[r] && g[r][c]; return x && x.sp !== "all" ? x.k : null; };
        function lineLen(g, r, c) {
          const k = gk(g, r, c); if (k == null) return 0;
          let h = 1, v = 1;
          for (let x = c - 1; gk(g, r, x) === k; x--) h++;
          for (let x = c + 1; gk(g, r, x) === k; x++) h++;
          for (let y = r - 1; gk(g, y, c) === k; y--) v++;
          for (let y = r + 1; gk(g, y, c) === k; y++) v++;
          return Math.max(h, v);
        }
        // (r, c)가 2×2 네모의 한 칸인지
        function inSquare(g, r, c) {
          const k = gk(g, r, c); if (k == null) return false;
          for (const [dr, dc] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) {
            const r0 = r + dr, c0 = c + dc;
            if (gk(g, r0, c0) === k && gk(g, r0, c0 + 1) === k && gk(g, r0 + 1, c0) === k && gk(g, r0 + 1, c0 + 1) === k) return true;
          }
          return false;
        }
        function anyMatch(g) {
          for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) if (lineLen(g, r, c) >= 3 || inSquare(g, r, c)) return true;
          return false;
        }
        // 왼쪽·위쪽만 보고 이 칸에 k를 놓으면 바로 맞춰지는지 (줄 3개 · 2×2)
        function makesMatch(g, r, c, k) {
          return (gk(g, r, c - 1) === k && gk(g, r, c - 2) === k) || (gk(g, r - 1, c) === k && gk(g, r - 2, c) === k) ||
            (gk(g, r - 1, c - 1) === k && gk(g, r - 1, c) === k && gk(g, r, c - 1) === k);
        }
        // 움직일 수 있는 수 찾기 — 얼음 칸·구멍·돌은 못 바꿈 (all 이면 전부)
        function findMove(g, all) {
          const list = [];
          for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) {
            for (const [dr, dc] of [[0, 1], [1, 0]]) {
              const r2 = r + dr, c2 = c + dc;
              if (!inb(r2, c2)) continue;
              const a = g[r][c], b = g[r2][c2];
              if (!a || !b || a.ice || b.ice) continue;
              let ok = a.sp === "all" || b.sp === "all" || a.sp === "glow" || b.sp === "glow" || !!(a.sp && b.sp);
              if (!ok) {
                g[r][c] = b; g[r2][c2] = a;
                ok = lineLen(g, r, c) >= 3 || lineLen(g, r2, c2) >= 3 || inSquare(g, r, c) || inSquare(g, r2, c2);
                g[r][c] = a; g[r2][c2] = b;
              }
              if (ok) { if (!all) return [[r, c], [r2, c2]]; list.push([[r, c], [r2, c2]]); }
            }
          }
          return all ? list : null;
        }
        const snap = () => board.map((row) => row.map((t) => (t ? { k: t.k, sp: t.sp, ice: t.ice } : null)));

        // ---------- 판 만들기 ----------
        function pickCells(n, avoid) {
          const cells = [];
          for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) if (mask[r][c] && !avoid(r, c)) cells.push(key(r, c));
          for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
          return new Set(cells.slice(0, n));
        }
        // 처음 판: 이미 맞춰진 3개·2×2 네모가 없고, 움직일 수 있는 수가 있게
        function freshGrid(iceSet) {
          let g = null;
          for (let tries = 0; tries < 300; tries++) {
            g = [];
            for (let r = 0; r < NR; r++) {
              g.push([]);
              for (let c = 0; c < NC; c++) {
                if (!mask[r][c] || stoneHp[r][c]) { g[r].push(null); continue; }
                let k, guard = 0;
                do { k = rndKind(); } while (guard++ < 40 && makesMatch(g, r, c, k));
                g[r].push({ k, sp: null, ice: iceSet.has(key(r, c)) });
              }
            }
            if (!anyMatch(g) && findMove(g)) return g;
          }
          return g;
        }
        function buildStage(drop) {
          const mp = MAPS[mapIdx];
          NR = mp.m.length; NC = mp.m[0].length;

          boardEl.innerHTML = `<div class="gm-cells"></div>`;
          boardEl.dataset.nr = NR; boardEl.dataset.nc = NC;

          let html = "";
          for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) if (mask[r][c]) html += `<div class="gm-cell${(r + c) % 2 ? " is-alt" : ""}" data-r="${r}" data-c="${c}"></div>`;
          cellsEl.innerHTML = html;
          board = []; stoneHp = []; stoneEl = [];

        function cellAt(e) {
          const rc = boardEl.getBoundingClientRect();
          const c = Math.floor((e.clientX - rc.left) / S), r = Math.floor((e.clientY - rc.top) / S);
          return valid(r, c) && board[r][c] ? [r, c] : null;
        }
        boardEl.addEventListener("pointerdown", (e) => {
          if (state !== "play" || busy) return;
          const cell = cellAt(e); if (!cell) return;
          e.preventDefault();
          if (!movable(...cell)) { clearSel(); nope(...cell); return; }
          drag = { cell, x: e.clientX, y: e.clientY, id: e.pointerId };
          try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
        });
        boardEl.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < S * 0.32) return;
          const [r, c] = drag.cell;
          const to = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
          drag = null;
          if (valid(...to) && board[to[0]][to[1]]) trySwap([r, c], to);
        });
        const up = (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const cell = drag.cell; drag = null;
          if (e.type !== "pointerup" || state !== "play" || busy) return;
          if (!sel) { sel = cell; board[cell[0]][cell[1]].el.classList.add("is-sel"); sfx("select"); return; }
          if (sel[0] === cell[0] && sel[1] === cell[1]) { clearSel(); sfx("tap"); return; }
          if (Math.abs(sel[0] - cell[0]) + Math.abs(sel[1] - cell[1]) === 1) { const a = sel; clearSel(); trySwap(a, cell); return; }
          clearSel(); sel = cell; board[cell[0]][cell[1]].el.classList.add("is-sel"); sfx("select");
        };
        boardEl.addEventListener("pointerup", up);
        boardEl.addEventListener("pointercancel", up);
        boardEl.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
          // 게임 중 스페이스·방향키로 페이지가 움직이지 않게 (입력창은 그대로)
          const tag = e.target && e.target.tagName;
          if (state !== "idle" && state !== "over" && tag !== "INPUT" && tag !== "TEXTAREA" && [" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
          if (state === "pause" && (e.key === "p" || e.key === "P" || e.key === "Escape")) { e.preventDefault(); resume(); }
          else if (state === "play" && (e.key === "p" || e.key === "P" || e.key === "Escape")) { e.preventDefault(); pause(); }
        });
        document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
        // 공통 틀이 stage 폭을 바꾸면 바로 다시 그린다 (늦게 그리면 틀이 옛 비율로 폭을 다시 재서 출렁인다)
        window.addEventListener("resize", layout);

        ctx.onRestart(startGame);
        ctx.onPause(pause);
        showStart();
        requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });
      },
    });
  </script>
</body>
</html>
