<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>한국어 능력시험 — 게임 라운지</title>

  <style>
    .gm-ko { --gm-a: #b45309; --gm-b: #e9a20c; --gm-ink: #92400e; --gm-soft: #fff7e6; --gm-line: #f3d9a4;
      --gm-ok: #16a34a; --gm-ok-soft: #ecfdf3; --gm-ng: #e5484d; --gm-ng-soft: #fff1f1;
      --gm-fs: 16px; --gm-qs: 21px;
      position: relative; background: var(--surface-card, #fff); border: 1px solid var(--color-mist-border, #e3e8f0); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(180, 83, 9, .10); }
    .gm-ko__top { display: flex; align-items: center; gap: 10px; padding: 13px 18px; color: #fff; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); }
    .gm-ko__top b { font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .gm-ko__dots { flex: 1; display: flex; gap: 4px; min-width: 0; max-width: 260px; }
    .gm-ko__dot { flex: 1 1 0; max-width: 10px; min-width: 3px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); }
    .gm-ko__dot.is-now { background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
    .gm-ko__dot.is-ok { background: #fff; }
    .gm-ko__dot.is-ng { background: rgba(70, 25, 0, .38); }
    .gm-ko__score { margin-left: auto; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.22); padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .gm-ko__body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .gm-ko__meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
    .gm-ko__type { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--gm-soft); color: var(--gm-ink); font-weight: 700; }
    .gm-ko__lv { padding: 3px 8px; border-radius: 999px; font-weight: 700; font-size: 12px; background: var(--color-mist, #f3f6fa); color: var(--text-secondary); }
    .gm-ko__lv.lv-2 { background: #fef3c7; color: #92400e; }
    .gm-ko__lv.lv-3 { background: #ffe4e0; color: #b42318; }
    .gm-ko__lv.lv-4 { background: #7f1d1d; color: #fff; }
    .gm-ko__neg { font-style: normal; color: #b42318; text-decoration: underline; text-underline-offset: 4px; }
    .gm-ko__streak { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; color: #c2410c; }

    .gm-ko__q { min-height: 92px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px 16px; border-radius: 14px; background: var(--color-mist, #f3f6fa); text-align: center; word-break: keep-all; }
    .gm-ko__ask { font-size: 13px; font-weight: 700; color: var(--gm-ink); }
    .gm-ko__qt { margin: 0; font-size: var(--gm-qs); line-height: 1.5; font-weight: 700; color: var(--color-midnight-navy); }
    .gm-ko__blank { display: inline-block; min-width: 3.2em; margin: 0 2px; padding: 0 6px; border-bottom: 3px solid var(--gm-a); color: transparent; line-height: 1.2; }
    .gm-ko__blank.is-filled { color: var(--gm-ok); border-color: var(--gm-ok); min-width: 0; animation: gm-ko-pop .28s ease-out; }

    .gm-ko__opts { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .gm-ko__opts.is-grid { grid-template-columns: 1fr 1fr; }
    .gm-ko__opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--border-default, #d6dde8); background: #fff; color: var(--color-midnight-navy); font: inherit; font-size: var(--gm-fs); font-weight: 600; line-height: 1.4; text-align: left; cursor: pointer; word-break: keep-all; transition: border-color .12s, background .12s, transform .08s; }
    .gm-ko__opt:hover:not([disabled]) { border-color: var(--gm-b); background: var(--gm-soft); }
    .gm-ko__opt:active:not([disabled]) { transform: scale(.985); }
    .gm-ko__opt[disabled] { cursor: default; }
    .gm-ko__num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--gm-soft); color: var(--gm-ink); font-size: 13.5px; font-weight: 800; }
    .gm-ko__txt { flex: 1; min-width: 0; }
    .gm-ko__mark { flex-shrink: 0; display: inline-flex; }
    .gm-ko__opt.is-picked { border-color: var(--gm-a); background: var(--gm-soft); }
    .gm-ko__opt.is-correct { border-color: var(--gm-ok); background: var(--gm-ok-soft); }
    .gm-ko__opt.is-correct .gm-ko__num { background: var(--gm-ok); color: #fff; }
    .gm-ko__opt.is-wrong { border-color: var(--gm-ng); background: var(--gm-ng-soft); animation: gm-ko-shake .35s; }
    .gm-ko__opt.is-wrong .gm-ko__num { background: var(--gm-ng); color: #fff; }
    .gm-ko__opt.is-dim { opacity: .5; }

    .gm-ko__fb { min-height: 78px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--color-mist-border, #e3e8f0); }
    .gm-ko__hint { font-size: 13.5px; color: var(--text-muted, #8a94a6); text-align: center; }
    .gm-ko__fb.is-ok { border: 0; background: var(--gm-ok-soft); animation: gm-ko-fade .18s ease-out; }
    .gm-ko__fb.is-ng { border: 0; background: var(--gm-ng-soft); animation: gm-ko-fade .18s ease-out; }
    .gm-ko__fb-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 15.5px; font-weight: 800; color: var(--color-midnight-navy); }
    .gm-ko__fb.is-ok .gm-ko__fb-head { color: #087a35; }
    .gm-ko__fb.is-ng .gm-ko__fb-head { color: #b42318; }
    .gm-ko__fb-head em { font-style: normal; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: #fff; color: #c2410c; }
    .gm-ko__fb p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--text-secondary); word-break: keep-all; }

    /* 일시정지 */
    .gm-ko__pause { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255, 247, 230, .97); text-align: center; padding: 20px; }
    .gm-ko__pause b { font-size: 20px; color: var(--color-midnight-navy); }

    /* 시작 · 요약 */
    .gm-ko__intro { padding: 26px 22px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .gm-ko__date { font-size: 13px; font-weight: 700; color: var(--gm-ink); background: var(--gm-soft); padding: 5px 12px; border-radius: 999px; }
    .gm-ko__demo { width: 100%; max-width: 360px; padding: 14px; border-radius: 14px; background: var(--color-mist, #f3f6fa); display: flex; flex-direction: column; gap: 10px; }
    .gm-ko__demo-q { font-size: 17px; font-weight: 700; color: var(--color-midnight-navy); }
    .gm-ko__demo-q span { display: inline-block; min-width: 2.6em; border-bottom: 3px solid var(--gm-a); }
    .gm-ko__demo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .gm-ko__demo-row span { display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 10px; background: #fff; border: 2px solid var(--border-default, #d6dde8); font-weight: 700; color: var(--color-midnight-navy); }
    .gm-ko__demo-row span.is-ok { border-color: var(--gm-ok); background: var(--gm-ok-soft); color: #087a35; }
    .gm-ko__h { margin: 0; font-size: 24px; color: var(--color-midnight-navy); }
    .gm-ko__rules { margin: 0; padding: 14px 16px; list-style: none; width: 100%; max-width: 440px; text-align: left; border-radius: 12px; background: var(--color-mist, #f3f6fa); display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.5; color: var(--text-secondary); word-break: keep-all; }
    .gm-ko__rules li { display: flex; gap: 8px; }
    .gm-ko__rules li > span:first-child { flex-shrink: 0; width: 18px; height: 18px; border-radius: 6px; margin-top: 2px; background: var(--gm-soft); color: var(--gm-ink); font-size: 11.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .gm-ko__rules b { color: var(--color-midnight-navy); }
    .gm-ko__note { width: 100%; max-width: 440px; padding: 10px 14px; border-radius: 12px; background: #fff7e6; color: #9a6400; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; }
    .gm-ko__start { min-width: 200px; height: 52px; border: 0; border-radius: 14px; color: #fff; font: inherit; font-size: 17px; font-weight: 800; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); box-shadow: 0 6px 18px rgba(180, 83, 9, .28); cursor: pointer; }
    .gm-ko__start:hover:not([disabled]) { filter: brightness(1.05); }
    .gm-ko__start[disabled] { opacity: .6; cursor: default; }
    .gm-ko__sum-big { font-size: 40px; font-weight: 800; color: var(--color-midnight-navy); letter-spacing: -.02em; line-height: 1.1; }
    .gm-ko__sum-big small { font-size: 18px; color: var(--text-secondary); font-weight: 700; }
    .gm-ko__calc { width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr auto; gap: 6px 0; font-size: 14px; color: var(--text-secondary); padding: 12px 16px; border-radius: 12px; background: var(--color-mist, #f3f6fa); text-align: left; box-sizing: border-box; }
    .gm-ko__calc b { color: var(--color-midnight-navy); text-align: right; font-variant-numeric: tabular-nums; }
    .gm-ko__calc .is-total { border-top: 1px solid var(--color-mist-border, #e3e8f0); padding-top: 6px; font-weight: 800; color: var(--color-midnight-navy); }
    .gm-ko__review { width: 100%; max-width: 520px; max-height: min(42vh, 420px); overflow-y: auto; border-radius: 12px; border: 1px solid var(--color-mist-border, #e3e8f0); text-align: left; overscroll-behavior: contain; }
    .gm-ko__review ol { margin: 0; padding: 0; list-style: none; }
    .gm-ko__review li { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--color-mist-border, #e3e8f0); }
    .gm-ko__review li:last-child { border-bottom: 0; }
    .gm-ko__review li > i, .gm-ko__review li > svg { flex-shrink: 0; margin-top: 2px; }
    .gm-ko__rv { min-width: 0; display: flex; flex-direction: column; gap: 3px; word-break: keep-all; }
    .gm-ko__rv-tag { font-size: 12px; font-weight: 700; color: var(--gm-ink); }
    .gm-ko__rv-q { font-size: 14.5px; font-weight: 700; color: var(--color-midnight-navy); line-height: 1.45; }
    .gm-ko__rv-q mark { background: none; color: #087a35; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .gm-ko__rv-a { font-size: 13.5px; color: var(--text-secondary); }
    .gm-ko__rv-a b { color: #087a35; }
    .gm-ko__rv-a s { color: #b42318; }
    .gm-ko__rv-e { font-size: 13px; line-height: 1.5; color: var(--text-secondary); }

    .gm-ko.is-narrow .gm-ko__body { padding: 14px 14px 16px; gap: 12px; }
    .gm-ko.is-narrow .gm-ko__intro { padding: 22px 14px 20px; }
    .gm-ko.is-narrow .gm-ko__top { padding: 12px 14px; gap: 8px; }
    .gm-ko.is-narrow .gm-ko__dots { gap: 3px; }
    .gm-ko.is-narrow .gm-ko__dot { height: 6px; }
    .gm-ko.is-narrow .gm-ko__opt { gap: 10px; padding: 10px 12px; }
    .gm-ko.is-narrow .gm-ko__h { font-size: 21px; }

    @keyframes gm-ko-pop { 0% { transform: scale(.8); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes gm-ko-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
    @keyframes gm-ko-fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // [유형, 난이도(2 보통 · 3 어려움 · 4 아주 어려움), 문제(＿＿ = 빈칸, 비우면 유형 기본 질문), 정답, [오답…], 해설(규칙), 겹치지 않게 할 묶음]
    // 표준국어대사전 · 한글 맞춤법 · 표준어 규정 · 외래어 표기법 · 표준 언어 예절 기준으로 확실한 것만.
    // 복수 표준어(짜장면/자장면, 만날/맨날, -길래, 개발새발 등)는 오답 보기로 쓰지 않는다. 오답은 실제로 자주 틀리는 꼴로.
    const BANK = [
      // ── 맞춤법: 헷갈리는 짝 ──
      ["spell", 3, "맞춤법이 바른 문장은?", "그는 팀장으로서 책임을 다했어요", ["갈등을 대화로서 풀었어요", "이로서 회의를 마치겠습니다", "쌀로서 떡을 빚었어요"], "자격·신분은 ‘로서’, 수단·재료나 ‘이것으로써’는 ‘로써’를 써요(대화로써·이로써·쌀로써).", "roseo"],
      ["spell", 3, "회사가 ＿＿ 직원들이 뿔뿔이 흩어졌어요.", "결딴나서", ["결단나서", "결단 나서", "결딴 나서"], "아주 망가져 손쓸 수 없게 되는 건 한 단어 ‘결딴나다’예요. ‘결단’은 결정을 내린다는 뜻이에요."],
      ["spell", 3, "그는 얼굴에 미소를 ＿＿ 다가왔어요.", "띠고", ["띄고", "띠우고"], "빛깔·감정·기운을 나타내는 건 ‘띠다’, 눈에 보이거나 사이를 벌리는 건 ‘띄다(뜨이다·띄우다)’예요.", "tti"],
      ["spell", 3, "맞춤법이 바른 문장은?", "붉은빛을 띤 노을이 아름다워요", ["작은 실수가 자꾸 눈에 띠어요", "단어 사이를 한 칸 띠어 쓰세요", "중요한 임무를 띄고 출장을 갔어요"], "빛깔·임무·기운은 ‘띠다’, 눈에 보이는 것(뜨이다)과 사이를 벌리는 것(띄우다)은 ‘띄다’예요.", "tti"],
      ["spell", 2, "맞춤법이 바른 문장은?", "편지를 부치러 우체국에 갔어요", ["봉투에 우표를 부쳤어요", "그 안건을 회의에 붙였어요", "요즘 일이 힘에 붙여요"], "보내기·회의에 넘기기·힘이 모자람은 ‘부치다’, 맞닿게 하는 건 ‘붙이다’예요.", "buchi"],
      ["spell", 2, "맞춤법이 바른 문장은?", "고무줄을 당겨 길게 늘였어요", ["사업 규모를 두 배로 늘였어요", "실력을 늘이려고 매일 연습해요", "쉬는 시간을 10분 늘였어요"], "본디보다 길이를 길게 하는 건 ‘늘이다’, 수·양·시간·힘을 많게 하는 건 ‘늘리다’예요.", "neul"],
      ["spell", 2, "맞춤법이 바른 문장은?", "허리를 반듯이 펴고 앉으세요", ["약속은 반듯이 지킬게요", "내일까지 반듯이 제출하세요", "이번엔 반듯이 해내고 말 거예요"], "‘꼭·틀림없이’는 ‘반드시’, ‘비뚤어지지 않고 바르게’는 ‘반듯이’예요.", "bandeusi"],
      ["spell", 2, "맞춤법이 바른 문장은?", "퀴즈의 정답을 모두 맞혔어요", ["화살로 과녁 한가운데를 맞췄어요", "친구와 시험 답을 맞혀 봤어요", "깨진 조각을 맞혀 꽃병을 고쳤어요"], "적중시키는 건 ‘맞히다’(정답·과녁), 나란히 대어 비교하거나 짝을 맞게 하는 건 ‘맞추다’예요.", "match"],
      ["spell", 3, "맞춤법이 바른 문장은?", "오래 앉아 있었더니 다리가 저려요", ["배추를 소금물에 저렸어요", "생선을 소금에 저려 두세요", "다리가 절여서 못 일어나겠어요"], "피가 잘 안 통해 감각이 둔한 건 ‘저리다’, 소금·식초에 담가 간이 배게 하는 건 ‘절이다’예요.", "jeori"],
      ["spell", 3, "이것으로 축사를 ＿＿합니다.", "갈음", ["가름", "가늠"], "‘다른 것으로 대신함’은 ‘갈음’, ‘나누거나 승부를 정함’은 ‘가름’, ‘헤아려 봄’은 ‘가늠’이에요.", "gareum"],
      ["spell", 4, "종료 직전에 터진 골이 승부를 ＿＿했어요.", "가름", ["갈음", "가늠"], "승부나 등수를 정하는 건 ‘가름’, 대신하는 건 ‘갈음’, 헤아려 보는 건 ‘가늠’이에요.", "gareum"],
      ["spell", 4, "맞춤법이 바른 문장은?", "더 이상 부모님 속을 썩이지 않을게요", ["아까운 재능을 썩이고 있어요", "남은 돈을 통장에 썩이고만 있어요", "음식물 쓰레기를 썩여 퇴비를 만들어요"], "걱정으로 마음을 괴롭게 하는 건 ‘썩이다’, 물건이 상하거나 재능·돈이 쓰이지 못하게 하는 건 ‘썩히다’예요.", "sseok"],
      ["spell", 3, "맞춤법이 바른 문장은?", "우산을 받쳐 들고 걸어갔어요", ["트럭이 자전거를 받쳤어요", "평생을 연구에 받쳤어요", "쟁반에 찻잔을 바쳐 들고 왔어요"], "밑을 괴거나 우산을 펴 드는 건 ‘받치다’, 드리거나 내놓는 건 ‘바치다’, 들이받음을 당하는 건 ‘받히다’예요.", "bachi"],

      ["loan", 3, "서류는 ＿＿에 넣어 두세요.", "캐비닛", ["캐비넷", "케비넷", "케비닛"], "외래어 표기법에 따라 ‘캐비닛’으로 적어요.", "l24"],
      ["loan", 3, "＿＿ 컴퓨터를 새로 샀어요.", "데스크톱", ["데스크탑", "데스크탭"], "외래어 표기법에 따라 ‘데스크톱’으로 적어요(랩톱도 같아요).", "l24"],
      ["loan", 3, "카메라 ＿＿가 번쩍 터졌어요.", "플래시", ["플래쉬", "후레쉬", "플레시"], "끝소리 [ʃ]는 ‘시’로 적어 ‘플래시’예요.", "l25"],
      ["loan", 4, "＿＿에 진열된 옷이 예뻐요.", "쇼윈도", ["쇼윈도우", "쑈윈도"], "외래어 표기법에 따라 ‘쇼윈도’로 적어요.", "l25"],
      ["loan", 4, "＿＿ 사이즈로 주세요.", "스탠더드", ["스탠다드", "스텐다드"], "외래어 표기법에 따라 ‘스탠더드’로 적어요.", "l25"],
    ];

    HKPlay.mountGame({
      key: "korean",
      setup(stage, ctx) {
        const COUNT = 20, FEEDBACK_MS = 1500, JUDGE_MS = 180;
        const PER_OK = 100, STREAK_N = 3, STREAK_BONUS = 50;
        const MIX = { 2: 6, 3: 10, 4: 4 }; // 보통 6 · 어려움 10 · 아주 어려움 4
        const TYPES = {
          spell: { label: "맞춤법", icon: "spell-check", ask: "맞춤법이 바른 것은?" },
          space: { label: "띄어쓰기", icon: "space", ask: "띄어쓰기가 바른 문장은?" },
          std: { label: "표준어", icon: "badge-check", ask: "표준어는 어느 것일까요?" },
          word: { label: "어휘", icon: "book-open", ask: "알맞은 것을 고르세요" },
          manner: { label: "높임말·예절", icon: "handshake", ask: "알맞은 표현은?" },
          loan: { label: "외래어 표기", icon: "globe", ask: "외래어 표기가 바른 것은?" },
        };
        const LV = ["", "", "보통", "어려움", "아주 어려움"];
        const BLANK = "＿＿";
        const esc = (s) => HKUI.escapeHtml(String(s));
        const coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;

        function shuffleWith(r, arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(r() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        // ── 날마다 다른 문제 ──
        // 난이도마다 문제 은행을 고정 시드로 섞은 순열을 만들고, 기준일(2026-10-27)부터 d번째 날은
        // 각 순열의 [d·n, d·n+n) 구간(보통 6 · 어려움 10 · 아주 어려움 4)을 낸다 → 한 주기(CYCLE일) 동안 같은 문항이 다시 나오지 않는다.
        // 은행 끝에 닿으면(다음 주기) 시드를 바꿔 다시 섞는다. 같은 날은 모든 직원이 같은 문제(날짜는 ctx.today 기준),
        // 하루 안의 순서·보기 순서는 ctx.rng() 로 섞는다.
        const EPOCH = Date.UTC(2026, 9, 27);
        const POOL = { 2: [], 3: [], 4: [] };
        BANK.forEach((b, i) => POOL[b[1]].push(i));
        const CYCLE = Math.min(...[2, 3, 4].map((lv) => Math.floor(POOL[lv].length / MIX[lv])));

        function dayIndex(iso) {
          const [y, m, d] = iso.split("-").map(Number);
          return Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 86400000);
        }

        // 한 주기의 날짜별 문항 — 유형이 고루 퍼지게 섞고, 같은 규칙(묶음)이 한날에 겹치면 다른 날 문항과 맞바꾼다
        function cyclePlan(cycle) {
          const days = Array.from({ length: CYCLE }, () => []);
          for (const lv of [2, 3, 4]) {
            const r = HKPlay.seededRng(`korean-bank:${cycle}:${lv}`);
            const byType = {};
            POOL[lv].forEach((i) => (byType[BANK[i][0]] = byType[BANK[i][0]] || []).push(i));
            const keyed = [];
            Object.values(byType).forEach((arr) => {
              shuffleWith(r, arr);
              arr.forEach((i, k) => keyed.push([i, (k + r()) / arr.length]));
            });
            const perm = keyed.sort((a, b) => a[1] - b[1]).map((x) => x[0]);
            const n = MIX[lv];
            const slots = []; // [day, 자리] — 남는 문항은 day = -1 (예비)
            perm.forEach((i, k) => slots.push({ day: k < CYCLE * n ? Math.floor(k / n) : -1, i }));
            slots.forEach((sl) => sl.day >= 0 && days[sl.day].push(sl));
          }
          // 묶음 겹침 고치기 (같은 난이도끼리만 맞바꿔 난이도 구성은 그대로)
          const groupsOf = (d, except) => new Set(days[d].filter((sl) => sl !== except).map((sl) => BANK[sl.i][6]).filter(Boolean));
          for (let d = 0; d < CYCLE; d++) {
            const seen = new Set();
            for (const sl of days[d]) {
              const g = BANK[sl.i][6];
              if (!g || !seen.has(g)) { if (g) seen.add(g); continue; }
              const here = groupsOf(d, sl);
              for (let d2 = d + 1; d2 < CYCLE; d2++) {
                const other = days[d2].find((o) => {
                  const og = BANK[o.i][6];
                  return BANK[o.i][1] === BANK[sl.i][1] && (!og || !here.has(og)) && !groupsOf(d2, o).has(g);
                });
                if (other) { [sl.i, other.i] = [other.i, sl.i]; break; }
              }
              if (BANK[sl.i][6]) seen.add(BANK[sl.i][6]);
            }
          }
          return days.map((list) => list.map((sl) => sl.i));
        }

        function questionsForDay(iso, r) {
          const d = dayIndex(iso);
          const cycle = Math.floor(d / CYCLE);
          const ids = cyclePlan(cycle)[d - cycle * CYCLE];
          // 보통 → 어려움 → 아주 어려움, 같은 난이도 안에서는 섞고 같은 유형이 연달아 나오지 않게
          const list = [];
          for (const lv of [2, 3, 4]) list.push(...shuffleWith(r, ids.filter((i) => BANK[i][1] === lv)));
          for (let k = 1; k < list.length; k++) {
            if (BANK[list[k]][0] !== BANK[list[k - 1]][0]) continue;
            for (let j = k + 1; j < list.length && BANK[list[j]][1] === BANK[list[k]][1]; j++) {
              if (BANK[list[j]][0] !== BANK[list[k - 1]][0]) { [list[k], list[j]] = [list[j], list[k]]; break; }
            }
          }
          return list.map((i) => {
            const [t, dLv, q, a, w, e] = BANK[i];
            return { id: i, t, d: dLv, q, a, e, opts: shuffleWith(r, [a, ...w]) };
          });
        }
        const todaysQuestions = () => questionsForDay(ctx.today, ctx.rng("bank"));

        let qs = [], idx = 0, results = [], streak = 0;
        let timer = 0;
        let phase = "intro"; // intro | play | judge | feedback | paused | done

        const totalScore = () => results.reduce((s, r) => s + r.pts + r.bonus, 0);

        function formatDate(iso) {

          const wd = "일월화수목금토"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
          return `${m}월 ${d}일 (${wd})`;
        }

        // 문제 글 — 빈칸(＿＿)은 밑줄 칸으로, 답을 낸 뒤에는 정답으로 채운다

        // stage 폭에 맞춰 글자 크기와 보기 배치(2열/1열)를 다시 정한다 — 공통 틀이 폭을 바꾸면 resize 가 온다
        function layout() {

        // ── 시작 화면 ──

                <li><span>2</span><span>시간 제한 없이 천천히 풀어요. PC는 숫자 <b>1~4</b> 키나 클릭, 휴대폰은 보기를 눌러요.</span></li>
                <li><span>3</span><span>정답 <b>${PER_OK}점</b> · <b>${STREAK_N}연속</b> 정답마다 <b>+${STREAK_BONUS}</b></span></li>

          stage.querySelector("[data-start]").onclick = async (e) => {

        function startGame() {

        // ── 문제 화면 ──

              <div class="gm-ko__fb" data-fb><span class="gm-ko__hint">${coarse ? "보기를 눌러 골라요" : `숫자 1~${q.opts.length} 키나 클릭으로 골라요`}</span></div>

        // 보기를 고르면 잠깐 표시하고(선택음) 곧바로 채점
        function choose(i) {
          if (phase !== "play" || i < 0 || i >= qs[idx].opts.length) return;
          stopLoops();
          phase = "judge";
          ctx.sfx("select");
          const btns = stage.querySelectorAll(".gm-ko__opt");
          btns.forEach((b) => (b.disabled = true));
          btns[i]?.classList.add("is-picked");

        }

        function reveal(i) {
          if (phase !== "play" && phase !== "judge") return;
          stopLoops();
          phase = "feedback";
          const q = qs[idx];
          const ok = i >= 0 && q.opts[i] === q.a;
          const pts = ok ? PER_OK : 0;
          streak = ok ? streak + 1 : 0;
          const bonus = ok && streak % STREAK_N === 0 ? STREAK_BONUS : 0;
          results[idx] = { ok, pts, bonus, pick: i >= 0 ? q.opts[i] : null };
          if (ok) ctx.sfx(streak >= 2 ? "combo" : "success", Math.min(streak, 10));
          else ctx.sfx("fail");

          // 보기 색칠 — 정답은 초록, 고른 오답은 빨강
          stage.querySelectorAll(".gm-ko__opt").forEach((b, k) => {
            b.disabled = true;
            b.classList.remove("is-picked");
            const mark = b.querySelector("[data-mark]");
            if (q.opts[k] === q.a) {
              b.classList.add("is-correct");
              mark.innerHTML = HKUI.icon("circle-check", 20, "var(--gm-ok)");
            } else if (k === i) {

              b.classList.add("is-dim");

          });

            ? `<div class="gm-ko__fb-head">${HKUI.icon("check", 18, "currentColor")} 정답이에요! +${pts}점${bonus ? ` <em>${streak}연속 보너스 +${bonus}</em>` : ""}</div><p>${esc(q.e)}</p>`
            : `<div class="gm-ko__fb-head">${HKUI.icon("x", 18, "currentColor")} 아쉬워요 · 정답은 ‘${esc(q.a)}’</div><p>${esc(q.e)}</p>`;

          stopLoops();

          const okCount = results.filter((r) => r.ok).length;

          const review = qs.map((q, i) => {
            const r = results[i];
            const ty = TYPES[q.t];
            const qText = !q.q ? esc(ty.ask) : q.q.includes(BLANK) ? q.q.split(BLANK).map(esc).join(`<mark>${esc(q.a)}</mark>`) : esc(q.q);
            const showAnswer = !q.q || !q.q.includes(BLANK);
            const mine = r.ok ? "" : ` · 내 답 <s>${esc(r.pick)}</s>`;
            return `<li>
              ${HKUI.icon(r.ok ? "circle-check" : "circle-x", 20, r.ok ? "#16a34a" : "#94a3b8")}
              <div class="gm-ko__rv">
                <span class="gm-ko__rv-tag">${i + 1}번 · ${ty.label} · ${LV[q.d]}${r.ok ? ` · +${r.pts + r.bonus}점` : ""}</span>
                <span class="gm-ko__rv-q">${qText}</span>
                ${showAnswer || !r.ok ? `<span class="gm-ko__rv-a">${showAnswer ? `정답 <b>${esc(q.a)}</b>` : `정답 <b>${esc(q.a)}</b>`}${mine}</span>` : ""}
                <span class="gm-ko__rv-e">${esc(q.e)}</span>
              </div>
            </li>`;
          }).join("");
          stage.innerHTML = `<div class="gm-ko">
            <div class="gm-ko__intro">
              <span class="gm-ko__date">${formatDate(ctx.today)} · 오늘의 ${COUNT}문제</span>
              <div class="gm-ko__sum-big">${okCount}<small> / ${qs.length} 정답</small></div>
              <div class="gm-ko__calc">
                <span>정답 ${okCount}개 × ${PER_OK}</span><b>${okCount * PER_OK}</b>
                <span>연속 정답 보너스</span><b>+${streakBonus}</b>
                <span class="is-total">합계</span><b class="is-total">${score.toLocaleString("ko-KR")}점</b>
              </div>
              <div class="gm-ko__review" tabindex="0" aria-label="문제별 해설"><ol>${review}</ol></div>
              <button type="button" class="gm-ko__start" data-again>처음 화면으로</button>
            </div>
          </div>`;
          stage.querySelector("[data-again]").onclick = showIntro;
          HKUI.refreshIcons(stage);
          layout();
          setTimeout(() => ctx.submit(score), 600);
        }

        // ── 일시정지 (탭을 떠나면) ──
        function pause() {
          if (phase !== "play") return;
          stopLoops();
          phase = "paused";
          const p = document.createElement("div");
          p.className = "gm-ko__pause";
          p.innerHTML = `${HKUI.icon("pause", 30, "#b45309")}<b>잠시 멈췄어요</b><span style="font-size:14px;color:var(--text-secondary)">돌아오면 이어서 풀 수 있어요</span><button type="button" class="gm-ko__start" data-resume>이어서 하기</button>`;
          stage.querySelector(".gm-ko").appendChild(p);
          HKUI.refreshIcons(p);
          p.querySelector("[data-resume]").onclick = () => {
            p.remove();
            phase = "play";
          };
        }
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) pause();
        });

        // PC — 숫자 1~4 (윗줄·숫자 패드)
        window.addEventListener("keydown", (e) => {
          if (phase !== "play" || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
          const tag = (e.target && e.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA" || e.target.isContentEditable) return;
          const m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code || "") || /^([1-4])$/.exec(e.key || "");
          if (!m) return;
          e.preventDefault();
          choose(+m[1] - 1);
        });

        ctx.onRestart(showIntro);
        ctx.onPause(pause);
        showIntro();
      },
    });
  </script>
</body>
</html>
