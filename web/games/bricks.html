<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    /* 벽돌 깨기 — 끌어서 조준하고 공을 한꺼번에 날리는 방식 */
    .gm-shell { margin: 0 auto; max-width: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .gm-hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px 16px 0 0; background: linear-gradient(135deg, #c2410c, #fb923c); color: #fff; }
    .gm-hud__item { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .gm-hud__item small { font-size: 11px; opacity: .8; font-weight: 600; }
    .gm-hud__item b { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .gm-hud__mid { align-items: center; }
    .gm-hud__right { align-items: flex-end; }
    .gm-screen { position: relative; border-radius: 0 0 16px 16px; overflow: hidden; background: #1c1917; }
    .gm-canvas { display: block; touch-action: none; cursor: crosshair; }
    .gm-recall { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px; border: 0; border-radius: 999px; background: rgba(255,255,255,.14); color: #fed7aa; font-size: 12.5px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .gm-recall[hidden] { display: none; }
    .gm-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; overflow-y: auto; background: rgba(28, 25, 23, .55); backdrop-filter: blur(2px); cursor: default; }
    .gm-overlay[hidden] { display: none; }
    .gm-card { width: 100%; max-width: 320px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 18px 16px 16px; border-radius: 16px; background: rgba(255,255,255,.97); color: var(--color-midnight-navy, #0f172a); text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .gm-card h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
    .gm-card p { word-break: keep-all; margin: 0 0 10px; font-size: 13.5px; line-height: 1.55; color: var(--text-secondary, #475569); }
    .gm-card .gm-big { font-size: 34px; font-weight: 800; margin: 2px 0 8px; color: #c2410c; }
    .gm-items { display: grid; grid-template-columns: 1fr; gap: 5px; margin: 4px 0 10px; text-align: left; }
    .gm-items div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-secondary, #475569); }
    .gm-pill { flex-shrink: 0; min-width: 26px; text-align: center; padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 800; color: #fff; }
    .gm-keys { font-size: 12px; color: var(--text-muted, #64748b); margin: 0 0 14px; line-height: 1.6; }
    .gm-keys kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border-radius: 5px; border: 1px solid #cbd5e1; background: #f8fafc; font: 600 11px/1.5 inherit; }
    .gm-go { width: 100%; border: 0; padding: 12px; border-radius: 12px; font-size: 15.5px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #c2410c, #fb923c); }
    .gm-go:focus-visible { outline: 3px solid #fed7aa; outline-offset: 2px; }
    .gm-note { margin-top: 10px; font-size: 12px; color: var(--text-muted, #64748b); text-align: center; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "bricks",
    setup(stage, ctx) {
      const W = 360, H = 540;
      const COLS = 7, CELL = W / COLS, GAP = 3;
      const TOP = 30;                 // 맨 윗줄 y
      const ROWS = 9;                 // 이 줄(맨 아래)까지 내려오면 끝
      const FLOOR = TOP + ROWS * CELL + 8; // 공이 떨어지는 바닥
      const R = 8;                    // 공 반지름
      const SPEED = 600;              // 공 빠르기 (px/초)
      const GAP_T = 0.07;             // 공을 한 줄로 내보내는 간격
      const MIN_ANGLE = (8 * Math.PI) / 180;
      const FONT = "Pretendard, system-ui, sans-serif";

      stage.innerHTML = `
        <div class="gm-shell">
          <div class="gm-hud">
            <div class="gm-hud__item"><small>점수</small><b data-score>0</b></div>
            <div class="gm-hud__item gm-hud__mid"><small>단계</small><b data-level>1</b></div>
            <div class="gm-hud__item gm-hud__right"><small>공</small><b data-balls>1</b></div>
          </div>
          <div class="gm-screen">
            <canvas class="gm-canvas" aria-label="벽돌 깨기 게임 화면"></canvas>
            <button type="button" class="gm-recall" data-recall hidden>⤓ 모두 회수</button>
            <div class="gm-overlay" data-overlay></div>
          </div>
          <div class="gm-note">끌어서 조준 · 놓으면 발사 · PC는 마우스로 겨누고 클릭 · ←→ 조준 · Space 발사 · Esc 일시정지</div>
        </div>`;
      const shell = stage.querySelector(".gm-shell");
      const canvas = stage.querySelector("canvas");
      const g = canvas.getContext("2d");
      const overlay = stage.querySelector("[data-overlay]");
      const recallBtn = stage.querySelector("[data-recall]");
      const elScore = stage.querySelector("[data-score]");
      const elLevel = stage.querySelector("[data-level]");
      const elBalls = stage.querySelector("[data-balls]");

      let scale = 1;
      function fit() {
        const sw = stage.clientWidth || W;
        const maxH = Math.max(360, HKPlay.roomFor(stage, canvas));
        const cw = Math.floor(Math.min(sw, (maxH * W) / H));
        const ch = Math.round((cw * H) / W);
        shell.style.width = cw + "px";
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        scale = canvas.width / W;
        draw();
      }

      // ---------- 상태 ----------
      // ready | aim(조준 대기) | fly(공이 날아가는 중) | shift(줄 내려오는 중) | paused | over
      let state = "ready";
      let pausedFrom = null;
      let S = null;
      const keys = { left: false, right: false };

      function sfxGap(name, gap, arg) {
        const k = "_sfx_" + name;
        if (S && S[k] != null && S.t - S[k] < gap) return;
        if (S) S[k] = S.t;
        ctx.sfx(name, arg);
      }

      // 칸 → 화면 좌표
      const cellX = (c) => c * CELL;
      const cellY = (r) => TOP + r * CELL;

      function newGame() {
        S = {
          t: 0, score: 0, level: 0, balls: 1, gained: 0,
          lx: W / 2, nextX: null,          // 발사 자리 · 이번 턴 처음 떨어진 자리
          angle: -Math.PI / 2,             // 조준 각도 (위쪽이 -90°)
          aiming: false,
          bricks: [], items: [], shots: [], parts: [], texts: [], rings: [], shake: 0,
          toFire: 0, fireT: 0, flyT: 0, shiftT: 0,
        };
        nextTurn(true);
      }

      // 새 윗줄 — 단계가 오를수록 벽돌 수·숫자가 커진다
      function spawnRow() {
        const n = S.level;
        const cols = [...Array(COLS).keys()].sort(() => Math.random() - 0.5);
        // 한 줄 벽돌 수 — 처음엔 1~3개, 단계가 오를수록 천천히 늘어 최대 6개
        const want = Math.max(1, Math.min(6, Math.floor(1 + Math.random() * 3 + n / 20)));
        const brickCols = cols.slice(0, want);
        for (const c of brickCols) {
          const tough = n >= 10 && Math.random() < 0.12; // 숫자 두 배 벽돌은 10단계부터 가끔
          const hp = tough ? n * 2 : n;
          S.bricks.push({ r: 0, c, hp, max: hp, tough, flash: 0 });
        }
        const free = cols.slice(want);
        // 공 하나 더 — 거의 매 턴 하나
        if (free.length) S.items.push({ r: 0, c: free.shift(), kind: "ball", hit: false });
        // 3단계부터 줄 번개 — 공이 지나가면 그 가로줄·세로줄 벽돌 모두 1씩
        if (n >= 3 && free.length && Math.random() < 0.3) S.items.push({ r: 0, c: free.shift(), kind: Math.random() < 0.5 ? "row" : "col", hit: false });
        // 5단계부터 회오리 — 공이 지나가면 엉뚱한 위쪽 방향으로 튄다
        if (n >= 5 && free.length && Math.random() < 0.2) S.items.push({ r: 0, c: free.shift(), kind: "swirl", hit: false });
      }

      function nextTurn(first) {
        S.level++;
        if (!first) {
          // 맞은 번개는 사라지고, 모두 한 줄 내려온다
          S.items = S.items.filter((it) => !(it.hit && it.kind !== "ball"));
          for (const b of S.bricks) b.r++;
          for (const it of S.items) it.r++;
          // 못 맞힌 +1 고리도 맨 아래 줄까지 내려오면 저절로 먹는다 — 공이 꾸준히 늘게
          for (const it of S.items) if (it.r >= ROWS - 1 && it.kind === "ball") { S.gained++; S.texts.push({ x: cellX(it.c) + CELL / 2, y: cellY(ROWS - 2), text: "+1 공", life: 0.8 }); }
          S.items = S.items.filter((it) => it.r < ROWS - 1);
          S.shiftT = 0.18;
        }
        spawnRow();
        S.balls += S.gained; S.gained = 0;
        if (S.nextX != null) S.lx = S.nextX;
        S.nextX = null;
        hud();
        if (S.bricks.some((b) => b.r >= ROWS - 1)) return gameOver();
        state = first ? "aim" : "shift";
        if (!first) ctx.sfx("drop");
      }

      // ---------- 조준 ----------
      function aimAt(x, y) {
        let a = Math.atan2(y - (FLOOR - R), x - S.lx);
        if (a > -MIN_ANGLE && a <= Math.PI / 2) a = -MIN_ANGLE;
        else if (a < -Math.PI + MIN_ANGLE || a > Math.PI / 2) a = -Math.PI + MIN_ANGLE;
        S.angle = a;
      }
      const aimValid = (y) => y < FLOOR - 14;

      function fire() {
        if (state !== "aim") return;
        state = "fly";
        S.toFire = S.balls; S.fireT = 0; S.flyT = 0; S.landed = 0;
        S.fireAngle = S.angle;
        S.aiming = false;
        ctx.sfx("shoot");
      }

      // ---------- 갱신 ----------
      function update(dt) {
        S.t += dt;
        for (const b of S.bricks) if (b.flash > 0) b.flash -= dt;
        updateParts(dt);

        if (state === "shift") {
          S.shiftT -= dt;
          if (S.shiftT <= 0) state = "aim";
          return;
        }
        if (state === "aim") {
          if (keys.left) S.angle = Math.max(-Math.PI + MIN_ANGLE, S.angle - 1.4 * dt);
          if (keys.right) S.angle = Math.min(-MIN_ANGLE, S.angle + 1.4 * dt);
          return;
        }
        if (state !== "fly") return;

        S.flyT += dt;
        recallBtn.hidden = S.flyT < 1.5;
        // 내보내기
        if (S.toFire > 0) {
          S.fireT -= dt;
          while (S.toFire > 0 && S.fireT <= 0) {
            S.shots.push({ x: S.lx, y: FLOOR - R, vx: Math.cos(S.fireAngle), vy: Math.sin(S.fireAngle), done: false });
            S.toFire--; S.fireT += GAP_T;
          }
        }
        // 오래 걸리면 점점 빨라진다 (5초부터, 최대 3배)
        const boost = 1 + Math.min(2, Math.max(0, (S.flyT - 5) / 4));
        const dist = SPEED * boost * dt;
        const steps = Math.max(1, Math.ceil(dist / 3));
        for (let i = 0; i < steps; i++) for (const s of S.shots) if (!s.done) moveShot(s, dist / steps);
        S.shots = S.shots.filter((s) => !s.done);
        if (S.toFire === 0 && S.shots.length === 0) endTurn();
      }

      function brickAt(x, y) {
        for (const b of S.bricks) {
          const bx = cellX(b.c) + GAP, by = cellY(b.r) + GAP, s = CELL - GAP * 2;
          if (x + R > bx && x - R < bx + s && y + R > by && y - R < by + s) return b;
        }
        return null;
      }

      function moveShot(s, d) {
        s.trail = s.trail || [];
        if (!s.tt || S.t - s.tt > 0.012) { s.trail.push([s.x, s.y]); if (s.trail.length > 6) s.trail.shift(); s.tt = S.t; }
        // 가로 먼저, 세로 다음 — 부딪힌 축만 뒤집는다
        s.x += s.vx * d;
        if (s.x < R) { s.x = R; s.vx = Math.abs(s.vx); }
        else if (s.x > W - R) { s.x = W - R; s.vx = -Math.abs(s.vx); }
        let b = brickAt(s.x, s.y);
        if (b) { s.x -= s.vx * d; s.vx = -s.vx; hitBrick(b, s.x, s.y); }
        s.y += s.vy * d;
        if (s.y < R) { s.y = R; s.vy = Math.abs(s.vy); }
        b = brickAt(s.x, s.y);
        if (b) { s.y -= s.vy * d; s.vy = -s.vy; hitBrick(b, s.x, s.y); }
        // 거의 수평으로 맴돌지 않게
        if (Math.abs(s.vy) < 0.12) { s.vy = (s.vy < 0 ? -1 : 1) * 0.12; const k = Math.sqrt(1 - 0.0144); s.vx = Math.sign(s.vx || 1) * k; }
        // 아이템
        for (const it of S.items) {
          const cx = cellX(it.c) + CELL / 2, cy = cellY(it.r) + CELL / 2;
          if (Math.hypot(s.x - cx, s.y - cy) > R + CELL * (it.kind === "ball" ? 0.32 : 0.24)) continue;
          if (it.kind === "ball") {
            if (!it.hit) { it.hit = true; S.gained++; S.texts.push({ x: cx, y: cy, text: "+1 공", life: 0.8 }); ctx.sfx("coin"); }
          } else if (it.kind === "swirl") {
            // 같은 공은 한 번 지날 때 한 번만 — 위쪽 아무 방향으로 튄다
            const k = "swirl" + it.c + "," + it.r;
            if (s.lastSwirl === k) continue;
            s.lastSwirl = k; it.hit = true;
            const a = -Math.PI * (0.15 + Math.random() * 0.7);
            s.vx = Math.cos(a); s.vy = Math.sin(a);
            sfxGap("whoosh", 0.1);
          } else if ((s.zapAt || {})[it.kind + it.c + "," + it.r] == null) {
            s.zapAt = s.zapAt || {}; s.zapAt[it.kind + it.c + "," + it.r] = 1;
            it.hit = true;
            S.zaps = S.zaps || [];
            S.zaps.push({ kind: it.kind, r: it.r, c: it.c, life: 0.18 });
            for (const t of S.bricks.slice()) if (it.kind === "row" ? t.r === it.r : t.c === it.c) hitBrick(t);
            sfxGap("laser", 0.08);
          }
        }
        S.items = S.items.filter((it) => !(it.kind === "ball" && it.hit));
        if (s.lastSwirl && !S.items.some((it) => it.kind === "swirl" && "swirl" + it.c + "," + it.r === s.lastSwirl && Math.hypot(s.x - cellX(it.c) - CELL / 2, s.y - cellY(it.r) - CELL / 2) <= R + CELL * 0.3)) s.lastSwirl = null;
        // 바닥
        if (s.y >= FLOOR - R && s.vy > 0) {
          s.done = true;
          if (S.nextX == null) S.nextX = Math.max(R + 2, Math.min(W - R - 2, s.x));
        }
      }

      // 맞으면 벽돌이 움찔하고 숫자가 튀고, 맞은 자리에 불꽃 — 깨지면 조각이 흩어지고 화면이 살짝 흔들린다
      function hitBrick(b, hx, hy) {
        if (b.hp <= 0) return;
        b.hp--; b.flash = 0.07; b.kick = 0.14;
        S.score += 1;
        if (hx != null) for (let i = 0; i < 3; i++) {
          const a = Math.random() * Math.PI * 2, v = 70 + Math.random() * 90;
          S.parts.push({ x: hx, y: hy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.22, max: 0.22, color: "#fff7ed", size: 2.5 });
        }
        if (b.hp <= 0) {
          S.score += 10;
          S.bricks = S.bricks.filter((x) => x !== b);
          burst(cellX(b.c) + CELL / 2, cellY(b.r) + CELL / 2, brickColor(b));
          S.rings.push({ x: cellX(b.c) + CELL / 2, y: cellY(b.r) + CELL / 2, life: 0.3 });
          S.shake = Math.min(5, (S.shake || 0) + 2.2);
          sfxGap("pop", 0.035);
        } else sfxGap("tap", 0.025);
        hud();
      }

      function endTurn() {
        recallBtn.hidden = true;
        // 판을 다 비우면 보너스
        if (S.bricks.length === 0) {
          const bonus = 50 * S.level;
          S.score += bonus;
          S.texts.push({ x: W / 2, y: H * 0.4, text: `싹 비웠어요 +${bonus.toLocaleString("ko-KR")}`, life: 1.2, big: true });
          ctx.sfx("success");
        }
        nextTurn(false);
      }

      function recall() {
        if (state !== "fly") return;
        S.toFire = 0;
        for (const s of S.shots) { if (S.nextX == null) S.nextX = Math.max(R + 2, Math.min(W - R - 2, s.x)); s.done = true; }
        S.shots = [];
        ctx.sfx("whoosh");
        endTurn();
      }

      // ---------- 효과 ----------
      function burst(x, y, color) {
        // 깨진 조각 — 크기가 제각각이고 아래로 떨어진다
        for (let i = 0; i < 16; i++) {
          const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 170;
          S.parts.push({ x: x + (Math.random() - 0.5) * 24, y: y + (Math.random() - 0.5) * 24, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.55, max: 0.55, color, size: 3 + Math.random() * 4, fall: true, rot: Math.random() * 6 });
        }
      }
      function updateParts(dt) {
        for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.2 * dt; if (p.fall) p.vy += 520 * dt; else p.vy *= 1 - 2.2 * dt; p.life -= dt; if (p.rot != null) p.rot += dt * 8; }
        S.parts = S.parts.filter((p) => p.life > 0);
        for (const b of S.bricks) if (b.kick > 0) b.kick -= dt;
        for (const r of S.rings) r.life -= dt;
        S.rings = S.rings.filter((r) => r.life > 0);
        if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
        for (const t of S.texts) { t.y -= 30 * dt; t.life -= dt; }
        S.texts = S.texts.filter((t) => t.life > 0);
        if (S.zaps) { for (const z of S.zaps) z.life -= dt; S.zaps = S.zaps.filter((z) => z.life > 0); }
      }

      // ---------- 그리기 ----------
      function rr(x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }
      // 숫자가 클수록 주황 → 빨강 → 자주
      function brickColor(b) {
        const k = Math.min(1, b.max / Math.max(1, S ? S.level * 2 : 1));
        const hue = 32 - k * 52; // 32(주황) → -20(자주)
        return `hsl(${(hue + 360) % 360}, ${b.tough ? 70 : 88}%, ${b.tough ? 46 : 56}%)`;
      }

      function rayPreview() {
        // 조준선 — 처음 부딪히는 곳까지 + 튕긴 뒤 넉넉히
        let x = S.lx, y = FLOOR - R, vx = Math.cos(S.angle), vy = Math.sin(S.angle);
        const pts = [[x, y]];
        let bounced = 0, len = 0;
        while (len < 900 && bounced < 2) {
          x += vx * 3; y += vy * 3; len += 3;
          let hit = false;
          if (x < R || x > W - R) { vx = -vx; hit = true; }
          else if (y < R) { vy = -vy; hit = true; }
          else if (brickAt(x, y)) { const px = x - vx * 3; if (brickAt(px, y)) vy = -vy; else vx = -vx; hit = true; }
          if (y > FLOOR) break;
          if (hit) { pts.push([x, y]); bounced++; if (bounced === 1) len = Math.max(len, 900 - 220); } // 처음 튕긴 뒤 220px 더 (예전 70px)
        }
        pts.push([x, y]);
        return pts;
      }

      function draw() {
        g.setTransform(scale, 0, 0, scale, 0, 0);
        g.fillStyle = "#1c1917";
        g.fillRect(0, 0, W, H);
        // 바닥 줄 · 위험 줄
        g.fillStyle = "rgba(251, 146, 60, .06)";
        g.fillRect(0, cellY(ROWS - 1), W, CELL);
        g.strokeStyle = "rgba(251, 146, 60, .35)"; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(0, FLOOR + 0.5); g.lineTo(W, FLOOR + 0.5); g.stroke();
        if (!S) return;
        if (S.shake > 0) g.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);

        const slide = state === "shift" ? Math.max(0, S.shiftT / 0.18) * CELL : 0;
        // 벽돌
        g.font = `800 ${Math.round(CELL * 0.34)}px ${FONT}`;
        g.textAlign = "center"; g.textBaseline = "middle";
        for (const b of S.bricks) {
          // 맞은 직후 살짝 작아졌다 돌아온다
          const k = b.kick > 0 ? Math.sin((b.kick / 0.14) * Math.PI) : 0;
          const s = (CELL - GAP * 2) * (1 - 0.1 * k);
          const x = cellX(b.c) + CELL / 2 - s / 2, y = cellY(b.r) + CELL / 2 - s / 2 - slide;
          g.font = `800 ${Math.round(CELL * 0.34 * (1 + 0.22 * k))}px ${FONT}`;
          g.fillStyle = b.flash > 0 ? "#fff7ed" : brickColor(b);
          rr(x, y, s, s, 8); g.fill();
          g.fillStyle = "rgba(255,255,255,.18)";
          rr(x + 3, y + 3, s - 6, 5, 3); g.fill();
          if (b.tough) { g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; rr(x + 1, y + 1, s - 2, s - 2, 7); g.stroke(); }
          g.fillStyle = b.flash > 0 ? "#9a3412" : "#fff";
          g.fillText(String(b.hp), x + s / 2, y + s / 2 + 1);
        }
        // 아이템
        for (const it of S.items) {
          const cx = cellX(it.c) + CELL / 2, cy = cellY(it.r) + CELL / 2 - slide;
          if (it.kind === "ball") {
            const pr = CELL * 0.2 + Math.sin(S.t * 5 + it.c) * 1.5;
            g.strokeStyle = "#86efac"; g.lineWidth = 3;
            g.beginPath(); g.arc(cx, cy, pr, 0, Math.PI * 2); g.stroke();
            g.fillStyle = "#86efac"; g.font = `800 11px ${FONT}`;
            g.fillText("+1", cx, cy + 0.5);
          } else if (it.kind === "swirl") {
            g.save(); g.translate(cx, cy); g.rotate(S.t * 4);
            g.strokeStyle = "#7dd3fc"; g.lineWidth = 2.5; g.lineCap = "round";
            for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(0, 0, CELL * 0.18, k * 2.1, k * 2.1 + 1.3); g.stroke(); }
            g.restore();
          } else {
            g.fillStyle = it.hit ? "rgba(253, 224, 71, .45)" : "#fde047";
            g.beginPath(); g.arc(cx, cy, CELL * 0.2, 0, Math.PI * 2); g.fill();
            g.fillStyle = "#713f12"; g.font = `800 14px ${FONT}`;
            g.fillText(it.kind === "row" ? "↔" : "↕", cx, cy + 1);
          }
        }
        g.font = `800 ${Math.round(CELL * 0.34)}px ${FONT}`;
        // 번개
        for (const z of S.zaps || []) {
          g.fillStyle = `rgba(253, 224, 71, ${z.life / 0.18 * 0.55})`;
          if (z.kind === "row") g.fillRect(0, cellY(z.r) + CELL / 2 - 3, W, 6);
          else g.fillRect(cellX(z.c) + CELL / 2 - 3, TOP, 6, FLOOR - TOP);
        }
        // 조준선
        if (state === "aim" && S.aiming) {
          const pts = rayPreview();
          g.save();
          g.setLineDash([2, 7]); g.lineCap = "round";
          g.strokeStyle = "rgba(255, 237, 213, .8)"; g.lineWidth = 3;
          g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
          for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
          g.stroke();
          g.restore();
        }
        // 공
        g.fillStyle = "#fff7ed";
        for (const s of S.shots) {
          if (s.trail) s.trail.forEach(([tx, ty], i) => { g.globalAlpha = 0.08 + (i / s.trail.length) * 0.22; g.beginPath(); g.arc(tx, ty, R * (0.5 + (i / s.trail.length) * 0.4), 0, Math.PI * 2); g.fill(); });
          g.globalAlpha = 1;
          g.beginPath(); g.arc(s.x, s.y, R, 0, Math.PI * 2); g.fill();
        }
        for (const r of S.rings) {
          const k = 1 - r.life / 0.3;
          g.strokeStyle = `rgba(255, 237, 213, ${0.6 * (1 - k)})`; g.lineWidth = 3 * (1 - k) + 1;
          g.beginPath(); g.arc(r.x, r.y - slide, CELL * (0.35 + k * 0.5), 0, Math.PI * 2); g.stroke();
        }
        // 발사 자리 (남은 공 수)
        if (state !== "over") {
          const waiting = state === "fly" ? S.toFire : S.balls;
          if (waiting > 0 || state !== "fly") {
            g.fillStyle = "#fb923c";
            g.beginPath(); g.arc(S.lx, FLOOR - R, R + 1, 0, Math.PI * 2); g.fill();
            g.fillStyle = "#fed7aa"; g.font = `700 11px ${FONT}`;
            g.fillText(`×${waiting}`, S.lx, FLOOR - R - 16);
          }
          if (state === "fly" && S.nextX != null) {
            g.fillStyle = "rgba(251, 146, 60, .5)";
            g.beginPath(); g.arc(S.nextX, FLOOR - R, R, 0, Math.PI * 2); g.fill();
          }
        }
        // 조각 · 글자
        for (const p of S.parts) {
          g.globalAlpha = Math.max(0, p.life / (p.max || 0.45));
          g.fillStyle = p.color;
          const z = p.size || 4;
          if (p.rot != null) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-z / 2, -z / 2, z, z); g.restore(); }
          else g.fillRect(p.x - z / 2, p.y - z / 2, z, z);
        }
        g.globalAlpha = 1;
        for (const t of S.texts) {
          g.globalAlpha = Math.max(0, Math.min(1, t.life / 0.4));
          g.fillStyle = t.big ? "#fde68a" : "#bbf7d0";
          g.font = `800 ${t.big ? 18 : 12}px ${FONT}`;
          g.fillText(t.text, t.x, t.y);
        }
        g.globalAlpha = 1;
        // 처음 안내
        if (state === "aim" && S.level === 1 && !S.aiming) {
          g.fillStyle = "rgba(254, 215, 170, .85)"; g.font = `700 13px ${FONT}`;
          g.fillText("화면을 짚고 끌어 조준 · 놓으면 발사", W / 2, FLOOR - 70);
        }
      }

      function hud() {
        if (!S) return;
        elScore.textContent = S.score.toLocaleString("ko-KR");
        elLevel.textContent = S.level;
        elBalls.textContent = S.balls + (S.gained ? ` +${S.gained}` : "");
      }

      // ---------- 루프 ----------
      let raf = 0, last = 0;
      const live = () => state === "aim" || state === "fly" || state === "shift";
      function frame(now) {
        raf = 0;
        if (!live()) return;
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        if (live()) raf = requestAnimationFrame(frame);
      }
      function run() {
        if (raf) cancelAnimationFrame(raf);
        last = performance.now();
        raf = requestAnimationFrame(frame);
      }

      // ---------- 화면 전환 ----------
      function showOverlay(html) {
        overlay.innerHTML = html;
        overlay.hidden = false;
        const btn = overlay.querySelector("button");
        if (btn) btn.focus({ preventScroll: true });
      }
      function showReady() {
        state = "ready";
        S = null;
        elScore.textContent = "0"; elLevel.textContent = "1"; elBalls.textContent = "1";
        recallBtn.hidden = true;
        draw();
        showOverlay(`<div class="gm-card">
          <h2>벽돌 깨기</h2>
          <p>끌어서 조준하고 놓으면 공이 <b>줄줄이</b> 날아가요.<br>벽돌 숫자만큼 맞히면 깨지고, 턴마다 벽돌이 <b>한 줄씩</b> 내려와요.<br>맨 아래 줄까지 내려오면 끝.</p>
          <div class="gm-items">
            <div><span class="gm-pill" style="background:#16a34a">+1</span>공을 하나 더 얻어요 · 못 맞혀도 바닥 줄까지 내려오면 저절로</div>
            <div><span class="gm-pill" style="background:#ca8a04">↔</span>공이 지나가면 그 가로줄 벽돌 모두 1씩</div>
            <div><span class="gm-pill" style="background:#ca8a04">↕</span>공이 지나가면 그 세로줄 벽돌 모두 1씩</div>
            <div><span class="gm-pill" style="background:#0284c7">↻</span>회오리 — 지나가는 공이 엉뚱한 방향으로 튀어요</div>
          </div>
          <div class="gm-keys">처음 떨어진 공 자리에서 다음 턴을 쏴요 · 오래 걸리면 공이 빨라지고 <b>모두 회수</b>도 할 수 있어요<br>PC 마우스로 겨누고 클릭 · <kbd>←</kbd><kbd>→</kbd> 조준 · <kbd>Space</kbd> 발사 · <kbd>Esc</kbd> 일시정지</div>
          <button type="button" class="gm-go" data-act="start">시작</button>
        </div>`);
      }
      function start() {
        overlay.hidden = true;
        overlay.innerHTML = "";
        keys.left = keys.right = false;
        newGame();
        run();
      }
      function pause() {
        if (!live()) return;
        pausedFrom = state;
        state = "paused";
        keys.left = keys.right = false;
        showOverlay(`<div class="gm-card"><h2>잠깐 쉬는 중</h2><p>현재 점수 <b>${S.score.toLocaleString("ko-KR")}</b>점 · ${S.level}단계</p><button type="button" class="gm-go" data-act="resume">계속하기</button></div>`);
      }
      function resume() {
        if (state !== "paused") return;
        overlay.hidden = true;
        state = pausedFrom || "aim";
        run();
      }
      function gameOver() {
        state = "over";
        recallBtn.hidden = true;
        draw();
        ctx.sfx("lose");
        const score = S.score;
        showOverlay(`<div class="gm-card"><h2>게임 오버</h2><p>벽돌이 바닥에 닿았어요 · ${S.level}단계 · 공 ${S.balls}개</p><div class="gm-big">${score.toLocaleString("ko-KR")}점</div><button type="button" class="gm-go" data-act="start">다시 하기</button></div>`);
        ctx.submit(score);
      }

      overlay.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "start") start();
        else if (b.dataset.act === "resume") resume();
      });
      recallBtn.addEventListener("click", recall);

      // ---------- 입력 ----------
      function typing(e) {
        const t = e.target;
        return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
      }
      const dialogOpen = () => !!document.querySelector(".hk-dialog__overlay");
      window.addEventListener("keydown", (e) => {
        if (typing(e) || dialogOpen()) return;
        const c = e.code;
        const gameKey = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(c);
        if (live()) {
          if (gameKey) e.preventDefault();
          if (c === "ArrowLeft" || c === "KeyA") { keys.left = true; if (state === "aim") S.aiming = true; }
          if (c === "ArrowRight" || c === "KeyD") { keys.right = true; if (state === "aim") S.aiming = true; }
          if ((c === "Space" || c === "ArrowUp" || c === "Enter") && !e.repeat) { if (state === "aim") fire(); else if (state === "fly" && S.flyT > 1.5) recall(); }
          if (c === "KeyP" || c === "Escape") pause();
        } else if (state === "paused" || state === "ready") {
          if (gameKey) e.preventDefault();
          if (c === "Space" || c === "Enter") { e.preventDefault(); overlay.querySelector("button")?.click(); }
        }
      });
      window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
      });
      window.addEventListener("blur", () => { keys.left = keys.right = false; });

      function toWorld(e) {
        const rect = canvas.getBoundingClientRect();
        return [((e.clientX - rect.left) / rect.width) * W, ((e.clientY - rect.top) / rect.height) * H];
      }
      // 휴대폰에서 두 번 톡·길게 누르기로 확대·메뉴가 뜨지 않게 (버튼은 그대로 눌리게)
      shell.addEventListener("touchstart", (e) => { if (!(e.target.closest && e.target.closest("button, a"))) e.preventDefault(); }, { passive: false });
      shell.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
      shell.addEventListener("dblclick", (e) => e.preventDefault());
      shell.addEventListener("contextmenu", (e) => e.preventDefault());

      // 마우스는 올려만 둬도 조준선이 보이고 클릭하면 발사 · 터치는 짚고 끄는 동안 조준, 놓으면 발사
      let press = null;
      canvas.addEventListener("pointermove", (e) => {
        if (state !== "aim" || e.pointerType === "mouse") return;
        const [x, y] = toWorld(e);
        if (press && press.id === e.pointerId) { aimAt(x, y); S.aiming = aimValid(y); }
      });
      // 마우스는 게임 화면 밖으로 나가도 계속 따라가며 조준하고, 밖에서 눌렀다 떼도 발사한다 (버튼·링크 같은 곳은 제외)
      window.addEventListener("pointermove", (e) => {
        if (state !== "aim" || e.pointerType !== "mouse" || !S) return;
        const [x, y] = toWorld(e);
        aimAt(x, y); S.aiming = aimValid(y);
      });
      let outPress = false;
      const uiTarget = (t) => !t || !t.closest || t === canvas || !!t.closest("button, a, input, textarea, select, label, [role=button], .gm-overlay, .hk-play-board, .hk-pf__bar, .hk-dialog__overlay");
      window.addEventListener("pointerdown", (e) => {
        outPress = e.pointerType === "mouse" && e.button === 0 && state === "aim" && !uiTarget(e.target);
      });
      window.addEventListener("pointerup", (e) => {
        if (!outPress || e.pointerType !== "mouse") return;
        outPress = false;
        if (state === "aim" && S && S.aiming) fire();
      });
      canvas.addEventListener("pointerdown", (e) => {
        if (state !== "aim") return;
        const [x, y] = toWorld(e);
        press = { id: e.pointerId };
        aimAt(x, y); S.aiming = aimValid(y);
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
      });
      canvas.addEventListener("pointerup", (e) => {
        if (!press || press.id !== e.pointerId) return;
        press = null;
        if (state !== "aim") return;
        const [, y] = toWorld(e);
        // 바닥 아래로 끌어 놓으면 쏘지 않는다 (취소)
        if (aimValid(y)) fire(); else S.aiming = false;
      });
      canvas.addEventListener("pointercancel", () => { press = null; if (S) S.aiming = false; });

      document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

      // 게임 중 뒤로 가기 → '기록 남기고 나가기'에 쓰는 지금 점수
      ctx.onScore && ctx.onScore(() => S ? S.score : 0);
      ctx.onRestart(start);
      ctx.onPause(pause);
      if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);
      window.addEventListener("resize", fit);
      fit();
      showReady();
    },
  });
  </script>
</body>
</html>
