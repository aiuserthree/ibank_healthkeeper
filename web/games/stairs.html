<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>별까지 계단 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    .gm-st { display: block; width: 100%; height: 100%; border: 0; border-radius: 16px; background: #10122b; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 별까지 계단 — 게임 본체(stairs-play.html)를 아케이드 창 안에 넣고, 점수·소리·새 판 알림을 주고받는다
    HKPlay.mountGame({
      key: "stairs",
      setup(stage, ctx) {
        stage.innerHTML = `<iframe class="gm-st" src="/games/stairs-play.html" title="별까지 계단" allow="autoplay"></iframe>`;
        const frame = stage.querySelector("iframe");
        const send = (msg) => frame.contentWindow && frame.contentWindow.postMessage(msg, location.origin);
        // 키보드가 바로 게임으로 가게
        frame.addEventListener("load", () => {
          frame.focus();
          send({ type: "hk-mute", muted: HKSound.isMuted() });
        });
        HKSound.onChange(() => send({ type: "hk-mute", muted: HKSound.isMuted() }));
        window.addEventListener("message", (e) => {
          if (e.origin !== location.origin || e.source !== frame.contentWindow || !e.data) return;
          if (e.data.type === "hk-game-start") ctx.started();
          else if (e.data.type === "hk-game-over") ctx.submit(e.data.score);
        });
        ctx.onRestart(() => frame.focus());
        // 공통 틀의 일시정지(Esc·휴대폰 버튼) → 게임 본체의 고양이 고르기 창(=일시정지)
        ctx.onPause(() => send({ type: "hk-pause" }));
      },
    });
  </script>
</body>
</html>
