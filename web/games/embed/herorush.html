<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영웅 돌격 다리 3D</title>
<style>
/* Layout idea: full-bleed 3D stage, toy-like chunky HUD pinned to the top, cards float centre. */
:root{
  --ink:#1b2440;
  --paper:#ffffff;
  --hero:#2f8cff;
  --foe:#ff4d5e;
  --gold:#ffc83d;
  --good:#1fbf75;
  --font-display:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --font-body:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--font-body);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.pill{background:var(--paper);border-radius:999px;box-shadow:0 4px 0 rgba(27,36,64,.22),0 8px 18px rgba(27,36,64,.12);padding:6px 14px;font-weight:600;font-size:15px;pointer-events:auto}
#lvl{display:flex;flex-direction:column;gap:5px;border-radius:16px;min-width:108px}
#lvlName{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
#prog{height:6px;border-radius:3px;background:#e3e8f2;overflow:hidden}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#58a6ff,#2a7cf0);border-radius:3px}
#count{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 20px 8px 12px;font-family:var(--font-display);pointer-events:none}
#count .ico{width:34px;height:34px;border-radius:50%;background:var(--hero);position:relative;flex:none}
#count .ico::before{content:"";position:absolute;left:50%;top:5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#ffd9b0}
#count .ico::after{content:"";position:absolute;left:50%;bottom:4px;width:17px;height:12px;margin-left:-8.5px;border-radius:8px 8px 4px 4px;background:#fff}
#count .lab{font-size:11px;font-weight:700;opacity:.6;line-height:1}
#count .num{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch}
#count.up{animation:bump .44s ease-out}
#count.up .num{color:var(--good)}
#count.down{animation:shake .32s}
#count.down .num{color:var(--foe)}
@keyframes bump{0%{scale:1}28%{scale:1.26}55%{scale:.94}78%{scale:1.04}100%{scale:1}}
@keyframes shake{20%{translate:-6px 0;scale:.94}45%{translate:5px 0}70%{translate:-3px 0}100%{translate:0 0;scale:1}}
#btns{display:flex;gap:8px}
#btns button{width:42px;height:42px;padding:0;display:grid;place-items:center}
#btns svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#btns button:active{scale:.9}

/* world-anchored labels */
.tag{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--font-display);font-weight:700;will-change:transform;display:none}
#bub{background:linear-gradient(#58a6ff,#2a7cf0);color:#fff;border:2.5px solid #fff;border-radius:14px;padding:0 11px;font-size:21px;box-shadow:0 3px 0 rgba(15,40,110,.35);font-variant-numeric:tabular-nums;text-shadow:0 1.5px 0 rgba(10,40,120,.45)}
#bub.up{animation:bump .44s ease-out}#bub.down{animation:shake .32s}
#foeTag{background:linear-gradient(#ff7280,#e8384c);color:#fff;border:2.5px solid #fff;border-radius:14px;padding:0 11px;font-size:21px;box-shadow:0 3px 0 rgba(110,15,30,.35);font-variant-numeric:tabular-nums;text-shadow:0 1.5px 0 rgba(120,10,30,.45)}
#bossTag{width:200px;text-align:center;color:#fff;font-size:15px;font-weight:800;letter-spacing:.12em;-webkit-text-stroke:3px #3a0f18;paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#bossBar{height:16px;border-radius:9px;background:rgba(27,36,64,.6);border:2.5px solid #fff;overflow:hidden;margin-top:3px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#bossFill{height:100%;width:100%;background:linear-gradient(#ff8a94,#e8384c);border-radius:6px;transition:width .15s}
.pop{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--font-display);font-weight:900;font-size:46px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 rgba(27,36,64,.35);animation:rise 1s ease-out forwards}
.pop.bad{color:#ff8a94}
.pop.good{color:#9dffcb}
@keyframes rise{0%{opacity:0;scale:.3;margin-top:0}14%{opacity:1;scale:1.3}28%{scale:.95}40%{scale:1.05;margin-top:-14px}75%{opacity:1}100%{opacity:0;scale:1;margin-top:-100px}}

/* overlays */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,32,70,.35)}
.overlay.on{display:flex}
.card{background:var(--paper);border-radius:26px;box-shadow:0 8px 0 rgba(27,36,64,.25);padding:22px 22px 20px;width:min(430px,100%);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:800;font-size:36px;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all}
h1 span{color:var(--hero)}
h2{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all}
p{margin:0;font-size:15px;line-height:1.5;font-weight:500;opacity:.8;word-break:keep-all}
#endCalc{font-size:13px;line-height:1.6;opacity:.75;background:#f3f6fb;border-radius:12px;padding:8px 12px;text-align:left}
#endScore{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink)}
#pauseCard .big{width:100%}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{background:#eef3fb;border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--font-display);box-shadow:0 3px 0 #cfd8e8}
.lv b{font-size:22px;line-height:1}
.lv small{font-size:11.5px;font-weight:700;opacity:.72;white-space:nowrap}
.lv i{font-style:normal;font-size:11px;color:var(--gold);letter-spacing:1px;height:13px}
.lv.sel{background:var(--hero);color:#fff;box-shadow:0 3px 0 #1b62c4}
.lv.sel small{opacity:.9}
.lv:disabled{opacity:.4;cursor:not-allowed}
.big{background:var(--gold);border-radius:16px;padding:13px 18px;font-family:var(--font-display);font-weight:700;font-size:22px;box-shadow:0 5px 0 #c9951a}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c9951a}
.ghost{background:#eef3fb;border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px;box-shadow:0 3px 0 #cfd8e8;flex:1}
.row{display:flex;gap:8px}
#stars{font-size:44px;line-height:1;letter-spacing:6px;color:#dfe5f0}
#stars b{color:var(--gold);font-weight:400}
#endNum{font-family:var(--font-display);font-size:54px;font-weight:700;line-height:1;color:var(--hero);font-variant-numeric:tabular-nums}
#endNum.zero{color:var(--foe)}
.hint{font-size:13px;opacity:.6;word-break:keep-all;line-height:1.5}
#drag{position:fixed;left:0;right:0;bottom:9%;text-align:center;font-family:var(--font-display);font-weight:600;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;display:none}
@media (max-width:560px){h1{font-size:30px}#count{top:70px;padding:6px 16px 6px 10px}#count .num{font-size:28px}#count .ico{width:28px;height:28px}#count .ico::before{top:4px;width:9px;height:9px;margin-left:-4.5px}#count .ico::after{width:14px;height:10px;margin-left:-7px;bottom:3px}}
body.inmenu #lvl,body.inmenu #count{visibility:hidden} /* 단계 고르기 화면에선 게임 안 숫자를 숨겨 카드만 보이게 */
@media (prefers-reduced-motion:reduce){#count.up,#count.down,#bub.up,#bub.down{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill" id="lvl"><div><span id="lvlNo">1단계</span></div><div id="lvlName">톱날</div><div id="prog"><div id="progFill"></div></div></div>
  <div id="btns">
    <button class="pill" id="bMute" title="소리 켜기 · 끄기" aria-label="소리 켜기 · 끄기"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke-width="2"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="pill" id="bRetry" title="이 단계 처음부터" aria-label="이 단계 처음부터"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19.5 4.5v4.2h-4.2"/></svg></button>
    <button class="pill" id="bMenu" title="단계 고르기" aria-label="단계 고르기"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg></button>
  </div>
</div>
<div class="pill" id="count"><div class="ico"></div><div><div class="lab">영웅</div><div class="num" id="num">3</div></div></div>

<div class="tag" id="bub">3</div>
<div class="tag" id="foeTag">0</div>
<div class="tag" id="bossTag">보스<div id="bossBar"><div id="bossFill"></div></div></div>
<div id="drag">좌우로 끌어서 움직여요</div>

<div class="overlay on" id="menu">
  <div class="card">
    <h1>영웅 <span>돌격</span> 다리 3D</h1>
    <p>파란 관문으로 영웅을 늘리고, 함정을 피해 적 군대를 물리친 뒤 보스를 쓰러뜨려요.</p>
    <div id="grid"></div>
    <button class="big" id="bPlay">1단계 시작</button>
    <div class="hint">화면을 좌우로 끌거나 ← → · A D 키로 움직여요. 파란 관문은 영웅이 늘고, 빨간 관문은 줄어요.</div>
  </div>
</div>

<div class="overlay" id="end">
  <div class="card">
    <h2 id="endTitle">단계 성공</h2>
    <div id="stars"></div>
    <div><div id="endNum">0</div><p id="endSub">명이 살아남았어요</p></div>
    <div id="endScore"></div>
    <div id="endCalc"></div>
    <button class="big" id="bNext">다음 단계</button>
    <div class="row"><button class="ghost" id="bAgain">다시 하기</button><button class="ghost" id="bLevels">단계 고르기</button></div>
  </div>
</div>

<div class="overlay" id="pause">
  <div class="card" id="pauseCard">
    <h2>잠깐 멈췄어요</h2>
    <p>준비되면 이어서 해요.</p>
    <button class="big" id="bResume">계속하기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;
const $ = id => document.getElementById(id);
const HALF = 5, MAXH = 500, SPEED = 14, PLAT_HALF = 9, PLAT_LEN = 46, START = 3;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- 헬스키퍼 아케이드 연결 ----------------
 * ?hk=1 이거나 부모 창 안에서 열리면 「아케이드 모드」.
 * 한 판 = 고른 단계 하나를 끝까지(승리 또는 실패). startLevel 때 hk:start, 끝 화면(showEnd)에서 hk:score 한 번.
 * 점수
 *   승리: 단계 × 500 + 이번 판 별 하나에 300 + 살아남은 영웅 × 10
 *   실패: 진행 거리 비율(1% 단위 내림, 다리 끝까지 가면 100%) × 단계 × 250 (내림)
 * 진행 · 별 저장(localStorage 'heroRushBridge')은 아케이드 모드에서도 그대로 — 단계 잠금 해제용.
 */
const HK = location.origin;
const ARCADE = /[?&]hk=1(&|$)/.test(location.search) || window.parent !== window;
const hk = msg => { if (ARCADE && window.parent !== window) { try { window.parent.postMessage(msg, HK); } catch (e) {} } };
let roundOn = false; // hk:start 뒤 hk:score 전까지
function calcScore(won, lvlNo, stars, heroes, ratio){
  if (won) {
    const a = lvlNo * 500, b = stars * 300, c = heroes * 10;
    return {score:a + b + c, lines:[`단계 ${lvlNo} × 500 = ${a.toLocaleString('ko-KR')}`, `별 ${stars}개 × 300 = ${b.toLocaleString('ko-KR')}`, `살아남은 영웅 ${heroes.toLocaleString('ko-KR')}명 × 10 = ${c.toLocaleString('ko-KR')}`]};
  }
  const pct = Math.floor(ratio * 100 + 1e-9), sc = Math.floor(pct * lvlNo * 250 / 100); // 화면 계산 내역과 맞도록 진행 비율은 1% 단위(내림)
  return {score:sc, lines:[`진행 거리 ${pct}% × 단계 ${lvlNo} × 250 = ${sc.toLocaleString('ko-KR')} (소수점 버림)`]};
}

/* ---------------- levels ---------------- */
const G = (d, l, r) => ({k:'gate', d, l, r});
const saw = (d, x) => ({k:'saw', d, x});
const ssaw = (d, ph = 0) => ({k:'ssaw', d, ph});
const hole = (d, len, x0, x1) => ({k:'hole', d, len, x0, x1});
const ham = (d, ph = 0) => ({k:'ham', d, ph});
const spin = (d, x = 0, dir = 1) => ({k:'spin', d, x, dir});
const crush = d => ({k:'crush', d});
const boulder = (d, x) => ({k:'boulder', d, x});
const cannon = (d, side) => ({k:'cannon', d, side});

const LEVELS = [
 {name:'톱날 공장', tag:'톱날', trap:'톱날', len:280, sky:0x8fd3ff, water:0x2f7fd6, deck:0xe2b07a, boss:0x8a5cf0, items:[
   G(30,'+10','+4'), saw(60,-2.6), saw(60,2.6), G(85,'x2','+6'), saw(115,0),
   G(140,'+15','x2'), saw(170,-3.2), saw(170,-0.6), saw(196,3.2), saw(196,0.6),
   G(225,'x2','-5'), saw(254,0)]},
 {name:'부서진 판자', tag:'구멍', trap:'뚫린 구멍', len:296, sky:0xffc9ae, water:0x4f6fc4, deck:0xd99a6c, boss:0x3fae6a, items:[
   G(30,'+12','x2'), hole(54,8,-5,0), G(80,'+8','x2'), hole(104,8,0,5), saw(126,-2.6),
   G(150,'x2','+20'), hole(174,9,-2,2), G(200,'-10','+25'), hole(222,8,-5,-0.8), saw(242,3),
   G(264,'x2','/2')]},
 {name:'망치 마당', tag:'망치', trap:'흔들리는 망치', len:316, sky:0xa8ecd8, water:0x2a9d8f, deck:0xe6c38a, boss:0xf08a3c, items:[
   G(30,'+15','x3'), ham(60,0), G(90,'x2','+10'), ham(120,1.2), hole(139,7,0,5),
   G(165,'+30','x2'), ham(194,0), ham(208,1.6), saw(232,-3.2), saw(232,3.2),
   G(256,'x2','-15'), ham(286,0.6)]},
 {name:'움직이는 톱 거리', tag:'움직톱', trap:'좌우로 움직이는 톱', len:326, sky:0xffb873, water:0x7a4fb5, deck:0xe9b98c, boss:0x2fb3c9, items:[
   G(30,'x3','+12'), ssaw(60,0), G(88,'+20','x2'), ssaw(115,1.5), hole(135,8,-5,-1),
   G(160,'x2','+15'), ham(190,0), ssaw(212,3), G(238,'/2','+40'), ssaw(262,0), ssaw(275,3.14),
   G(298,'x2','+30')]},
 {name:'빙글빙글', tag:'회전봉', trap:'도는 막대', len:340, sky:0xcdbcff, water:0x5b4bc4, deck:0xf0cfa0, boss:0xe0457b, items:[
   G(30,'+14','x2'), spin(62,0,1), G(90,'x2','+18'), spin(120,-2,1), spin(141,2,-1),
   G(168,'+35','x2'), hole(195,8,-2,2), ssaw(216,0), G(240,'x2','-20'), spin(270,0,-1), ham(291,0),
   G(313,'+40','x2')]},
 {name:'쿵쿵 공장', tag:'누르개', trap:'내려찍는 누르개', len:358, sky:0xb9c9dc, water:0x4a6078, deck:0xd7c3a5, boss:0x6b6f8a, items:[
   G(30,'x3','+10'), crush(62), G(90,'+25','x2'), crush(120), saw(141,0),
   G(165,'x2','+30'), spin(195,0,1), crush(219), G(245,'-25','x2'), hole(268,8,0,5), ham(289,0),
   G(313,'x2','+50'), crush(338)]},
 {name:'바위 굴리기', tag:'바위', trap:'굴러오는 바위', len:358, sky:0xffe29a, water:0x3fa7a0, deck:0xe0a868, boss:0x9a5a2c, items:[
   G(30,'+16','x2'), G(70,'x2','+20'), boulder(112,-2.6), boulder(126,2.6),
   G(128,'+30','x2'), boulder(176,0), boulder(190,-3.2), boulder(200,3.2), crush(204),
   G(228,'x2','+40'), hole(252,8,-5,-1), G(278,'/3','+45'), boulder(322,-2.6), boulder(336,2.6),
   G(328,'x2','+60')]},
 {name:'대포 길', tag:'대포', trap:'대포알', len:402, sky:0x39407e, water:0x1a1f4a, deck:0xd9b88f, boss:0xd4323c, items:[
   G(30,'x3','+15'), cannon(60,1), G(88,'+30','x2'), cannon(115,-1), cannon(128,1),
   G(152,'x2','+25'), ham(181,0), hole(199,8,-2,2), G(223,'-30','x2'), spin(251,0,1), crush(273),
   G(298,'+60','x2'), cannon(328,-1), ssaw(346,0),
   G(370,'x2','/2'), saw(388,-3.9), saw(388,3.9)]},
];
const parseOp = s => ({t:s[0], v:+s.slice(1)});
const applyOp = (n, o) => clamp(Math.round(o.t === '+' ? n + o.v : o.t === '-' ? n - o.v : o.t === 'x' ? n * o.v : n / o.v), 0, MAXH);
const opLabel = o => ({'+':'+','-':'−','x':'×','/':'÷'})[o.t] + o.v;
const opGood = o => o.t === '+' || o.t === 'x';
function bestCount(L){
  let c = START;
  L.items.filter(i => i.k === 'gate').sort((a, b) => a.d - b.d).forEach(g => { c = Math.max(applyOp(c, parseOp(g.l)), applyOp(c, parseOp(g.r))); });
  return c;
}

/* ---------------- save ---------------- */
let save = {u:1, s:[]};
try { const j = JSON.parse(localStorage.getItem('heroRushBridge') || 'null'); if (j && j.u) save = j; } catch (e) {}
const store = () => { try { localStorage.setItem('heroRushBridge', JSON.stringify(save)); } catch (e) {} };

/* ---------------- audio ---------------- */
let AC = null, muted = false, lastHit = 0;
function audioOn(){ if (AC || muted) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
function tone(f, dur, type, vol, slide, delay){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + dur);
    g.gain.setValueAtTime(vol || .12, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) {}
}

function rboxGeo(w, h, d, r, seg){ // 둥근 모서리 상자
  const n = (seg || 2) * 2 + 1; r = Math.min(r, w / 2, h / 2, d / 2);

  const p = g.attributes.position.array, nm = g.attributes.normal.array, hs = .5 / n, bx = w / 2 - r, by = h / 2 - r, bz = d / 2 - r, v = new T.Vector3();
  for (let i = 0; i < p.length; i += 3) {
    const x = p[i], y = p[i + 1], z = p[i + 2], sx = Math.sign(x), sy = Math.sign(y), sz = Math.sign(z);
    v.set(x - sx * hs, y - sy * hs, z - sz * hs).normalize();
    p[i] = bx * sx + v.x * r; p[i + 1] = by * sy + v.y * r; p[i + 2] = bz * sz + v.z * r; nm[i] = v.x; nm[i + 1] = v.y; nm[i + 2] = v.z;
  }
  return g;
}
const RBC = {};
const rb = (w, h, d, r, seg) => { const k = [w, h, d, r, seg || 2].join(); return RBC[k] || (RBC[k] = rboxGeo(w, h, d, r, seg)); };
function merge(parts){ // [[색인 있는 도형, 색], ...] → 정점 색이 든 도형 하나
  let nv = 0, ni = 0; for (const [g] of parts) { nv += g.attributes.position.count; ni += g.index.count; }
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), C = new Float32Array(nv * 3), I = new Uint32Array(ni), col = new T.Color(); let ov = 0, oi = 0;
  for (const [g, hex] of parts) {
    const c = g.attributes.position.count; P.set(g.attributes.position.array, ov * 3); N.set(g.attributes.normal.array, ov * 3); col.set(hex === undefined ? 0xffffff : hex);
    for (let i = 0; i < c; i++) { C[(ov + i) * 3] = col.r; C[(ov + i) * 3 + 1] = col.g; C[(ov + i) * 3 + 2] = col.b; }
    const ix = g.index.array; for (let i = 0; i < ix.length; i++) I[oi + i] = ix[i] + ov; ov += c; oi += ix.length; g.dispose();

}

    if (Math.abs(g.z - camPos.z) > 140) continue;
    g.panels.forEach((p, s) => {
      const uu = (t * .55 + g.ph + s * .2) % 1.5; p.shine.position.x = -2.1 + Math.min(1, uu) * 4.2; p.shine.material.opacity = uu < 1 ? Math.sin(uu * Math.PI) * .45 : 0;
      if (g.hitT < 0) { const pulse = 1 + Math.sin(t * 3 + g.ph) * .015; p.grp.scale.setScalar(pulse); p.mats[0].opacity = .42 + .14 * Math.sin(t * 4 + g.ph); return; }
      if (s === g.chosen) { const u2 = Math.min(1, g.hitT / .32); p.grp.scale.setScalar(1 + backOut(u2) * .3); p.mats.forEach(m => { m.opacity = m.userData.o * (1 - u2); }); if (u2 >= 1) p.grp.visible = false; }
      else { const u2 = Math.min(1, g.hitT / .4); p.mats.forEach(m => { m.opacity = m.userData.o * (1 - .72 * u2); }); }
    });
    if (g.hitT >= 0) g.hitT += dt;
  }
  for (const [o, z] of cull) { const d = z - camPos.z; o.visible = d < 45 && d > -175; }
  for (const f of anims) f(t, dt);

  // 보스: 숨쉬기 · 맞으면 번쩍 · 바닥 기운
  if (boss) {
    const hurt = 1 - S.hp / S.hp0; boss.flash = Math.max(0, boss.flash - dt);
    boss.body.scale.set(1.12, 1.12 * (1 + Math.sin(t * 2.4) * .018), 1.12);
    boss.skin.emissive.setRGB(hurt * .12 + boss.flash * 2.2, boss.flash * .6, boss.flash * .6);
    boss.eyeM.color.setRGB(1, .95 - hurt * .7, .45 - hurt * .4);
    boss.head.rotation.x = Math.sin(t * 1.7) * .06; boss.head.rotation.y = Math.sin(t * .9) * .12;
    const ap = .5 + .5 * Math.sin(t * 3); boss.auraM.opacity = ph === 'win' ? Math.max(0, boss.auraM.opacity - dt) : .25 + ap * .15 + hurt * .15; boss.aura.scale.setScalar(1 + ap * .08);
  }

  // camera
  const rad = .165 * Math.sqrt(Math.max(1, n)), zoom = 1 + Math.min(1, rad / 4.5) * .55, port = camera.aspect < 1, tall = port ? 1.15 : 1;
  const near = port ? clamp(.45 + camera.aspect * .55, .6, 1) : 1; // 세로 화면 보스 장면은 카메라를 당겨 보스를 크게
  if (ph === 'menu') { wantPos.set(Math.sin(t * .3) * 4, 6, 12); wantLook.set(0, 1, -8); }
  else if (ph === 'run' || (ph === 'fail' && S.why === 'trap')) { wantPos.set(S.px * .45, (6.5 * zoom + 1.5) * tall, S.pz + 9.5 * zoom * tall); wantLook.set(S.px * .45, .5, S.pz - (port ? 12 : 9)); }
  else if (ph === 'battle' || (ph === 'fail' && S.why === 'army')) { wantPos.set(0, 12 * tall, S.armyZ + 19 * tall); wantLook.set(0, 1, S.armyZ - (port ? 3 : 5.5)); }
  else { wantLook.set(0, port ? 4.2 : 4.6, S.bossZ + 1); wantPos.set(5.5 * near, wantLook.y + (8.5 * tall - 4.6) * near, S.bossZ + 1 + (23 * tall - 1) * near); }
  const ck = 1 - Math.exp(-dt * (ph === 'run' ? 8 : 3)); camPos.lerp(wantPos, ck); camLook.lerp(wantLook, ck);
  camera.position.copy(camPos); if (S.shake > 0) { camera.position.x += rand(-1, 1) * S.shake * .5; camera.position.y += rand(-1, 1) * S.shake * .5; }
  camera.lookAt(camLook);
  sun.position.set(camLook.x + 9, 20, camLook.z + 10); sun.target.position.set(camLook.x, 0, camLook.z + 2);
  sky.position.copy(camera.position); water.position.x = camera.position.x; water.position.z = camera.position.z;
  far.position.set(camera.position.x, 0, camera.position.z); cloudG.position.set(camera.position.x * .9 + t * .6, 0, camera.position.z * .82);
  waterU.uT.value = t;
  renderer.render(scene, camera);

  // HUD
  if (n !== lastN) { const c = $('count'), b = $('bub'); if (lastN >= 0) { const cls = n > lastN ? 'up' : 'down'; [c, b].forEach(el => { el.classList.remove('up', 'down'); void el.offsetWidth; el.classList.add(cls); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('up', 'down'), 460); }); } lastN = n; $('num').textContent = n.toLocaleString('ko-KR'); b.textContent = n.toLocaleString('ko-KR'); }
  if (en !== lastEn) { lastEn = en; $('foeTag').textContent = en.toLocaleString('ko-KR'); }
  $('progFill').style.width = clamp(-S.pz / S.len, 0, 1) * 100 + '%';
  const fight = ph === 'battle'; // 맞붙으면 두 숫자가 겹치지 않게 좌우로 벌린다
  const gateNear = ph === 'run' && gates.some(g => !g.used && S.pz - g.z < 9); // 관문 바로 앞에선 머리 위 숫자가 관문 숫자를 가리지 않게 숨김(위 영웅 수는 그대로)
  place($('bub'), fight ? -2.3 : S.px, 1.6 + rad * .25, fight ? S.armyZ + 1 : S.pz, (ph === 'run' && !gateNear || fight) && n > 0);
  place($('foeTag'), fight ? 2.3 : 0, 2.2, S.armyZ - 2, en > 0 && S.pz < S.armyZ + 90 && ph !== 'menu');
  place($('bossTag'), 0, 11.4, S.bossZ, ph === 'boss');
  $('bossFill').style.width = S.hp / S.hp0 * 100 + '%';
}

/* ---------------- UI flow ---------------- */
let sel = Math.min(save.u, LEVELS.length) - 1;
function drawGrid(){
  const g = $('grid'); g.innerHTML = '';
  LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.className = 'lv' + (i === sel ? ' sel' : ''); b.disabled = i >= save.u; b.id = 'lv' + (i + 1);
    const st = save.s[i] || 0; b.innerHTML = `<b>${i + 1}</b><small>${L.tag}</small><i>${'★'.repeat(st)}</i>`;
    b.setAttribute('aria-label', `${i + 1}단계, ${L.name}`); b.onclick = () => { sel = i; drawGrid(); buildLevel(i); S.phase = 'menu'; }; g.appendChild(b); });
  $('bPlay').textContent = (sel + 1) + '단계 시작';
}
function showMenu(){ setPause(false); roundOn = false; S.phase = 'menu'; document.body.classList.add('inmenu'); $('end').classList.remove('on'); $('menu').classList.add('on'); $('drag').style.display = 'none'; drawGrid(); buildLevel(sel); S.phase = 'menu'; }
function startLevel(i){ setPause(false); document.body.classList.remove('inmenu'); sel = i; buildLevel(i); S.phase = 'run'; roundOn = true; hk({type:'hk:start'}); $('menu').classList.remove('on'); $('end').classList.remove('on'); $('drag').style.display = 'block'; }
function showEnd(won){
  S.shown = true; const last = S.lvl === LEVELS.length - 1;
  const st0 = won ? (n / S.best >= .5 ? 3 : n / S.best >= .25 ? 2 : 1) : 0;
  const res = calcScore(won, S.lvl + 1, st0, n, clamp(-S.pz / S.len, 0, 1));
  $('endScore').textContent = '점수 ' + res.score.toLocaleString('ko-KR') + '점';
  $('endCalc').innerHTML = res.lines.map(l => '<div>' + l + '</div>').join('') + (won ? `<div style="opacity:.75">별: 이 단계 최대 ${S.best.toLocaleString('ko-KR')}명 중 절반 이상 ★3 · 4분의 1 이상 ★2</div>` : '<div>성공하면: 단계 × 500 + 별 × 300 + 살아남은 영웅 × 10</div>');
  if (roundOn) { roundOn = false; hk({type:'hk:score', score:Math.max(0, Math.floor(res.score))}); }
  if (won) {
    const st = st0;
    save.s[S.lvl] = Math.max(save.s[S.lvl] || 0, st); save.u = Math.max(save.u, Math.min(LEVELS.length, S.lvl + 2)); store(); sfx.win();
    $('endTitle').textContent = last ? '모든 보스를 쓰러뜨렸어요!' : `${S.lvl + 1}단계 성공!`;
    $('stars').innerHTML = '<b>' + '★'.repeat(st) + '</b>' + '★'.repeat(3 - st); $('stars').style.display = '';
    $('endNum').textContent = n.toLocaleString('ko-KR'); $('endNum').className = ''; $('endSub').textContent = '명이 살아남았어요';
    $('bNext').style.display = last ? 'none' : ''; $('bNext').textContent = '다음 단계';
  } else {
    $('endTitle').textContent = '영웅이 모두 쓰러졌어요'; $('stars').style.display = 'none'; $('endNum').textContent = '0'; $('endNum').className = 'zero';
    $('endSub').textContent = S.why === 'trap' ? '함정에 영웅이 모두 떨어졌어요. 함정을 피하고 파란 관문으로 지나가 보세요.'
      : S.why === 'army' ? `적 군대는 ${S.army0.toLocaleString('ko-KR')}명이었어요. 그보다 많은 영웅을 데리고 끝까지 가 보세요.`
      : '보스가 마지막 영웅까지 떨쳐 냈어요. 더 많은 영웅을 데리고 가 보세요.';
    $('bNext').style.display = ''; $('bNext').textContent = '다시 도전';
  }
  $('end').classList.add('on');
}
$('bPlay').onclick = () => { audioOn(); startLevel(sel); };
/* 일시정지 — hk:pause · 다른 탭으로 갈 때. 달리기 · 전투 · 보스 중에만 */
let paused = false;
function setPause(on){
  const was = paused;
  paused = !!on && (S.phase === 'run' || S.phase === 'battle' || S.phase === 'boss');
  if (paused !== was) hk({type: paused ? 'hk:paused' : 'hk:resumed'});
  $('pause').classList.toggle('on', paused); if (paused) { dragging = false; for (const k in keys) keys[k] = false; keyDir = 0; }
}
$('bResume').onclick = () => setPause(false);
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
window.addEventListener('message', e => {
  if (e.origin !== HK || !e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'hk:hello') document.documentElement.classList.add('in-hk');
  else if (e.data.type === 'hk:pause') setPause(true);
  else if (e.data.type === 'hk:resume') setPause(false);
  else if (e.data.type === 'hk:restart') showMenu();
});
$('bNext').onclick = () => { audioOn(); startLevel(S.phase === 'win' ? S.lvl + 1 : S.lvl); };
$('bAgain').onclick = () => startLevel(S.lvl);
$('bLevels').onclick = showMenu; $('bMenu').onclick = showMenu;
$('bRetry').onclick = () => { if (S.phase !== 'menu') startLevel(S.lvl); };
$('bMute').onclick = () => { muted = !muted; $('bMute').style.opacity = muted ? .4 : 1; if (!muted) audioOn(); };

/* ---------------- input ---------------- */
let dragging = false, lastX = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; audioOn(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
canvas.addEventListener('pointermove', e => {
  if (!dragging || paused || S.phase !== 'run') { lastX = e.clientX; return; }
  S.px += (e.clientX - lastX) / Math.min(innerWidth, 720) * 13; lastX = e.clientX;
  if (!S.started) { S.started = true; $('drag').style.display = 'none'; }
});
const up = () => { dragging = false; }; canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
const keys = {};
const setKeys = () => { keyDir = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0); if (keyDir && S.phase === 'run') $('drag').style.display = 'none'; };
/* Esc — 아케이드 모드에선 부모(헬스키퍼)가 멈춤/이어 하기를 정한다(hk:esc), 단독으로 열면 스스로 토글 */
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.repeat) return;
  e.preventDefault();
  if (ARCADE && window.parent !== window) { if (paused || S.phase === 'run' || S.phase === 'battle' || S.phase === 'boss') hk({type:'hk:esc'}); }
  else setPause(!paused);
});
window.addEventListener('keydown', e => { if (paused) return; keys[e.key] = true; setKeys(); if (paused) return; if ((e.key === 'Enter' || e.key === ' ') && S.phase === 'menu' && document.activeElement === document.body) { audioOn(); startLevel(sel); } });
window.addEventListener('keyup', e => { keys[e.key] = false; setKeys(); });

/* ---------------- loop ---------------- */
let last = performance.now();
/* 느린 휴대폰: 플레이 중 2초 평균이 25ms(40fps)보다 느리면 화면 해상도를 한 칸씩 낮춘다(최저 1.25배) */
let prNow = Math.min(window.devicePixelRatio || 1, 2), slowT = 0, slowF = 0;
function adapt(raw){
  if (prNow <= 1.25 || raw > .1 || !(S.phase === 'run' || S.phase === 'battle' || S.phase === 'boss')) return;
  slowT += raw; slowF++;
  if (slowT < 2) return;
  if (slowT / slowF > .025) { prNow = Math.max(1.25, prNow - .25); renderer.setPixelRatio(prNow); resize(); }
  slowT = 0; slowF = 0;
}
function frame(now){ const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now; if (!paused) adapt(raw);
  // 느린 휴대폰(프레임이 듬성)에서도 함정 판정이 건너뛰지 않게 1/60초 이하로 나눠 움직인다
  if (!paused) { const st = Math.ceil(dt * 60 - 1e-6) || 1; for (let i = 0; i < st; i++) update(dt / st); }
  render(paused ? 0 : dt); requestAnimationFrame(frame); }
showMenu();
requestAnimationFrame(frame);
if (!ARCADE) window.__hr = {S, LEVELS, update, render, startLevel, gates: () => gates, n: () => n, en: () => en, applyOp}; // 시험용 — 아케이드 모드에선 숨김
hk({type:'hk:ready'});
})();
</script>
