<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hero Rush Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-bleed 3D stage, toy-like chunky HUD pinned to the top, cards float centre. */
:root{
  --ink:#1b2440;
  --paper:#ffffff;
  --hero:#2f8cff;
  --foe:#ff4d5e;
  --gold:#ffc83d;
  --good:#1fbf75;
  --font-display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--font-body);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.pill{background:var(--paper);border-radius:999px;box-shadow:0 4px 0 rgba(27,36,64,.22);padding:6px 14px;font-weight:600;font-size:15px;pointer-events:auto}
#lvl{display:flex;flex-direction:column;gap:5px;border-radius:16px;min-width:108px}
#lvlName{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
#prog{height:6px;border-radius:3px;background:#e3e8f2;overflow:hidden}
#progFill{height:100%;width:0;background:var(--hero);border-radius:3px}
#count{position:fixed;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 20px 8px 12px;font-family:var(--font-display);pointer-events:none}
#count .ico{width:34px;height:34px;border-radius:50%;background:var(--hero);position:relative;flex:none}
#count .ico::before{content:"";position:absolute;left:50%;top:5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#ffd9b0}
#count .ico::after{content:"";position:absolute;left:50%;bottom:4px;width:17px;height:12px;margin-left:-8.5px;border-radius:8px 8px 4px 4px;background:#fff}
#count .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;line-height:1}
#count .num{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch}
#count.up{animation:bump .25s}
#count.up .num{color:var(--good)}
#count.down{animation:shake .25s}
#count.down .num{color:var(--foe)}
@keyframes bump{50%{transform:translateX(-50%) scale(1.14)}}
@keyframes shake{25%{transform:translateX(calc(-50% - 5px))}75%{transform:translateX(calc(-50% + 5px))}}
#btns{display:flex;gap:8px}
#btns button{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:17px}

/* world-anchored labels */
.tag{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--font-display);font-weight:700;will-change:transform;display:none}
#bub{background:var(--hero);color:#fff;border-radius:12px;padding:1px 11px;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
#foeTag{background:var(--foe);color:#fff;border-radius:12px;padding:1px 11px;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
#bossTag{width:180px;text-align:center;color:#fff;font-size:13px;letter-spacing:.1em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#bossBar{height:14px;border-radius:7px;background:rgba(27,36,64,.55);border:2px solid #fff;overflow:hidden;margin-top:2px}
#bossFill{height:100%;width:100%;background:var(--foe)}
.pop{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:40px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:rise .9s ease-out forwards}
.pop.bad{color:#ff8a94}
.pop.good{color:#9dffcb}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-90px}}

/* overlays */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,32,70,.35)}
.overlay.on{display:flex}
.card{background:var(--paper);border-radius:26px;box-shadow:0 8px 0 rgba(27,36,64,.25);padding:22px 22px 20px;width:min(430px,100%);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--hero)}
h2{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0;font-size:15px;line-height:1.4;font-weight:500;opacity:.8}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{background:#eef3fb;border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--font-display);box-shadow:0 3px 0 #cfd8e8}
.lv b{font-size:22px;line-height:1}
.lv small{font-size:10px;font-weight:600;opacity:.65;white-space:nowrap}
.lv i{font-style:normal;font-size:11px;color:var(--gold);letter-spacing:1px;height:13px}
.lv.sel{background:var(--hero);color:#fff;box-shadow:0 3px 0 #1b62c4}
.lv.sel small{opacity:.9}
.lv:disabled{opacity:.4;cursor:not-allowed}
.big{background:var(--gold);border-radius:16px;padding:13px 18px;font-family:var(--font-display);font-weight:700;font-size:22px;box-shadow:0 5px 0 #c9951a}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c9951a}
.ghost{background:#eef3fb;border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px;box-shadow:0 3px 0 #cfd8e8;flex:1}
.row{display:flex;gap:8px}
#stars{font-size:44px;line-height:1;letter-spacing:6px;color:#dfe5f0}
#stars b{color:var(--gold);font-weight:400}
#endNum{font-family:var(--font-display);font-size:54px;font-weight:700;line-height:1;color:var(--hero);font-variant-numeric:tabular-nums}
#endNum.zero{color:var(--foe)}
.hint{font-size:13px;opacity:.6}
#drag{position:fixed;left:0;right:0;bottom:9%;text-align:center;font-family:var(--font-display);font-weight:600;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;display:none}
@media (max-width:560px){h1{font-size:34px}#count{top:70px;padding:6px 16px 6px 10px}#count .num{font-size:28px}#count .ico{width:28px;height:28px}#count .ico::before{top:4px;width:9px;height:9px;margin-left:-4.5px}#count .ico::after{width:14px;height:10px;margin-left:-7px;bottom:3px}}
@media (prefers-reduced-motion:reduce){#count.up,#count.down{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill" id="lvl"><div><span id="lvlNo">Level 1</span></div><div id="lvlName">Saw blades</div><div id="prog"><div id="progFill"></div></div></div>
  <div id="btns">
    <button class="pill" id="bMute" title="Sound on or off" aria-label="Sound on or off">♪</button>
    <button class="pill" id="bRetry" title="Restart level" aria-label="Restart level">↻</button>
    <button class="pill" id="bMenu" title="Level list" aria-label="Level list">☰</button>
  </div>
</div>
<div class="pill" id="count"><div class="ico"></div><div><div class="lab">Heroes</div><div class="num" id="num">3</div></div></div>

<div class="tag" id="bub">3</div>
<div class="tag" id="foeTag">0</div>
<div class="tag" id="bossTag">BOSS<div id="bossBar"><div id="bossFill"></div></div></div>
<div id="drag">Drag left and right to steer</div>

<div class="overlay on" id="menu">
  <div class="card">
    <h1>Hero <span>Rush</span> Bridge</h1>
    <p>Steer your crowd through the blue gates, dodge the traps, crush the army and topple the boss.</p>
    <div id="grid"></div>
    <button class="big" id="bPlay">Play level 1</button>
    <div class="hint">Drag, or use ← → / A D. Blue gates add heroes, red gates take them away.</div>
  </div>
</div>

<div class="overlay" id="end">
  <div class="card">
    <h2 id="endTitle">Level cleared</h2>
    <div id="stars"></div>
    <div><div id="endNum">0</div><p id="endSub">heroes still standing</p></div>
    <button class="big" id="bNext">Next level</button>
    <div class="row"><button class="ghost" id="bAgain">Play again</button><button class="ghost" id="bLevels">Levels</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

function pop(text, good, x, y, z){

}
function onDeck(x, z){

}

    else for (let i = n; i > target; i--) { const j = (Math.random() * n) | 0; addRag(hx[j], FEET, hz[j], rand(-4, 4), rand(6, 10), rand(-8, -2), 0, false); removeHero(j); }

function updBattle(dt){

    S.kacc += clamp(S.army0 / 2, 14, 130) * dt;
    while (S.kacc >= 1 && n > 0 && en > 0) {
      S.kacc--; const j = (Math.random() * n) | 0; addRag(hx[j], FEET, hz[j], rand(-6, 6), rand(6, 12), rand(2, 9), 0, false); removeHero(j);
      const e = (Math.random() * en) | 0; addRag(ex[e], FEET, ez[e], rand(-6, 6), rand(6, 12), rand(-10, -3), 1, false); en--; ex[e] = ex[en]; ez[e] = ez[en];
      sfx.hit(); S.shake = Math.min(.35, S.shake + .02);
    }
  }
  if (n === 0) return fail('army');
  if (en === 0) { S.phase = 'boss'; S.pt = 0; }
}
function bossPoint(a, h, out){
  const head = h > 6.5, rx = head ? 1.15 : h < 3 ? 1.75 : 2.05, rz = head ? 1.1 : 1.35;
  out.x = Math.cos(a) * rx + h * Math.sin(boss.g.rotation.z) * -1; out.z = S.bossZ + Math.sin(a) * rz; return out;
}
const bp = {x:0, z:0};
function updBoss(dt){
  S.pt += dt; let att = 0;
  for (let i = 0; i < n; i++) {
    if (!hat[i]) { bossPoint(hang[i], 0, bp); const dx = bp.x - hx[i], dz = bp.z - hz[i], d = Math.hypot(dx, dz), st = 24 * dt;
      if (d < st + .2) { hat[i] = 1; hy[i] = 0; } else { hx[i] += dx / d * st; hz[i] += dz / d * st; } }
    else { att++; hy[i] = Math.min(hht[i], hy[i] + 4.5 * dt); bossPoint(hang[i], hy[i], bp); hx[i] = bp.x; hz[i] = bp.z; }
  }
  const hurt = 1 - S.hp / S.hp0;
  boss.g.rotation.z = Math.sin(S.t * 9) * .035 * (1 + hurt * 2.5);
  boss.arms[0].rotation.x = Math.sin(S.t * 6) * .9; boss.arms[1].rotation.x = Math.sin(S.t * 6 + 2) * .9;
  if (att > 0) {
    S.hp -= Math.sqrt(att / S.need) * dt; S.facc += Math.max(S.need / 6, n * .04) * dt;
    while (S.facc >= 1 && n > 0) { S.facc--; let j = (Math.random() * n) | 0, tries = 0; while (!hat[j] && tries++ < 8) j = (Math.random() * n) | 0; if (!hat[j]) break;
      const a = hang[j]; addRag(hx[j], FEET + hy[j], hz[j], Math.cos(a) * rand(7, 14), rand(4, 11), Math.sin(a) * rand(7, 14), 0, false); removeHero(j); sfx.hit(); }
  }
  if (S.hp <= 0) { S.hp = 0; S.phase = 'win'; S.pt = 0; sfx.thud(); return; }
  if (n === 0) fail('boss');
}
function updWin(dt){
  S.pt += dt; const a = Math.min(1, S.pt / 1.15), k = 1 - Math.exp(-dt * 5);
  boss.g.rotation.z *= .9; boss.g.rotation.x = -Math.PI / 2 * a * a;
  if (a >= 1) { const f = S.pt - 1.15; boss.g.position.y = -f * f * 22; if (!boss.splashed && boss.g.position.y < -8) { boss.splashed = true; splash(0, S.bossZ - 5, true); S.shake = .5; sfx.thud(); } }
  for (let i = 0; i < n; i++) { hx[i] += (SLX[i] * 1.3 - hx[i]) * k; hz[i] += (S.bossZ + 8 + SLZ[i] * 1.3 - hz[i]) * k; hy[i] += (0 - hy[i]) * k * 1.5; }
  if (S.pt > 2.4 && !S.shown) showEnd(true);
}
function fail(why){ S.phase = 'fail'; S.why = why; S.pt = 0; sfx.lose(); $('drag').style.display = 'none'; }

function updRags(dt){
  for (let i = rn - 1; i >= 0; i--) {
    R.life[i] -= dt; let dead = R.life[i] <= 0;
    if (!R.flat[i]) {
      R.vy[i] -= 30 * dt; R.x[i] += R.vx[i] * dt; R.y[i] += R.vy[i] * dt; R.z[i] += R.vz[i] * dt; R.ax[i] += R.wx[i] * dt; R.az[i] += R.wz[i] * dt;
      if (R.y[i] < .3 && R.y[i] > -.35 && R.vy[i] < 0 && onDeck(R.x[i], R.z[i])) { R.y[i] = .3; R.vy[i] *= -.45; R.vx[i] *= .7; R.vz[i] *= .7; R.wx[i] *= .6; R.wz[i] *= .6; if (R.vy[i] < 2) { R.vy[i] = 0; R.life[i] = Math.min(R.life[i], .7); } }
      if (R.y[i] < -8.8) { splash(R.x[i], R.z[i]); dead = true; }
    }
    if (dead) { rn--; for (const k in R) R[k][i] = R[k][rn]; }
  }
  for (const m of splashes) { if (!m.visible) continue; const u = m.userData; u.t += dt; const s = (1 + u.t * 5) * u.s; m.scale.set(s, 1, s); m.material.opacity = Math.max(0, .8 - u.t * 1.3); if (u.t > .65) m.visible = false; }
}

function update(dt){
  S.t += dt;
  if (S.phase === 'run') updRun(dt); else if (S.phase === 'battle') updBattle(dt); else if (S.phase === 'boss') updBoss(dt); else if (S.phase === 'win') updWin(dt);
  else if (S.phase === 'fail') { S.pt += dt; if (S.pt > 1.4 && !S.shown) showEnd(false); }
  for (const tr of traps) if (tr.z - S.pz < 120 && tr.z - S.pz > -60) tr.upd(S.t, dt);
  updRags(dt);
  S.shake = Math.max(0, S.shake - dt * 1.5);
}

/* ---------------- render ---------------- */
const m4 = new T.Matrix4(), v3 = new T.Vector3(), sc = new T.Vector3(), q = new T.Quaternion(), eu = new T.Euler();
const qRun = new T.Quaternion().setFromEuler(new T.Euler(-.2, 0, 0)), qId = new T.Quaternion();
const camPos = new T.Vector3(3, 6, 11), camLook = new T.Vector3(0, 1, -6), wantPos = new T.Vector3(), wantLook = new T.Vector3();
let lastN = -1, lastEn = -1;
function put(k, x, y, z, qq, sx, sy, sz, type){
  m4.compose(v3.set(x, y, z), qq, sc.set(sx, sy, sz)); m4.toArray(bodies.instanceMatrix.array, k * 16);
  const b = COL_B[type], h = COL_H[type], cb = bodies.instanceColor.array, ch = heads.instanceColor.array, o = k * 3;
  cb[o] = b.r; cb[o + 1] = b.g; cb[o + 2] = b.b; ch[o] = h.r; ch[o + 1] = h.g; ch[o + 2] = h.b;
}
function place(el, x, y, z, show){
  if (!show) { el.style.display = 'none'; return; }
  v3.set(x, y, z).project(camera); if (v3.z > 1) { el.style.display = 'none'; return; }
  el.style.display = 'block'; el.style.transform = `translate(${(v3.x * .5 + .5) * innerWidth}px,${(-v3.y * .5 + .5) * innerHeight}px) translate(-50%,-100%)`;
}
function render(dt){
  const ph = S.phase, t = S.t; let k = 0;
  const moving = ph === 'run' || ph === 'battle', hopA = ph === 'win' ? .7 : moving ? .13 : .05, hopF = ph === 'win' ? 7 : moving ? 13 : 4;
  for (let i = 0; i < n; i++) {
    const climb = ph === 'boss' && hat[i], hop = climb ? Math.abs(Math.sin(t * 16 + hph[i])) * .08 : Math.abs(Math.sin(t * hopF + hph[i])) * hopA, s = hs[i];
    put(k++, hx[i], FEET * s + hy[i] + hop, hz[i], moving || (ph === 'boss' && !hat[i]) ? qRun : qId, s, s, s, 0);
  }
  for (let i = 0; i < en; i++) put(k++, ex[i], FEET + Math.abs(Math.sin(t * (ph === 'battle' ? 13 : 5) + eph[i])) * (ph === 'battle' ? .13 : .07), ez[i], qId, 1.05, 1.05, 1.05, 1);
  for (let i = 0; i < rn; i++) {
    if (R.flat[i]) { const f = Math.min(1, R.life[i] / .4); put(k++, R.x[i], .06, R.z[i], qId, 1.7 * f, .12, 1.7 * f, R.type[i]); }
    else { const s = Math.min(1, R.life[i] / .35); q.setFromEuler(eu.set(R.ax[i], 0, R.az[i])); put(k++, R.x[i], R.y[i], R.z[i], q, s, s, s, R.type[i]); }
  }
  bodies.count = heads.count = k; bodies.instanceMatrix.needsUpdate = true; bodies.instanceColor.needsUpdate = true; heads.instanceColor.needsUpdate = true;

  // camera
  const rad = .165 * Math.sqrt(Math.max(1, n)), zoom = 1 + Math.min(1, rad / 4.5) * .55, tall = camera.aspect < 1 ? 1.15 : 1;
  if (ph === 'menu') { wantPos.set(Math.sin(t * .3) * 4, 6, 12); wantLook.set(0, 1, -8); }
  else if (ph === 'run' || (ph === 'fail' && S.why === 'trap')) { wantPos.set(S.px * .45, (6.5 * zoom + 1.5) * tall, S.pz + 9.5 * zoom * tall); wantLook.set(S.px * .45, .5, S.pz - 9); }
  else if (ph === 'battle' || (ph === 'fail' && S.why === 'army')) { wantPos.set(0, 12 * tall, S.armyZ + 19 * tall); wantLook.set(0, 1, S.armyZ - 3); }
  else { wantPos.set(5, 11 * tall, S.bossZ + 27 * tall); wantLook.set(0, 3.4, S.bossZ + 2); }
  const ck = 1 - Math.exp(-dt * (ph === 'run' ? 8 : 3)); camPos.lerp(wantPos, ck); camLook.lerp(wantLook, ck);
  camera.position.copy(camPos); if (S.shake > 0) { camera.position.x += rand(-1, 1) * S.shake * .5; camera.position.y += rand(-1, 1) * S.shake * .5; }
  camera.lookAt(camLook);
  sun.position.set(camLook.x + 9, 20, camLook.z + 10); sun.target.position.set(camLook.x, 0, camLook.z + 2);
  renderer.render(scene, camera);

  // HUD
  if (n !== lastN) { const c = $('count'); if (lastN >= 0) { c.classList.remove('up', 'down'); void c.offsetWidth; c.classList.add(n > lastN ? 'up' : 'down'); clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove('up', 'down'), 320); } lastN = n; $('num').textContent = n; $('bub').textContent = n; }
  if (en !== lastEn) { lastEn = en; $('foeTag').textContent = en; }
  $('progFill').style.width = clamp(-S.pz / S.len, 0, 1) * 100 + '%';
  place($('bub'), S.px, 1.6 + rad * .25, S.pz, (ph === 'run' || ph === 'battle') && n > 0);
  place($('foeTag'), 0, 2.2, S.armyZ - 2, en > 0 && S.pz < S.armyZ + 90 && ph !== 'menu');
  place($('bossTag'), 0, 10.2, S.bossZ, ph === 'boss');
  $('bossFill').style.width = S.hp / S.hp0 * 100 + '%';
}

/* ---------------- UI flow ---------------- */
let sel = Math.min(save.u, LEVELS.length) - 1;
function drawGrid(){
  const g = $('grid'); g.innerHTML = '';
  LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.className = 'lv' + (i === sel ? ' sel' : ''); b.disabled = i >= save.u; b.id = 'lv' + (i + 1);
    const st = save.s[i] || 0; b.innerHTML = `<b>${i + 1}</b><small>${L.tag}</small><i>${'★'.repeat(st)}</i>`;
    b.setAttribute('aria-label', `Level ${i + 1}, ${L.name}`); b.onclick = () => { sel = i; drawGrid(); buildLevel(i); S.phase = 'menu'; }; g.appendChild(b); });
  $('bPlay').textContent = 'Play level ' + (sel + 1);
}
function showMenu(){ S.phase = 'menu'; $('end').classList.remove('on'); $('menu').classList.add('on'); $('drag').style.display = 'none'; drawGrid(); buildLevel(sel); S.phase = 'menu'; }
function startLevel(i){ sel = i; buildLevel(i); S.phase = 'run'; $('menu').classList.remove('on'); $('end').classList.remove('on'); $('drag').style.display = 'block'; }
function showEnd(won){
  S.shown = true; const last = S.lvl === LEVELS.length - 1;
  if (won) {
    const ratio = n / S.best, st = ratio >= .5 ? 3 : ratio >= .25 ? 2 : 1;
    save.s[S.lvl] = Math.max(save.s[S.lvl] || 0, st); save.u = Math.max(save.u, Math.min(LEVELS.length, S.lvl + 2)); store(); sfx.win();
    $('endTitle').textContent = last ? 'You toppled every boss' : `Level ${S.lvl + 1} cleared`;
    $('stars').innerHTML = '<b>' + '★'.repeat(st) + '</b>' + '★'.repeat(3 - st); $('stars').style.display = '';
    $('endNum').textContent = n; $('endNum').className = ''; $('endSub').textContent = n === 1 ? 'hero still standing' : 'heroes still standing';
    $('bNext').style.display = last ? 'none' : ''; $('bNext').textContent = 'Next level';
  } else {
    $('endTitle').textContent = 'Crowd wiped out'; $('stars').style.display = 'none'; $('endNum').textContent = '0'; $('endNum').className = 'zero';
    $('endSub').textContent = S.why === 'trap' ? 'The traps knocked every hero off the bridge. Steer around them and take the blue gates.'
      : S.why === 'army' ? `The enemy army had ${S.army0} fighters. Reach the end with more heroes than that.`
      : 'The boss shook off your last hero. Bring a bigger crowd to the fight.';
    $('bNext').style.display = ''; $('bNext').textContent = 'Try again';
  }
  $('end').classList.add('on');
}
$('bPlay').onclick = () => { audioOn(); startLevel(sel); };
$('bNext').onclick = () => { audioOn(); startLevel(S.phase === 'win' ? S.lvl + 1 : S.lvl); };
$('bAgain').onclick = () => startLevel(S.lvl);
$('bLevels').onclick = showMenu; $('bMenu').onclick = showMenu;
$('bRetry').onclick = () => { if (S.phase !== 'menu') startLevel(S.lvl); };
$('bMute').onclick = () => { muted = !muted; $('bMute').style.opacity = muted ? .4 : 1; if (!muted) audioOn(); };

/* ---------------- input ---------------- */
let dragging = false, lastX = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; audioOn(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
canvas.addEventListener('pointermove', e => {
  if (!dragging || S.phase !== 'run') { lastX = e.clientX; return; }
  S.px += (e.clientX - lastX) / Math.min(innerWidth, 720) * 13; lastX = e.clientX;
  if (!S.started) { S.started = true; $('drag').style.display = 'none'; }
});
const up = () => { dragging = false; }; canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
const keys = {};
const setKeys = () => { keyDir = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0); if (keyDir && S.phase === 'run') $('drag').style.display = 'none'; };
window.addEventListener('keydown', e => { keys[e.key] = true; setKeys(); if ((e.key === 'Enter' || e.key === ' ') && S.phase === 'menu' && document.activeElement === document.body) { audioOn(); startLevel(sel); } });
window.addEventListener('keyup', e => { keys[e.key] = false; setKeys(); });

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(dt); requestAnimationFrame(frame); }
showMenu();
requestAnimationFrame(frame);
window.__hr = {S, LEVELS, update, render, startLevel, gates: () => gates, n: () => n, en: () => en, applyOp};
})();
</script>
</body>
