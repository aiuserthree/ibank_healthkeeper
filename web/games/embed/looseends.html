<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>실타래 풀기</title>
  <link rel="stylesheet" href="looseends/style.css?v=6">
</head>
<body>
  <main id="game">
    <canvas id="board" aria-label="실타래 판. 핀을 끌어 빈 구멍에 놓으세요. 덮인 줄을 빼면 위 줄과 꼬여요. 방향키로 고르고 Enter로 집거나 놓을 수 있어요." tabindex="0"></canvas>
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true">∞</span><b>실타래 풀기</b></div>
      <div class="puzzle-chip" id="puzzle-chip"><strong id="puzzle-label">퍼즐 01 / 40</strong><small id="puzzle-name"></small></div>
      <div class="right-top">
        <div class="stars-chip" id="stars-chip"><span class="star" aria-hidden="true">★</span><b id="star-total">0 / 120</b></div>
        <button id="btn-map" class="icon-btn violet" aria-label="퍼즐 지도">▦</button>
        <button id="btn-pause" class="icon-btn coral" aria-label="일시정지">Ⅱ</button>
      </div>
    </header>
    <aside class="left-tools">
      <button id="btn-help" class="round-btn" aria-label="방법">?</button>
      <button id="btn-settings" class="round-btn" aria-label="설정">⚙</button>
    </aside>
    <aside class="side left" id="side-left">
      <div class="stats-row"><div class="stat moves"><small>이동</small><b id="moves">0</b></div><div class="stat target"><small>목표</small><b id="target">1</b></div></div>
      <div class="goal" id="goal"></div>
      <div class="ropes-left" id="ropes-left"><span class="dots" id="ropes-dots"></span><small id="ropes-text">3줄 남음</small><span class="twist-badge" id="twist-badge" hidden></span></div>
    </aside>
    <aside class="side right" id="side-right">
      <div id="coach" class="coach" aria-live="polite"></div>
      <footer class="bottom">
        <button id="btn-hint" class="act hint">? 힌트</button>
        <button id="btn-undo" class="act undo" disabled>↶ 되돌리기</button>
        <button id="btn-restart" class="act restart">↻ 다시 하기</button>
      </footer>
    </aside>
    <div id="modal-root"></div>
    <div id="loading-error" class="overlay" hidden><div class="card"><h2>게임을 불러오지 못했어요</h2><p>페이지를 새로고침해 주세요.</p></div></div>
  </main>
  <script src="looseends/rules.js?v=6"></script>
  <script src="looseends/levels.js?v=6"></script>
  <script src="looseends/game.js?v=6"></script>
</body>
</html>
