<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/_shared/no-zoom.js"></script>
<script src="/_shared/api.js"></script>
<script src="/_shared/mgmt.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>문구 팡팡</title>
<style>
@font-face{font-family:'Pretendard';src:url('/assets/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  /* 책상 위 문구 — 나무 책상, 코르크 판, 포스트잇 목표, 탁상 달력 이동 수 */
  --wood:#7a4a26; --wood-2:#5e3518; --paper:#fffaf0; --ink:#2b2118; --dim:#7b6a58;
  --accent:#6d28d9; --accent-2:#5b21b6; --note:#fde68a; --red:#dc2626; --ok:#16a34a;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#6f4425;color:var(--ink);font-family:var(--font);font-weight:600;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;word-break:keep-all}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fde047;outline-offset:3px}

/* 머리줄 */
#top{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:linear-gradient(#4a2a14,#3a200f);box-shadow:0 2px 0 rgba(0,0,0,.18);color:#fff7e6;z-index:5}
#top .sp{flex:1}
.icon-btn{width:34px;height:32px;border-radius:9px;background:rgba(255,247,230,.12);display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,247,230,.2)}
.icon-btn svg{width:18px;height:18px;fill:#fff7e6}
#lvl{display:flex;align-items:center;gap:6px;font-size:17px;letter-spacing:-.01em}
#lvDiff{font-size:12px;padding:2px 7px;border-radius:999px;background:#f97316;color:#fff}
#lvDiff.vhard{background:#dc2626}
.in-hk .standalone{display:none}

/* 달력 · 포스트잇 */
#panel{position:fixed;z-index:3;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#panel.side{flex-direction:column;align-items:stretch}
#cal{flex:none;width:80px;height:88px;border-radius:10px;background:#fff;box-shadow:0 3px 0 #d6cbb8,0 6px 14px rgba(0,0,0,.28);position:relative;overflow:hidden;text-align:center}
#cal .cal-top{height:24px;background:#dc2626;color:#fff;font-size:12px;line-height:24px;letter-spacing:.02em}
#cal .cal-num{font-size:40px;line-height:60px;font-weight:800;font-variant-numeric:tabular-nums;color:#1f2937}
#cal .rings{position:absolute;top:-5px;left:0;right:0;display:flex;justify-content:space-around;padding:0 16px}
#cal .rings i{width:6px;height:13px;border-radius:3px;background:#9ca3af;box-shadow:inset 0 -2px 0 #6b7280}
#cal.flip .cal-num{animation:flip .15s ease-out}
#cal.low .cal-num{color:#dc2626;animation:pulse 1s ease-in-out infinite}
@keyframes flip{0%{transform:perspective(200px) rotateX(-70deg);opacity:.2}100%{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.1)}}
#panel.side #cal{width:100%;height:96px}
#goals{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
#panel.side #goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.postit{width:64px;height:74px;background:linear-gradient(#fef3a7,#fde68a);border-radius:2px 2px 10px 2px;box-shadow:0 4px 10px rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:transform .15s}
.postit:nth-child(2n){transform:rotate(2.5deg);background:linear-gradient(#ffd6e7,#fbcfe8)}
.postit:nth-child(3n){transform:rotate(-2deg);background:linear-gradient(#d1fae5,#a7f3d0)}
.postit:nth-child(4n){background:linear-gradient(#dbeafe,#bfdbfe)}
.postit:first-child{transform:rotate(-2deg)}
.postit::before{content:'';position:absolute;top:-6px;left:50%;width:30px;height:12px;margin-left:-15px;background:rgba(255,255,255,.55);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.postit canvas{width:36px;height:36px}
.postit b{font-size:19px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.postit.bump b{animation:bump .25s ease-out}
.postit.done b{color:var(--ok)}
.postit .chk{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:none;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.postit.done .chk{display:grid}
.postit .chk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#panel.side .postit{width:auto;height:84px}
#panel:not(.side) #goals.g4{gap:6px}
#panel:not(.side) #goals.g4 .postit{width:55px;height:70px}
#panel:not(.side) #goals.g4 .postit canvas{width:32px;height:32px}
@keyframes bump{40%{transform:scale(1.35)}}

/* 알림 · 카드 */
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
  background:#fffaf0;color:var(--ink);font-size:24px;font-weight:800;padding:12px 26px;border-radius:14px;box-shadow:0 6px 0 #d8c7a8,0 12px 30px rgba(0,0,0,.35);animation:pop .3s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#card{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(40,22,10,.45);padding:16px}
.paper{position:relative;width:min(92vw,360px);background:var(--paper);border-radius:16px;padding:26px 22px 20px;text-align:center;
  box-shadow:0 8px 0 #dfcfb2,0 18px 40px rgba(0,0,0,.4);transform:rotate(-.6deg);animation:cardIn .28s cubic-bezier(.2,1.4,.4,1)}
.paper::before{content:'';position:absolute;top:-10px;left:50%;width:96px;height:22px;margin-left:-48px;background:rgba(253,230,138,.85);transform:rotate(2deg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@keyframes cardIn{0%{transform:scale(.8) rotate(-4deg);opacity:0}100%{transform:rotate(-.6deg);opacity:1}}
.paper h1{margin:4px 0 2px;font-size:34px;font-weight:900;letter-spacing:-.03em;color:var(--accent-2)}
.paper h2{margin:2px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.paper p{margin:6px 0;color:var(--dim);font-size:15px;line-height:1.45}
.paper .cat{width:120px;height:110px;display:block;margin:2px auto 0}
.paper .row{display:flex;justify-content:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.paper .goal{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px;padding:6px 6px 4px;background:#fdf3d0;border-radius:10px}
.paper .goal canvas{width:34px;height:34px}
.paper .goal b{font-size:16px}
.paper .tut{background:#ede9fe;color:#4c1d95;border-radius:10px;padding:9px 12px;font-size:14px;margin:10px 0 2px}
.paper .tut canvas{width:28px;height:28px;vertical-align:middle;margin-right:4px}
.btn{display:block;width:100%;margin-top:10px;padding:13px 16px;border-radius:12px;font-size:18px;font-weight:800;background:var(--accent);color:#fff;
  box-shadow:0 4px 0 #4c1d95;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4c1d95}
.btn.sub{background:#efe4cf;color:var(--ink);box-shadow:0 4px 0 #cdb894;font-size:16px;padding:11px 16px}
.badge{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#f97316;color:#fff;margin-left:6px;vertical-align:middle}
.badge.vhard{background:#dc2626}
.small{font-size:13px!important}
.paper .coin{display:inline-block;margin:6px 0 2px;padding:5px 14px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:800;font-size:16px}
/* 코인 · 연승 · 판 점수(머리줄) */
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 6px;border-radius:999px;background:rgba(255,247,230,.14);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ci{display:inline-block;flex:none;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fef3c7 0 18%,#fbbf24 40%,#d97706 100%);box-shadow:inset 0 0 0 2px #b45309}
.ci.s{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#streakBox svg{width:18px;height:18px}
#streakBox.gold{background:rgba(250,204,21,.28)}
#runBox{font-size:13px;opacity:.85;white-space:nowrap}
@media (max-width:520px){#runBox{display:none}}
@media (max-width:360px){#lvDiff{display:none}}
/* 판 안 아이템(연필꽂이 모양 막대) */
#tools{position:fixed;z-index:4;display:flex;gap:10px;padding:8px 12px 7px;border-radius:16px 16px 12px 12px;background:linear-gradient(#8b5a2b,#6b3f1d);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 5px 12px rgba(0,0,0,.35)}
#tools.side{flex-direction:column;border-radius:16px}
#tools.wait .tool{opacity:.55}
.tool{position:relative;width:52px;height:52px;border-radius:12px;background:linear-gradient(#fffaf0,#f1e4c8);box-shadow:0 3px 0 #c9b38a;display:grid;place-items:center;transition:transform .1s}
.tool canvas{width:40px;height:40px;pointer-events:none}
.tool .n{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#6d28d9;color:#fff;font-size:13px;line-height:22px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tool .n.buy{background:#fef3c7;color:#92400e;display:flex;align-items:center;gap:2px;padding:0 6px 0 3px}
.tool .n.buy .ci{width:12px;height:12px}
.tool.on{transform:translateY(-4px);box-shadow:0 0 0 3px #fde047,0 6px 0 #c9b38a}
#aimTip{position:fixed;z-index:6;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#1f2937;color:#fff;font-size:15px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
/* 단계 시작 카드 — 판 앞 아이템 · 연승 선물 */
.paper .sec{margin:12px 0 2px;font-size:13px;color:var(--dim);text-align:left;display:flex;justify-content:space-between;align-items:center}
.paper .pre{display:flex;justify-content:center;gap:12px;margin:8px 0 10px}
.slot{position:relative;width:62px;height:62px;border-radius:14px;background:#f5ecd8;box-shadow:0 3px 0 #d8c7a8;display:grid;place-items:center}
.slot canvas{width:42px;height:42px;pointer-events:none}
.slot .n{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#6d28d9;color:#fff;font-size:13px;line-height:22px}
.slot .n.buy{background:#fef3c7;color:#92400e;display:flex;align-items:center;gap:2px;padding:0 6px 0 3px}
.slot .n.buy .ci{width:12px;height:12px}
.slot .ok{position:absolute;left:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--ok);display:none;place-items:center}
.slot .ok svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.slot.on{background:#ede9fe;box-shadow:0 0 0 3px #7c3aed,0 3px 0 #d8c7a8}
.slot.on .ok{display:grid}
.paper .gift{display:flex;justify-content:center;gap:6px;margin:6px 0 2px;padding:6px 8px;border-radius:12px;background:#fdf3d0}
.paper .gift canvas{width:30px;height:30px}
.paper .note{font-size:12px;color:var(--dim);margin:4px 0 0}
.paper .hardNote{display:inline-block;margin:2px 0 4px;padding:3px 10px;border-radius:999px;background:#ffedd5;color:#c2410c;font-size:13px}
.paper .hardNote.vhard{background:#fee2e2;color:#b91c1c}
.paper .stats{display:flex;justify-content:center;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.paper .stats div{min-width:84px;padding:7px 10px;border-radius:12px;background:#fdf3d0;font-size:12px;color:var(--dim)}
.paper .stats b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.paper .warn{color:#b91c1c!important}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn .ci{margin:0 2px 0 6px;vertical-align:-2px}
/* 사기 묻기 */
#ask{position:fixed;inset:0;z-index:11;display:grid;place-items:center;background:rgba(40,22,10,.45);padding:16px}
#ask .paper{width:min(88vw,320px)}
#ask canvas{width:56px;height:56px;display:block;margin:0 auto 4px}
.row2{display:flex;gap:10px}.row2 .btn{margin-top:12px}
/* 꾸미기(§6-6) — 구역 그림 + 과제 5개 + 구역 상자 */
#deco{position:fixed;left:0;right:0;top:44px;bottom:0;z-index:7;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;background:linear-gradient(#5e3518,#3a200f);overflow:hidden}
#deco .dhead{flex:none;display:flex;align-items:center;gap:8px;color:#fff7e6;min-height:36px}
#deco .dback{flex:none;height:34px;padding:0 12px 0 6px;border-radius:10px;background:rgba(255,247,230,.14);display:flex;align-items:center;gap:2px;font-size:15px;color:#fff7e6;white-space:nowrap}
#deco .dback:hover{background:rgba(255,247,230,.22)}
#deco .dback svg{width:18px;height:18px;fill:none;stroke:#fff7e6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#deco .dtitle{flex:1;min-width:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#deco .dtitle small{font-size:13px;opacity:.7;margin-left:6px;font-weight:700}
.starPill{flex:none;display:flex;align-items:center;gap:4px;height:30px;padding:0 12px 0 8px;border-radius:999px;background:#fde68a;color:#78350f;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-block;width:16px;height:16px;fill:#f59e0b;stroke:#b45309;stroke-width:1.2;stroke-linejoin:round;vertical-align:-3px;flex:none}
#deco .dbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
#deco .dbody.side{flex-direction:row;align-items:flex-start;justify-content:center;gap:14px}
#deco .droom{position:relative;flex:none;border-radius:14px;overflow:hidden;background:#2a1a0e;box-shadow:0 0 0 3px rgba(255,247,230,.12),0 8px 20px rgba(0,0,0,.45)}
#deco .droom canvas#dCv{position:absolute;inset:0;width:100%;height:100%}
#deco .dcat{position:absolute;left:4px;bottom:2px;width:66px;height:60px;pointer-events:none;animation:catBob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes catBob{50%{transform:translateY(-2px) rotate(-2deg)}}
#deco .dnav{position:absolute;top:50%;width:38px;height:54px;margin-top:-27px;border-radius:12px;background:rgba(20,12,6,.5);display:grid;place-items:center}
#deco .dnav:hover{background:rgba(20,12,6,.68)}
#deco .dnav svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#deco .dnav.l{left:6px}#deco .dnav.r{right:6px}
#deco .dprog{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;padding:5px 7px;border-radius:999px;background:rgba(20,12,6,.5)}
#deco .dprog i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
#deco .dprog i.on{background:#fde047;box-shadow:0 0 6px #fde047}
#deco .dside{flex:none;width:100%;max-width:520px;min-height:0;display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding:2px 2px 4px}
#deco .dbody.side .dside{width:360px;max-height:100%}
.task{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px 6px 10px;border-radius:12px;background:#fffaf0;box-shadow:0 3px 0 #d8c7a8;flex:none}
.task .tno{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#efe4cf;color:var(--dim);font-size:14px;font-weight:800}
.task .tno svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.task .tname{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done{background:#ecfdf3;box-shadow:0 3px 0 #b7e4c7}.task.done .tno{background:var(--ok)}.task.done .tname{color:#166534}
.task.lock{opacity:.62}
.task .tst{flex:none;font-size:13px;color:#15803d;font-weight:800;padding:0 6px}
.task .tcost{flex:none;display:flex;align-items:center;gap:3px;font-size:15px;color:var(--dim);padding:0 8px;font-variant-numeric:tabular-nums}
.task .tdo{flex:none;display:flex;align-items:center;gap:4px;height:36px;padding:0 13px 0 10px;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;box-shadow:0 3px 0 #4c1d95;white-space:nowrap}
.task .tdo .st{fill:#fde047;stroke:#fde68a}
.task .tdo:active{transform:translateY(2px);box-shadow:0 1px 0 #4c1d95}
.task .tdo:disabled{background:#cbbfa9;box-shadow:0 3px 0 #a8987b;cursor:default;transform:none}
.task .tdo:disabled .st{fill:#fff7e6;stroke:#fff7e6}
.task.next{box-shadow:0 0 0 3px #a78bfa,0 3px 0 #d8c7a8}
.dnote{flex:none;margin:2px 4px 0;font-size:13px;line-height:1.45;color:#f5e6cc;text-align:center}
.chestBtn{display:flex!important;align-items:center;justify-content:center;gap:10px;margin:0!important;background:linear-gradient(#f59e0b,#d97706)!important;box-shadow:0 4px 0 #92400e!important;animation:glowPulse 1.4s ease-in-out infinite;flex:none}
.chestIco{flex:none;width:30px;height:26px}
@keyframes glowPulse{50%{filter:brightness(1.13)}}
.btn.sub.glow{background:#fde68a;box-shadow:0 4px 0 #d4a72c,0 0 0 3px rgba(253,224,71,.55);animation:glowPulse 1.4s ease-in-out infinite}
.btn .st{margin:0 2px 0 6px}
.dpop{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(40,22,10,.55);padding:16px}
.dpop .paper{width:min(92vw,340px)}
.chestArt{width:120px;height:100px;display:block;margin:6px auto 2px}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 5px;margin:10px 0 6px}
.rewards .rw{position:relative;width:37px;height:40px;border-radius:9px;background:#f5ecd8;display:grid;place-items:center}
.rewards .rw canvas{width:30px;height:30px}
.rewards .rw b{position:absolute;right:-4px;bottom:-6px;min-width:18px;height:18px;padding:0 3px;border-radius:9px;background:#6d28d9;color:#fff;font-size:11px;line-height:18px}
/* 힉스필드 그림(받은 아이콘마다 html 에 a-* 클래스) */
.a-coin .ci{background:var(--i-coin) center/contain no-repeat;box-shadow:none;border-radius:0}
.a-star svg.st{background:var(--i-star) center/contain no-repeat;stroke:none}.a-star svg.st path{display:none}
.a-basket #streakBox svg{width:22px;height:22px;background:var(--i-basket) center/contain no-repeat}.a-basket #streakBox svg *{display:none}
.a-box .chestIco{background:var(--i-box) center/contain no-repeat}.a-box .chestIco *{display:none}
/* 처음 안내 한 줄 · 그림 불러오기 */
#tutTip{position:fixed;z-index:6;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;width:max-content;max-width:min(calc(100vw - 24px),420px);padding:6px 14px 6px 6px;border-radius:14px;background:#fffaf0;color:var(--ink);font-size:14px;line-height:1.4;box-shadow:0 4px 0 #d8c7a8,0 10px 24px rgba(0,0,0,.35);pointer-events:none;animation:tipIn .25s ease-out}
#tutTip canvas{flex:none;width:46px;height:42px}
html.tipHold #tutTip{visibility:hidden}
@keyframes tipIn{0%{opacity:0;transform:translate(-50%,8px)}100%{opacity:1;transform:translate(-50%,0)}}
#loadArt{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;padding:10px 18px;border-radius:999px;background:rgba(30,16,6,.72);color:#fff7e6;font-size:15px;pointer-events:none}
