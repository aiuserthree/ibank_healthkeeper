<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/_shared/no-zoom.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>햇살 농장 3D</title>
<style>
  :root{--ink:#3a2a1a;--cream:#fff8e7;--gold:#ffc83d;--green:#58b368;--red:#e5533d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfeaf3;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ic{width:1.05em;height:1.05em;vertical-align:-0.17em;display:inline-block;flex:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;will-change:transform}
  .pad{background:linear-gradient(#fffdf5,#fff1d2);border:3px solid var(--ink);border-radius:16px;padding:3px 11px 4px;text-align:center;line-height:1.15;
    box-shadow:0 4px 0 rgba(58,42,26,.35),0 6px 14px rgba(58,42,26,.18);font-weight:800;font-size:14px}
  .pad span{display:flex;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:900;color:#a86b00}
  .pad.ok{border-color:#2d8a43}
  .pad.ok span{color:#2d8a43}
  .cust{background:#fff;border:2px solid var(--ink);border-radius:13px;padding:1px 8px 5px;font-weight:800;font-size:14px;text-align:center;min-width:58px;
    box-shadow:0 3px 0 rgba(58,42,26,.3)}
  .cust i{display:block;height:6px;border-radius:3px;background:#e6dcc6;overflow:hidden;margin-top:2px}
  .cust i b{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .2s}
  .tag{background:rgba(58,42,26,.85);color:#fff;border-radius:12px;padding:2px 10px;font-weight:800;font-size:13px;display:flex;gap:4px;align-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.18)}
  .pop{font-weight:900;font-size:22px;color:#ffe066;text-shadow:0 2px 0 var(--ink),0 0 4px var(--ink),0 0 2px var(--ink);animation:pop 1.05s cubic-bezier(.2,.9,.3,1.2) forwards;display:flex;align-items:center;gap:3px}
  @keyframes pop{0%{opacity:0;margin-top:10px;transform:translate(-50%,-100%) scale(.5)}15%{opacity:1;transform:translate(-50%,-100%) scale(1.25)}30%{transform:translate(-50%,-100%) scale(1)}100%{opacity:0;margin-top:-64px}}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;padding:10px;flex-wrap:wrap;pointer-events:none;align-items:flex-start}
  .chip{background:linear-gradient(#fffdf6,#fff0cf);border:3px solid var(--ink);border-radius:18px;padding:2px 14px;font-weight:900;font-size:20px;
    box-shadow:0 4px 0 rgba(58,42,26,.35),0 6px 14px rgba(58,42,26,.12);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .chip small{font-size:13px;font-weight:800;opacity:.7}
  .chip.bump{animation:bump .32s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  #goal{margin-left:auto;font-size:15px;font-weight:800;max-width:60vw}
  #mute{pointer-events:auto;cursor:pointer;font-family:inherit;color:inherit;padding:2px 10px}
  #mute:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,42,26,.35)}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(58,42,26,.88);color:#fff;border-radius:20px;
    padding:7px 20px;font-weight:800;font-size:17px;text-align:center;pointer-events:none;max-width:92vw;transition:opacity .4s;word-break:keep-all;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  #toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) scale(.6);background:linear-gradient(#ffe27a,#ffc83d);border:3px solid var(--ink);
    border-radius:20px;padding:5px 24px;font-weight:900;font-size:22px;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.3,1.7,.5,1);pointer-events:none;text-align:center;
    box-shadow:0 5px 0 rgba(58,42,26,.35),0 10px 24px rgba(0,0,0,.18)}
  #toast.on{opacity:1;transform:translateX(-50%) scale(1)}
  #stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.75);
    background:rgba(255,255,255,.2);display:none;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  #stick b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.2)}
  #start{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,240,190,.45),rgba(110,190,225,.62));backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
  #card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:20px 28px 24px;max-width:460px;text-align:center;
    box-shadow:0 8px 0 rgba(58,42,26,.35),0 18px 40px rgba(0,0,0,.18);animation:cardIn .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes cardIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  #card h1{margin:0;font-size:40px;line-height:1.05;font-weight:900;color:#d9483b;display:flex;align-items:center;justify-content:center;gap:8px}
  #card h1 .ic{width:1.1em;height:1.1em}
  #card p{margin:10px 0;font-size:17px;font-weight:500;line-height:1.35}
  #card ol{text-align:left;font-size:16px;font-weight:500;line-height:1.4;padding-left:22px;margin:8px 0 14px}
  #play{font-family:inherit;font-size:26px;font-weight:900;color:#fff;background:linear-gradient(#6fd07e,#47a858);border:3px solid var(--ink);border-radius:20px;
    padding:4px 44px;cursor:pointer;box-shadow:0 5px 0 #2d6b3a,0 8px 18px rgba(45,107,58,.3);text-shadow:0 2px 0 rgba(0,0,0,.2)}
  #play:hover{filter:brightness(1.05)}
  #play:active{transform:translateY(3px);box-shadow:0 2px 0 #2d6b3a}
  #card{max-height:100%;overflow:auto;word-break:keep-all}
  #card .big{font-size:44px;font-weight:900;color:#a86b00;margin:2px 0 0;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:8px}
  #card .sub{font-size:15px;font-weight:700;opacity:.7;margin:0 0 12px}
  #card table{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:16px;font-weight:700}
  #card td{padding:4px 2px;text-align:left}
  #card td:last-child{text-align:right;color:#a86b00;font-variant-numeric:tabular-nums}
  .arcOnly{display:none!important}
  .arc .arcOnly{display:flex!important}
  #timeChip.warn{background:linear-gradient(#ff7a62,var(--red));color:#fff}
  #pauseOv{position:fixed;inset:0;z-index:5;background:rgba(58,42,26,.82);display:none;align-items:center;justify-content:center;flex-direction:column;
    color:#fff;cursor:pointer;text-align:center;padding:20px}
  #pauseOv.on{display:flex}
  #pauseOv b{font-size:28px;margin-bottom:8px}
  #pauseOv span{font-weight:700;opacity:.85}
  @media (max-width:520px){
    #hud{gap:6px;padding:8px}
    .chip{font-size:16px;padding:2px 10px;border-radius:14px;border-width:2px;gap:4px}
    .chip small{font-size:12px}
    .wideOnly{display:none!important}
    #goal{margin-left:0;max-width:none;flex-basis:100%;font-size:13px;justify-content:center}
    #toast{top:96px;font-size:18px;padding:4px 16px;max-width:92vw}
    #hint{font-size:14px;bottom:16px}
    #card{padding:16px 18px 20px;border-radius:22px}
    #card h1{font-size:30px}
    #card p,#card ol{font-size:15px}
    #play{font-size:22px;padding:4px 34px}
  }
  /* ---------- 시작 화면 고르기 · 이야기 농장 ---------- */
  .choice{display:flex;flex-direction:column;gap:10px;margin:12px 0 6px}
  .cbtn{font-family:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:9px 14px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;
    box-shadow:0 4px 0 rgba(58,42,26,.35);background:linear-gradient(#fffdf6,#ffeec6);width:100%}
  .cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(58,42,26,.35)}
  .cbtn .ic{width:38px;height:38px;flex:none}
  .cbtn b{font-size:21px;font-weight:900;display:block;line-height:1.15}
  .cbtn small{font-size:14px;font-weight:600;opacity:.8;display:block;line-height:1.3;margin-top:1px}
  #play.cbtn{color:#fff;background:linear-gradient(#6fd07e,#47a858);padding:9px 14px;font-size:inherit;box-shadow:0 4px 0 #2d6b3a;text-shadow:0 1px 0 rgba(0,0,0,.2)}
  #play.cbtn small{opacity:.92}
  #story.cbtn{background:linear-gradient(#ffe9a8,#ffc83d)}
  .bbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .btn{font-family:inherit;font-size:18px;font-weight:900;border:3px solid var(--ink);border-radius:16px;padding:6px 22px;cursor:pointer;color:#fff;
    background:linear-gradient(#6fd07e,#47a858);box-shadow:0 4px 0 #2d6b3a;text-shadow:0 1px 0 rgba(0,0,0,.2)}
  .btn.w{color:var(--ink);background:#fffdf6;box-shadow:0 4px 0 rgba(58,42,26,.35);text-shadow:none}
  .btn.r{background:linear-gradient(#ff7a62,var(--red));box-shadow:0 4px 0 #8f2c20}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(58,42,26,.35)}
  .storyOnly{display:none!important}
  .story .storyOnly{display:flex!important}
  .story .arcOnly,.story #goal,.story .storyOnly.off{display:none!important}
  .lbl.tag.fox{background:#e5533d;font-size:14px}
  /* 길잡이: 처음 할 일 · 열 수 있는 시설 위에 「여기!」 — 화면 밖이면 가장자리에 화살표 */
  .lbl.guide{z-index:2}
  .lbl.guide b{display:flex;align-items:center;gap:4px;background:linear-gradient(#ffe27a,#ffc83d);color:var(--ink);border:2px solid var(--ink);border-radius:12px;
    padding:2px 10px;font-size:14px;font-weight:900;box-shadow:0 3px 0 rgba(58,42,26,.35);animation:gbob .9s ease-in-out infinite}
  @keyframes gbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #menuBtn{pointer-events:auto;cursor:pointer;font-family:inherit;color:inherit;padding:2px 10px}
  #evChip{background:linear-gradient(#ffe27a,#ffc83d)}
  #evChip.night{background:linear-gradient(#5a6c9c,#33406a);color:#fff}
  #evChip.fest{background:linear-gradient(#ff9fc0,#ff6b9a);color:#fff}
  #todo{position:fixed;right:10px;top:64px;width:276px;background:rgba(255,248,231,.95);border:3px solid var(--ink);border-radius:16px;
    box-shadow:0 4px 0 rgba(58,42,26,.3),0 8px 18px rgba(58,42,26,.12);font-size:14px;font-weight:700;display:none;overflow:hidden;max-height:calc(100% - 130px);
    word-break:keep-all;line-height:1.3}
  .story #todo{display:block}
  #todo .th{display:flex;align-items:center;gap:6px;padding:6px 10px;background:linear-gradient(#ffe9a8,#ffd36a);border-bottom:2px solid var(--ink);cursor:pointer}
  #todo .th b{flex:1;font-size:15px;font-weight:900;min-width:0}
  #todo .th span{font-size:12px;opacity:.75;white-space:nowrap}
  #todo .tb{padding:6px 10px 8px;overflow:auto;max-height:calc(100vh - 200px)}
  #todo.mini .tb{display:none}
  #todo.mini .th b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #todo.mini .th{border-bottom:0}
  #todo .th em{font-style:normal;font-size:12px;font-weight:900;color:#7a4a2a;white-space:nowrap;font-variant-numeric:tabular-nums}
  #todo.peek{animation:peek .35s cubic-bezier(.3,1.5,.5,1)}
  @keyframes peek{from{transform:scale(.92);opacity:.6}to{transform:scale(1);opacity:1}}
  #todo .g{margin:5px 0 7px}
  #todo .gl{display:flex;gap:6px;align-items:baseline}
  #todo .gl span{flex:1;min-width:0}
  #todo .gl em{font-style:normal;color:#a86b00;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
  #todo .g i{display:block;height:7px;border-radius:4px;background:#e6dcc6;overflow:hidden;margin-top:3px}
  #todo .g i b{display:block;height:100%;background:linear-gradient(90deg,#6fd07e,#47a858);border-radius:4px}
  #todo .g.done .gl span{text-decoration:line-through;opacity:.6}
  #todo .g.done .gl em{color:#2d8a43}
  #todo .sec{margin:8px 0 2px;padding-top:6px;border-top:2px dashed rgba(58,42,26,.25);font-size:13px;font-weight:900;color:#7a4a2a;display:flex;gap:6px}
  #todo .sec span{margin-left:auto;font-weight:700;opacity:.8}
  #todo .ord{margin:4px 0 6px;background:#fff;border:2px solid rgba(58,42,26,.35);border-radius:10px;padding:3px 7px 5px}
  #todo .ord .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
  #todo .ord .row .ic{width:15px;height:15px}
  #todo .ord .rw{margin-left:auto;color:#a86b00;white-space:nowrap;display:flex;align-items:center;gap:2px}
  #todo .ord i{display:block;height:5px;border-radius:3px;background:#e6dcc6;overflow:hidden;margin-top:3px}
  #todo .ord i b{display:block;height:100%;background:#f2a72c}
  #todo .pbtn{font-family:inherit;font-size:15px;font-weight:900;margin:4px 0 2px;width:100%;border:2px solid var(--ink);border-radius:12px;padding:5px;cursor:pointer;color:#fff;
    background:linear-gradient(#ff9fc0,#ff6b9a);box-shadow:0 3px 0 #a8355a}
  #todo .note{font-size:12px;opacity:.75;font-weight:600;margin:2px 0}
  #talkBg{position:fixed;inset:0;display:none;background:rgba(58,42,26,.22);z-index:4}
  #talkBg.on{display:block}
  #talk{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(580px,calc(100% - 24px));background:var(--cream);border:4px solid var(--ink);border-radius:22px;
    padding:14px 16px 12px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 7px 0 rgba(58,42,26,.35),0 16px 34px rgba(0,0,0,.2);animation:cardIn .35s cubic-bezier(.3,1.5,.5,1);word-break:keep-all}
  #talk .face{flex:none;width:76px;height:76px}
  #talk .tx{flex:1;min-width:0}
  #talk .who{font-weight:900;color:#d9483b;font-size:16px}
  #talk p{margin:3px 0 0;font-size:16px;line-height:1.45;font-weight:600}
  #talk .bbar{justify-content:flex-end;margin-top:8px}
  #talk .btn{font-size:16px;padding:4px 20px}
  #card .chl{list-style:none;padding:0;margin:6px 0 12px;font-size:14px;text-align:left;columns:2;column-gap:14px}
  #card .chl li{padding:2px 0;break-inside:avoid;display:flex;gap:4px}
  #card .chl li.cur{font-weight:900;color:#d9483b}
  #card .chl li.lock{opacity:.45}
  #card .stars{font-size:26px;letter-spacing:2px;color:#ffb300;margin:0;text-shadow:0 2px 0 rgba(58,42,26,.25)}
  #card .opens{background:#fff3cf;border:2px dashed #c99a52;border-radius:12px;padding:6px 10px;font-size:15px;font-weight:700;margin:8px 0 12px}
  #card .face{width:64px;height:64px;display:block;margin:0 auto 4px}
  .story #toast{top:auto;bottom:66px;max-width:min(92vw,560px)}
  #toast{word-break:keep-all}
  @media (max-width:760px){#todo{width:238px;font-size:13px}#todo .th b{font-size:14px}}
  @media (max-width:520px){
    #todo{left:8px;right:auto;width:min(216px,57vw);font-size:12px;border-width:2px;border-radius:12px;max-height:calc(100% - 150px)}
    #todo .th{padding:4px 8px}
    #todo .th b{font-size:13px}
    #todo .tb{padding:4px 8px 6px}
    #todo .gl em,#todo .ord .row,#todo .sec{font-size:12px}
    #todo .g{margin:2px 0 4px}
    #todo .g i{height:5px;margin-top:2px}
    #todo .note{font-size:11px}
    #todo .ord{margin:3px 0 4px;padding:2px 6px 4px}
    .story #toast{bottom:100px}
    #talk{padding:10px 12px;gap:10px;border-width:3px;bottom:10px}
    #talk .face{width:56px;height:56px}
    #talk p{font-size:14px}
    #talk .who{font-size:14px}
    .cbtn b{font-size:18px}
    .cbtn small{font-size:13px}
    .cbtn .ic{width:32px;height:32px}
    #card .chl{font-size:13px;column-gap:10px}
    .btn{font-size:16px;padding:5px 16px}
  }
  #err{display:none;position:fixed;inset:0;background:var(--cream);align-items:center;justify-content:center;padding:30px;text-align:center;font-size:18px;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud">
  <div class="chip arcOnly" id="scoreChip"><small>번 코인</small><span id="score">0</span></div>
  <div class="chip arcOnly" id="timeChip"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13.5" r="8"/><path d="M12 9.5v4.2l2.6 1.8M9.5 2.8h5"/></svg><span id="time">3:00</span></div>
  <div class="chip" id="coinChip" title="쓸 수 있는 코인"><i data-ic="coin"></i><span id="coins">0</span></div>
  <div class="chip wideOnly"><i data-ic="crate"></i><span id="sold">0</span><small>판매</small></div>
  <div class="chip wideOnly"><i data-ic="happy"></i><span id="happy">0</span> <small style="display:flex;align-items:center;gap:2px"><i data-ic="sad"></i><span id="lost">0</span></small></div>
  <button class="chip" id="mute" aria-label="소리 켜고 끄기"></button>
  <button class="chip storyOnly" id="menuBtn" aria-label="이야기 농장 메뉴"></button>
  <div class="chip storyOnly off" id="wxChip"></div>
  <div class="chip storyOnly off" id="evChip"></div>
  <div class="chip" id="goal"></div>
</div>
<div id="todo"></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="stick"><b></b></div>
<div id="talkBg"><div id="talk"></div></div>
<div id="start"><div id="card"></div></div>
<div id="pauseOv"><b>쉬는 중이에요</b><span>화면을 누르면 이어서 해요</span></div>
<div id="err">이 브라우저에서는 3D(WebGL)를 쓸 수 없어 게임을 열 수 없어요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 이야기 농장 진행 저장(서버) — 같은 주소라 로그인 쿠키가 간다 -->
<script src="/_shared/api.js"></script>
<script src="/_shared/mgmt.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const T=THREE, $=id=>document.getElementById(id);
// 헬스키퍼 아케이드 창 안(?hk=1 · 부모 창 안)이면 「3분 동안 얼마나 벌까」 모드 — 매 판 새 농장, 저장 없음
const inFrame=window.parent!==window;
const ARC=/[?&]hk=1(&|$)/.test(location.search)||inFrame;
const AUTO=ARC&&/[?&]go=1(&|$)/.test(location.search); // 끝 화면 「다시 하기」로 새로 열렸을 때 바로 시작
const HK=location.origin;
const hk=msg=>{if(inFrame){try{window.parent.postMessage(msg,HK);}catch(e){}}};
const fmt=n=>Math.max(0,Math.round(n)).toLocaleString('ko-KR');
if(ARC)document.documentElement.classList.add('arc');
const ROUND=180;          // 한 판 3분
let EGG_T=ARC?1.7:2.3;    // 아케이드 모드만 닭이 조금 더 빨리 낳는다 (이야기 농장은 STORY.eggT)
let SPAWN_K=ARC?0.8:1;    // 아케이드 모드만 손님이 조금 더 자주 온다 (이야기 농장은 STORY.spawnK)
let mode=ARC?'menu':'free'; // menu · play · over (3분 도전) / loading · story (이야기 농장) / free (본체 주소를 직접 열 때)
let paused=false,timeLeft=ROUND,earned=0,reported=false,liveT=0,lastLive=-1,shownScore=-1,shownTime='';

function Builder(){this.parts=[];this.st=[new T.Matrix4()];}
Builder.prototype.top=function(){return this.st[this.st.length-1];};
Builder.prototype.push=function(p,r,s){this.st.push(this.top().clone().multiply(new T.Matrix4().compose(V3(p),Q4(r),S3(s))));return this;};
Builder.prototype.pop=function(){this.st.pop();return this;};
Builder.prototype.add=function(g,col,p,r,s){this.parts.push({g,col,m:this.top().clone().multiply(new T.Matrix4().compose(V3(p),Q4(r),S3(s)))});return this;};
Builder.prototype.geo=function(){let n=0;const list=this.parts.map(pt=>{const g=pt.g.index?pt.g.toNonIndexed():pt.g.clone();g.applyMatrix4(pt.m);n+=g.attributes.position.count;return [g,pt.col];});
  const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
  for(const [g,col] of list){const c=lin(col),cnt=g.attributes.position.count;P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);
    for(let i=0;i<cnt;i++){C[(o+i)*3]=c.r;C[(o+i)*3+1]=c.g;C[(o+i)*3+2]=c.b;}o+=cnt;g.dispose();}
  const out=new T.BufferGeometry();out.setAttribute('position',new T.BufferAttribute(P,3));out.setAttribute('normal',new T.BufferAttribute(N,3));out.setAttribute('color',new T.BufferAttribute(C,3));
  out.computeBoundingSphere();return out;};
Builder.prototype.mesh=function(parent,mat){const m=new T.Mesh(this.geo(),mat||VC);m.castShadow=m.receiveShadow=true;if(parent)parent.add(m);return m;};

  t.encoding=T.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}

function bgmNote(f,t,d,type,vol,att){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||0.012));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(BGM.g);o.start(t);o.stop(t+d+0.05);}
function bgmShake(t,vol){if(!BGM.noise){const n=actx.sampleRate*0.08,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);BGM.noise=b;}
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=BGM.noise;f.type='highpass';f.frequency.value=6500;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(BGM.g);s.start(t);}
function bgmTick(){
  if(!actx)return;
  if(!bgmWant()){if(BGM.g&&BGM.next){const t=actx.currentTime;BGM.g.gain.cancelScheduledValues(t);BGM.g.gain.setTargetAtTime(0,t,0.12);BGM.next=0;}return;}
  if(!BGM.g){BGM.g=actx.createGain();BGM.g.gain.value=0;BGM.g.connect(actx.destination);}
  const now=actx.currentTime;
  if(!BGM.next||BGM.next<now-0.3){BGM.next=now+0.08;BGM.g.gain.cancelScheduledValues(now);BGM.g.gain.setTargetAtTime(1,now,0.25);}
  while(BGM.next<now+0.3){
    const t=BGM.next,i=BGM.step%64,bar=((i>>3)&3),beat=i&7;
    const m=BG_MEL[i];if(m>=0){bgmNote(bgF(m),t,BG_E8*1.7,'triangle',0.05);bgmNote(bgF(m+12),t,BG_E8*0.9,'sine',0.012);}
    if(beat===0||beat===4)bgmNote(bgF(BG_BASS[bar]+(beat===4?7:0)),t,BG_E8*1.8,'triangle',0.075,0.006);
    if(beat===2||beat===3||beat===6||(beat===7&&bar===3)){for(let k=0;k<3;k++)bgmNote(bgF(BG_CH[bar][k]),t+k*0.012,BG_E8*0.8,'square',0.008,0.004);}
    bgmShake(t,beat%2?0.02:0.035);
    BGM.next+=BG_E8;BGM.step++;
  }
}
setInterval(bgmTick,90);

function collide(e,r){for(const o of obstacles){const cx=Math.max(o.x-o.hx,Math.min(e.x,o.x+o.hx)),cz=Math.max(o.z-o.hz,Math.min(e.z,o.z+o.hz));
  let dx=e.x-cx,dz=e.z-cz;const d=Math.hypot(dx,dz);
  if(d<r){if(d<1e-4){const px=o.hx-Math.abs(e.x-o.x),pz=o.hz-Math.abs(e.z-o.z);
      if(px<pz)e.x=o.x+Math.sign(e.x-o.x||1)*(o.hx+r);else e.z=o.z+Math.sign(e.z-o.z||1)*(o.hz+r);}
    else{e.x=cx+dx/d*r;e.z=cz+dz/d*r;}}}
  e.x=Math.max(-18,Math.min(26,e.x));e.z=Math.max(S.own.pasture?-23.5:-9.8,Math.min(16,e.z));}

/* ---------- item transfers shared by player & workers ---------- */
function nearCoop(e,r){let best=null,bd=r;for(const c of COOPS){if(!c.owned)continue;const d=dist(e.x,e.z,c.nx,c.nz);if(d<bd){bd=d;best=c;}}return best;}
function transfer(e,cap){ // returns true if something moved
  const c=nearCoop(e,2.0);
  if(c&&c.eggs>0&&e.type!=='crate'&&e.n<cap){c.eggs--;e.type='egg';e.n++;e.ks.push(c.kind||'w');return 'egg';}
  if(dist(e.x,e.z,IN.x,IN.z)<1.7&&e.type==='egg'&&e.n>0&&machine.input+machine.transit<INCAP){e.n--;machine.input++;machine.inK.push(e.ks.pop()||'w');if(!e.n)e.type=null;return 'in';}
  if(dist(e.x,e.z,OUT.x,OUT.z)<1.7&&e.type!=='egg'&&e.n<cap&&machine.output>0){machine.output--;e.type='crate';e.n++;e.ks.push(machine.outK.pop()||'w');return 'out';}
  if(e.type==='crate'&&e.n>0)for(const k of counters){if(Math.abs(e.x-k.x)<2.3&&Math.abs(e.z-k.z)<3&&k.stock<STOCK){k.stock++;k.stK.push(e.ks.pop()||'w');e.n--;if(!e.n)e.type=null;return 'stock';}}
  if(STORY_ON&&e.type==='crate'&&e.n>0)return storyDrop(e);
  return null;}

/* ---------- farmhand AI ---------- */
function bestCoop(not){let b=null;for(const c of COOPS){if(!c.owned||S.own[c.belt]||c===not||c.claimed)continue;if(c.eggs>=2&&(!b||c.eggs>b.eggs))b=c;}return b;}
function needyCounter(){let b=null,bv=1e9;for(const k of counters){if(k.stock>=STOCK)continue;const v=k.stock-demand(k);if(v<bv){bv=v;b=k;}}return b;}
function think(w){
  if(w.goal&&w.goal.c&&w.goal.kind==='coop')w.goal.c.claimed=false;
  if(w.n>0){if(w.type==='egg')w.goal={kind:'in',x:IN.x-0.2,z:IN.z+(w.id?0.7:-0.7)};
    else{const k=needyCounter();w.goal=k?{kind:'counter',k,x:k.x-1.7,z:k.z+(w.id?0.8:-0.8)}:
      dockRoom()?{kind:'dock',x:DOCK.x-1.3,z:DOCK.z+(w.id?0.6:-0.6)}:{kind:'idle',x:MX+3+w.id*1.5,z:MZ+3.5};}return;}
  const other=workers.find(o=>o!==w&&o.goal);
  const canOut=machine.output>0&&(needyCounter()||dockRoom())&&!(other&&other.goal.kind==='out'&&machine.output<4);
  const c=machine.input+machine.transit<INCAP-2?bestCoop():null;
  const order=w.id===0?['out','coop']:['coop','out'];
  for(const o of order){
    if(o==='out'&&canOut){w.goal={kind:'out',x:OUT.x+0.3,z:OUT.z+(w.id?0.7:-0.7)};return;}
    if(o==='coop'&&c){c.claimed=true;w.goal={kind:'coop',c,x:c.nx+c.fx*0.75,z:c.nz+c.fz*0.75};return;}}
  w.goal={kind:'idle',x:MX+3+w.id*1.5,z:MZ+3.5};}
function updateWorker(w,dt){
  if(!w.goal)think(w);const g=w.goal;const dx=g.x-w.x,dz=g.z-w.z,d=Math.hypot(dx,dz);let moving=false;
  if(d>0.35){moving=true;let vx=dx/d,vz=dz/d;
    if(w.sideT>0){w.sideT-=dt;const px=-vz*w.side,pz=vx*w.side;vx=vx*0.3+px;vz=vz*0.3+pz;const l=Math.hypot(vx,vz);vx/=l;vz/=l;}
    const ox=w.x,oz=w.z,sp=4.6*dt;w.x+=vx*sp;w.z+=vz*sp;collide(w,0.45);
    if(w.sideT<=0&&Math.hypot(w.x-ox,w.z-oz)<sp*0.45){w.side=w.side||(Math.random()<0.5?1:-1);w.sideT=0.7;}
    w.g.rotation.y=Math.atan2(w.x-ox,w.z-oz);
    if(g.kind==='idle'){w.idleT=(w.idleT||0)+dt;if(w.idleT>0.5){w.idleT=0;think(w);}}
  }else{
    w.tx-=dt;
    if(g.kind==='idle'){w.idleT=(w.idleT||0)+dt;if(w.idleT>0.5){w.idleT=0;think(w);}}
    else if(w.tx<=0){w.tx=0.14;const r=transfer(w,w.cap);
      if(!r){ // nothing more to do here
        if(g.kind==='coop'){g.c.claimed=false;const nx=w.n<w.cap-1&&machine.input+machine.transit<INCAP-2?bestCoop(g.c):null;
          if(nx){nx.claimed=true;w.goal={kind:'coop',c:nx,x:nx.nx+nx.fx*0.75,z:nx.nz+nx.fz*0.75};}else think(w);}
        else if(g.kind==='in'){if(w.n===0)think(w);} // else wait for room
        else if(g.kind==='counter'){if(w.n===0||g.k.stock>=STOCK)think(w);}
        else think(w);}}}
  w.g.position.x=w.x;w.g.position.z=w.z;animWalk(w.g,moving,dt);showCarry(w.g,w.type,w.n,w.ks);}

      place(cu.lbl,cu.x,2.6,cu.z);}}

// 길잡이 — 처음 판(달걀 줍기 → 넣기 → 상자 → 판매대)과 지금 열 수 있는 목표 시설을 가리킨다. 화면 밖이면 가장자리에 화살표
const guide=mkLabel('guide','');guide.style.display='none';let guideTxt='';
function guideTarget(){
  if(!S.started||modal||paused||mode==='over')return null;
  if(S.tut<3){
    if(player.type==='crate'&&player.n>0){const k=counters[0];return {x:k.x,y:3.4,z:k.z,t:'판매대'};}
    if(player.type==='egg'&&player.n>0)return {x:IN.x,y:2.4,z:IN.z,t:'달걀 넣기'};
    if(machine.output>0||machine.work>0||machine.input>=3)return {x:OUT.x,y:2.4,z:OUT.z,t:'상자 들기'};
    let c=null;for(const q of COOPS)if(q.owned&&q.eggs>0&&(!c||dist(player.x,player.z,q.nx,q.nz)<dist(player.x,player.z,c.nx,c.nz)))c=q;
    c=c||COOPS[0];return {x:c.nx,y:2.6,z:c.nz,t:'달걀 줍기'};}
  if(player.n>0)return null;
  let want=null;
  if(STORY_ON){if(ST.end)return null;want=CH[ST.ch].goals.filter(g=>g.t==='own').map(g=>g.id);}
  else if(S.tut!==3)return null;
  let p=null;for(const q of PADS){if(!q.shown||q.done||(want&&want.indexOf(q.id)<0))continue;const left=q.cost-q.paid;if(S.coins>=left&&(!p||left<p.cost-p.paid))p=q;}
  if(!p||dist(player.x,player.z,p.x,p.z)<1.35)return null;
  return {x:p.x,y:3.2,z:p.z,t:'여기 서 있기',far:padLabel(p)+' 열기'};}
function guideStep(){const g=guideTarget();if(!g){if(guide.style.display!=='none')guide.style.display='none';return;}
  v3.set(g.x,g.y,g.z).project(cam);const back=v3.z>1;let px=(v3.x*0.5+0.5)*W,py=(-v3.y*0.5+0.5)*H;if(back){px=W-px;py=H-30;}
  const top=MOBILE?120:96,out=back||px<60||px>W-60||py<top||py>H-30;
  px=Math.max(60,Math.min(W-60,px));py=Math.max(top+28,Math.min(H-30,py));
  const t=out?(py<=top+28?'↑ ':py>=H-30?'↓ ':px<=60?'← ':'→ ')+(g.far||g.t):g.t+' ▼';
  if(t!==guideTxt){guideTxt=t;guide.innerHTML='<b>'+t+'</b>';}
  guide.style.display='';guide.style.transform='translate(-50%,-100%) translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px)';}

let last=performance.now(),time=0,coinShown=-1,hintShown=-1;
function grow(o,dt){if(o.grow<1){o.grow=Math.min(1,o.grow+dt*2.2);o.g.scale.setScalar(Math.max(0.01,backOut(o.grow)));}}
let rdt=0; // 남은 시간은 실제로 흐른 시간으로 센다(느린 기기에서도 3분)
function fxStep(dt){
  stepPool(P_COIN,dt);stepPool(P_CONF,dt);stepPool(P_PUFF,dt);stepPool(P_SPARK,dt);
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt*1.4;const k=r.t;r.m.scale.setScalar(0.3+r.r*(1-Math.pow(1-Math.min(1,k),3)));r.m.material.opacity=0.9*(1-k);
    if(k>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1);}}
  for(const m of pops){m.userData.pt+=dt*5.5;const t=m.userData.pt;m.scale.setScalar(Math.max(0.01,backOut(t)));if(t>=1){m.scale.setScalar(1);pops.delete(m);}}
  for(let i=fades.length-1;i>=0;i--){const f=fades[i];f.t+=dt;f.mat.opacity=f.to*clamp01(f.t/0.8);if(f.t>=0.8)fades.splice(i,1);}
  for(const b of beltAnim){if(b.k<1){b.k+=dt*2.6;b.seg.scale.x=Math.max(0.001,backOut(b.k));}}
  if(gate.userData.fall!=null&&gate.parent){const f=(gate.userData.fall+=dt);gate.position.y=-f*f*1.6;gate.scale.y=Math.max(0.01,1-f*0.9);gate.rotation.x=f*0.15;if(f>1.1)scene.remove(gate);}
  if(machine.boost>0){machine.boost-=dt*1.5;const s=1+Math.sin(machine.boost*Math.PI)*0.12;machine.g.scale.set(s,2-s,s);if(machine.boost<=0)machine.g.scale.set(1,1,1);}
}
function frame(now){requestAnimationFrame(frame);rdt=Math.max(0,Math.min(0.25,(now-last)/1000));let dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;time+=dt;
  if(S.started&&!paused&&!modal)update(dt);
  if(!paused)fxStep(dt);
  // camera
  camT.x+=(player.x-camT.x)*Math.min(1,dt*5);camT.z+=(player.z-camT.z)*Math.min(1,dt*5);
  zoomT+=dt;const zp=zoomT<1.6?1+0.1*Math.sin(Math.PI*zoomT/1.6):1;
  const D=(cam.aspect<0.6?46:cam.aspect<0.8?40:33)*zp; // 넓은 창(PC 가로 가득)도 예전(세로 상자)과 같은 거리
  shakeA*=Math.exp(-dt*7);const sx=(Math.random()-0.5)*shakeA,sz=(Math.random()-0.5)*shakeA;
  cam.position.set(camT.x+sx,D*0.8+sz*0.5,camT.z+D*0.62+sz);cam.lookAt(camT.x+sx*0.5,0.5,camT.z-1);
  sun.position.set(camT.x-14,28,camT.z+12);sun.target.position.set(camT.x,0,camT.z);
  cam.updateMatrixWorld();
  if(STORY_ON)storyFrame(paused?0:dt);
  // labels
  for(const p of PADS)if(p.shown){const left=Math.ceil(p.cost-p.paid),t=p.name+left;if(t!==p.txt){p.txt=t;p.lbl.innerHTML=p.name+'<span>'+ICO.coin+' '+fmt(left)+'</span>';}
    const ok=S.coins>=left;p.lbl.classList.toggle('ok',ok);place(p.lbl,p.x,0.9,p.z);p.g.position.y=0.04+Math.sin(time*3+p.x)*0.015;
    if(p.sp<1){p.sp=Math.min(1,p.sp+dt*2.5);p.g.scale.setScalar(Math.max(0.01,backOut(p.sp)));}
    const pul=0.5+0.5*Math.sin(time*5+p.x);p.glow.visible=S.coins>0;p.glow.scale.setScalar(1+pul*0.05);p.glow.material.opacity=ok?0.55+pul*0.4:0.25+pul*0.2;p.glow.rotation.z=time*0.6;}
  const mt=machine.input+'|'+machine.output;if(mt!==mTxt){mTxt=mt;mLbl.innerHTML=ICO.egg+' '+machine.input+'/'+INCAP+' <span style="opacity:.7">→</span> '+ICO.crate+' '+machine.output+'/'+OUTCAP;}
  place(mLbl,MX,4.1,MZ);guideStep();
  if(S.started)for(const cu of customers)if(cu.state==='queue')place(cu.lbl,cu.x,2.6,cu.z);
  renderer.render(scene,cam);}

function update(dt){
  // player
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.dx,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.dz;
  const il=Math.hypot(ix,iz),moving=il>0.05;
  if(moving){const k=Math.min(1,il)/il;player.x+=ix*k*6.4*dt;player.z+=iz*k*6.4*dt;player.g.rotation.y=Math.atan2(ix,iz);player.stand=0;}else player.stand+=dt;
  collide(player,0.5);player.g.position.x=player.x;player.g.position.z=player.z;animWalk(player.g,moving,dt);
  if(moving&&Math.random()<dt*6)puffAt(player.x+rnd(-0.2,0.2),0.12,player.z+rnd(-0.2,0.2),0xe9dcc0,rnd(0.25,0.4));
  player.tx-=dt;if(player.tx<=0){const r=transfer(player,S.cap);if(r){player.tx=0.09;beep(r==='egg'?720:r==='in'?520:r==='out'?600:440,0.04,'sine',0.025);
    if(r==='egg'&&S.tut<1)S.tut=1;if(r==='in'&&S.tut<2&&player.n===0)S.tut=2;}}
  showCarry(player.g,player.type,player.n,player.ks);
  // pads
  for(const p of PADS){if(!p.shown)continue;if(dist(player.x,player.z,p.x,p.z)<1.35&&player.stand>0.35&&S.coins>0){
      const amt=Math.min(S.coins,p.cost-p.paid,Math.max(1,Math.ceil(p.cost*dt/1.2)));S.coins-=amt;p.paid+=amt;
      const f=Math.max(0.001,p.paid/p.cost);p.fill.scale.set(f,1,f);if(Math.random()<0.3)beep(900+f*500,0.03,'sine',0.02);
      p.coinT=(p.coinT||0)-dt;if(p.coinT<=0){p.coinT=0.07;emit(P_COIN,{fx:player.x,fy:1.9,fz:player.z,x:player.x,y:1.9,z:player.z,to:{x:p.x+rnd(-0.4,0.4),y:0.2,z:p.z+rnd(-0.4,0.4)},h:1.2,life:0.38,vr:10});}
      if(p.paid>=p.cost){unlock(p);S.tut=4;}}}
  // coops
  for(const c of COOPS){if(!c.owned)continue;grow(c,dt);c.t+=dt;if(c.t>=layT(c)){c.t=0;if(c.eggs<NEST){c.eggs++;if(c.chs){const h=pick(c.chs);if(h.hop<=0)h.hop=1;}}}
    stack(c.eggM,c.eggs,c,'_e');}
  // belts
  for(const id in belts){if(!S.own[id])continue;const b=belts[id];b.t-=dt;
    if(b.t<=0&&machine.input+machine.transit<INCAP){const cs=COOPS.filter(c=>c.owned&&c.belt===id&&c.eggs>0);if(cs.length){b.rr++;sendEgg(cs[b.rr%cs.length]);b.t=0.5;}}}
  for(const b of beltAnim)b.tex.offset.x-=dt*3.8/0.8;
  for(let i=transit.length-1;i>=0;i--){const e=transit[i];let step=3.8*dt;
    while(step>0){const t=e.p[e.i+1];if(!t){break;}const dx=t[0]-e.m.position.x,dz=t[1]-e.m.position.z,d=Math.hypot(dx,dz);
      if(d<=step){e.m.position.x=t[0];e.m.position.z=t[1];step-=d;e.i++;}else{e.m.position.x+=dx/d*step;e.m.position.z+=dz/d*step;step=0;}}
    e.m.rotation.x+=dt*2;
    if(!e.p[e.i+1]){scene.remove(e.m);transit.splice(i,1);machine.transit--;machine.input++;machine.inK.push(e.k||'w');}}
  // machine
  if(machine.work>0){machine.work-=dt;machine.gear.rotation.y+=dt*9;machine.body.scale.set(1+Math.sin(time*30)*0.015,1+Math.sin(time*24)*0.025,1);
    machine.steamT-=dt;if(machine.steamT<=0){machine.steamT=0.16;puffAt(MX+0.9+rnd(-0.1,0.1),3.45,MZ-0.5,0xf4f4f4);}
    if(machine.work<=0){machine.output++;machine.outK.push(machine.pk||'w');beep(392,0.07,'triangle',0.03);machine.body.scale.set(1,1,1);sparkle(OUT.x-0.2,0.9,OUT.z,4);}}
  if(machine.work<=0&&machine.input>=3&&machine.output<OUTCAP){const pk=packKind();if(pk){machine.input-=3;machine.work=S.proc;machine.pk=pk;}}
  lampSet(machine.work>0?0x58e06a:machine.output>=OUTCAP?0xe5533d:0x777777);
  stack(machine.inM,machine.input,machine,'_i');stack(machine.outM,machine.output,machine,'_o');
  paintArr(machine.inM,machine.inK,machine.input,false);paintArr(machine.outM,machine.outK,machine.output,true);
  // counters
  for(const k of counters){grow(k,dt);stack(k.m,k.stock,k,'_s');paintArr(k.m,k.stK,k.stock,true);}
  // customers
  spawnT-=dt;if(spawnT<=0){spawnCustomer();spawnT=Math.max(2.4,7.5-S.upg*0.45)*SPAWN_K/Math.sqrt(counters.length)*rnd(0.75,1.25)*(STORY_ON?spawnMul():1);}
  for(let i=customers.length-1;i>=0;i--)if(!updateCustomer(customers[i],dt))customers.splice(i,1);
  for(const w of workers)updateWorker(w,dt);
  // chickens
  for(const c of chickens){c.t-=dt;const dx=c.tx-c.g.position.x,dz=c.tz-c.g.position.z,d=Math.hypot(dx,dz);
    if(c.sp<1){c.sp+=dt*2.2;c.g.scale.setScalar(Math.max(0.01,c.sp<0?0.01:backOut(c.sp)));}
    let flap=0;
    if(c.hop>0){c.hop=Math.max(0,c.hop-dt*2.4);const k=1-c.hop;c.g.position.y=Math.sin(k*Math.PI)*0.5;const sq=k<0.15?1-k*1.6:k>0.85?1-(1-k)*1.6:1+Math.sin(k*Math.PI)*0.12;
      c.g.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));flap=Math.sin(k*Math.PI*6)*0.9+0.5;c.head.rotation.x=-0.3;}
    else if(d>0.05){const sp=Math.min(d,0.9*dt);c.g.position.x+=dx/d*sp;c.g.position.z+=dz/d*sp;c.g.rotation.y=Math.atan2(dx,dz);c.g.position.y=Math.abs(Math.sin(time*10+c.ph))*0.05;c.head.rotation.x=0;flap=Math.abs(Math.sin(time*10+c.ph))*0.15;}
    else{c.g.position.y=0;c.head.rotation.x=Math.max(0,Math.sin(time*6+c.ph))*0.9;if(c.t<=0){c.t=rnd(1.5,4.5);c.tx=c.hx+rnd(-0.9,0.9);c.tz=c.hz+rnd(-0.9,0.9);}}
    if(c.hop<=0&&c.sp>=1&&c.g.scale.y!==1)c.g.scale.set(1,1,1);
    c.w1.rotation.z=-flap;c.w2.rotation.z=flap;}
  // hud
  if(S.coins!==coinShown){if(S.coins>coinShown&&coinShown>=0){const ch=$('coinChip');ch.classList.remove('bump');void ch.offsetWidth;ch.classList.add('bump');}coinShown=S.coins;$('coins').textContent=fmt(S.coins);}
  $('sold').textContent=fmt(S.sold);$('happy').textContent=fmt(S.happy);$('lost').textContent=fmt(S.lost);
  if(STORY_ON)storyUpdate(dt);
  const h=$('hint');if(S.tut<4&&!(S.tut===3&&S.coins<50)){h.style.opacity=1;if(hintShown!==S.tut){hintShown=S.tut;h.innerHTML=HINTS[S.tut];}}else h.style.opacity=0;
  // 아케이드: 남은 시간 · 번 코인
  if(mode==='play'){timeLeft-=rdt;
    liveT-=rdt;if(liveT<=0){liveT=1;if(earned!==lastLive){lastLive=earned;hk({type:'hk:live',score:Math.round(earned)});}}
    if(timeLeft<=0){timeLeft=0;arcHud();endRound();return;}
    arcHud();}
}

  const sec=Math.ceil(timeLeft),t=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  if(t!==shownTime){shownTime=t;$('time').textContent=t;$('timeChip').classList.toggle('warn',timeLeft<=30);}}

const totalEarned=()=>(ST.stats.earned||0)+(ST.stats.awayCoins||0); // 농장 등급은 자리 비운 사이 번 코인까지
function stars(){let n=0;for(const v of STORY.stars)if(totalEarned()>=v)n++;return n;}
function starStr(){const n=stars();return '★'.repeat(n)+'☆'.repeat(STORY.stars.length-n);}
function crateVal(k){return Math.round(STORY.price[k||'w']*(k==='w'&&S.own.gold?STORY.goldMul:1)*(1+STORY.starMul*stars()));}
function layT(c){return EGG_T*(c.kind==='q'?STORY.quailLay:1)*(STORY_ON&&wx==='sun'?STORY.weather.sunLay:1);}
function spawnMul(){let m=1;if(wx==='rain')m*=STORY.weather.rainSpawn;if(MK.on)m*=STORY.market.spawn;if(FEST)m*=STORY.fest.spawn;return m;}
function packKind(){const q=machine.inK;if(q.length<3)return 'w';const cnt={};
  for(const k of q){cnt[k]=(cnt[k]||0)+1;if(cnt[k]>=3){let n=3;for(let i=0;i<q.length&&n;)if(q[i]===k){q.splice(i,1);n--;}else i++;return k;}}return null;}
function dockRoom(){return STORY_ON&&!!S.own.truck&&DOCK.ks.length<STORY.truck.cap;}
function availKinds(){const k=['w'];if(S.own.coop3)k.push('b');if(S.own.pasture)k.push('d');if(S.own.coop6)k.push('q');return k;}
function storySold(k){ST.stats['sold'+k]=(ST.stats['sold'+k]||0)+1;}
function storyPay(cu,tip){const pay=Math.round(cu.val+tip*(wx==='rain'?STORY.weather.rainTip:1));ST.stats.earned+=pay;if(MK.on)ST.stats.market=(ST.stats.market||0)+1;return pay;}
function gain(v,x,y,z){v=Math.round(v);S.coins+=v;ST.stats.earned+=v;popText('+'+fmt(v)+' '+ICO.coin,x,y,z,'#ffe066');coinBurst(x,y-0.6,z,Math.min(14,4+Math.round(v/40)));
  beep(880,0.09,'square',0.04);setTimeout(()=>beep(1320,0.14,'square',0.04),80);}
function dec(e){e.n--;if(!e.n)e.type=null;}
function storyDrop(e){const isP=e===player;
  if(isP&&S.own.board&&dist(e.x,e.z,BOARD.x,BOARD.dz)<1.9){const r=boardTake(e);if(r)return r;}
  if(isP&&S.own.bakery&&dist(e.x,e.z,BAKE.x,BAKE.dz)<1.9&&BAKE.q.length<STORY.bake.cap){BAKE.q.push(e.ks.pop()||'w');dec(e);return 'stock';}
  if(dockRoom()&&dist(e.x,e.z,DOCK.x,DOCK.z)<1.95){DOCK.ks.push(e.ks.pop()||'w');dec(e);return 'stock';}
  return null;}
function boardTake(e){
  const need=FEST?[{items:FEST.need,got:FEST.got,f:1}]:ORDERS;
  for(const o of need)for(let i=e.ks.length-1;i>=0;i--){const k=e.ks[i];if((o.got[k]||0)<(o.items[k]||0)){e.ks.splice(i,1);o.got[k]=(o.got[k]||0)+1;dec(e);
    if(o.f)festCheck();else orderCheck(o);return 'stock';}}
  return null;}
function newOrder(){const ks=availKinds().sort(()=>Math.random()-0.5),nk=ks.length>1&&Math.random()<0.55?2:1,items={};let tot=0,val=0;
  for(const k of ks.slice(0,nk)){const n=Math.min(6,Math.max(1,Math.round((1+Math.floor(Math.random()*(1+ST.ch/4)))*(ST.end?1.5:1))));items[k]=n;tot+=n;val+=crateVal(k)*n;}
  const time=Math.round(rnd(STORY.order.time[0],STORY.order.time[1])+tot*STORY.order.perBox);
  ORDERS.push({id:++oid,items,got:{},left:time,time,reward:Math.round((val*STORY.order.reward+STORY.order.plus)/10)*10});
  toast('게시판에 새 주문이 붙었어요!');peekTodo();beep(700,0.08,'triangle',0.05);}
function orderCheck(o){for(const k in o.items)if((o.got[k]||0)<o.items[k])return;

  const c=f.c;let tx,tz,sp;
  if(f.st==='sneak'){tx=c.nx;tz=c.nz;sp=STORY.fox.speed*(0.75+0.35*Math.abs(Math.sin(time*2.2)));
    if(dist(player.x,player.z,f.x,f.z)<STORY.fox.scare){f.st='flee';ST.stats.fox=(ST.stats.fox||0)+1;popText('쫓았어요!',f.x,2.2,f.z,'#ffe066');sparkle(f.x,1,f.z,14);

    else if(dist(f.x,f.z,tx,tz)<0.8){const lost=c.eggs;c.eggs=0;f.st='flee';if(lost)popText('-'+lost+' '+ICO.egg,c.nx,1.8,c.nz,'#ff8a6e');

function awayCalc(){if(!store.savedAt||store.isNew)return null;const sec=Math.min(STORY.away.maxH*3600,(store.now()-store.savedAt)/1000);if(sec<STORY.away.minSec)return null;
  const hands=(S.own.hand?1:0)+(S.own.hand2?1:0);if(!hands)return null;
  let eggs=0,val=0;for(const c of COOPS){if(!c.owned)continue;const r=1/layT(c);eggs+=r;val+=r*crateVal(c.kind||'w');}
  if(!eggs)return null;
  const rate=Math.min(eggs/3,1/S.proc,hands*STORY.away.carry+(S.own.truck?STORY.away.truck:0))*STORY.away.eff;

function afterAway(){closeCard();
  if(ST.seen<ST.ch)talk(ST.end?END_TALK:CH[ST.ch].talk,()=>{ST.seen=ST.ch;if(ST.end)dailyTick();else chapterBegin();sync();store.dirty();});
  else if(ST.end){dailyTick();toast('오늘의 목표를 채워 봐요!');peekTodo(5000);}
  else{toast((ST.ch+1)+'장 · '+CH[ST.ch].t);peekTodo(5000);}}
function chapterBegin(){toast((ST.ch+1)+'장 · '+CH[ST.ch].t);peekTodo(6000);goalSeen=null;
  if(ST.ch===FEAT.fox)foxT=STORY.fox.first;if(ST.ch===FEAT.market)MK.t=STORY.market.first;if(ST.ch===FEAT.weather)wxT=20;}
function completeChapter(){const c=CH[ST.ch],i=ST.ch;S.coins+=c.reward;ST.ch++;ST.base=Object.assign({},ST.stats);
  const last=ST.ch>=CH.length;if(last){ST.end=true;ST.ch=CH.length;newDaily();}
  celebrate(player.x,player.z,true);[523,659,784,1046].forEach((f,k)=>setTimeout(()=>beep(f,0.18,'triangle',0.08),k*120));
  refreshPads();sync();store.saveNow();
  storyCard('<h1>🎉 '+(i+1)+'장 완료!</h1><p class="sub">'+c.t+'</p><div class="big">'+ICO.coin+' +'+fmt(c.reward)+'</div>'+
    (last?'<div class="opens"><b>모든 장을 깼어요!</b><br>이제 끝없는 주문 · 오늘의 목표 · 농장 등급 별이 기다려요.</div>'
         :'<div class="opens"><b>다음: '+(ST.ch+1)+'장 · '+CH[ST.ch].t+'</b><br>새로 열려요: '+CH[ST.ch].opens+'</div>')+
    '<button class="btn" data-act="next">'+(last?'이야기 마무리':'다음 이야기')+'</button>');}
function dayKey(){return new Date(store.now()+9*3600e3).toISOString().slice(0,10);}
function newDaily(){const d=dayKey();let h=7;for(const ch of d)h=(Math.imul(h,31)+ch.charCodeAt(0))>>>0;const pool=DAILY.slice(),list=[];
  while(list.length<3&&pool.length){h=(Math.imul(h,1103515245)+12345)>>>0;const g=pool.splice((h>>>8)%pool.length,1)[0];list.push({t:g.t,n:g.n,base:ST.stats[g.t]||0,done:false});}
  ST.daily={day:d,list,bonus:false};}
function dailyTick(){if(!ST.daily||ST.daily.day!==dayKey()){newDaily();toast('새 오늘의 목표가 나왔어요!');}
  for(const g of ST.daily.list){if(g.done)continue;if((ST.stats[g.t]||0)-g.base>=g.n){g.done=true;S.coins+=STORY.daily.reward;toast('오늘의 목표 완료! 코인 +'+fmt(STORY.daily.reward));peekTodo();beep(784,0.2,'triangle',0.07);store.dirty();}}
  if(!ST.daily.bonus&&ST.daily.list.every(g=>g.done)){ST.daily.bonus=true;S.coins+=STORY.daily.bonus;celebrate(player.x,player.z,true);setTimeout(()=>toast('오늘의 목표를 모두 채웠어요! 코인 +'+fmt(STORY.daily.bonus)),1500);store.saveNow();}}
function goalTick(){if(!ST||modal)return;sync();
  if(!ST.end){const gs=CH[ST.ch].goals,dn=gs.map(goalDone),key=ST.ch;
    if(goalSeen&&goalSeen.ch===key&&!dn.every(Boolean))for(let i=0;i<gs.length;i++)if(dn[i]&&!goalSeen.d[i]){toast('할 일 완료! '+goalLabel(gs[i]));peekTodo();beep(784,0.15,'triangle',0.06);break;}
    goalSeen={ch:key,d:dn};
    if(dn.every(Boolean))completeChapter();}
  else dailyTick();}
function storyUnlocked(p){sync();store.saveNow();
  const tip={board:'게시판에 주문이 붙으면 상자를 들고 게시판 앞에 서요',bakery:'빵집 앞에 상자를 놓으면 카스텔라를 구워 사 가요',truck:'정류장에 상자를 쌓아 두면 트럭이 와서 실어 가요',
    hand:'일꾼은 자리를 비운 사이에도 조금씩 팔아 줘요',pasture:'북쪽 목장의 오리 둥지에서 오리알이 나와요',coop3:'갈색 닭장에서 갈색 달걀이 나와요',coop6:'메추리는 알을 자주 낳아요'}[p.id];
  if(tip)setTimeout(()=>toast(tip),2700);goalTick();}
function onStale(){staleHit=true;storyCard('<h1>다른 곳에서 이어 했어요</h1><p>다른 창이나 기기에서 먼저 저장했어요. 최신 진행으로 다시 불러올게요.</p><button class="btn" data-act="reload">다시 불러오기</button>');}
function onClosedSave(opens){storyCard('<h1>'+ICO.moon+' 업무 시간이에요</h1><p>이야기 농장은 지금 쉬어요. 하던 것까지 저장했어요.'+(opens?'<br><b>'+opens+'</b>에 다시 열려요.':'')+'</p><button class="btn w" data-act="home">처음 화면으로</button>');}

/* ---------- 이야기 농장: 매 프레임(게임이 도는 동안) ---------- */
function storyUpdate(dt){
  for(const o of STRUCT)grow(o,dt);
  // 주문 게시판
  if(S.own.board&&!FEST){orderT-=dt;if(orderT<=0){orderT=rnd(STORY.order.every[0],STORY.order.every[1]);if(ORDERS.length<(ST.end?STORY.order.maxEnd:STORY.order.max))newOrder();}
    for(let i=ORDERS.length-1;i>=0;i--){const o=ORDERS[i];o.left-=dt;if(o.left<=0){ORDERS.splice(i,1);toast('주문 시간이 지났어요. 다음 주문을 기다려요');}}}
  // 빵집
  if(S.own.bakery){if(BAKE.q.length){BAKE.t+=dt;BAKE.smokeT-=dt;if(BAKE.smokeT<=0){BAKE.smokeT=0.35;puffAt(BAKE.x+1.35,4.0,BAKE.z-0.5,0xf4f4f4);}
      BAKE.glassMat.emissiveIntensity=0.7+0.3*Math.sin(time*8);
      if(BAKE.t>=STORY.bake.t){BAKE.t=0;BAKE.q.shift();ST.stats.castella=(ST.stats.castella||0)+1;gain(STORY.castella*(1+STORY.starMul*stars()),BAKE.x+0.8,3.6,BAKE.z+1.6);
        if(FEST){FEST.got.c=(FEST.got.c||0)+1;festCheck();}}}
    else{BAKE.t=0;BAKE.glassMat.emissiveIntensity=0.15;}
    for(let i=0;i<BAKE.m.length;i++){BAKE.m[i].visible=i<BAKE.q.length;if(i<BAKE.q.length)paintC(BAKE.m[i],BAKE.q[i]);}}
  // 배달 트럭
  if(S.own.truck){const tr=TRUCK;
    if(tr.st==='away'){if(DOCK.ks.length)tr.t-=dt;if(tr.t<=0){tr.st='come';tr.x=38;tr.g.visible=true;}}
    else if(tr.st==='come'){tr.x-=dt*7;if(tr.x<=tr.px){tr.x=tr.px;tr.st='load';tr.lt=0.5;}}
    else if(tr.st==='load'){tr.lt-=dt;if(tr.lt<=0){if(DOCK.ks.length){const k=DOCK.ks.pop();tr.n++;tr.pay+=crateVal(k)*STORY.truck.bonus;tr.lt=0.22;beep(520+tr.n*20,0.04,'sine',0.03);}
        else{tr.st='go';if(tr.n){ST.stats.truck=(ST.stats.truck||0)+tr.n;gain(tr.pay,tr.x,3.4,tr.z);toast('트럭이 상자 '+fmt(tr.n)+'개를 싣고 갔어요');if(store)store.dirty();}}}}
    else if(tr.st==='go'){tr.x+=dt*8;if(tr.x>=38){tr.st='away';tr.t=STORY.truck.every;tr.g.visible=false;tr.n=0;tr.pay=0;}}
    tr.g.position.x=tr.x;if(tr.st==='come'||tr.st==='go'){for(const w of tr.wheels)w.rotation.z+=dt*(tr.st==='go'?-21:18);}
    for(let i=0;i<DOCK.m.length;i++){DOCK.m[i].visible=i<DOCK.ks.length;if(i<DOCK.ks.length)paintC(DOCK.m[i],DOCK.ks[i]);}}
  // 게시판 종이
  if(S.own.board){const n=FEST?3:ORDERS.length;BOARD.notes.forEach((m,i)=>m.visible=i<n);}
  // 날씨
  if(ST.ch>=FEAT.weather&&!FEST){wxT-=dt;if(wxT<=0){if(wx==='fair'){wx=Math.random()<0.5?'rain':'sun';const r=STORY.weather[wx];wxT=rnd(r[0],r[1]);
      toast(wx==='rain'?'비가 와요! 손님은 줄지만 팁을 두 배로 줘요':'맑은 날이에요! 닭이 알을 더 잘 낳아요');}
    else{wx='fair';wxT=rnd(STORY.weather.every[0],STORY.weather.every[1]);}}}
  // 여우
  if(ST.ch>=FEAT.fox&&!FEST){if(!FOX.st){foxT-=dt;if(foxT<=0)foxStart();}else foxStep(dt);}
  else if(FOX.st)foxStep(dt);
  // 장터 날
  if(ST.ch>=FEAT.market&&!FEST){if(MK.on){MK.left-=dt;if(MK.left<=0){MK.on=false;MK.t=marketGap();toast('장터 날이 끝났어요');}}
    else{MK.t-=dt;if(MK.t<=0){MK.on=true;MK.left=STORY.market.len;spawnT=Math.min(spawnT,0.8);toast('장터 날이에요! 손님이 몰려와요');beep(660,0.15,'triangle',0.06);}}}
  // 축제 결승
  if(FEST){FEST.left-=dt;if(Math.random()<dt*3)emit(P_CONF,{x:player.x+rnd(-8,8),y:9,z:player.z+rnd(-7,5),vx:rnd(-1,1),vy:-1,vz:rnd(-1,1),g:2,drag:0.4,life:3,col:pick(CONF),vr:rnd(-8,8),s:1.2});
    if(FEST.left<=0)festLose();}
  // 목표 · 저장
  goalT-=dt;if(goalT<=0){goalT=0.5;goalTick();}
  syncT-=dt;if(syncT<=0){syncT=1;if(!staleHit){sync();const sg=JSON.stringify(ST);if(sg!==lastSig){lastSig=sg;store.dirty();}}}
  beatT+=dt;if(beatT>=120){beatT=0;ST.beat=Math.round(store.now());store.dirty();} // 자리 비운 시간 계산이 실제 자리를 비운 때부터 되도록
}
// 그리기만(멈춰 있어도) — 빛 · 비 · 이름표 · 할 일
function storyFrame(dt){
  nightK+=(nightTo-nightK)*Math.min(1,dt*1.2);rainK+=((wx==='rain'?1:0)-rainK)*Math.min(1,dt*0.8);
  hemi.intensity=0.6*(1-0.45*nightK)*(1-0.2*rainK);sun.intensity=1.5*(1-0.6*nightK)*(1-0.42*rainK);
  renderer.toneMappingExposure=0.9*(1-0.45*nightK)*(1-0.12*rainK);hemi.color.copy(HEMIC).lerp(MOONC,nightK);
  scene.background.copy(SKYC).lerp(RAINC,rainK*0.85).lerp(NIGHTC,nightK*0.9);scene.fog.color.copy(scene.background);
  if(RAIN){const on=rainK>0.02;RAIN.im.visible=on;if(on){RAIN.im.material.opacity=0.5*rainK;const ps=RAIN.ps;
    for(let i=0;i<ps.length;i++){const p=ps[i];p[1]-=p[3]*dt;if(p[1]<0)p[1]+=18;_o.position.set(camT.x+p[0],p[1],camT.z+p[2]);_o.rotation.set(0,0,0.12);_o.scale.setScalar(1);_o.updateMatrix();RAIN.im.setMatrixAt(i,_o.matrix);}
    RAIN.im.instanceMatrix.needsUpdate=true;}}
  if(BOARD.lbl){const t=FEST?'축제 주문':'주문 게시판'+(ORDERS.length?' · '+ORDERS.length+'건':'');if(BOARD.lt!==t){BOARD.lt=t;BOARD.lbl.textContent=t;}place(BOARD.lbl,BOARD.x,3.7,BOARD.z);}
  if(BAKE.lbl){const t=BAKE.q.length+'';if(BAKE.lt!==t){BAKE.lt=t;BAKE.lbl.innerHTML=ICO.crate+' '+BAKE.q.length+'/'+STORY.bake.cap+' <span style="opacity:.7">→</span> '+ICO.cast;}place(BAKE.lbl,BAKE.x,4.6,BAKE.z);}
  if(DOCK.lbl){const tr=TRUCK,t=ICO.crate+' '+DOCK.ks.length+'/'+STORY.truck.cap+' · '+(tr.st==='away'?(DOCK.ks.length?'트럭 '+mmss(tr.t):'트럭 정류장'):'트럭 왔어요');
    if(DOCK.lt!==t){DOCK.lt=t;DOCK.lbl.innerHTML=t;}place(DOCK.lbl,DOCK.x,2.6,DOCK.z);}
  if(FOX.g&&FOX.g.visible){FOX.lbl.style.display='';v3.set(FOX.x,2.3,FOX.z).project(cam); // 화면 밖이면 가장자리에 붙여 어느 쪽인지 알려 준다
    let px=(v3.x*0.5+0.5)*W,py=(-v3.y*0.5+0.5)*H;const out=px<50||px>W-50||py<90||py>H-30;px=Math.max(50,Math.min(W-50,px));py=Math.max(90,Math.min(H-30,py));
    const t=out?'여우! '+(py<=90?'↑':py>=H-30?'↓':px<=50?'←':'→'):'여우!';if(FOX.lt!==t){FOX.lt=t;FOX.lbl.textContent=t;}
    FOX.lbl.style.transform='translate(-50%,-100%) translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px)';}
  panelT-=dt;if(panelT<=0||dt===0){panelT=0.25;refreshPanel();}}

/* ---------- 시작 · 끝 화면 ---------- */
const card=$('card'),startOv=$('start');
function showCard(html){card.innerHTML=html;startOv.style.display='flex';}
function menuCard(){
  const pick2='<div class="choice">'+
    (ARC?'<button class="cbtn" id="play" data-act="start">'+ICO.clock+'<span><b>3분 도전</b><small>3분 동안 코인을 벌어 사내 순위에 올라요</small></span></button>'
        :'<button class="cbtn" id="play" data-act="start">'+ICO.chick+'<span><b>자유 놀이</b><small>저장 없이 마음껏 농장을 꾸려요</small></span></button>')+
    '<button class="cbtn" id="story" data-act="story">'+ICO.book+'<span><b>이야기 농장</b><small>할머니의 닭장을 마을 대표 농장으로 키워요. 순위와 상관없이 천천히, 진행은 저장돼요</small></span></button></div>';
  showCard('<h1>'+ICO.chick+' 햇살 농장 3D</h1>'+pick2+
    '<ol><li><b>닭장</b> 앞에서 달걀을 주워 <b>포장 기계</b> 왼쪽에 놓으면 3개가 한 상자가 돼요.</li>'+
    '<li>기계 오른쪽에서 상자를 들고 <b>판매대</b>를 채우면 손님이 사 가요.</li>'+
    '<li>반짝이는 <b>동그라미</b>에 서 있으면 코인으로 일꾼 · 구역을 열어요.'+(ARC?' 3분 도전은 판매로 번 코인이 점수예요(쓴 코인은 빼지 않아요).':'')+'</li></ol>'+
    '<p style="font-size:14px;opacity:.75;margin:0">움직이기: 화면을 끌거나 WASD · 방향키</p>');}
function startRound(){if(S.started)return;S.started=true;startOv.style.display='none';initAudio();last=performance.now();
  if(ARC){mode='play';timeLeft=ROUND;earned=0;reported=false;liveT=1;lastLive=0;arcHud();hk({type:'hk:start'});hk({type:'hk:live',score:0});}
  else mode='free';}
function stopInput(){for(const k in keys)keys[k]=false;joy.on=false;joy.dx=joy.dz=0;stick.style.display='none';}
function endRound(){if(mode!=='play')return;mode='over';S.started=false;stopInput();$('hint').style.opacity=0;
  const score=Math.round(earned);
  showCard('<h1>⏰ 시간 끝!</h1><p class="sub">3분 동안 판매로 번 코인</p><div class="big">'+ICO.coin+' '+fmt(score)+'</div>'+
    '<table><tr><td>판 상자</td><td>'+fmt(S.sold)+'개</td></tr><tr><td>기뻐한 손님</td><td>'+fmt(S.happy)+'명</td></tr>'+
    '<tr><td>연 구역 · 시설</td><td>'+fmt(S.upg)+' / '+ARC_PADS+'</td></tr></table>'+
    '<button id="play" data-act="again">다시 하기</button>');
  if(!reported){reported=true;hk({type:'hk:score',score});}}
// 새 판 = 새 농장 — 창을 새로 열어 처음 상태로 (auto 면 시작 화면 없이 바로 시작)
function fresh(auto){const u=new URL(location.href);if(auto)u.searchParams.set('go','1');else u.searchParams.delete('go');location.replace(u.toString());}
function pause(){if(!(mode==='play'||mode==='story')||paused)return;paused=true;stopInput();$('pauseOv').classList.add('on');hk({type:'hk:paused'});if(mode==='story')saveFlush();}
function resume(){if(!paused)return;paused=false;last=performance.now();$('pauseOv').classList.remove('on');hk({type:'hk:resumed'});}
$('pauseOv').addEventListener('click',resume);
card.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='start')startRound();else if(a==='again')fresh(true);
  else if(a==='story')enterStory();else if(a==='menu0')menuCard();
  // 이야기 농장 카드
  else if(a==='close'){closeCard();}
  else if(a==='away'){const g=awayGot;awayGot=null;if(g){S.coins+=g.coins;ST.stats.awayCoins=(ST.stats.awayCoins||0)+g.coins;ST.stats.away=(ST.stats.away||0)+g.boxes;coinBurst(player.x,2,player.z,14);sync();store.saveNow();}afterAway();}
  else if(a==='next'){closeCard();if(ST.end)talk(END_TALK,()=>{ST.seen=ST.ch;sync();store.saveNow();toast('오늘의 목표를 채우고 별을 모아 봐요!');});
    else talk(CH[ST.ch].talk,()=>{ST.seen=ST.ch;chapterBegin();sync();store.dirty();});}
  else if(a==='festGo'){closeCard();startFest();}
  else if(a==='home'){b.disabled=true;leaveStory();}
  else if(a==='reload'){goStory();}
  else if(a==='resetAsk')storyCard('<h1>처음부터 다시 할까요?</h1><p>모은 코인 · 연 시설 · 장 진행이 모두 사라지고 1장부터 다시 시작해요. 되돌릴 수 없어요.</p>'+
    '<div class="bbar"><button class="btn r" data-act="resetYes">처음부터 다시</button><button class="btn w" data-act="menuBack">아니요</button></div>');
  else if(a==='menuBack'){modal=false;storyMenu();}
  else if(a==='resetYes'){b.disabled=true;b.textContent='지우는 중이에요…';try{staleHit=true;await store.reset();goStory();}
    catch(err){staleHit=false;storyCard('<h1>지우지 못했어요</h1><p>'+((err&&err.message)||'잠시 뒤 다시 해 봐요.')+'</p><button class="btn" data-act="close">닫기</button>');}}
});
addEventListener('message',e=>{if(e.origin!==HK||e.source!==window.parent)return;const t=e.data&&e.data.type;
  if(t==='hk:hello')document.documentElement.classList.add('in-hk');
  else if(t==='hk:pause')pause();
  else if(t==='hk:resume')resume();
  else if(t==='hk:restart'&&ARC){if(STORY_ON)leaveStory();else if(mode!=='loading')fresh(false);}});
// 아케이드 모드: 창 안 Esc 는 부모에게 알려 멈춤/이어 하기를 정하게 한다
if(ARC)addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.repeat){e.preventDefault();if(mode==='play'||mode==='story')hk({type:'hk:esc'});}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
menuCard();
requestAnimationFrame(frame);
if(AUTO||GO==='story'){try{const u=new URL(location.href);u.searchParams.delete('go');history.replaceState(null,'',u.toString());}catch(e){}if(AUTO)startRound();else enterStory();}
hk({type:'hk:ready'});
// 시험용(본체 주소를 직접 열 때만 — 아케이드 창 안에서는 없음)
if(!ARC)window.__ef={get ST(){return ST;},S,ORDERS:()=>ORDERS,fox:()=>{if(STORY_ON)foxStart();},wx:w=>{wx=w;},fest:()=>startFest(),market:()=>{MK.t=0;},order:()=>newOrder(),player,dbg:()=>({nightK,rainK,nightTo,sun:sun.intensity,hemi:hemi.intensity,fox:FOX.st,foxT,x:FOX.x,z:FOX.z,bg:scene.background.getHexString()})};
})();
</script>
