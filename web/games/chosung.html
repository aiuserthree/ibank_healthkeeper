<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>건강 초성 퀴즈 — 점심 라운지</title>

  <link rel="stylesheet" href="/_shared/responsive.css">

  <style>
    .gm-cs { --gm-a: #e0508a; --gm-b: #ff9a8b; --gm-ink: #b8306a; --gm-soft: #fff1f5; --gm-line: #f6c9da;
      position: relative; background: var(--surface-card, #fff); border: 1px solid var(--color-mist-border, #e3e8f0); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(224, 80, 138, .10); }
    .gm-cs__top { display: flex; align-items: center; gap: 10px; padding: 14px 18px; color: #fff; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); }
    .gm-cs__top b { font-size: 15px; }
    .gm-cs__dots { display: flex; gap: 6px; margin-left: 4px; }
    .gm-cs__dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.35); }
    .gm-cs__dot.is-now { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
    .gm-cs__dot.is-ok { background: #fff; }
    .gm-cs__dot.is-ng { background: rgba(60, 10, 30, .35); }
    .gm-cs__score { margin-left: auto; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.22); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .gm-cs__timer { height: 8px; background: var(--gm-soft); }
    .gm-cs__timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gm-a), var(--gm-b)); border-radius: 0 6px 6px 0; transform-origin: left center; }
    .gm-cs__timer.is-low i { background: #e5484d; }
    .gm-cs__body { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .gm-cs__meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--text-secondary); }
    .gm-cs__cat { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--gm-soft); color: var(--gm-ink); font-weight: 700; font-size: 13px; }
    .gm-cs__sec { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--color-midnight-navy); }
    .gm-cs__tiles { display: flex; justify-content: center; gap: 6px; padding: 6px 0; }
    .gm-cs__tile { flex: 0 1 58px; min-width: 0; aspect-ratio: 5 / 6; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--gm-soft); border: 2px solid var(--gm-line); color: var(--gm-ink); font-weight: 800; font-size: clamp(18px, 6.2vw, 30px); line-height: 1; }
    .gm-cs__tile.is-open { background: #fff; border-color: var(--gm-a); color: var(--color-midnight-navy); animation: gm-pop .28s ease-out; }
    .gm-cs__gap { flex: 0 0 12px; }
    .gm-cs__desc { margin: 0; text-align: center; font-size: 15.5px; line-height: 1.55; color: var(--color-midnight-navy); padding: 12px 14px; border-radius: 12px; background: var(--color-mist, #f3f6fa); word-break: keep-all; }
    .gm-cs__form { display: flex; gap: 8px; }
    .gm-cs__input { flex: 1; min-width: 0; height: 50px; border-radius: 12px; border: 2px solid var(--border-default, #d6dde8); padding: 0 14px; font-size: 18px; font-weight: 600; color: var(--color-midnight-navy); background: #fff; outline: none; }
    .gm-cs__input:focus { border-color: var(--gm-a); box-shadow: 0 0 0 4px rgba(224, 80, 138, .14); }
    .gm-cs__input.is-shake { animation: gm-shake .35s; border-color: #e5484d; }
    .gm-cs__go { height: 50px; padding: 0 18px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--gm-a), #f0717f); cursor: pointer; flex-shrink: 0; }
    .gm-cs__msg { min-height: 20px; margin: -6px 0 0; font-size: 13.5px; text-align: center; color: var(--text-secondary); }
    .gm-cs__msg.is-bad { color: #d23b48; font-weight: 600; }
    .gm-cs__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .gm-cs__btn { height: 44px; border-radius: 12px; border: 1px solid var(--border-default, #d6dde8); background: #fff; color: var(--color-midnight-navy); font-size: 14.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .gm-cs__btn:hover:not([disabled]) { background: var(--gm-soft); border-color: var(--gm-line); }
    .gm-cs__btn[disabled] { opacity: .45; cursor: default; }
    .gm-cs__btn small { color: var(--gm-ink); font-weight: 700; }

    /* 결과 띠 (문제마다 1.5초) */
    .gm-cs__fb { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; background: rgba(255,255,255,.96); animation: gm-fade .18s ease-out; }
    .gm-cs__fb-badge { width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .gm-cs__fb-badge.is-ok { background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); }
    .gm-cs__fb-badge.is-ng { background: #94a3b8; }
    .gm-cs__fb-title { font-size: 22px; font-weight: 800; color: var(--color-midnight-navy); }
    .gm-cs__fb-word { font-size: 28px; font-weight: 800; color: var(--gm-ink); letter-spacing: .02em; }
    .gm-cs__fb-tip { margin: 0; max-width: 400px; font-size: 15px; line-height: 1.55; color: var(--text-secondary); word-break: keep-all; }
    .gm-cs__fb-pts { font-size: 14px; font-weight: 700; color: var(--gm-ink); }

    /* 일시정지 */
    .gm-cs__pause { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255, 241, 245, .97); text-align: center; padding: 20px; }
    .gm-cs__pause b { font-size: 20px; color: var(--color-midnight-navy); }

    /* 시작 / 요약 화면 */
    .gm-cs__intro { padding: 26px 22px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .gm-cs__demo { display: flex; align-items: center; gap: 10px; }
    .gm-cs__demo .gm-cs__tile { flex: 0 0 auto; width: 48px; font-size: 26px; }
    .gm-cs__arrow { color: var(--gm-a); }
    .gm-cs__date { font-size: 13px; font-weight: 700; color: var(--gm-ink); background: var(--gm-soft); padding: 5px 12px; border-radius: 999px; }
    .gm-cs__h { margin: 0; font-size: 24px; color: var(--color-midnight-navy); }
    .gm-cs__rules { margin: 0; padding: 14px 16px; list-style: none; width: 100%; max-width: 420px; text-align: left; border-radius: 12px; background: var(--color-mist, #f3f6fa); display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.5; color: var(--text-secondary); }
    .gm-cs__rules li { display: flex; gap: 8px; }
    .gm-cs__rules li > span:first-child { flex-shrink: 0; width: 18px; height: 18px; border-radius: 6px; margin-top: 2px; background: var(--gm-soft); color: var(--gm-ink); font-size: 11.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .gm-cs__rules b { color: var(--color-midnight-navy); }
    .gm-cs__note { width: 100%; max-width: 420px; padding: 10px 14px; border-radius: 12px; background: #fff7e6; color: #9a6400; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .gm-cs__start { min-width: 200px; height: 52px; border: 0; border-radius: 14px; color: #fff; font-size: 17px; font-weight: 800; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); box-shadow: 0 6px 18px rgba(224, 80, 138, .3); cursor: pointer; }
    .gm-cs__start:hover { filter: brightness(1.04); }
    .gm-cs__sum-big { font-size: 40px; font-weight: 800; color: var(--color-midnight-navy); letter-spacing: -.02em; }
    .gm-cs__sum-big small { font-size: 18px; color: var(--text-secondary); font-weight: 700; }
    .gm-cs__calc { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto; gap: 6px 0; font-size: 14px; color: var(--text-secondary); padding: 12px 16px; border-radius: 12px; background: var(--color-mist, #f3f6fa); text-align: left; }
    .gm-cs__calc b { color: var(--color-midnight-navy); text-align: right; font-variant-numeric: tabular-nums; }
    .gm-cs__calc .is-total { border-top: 1px solid var(--color-mist-border, #e3e8f0); padding-top: 6px; font-weight: 800; color: var(--color-midnight-navy); }
    .gm-cs__list { width: 100%; max-width: 420px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .gm-cs__list li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--color-mist-border, #e3e8f0); }
    .gm-cs__list li > i, .gm-cs__list li > svg { flex-shrink: 0; margin-top: 2px; }
    .gm-cs__list b { font-size: 15px; color: var(--color-midnight-navy); }
    .gm-cs__list small { display: block; font-size: 13px; line-height: 1.5; color: var(--text-secondary); margin-top: 2px; word-break: keep-all; }
    .gm-cs__list .gm-cs__cho { font-size: 12px; color: var(--gm-ink); font-weight: 700; margin-left: 6px; }

    @keyframes gm-pop { 0% { transform: scale(.8); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes gm-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    @keyframes gm-fade { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 480px) {
      .gm-cs__body { padding: 18px 14px 16px; gap: 12px; }
      .gm-cs__intro { padding: 22px 14px 20px; }
      .gm-cs__tiles { gap: 4px; }
      .gm-cs__gap { flex-basis: 8px; }
      .gm-cs__go { padding: 0 14px; }
      .gm-cs__h { font-size: 21px; }
    }
  </style>
</head>

          const form = stage.querySelector("[data-form]");
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            tryAnswer();
          });
          // 한글 조합 중 Enter — 조합이 끝난 뒤 한 번만 제출
          input.addEventListener("keydown", (e) => {
            if (e.key !== "Enter") return;
            e.preventDefault();
            if (e.isComposing || e.keyCode === 229) setTimeout(tryAnswer, 0);
            else tryAnswer();
          });
          stage.querySelector("[data-hint]").onclick = useHint;
          stage.querySelector("[data-skip]").onclick = () => finishQuestion(false, "skip");
          HKUI.refreshIcons(stage);
          updateHintBtn();
          input.focus({ preventScroll: true });
          lastTs = performance.now();
          raf = requestAnimationFrame(tick);
        }

        function renderTiles() {
          const word = qs[idx][0];
          let k = 0;
          stage.querySelector("[data-tiles]").innerHTML = Array.from(word).map((c) => {
            if (c === " ") return `<span class="gm-cs__gap"></span>`;
            const open = k++ < revealed;
            return `<span class="gm-cs__tile${open ? " is-open" : ""}">${esc(open ? c : choOf(c))}</span>`;
          }).join("");
        }

        function maxHints() {
          return Math.max(0, norm(qs[idx][0]).length - 1);
        }
        function updateHintBtn() {
          const btn = stage.querySelector("[data-hint]");
          if (btn) btn.disabled = revealed >= maxHints();
        }

        function useHint() {
          if (phase !== "play" || revealed >= maxHints()) return;
          revealed++;
          hintsTotal++;
          ctx.sfx("tick");
          renderTiles();
          updateHintBtn();
          stage.querySelector("[data-score]").textContent = `${totalScore()}점`;
          stage.querySelector("[data-input]").focus({ preventScroll: true });
        }

        function setMsg(text, bad) {
          const m = stage.querySelector("[data-msg]");
          if (!m) return;
          m.textContent = text;
          m.classList.toggle("is-bad", !!bad);
        }

        function tryAnswer() {
          if (phase !== "play") return;
          const now = performance.now();
          if (now - lastSubmitAt < 250) return; // 한글 입력기 중복 Enter 방지
          lastSubmitAt = now;
          const input = stage.querySelector("[data-input]");
          const guess = norm(input.value);
          if (!guess) {
            ctx.sfx("invalid");
            setMsg("정답을 입력해 주세요", true);
            return;
          }
          if (guess === norm(qs[idx][0])) {
            finishQuestion(true);
            return;
          }
          tries++;
          if (tries >= MAX_TRIES) {
            finishQuestion(false, "wrong");
            return;
          }
          ctx.sfx("invalid");
          input.value = "";
          input.classList.remove("is-shake");
          void input.offsetWidth;
          input.classList.add("is-shake");
          setMsg(`아쉬워요! 기회 ${MAX_TRIES - tries}번 남았어요`, true);
          input.focus({ preventScroll: true });
        }

        function tick(ts) {
          if (phase !== "play") return;
          const dt = Math.min(ts - lastTs, 250);
          lastTs = ts;
          remainMs = Math.max(0, remainMs - dt);
          const bar = stage.querySelector("[data-timer]");
          if (bar) {
            bar.firstElementChild.style.transform = `scaleX(${remainMs / (LIMIT * 1000)})`;
            bar.classList.toggle("is-low", remainMs < 8000);
            stage.querySelector("[data-sec]").textContent = Math.ceil(remainMs / 1000);
          }
          // 마지막 5초는 초가 바뀔 때마다 똑딱
          const secNow = Math.ceil(remainMs / 1000);
          if (secNow !== lastSec) {
            lastSec = secNow;
            if (secNow >= 1 && secNow <= 5) ctx.sfx("tick");
          }
          if (remainMs <= 0) {
            finishQuestion(false, "time");
            return;
          }
          raf = requestAnimationFrame(tick);
        }

        function finishQuestion(ok, why) {
          if (phase !== "play") return;
          stopLoops();
          phase = "feedback";
          const [word, , , tip] = qs[idx];
          const sec = ok ? Math.floor(remainMs / 1000) : 0;
          results[idx] = { ok, sec, why };
          ctx.sfx(ok ? "success" : why === "skip" ? "whoosh" : "fail");
          const card = stage.querySelector(".gm-cs");
          const title = ok ? "정답이에요!" : why === "time" ? "시간이 다 됐어요" : why === "skip" ? "넘겼어요" : "아쉬워요";
          const fb = document.createElement("div");
          fb.className = "gm-cs__fb";
          fb.innerHTML = `<div class="gm-cs__fb-badge ${ok ? "is-ok" : "is-ng"}">${HKUI.icon(ok ? "check" : "x", 34, "#fff")}</div>
            <div class="gm-cs__fb-title">${title}</div>
            <div class="gm-cs__fb-word">${esc(word)}</div>
            ${ok ? `<div class="gm-cs__fb-pts">+${100 + sec * 3}점 (정답 100 + 남은 ${sec}초×3)</div>` : ""}
            <p class="gm-cs__fb-tip">${esc(tip)}</p>`;
          card.appendChild(fb);
          HKUI.refreshIcons(fb);
          stage.querySelector("[data-input]")?.blur();
          timer = setTimeout(() => {
            idx++;
            if (idx < COUNT) showQuestion();
            else showSummary();
          }, FEEDBACK_MS);
        }

        // ── 요약 화면 → 기록 저장 ──
        function showSummary() {
          stopLoops();
          phase = "done";
          const okCount = results.filter((r) => r.ok).length;
          const base = okCount * 100;
          const timeBonus = results.reduce((s, r) => s + (r.ok ? r.sec * 3 : 0), 0);
          const score = totalScore();
          stage.innerHTML = `<div class="gm-cs">
            <div class="gm-cs__intro">
              <span class="gm-cs__date">${formatDate(ctx.today)} · 오늘의 5문제</span>
              <div class="gm-cs__sum-big">${okCount}<small> / ${COUNT} 정답</small></div>
              <div class="gm-cs__calc">
                <span>정답 ${okCount}개 × 100</span><b>${base}</b>
                <span>남은 시간 보너스</span><b>+${timeBonus}</b>
                <span>글자 힌트 ${hintsTotal}번 × 30</span><b>−${hintsTotal * HINT_COST}</b>
                <span class="is-total">합계</span><b class="is-total">${score}점</b>
              </div>
              <ul class="gm-cs__list">${qs.map((q, i) => `<li>
                ${HKUI.icon(results[i].ok ? "circle-check" : "circle-x", 20, results[i].ok ? "#e0508a" : "#94a3b8")}
                <div><b>${esc(q[0])}</b><span class="gm-cs__cho">${esc(toCho(q[0]))}</span><small>${esc(q[3])}</small></div>
              </li>`).join("")}</ul>
              <button type="button" class="gm-cs__start" data-again>처음 화면으로</button>
            </div>
          </div>`;
          stage.querySelector("[data-again]").onclick = showIntro;
          HKUI.refreshIcons(stage);
          setTimeout(() => ctx.submit(score), 600);
        }

        // ── 일시정지 (탭을 떠나면) ──
        function pause() {
          if (phase !== "play") return;
          stopLoops();
          phase = "paused";
          const p = document.createElement("div");
          p.className = "gm-cs__pause";
          p.innerHTML = `${HKUI.icon("pause", 30, "#e0508a")}<b>잠시 멈췄어요</b><span style="font-size:14px;color:var(--text-secondary)">돌아오면 이어서 풀 수 있어요</span><button type="button" class="gm-cs__start" data-resume>이어서 하기</button>`;
          stage.querySelector(".gm-cs").appendChild(p);
          HKUI.refreshIcons(p);
          p.querySelector("[data-resume]").onclick = () => {
            p.remove();
            phase = "play";
            lastTs = performance.now();
            stage.querySelector("[data-input]")?.focus({ preventScroll: true });
            raf = requestAnimationFrame(tick);
          };
        }
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) pause();
        });

        ctx.onRestart(showIntro);
        showIntro();
      },
    });
  </script>
</body>
</html>
