<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sun Crown Legion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed pixel canvas with the HUD drawn in it; spell bar docks bottom in portrait, right edge in landscape; menus are one parchment panel */
  --ink:#1a1c2c; --parch:#f4e8c8; --parch-dim:#d9c79a; --gold:#f2c230; --grass:#3f8a34; --blood:#c8402e; --mana:#3fd0e8;
  --display:"Press Start 2P","Courier New",monospace;
  color-scheme:only light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--grass);color:var(--ink);font-family:var(--display);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#spells{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
#spells[hidden]{display:none}
.sp{width:84px;height:54px;padding:4px 2px;font-size:9px;line-height:1.5;background:var(--parch);border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 var(--parch-dim),0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sp b{font-weight:400}
.sp i{font-style:normal;font-size:8px;color:#0a6f86}
.sp:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 var(--parch-dim),0 1px 0 var(--ink)}
.sp.off{background:#9a9a8c;color:#4a4a44;box-shadow:inset -3px -3px 0 #84847a,0 3px 0 var(--ink)}
.sp.off i{color:#4a4a44}
#sp0 b{color:var(--blood)} #sp1 b{color:#1c6fc0} #sp2 b{color:#a06a00}
.sp.off b{color:inherit!important}
@media (orientation:landscape) and (max-height:560px){
  #spells{left:auto;right:12px;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;gap:8px}
  .sp{height:48px}
}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;background:rgba(26,28,44,.45)}
.ov[hidden]{display:none}
.panel{width:100%;max-width:360px;max-height:100%;overflow-y:auto;background:var(--parch);border:4px solid var(--ink);
  box-shadow:inset -4px -4px 0 var(--parch-dim),0 6px 0 var(--ink);padding:18px 16px;display:flex;flex-direction:column;gap:12px;text-align:center}
h1{margin:0;font-size:18px;line-height:1.5;font-weight:400;color:var(--blood);text-shadow:2px 2px 0 var(--gold);text-wrap:balance}
h2{margin:0;font-size:14px;line-height:1.5;font-weight:400;text-wrap:balance}
p{margin:0;font-size:9px;line-height:1.8}
.lv{display:flex;flex-direction:column;gap:8px}
.btn{width:100%;padding:10px 8px;font-size:10px;line-height:1.5;background:var(--gold);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #c8962a,0 3px 0 var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.btn.c{justify-content:center;text-align:center}
.btn.alt{background:var(--parch);box-shadow:inset -3px -3px 0 var(--parch-dim),0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px)}
.btn:disabled{background:#b9b3a0;color:#6b675c;box-shadow:inset -3px -3px 0 #a09a88,0 3px 0 var(--ink);cursor:default}
.st{font-family:Arial,sans-serif;font-size:16px;letter-spacing:2px;color:#b07a00;white-space:nowrap}
.st s{text-decoration:none;color:#b9ad8c}
.big{font-size:30px;text-align:center}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:9px;line-height:1.6;text-align:left}
.crit li{display:flex;gap:8px}
.crit .ok{color:#1d7a2c} .crit .no{color:var(--blood)}
.row{display:flex;gap:8px}
@media (max-height:420px){.panel{padding:10px 12px;gap:7px} h1{font-size:14px} p{font-size:8px;line-height:1.6} .btn{padding:6px 8px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Sun Crown Legion game"></canvas>

<div id="spells" hidden>
  <button class="sp" id="sp0" type="button" title="Fireball (key 1)"><b>FIREBALL</b><i>40 mana</i></button>
  <button class="sp" id="sp1" type="button" title="Frost (key 2)"><b>FROST</b><i>35 mana</i></button>
  <button class="sp" id="sp2" type="button" title="Rally (key 3)"><b>RALLY</b><i>50 mana</i></button>
</div>

<div class="ov" id="menu">
  <div class="panel">
    <h1>SUN CROWN LEGION</h1>
    <p>The goblins stole the Sun Crown. Lead your legion down the meadow road and take it back before dark.</p>
    <div class="lv" id="levels"></div>
    <p>Drag left and right to steer. Blue gates grow the army, red gates shrink it, class gates train archers, shield bearers and wizards. Tap a spell when you have the mana.</p>
  </div>
</div>

<div class="ov" id="end" hidden>
  <div class="panel">
    <h2 id="endT"></h2>
    <div class="st big" id="endS"></div>
    <ul class="crit" id="endC"></ul>
    <button class="btn c" id="bNext" type="button">Next level</button>
    <div class="row">
      <button class="btn c alt" id="bRetry" type="button">Retry</button>
      <button class="btn c alt" id="bMenu" type="button">Levels</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const C=$('c'),X=C.getContext('2d');
const RH=70;                       // road half-width in world units
let S=1,W=200,H=300,AY=220,DPR=1;  // pixel scale, view size in art pixels, army screen row
const FONT='"Press Start 2P","Courier New",monospace';

/* ---------- levels ---------- */
const LEVELS=[
 {name:'MEADOW ROAD',sub:"Smash Captain Grub's wall",start:10,target:40,sunset:75,seq:'GTSGCEMLGRDGEG',boss:{k:'grub',name:'CAPTAIN GRUB',hp:450}},
 {name:'GOBLIN FORTRESS',sub:'Storm the fortress gate',start:15,target:70,sunset:85,seq:'GCSLGEMRGCETSGLEDG',boss:{k:'fort',name:'FORTRESS GATE',hp:1000}},
 {name:'THE OGRE CHIEF',sub:'Win back the Sun Crown',start:20,target:100,sunset:100,seq:'GCRGESMGLECTGREDSGEMG',boss:{k:'ogre',name:'OGRE CHIEF',hp:1800}}
];
LEVELS.forEach(L=>L.len=170+L.seq.length*115);
const CLS={a:{n:'ARCHER',c:'#2e9b4a'},s:{n:'SHIELD',c:'#d88a20'},w:{n:'WIZARD',c:'#8a4ae0'}};
const COST=[40,35,50];

/* ---------- save ---------- */
let best=[-1,-1,-1];
try{const v=JSON.parse(localStorage.getItem('suncrown')||'null');if(Array.isArray(v)&&v.length===3)best=v.map(n=>+n);}catch(e){}
function save(){try{localStorage.setItem('suncrown',JSON.stringify(best));}catch(e){}}

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hs(a,b){const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n);}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- sound ---------- */
let AC=null;
function audioOn(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function snd(f,d,type,v,slide){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||.04,t);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}

/* ---------- sprites ---------- */
function mk(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
  x.fillStyle='#1a1c2c';
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(rows[j][i]!=='.'){x.fillRect(i,j+1,3,1);x.fillRect(i+1,j,1,3);}
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch!=='.'){x.fillStyle=pal[ch];x.fillRect(i+1,j+1,1,1);}}
  return c;}
function two(rows,legA,legB,pal){return[mk(rows.concat([legA]),pal),mk(rows.concat([legB]),pal)];}
const base={s:'#f4c9a0',L:'#3a2a20',w:'#e8eef4',g:'#f2c230',b:'#8a5a2a',o:'#7ef0ff',t:'#8a5a2a',S:'#aab4c4'};
const P=(H2,B)=>Object.assign({},base,{H:H2,B:B});
const SPR={
 k:two(['..HHH....','.HHHHH.w.','.HsssH.w.','..sss..w.','.BBBBB.w.','sBBBBBsg.','.BBBBB...'],'.L...L...','..L.L....',P('#b8c4d4','#3a6ee0')),
 a:two(['..HHH....','.HHHHH.b.','.HsssH..b','..sss...b','.BBBBB..b','sBBBBBsb.','.BBBBB...'],'.L...L...','..L.L....',P('#2e8b4a','#58c060')),
 s:two(['..HHH....','.HHHHH...','.HsssH...','..sss....','.BSSSB...','sSSgSSs..','.BSSSB...'],'.L...L...','..L.L....',P('#f2c230','#d0603a')),
 w:two(['...H.....','..HHH..o.','.HHHHH.t.','..sss..t.','.BBBBB.t.','sBBBBBst.','.BBBBB.t.'],'.L...L...','..L.L....',P('#7a3ed0','#a060e8'))
};
const GOB=['g.ggg.g','ggggggg','.gegeg.','..ggg..','.nnnnn.','gnnnnng'];
const SG={day:two(GOB,'.n...n.','..n.n..',{g:'#5aa832',e:'#1a1c2c',n:'#7a4a2a'}),
          night:two(GOB,'.n...n.','..n.n..',{g:'#4a8a3a',e:'#ff3a30',n:'#5a3a2a'}),
          ice:two(GOB,'.n...n.','.n...n.',{g:'#a8e4f4',e:'#3a6ea0',n:'#6aa0c8'})};
const OG=['...oooooo...','..oooooooo..','..owkoowko..','..oooooooo..','..otooooto..','...oooooo...','.oonnnnnnoo.','ooonnnnnnooo','oo.nnnnnn.oo','oo.nnbbnn.oo','...oo..oo...','..ooo..ooo..'];
const SOG=['#7a9a4a','#c08a3a','#d04a3a'].map(o=>mk(OG,{o:o,w:'#fff',k:'#1a1c2c',t:'#f4e8c8',n:'#6a4426',b:'#f2c230'}));

/* ---------- drawing primitives ---------- */
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,h);}
function circ(x,y,r,c){X.fillStyle=c;x=Math.round(x);y=Math.round(y);for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j)+.3);X.fillRect(x-w,y+j,2*w+1,1);}}
function spr(c,x,y,k){k=k||1;X.drawImage(c,Math.round(x-c.width*k/2),Math.round(y-c.height*k),c.width*k,c.height*k);}
function txt(s,x,y,c,al){X.font='8px '+FONT;X.textBaseline='top';X.textAlign=al||'center';x=Math.round(x);y=Math.round(y);
  X.fillStyle='#1a1c2c';X.fillText(s,x+1,y+1);X.fillStyle=c||'#fff';X.fillText(s,x,y);}

/* ---------- game state ---------- */
let G=null,keys={},drag=null;
function build(L,li){const r=rng(li*977+13),o=[];let ei=0;
  L.seq.split('').forEach(function(ch,i){const d=170+i*115;
    if(ch==='G'){
      const good=()=>{const q=r();return q<.36?{t:'x',v:2}:q<.42?{t:'x',v:3}:{t:'+',v:6+li*4+Math.floor(r()*10)};};
      const bad=()=>r()<.6?{t:'-',v:3+li*3+Math.floor(r()*8)}:{t:'/',v:2};
      let a=good(),b=r()<.7?bad():good();if(r()<.5){const t=a;a=b;b=t;}
      o.push({k:'gate',d:d,L:a,R:b});
    }else if(ch==='C'){const c=['a','s','w'],i1=Math.floor(r()*3),i2=(i1+1+Math.floor(r()*2))%3;o.push({k:'cgate',d:d,L:c[i1],R:c[i2]});}
    else if(ch==='S'){const z=[[-70,14],[-14,70],[-38,38]][Math.floor(r()*3)];o.push({k:'spike',d:d,x0:z[0],x1:z[1]});}
    else if(ch==='L'){const s=r()<.5?-1:1;o.push({k:'log',d:d,x:60*s,vx:-48*s});}
    else if(ch==='R'){const skip=Math.floor(r()*3);[-46,0,46].forEach(function(x,j){if(j!==skip)o.push({k:'rock',d:d+j*6,x:x});});}
    else if(ch==='E'){const g=8+li*7+ei*4;ei++;o.push({k:'gob',d:d,g:g,g0:g});}
    else o.push({k:'pick',d:d,x:Math.floor(r()*100-50),t:ch});
  });return o;}
function newGame(li,demo){const L=LEVELS[li];
  G={li:li,L:L,t:0,d:0,x:0,n:demo?28:L.start,cls:{a:demo?6:0,s:demo?6:0,w:demo?4:0},mana:30,lost:0,state:demo?'demo':'run',
     objs:demo?[]:build(L,li),fx:[],ft:[],drum:0,frost:0,rally:0,lossAcc:0,shake:0,boss:null,units:[],dirty:true,ban:null,et:0,nightSaid:false,shot:0,fight:false};
  if(!demo)banner(L.name,L.sub,2.4);
  $('spells').hidden=!!demo;$('menu').hidden=!demo;$('end').hidden=true;}
function banner(a,b,t){G.ban={a:a,b:b||'',t:t||2};}
function armyR(){return Math.min(16,3+1.7*Math.sqrt(Math.min(G.n,80)));}
function shieldMul(){return G.n?1-.6*Math.min(1,G.cls.s*2.5/G.n):1;}
function setN(v){v=clamp(Math.round(v),0,999);if(v<G.n){const q=v/G.n;for(const k in G.cls)G.cls[k]=Math.floor(G.cls[k]*q);}G.n=v;G.dirty=true;}
function float(s,c,dy){G.ft.push({s:s,c:c,x:W/2+G.x,y:AY-armyR()-22+(dy||0),t:1.1});}
function puff(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||40)*(.3+Math.random());G.fx.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.35+Math.random()*.35,c:c});}}
function lose(k){if(G.rally>0||(G.state!=='run'&&G.state!=='boss'))return;
  k=Math.min(G.n,Math.max(1,Math.round(k)));setN(G.n-k);G.lost+=k;G.shake=.25;
  puff(W/2+G.x,AY,'#e8eef4',Math.min(14,k+3),50);float('-'+k,'#ff6a5a');snd(160,.18,'sawtooth',.05,-90);
  if(G.n<=0){G.state='dead';G.et=0;snd(110,.7,'sawtooth',.06,-80);}}
function gain(k,label){setN(G.n+k);float(label||('+'+k),'#8af07a');snd(520,.1,'square',.035,260);}

function cast(i){if(!G||(G.state!=='run'&&G.state!=='boss'))return;if(G.mana<COST[i])return;
  const w=G.cls.w;
  if(i===0){
    if(G.state==='boss'){const B=G.boss;if(B.adds>0){B.adds=0;float('GOBLINS BURNED','#ffb040',-10);}B.hp-=70+w*5;puff(W/2,sy(G.L.len+bossD())-10,'#ff8a30',26,90);}
    else{let tg=null;for(const o of G.objs){if(o.k==='gob'&&!o.done&&o.d-G.d<170&&o.d>G.d){tg=o;break;}}
      if(!tg){float('NO TARGET','#ffd0a0');return;}
      tg.g-=20+w*1.5;puff(W/2,sy(tg.d)-6,'#ff8a30',26,90);}
    G.shake=.3;snd(220,.35,'sawtooth',.06,-150);
  }else if(i===1){G.frost=4+Math.min(2,w*.05);float('FROST!','#9ae4ff');snd(900,.4,'triangle',.05,-500);}
  else{const k=Math.max(6,Math.round(G.n*.25));G.rally=2.5;gain(k,'RALLY +'+k);snd(392,.12,'square',.04);snd(523,.25,'square',.04,130);}
  G.mana-=COST[i];}

/* ---------- update ---------- */
function bossD(){return Math.min(125,AY-62);}
function update(dt){
  G.t+=dt;if(G.ban){G.ban.t-=dt;if(G.ban.t<=0)G.ban=null;}
  G.shake=Math.max(0,G.shake-dt);
  for(const p of G.fx){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}G.fx=G.fx.filter(p=>p.t>0);
  for(const f of G.ft){f.t-=dt;f.y-=18*dt;}G.ft=G.ft.filter(f=>f.t>0);
  if(G.state==='demo'){G.d+=40*dt;G.x=Math.sin(G.t*.7)*30;return;}
  if(G.state==='dead'||G.state==='win'){G.et+=dt;if(G.et>(G.state==='win'?2.4:1.3)&&$('end').hidden)showEnd();return;}

  const L=G.L,night=G.t>L.sunset,str=night?1.6:1;
  if(night&&!G.nightSaid){G.nightSaid=true;banner('SUNSET!','Goblins grow stronger',2.2);snd(180,.6,'triangle',.05,-60);}
  G.drum=Math.max(0,G.drum-dt);G.frost=Math.max(0,G.frost-dt);G.rally=Math.max(0,G.rally-dt);
  G.mana=Math.min(100,G.mana+(4+Math.min(6,G.cls.w*.15))*dt);
  const kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
  G.x=clamp(G.x+kx*120*dt,-RH+8,RH-8);
  const pw=G.drum>0?1.5:1,r=armyR();

  if(G.state==='run'){
    let stop=Infinity;G.fight=false;
    for(const o of G.objs){if(o.done)continue;const od=o.d-G.d;if(od>260)break;
      if(o.k==='gob'){
        if(od<120&&G.cls.a>0){o.g-=G.cls.a*.6*pw*dt;G.shot-=dt;if(G.shot<=0){G.shot=.1;G.fx.push({x:W/2+G.x+(Math.random()-.5)*r*2,y:AY-6,vx:0,vy:-260,t:Math.max(.05,(od-8)/260),c:'#f4e8c8'});}}
        if(od<=11){G.fight=true;const kill=(20+G.n*.5)*pw*dt;o.g-=kill;if(G.frost<=0)G.lossAcc+=kill*.5*str*shieldMul();}
        if(o.g<=0){o.done=true;puff(W/2,sy(o.d)-4,'#5aa832',22,70);snd(300,.12,'square',.04,200);}
        else stop=Math.min(stop,o.d-10);
      }else if(o.k==='log'){
        if(G.frost<=0){o.x+=o.vx*dt;if(o.x>60||o.x<-60){o.vx=-o.vx;o.x=clamp(o.x,-60,60);}}
        if(!o.hit&&Math.abs(od)<5&&Math.abs(o.x-G.x)<r+13){o.hit=true;lose(Math.max(2,G.n*.15)*shieldMul());}
        if(od<-30)o.done=true;
      }else if(od<=0){o.done=true;
        if(o.k==='gate'){const g=G.x<0?o.L:o.R;o.took=G.x<0?'L':'R';
          if(g.t==='+')gain(g.v);else if(g.t==='x')gain(G.n*(g.v-1),'x'+g.v);
          else{const nv=Math.max(1,g.t==='-'?G.n-g.v:Math.ceil(G.n/g.v));setN(nv);float(g.t+g.v,'#ff6a5a');snd(200,.15,'square',.04,-80);}
        }else if(o.k==='cgate'){const c=G.x<0?o.L:o.R;o.took=G.x<0?'L':'R';const sw=G.n-G.cls.a-G.cls.s-G.cls.w;
          let k=Math.min(sw,Math.max(4,Math.round(G.n*.35)));
          if(k<=0){k=3;setN(G.n+3);}G.cls[c]+=k;G.dirty=true;float('+'+k+' '+CLS[c].n+'S',CLS[c].c==='#8a4ae0'?'#c8a0ff':'#ffe08a');snd(660,.15,'triangle',.05,220);
        }else if(o.k==='spike'){if(G.x+r*.8>o.x0&&G.x-r*.8<o.x1)lose(Math.max(2,G.n*.15)*shieldMul());}
        else if(o.k==='rock'){G.shake=Math.max(G.shake,.2);puff(W/2+o.x,AY,'#8a8a94',10,60);snd(90,.2,'square',.06,-40);
          if(Math.abs(o.x-G.x)<r+9)lose(Math.max(2,G.n*.18)*shieldMul());}
        else if(o.k==='pick'&&Math.abs(o.x-G.x)<r+11){
          if(o.t==='T')gain(8+G.li*2,'TENT +'+(8+G.li*2));
          else if(o.t==='D'){G.drum=7;float('WAR DRUM!','#ffe08a');snd(120,.12,'square',.07);snd(120,.12,'square',.07);}

        }

    }
    if(G.state==='run'){G.d=Math.min(G.d+55*(G.drum>0?1.25:1)*dt,stop);
      if(G.d>=L.len){G.d=L.len;G.state='boss';G.boss={hp:L.boss.hp,max:L.boss.hp,next:2.2,zones:[],adds:0,sum:0};banner(L.boss.name,'',1.8);snd(140,.5,'sawtooth',.05,60);}}
  }else if(G.state==='boss'){

        if(k==='ogre'){if(fr>.66){iv=2.2;te=1.2;}else if(fr>.33){pat='thirds';iv=2;te=1.1;}else{pat='quarters';iv=1.7;te=.95;}}

      const by=sy(L.len+bossD());puff(W/2,by-14,'#ffb040',40,120);puff(W/2,by-14,'#fff',20,80);G.shake=.6;

}

/* ---------- screens ---------- */
function stars(n){let s='';for(let i=0;i<3;i++)s+=i<n?'★':'<s>★</s>';return s;}
function buildMenu(){const box=$('levels');box.innerHTML='';
  LEVELS.forEach(function(L,i){const b=document.createElement('button');b.type='button';b.className='btn';b.id='lv'+i;
    const open=i===0||best[i-1]>=0;b.disabled=!open;
    b.innerHTML='<span>'+(i+1)+'. '+L.name+'</span><span class="st">'+(open?stars(Math.max(0,best[i])):'locked')+'</span>';
    if(!open)b.querySelector('.st').style.cssText='font:8px '+FONT.replace(/"/g,"'")+';letter-spacing:0;color:inherit';
    b.addEventListener('click',function(){audioOn();newGame(i,false);});box.appendChild(b);});}
function showMenu(){buildMenu();newGame(0,true);}
function showEnd(){const win=G.state==='win',L=G.L;$('spells').hidden=true;$('end').hidden=false;
  $('endT').textContent=win?(G.li===2?'THE SUN CROWN IS YOURS':'VICTORY'):'YOUR LEGION HAS FALLEN';
  $('endS').innerHTML=win?stars(G.stars.filter(Boolean).length):'';$('endS').hidden=!win;
  const c=$('endC');c.innerHTML='';c.hidden=!win;
  if(win){[['Army of '+L.target+' or more (yours: '+G.n+')',G.stars[0]],['Beat the sunset ('+Math.round(G.t)+'s of '+L.sunset+'s)',G.stars[1]],['No soldiers lost (lost: '+G.lost+')',G.stars[2]]]
    .forEach(function(r){const li=document.createElement('li');li.innerHTML='<span class="'+(r[1]?'ok':'no')+'">'+(r[1]?'[x]':'[ ]')+'</span><span></span>';li.lastChild.textContent=r[0];c.appendChild(li);});}
  $('bNext').hidden=!(win&&G.li<2);}
$('bNext').addEventListener('click',function(){newGame(G.li+1,false);});
$('bRetry').addEventListener('click',function(){newGame(G.li,false);});
$('bMenu').addEventListener('click',showMenu);
for(let i=0;i<3;i++)$('sp'+i).addEventListener('click',function(){cast(i);});

/* ---------- input ---------- */
C.addEventListener('pointerdown',function(e){drag={id:e.pointerId,x:e.clientX};try{C.setPointerCapture(e.pointerId);}catch(_){}} );
C.addEventListener('pointermove',function(e){if(!drag||drag.id!==e.pointerId||!G||(G.state!=='run'&&G.state!=='boss'))return;
  G.x=clamp(G.x+(e.clientX-drag.x)*DPR/S*1.15,-RH+8,RH-8);drag.x=e.clientX;});
function up(e){if(drag&&drag.id===e.pointerId)drag=null;}
C.addEventListener('pointerup',up);C.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key==='1')cast(0);if(e.key==='2')cast(1);if(e.key==='3')cast(2);});
window.addEventListener('keyup',function(e){keys[e.key]=false;});
window.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---------- loop ---------- */
function resize(){DPR=window.devicePixelRatio||1;const cw=Math.max(1,Math.round(C.clientWidth*DPR)),ch=Math.max(1,Math.round(C.clientHeight*DPR));
  if(C.width!==cw||C.height!==ch){C.width=cw;C.height=ch;}
  S=Math.max(1,Math.floor(Math.min(cw/190,ch/230)));W=Math.ceil(cw/S);H=Math.ceil(ch/S);AY=Math.floor(H*(W>H?.8:.72));}
let last=0;
function frame(now){resize();const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(frame);}
showMenu();
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(function(){});
requestAnimationFrame(function(t){last=t;frame(t);});
})();
</script>
</body>
</html>
