<body>
  <div id="app"></div>
  <script id="bb-engine">
  // ───────────────────────── 물리 엔진 — 화면 없이 돈다 (같은 입력이면 같은 결과)
  // 단위는 칸(타일 1칸 = 1). y 는 아래로 갈수록 커진다. 1/120초씩 고정 걸음으로 움직여 화면 주사율과 상관없이 같다
  (function (root) {
    const G = 28;
    const P = {
      G, R: 0.3, DT: 1 / 120,
      V_BOUNCE: Math.sqrt(2 * G * 1.7), // 보통 바닥 — 1.7칸 튐 (1칸 턱은 오르고 2칸 벽은 못 오름)
      V_SPRING: Math.sqrt(2 * G * 4.3), // 트램펄린 — 4.3칸
      V_MAT: Math.sqrt(2 * G * 0.75), // 요가 매트 — 0.75칸 (낮은 천장 밑을 지날 때)
      V_KICK: Math.sqrt(2 * G * 1.9), // 벽차기 — 벽에서 1.9칸 더
      VMAX: 5, ACC: 22, BRAKE: 48, DRAG: 2.5, BOTH: 14,
      DASH: 9.5, DASH_OUT: 1.5,
      KICK_VX: 4.2, KICK_WIN: 0.12, KICK_MIN: 1.5,
      MAX_FALL: 16, HAZ_R: 0.25, WALL_REST: 0.35,
    };
    const SOLID = { "#": 1, "=": 1, T: 1, B: 1, M: 1, R: 1, L: 1 };
    // 압정 — 칸 안에서 닿으면 아픈 네모 [x0, y0, x1, y1] (칸보다 조금 작게 잡아 억울하지 않게)
    const HAZ = { "^": [0.14, 0.5, 0.86, 1], v: [0.14, 0, 0.86, 0.5], ">": [0, 0.14, 0.5, 0.86], "<": [0.5, 0.14, 1, 0.86] };

    function parse(def) {
      const rows = def.map;
      const h = rows.length, w = Math.max(...rows.map((r) => r.length));
      const tiles = new Array(w * h).fill(".");
      let start = { x: 1.5, y: 1.5 }, door = null;
      const cps = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let c = rows[y][x] || ".";
          if (c === "S") { start = { x: x + 0.5, y: y + 0.5 }; c = "."; }
          else if (c === "C") cps.push({ x, y });
          else if (c === "D") door = { x, y };
          tiles[y * w + x] = c;
        }
      }
      return { ...def, w, h, tiles, start, door, cps };
    }

    function create(lv) {
      const w = { lv, broken: new Set(), cpIndex: -1, cp: { ...lv.start }, lit: new Set(), t: 0, bounces: 0, falls: 0, kicks: 0 };
      place(w);
      return w;
    }
    // 체크포인트(처음엔 출발점)에 공을 놓는다 — 상자도 모두 되살린다
    function place(w) {
      w.x = w.px = w.cp.x; w.y = w.py = w.cp.y;
      w.vx = 0; w.vy = 0; w.dash = 0;
      w.state = "live";
      w.inDir = 0; w.inSince = -9; w.wallT = -9; w.wallSide = 0; w.kickSide = 0; w.kickBuf = -9;
      w.inL = false; w.inR = false;
      w.broken.clear();
    }

    function tileAt(w, tx, ty) {
      const lv = w.lv;
      if (tx < 0 || tx >= lv.w || ty < 0) return "#";
      if (ty >= lv.h) return ".";
      const i = ty * lv.w + tx;
      const c = lv.tiles[i];
      return c === "B" && w.broken.has(i) ? "." : c;
    }
    const solid = (w, tx, ty) => SOLID[tileAt(w, tx, ty)] === 1;
    const toward = (v, to, d) => (v < to ? Math.min(to, v + d) : Math.max(to, v - d));

    function step(w, inp, ev) {
      if (w.state !== "live") return;
      const dt = P.DT;
      w.t += dt;
      w.px = w.x; w.py = w.y;
      const L = !!inp.l, Rt = !!inp.r;
      w.inL = L; w.inR = Rt;
      const dir = L === Rt ? 0 : Rt ? 1 : -1;
      if (dir !== w.inDir) {
        w.inDir = dir;
        w.inSince = w.t;
        w.kickBuf = -9;
        // 벽에 부딪힌 바로 뒤에 반대쪽을 누르면 벽차기
        if (dir && dir === -w.wallSide && w.t - w.wallT <= P.KICK_WIN) kick(w, ev);
        // 벽에 닿기 바로 전에 반대쪽을 눌렀을 때 — 벽이 코앞이면 브레이크를 잠깐 미루고 그대로 굴러가 닿는 순간 벽차기
        else if (dir && !w.dash && w.vx * dir <= -P.KICK_MIN && w.kickSide !== -dir && wallNear(w, -dir, Math.abs(w.vx) * P.KICK_WIN + 0.02)) w.kickBuf = w.t;
      }
      // 송풍 — 반대쪽을 누르면 바람에서 내린다
      if (w.dash && ((w.dash > 0 && L) || (w.dash < 0 && Rt))) endDash(w, ev, "input");
      if (!w.dash) {
        if (L && Rt) w.vx = toward(w.vx, 0, P.BOTH * dt); // 둘 다 — 살살 브레이크
        else if (dir) {
          if (w.vx * dir < 0) { if (w.t - w.kickBuf > P.KICK_WIN) w.vx += dir * P.BRAKE * dt; } // 반대쪽 — 빨리 선다 (벽차기를 미리 누른 동안은 빼고)
          else if (Math.abs(w.vx) <= P.VMAX) w.vx = Math.max(-P.VMAX, Math.min(P.VMAX, w.vx + dir * P.ACC * dt));
          else w.vx = toward(w.vx, dir * P.VMAX, P.DRAG * dt);
        } else w.vx = toward(w.vx, 0, P.DRAG * dt); // 손을 떼도 굴러가던 힘은 천천히 줄어든다
        w.vy = Math.min(w.vy + P.G * dt, P.MAX_FALL);
      }
      moveX(w, dt, ev);
      if (w.state !== "live") return;
      if (!w.dash) moveY(w, dt, ev);
      afterMove(w, ev);
    }

    function moveX(w, dt, ev) {
      const v = w.dash ? w.dash * P.DASH : w.vx;
      if (!v) return;
      const r = P.R;

  // 어느 응답이 늦게 그려져도 지금 고른 코스 순위가 보이게 한다 (이 페이지 안에서만 — 다른 게임은 그대로)
  (function () {
    const get = HKApi.playLeaderboard, last = {};
    HKApi.playLeaderboard = (game, period, variant) => {
      const k = `${game}|${period || "today"}`;
      const p = get(game, period, variant);
      last[k] = p;
      const settle = (mine) => mine.then(
        (d) => (last[k] === mine ? d : settle(last[k])),
        (e) => { if (last[k] === mine) throw e; return settle(last[k]); }
      );
      return settle(p);
    };
  })();
  HKPlay.mountGame({
    key: "bounce",
    setup(stage, ctx) {
      const E = window.BBEngine, P = E.P, STAGES = window.BB_STAGES, N = STAGES.length;
      const LEVELS = STAGES.map((s) => E.parse(s));

      // ───────────────────────── 내 기록 (이 기기에만)
      const SKEY = "hk-bounce-v1";
      function loadStore() {

        o.cleared = Math.max(0, Math.min(N, Number(o.cleared) || 0));
        o.stage = o.stage && typeof o.stage === "object" ? o.stage : {};

        o.courseBest = o.courseBest && typeof o.courseBest === "object" ? o.courseBest : {};
        return o;
      }
      function saveStore() { try { localStorage.setItem(SKEY, JSON.stringify(store)); } catch (_) { /* 저장 못 해도 게임은 계속 */ } }
      let store = loadStore();
      const better = (a, b) => !b || a.s < b.s || (a.s === b.s && a.t < b.t); // 연습 스테이지 기록 — 점수가 같으면 시간이 짧은 쪽

      // ───────────────────────── 코스 — 10스테이지씩. 정식 도전은 코스 하나를 이어서 완주한 한 판이고, 순위도 코스마다 따로
      //  1코스는 예전 정식 도전(1~10스테이지)과 똑같아서 기존 순위표(갈래 없음)를 그대로 쓰고, 2·3코스는 갈래 c2 · c3
      const COURSES = [
        { no: 1, from: 0, to: 9, variant: "", name: "처음 가는 길" },
        { no: 2, from: 10, to: 19, variant: "c2", name: "돌아가는 길" },

      const TEST_UNLOCK = !!(window.HKLunch && HKLunch.isLocal() && (() => { try { return localStorage.getItem("hk-bounce-unlock") === "1"; } catch (_) { return false; } })());
      const openUpTo = () => (TEST_UNLOCK ? N : Math.min(N, store.cleared + 1)); // 통과한 스테이지 + 바로 다음 스테이지
      const courseOpen = (c) => TEST_UNLOCK || store.cleared >= c.from;
      const courseBest = (c) => (c.no === 1 ? store.best : store.courseBest[c.no]) || null;
      let course = COURSES.find((c) => c.no === Number(store.course) && courseOpen(c)) || COURSES[0]; // 고른 코스 (정식 도전)
      let pickCourse = courseOf(Math.min(N - 1, store.cleared)); // 스테이지 연습에서 보고 있는 코스

      // ───────────────────────── 화면 뼈대
      stage.innerHTML = `<div class="bb">

      </div>`;
      HKUI.refreshIcons(stage);

      // ───────────────────────── 테마 (스테이지마다 색과 배경 소품)
      const THEMES = {
        office: { sky: ["#edf3f9", "#dce7f2"], far: "#cddbea", block: ["#7b8ea8", "#61748f", "#a8b8cc"], desk: ["#e2c193", "#c49a68", "#8a6640"], ceil: "#55667e", deco: "office" },

        mail: { sky: ["#f5eddf", "#e8d9bf"], far: "#ddcaa7", block: ["#8e7659", "#725d45", "#ad9477"], desk: ["#d9b98c", "#b58f5f", "#7d5f3c"], ceil: "#6c5843", deco: "mail" },
        hall: { sky: ["#e9f4ee", "#d6e9df"], far: "#c4ddd0", block: ["#6e9283", "#56786b", "#94b6a7"], desk: ["#d8c4a6", "#b9a07c", "#7d6a4f"], ceil: "#4d6b5f", deco: "hall" },
        machine: { sky: ["#1d2838", "#2a3a51"], far: "#33465f", block: ["#6b7f99", "#4d5f78", "#8ea1b9"], desk: ["#8ea1b9", "#6b7f99", "#3b4a5f"], ceil: "#141c28", deco: "machine", dark: true },
        stairs: { sky: ["#eceff3", "#d9dee5"], far: "#c9d0d9", block: ["#9aa4b0", "#7d8794", "#bcc4ce"], desk: ["#c9a46e", "#a47f4e", "#6d5232"], ceil: "#6b7480", deco: "stairs" },
        gym: { sky: ["#2a2523", "#3b322c"], far: "#4a3d34", block: ["#50555f", "#3a3e46", "#6d737e"], desk: ["#f59e0b", "#d97706", "#7c4a03"], ceil: "#1a1715", deco: "gym", dark: true },
        storage: { sky: ["#382e26", "#4a3c30"], far: "#57483a", block: ["#7d6852", "#614f3e", "#9a836c"], desk: ["#b08d62", "#8c6c45", "#5c4529"], ceil: "#231c16", deco: "storage", dark: true },
        roof: { sky: ["#86ccf5", "#e6f5ff"], far: "#b6daef", block: ["#a0785a", "#7e5d44", "#c19b7b"], desk: ["#d9b98c", "#b58f5f", "#7d5f3c"], grass: "#6abf69", ceil: null, deco: "roof", open: true },
        lobby: { sky: ["#e2f5ef", "#f5fcf9"], far: "#c9eadf", block: ["#5aa38f", "#438472", "#87c6b4"], desk: ["#f4e7d3", "#dcc8a9", "#9b8463"], ceil: "#2f6b5c", deco: "lobby" },
      };

      // ───────────────────────── 상태

      let pausedFrom = "play";
      let si = 0; // 지금 스테이지

      let camX = 0, camY = 0, lookX = 0;
      let W = 360, H = 480, dpr = 1, TS = 32, viewW = 11, viewH = 14;
      let padCoverPx = 0; // 판 아래를 가리는 버튼 높이 (눕힌 휴대폰)
      let acc = 0, last = performance.now(), clock = 0;
      const held = new Set(); // 지금 누르고 있는 키 (e.code)
      const touch = { l: false, r: false };

      const sfx = (n, a) => ctx.sfx(n, a);
      const backTo = () => (world.cpIndex >= 0 ? "정수기로" : "처음 자리로"); // R 두 번·일시정지에서 돌아갈 곳
      const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
      const stageScore = (b, f) => b + f * FALL_COST;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      // ───────────────────────── 크기
      function resize() {

        lookX = 0;

        const want = world.dash ? world.dash * Math.min(3, viewW * 0.22) : clamp(world.vx * 0.32, -1.6, 1.6);
        lookX += (want - lookX) * Math.min(1, dt * 2.2);
        const tx = camTarget(bx, by);
        camX += (tx - camX) * Math.min(1, dt * 7);
        // 위아래는 가운데 띠를 벗어날 때만 따라간다 (통통 튈 때마다 화면이 흔들리지 않게)

        else if (by > botBand) ty = by - vh * 0.66;
        ty = clamp(ty, a, b);
        camY += (ty - camY) * Math.min(1, dt * 5);
      }

      // ───────────────────────── HUD
      function runTotals() {
        let b = 0, f = 0, t = 0;

        hud.name.textContent = STAGES[si].name;
        let b = world.bounces, f = world.falls, t = stageTime;
        if (mode === "run") { const r = runTotals(); b += r.b; f += r.f; t += r.t; }
        hud.score.textContent = stageScore(b, f).toLocaleString("ko-KR");
        hud.detail.textContent = `튐 ${b} · 떨어짐 ${f}`;
        hud.time.textContent = fmtTime(t);
      }

      // ───────────────────────── 입력
      const input = () => ({ l: held.has("ArrowLeft") || held.has("KeyA") || touch.l, r: held.has("ArrowRight") || held.has("KeyD") || touch.r });
      const LEFT = { ArrowLeft: 1, KeyA: 1 }, RIGHT = { ArrowRight: 1, KeyD: 1 };
      function typing(e) {
        const t = e.target;
        return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
      }
      window.addEventListener("keydown", (e) => {
        if (typing(e) || document.querySelector(".hk-dialog__overlay")) return;
        if (LEFT[e.code] || RIGHT[e.code]) { held.add(e.code); if (state === "play" || state === "dying") e.preventDefault(); }
        else if (e.code === "Space") {
          if (state === "play" || state === "dying") { e.preventDefault(); if (!e.repeat) pause(); }
        } else if (e.code === "KeyR" && !e.repeat && state === "play") {
          const now = performance.now() / 1000;
          if (now - lastR < 1.6) { lastR = -9; giveUp(); }
          else { lastR = now; addFloat(world.x, world.y - 1.1, `R 한 번 더 = ${backTo()} (+${FALL_COST})`, "#475569", 1.6); }
        } else if (e.code === "ArrowUp" || e.code === "ArrowDown") {
          if (state === "play") e.preventDefault();
        }
      });
      window.addEventListener("keyup", (e) => {
        held.delete(e.code);
      });
      window.addEventListener("blur", () => { held.clear(); clearPad(); pause(); });
      document.addEventListener("visibilitychange", () => { if (document.hidden) { held.clear(); clearPad(); pause(); } });

      // 휴대폰 — 두 버튼을 누르고 있기. 손가락을 미끄러뜨려 옆 버튼으로 옮겨도 된다
      const pad = $(".bb-pad");
      const padBtn = { l: $('[data-pad="l"]'), r: $('[data-pad="r"]') };
      const ptrs = new Map();
      const sideOf = (x) => { const r = pad.getBoundingClientRect(); return x < r.left + r.width / 2 ? "l" : "r"; };
      function syncPad() {
        const v = [...ptrs.values()];
        touch.l = v.includes("l"); touch.r = v.includes("r");
        padBtn.l.classList.toggle("is-down", touch.l);
        padBtn.r.classList.toggle("is-down", touch.r);
      }
      function clearPad() { ptrs.clear(); syncPad(); }
      pad.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (!touchUi) { touchUi = true; root.classList.add("is-touch"); }
        try { pad.setPointerCapture(e.pointerId); } catch (_) { /* 없어도 동작 */ }
        ptrs.set(e.pointerId, sideOf(e.clientX));
        syncPad();
      });
      pad.addEventListener("pointermove", (e) => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, sideOf(e.clientX)); syncPad(); } });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => pad.addEventListener(t, (e) => { ptrs.delete(e.pointerId); syncPad(); }));
      pad.addEventListener("contextmenu", (e) => e.preventDefault());
      // 판을 처음 손가락으로 만지면 버튼을 보인다 (터치 노트북 등)
      board.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch" && !touchUi) { touchUi = true; root.classList.add("is-touch"); resize(); }
      });
      document.documentElement.style.overscrollBehaviorY = "contain";
      document.body.style.overscrollBehaviorY = "contain";
      $('[data-act="pause"]').addEventListener("click", (e) => { e.currentTarget.blur(); if (state === "paused") resume(); else pause(); });

      // ───────────────────────── 효과
      function addFloat(x, y, text, color = "#be123c", life = 1.1) { floats.push({ x, y, text, color, t: 0, life }); }
      function burst(x, y, n, colors, speed = 4, size = 0.08, life = 0.6, grav = 10) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.8);
          particles.push({ kind: "dot", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, t: 0, life: life * (0.7 + Math.random() * 0.6), c: colors[i % colors.length], s: size * (0.7 + Math.random() * 0.7), g: grav });
        }
      }
      function dust(x, y, n = 5, color = "rgba(255,255,255,.75)") {
        for (let i = 0; i < n; i++) {
          const d = i % 2 ? 1 : -1;
          particles.push({ kind: "puff", x: x + d * rand(0.05, 0.25), y: y - 0.05, vx: d * rand(0.6, 1.8), vy: -rand(0.1, 0.6), t: 0, life: rand(0.25, 0.45), c: color, s: rand(0.06, 0.12), g: 0 });
        }
      }
      function shards(tx, ty) {
        for (let i = 0; i < 7; i++) {
          particles.push({ kind: "shard", x: tx + rand(0.15, 0.85), y: ty + rand(0.1, 0.6), vx: rand(-2.6, 2.6), vy: rand(-4, -1), t: 0, life: rand(0.6, 0.95), c: i % 3 ? "#c79a5e" : "#e8c48f", s: rand(0.14, 0.26), g: 22, rot: rand(0, 6), vr: rand(-10, 10) });
        }
      }
      function ring(x, y, color, size = 0.6) { particles.push({ kind: "ring", x, y, vx: 0, vy: 0, t: 0, life: 0.35, c: color, s: size, g: 0 }); }

      // 물리 한 걸음에서 나온 일을 소리·효과로
      function handle(ev) {
        for (const e of ev) {
          if (e.type === "bounce") {
            squash = 1; squashKind = e.kind;
            if (e.kind === "spring") { sfx("jump"); tileAnim.set(e.ty * lv.w + e.tx, clock); ring(e.x, e.y, "rgba(56,189,248,.9)", 0.7); }
            else if (e.kind === "mat") { sfx("drop"); dust(e.x, e.y, 3, "rgba(196,181,253,.9)"); }
            else if (e.kind === "box") { sfx("hit"); shards(e.tx, e.ty); }
            else if (e.kind === "wind") { sfx("whoosh"); squash = 0; burst(e.x, e.y - 0.4, 6, ["rgba(186,230,253,.95)", "#ffffff"], 3, 0.06, 0.4, 0); }
            else { sfx("land"); dust(e.x, e.y, 4, th.dark ? "rgba(203,213,225,.55)" : "rgba(255,255,255,.85)"); }
            updateHud();
          } else if (e.type === "wall") {
            if (e.speed > 2.4) sfx("tap");
          } else if (e.type === "kick") {
            sfx("pop");
            burst(e.x, e.y, 10, ["#fde047", "#fb7185", "#ffffff"], 5, 0.07, 0.45, 4);
            addFloat(world.x, world.y - 0.9, "벽차기!", "#e11d48", 0.8);
          } else if (e.type === "ceil") {
            sfx("tap");
          } else if (e.type === "dashEnd") {
            if (e.reason === "input") ring(e.x, e.y, "rgba(186,230,253,.9)", 0.5);
          } else if (e.type === "checkpoint") {
            sfx("coin");
            burst(e.x, e.y - 0.4, 12, ["#38bdf8", "#7dd3fc", "#ffffff"], 3.5, 0.07, 0.6, 8);
            addFloat(e.x, e.y - 1.3, "저장!", "#0284c7", 1);
          } else if (e.type === "die") {
            state = "dying"; dieT = 0;
            sfx(e.cause === "tack" ? "hurt" : e.cause === "reset" ? "invalid" : "fail");
            burst(e.x, Math.min(e.y, lv.h - 0.5), 16, ["#f43f5e", "#fb7185", "#fecdd3"], 5.5, 0.09, 0.7, 12);
            addFloat(e.x, Math.min(e.y, lv.h - 0.6) - 0.6, `+${FALL_COST}`, "#e11d48", 1.1);
            updateHud();
          } else if (e.type === "clear") {
            state = "cleared"; clearT = 0;
            sfx(mode === "run" && run && si === run.course.to ? "win" : "success");
            burst(e.x, e.y - 0.4, 22, ["#fde047", "#34d399", "#60a5fa", "#fb7185"], 6, 0.08, 0.9, 9);
          }
        }
      }

      // ───────────────────────── 흐름
      function loadStage(i) {
        si = i;
        lv = LEVELS[i];
        th = THEMES[lv.theme];
        world = E.create(lv);
        stageTime = 0; acc = 0;
        particles = []; floats = []; tileAnim.clear();
        squash = 0; roll = 0;
        bgCache = null;
        board.style.background = th.sky[1];
        fitTiles();
        snapCamera();
        updateHud();
      }
      function respawn() {
        E.place(world);
        state = "play";
        acc = 0;
        squash = 0;
        ring(world.x, world.y, "rgba(244,63,94,.8)", 0.7);
        sfx("select");
      }
      function giveUp() {
        if (state !== "play") return;
        const ev = [];
        E.giveUp(world, ev);
        handle(ev);
      }

      // 카드를 띄울 때는 state 를 먼저 바꿔 둔다 — 멈춤 카드가 아니면 is-idle(일시정지 버튼 숨김)
      function showOver(html) { over.innerHTML = html; over.hidden = false; over.scrollTop = 0; root.classList.add("has-over"); root.classList.toggle("is-idle", state !== "paused"); HKUI.refreshIcons(over); requestAnimationFrame(fitCard); }
      // 카드가 판보다 길면(낮은 화면 · play.js 가 버튼을 덧붙인 뒤) 스테이지 표를 접어 버튼이 카드 안에 보이게
      function fitCard() {
        const c = over.querySelector(".bb-card");
        if (!c) return;
        c.classList.remove("is-tight");
        if (c.scrollHeight > c.clientHeight + 1) c.classList.add("is-tight");
      }
      new MutationObserver(() => requestAnimationFrame(fitCard)).observe(over, { childList: true, subtree: true });
      addEventListener("resize", () => requestAnimationFrame(fitCard));
      function hideOver() { over.hidden = true; over.innerHTML = ""; root.classList.remove("has-over", "is-idle"); }
      const btn = (cls, act, icon, label, extra = "") => `<button type="button" class="hk-btn ${cls}" data-go="${act}" ${extra}>${icon ? HKUI.icon(icon, 16, "currentColor") + " " : ""}${label}</button>`;
      over.addEventListener("click", (e) => {
        const b = e.target.closest("[data-go]");
        if (b && !b.disabled) GO[b.dataset.go]?.(b);
      });

      // 짐볼 로고(작은 그림) — 카드 머리에
      function logoCanvas(size = 68) {
        const c = document.createElement("canvas");
        c.width = c.height = size * 2;
        const x = c.getContext("2d");
        x.scale(2, 2);
        const r = size * 0.36;
        x.fillStyle = "rgba(15,23,42,.12)";
        x.beginPath(); x.ellipse(size / 2, size * 0.88, r * 0.8, r * 0.16, 0, 0, Math.PI * 2); x.fill();
        drawBallShape(x, size / 2, size * 0.47, r, 1.06, 0.94, 0.4, 1, 0);
        return c.toDataURL();
      }
      let LOGO = null;

      // 코스 세 칸 — 잠긴 코스는 못 고른다 (go: 누르면 할 일)
      const courseTabs = (cur, go) => COURSES.length < 2 ? "" : `<div class="bb-course" role="tablist" aria-label="코스">
          ${COURSES.map((c) => {
            const open = go === "course" ? courseOpen(c) : true;
            return `<button type="button" role="tab" data-go="${go}" data-c="${c.no}" aria-selected="${c.no === cur.no}" class="${c.no === cur.no ? "is-on" : ""}" ${open ? "" : "disabled"}>
              ${open ? "" : HKUI.icon("lock", 12, "currentColor")}<b>${c.no}코스</b><small>${c.from + 1}~${c.to + 1}</small></button>`;
          }).join("")}
        </div>`;
      // 순위표(오른쪽 · 결과 창)도 고른 코스로 — 1코스는 갈래 없음(예전 순위표 그대로)
      // (늦게 온 앞 코스 응답이 뒤 코스 이름 밑에 그려지지 않게 하는 건 스크립트 맨 위 HKApi.playLeaderboard 감싸기가 맡는다)
      let boardCourse = COURSES[0];
      const showCourseBoard = (c) => { boardCourse = c; if (ctx.setVariant) ctx.setVariant(c.variant, c.variant ? `${c.no}코스` : ""); };

      function showReady() {
        state = "ready"; mode = "run";
        if (!courseOpen(course)) course = COURSES[0];
        loadStage(course.from);
        LOGO = LOGO || logoCanvas();
        const best = courseBest(course);
        const cleared = store.cleared;
        const locked = COURSES.find((c) => !courseOpen(c));
        showOver(`<div class="bb-card">
          <img class="bb-logo" src="${LOGO}" alt="">
          <h2>통통 짐볼</h2>
          <p>짐볼은 땅에 닿을 때마다 <b>저절로 튀어요</b>. 점프 버튼은 없어요. 좌우로 방향만 잡아 문까지 굴러가요.</p>
          ${courseTabs(course, "course")}
          ${COURSES.length > 1 ? `<div class="bb-course-name"><b>${HKUI.escapeHtml(course.name)}</b>${locked ? ` · ${locked.no}코스는 ${locked.from}스테이지를 깨면 열려요` : ` · ${course.from + 1}~${course.to + 1}스테이지`}</div>` : ""}
          <div class="bb-rule"><b>정식 도전</b> — ${COURSES.length > 1 ? `고른 코스 ${course.to - course.from + 1}스테이지를 이어서 완주한 한 판이 <b>그 코스 순위</b>에 올라요.` : `${N}개 스테이지를 처음부터 이어서 완주한 한 판이 기록돼요.`}<br>점수 = <b>튄 횟수 + 떨어진 횟수 × ${FALL_COST}</b> · <b>낮을수록 좋아요</b><br>순위는 점수로만 정해요. 시간은 참고로 보여 줘요.</div>
          <dl class="bb-keys">
            <dt class="k-pc">PC</dt><dd class="k-pc"><kbd>←</kbd><kbd>→</kbd> 또는 <kbd>A</kbd><kbd>D</kbd> · 둘 다 누르면 브레이크 · <kbd>Esc</kbd> 일시정지</dd>
            <dt class="k-ph">휴대폰</dt><dd class="k-ph">아래 왼쪽·오른쪽 버튼을 누르고 있기 · 두 버튼 같이 = 브레이크</dd>
          </dl>
          ${best ? `<div class="bb-best">${course.no}코스 내 최고 <b>${best.s.toLocaleString("ko-KR")}점</b> · ${fmtTime(best.t)}</div>` : ""}
          ${btn("hk-btn--primary", "run", "play", "정식 도전 시작")}
          ${btn("hk-btn--secondary", "select", "list", cleared ? `스테이지 연습 · ${cleared}/${N} 통과` : "스테이지 연습")}
        </div>`);
        draw(1);
      }

      function itemIcon(code) {
        const c = document.createElement("canvas");
        const s = 44;
        c.width = c.height = s * 2;
        const x = c.getContext("2d");
        x.scale(2, 2);
        const t = THEMES[lv.theme];
        x.fillStyle = t.sky[0]; x.fillRect(0, 0, s, s);
        const ts = 22;
        if (code === "K") {
          drawBlockTile(x, "#", 30, 0, ts, t, 0, false, false, false, true);
          drawBlockTile(x, "#", 30, 22, ts, t, 0, true, false, false, true);
          x.strokeStyle = "#e11d48"; x.lineWidth = 2.2; x.lineCap = "round";
          x.beginPath(); x.moveTo(24, 30); x.quadraticCurveTo(15, 22, 10, 9); x.stroke();
          x.beginPath(); x.moveTo(10, 9); x.lineTo(9, 15); x.moveTo(10, 9); x.lineTo(15, 12); x.stroke();
          drawBallShape(x, 24, 30, 6.5, 0.9, 1.1, 0, 1, 0);
          return c;
        }
        const ox = 11, oy = code === "v" ? 0 : 16;
        if (code === "C") { drawBlockTile(x, "#", ox, 33, ts, t, 0, true, true, true); drawCooler(x, ox, 11, ts, true, 0); return c; }
        if (code === "^") drawBlockTile(x, "#", ox, 38, ts, t, 0, true, true, true);
        drawTileAt(x, code, ox, oy, ts, t, -1, 0);
        if (code === "R") { x.strokeStyle = "rgba(14,165,233,.7)"; x.lineWidth = 2; x.lineCap = "round"; for (const yy of [6, 11]) { x.beginPath(); x.moveTo(8, yy); x.lineTo(34, yy); x.stroke(); } }
        return c;
      }
      const ITEMS = {
        T: ["트램펄린", "밟으면 아주 높이 튀어요."],
        C: ["정수기", "닿으면 저장돼요. 떨어지면 여기서 다시 시작해요."],
        B: ["택배 상자", "한 번 밟으면 찌그러져요. 다시 시작하면 돌아와요."],
        "^": ["압정", `닿으면 떨어진 것과 같아요 (+${FALL_COST}).`],
        M: ["요가 매트", "낮게 튀어요. 낮은 천장 밑을 지날 때 써요."],
        R: ["송풍 발판", "화살표 쪽으로 쭉 날아가요. 반대쪽을 누르면 내려요."],
        K: ["벽차기", "벽에 부딪히는 순간 반대쪽을 누르면 더 높이 튀어요. 양쪽 벽을 번갈아 차면 계속 올라가요."],
      };

      // 스테이지 소개 — 정식 도전은 앞 스테이지 결과를 함께
      function showIntro(i, passed) {
        loadStage(i);
        state = "intro";
        const s = STAGES[i];
        const r = mode === "run" ? runTotals() : null;
        const first = mode === "run" && run && i === run.course.from;
        showOver(`<div class="bb-card">
          ${passed ? `<div class="bb-pass">${HKUI.icon("check", 16, "currentColor")} ${passed}</div>` : ""}
          <span class="bb-no">${mode === "practice" ? "연습 · " : COURSES.length > 1 && run ? `${run.course.no}코스 · ` : ""}${i + 1} / ${N} 스테이지</span>
          <h2>${HKUI.escapeHtml(s.name)}</h2>
          <p>${HKUI.escapeHtml(s.intro)}</p>
          <div data-items></div>
          ${r && !first ? `<div class="bb-total">지금까지 <b>${stageScore(r.b, r.f).toLocaleString("ko-KR")}점</b> · ${fmtTime(r.t)}</div>` : ""}
          ${first ? `<div class="bb-total">${COURSES.length > 1 ? `${run.course.no}코스 ` : ""}${run.course.to - run.course.from + 1}개 스테이지를 이어서 가요 · 중간에 나가면 기록이 안 남아요</div>` : ""}
          ${btn("hk-btn--primary", "begin", "play", mode === "practice" ? "연습 시작" : "스테이지 시작")}
          ${mode === "practice" ? btn("hk-btn--secondary", "select", "list", "스테이지 고르기") : ""}
        </div>`);
        const box = over.querySelector("[data-items]");
        for (const code of s.items) {
          const [name, desc] = ITEMS[code];
          const row = document.createElement("div");
          row.className = "bb-new";
          row.appendChild(itemIcon(code));
          const d = document.createElement("div");
          d.innerHTML = `<b>${name}</b><span>${desc}</span>`;
          row.appendChild(d);
          box.appendChild(row);
        }
        draw(1);
      }

      // 스테이지 연습 — 코스 칸으로 10개씩 나눠 보여 준다 (30개를 한 번에 늘어놓으면 휴대폰에서 너무 길다)
      function showSelect() {
        state = "ready"; mode = "practice";
        const open = openUpTo();
        const c = pickCourse;
        showOver(`<div class="bb-card">
          <h2>스테이지 연습</h2>
          <p>통과한 스테이지와 바로 다음 스테이지를 골라 연습해요. 연습 기록은 순위에 들어가지 않아요.</p>
          ${courseTabs(c, "selcourse")}
          <div class="bb-grid bb-grid--course">
            ${STAGES.slice(c.from, c.to + 1).map((s, k) => {
              const i = c.from + k;
              const b = store.stage[i];
              const lock = i >= open;
              return `<button type="button" class="bb-sel" data-go="pick" data-i="${i}" ${lock ? "disabled" : ""}${b && !lock ? ` title="최고 ${b.s}점 · ${fmtTime(b.t)}"` : ""}>
                <span class="bb-sel__top"><i>${i + 1}스테이지</i><small>${lock ? "잠김" : b ? `${b.s}점 · ${fmtTime(b.t)}` : "기록 없음"}</small></span><b>${HKUI.escapeHtml(s.name)}</b></button>`;
            }).join("")}
          </div>
          ${btn("hk-btn--secondary", "home", "chevron-left", "처음 화면으로")}
        </div>`);
      }

      function begin() {
        hideOver();
        state = "play";
        last = performance.now(); acc = 0;
        sfx("go");
        updateHud();
      }

      function pause() {
        if (state !== "play" && state !== "dying") return;
        pausedFrom = state;
        state = "paused";
        held.clear();
        showOver(`<div class="bb-card">
          <span class="bb-no">${si + 1} / ${N} 스테이지</span>
          <h2>잠시 멈췄어요</h2>
          <p>${mode === "run" ? "정식 도전 중이에요. 시간도 함께 멈춰 있어요." : "연습 중이에요."}</p>
          ${btn("hk-btn--primary", "resume", "play", "계속하기")}
          ${btn("hk-btn--secondary", "giveup", "flag", `${world.cpIndex >= 0 ? "정수기로" : "처음 자리로"} 돌아가기 · +${FALL_COST}점`)}
          ${btn("hk-btn--secondary", "home", "log-out", mode === "run" ? "그만두고 처음 화면으로" : "처음 화면으로")}
        </div>`);
      }
      function resume() {
        if (state !== "paused") return;
        hideOver();
        state = pausedFrom;
        last = performance.now(); acc = 0;
      }

      function stageCleared() {
        const rec = { b: world.bounces, f: world.falls, t: Math.round(stageTime * 10) / 10 };
        const s = { s: stageScore(rec.b, rec.f), t: rec.t };
        store = loadStore();
        store.cleared = Math.max(store.cleared, si + 1);
        if (better(s, store.stage[si])) store.stage[si] = s;
        saveStore();
        const line = `${si + 1}스테이지 통과 · 튐 ${rec.b} · 떨어짐 ${rec.f} · ${fmtTime(rec.t)}`;
        if (mode === "run") {
          run.stages.push({ ...rec, i: si });
          if (si < run.course.to) showIntro(si + 1, line);
          else finishRun();
          return;
        }
        state = "done";
        showOver(`<div class="bb-card">
          <span class="bb-no">연습 · ${si + 1} / ${N} 스테이지</span>
          <div class="bb-big">${s.s}<small>점</small></div>
          <div class="bb-sub">튐 ${rec.b} · 떨어짐 ${rec.f} · ${fmtTime(rec.t)}</div>
          <p>${store.stage[si] === s ? "이 스테이지 내 최고 기록이에요!" : `이 스테이지 최고 ${store.stage[si].s}점 · ${fmtTime(store.stage[si].t)}`}</p>
          ${btn("hk-btn--primary", "again", "rotate-ccw", "다시 하기")}
          ${si + 1 < N ? btn("hk-btn--secondary", "next", "chevron-right", "다음 스테이지") : ""}
          ${btn("hk-btn--secondary", "select", "list", "스테이지 고르기")}
        </div>`);
      }

      function finishRun() {
        state = "done";
        const r = runTotals();
        const total = Math.min(MAX_SCORE, stageScore(r.b, r.f));
        // 위 점수 줄도 결과 카드와 같은 값으로 (마지막 0.25초 사이 갱신이 빠질 수 있어서)
        hud.score.textContent = total.toLocaleString("ko-KR");
        hud.detail.textContent = `튐 ${r.b} · 떨어짐 ${r.f}`;
        hud.time.textContent = fmtTime(r.t);
        store = loadStore();
        const c = run.course;
        const mine = { s: total, t: Math.round(r.t * 10) / 10 };
        // 정식 도전 최고는 순위표처럼 점수로만 (같은 점수면 예전 기록 그대로) — 코스마다 따로
        const prev = c.no === 1 ? store.best : store.courseBest[c.no];
        if (!prev || mine.s < prev.s) { if (c.no === 1) store.best = mine; else store.courseBest[c.no] = mine; }
        store.cleared = Math.max(store.cleared, c.to + 1);
        saveStore();
        showOver(`<div class="bb-card">
          <span class="bb-no">${COURSES.length > 1 ? `${c.no}코스 ` : ""}정식 도전 완주</span>
          <h2>헬스키퍼실 도착!</h2>
          <div class="bb-big">${total.toLocaleString("ko-KR")}<small>점</small></div>
          <div class="bb-sub">튐 ${r.b} · 떨어짐 ${r.f} (+${r.f * FALL_COST}) · ${fmtTime(r.t)}<span data-newbest></span></div>
          <table class="bb-table"><thead><tr><th style="text-align:left">스테이지</th><th>튐</th><th>떨어짐</th><th>시간</th></tr></thead><tbody>
            ${run.stages.map((s) => `<tr><td><i>${s.i + 1}</i>${HKUI.escapeHtml(STAGES[s.i].name)}</td><td>${s.b}</td><td>${s.f}</td><td>${fmtTime(s.t)}</td></tr>`).join("")}
          </tbody></table>
          ${btn("hk-btn--primary", "run", "rotate-ccw", "다시 하기")}
          ${btn("hk-btn--secondary", "select", "list", "스테이지 연습")}
        </div>`);
        // 기록은 꼭 이 코스 순위로
        if (boardCourse !== c) showCourseBoard(c);
        // '내 최고!'는 서버 순위표 기준 (결과 띠와 같은 말을 하게)
        Promise.resolve(ctx.submit(total)).then((res) => {
          const el = over.querySelector("[data-newbest]");
          if (el && res && res.counted && res.newBest) el.innerHTML = ` · <b style="color:#e11d48">내 최고!</b>`;
        }).catch(() => {});
      }

      function startRun() {
        if (!courseOpen(course)) course = COURSES[0];
        mode = "run";
        run = { course, stages: [] };
        showCourseBoard(course);
        showIntro(course.from);
      }

      const GO = {
        run: () => startRun(),
        select: () => { pickCourse = mode === "practice" ? courseOf(si) : courseOf(Math.min(openUpTo(), N) - 1); showSelect(); },
        home: () => { run = null; showReady(); },
        course: (b) => {
          const c = COURSES.find((x) => x.no === Number(b.dataset.c));
          if (!c || !courseOpen(c) || c === course) return;
          course = c;
          store = loadStore(); store.course = c.no; saveStore();
          sfx("select");
          showCourseBoard(c);
          showReady();
        },
        selcourse: (b) => { pickCourse = COURSES.find((x) => x.no === Number(b.dataset.c)) || pickCourse; sfx("select"); showSelect(); },
        pick: (b) => { mode = "practice"; run = null; showIntro(Number(b.dataset.i)); },
        begin: () => begin(),
        resume: () => resume(),
        giveup: () => { resume(); if (state === "play") giveUp(); },
        again: () => { showIntro(si); },
        next: () => { showIntro(Math.min(N - 1, si + 1)); },
      };
      ctx.onRestart(() => startRun());
      ctx.onPause(() => pause());

      // ───────────────────────── 매 프레임
      function update(dt) {
        clock += dt;
        if (state === "play") {
          stageTime += dt;
          // 물리는 1/120초 걸음으로만 — 남은 몫은 걸음 단위로 세어 화면 주사율과 상관없이 같은 결과
          acc += dt / P.DT;
          const inp = input();
          let n = 0;
          while (acc >= 1 - 1e-6 && state === "play" && n < 24) {
            const ev = [];
            E.step(world, inp, ev);
            if (ev.length) handle(ev);
            acc -= 1;
            n++;
          }
          if (n >= 24) acc = 0;
          roll += (world.x - world.px) / P.R;
          if (Math.floor(clock * 4) !== Math.floor((clock - dt) * 4)) updateHud();
        } else if (state === "dying") {
          stageTime += dt;
          dieT += dt;
          if (dieT > 0.75) respawn();
        } else if (state === "cleared") {
          clearT += dt;
          if (clearT > 0.9) stageCleared();
        }
        squash = Math.max(0, squash - dt * 7);
        blinkT -= dt;
        if (blinkT < -0.12) blinkT = rand(1.8, 4);
        for (const p of particles) {
          p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.kind === "puff") { p.vx *= 0.9; p.s += dt * 0.25; }
          if (p.rot != null) p.rot += p.vr * dt;
        }
        particles = particles.filter((p) => p.t < p.life);
        for (const f of floats) f.t += dt;
        floats = floats.filter((f) => f.t < f.life);
        const alpha = state === "play" ? clamp(acc, 0, 1) : 1;
        const bx = world.px + (world.x - world.px) * alpha, by = world.py + (world.y - world.py) * alpha;
        updateCamera(dt, bx, by);
        return alpha;
      }

      function frame(now) {
        const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
        last = now;
        const alpha = update(state === "paused" ? 0 : dt);
        draw(alpha);
        requestAnimationFrame(frame);
      }

      // ───────────────────────── 그리기
      const rr = (c, x, y, w, h, r) => {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
      };
      const sx = (x) => (x - camX) * TS;
      const sy = (y) => (y - camY) * TS;
      const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

      // 배경 — 테마 색 그라데이션 + 먼 벽의 소품 (반쯤 느리게 움직임)
      let bgCache = null;
      function drawBackground() {
        if (!bgCache || bgCache.theme !== lv.theme || bgCache.h !== H) {
          const gr = g.createLinearGradient(0, 0, 0, H);
          gr.addColorStop(0, th.sky[0]); gr.addColorStop(1, th.sky[1]);
          bgCache = { theme: lv.theme, h: H, gr };
        }
        g.fillStyle = bgCache.gr;
        g.fillRect(0, 0, W, H);
        drawDeco();
      }

      function drawDeco() {
        const k = 0.5; // 먼 벽은 절반 속도로
        const ox = camX * (1 - k), oy = camY * (1 - k);
        const px = (x) => (x - camX + ox) * TS, py = (y) => (y - camY + oy) * TS;
        const x0 = Math.floor(camX * k / 6) * 6 - 12, x1 = camX * k + viewW + 12;
        const d = th.deco;
        g.save();
        if (d === "roof") {
          // 먼 도시와 구름
          g.fillStyle = "#cfe6f5";
          for (let i = Math.floor((camX * 0.25) / 2) - 2; i < (camX * 0.25 + viewW) / 2 + 3; i++) {
            const hgt = 2 + hash(i, 7) * 4, wdt = 1.4 + hash(i, 9) * 0.8;
            const bx = (i * 2 - camX * 0.25) * TS, by = (lv.h - 1.5 - hgt - camY * 0.85 + camY) * TS;
            g.fillStyle = i % 3 ? "#c4dfef" : "#b4d3e8";
            g.fillRect(bx, by, wdt * TS, hgt * TS + H);
            g.fillStyle = "rgba(255,255,255,.55)";
            for (let wy = 0.5; wy < hgt - 0.3; wy += 0.8) for (let wx = 0.3; wx < wdt - 0.2; wx += 0.5) g.fillRect(bx + wx * TS, by + wy * TS, TS * 0.18, TS * 0.28);
          }
          for (let i = -1; i < 8; i++) {
            const cx = ((i * 9.3 + clock * 0.25 - camX * 0.15) % 70 + 70) % 70 - 6;
            const cy = 1.2 + hash(i, 3) * 3.5 - camY * 0.2;
            const s = 0.9 + hash(i, 5) * 0.8;
            g.fillStyle = "rgba(255,255,255,.85)";
            g.beginPath();
            g.ellipse(cx * TS, cy * TS, 1.3 * s * TS, 0.45 * s * TS, 0, 0, Math.PI * 2);
            g.ellipse((cx + 0.7 * s) * TS, (cy - 0.25 * s) * TS, 0.8 * s * TS, 0.5 * s * TS, 0, 0, Math.PI * 2);
            g.fill();
          }
          g.restore();
          return;
        }
        const far = th.far;
        for (let i = x0; i < x1; i += 6) {
          const r1 = hash(i, 1), r2 = hash(i, 2);
          const bx = i + r1 * 2;
          const wy = Math.max(1.6, Math.min(lv.h - 5, 2.2 + r2 * 2));
          if (d === "office" || d === "hall" || d === "lobby") {
            if (r2 < 0.55 || d === "lobby") {
              // 창문 + 블라인드
              const w = d === "lobby" ? 4 : 3, h = 2.4;
              g.fillStyle = far; rr(g, px(bx) - 3, py(wy) - 3, w * TS + 6, h * TS + 6, 6); g.fill();
              const sg = g.createLinearGradient(0, py(wy), 0, py(wy + h));
              sg.addColorStop(0, d === "lobby" ? "#bfeee0" : "#cfe7fb"); sg.addColorStop(1, d === "lobby" ? "#e8fbf4" : "#eef7ff");
              g.fillStyle = sg; g.fillRect(px(bx), py(wy), w * TS, h * TS);
              g.fillStyle = "rgba(255,255,255,.55)";
              g.beginPath(); g.moveTo(px(bx + w * 0.55), py(wy)); g.lineTo(px(bx + w * 0.75), py(wy)); g.lineTo(px(bx + w * 0.35), py(wy + h)); g.lineTo(px(bx + w * 0.15), py(wy + h)); g.fill();
              if (d !== "lobby") {
                g.fillStyle = "rgba(100,116,139,.18)";
                for (let s = 0.25; s < h * 0.45; s += 0.22) g.fillRect(px(bx), py(wy + s), w * TS, 2);
              }
              g.fillStyle = far; g.fillRect(px(bx + w / 2) - 2, py(wy), 4, h * TS);
            } else if (r2 < 0.8) {
              // 벽시계
              const cx = px(bx + 1), cy = py(wy + 0.9), r = TS * 0.55;
              g.fillStyle = "#ffffff"; g.strokeStyle = far; g.lineWidth = 4;
              g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill(); g.stroke();
              g.strokeStyle = "#64748b"; g.lineWidth = 2; g.lineCap = "round";
              g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - r * 0.6); g.moveTo(cx, cy); g.lineTo(cx + r * 0.42, cy + r * 0.1); g.stroke();
            } else {
              // 게시판 포스터
              g.fillStyle = far; rr(g, px(bx), py(wy), 1.6 * TS, 2 * TS, 5); g.fill();
              g.fillStyle = "rgba(255,255,255,.7)"; g.fillRect(px(bx + 0.2), py(wy + 0.25), 1.2 * TS, 0.5 * TS);
              g.fillStyle = "rgba(255,255,255,.45)"; g.fillRect(px(bx + 0.2), py(wy + 0.95), 1.2 * TS, 0.12 * TS); g.fillRect(px(bx + 0.2), py(wy + 1.2), 0.9 * TS, 0.12 * TS);
            }
            if (d === "lobby" && r1 > 0.5) {
              // 큰 화분
              const fx = bx + 4.6, fy = lv.h - 4;
              g.fillStyle = "#cdebe0"; rr(g, px(fx), py(fy + 1.2), 0.9 * TS, 0.9 * TS, 6); g.fill();
              g.fillStyle = "#9fd8c4";
              for (let l = 0; l < 5; l++) { g.beginPath(); g.ellipse(px(fx + 0.45 + (l - 2) * 0.22), py(fy + 0.7 - (l % 2) * 0.3), TS * 0.18, TS * 0.55, (l - 2) * 0.35, 0, Math.PI * 2); g.fill(); }
            }
          } else if (d === "pantry") {
            g.fillStyle = far;
            rr(g, px(bx), py(1.4), 3.4 * TS, 1.6 * TS, 6); g.fill();
            g.fillStyle = "rgba(255,255,255,.5)";
            g.fillRect(px(bx + 1.7) - 1, py(1.5), 2, 1.4 * TS);
            g.fillRect(px(bx + 1.45), py(2.6), 0.15 * TS, 0.08 * TS); g.fillRect(px(bx + 1.85), py(2.6), 0.15 * TS, 0.08 * TS);
            if (r2 > 0.5) {
              // 커피 머신
              g.fillStyle = far; rr(g, px(bx + 3.9), py(lv.h - 6.2), 1.1 * TS, 1.4 * TS, 5); g.fill();
              g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(px(bx + 4.1), py(lv.h - 5.9), 0.7 * TS, 0.35 * TS);
            }
          } else if (d === "mail" || d === "storage") {
            // 선반과 상자들
            const sy0 = d === "storage" ? 2 : 2.4;
            for (let row = 0; row < 3; row++) {
              const yy = sy0 + row * 2.2;
              if (yy > lv.h - 3) break;
              g.fillStyle = far; g.fillRect(px(bx), py(yy + 1.3), 4.6 * TS, 0.18 * TS);
              for (let b = 0; b < 4; b++) {
                if (hash(i + b, row) < 0.3) continue;
                const bw = 0.7 + hash(i, b + row) * 0.4, bh = 0.6 + hash(b, i + row) * 0.6;
                g.fillStyle = d === "storage" ? (b % 2 ? "#5f4c3b" : "#584737") : (b % 2 ? "#ebdfc8" : "#e6d8bd");
                g.fillRect(px(bx + 0.2 + b * 1.1), py(yy + 1.3 - bh), bw * TS, bh * TS);
              }
            }
          } else if (d === "machine") {
            g.strokeStyle = far; g.lineWidth = TS * 0.32;
            const yy = 2 + r2 * 3;
            g.beginPath(); g.moveTo(px(bx - 3), py(yy)); g.lineTo(px(bx + 3), py(yy)); g.lineTo(px(bx + 3), py(yy + 3)); g.stroke();
            g.fillStyle = "#3d5270";
            g.fillRect(px(bx + 0.5), py(yy) - TS * 0.25, TS * 0.3, TS * 0.5);
            // 계기판
            g.fillStyle = "#2e4058"; g.beginPath(); g.arc(px(bx + 1.6), py(yy + 1.4), TS * 0.4, 0, Math.PI * 2); g.fill();
            g.strokeStyle = "#7dd3fc"; g.lineWidth = 2; g.beginPath(); g.moveTo(px(bx + 1.6), py(yy + 1.4)); g.lineTo(px(bx + 1.6) + Math.cos(clock + i) * TS * 0.3, py(yy + 1.4) - Math.abs(Math.sin(clock + i)) * TS * 0.3); g.stroke();
          } else if (d === "gym") {
            // 거울 + 덤벨 거치대
            g.fillStyle = far; rr(g, px(bx), py(1.6), 3.6 * TS, 3 * TS, 6); g.fill();
            g.fillStyle = "rgba(255,255,255,.07)";
            g.beginPath(); g.moveTo(px(bx + 0.6), py(1.6)); g.lineTo(px(bx + 1.4), py(1.6)); g.lineTo(px(bx + 0.4), py(4.6)); g.lineTo(px(bx), py(4.6)); g.lineTo(px(bx), py(3.2)); g.fill();
            g.fillStyle = "#5a4a3e";
            g.fillRect(px(bx + 4), py(lv.h - 5.2), 1.6 * TS, 0.12 * TS);
            for (let b = 0; b < 3; b++) { g.beginPath(); g.arc(px(bx + 4.25 + b * 0.55), py(lv.h - 5.42), TS * 0.16, 0, Math.PI * 2); g.fill(); }
          }
        }
        if (d === "stairs") {
          // 벽에 칠한 큰 층 번호 (세로로 6칸마다)
          g.fillStyle = far; g.font = `900 ${TS * 1.6}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
          for (let fy = lv.h - 4; fy > -2; fy -= 7) {
            g.fillText(`${Math.round((lv.h - fy) / 7) + 1}F`, sx(lv.w / 2), sy(fy));
          }
          // 비상구 표시등
          const ey = 2.2;
          g.fillStyle = "#16a34a"; rr(g, sx(lv.w - 4.2), sy(ey), TS * 2.2, TS * 0.8, 4); g.fill();
          g.fillStyle = "#ffffff"; g.font = `800 ${TS * 0.36}px ${FONT}`; g.fillText("비상구", sx(lv.w - 3.1), sy(ey + 0.42));
        }
        g.restore();
      }

      // 칸 하나 — 같은 그림을 작은 아이콘에도 쓴다
      function drawTileAt(c, ch, x, y, s, t, idx, now) {
        if (ch === "#" || ch === "=") return drawBlockTile(c, ch, x, y, s, t, idx, true, true, true);
        if (ch === "T") return drawSpring(c, x, y, s, idx);
        if (ch === "B") return drawBox(c, x, y, s);
        if (ch === "M") return drawMat(c, x, y, s, t);
        if (ch === "R" || ch === "L") return drawWind(c, x, y, s, ch === "R" ? 1 : -1, now);
        if (ch === "^" || ch === "v" || ch === "<" || ch === ">") return drawTacks(c, ch, x, y, s);
      }
      // 벽·바닥 — 위가 비어 있으면 윗면을 밝게
      function drawBlockTile(c, ch, x, y, s, t, idx, topOpen, leftOpen, rightOpen, bottomOpen) {
        const col = ch === "=" ? t.desk : t.block;
        c.fillStyle = col[1];
        c.fillRect(x, y, s + 0.5, s + 0.5);
        if (ch === "=") {
          // 책상·선반 — 나뭇결 줄과 손잡이
          c.fillStyle = col[0];
          c.fillRect(x, y, s + 0.5, s * (topOpen ? 0.3 : 0));
          c.fillStyle = "rgba(0,0,0,.08)";
          c.fillRect(x, y + s * 0.62, s + 0.5, Math.max(1, s * 0.04));
          if (bottomOpen) { c.fillStyle = col[2]; c.fillRect(x, y + s * 0.88, s + 0.5, s * 0.12); }
          if (topOpen && (Math.abs(idx) % 3) === 1) { c.fillStyle = col[2]; rr(c, x + s * 0.38, y + s * 0.45, s * 0.24, s * 0.07, s * 0.03); c.fill(); }
          if (leftOpen) { c.fillStyle = "rgba(0,0,0,.12)"; c.fillRect(x, y, Math.max(1, s * 0.05), s); }
          if (rightOpen) { c.fillStyle = "rgba(0,0,0,.12)"; c.fillRect(x + s - Math.max(1, s * 0.05), y, Math.max(1, s * 0.05), s); }
          return;
        }
        // 무늬 — 칸마다 조금씩 다르게
        const r = idx >= 0 ? hash(idx, 31) : 0.5;

          const q = Math.sin(squash * Math.PI) * amt;
          scx = 1 + q; scy = 1 - q;
        } else if (world.dash) { scx = 1.16; scy = 0.88; }
        else {
          const st = clamp(Math.abs(world.vy) / 60, 0, 0.12);
          scx = 1 - st; scy = 1 + st;
        }
        // 납작해질 때 바닥에 붙어 보이게 아래를 기준으로
        const yOff = (1 - scy) * r;
        if (world.dash) {
          g.strokeStyle = "rgba(186,230,253,.8)"; g.lineWidth = Math.max(1.5, TS * 0.05); g.lineCap = "round";
          for (let k = -1; k <= 1; k++) {
            const lx = sx(bx - world.dash * (0.45 + Math.abs(k) * 0.1)), ly = sy(by) + k * r * 0.5;
            g.beginPath(); g.moveTo(lx, ly); g.lineTo(lx - world.dash * TS * (0.5 + (k === 0 ? 0.3 : 0)), ly); g.stroke();
          }
        }
        const look = clamp(world.dash ? world.dash : world.vx / P.VMAX, -1, 1);
        drawBallShape(g, sx(bx), sy(by) + yOff, r, scx, scy, roll * 0.5, look, blinkT < 0, state === "dying");
      }

      // ───────────────────────── 시작
      window.addEventListener("resize", resize);
      if (course.variant) showCourseBoard(course); // 지난번에 고른 코스 순위표부터
      showReady();
      resize();
      requestAnimationFrame((t) => { last = t; frame(t); });
    },
  });
  </script>
</body>
</html>
