<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>번호순 도장 찍기 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>

  <style>
    /* ── 번호순 도장 찍기 ─────────────────────────────────────── */
    .gm-ff { --gm-a: #9a3412; --gm-b: #fb923c; --gm-desk: #fff1e6; --gm-stamp: #c2410c; --gm-bad: #ef4444; --gm-ink: #1e293b; --gm-soft: #64748b; --gm-chip: #fff4ec;
      position: relative; display: flex; flex-direction: column; box-sizing: border-box; width: 100%;
      user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
    .gm-ff > :not(.gm-ff__cover) { width: 100%; max-width: 420px; margin-inline: auto; box-sizing: border-box; flex-shrink: 0; }
    /* HUD 48px */
    .gm-ff__hud { height: 48px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .gm-ff__chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 12px; background: var(--gm-chip); color: var(--gm-a); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .gm-ff__chip--time { min-width: 104px; }
    .gm-ff__chip--miss { min-width: 64px; }
    .gm-ff__chip--miss.is-bad { background: #fee2e2; color: var(--gm-bad); }
    .gm-ff__chip--miss.is-flash { animation: gm-ff-flash .3s ease-out; }
    @keyframes gm-ff-flash { 0% { transform: scale(1.12); background: var(--gm-bad); color: #fff; } 100% { transform: scale(1); } }
    .gm-ff__chip--practice { background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); color: #fff; padding: 0 10px; font-size: 13px; }
    .gm-ff__chip--practice[hidden] { display: none; }
    .gm-ff__gap { flex: 1; }
    .gm-ff__pause { border: 0; background: var(--gm-chip); color: var(--gm-a); width: 36px; height: 36px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .gm-ff__pause:hover { background: #ffe4d0; }
    /* 서랍 44px — 폴더 4칩 */
    .gm-ff__drawer { position: relative; height: 44px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .gm-ff__folder { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; height: 44px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; font-size: 13px; font-weight: 700; box-sizing: border-box; transform-origin: 50% 0; }
    .gm-ff__folder b { font-weight: 700; white-space: nowrap; }
    .gm-ff__folder i[data-lucide] { flex-shrink: 0; }
    .gm-ff__fi--done { display: none !important; }
    .gm-ff__folder.is-now { background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(154, 52, 18, .22); }
    .gm-ff__folder.is-done { background: var(--gm-chip); border-color: #fed7aa; color: var(--gm-a); }
    .gm-ff__folder.is-done .gm-ff__fi--open { display: none !important; }
    .gm-ff__folder.is-done .gm-ff__fi--done { display: inline-flex !important; }
    .gm-ff__folder.is-fold { animation: gm-ff-fold .45s ease-in-out; }
    @keyframes gm-ff-fold { 0% { transform: perspective(300px) rotateX(0); } 50% { transform: perspective(300px) rotateX(-88deg); } 100% { transform: perspective(300px) rotateX(0); } }
    .gm-ff__banner { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; border-radius: 12px; padding: 0 10px; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 16px rgba(154, 52, 18, .28); animation: gm-ff-banner 1s ease-out forwards; }
    .gm-ff__banner[hidden] { display: none; }
    @keyframes gm-ff-banner { 0% { opacity: 0; transform: translateY(-6px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
    /* 남는 공간 — 좁은 화면은 위로 몰고, 넓으면 위아래 균등 */
    .gm-ff__space { flex: 1 1 0; min-height: 10px; }
    .gm-ff__space--bottom { flex: 0 0 0; min-height: 0; }
    .gm-ff.is-wide .gm-ff__space--bottom { flex: 1 1 0; }
    /* 다음 56px */
    .gm-ff__next { height: 56px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .gm-ff__nextnum { flex-shrink: 0; width: 68px; height: 50px; border-radius: 12px; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); color: #fff; font-size: 32px; font-weight: 800; line-height: 1; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; box-shadow: 0 4px 12px rgba(154, 52, 18, .22); }
    .gm-ff__nextnum.is-pop { animation: gm-ff-pop .18s ease-out; }
    @keyframes gm-ff-pop { 0% { transform: scale(.86); } 100% { transform: scale(1); } }
    .gm-ff__nextinfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .gm-ff__nextinfo b { font-size: 12.5px; font-weight: 700; color: var(--gm-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gm-ff__nextinfo small { font-size: 12.5px; font-weight: 600; color: var(--gm-soft); font-variant-numeric: tabular-nums; }
    .gm-ff__again { border: 0; height: 40px; padding: 0 14px; border-radius: 12px; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(154, 52, 18, .22); }
    .gm-ff__again[hidden] { display: none; }
    /* 판 — 정사각 canvas */
    .gm-ff__board { position: relative; border-radius: 12px; background: var(--gm-desk); margin-bottom: 8px; overflow: hidden; flex-shrink: 0; }
    .gm-ff__board canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; font-variant-numeric: tabular-nums; cursor: pointer; }
    /* 덮개 — 루트 전체 */
    .gm-ff__cover { position: absolute; inset: 0; z-index: 3; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; color: #fff;
      background: linear-gradient(135deg, rgba(154, 52, 18, .97), rgba(251, 146, 60, .97)); backdrop-filter: blur(6px); }
    .gm-ff__cover[hidden] { display: none; }
    .gm-ff__cover h2 { margin: 0; font-size: 24px; color: #fff; }
    .gm-ff__cover p { margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(255, 255, 255, .9); max-width: 340px; word-break: keep-all; }
    .gm-ff__cover .gm-ff__keys { font-size: 12.5px; color: rgba(255, 255, 255, .78); }
    .gm-ff__nw { white-space: nowrap; }
    .gm-ff__cover .gm-ff__note { padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .18); font-size: 13px; font-weight: 600; }
    .gm-ff__mark { width: 64px; height: 64px; border-radius: 18px; background: rgba(255, 255, 255, .16); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    .gm-ff__go { border: 0; height: 48px; min-width: 160px; padding: 0 28px; border-radius: 14px; background: #fff; color: var(--gm-a); font-size: 16px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
    .gm-ff__go:hover { background: #fff4ec; }
    .gm-ff__go:disabled { opacity: .7; cursor: default; }
    .gm-ff__count { font-size: 64px; font-weight: 900; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; animation: gm-ff-count .9s ease-out; }
    @keyframes gm-ff-count { 0% { transform: scale(1.35); opacity: .4; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @media (max-width: 400px) {
      .gm-ff__chip { padding: 0 10px; font-size: 13.5px; }
      .gm-ff__chip--time { min-width: 98px; }
      .gm-ff__folder { font-size: 12.5px; gap: 4px; }
      .gm-ff__cover { padding: 20px 16px; }
      .gm-ff__cover p { font-size: 13.5px; }
      .gm-ff__cover .gm-ff__note { font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    HKPlay.mountGame({
      key: "fifty",
      setup(stage, ctx) {
        // ── 상수 ──────────────────────────────────────────────
        const N = 5, CELLS = 25, LAYERS = 4, PER = 25, TOTAL = 100;
        const START_COUNT = 3, RESUME_COUNT = 2;
        const MISS_PENALTY = 50, MISS_LOCK_MS = 250, TAP_GAP_MS = 60, SAME_CELL_MS = 120;
        const MIN_SCORE = 2000, MAX_SCORE = 8_640_000;
        const FONT_SCALE = [1.0, 0.92, 0.84, 0.76];
        const GAP = 4, RADIUS = 10;
        const LAYER_INFO = [
          { name: "결재", full: "결재", rule: "1부터 차례로", bg: "#fff7ed", ink: "#9a3412", banner: "" },
          { name: "지출", full: "지출 결의", rule: "50부터 거꾸로", bg: "#fefce8", ink: "#854d0e", banner: "지출 결의 · 50부터 거꾸로" },
          { name: "휴가", full: "휴가 신청", rule: "홀수 먼저", bg: "#f0fdf4", ink: "#166534", banner: "휴가 신청 · 51부터 홀수 먼저" },
          { name: "출장", full: "출장 신청", rule: "양끝 번갈아", bg: "#eff6ff", ink: "#1e40af", banner: "출장 신청 · 76, 100 양끝 번갈아" },
        ];
        const C = { desk: "#fff1e6", back: "#f6e9dc", stamp: "#c2410c", bad: "#ef4444", ink: "#1e293b" };

        // ── 판 생성 — 시드 rng 한 줄기, 마운트 때 한 번 (같은 날 = 같은 판) ──
        const rng = ctx.rng("board");
        const adj = (a, b) => Math.abs(((a / N) | 0) - ((b / N) | 0)) + Math.abs((a % N) - (b % N)) === 1;
        function orderOf(L) {
          const nums = Array.from({ length: PER }, (_, i) => L * PER + i + 1);
          if (L === 0) return nums;
          if (L === 1) return nums.slice().reverse();
          if (L === 2) return [...nums.filter((n) => n % 2), ...nums.filter((n) => !(n % 2))];
          const out = [];
          let lo = 0, hi = PER - 1;
          while (lo <= hi) {
            out.push(nums[lo++]);
            if (lo <= hi) out.push(nums[hi--]);
          }
          return out;
        }
        function drawPath(prevCell) {
          for (;;) {
            const used = new Set(), path = [];
            let prev = prevCell;
            for (let i = 0; i < PER; i++) {
              const cand = [];
              for (let c = 0; c < CELLS; c++) if (!used.has(c) && c !== prev && (prev < 0 || !adj(c, prev))) cand.push(c);
              if (!cand.length) break;
              const c = cand[Math.floor(rng() * cand.length)];
              used.add(c);
              path.push(c);
              prev = c;
            }
            if (path.length === PER) return path;
          }
        }
        const paths = [];
        {
          let prev = -1;
          for (let L = 0; L < LAYERS; L++) {
            const p = drawPath(prev);
            paths.push(p);
            prev = p[PER - 1];
          }
        }
        // numAt[L][cell] = 겹 L 에서 그 칸에 오르는 번호
        const numAt = paths.map((path, L) => {
          const a = new Array(CELLS).fill(0);
          const ord = orderOf(L);
          path.forEach((c, i) => { a[c] = ord[i]; });
          return a;
        });
        const SEQ = [];
        for (let L = 0; L < LAYERS; L++) SEQ.push(...orderOf(L));
        const layerOf = (n) => Math.floor((n - 1) / PER);

        // ── 상태 ──────────────────────────────────────────────
        let state = "ready"; // ready · countdown · play · pause · done
        let elapsedMs = 0, runFrom = null, practice = false;
        let cdGen = 0, cdTimers = [];
        let shown = [], misses = 0, idx = 0, revealed = false;
        let lockUntil = 0, lastDown = -1e9, lastHit = { cell: -1, t: -1e9 };
        let anims = [], rafId = 0, bannerTimer = 0, doneGen = 0;

        // ── 화면 ──────────────────────────────────────────────
        const folderHtml = (L) => `<span class="gm-ff__folder" data-folder="${L}">
            <i class="gm-ff__fi gm-ff__fi--open">${HKUI.icon("folder", 16, "currentColor")}</i>
            <i class="gm-ff__fi gm-ff__fi--done">${HKUI.icon("folder-check", 16, "currentColor")}</i>
            <b>${LAYER_INFO[L].name}</b></span>`;
        stage.innerHTML = `<div class="gm-ff">
          <div class="gm-ff__hud">
            <span class="gm-ff__chip gm-ff__chip--time">${HKUI.icon("timer", 16, "currentColor")}<span data-time>0:00.00</span></span>
            <span class="gm-ff__chip gm-ff__chip--miss" data-miss-chip>${HKUI.icon("circle-x", 16, "currentColor")}<span data-miss>0</span></span>
            <span class="gm-ff__chip gm-ff__chip--practice" data-practice hidden>${HKUI.icon("dumbbell", 15, "currentColor")}연습</span>
            <span class="gm-ff__gap"></span>
            <button type="button" class="gm-ff__pause" data-pause aria-label="일시정지">${HKUI.icon("pause", 18, "currentColor")}</button>
          </div>
          <div class="gm-ff__drawer" data-drawer>
            ${[0, 1, 2, 3].map(folderHtml).join("")}
            <div class="gm-ff__banner" data-banner hidden></div>
          </div>
          <div class="gm-ff__space"></div>
          <div class="gm-ff__next">
            <span class="gm-ff__nextnum" data-next>–</span>
            <span class="gm-ff__nextinfo"><b data-rule>1겹 결재 · 1부터 차례로</b><small><span data-prog>0</span>/${TOTAL}</small></span>
            <button type="button" class="gm-ff__again" data-again hidden>${HKUI.icon("rotate-ccw", 16, "currentColor")}다시 하기</button>
          </div>
          <div class="gm-ff__board" data-board><canvas></canvas></div>
          <div class="gm-ff__space gm-ff__space--bottom"></div>
          <div class="gm-ff__cover" data-cover></div>
        </div>`;
        const root = stage.querySelector(".gm-ff");
        const timeEl = root.querySelector("[data-time]");
        const missEl = root.querySelector("[data-miss]");
        const missChip = root.querySelector("[data-miss-chip]");
        const practiceChip = root.querySelector("[data-practice]");
        const folders = [...root.querySelectorAll("[data-folder]")];
        const bannerEl = root.querySelector("[data-banner]");
        const nextEl = root.querySelector("[data-next]");
        const ruleEl = root.querySelector("[data-rule]");
        const progEl = root.querySelector("[data-prog]");
        const againBtn = root.querySelector("[data-again]");
        const boardWrap = root.querySelector("[data-board]");
        const canvas = boardWrap.querySelector("canvas");
        const cover = root.querySelector("[data-cover]");
        const g = canvas.getContext("2d");
        HKUI.refreshIcons(root);
        const family = getComputedStyle(root).fontFamily || "sans-serif";

        // ── 크기 맞추기 — 측정 순간만 루트 높이를 풀고 roomFor 로 잰다 ──
        let side = 0, cell = 0, dpr = 1;
        function fit() {
          root.style.height = "";
          const room = HKPlay.roomFor(stage, boardWrap);
          root.style.height = `${stage.clientHeight}px`;
          root.classList.toggle("is-wide", stage.clientWidth >= 480);
          const s = Math.floor(Math.max(240, Math.min(stage.clientWidth, 420, room)));
          dpr = Math.min(3, window.devicePixelRatio || 1);
          if (s !== side || canvas.width !== Math.round(s * dpr)) {
            side = s;
            cell = (side - GAP * (N - 1)) / N;
            boardWrap.style.width = boardWrap.style.height = `${side}px`;
            canvas.width = canvas.height = Math.round(side * dpr);
          }
          draw(performance.now());
        }
        window.addEventListener("resize", fit);
        requestAnimationFrame(fit);

        // ── 시간 표시 ────────────────────────────────────────
        const fmtCenti = (n) => {
          n = Math.max(0, Math.round(n));
          return `${Math.floor(n / 6000)}:${String(Math.floor((n % 6000) / 100)).padStart(2, "0")}.${String(n % 100).padStart(2, "0")}`;
        };
        const fmt = (n) => (ctx.game && ctx.game.unit === "centi" ? ctx.formatScore(n) : fmtCenti(n));
        const liveMs = (now) => elapsedMs + (runFrom != null ? now - runFrom : 0);
        const scoreAt = (now) => Math.round(liveMs(now) / 10) + misses * MISS_PENALTY;
        let lastTimeText = "";
        function drawTime(now) {
          const t = fmt(scoreAt(now));
          if (t !== lastTimeText) { lastTimeText = t; timeEl.textContent = t; }
        }

        // ── 그리기 ────────────────────────────────────────────
        function rr(x, y, w, h, r) {
          g.beginPath();
          if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
          g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
        }
        function stamp(cx, cy, r, alpha, scale) {
          g.save();
          g.translate(cx, cy);
          g.rotate(-0.22);
          g.scale(scale, scale);
          g.globalAlpha = alpha;
          g.strokeStyle = C.stamp;
          g.lineWidth = 2.5;
          g.lineCap = "round";
          g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
          const w = r * 0.5;
          g.beginPath(); g.moveTo(-w, -r * 0.24); g.lineTo(w, -r * 0.24); g.moveTo(-w, r * 0.24); g.lineTo(w, r * 0.24); g.stroke();
          g.restore();
        }
        function card(x, y, bg, ink, n, L) {
          rr(x, y, cell, cell, RADIUS);
          g.fillStyle = bg; g.fill();
          g.strokeStyle = "rgba(30,41,59,.10)"; g.lineWidth = 1; g.stroke();
          // 접힌 귀
          g.save(); rr(x, y, cell, cell, RADIUS); g.clip();
          const e = Math.max(9, cell * 0.17);
          g.beginPath(); g.moveTo(x + cell - e, y); g.lineTo(x + cell, y + e); g.lineTo(x + cell - e, y + e); g.closePath();
          g.fillStyle = "rgba(30,41,59,.09)"; g.fill();
          g.restore();
          if (n) {
            g.fillStyle = ink;
            g.font = `800 ${Math.round(cell * 0.42 * FONT_SCALE[L])}px ${family}`;
            g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText(String(n), x + cell / 2, y + cell / 2 + 1);
          } else {
            // 뒤집힌 서류 — 번호 없이 줄만
            g.strokeStyle = "rgba(30,41,59,.12)"; g.lineWidth = 2; g.lineCap = "round";
            for (let k = 0; k < 3; k++) {
              const yy = y + cell * (0.38 + k * 0.14);
              g.beginPath(); g.moveTo(x + cell * 0.28, yy); g.lineTo(x + cell * (k === 2 ? 0.58 : 0.72), yy); g.stroke();
            }
          }
        }
        function doneCell(x, y) {
          rr(x + 1, y + 1, cell - 2, cell - 2, RADIUS);
          g.fillStyle = "rgba(154,52,18,.05)"; g.fill();
          stamp(x + cell / 2, y + cell / 2, cell * 0.3, 0.2, 1);
        }
        function draw(now) {
          if (!side) return;
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.fillStyle = C.desk; g.fillRect(0, 0, side, side);
          for (let c = 0; c < CELLS; c++) {
            const col = c % N, row = (c / N) | 0;
            let x = col * (cell + GAP), y = row * (cell + GAP);
            let shake = null, st = null;
            for (const a of anims) {
              if (a.cell !== c) continue;
              const p = Math.min(1, (now - a.t0) / a.dur);
              if (a.kind === "shake") shake = p; else st = p;
            }
            if (shake != null) x += Math.sin(shake * Math.PI * 4) * 4 * (1 - shake);
            const n = shown[c];
            if (!revealed) card(x, y, C.back, null, 0, 0);
            else if (n === 0) doneCell(x, y);
            else { const L = layerOf(n); card(x, y, LAYER_INFO[L].bg, LAYER_INFO[L].ink, n, L); }
            if (shake != null) { rr(x, y, cell, cell, RADIUS); g.strokeStyle = C.bad; g.lineWidth = 2.5; g.stroke(); }
            if (st != null) { const e = 1 - Math.pow(1 - st, 3); stamp(x + cell / 2, y + cell / 2, cell * 0.3, 0.95 * (0.35 + 0.65 * e), 1.6 - 0.6 * e); }
          }
        }
        function loop() {
          rafId = 0;
          const now = performance.now();
          if (state === "play") drawTime(now);
          if (anims.length) {
            draw(now);
            anims = anims.filter((a) => now - a.t0 < a.dur);
            if (!anims.length) draw(now);
          }
          if (state === "play" || anims.length) rafId = requestAnimationFrame(loop);
        }
        const kick = () => { if (!rafId) rafId = requestAnimationFrame(loop); };

        // ── HUD ──────────────────────────────────────────────
        function updateNext() {
          const L = Math.min(LAYERS - 1, Math.floor(idx / PER));
          if (idx >= TOTAL) {
            nextEl.innerHTML = HKUI.icon("stamp", 28, "#fff");
            HKUI.refreshIcons(nextEl);
            ruleEl.textContent = `다 찍었어요 · ${fmt(scoreAt(performance.now()))}`;
          } else {
            nextEl.textContent = revealed ? SEQ[idx] : "–";
            ruleEl.textContent = `${L + 1}겹 ${LAYER_INFO[L].full} · ${LAYER_INFO[L].rule}`;
          }
          progEl.textContent = idx;
          folders.forEach((f, i) => {
            f.classList.toggle("is-now", i === L && idx < TOTAL);
            f.classList.toggle("is-done", idx >= (i + 1) * PER);
          });
          if (revealed && idx < TOTAL) { nextEl.classList.remove("is-pop"); void nextEl.offsetWidth; nextEl.classList.add("is-pop"); }
        }
        function foldFolder(L) {
          const f = folders[L];
          f.classList.remove("is-fold"); void f.offsetWidth; f.classList.add("is-fold");
          f.addEventListener("animationend", () => f.classList.remove("is-fold"), { once: true });
          ctx.sfx("whoosh");
        }
        function showBanner(L) {
          if (state !== "play" || !LAYER_INFO[L]) return;
          clearTimeout(bannerTimer);
          bannerEl.hidden = true;
          bannerEl.textContent = LAYER_INFO[L].banner;
          void bannerEl.offsetWidth;
          bannerEl.hidden = false;
          ctx.sfx("powerup");
          bannerTimer = setTimeout(() => { bannerEl.hidden = true; }, 1000);
        }

        // ── 덮개 ──────────────────────────────────────────────
        function showCover(kind) {
          if (kind === "none") { cover.hidden = true; return; }
          cover.hidden = false;
          if (kind === "ready") {
            cover.innerHTML = `<span class="gm-ff__mark">${HKUI.icon("stamp", 34, "#fff")}</span>
              <h2>번호순 도장 찍기</h2>
              <p>1번부터 순서대로 서류를 눌러 도장을 찍어요.<br>25장마다 묶음이 바뀌고 결재 순서도 달라져요.</p>
              <p><span class="gm-ff__nw">모두 같은 판 · 1/100초까지 재요</span> · <span class="gm-ff__nw">잘못 누르면 +0.5초</span></p>
              <p class="gm-ff__keys">마우스 클릭 · 손가락 탭 · Esc 일시정지</p>
              ${ctx.dailyDone ? `<div class="gm-ff__note">오늘 기록은 이미 반영됐어요 · 이번 판은 연습</div>` : ""}
              <button type="button" class="gm-ff__go" data-go>${HKUI.icon("play", 18, "currentColor")} 시작</button>`;
          } else if (kind === "pause") {
            cover.innerHTML = `<h2>잠깐 쉬는 중</h2>
              <p>시간이 멈춰 있어요. 판은 가려 둘게요.</p>
              <button type="button" class="gm-ff__go" data-go>${HKUI.icon("play", 18, "currentColor")} 계속하기</button>`;
          } else if (kind === "count") {
            cover.innerHTML = `<div class="gm-ff__count" data-count></div><p class="gm-ff__keys">곧 서류가 공개돼요</p>`;
          } else if (kind === "invalid") {
            cover.innerHTML = `<span class="gm-ff__mark">${HKUI.icon("circle-x", 34, "#fff")}</span>
              <h2>기록을 남기지 못했어요</h2>
              <p>사람이 낼 수 없는 기록이라 저장하지 않았어요</p>
              <button type="button" class="gm-ff__go" data-go>${HKUI.icon("rotate-ccw", 18, "currentColor")} 다시 하기</button>`;
          }
          HKUI.refreshIcons(cover);
          const go = cover.querySelector("[data-go]");
          if (go) go.onclick = (e) => {
            if (kind === "ready") onStart(e.currentTarget);
            else if (kind === "pause") onResume();
            else if (kind === "invalid") { ctx.sfx("tap"); reset(); }
          };
        }
        function setCount(n) {
          const el = cover.querySelector("[data-count]");
          if (!el) return;
          el.textContent = n;
          el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
        }

        // ── 상태 기계 ────────────────────────────────────────
        function cancelCountdown() {
          cdGen++;
          cdTimers.forEach(clearTimeout);
          cdTimers = [];
        }
        function reset() {
          cancelCountdown();
          clearTimeout(bannerTimer);
          bannerEl.hidden = true;
          doneGen++;
          shown = numAt[0].slice();
          misses = 0; idx = 0; elapsedMs = 0; runFrom = null; practice = false; revealed = false;
          lockUntil = 0; lastDown = -1e9; lastHit = { cell: -1, t: -1e9 };
          anims = [];
          state = "ready";
          missEl.textContent = "0";
          missChip.classList.remove("is-bad", "is-flash");
          practiceChip.hidden = true;
          againBtn.hidden = true;
          lastTimeText = "";
          drawTime(performance.now());
          updateNext();
          draw(performance.now());
          showCover("ready");
        }
        async function onStart(btn) {
          if (state !== "ready") return;
          ctx.sfx("tap");
          btn.disabled = true;
          const ok = await ctx.begin(); // 오늘 첫 시작이면 true · 아니면(또는 오류) 연습
          if (state !== "ready") return;
          practice = !ok;
          practiceChip.hidden = !practice;
          countdown(START_COUNT);
        }
        function onResume() {
          if (state !== "pause") return;
          ctx.sfx("tap");
          countdown(RESUME_COUNT);
        }
        function countdown(n) {
          if (document.hidden) { state = "countdown"; pause(); return; }
          cancelCountdown();
          const gen = cdGen;
          state = "countdown";
          showCover("count");
          const tick = (k) => {
            if (gen !== cdGen) return;
            if (k > 0) {
              setCount(k);
              ctx.sfx("countdown");
              cdTimers.push(setTimeout(() => tick(k - 1), 1000));
              return;
            }
            // go — 덮개 숨김·판 공개·시간 시작을 같은 프레임에
            cdTimers = [];
            ctx.sfx("go");
            revealed = true;
            showCover("none");
            state = "play";
            runFrom = performance.now();
            updateNext();
            draw(runFrom);
            kick();
          };
          tick(n);
        }
        function pause() {
          if (state === "play") {
            const now = performance.now();
            elapsedMs += now - runFrom;
            runFrom = null;
            state = "pause";
            drawTime(now);
            showCover("pause");
          } else if (state === "countdown") {
            cancelCountdown();
            state = "pause";
            showCover("pause");
          }
        }
        function finish(now) {
          elapsedMs += now - runFrom;
          runFrom = null;
          state = "done";
          drawTime(now);
          updateNext();
          foldFolder(LAYERS - 1);
          const gen = ++doneGen;
          setTimeout(() => {
            if (gen !== doneGen || state !== "done") return;
            const score = Math.round(elapsedMs / 10) + misses * MISS_PENALTY;
            if (score < MIN_SCORE || score > MAX_SCORE) {
              ctx.sfx("fail");
              showCover("invalid");
              return;
            }
            againBtn.hidden = false;
            ctx.submit(score);
          }, 500);
        }

        // ── 입력 ──────────────────────────────────────────────
        function hit(c, now) {
          const n = SEQ[idx], L = layerOf(n);
          ctx.sfx("pop");
          shown[c] = numAt[L + 1] ? numAt[L + 1][c] : 0;
          anims.push({ cell: c, kind: "stamp", t0: now, dur: 150 });
          lastHit = { cell: c, t: now };
          idx++;
          if (idx >= TOTAL) { draw(now); kick(); finish(now); return; }
          if (idx % PER === 0) {
            foldFolder(L);
            setTimeout(() => showBanner(L + 1), 300);
          }
          updateNext();
          draw(now);
          kick();
        }
        function miss(c, now) {
          misses++;
          ctx.sfx("invalid");
          missEl.textContent = misses;
          missChip.classList.add("is-bad");
          missChip.classList.remove("is-flash"); void missChip.offsetWidth; missChip.classList.add("is-flash");
          anims.push({ cell: c, kind: "shake", t0: now, dur: MISS_LOCK_MS });
          lockUntil = now + MISS_LOCK_MS;
          drawTime(now);
          draw(now);
          kick();
        }
        canvas.addEventListener("pointerdown", (e) => {
          if (!e.isTrusted || state !== "play") return;
          e.preventDefault();
          const now = performance.now();
          if (now - lastDown < TAP_GAP_MS) return;
          lastDown = now;
          if (now < lockUntil) return;
          const r = canvas.getBoundingClientRect();
          const x = e.clientX - r.left, y = e.clientY - r.top;
          if (x < 0 || y < 0 || x >= r.width || y >= r.height) return;
          const k = r.width / side; // CSS 크기 ↔ 판 좌표 (같지만 안전하게)
          const col = Math.min(N - 1, Math.floor(x / k / (cell + GAP)));
          const row = Math.min(N - 1, Math.floor(y / k / (cell + GAP)));
          const c = row * N + col;
          if (shown[c] === 0) return;
          if (lastHit.cell === c && now - lastHit.t < SAME_CELL_MS) return;
          if (shown[c] === SEQ[idx]) hit(c, now);
          else miss(c, now);
        });
        root.querySelector("[data-pause]").onclick = () => {
          if (state !== "play" && state !== "countdown") return;
          ctx.sfx("tap");
          pause();
        };
        againBtn.onclick = () => { ctx.sfx("tap"); reset(); };

        // 키보드 — 공통 틀(캡처)이 Esc·스페이스 시작/계속하기를 맡는다. 게임은 P 와 스크롤 방지만
        window.addEventListener("keydown", (e) => {
          const t = e.target;
          if (t && t.closest && t.closest("input, textarea, select, [contenteditable]")) return;
          if (e.code === "KeyP") { if (!e.repeat) pause(); return; }
          if (state === "play" || state === "countdown") {
            if (e.code === "Space" || e.code.startsWith("Arrow") || e.code === "PageUp" || e.code === "PageDown") e.preventDefault();
          }
        });
        document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
        window.addEventListener("blur", () => pause());

        ctx.onRestart(reset);
        ctx.onPause(pause);
        reset();
      },
    });
  </script>
</body>
</html>
