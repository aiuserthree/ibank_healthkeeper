<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f8ee">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 옥상 텃밭</title>
  <meta name="description" content="출근 전에 심고 점심 · 퇴근 후에 거둬요. 회사 옥상 텃밭을 가꾸고 동료 주문을 채워 텃밭을 넓혀요.">
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <link rel="stylesheet" href="/_shared/mgmt-ui.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/mgmt.js"></script>
  <script src="/_shared/mgmt-fx.js"></script>
  <script src="/_shared/mgmt-music.js"></script>
  <script src="/_shared/farm.js"></script>
  <style>
    /* ── 옥상 텃밭 (매니지먼트) — 아이소메트릭 옥상 디오라마. 공통 부품(mgmt-ui.css .mgx-*) 위에 접두사 .fm- 로 덧입힌다 ── */
    body.mgx-body { background: #f1f8ee; }
    .fm-theme.mgx, .fm-theme {
      --mg-accent: #22b35e; --mg-accent-deep: #158a45; --mg-soft: #e2f4e4; --mg-tint: #f1f8ee; --mg-ink: #1d2b21; --mg-sub: #5e6d62; --mg-line: rgba(29, 43, 33, .09);
      --fm-soil: #6b4124; --fm-wood: #c98a4f; --fm-sky: #7cc8ff; --fm-tomato: #ef4444; --fm-paper: #fffaf0;
      word-break: keep-all;
    }
    /* 공통 css 의 `.mgx button { color: inherit }` 가 두툼한 버튼 글자색을 덮어써서 다시 정한다 */
    .fm-theme .mgx-btn { color: #fff; }
    .fm-theme .mgx-btn.is-gold { color: #3b2500; }
    .fm-theme .mgx-btn.is-soft { color: var(--mg-accent-deep); }
    .fm-theme .mgx-btn.is-white { color: var(--mg-ink); }
    .fm-theme .mgx-btn[disabled] { color: #fff; }
    .fm-theme .mgx-btn svg { flex-shrink: 0; }
    /* 같은 이유로 `font: inherit` 가 글자 굵기 · 크기를 덮어쓴다 — 단추마다 다시 정한다 */
    .fm-theme .mgx-btn { font-size: 16px; font-weight: 800; }
    .fm-theme .mgx-btn.is-sm { font-size: 14px; }
    .fm-theme .mgx-btn.is-lg { font-size: 17px; }
    .fm-theme .mgx-tab { font-size: 12px; font-weight: 800; }
    .fm-theme .mgx-ready { font-size: 12.5px; font-weight: 900; }

    .fm { min-height: 100dvh; }
    .fm-boot { display: flex; justify-content: center; padding: 120px 0; }
    .fm-msg { padding: 24px 16px; }

    /* 위 막대 */
    .fm-top .mgx-top__title { gap: 6px; }
    .fm-logo { display: inline-flex; width: 30px; height: 30px; flex-shrink: 0; }
    .fm-logo svg { width: 100%; height: 100%; }
    .fm-top__name { overflow: hidden; text-overflow: ellipsis; }
    .fm-top .mgx-chip { min-height: 24px; padding: 0 8px; font-size: 12px; }
    @media (max-width: 400px) { .fm-top .mgx-top__back { font-size: 13px; padding-right: 4px; } .fm-logo { display: none; } .fm-top .mgx-top__title { font-size: 16px; } #fm-donebadge .mgx-chip { display: none; } }

    /* 뼈대 — 휴대폰: 장면 · 행동 · 오늘 · 판 · 아래 독 / PC: 왼쪽 큰 장면 · 오른쪽 판 */
    .fm-main { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .fm-left, .fm-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .fm-right, .fm-act { padding: 0 12px; }
    @media (min-width: 960px) {
      .fm-main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start; padding: 16px 20px 40px; }
      .fm-left { position: sticky; top: 72px; }
      .fm-right, .fm-act { padding: 0; }
    }

    /* ── 장면 ── */
    .fm-stage { --sky1: #8fd3ff; --sky2: #cdeeff; --sky3: #eef8f0; border-radius: 0 0 30px 30px; padding: 62px 0 6px; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 52%, var(--sky3) 100%); box-shadow: 0 14px 34px rgba(29, 60, 40, .14); transition: background .8s ease; }
    .fm-stage.is-morning { --sky1: #a9dcff; --sky2: #fff1cf; --sky3: #f3f8ea; }
    .fm-stage.is-day { --sky1: #6cc3ff; --sky2: #c6ebff; --sky3: #eef8ef; }
    .fm-stage.is-evening { --sky1: #6a6fd6; --sky2: #ff9f73; --sky3: #ffe1b5; }
    .fm-stage.is-night { --sky1: #0e1a44; --sky2: #26356e; --sky3: #3b4a80; }
    @media (min-width: 960px) { .fm-stage { border-radius: 30px; padding-top: 70px; } }
    .fm-sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .fm-orb { position: absolute; top: 58px; right: 9%; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fffbe0, #ffe066 60%, #ffcc33); box-shadow: 0 0 0 10px rgba(255, 230, 120, .25), 0 0 40px 16px rgba(255, 220, 110, .45); }
    .is-morning .fm-orb { top: 70px; right: auto; left: 10%; background: radial-gradient(circle at 40% 38%, #fffbe8, #ffd68a 65%); }
    .is-evening .fm-orb { top: 84px; left: 12%; right: auto; width: 52px; height: 52px; background: radial-gradient(circle at 40% 38%, #fff3c4, #ff9a5c 70%); box-shadow: 0 0 50px 20px rgba(255, 140, 90, .45); }
    .is-night .fm-orb { width: 34px; height: 34px; top: 64px; right: 12%; background: transparent; box-shadow: inset -9px 4px 0 0 #fff2c2, 0 0 30px 8px rgba(255, 240, 190, .18); }
    .fm-stars { position: absolute; inset: 0 0 45% 0; opacity: 0; transition: opacity .8s ease;
      background-image: radial-gradient(1.4px 1.4px at 12% 30%, #fff, transparent), radial-gradient(1.2px 1.2px at 28% 18%, #fff, transparent), radial-gradient(1.6px 1.6px at 44% 40%, #fff, transparent), radial-gradient(1.2px 1.2px at 62% 22%, #fff, transparent), radial-gradient(1.4px 1.4px at 78% 46%, #fff, transparent), radial-gradient(1.1px 1.1px at 90% 28%, #fff, transparent), radial-gradient(1.3px 1.3px at 6% 62%, #fff, transparent), radial-gradient(1.2px 1.2px at 54% 64%, #fff, transparent);
      animation: fm-twinkle 3.6s ease-in-out infinite; }
    .is-night .fm-stars { opacity: 1; }
    @keyframes fm-twinkle { 50% { filter: brightness(.6); } }
    .fm-cloud { position: absolute; width: 120px; height: 40px; opacity: .9; filter: drop-shadow(0 4px 6px rgba(80, 120, 160, .12)); animation: fm-drift 70s linear infinite; }
    .fm-cloud.is-1 { top: 64px; left: 0; animation-delay: -12s; }
    .fm-cloud.is-2 { top: 108px; left: 0; width: 84px; opacity: .75; animation-duration: 95s; animation-delay: -60s; }
    .fm-cloud.is-3 { top: 40px; left: 0; width: 64px; opacity: .6; animation-duration: 120s; animation-delay: -30s; }
    .is-evening .fm-cloud path { fill: #ffd9c4; }
    .is-night .fm-cloud { opacity: .14; }
    @keyframes fm-drift { from { transform: translateX(-140px); } to { transform: translateX(calc(100vw + 40px)); } }
    @media (min-width: 960px) { @keyframes fm-drift { from { transform: translateX(-140px); } to { transform: translateX(780px); } } }
    .fm-birds { position: absolute; top: 96px; left: 0; width: 44px; opacity: 0; animation: fm-birds 38s linear infinite; animation-delay: -8s; }
    .fm-birds .fm-wing { animation: fm-flap .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .is-night .fm-birds { display: none; }
    .is-evening .fm-birds g { stroke: #3a2a40; }
    @keyframes fm-birds { 0% { transform: translate(-60px, 10px); opacity: 0; } 2% { opacity: .75; } 30% { transform: translate(110vw, -30px); opacity: .75; } 31%, 100% { transform: translate(110vw, -30px); opacity: 0; } }
    @keyframes fm-flap { to { transform: scaleY(.45); } }

    /* HUD 알약 */
    .fm-hud { top: 12px; left: 12px; right: 12px; gap: 6px; }
    .fm-theme .fm-pill { min-height: 38px; padding: 3px 11px 3px 3px; gap: 5px; border: 1px solid rgba(255, 255, 255, .7); font: inherit; font-size: 14px; font-weight: 900; color: var(--mg-ink); cursor: default; }
    button.fm-pill { cursor: pointer; transition: transform .14s ease; }
    button.fm-pill:active { transform: scale(.95); }
    .fm-pill b { font-weight: 900; letter-spacing: -.02em; }
    .fm-pill b small { font-size: 11.5px; font-weight: 800; color: var(--mg-sub); }
    .fm-pill__art { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; }
    .fm-pill__art svg { width: 28px; height: 28px; }
    .fm-pill__txt { display: flex; flex-direction: column; line-height: 1.05; }
    .fm-pill__txt small { font-size: 10px; font-weight: 800; color: var(--mg-sub); }
    .fm-pill__txt em { font-style: normal; font-size: 12.5px; font-weight: 900; }
    .fm-ring { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
    .fm-ring svg { width: 100%; height: 100%; display: block; }
    .fm-ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--mg-accent-deep); }
    .fm-pill.is-today { background: rgba(255, 246, 214, .9); }
    .fm-pill.is-today em { color: #b45309; }
    .fm-pill.is-full { background: rgba(255, 228, 228, .92); color: #b42318; animation: fm-nudge 2.4s ease-in-out infinite; }
    .fm-pill.is-full b small { color: #b42318; }
    .fm-pill__warn { margin-left: 4px; padding: 1px 6px; border-radius: 99px; background: #e5484d; color: #fff; font-size: 10.5px; }
    @keyframes fm-nudge { 0%, 86%, 100% { transform: none; } 90% { transform: translateX(-2px) rotate(-2deg); } 95% { transform: translateX(2px) rotate(2deg); } }
    @media (max-width: 380px) { .fm-theme .fm-pill { font-size: 13px; padding-right: 9px; } .fm-pill__art, .fm-pill__art svg { width: 24px; height: 24px; } .fm-ring { width: 28px; height: 28px; } .fm-hud { gap: 4px; left: 8px; right: 8px; } }

    /* 보드(아이소메트릭) */
    .fm-board { position: relative; z-index: 1; width: 100%; max-width: 620px; margin: 0 auto; aspect-ratio: 530 / 418; }
    .fm-board__svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; max-width: none; transition: filter .8s ease; }
    .is-evening .fm-board__svg { filter: saturate(1.08) sepia(.12); }
    .is-night .fm-board__svg { filter: brightness(.74) saturate(.85); }
    .fm-board__svg text { font-family: inherit; }
    .fm-cell { outline: none; }
    .fm-cell[role="button"] { cursor: pointer; }
    .fm-cell .fm-nohit, .fm-cell .fm-glow, .fm-cell > ellipse { pointer-events: none; }
    .fm-lift { transition: transform .16s cubic-bezier(.3, 1.4, .5, 1); }
    @media (hover: hover) { .fm-cell[role="button"]:hover .fm-lift { transform: translateY(-3px); } }
    .fm-cell[role="button"]:active .fm-lift { transform: translateY(1.5px); }
    .fm-cell:focus-visible .fm-hit polygon:first-child, .fm-cell:focus-visible .fm-nextpad { stroke: #158a45; stroke-width: 3; }
    .fm-plant { transform-box: fill-box; transform-origin: 50% 100%; animation: fm-sway 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .is-ready .fm-plant { animation: fm-sway-ripe 2.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
    @keyframes fm-sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes fm-sway-ripe { 0%, 100% { transform: rotate(-2.4deg) scale(1); } 50% { transform: rotate(2.4deg) scale(1.03); } }
    .fm-glow { opacity: .0; animation: fm-glow 1.8s ease-in-out infinite; }
    @keyframes fm-glow { 50% { opacity: .55; } }
    .fm-sparkle path { transform-box: fill-box; transform-origin: center; animation: fm-spark 1.6s ease-in-out infinite; }
    .fm-sparkle path + path { animation-delay: -.8s; }
    @keyframes fm-spark { 0%, 100% { transform: scale(.4); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
    .fm-cell.is-fresh .fm-lift { animation: fm-pop .5s cubic-bezier(.3, 1.8, .5, 1); }
    @keyframes fm-pop { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-7px); } 100% { transform: none; } }
    .fm-nextpad { fill: rgba(34, 179, 94, .16); stroke: #22b35e; stroke-width: 2; stroke-dasharray: 6 4; animation: fm-dash 1.2s linear infinite; }
    .is-wait .fm-nextpad { fill: rgba(255, 255, 255, .25); stroke: rgba(110, 95, 75, .45); animation: none; }
    @keyframes fm-dash { to { stroke-dashoffset: -20; } }
    .fm-prop { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: 50% 90%; }
    @media (hover: hover) { .fm-prop:hover { filter: brightness(1.06) drop-shadow(0 0 4px rgba(255, 255, 255, .9)); } }
    .fm-prop:focus-visible { filter: drop-shadow(0 0 0 2px #158a45) drop-shadow(0 0 3px #158a45); }
    .fm-warnbob { animation: fm-bob 1.4s ease-in-out infinite; }
    @keyframes fm-bob { 50% { transform: translateY(-4px); } }
    .fm-warnbob { transform-box: fill-box; }
    .fm-spray { animation: fm-spray .9s linear infinite; }
    @keyframes fm-spray { to { stroke-dashoffset: -18; } }
    .fm-bulb { fill: #cbd5e1; }
    .is-evening .fm-bulb, .is-night .fm-bulb { fill: #ffd76a; filter: drop-shadow(0 0 3px #ffc940); animation: fm-bulb 2.4s ease-in-out infinite; animation-delay: var(--bd); }
    @keyframes fm-bulb { 50% { opacity: .55; } }

    /* 장면 위 HTML(말풍선 · 넓히기) */
    .fm-overlay { position: absolute; inset: 0; pointer-events: none; }
    .fm-overlay > * { pointer-events: auto; }
    .fm-bubble { padding: 3px; min-width: 36px; min-height: 36px; justify-content: center; box-shadow: 0 6px 16px rgba(24, 60, 33, .25), inset 0 -2px 0 rgba(0, 0, 0, .06); }
    .fm-bubble > span:first-child { width: 30px; height: 30px; background: #fff4cf; }
    .fm-bubble svg.fm-ico { width: 28px; height: 28px; }
    .fm-bubble:active { filter: brightness(.95); }
    .fm-theme .fm-addtag { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 2px 9px 2px 2px; border: 0; border-radius: 999px; background: #fff; color: var(--mg-accent-deep); font-size: 12px; font-weight: 900; box-shadow: 0 4px 0 #cfe8d4, 0 8px 18px rgba(24, 60, 33, .18); cursor: pointer; white-space: nowrap; }
    .fm-addtag > span { display: inline-flex; align-items: center; gap: 2px; }
    .fm-addtag__ic { width: 26px; height: 26px; border-radius: 50%; justify-content: center; background: var(--mg-accent); color: #fff; }
    .fm-addtag.is-poor { color: var(--mg-sub); }
    .fm-addtag.is-wait { color: var(--mg-sub); box-shadow: 0 4px 0 #e2e0da, 0 8px 18px rgba(24, 33, 58, .12); }
    .fm-addtag.is-wait .fm-addtag__ic { background: #a8a29e; }
    .fm-addtag:active { transform: translate(-50%, -46%); box-shadow: 0 1px 0 #cfe8d4; }
    .fm-butterfly { position: absolute; z-index: 2; left: 0; top: 30%; width: 22px; pointer-events: none; animation: fm-fly-x 26s linear infinite; animation-delay: -4s; }
    .fm-butterfly > i { display: block; animation: fm-fly-y 1.8s ease-in-out infinite; }
    .fm-butterfly svg { display: block; width: 22px; }
    .fm-wings { transform-box: fill-box; transform-origin: center; animation: fm-wing .22s ease-in-out infinite alternate; }
    .is-night .fm-butterfly, .is-evening .fm-butterfly { display: none; }
    @keyframes fm-fly-x { 0% { transform: translateX(-30px); opacity: 0; } 2% { opacity: 1; } 34% { transform: translateX(min(640px, 104vw)); opacity: 1; } 35%, 100% { transform: translateX(min(640px, 104vw)); opacity: 0; } }
    @keyframes fm-fly-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes fm-wing { to { transform: scaleX(.35); } }

    /* 행동 줄 — 씨앗 고르기 가로 줄 + 큰 단추 */
    .fm-act { display: flex; flex-direction: column; gap: 10px; }
    .fm-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 6px 8px; margin: -6px -4px 0; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .fm-strip::-webkit-scrollbar { display: none; }
    .fm-theme .fm-chipseed { position: relative; flex: 0 0 auto; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 68px; min-height: 84px; padding: 6px 4px 6px; border: 0; border-radius: 18px; background: #fff; color: var(--mg-ink); box-shadow: 0 3px 0 #dde9dd, 0 6px 14px rgba(29, 60, 40, .07); cursor: pointer; transition: transform .14s ease, box-shadow .14s ease; }
    .fm-chipseed svg.fm-ico { width: 38px; height: 38px; }
    .fm-chipseed__n { font-size: 12px; font-weight: 900; letter-spacing: -.03em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .fm-chipseed__p { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 800; color: var(--mg-sub); }
    .fm-chipseed.is-on { background: var(--mg-soft); box-shadow: 0 0 0 2.5px var(--mg-accent), 0 3px 0 2px var(--mg-accent-deep); transform: translateY(-2px); }
    .fm-chipseed.is-on .fm-chipseed__n { color: var(--mg-accent-deep); }
    .fm-chipseed.is-poor .fm-chipseed__p { color: #e5484d; }
    .fm-chipseed.is-lock { cursor: default; background: rgba(255, 255, 255, .55); box-shadow: inset 0 0 0 2px rgba(29, 43, 33, .08); color: var(--mg-sub); }
    .fm-chipseed.is-lock svg.fm-ico { filter: grayscale(1) brightness(1.1); opacity: .45; }
    .fm-chipseed:not(.is-lock):active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 #dde9dd; }
    .fm-chipseed__x2 { position: absolute; top: -6px; right: -4px; padding: 1px 6px; border-radius: 99px; background: #ffb020; color: #3b2500; font-size: 10.5px; font-weight: 900; box-shadow: 0 2px 0 #d98a00; }
    .fm-act__btns { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
    .fm-act__btns .mgx-btn span { white-space: nowrap; }
    .fm-theme .fm-act__btns .mgx-btn { min-height: 58px; padding: 0 12px; gap: 6px; font-size: 16.5px; border-radius: 20px; }
    .fm-act__btns .mgx-btn svg { width: 30px; height: 30px; }
    .fm-act__btns .mgx-btn em { font-style: normal; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 99px; background: rgba(255, 255, 255, .35); font-size: 14px; line-height: 26px; }
    .fm-harvest.is-live { animation: fm-glowbtn 1.8s ease-in-out infinite; }
    @keyframes fm-glowbtn { 50% { box-shadow: 0 4px 0 var(--mg-gold-deep), 0 0 0 6px rgba(255, 190, 60, .28), 0 10px 24px rgba(255, 176, 32, .45); } }
    @media (max-width: 420px) { .fm-theme .fm-act__btns .mgx-btn { font-size: 15px; padding: 0 8px; gap: 4px; } .fm-act__btns .mgx-btn svg { width: 24px; height: 24px; } }

    /* 오늘 카드 */
    .fm-quest { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
    .fm-quest__crop, .fm-quest__task { display: flex; align-items: center; gap: 8px; min-width: 0; border-radius: 20px; padding: 8px 10px; box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 6px 16px rgba(29, 60, 40, .07); }
    .fm-quest__crop { background: linear-gradient(160deg, #fff6d8, #fff); }
    .fm-quest__crop svg.fm-ico { width: 40px; height: 40px; flex-shrink: 0; }
    .fm-quest__crop > span, .fm-quest__txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
    .fm-quest small { font-size: 11px; font-weight: 800; color: #b45309; }
    .fm-quest__crop b { font-size: 14px; font-weight: 900; white-space: nowrap; }
    .fm-quest__crop em { font-style: normal; font-size: 11.5px; font-weight: 800; color: var(--mg-sub); white-space: nowrap; }
    .fm-quest__task { background: #fff; }
    .fm-quest__txt { flex: 1; gap: 3px; }
    .fm-quest__task small { color: var(--mg-accent-deep); }
    .fm-quest__txt b { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fm-quest__txt em { display: inline-flex; align-items: center; gap: 3px; font-style: normal; font-size: 11.5px; font-weight: 800; color: var(--mg-sub); white-space: nowrap; }
    .fm-quest__txt .mgx-bar { height: 8px; }
    .fm-quest__task.is-done { background: linear-gradient(160deg, #fff4cc, #fff); }

    @keyframes fm-badge { from { transform: scale(.3) rotate(-30deg); opacity: 0; } }
    .fm-planter.is-hero { position: relative; }
    .fm-stickers { display: flex; justify-content: center; gap: 4px; padding: 10px 0 2px; }
    .fm-sticker { display: inline-flex; width: 72px; height: 72px; border-radius: 50%; background: #fff; align-items: center; justify-content: center; transform: rotate(var(--r)); box-shadow: 0 0 0 4px #fff, 0 6px 14px rgba(29, 60, 40, .2); animation: fm-badge .6s cubic-bezier(.3, 1.8, .5, 1) backwards; }
    .fm-sticker:nth-child(2) { animation-delay: .08s; } .fm-sticker:nth-child(3) { animation-delay: .16s; } .fm-sticker:nth-child(4) { animation-delay: .24s; }
    .fm-sticker svg.fm-ico { width: 54px; height: 54px; }

    /* 업무 시간 · 불러오기 실패 안내 */
    .fm-msg .hk-mg-closed { border-radius: 28px; box-shadow: 0 10px 30px rgba(29, 60, 40, .1); border: 0; }

    /* 화면이 안 보이면 멈춤 · 움직임 줄이기 */
    .fm.is-paused *, .fm.is-paused *::before { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) {
      .fm-theme *, .fm-ov * { animation: none !important; transition: none !important; }
      .fm-butterfly, .fm-birds { display: none; }
    }
    /* 자라는 칸의 남은 시간 — 칸 아래 작은 알약(겹쳐 그리는 층 #fm-overlay) */
    .fm-cdtag { display: inline-flex; align-items: center; gap: 3px; position: absolute; z-index: 4; transform: translate(-50%, -50%); padding: 2px 7px 2px 3px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1.5px rgba(34, 179, 94, .55), 0 2px 6px rgba(20, 60, 30, .22); color: #14532d; font-size: 11px; font-weight: 900; line-height: 1.35; letter-spacing: -0.02em; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
    .fm-cdtag__ring { width: 14px; height: 14px; flex: none; }
    .fm-cdtag b { font-weight: 900; }
    @media (max-width: 420px) { .fm-cdtag { font-size: 10px; padding: 1px 6px; } .fm-cdtag__ring { display: none; } }
  </style>
</head>
<body class="mgx-body">
  <div id="app"><div class="mgx mgx-shell fm fm-theme" id="fm-root"><div class="fm-boot"><span class="hk-spin"></span></div></div></div>
  <script>
    // 옥상 텃밭 — 매니지먼트 게임(key: farm). 그리는 일과 규칙은 모두 /_shared/farm.js(HKFarm) 가 맡는다.
    // 사이트 머리 메뉴 없이 꽉 찬 게임 화면으로 그린다(위 막대 「‹ 매니지먼트」로 모음에 돌아간다).
    (async () => {
      await HKUI.loadLucide();
      const profile = await HKMember.requireAuth(location.pathname + location.search + location.hash);
      if (!profile) return;
      if (window.HKMgmtMusic) HKMgmtMusic.create("farm"); // 배경음악 「옥상 텃밭의 오후」 — 머리의 음표 단추로 켜고 끈다
      HKFarm.mount(document.getElementById("fm-root"), { profile });
    })();
  </script>
</body>
