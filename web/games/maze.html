<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 깜깜한 주차장</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <script src="/_shared/play.js"></script>
  <script src="/_shared/coop-story.js"></script>
  <script src="/_shared/coop.js"></script>
  <style>
    /* 깜깜한 주차장 — 협동 시리즈 4화. 화 색(--ch-*)은 coop.js 가 .er 에 붙인다 */
    .er-hero.is-maze:not(.er-hero--story) { background: radial-gradient(60% 70% at 78% 18%, rgba(253, 224, 71, .35) 0%, rgba(253, 224, 71, 0) 60%), linear-gradient(160deg, #020617, #1e293b); }

    /* ── 진행 화면: 어두운 주차장 판 ── */
    .er-card.pk { position: relative; padding: 12px; border: 0; color: #e2e8f0;
      background: radial-gradient(120% 60% at 50% 0%, #141c30 0%, #070b14 70%); box-shadow: 0 10px 30px rgba(2, 6, 23, .28); }
    .er-card.pk.is-cctv { background: radial-gradient(120% 60% at 50% 0%, #10241a 0%, #050a07 70%); }
    /* PC — 왼쪽 지도, 오른쪽 상태 · 말 · 버튼. 휴대폰 — 위에서부터 상태 · 말 · 지도 · 버튼 */
    .pk-body { display: grid; grid-template-columns: minmax(0, 1fr) 216px; grid-template-rows: auto auto 1fr auto; gap: 10px 14px; align-items: start;
      grid-template-areas: "stage hud" "stage msg" "stage ctl" "leg ctl"; }
    .pk-hud { grid-area: hud; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .pk-body > .pk-msg { grid-area: msg; margin: 0; }
    .pk-body > .pk-stage { grid-area: stage; width: 100%; max-width: none; }
    .pk-body > .pk-ctl { grid-area: ctl; margin: 0; }
    .pk-body > .pk-legend { grid-area: leg; margin: 0; }
    .pk-role { order: -1; flex: 1 1 100%; text-align: center; }
    .pk-bat { flex: 1 1 100%; }
    .pk-bat .pk-bar { flex: 1; }
    .pk-floor { display: grid; place-items: center; flex-shrink: 0; min-width: 56px; height: 50px; padding: 0 6px; border-radius: 12px; background: #000;
      box-shadow: inset 0 0 0 2px #1f2937, 0 0 16px rgba(250, 204, 21, .16); }
    .pk-floor small { font-size: 10px; font-weight: 800; line-height: 1; color: #a16207; }
    .pk-floor b { font: 800 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, .55); }
    .pk-hud__mid { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
    .pk-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .07);
      font-size: 12.5px; font-weight: 700; color: #cbd5e1; white-space: nowrap; }
    .pk-chip b { font-size: 14px; color: #fff; font-variant-numeric: tabular-nums; }
    .pk-chip svg { flex-shrink: 0; width: 16px; height: 16px; }
    .pk-time b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pk-time.is-low b { color: #fca5a5; }
    .pk-chip.is-key { background: rgba(250, 204, 21, .16); color: #fde68a; box-shadow: inset 0 0 0 1px rgba(250, 204, 21, .45); }
    .pk-bar { position: relative; width: 42px; height: 8px; overflow: hidden; border-radius: 4px; background: rgba(255, 255, 255, .14); }
    .pk-bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: #4ade80; transition: width .3s ease; }
    .pk-bat.is-mid .pk-bar i { background: #facc15; }
    .pk-bat.is-low .pk-bar i { background: #f87171; }
    .pk-bat.is-low { color: #fecaca; animation: pk-blink 1s steps(2) infinite; }
    .pk-role { flex-shrink: 0; padding: 8px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 800; white-space: nowrap; }
    .pk-role i { font-style: normal; }
    .pk.is-walk .pk-role { background: #facc15; color: #422006; }
    .pk.is-cctv .pk-role { background: #22c55e; color: #052e16; }
    .pk-msg { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 10px; padding: 6px 12px; box-sizing: border-box; border-radius: 14px;
      background: rgba(255, 255, 255, .06); font-size: 14.5px; font-weight: 700; line-height: 1.4; color: #e2e8f0; word-break: keep-all; overflow-wrap: anywhere; }
    .pk-msg > span:last-child { min-width: 0; }
    /* 높이를 고정해 무전 · 말이 오가도 아래 버튼과 지도가 밀리지 않게 — 넘치는 글은 줄 수로 자른다 */
    .pk-body > .pk-msg { height: 118px; }
    .pk-msg__b { display: block; min-width: 0; }
    .pk-msg__t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
    .pk-msg small { display: block; overflow: hidden; font-size: 11.5px; font-weight: 800; color: #7dd3fc; white-space: nowrap; text-overflow: ellipsis; }
    .pk-msg.is-new { animation: pk-pop .55s ease; }
    @keyframes pk-pop { 0% { transform: scale(.95); filter: brightness(1.7); } 100% { transform: none; filter: none; } }
    .pk-msg.is-say { background: #1d4ed8; box-shadow: inset 0 0 0 1px #60a5fa, 0 0 18px rgba(59, 130, 246, .35); font-size: 17px; color: #fff; }
    .pk-msg.is-say small { color: #dbeafe; }
    .pk.is-cctv .pk-msg.is-say { background: #15803d; box-shadow: inset 0 0 0 1px #4ade80, 0 0 18px rgba(34, 197, 94, .3); }
    .pk.is-cctv .pk-msg.is-say small { color: #dcfce7; }
    .pk-msg.is-radio { background: rgba(14, 165, 233, .14); box-shadow: inset 0 0 0 1px rgba(56, 189, 248, .35); }
    .pk-msg.is-hint { font-weight: 600; color: #94a3b8; }
    .pk-msg__ic { display: grid; place-items: center; flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .08); font-size: 18px; }
    .pk-msg__ic svg { display: block; width: 34px; height: 34px; }
    .pk-msg.is-hint .pk-msg__ic svg { width: 20px; height: 20px; }
    .pk-stage { position: relative; max-width: 560px; margin: 0 auto; }
    .pk-canvas { width: 100%; min-height: 120px; }
    .pk-cv { display: block; margin: 0 auto; border-radius: 12px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .pk.is-walk .pk-cv { cursor: pointer; }
    .pk.is-cctv .pk-cv { cursor: crosshair; }
    .pk-stage.is-cctv { padding: 8px; border-radius: 18px; background: linear-gradient(180deg, #2b3038, #14171b);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 8px 18px rgba(0, 0, 0, .45); }
    .pk-bezel { display: flex; align-items: center; gap: 12px; padding: 2px 6px 8px; font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; color: #86efac; }
    .pk-rec { display: inline-flex; align-items: center; gap: 5px; color: #fca5a5; }
    .pk-rec i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: pk-blink 1.2s steps(2) infinite; }
    .pk-bezel span:last-child { margin-left: auto; color: #bbf7d0; }
    .pk-ctl { margin-top: 12px; }
    .pk-pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: 52px 52px; gap: 6px; justify-content: center; }
    .pk-pad button { display: grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 14px; cursor: pointer; touch-action: manipulation;
      background: linear-gradient(180deg, #223049, #151d2d); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 3px 0 #04070d; color: #facc15; font: inherit; font-size: 13px; font-weight: 800;
      transition: transform .06s ease, box-shadow .06s ease, opacity .2s; }
    .pk-pad button svg { width: 22px; height: 22px; }
    .pk-pad button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 1px 0 #04070d; }
    .pk-pad [data-move="U"], .pk-pad [data-tell^="⬆"] { grid-column: 2; grid-row: 1; }
    .pk-pad [data-move="L"], .pk-pad [data-tell^="⬅"] { grid-column: 1; grid-row: 2; }
    .pk-pad [data-move="D"], .pk-pad [data-tell^="⬇"] { grid-column: 2; grid-row: 2; }
    .pk-pad [data-move="R"], .pk-pad [data-tell^="➡"] { grid-column: 3; grid-row: 2; }
    .pk.is-held .pk-pad button { opacity: .35; }
    .pk.is-cctv .pk-pad button { color: #86efac; }
    .pk-call { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; }
    .pk-call__more { display: grid; gap: 6px; width: 100%; }
    .pk-call__more button { min-height: 40px; padding: 0 14px; border: 1px solid rgba(134, 239, 172, .35); border-radius: 999px; background: rgba(34, 197, 94, .1); color: #dcfce7; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
    .pk-call__more button:hover { background: rgba(34, 197, 94, .2); }
    .pk-call__cap { width: 100%; min-height: 17px; overflow: hidden; text-align: center; font-size: 12px; font-weight: 700; color: #86efac; white-space: nowrap; text-overflow: ellipsis; }
    .pk-call__cap.is-wait { color: #fde68a; }
    .pk-call button.is-sent { animation: pk-sent .5s ease; }
    @keyframes pk-sent { 0% { box-shadow: 0 0 0 0 rgba(134, 239, 172, .85); } 100% { box-shadow: 0 0 0 12px rgba(134, 239, 172, 0); } }
    .pk-help { margin-top: 10px; text-align: center; font-size: 12.5px; line-height: 1.55; color: #94a3b8; word-break: keep-all; }
    .pk-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: #94a3b8; }
    .pk-legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .pk-legend svg { width: 16px; height: 16px; }
    @keyframes pk-blink { 50% { opacity: .35; } }

    /* ── 대기실: 이렇게 해요 ── */
    .pk-how { padding: 14px; border-radius: 16px; background: radial-gradient(120% 80% at 80% 0%, #1b2440, #0a0f1d 70%); color: #e2e8f0; }
    .pk-how { padding: 12px; }
    .pk-how__h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 14.5px; font-weight: 900; color: #facc15; }
    .pk-how__h svg { width: 20px; height: 20px; }
    .pk-how ol { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; }
    .pk-how li { padding: 9px 10px; border-radius: 12px; background: rgba(255, 255, 255, .06); font-size: 12.5px; line-height: 1.45; color: #cbd5e1; word-break: keep-all; }
    .pk-how li b { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 13.5px; color: #fff; }
    .pk-how li b svg { flex-shrink: 0; width: 20px; height: 20px; }
    .pk-how__tip { margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: #94a3b8; word-break: keep-all; }
    .pk-how__tip b { color: #fde68a; }

    /* ── 끝 화면 ── */
    .er-end.pk-end { position: relative; overflow: hidden; padding-top: 38px; background: linear-gradient(172deg, #0b1020 0%, #1e293b 58%, #854d0e 135%); }
    .er-end.pk-end.is-great { background: linear-gradient(172deg, #0b1020 0%, #3b2f0b 55%, #ca8a04 125%); }
    .er-end.pk-end.is-fail { background: linear-gradient(172deg, #0b1020 0%, #1e293b 70%, #334155 130%); }
    .pk-end__lights { position: absolute; top: 0; right: 0; left: 0; display: flex; justify-content: space-around; padding: 0 8%; }
    .pk-end__lights i { width: 52px; height: 6px; border-radius: 0 0 6px 6px; background: #fef9c3; box-shadow: 0 0 18px 6px rgba(254, 240, 138, .5); }
    .er-enter .pk-end__lights i { animation: pk-on 1.5s ease both; }
    .er-enter .pk-end__lights i:nth-child(2) { animation-delay: .15s; }
    .er-enter .pk-end__lights i:nth-child(3) { animation-delay: .3s; }
    .er-enter .pk-end__lights i:nth-child(4) { animation-delay: .45s; }
    .er-enter .pk-end__lights i:nth-child(5) { animation-delay: .6s; }
    @keyframes pk-on { 0% { opacity: .05; } 18% { opacity: .9; } 28% { opacity: .15; } 44% { opacity: 1; } 54% { opacity: .35; } 100% { opacity: 1; } }
    .pk-end__when { font-size: 12.5px; font-weight: 800; letter-spacing: .02em; color: #fde68a; }
    .er-end.pk-end h2 { margin-top: 4px; }
    .pk-end__big { margin: 12px 0 0; font-size: 16px; font-weight: 800; color: rgba(255, 255, 255, .85); }
    .pk-end__big b { margin-right: 4px; font: 900 56px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #fde047; text-shadow: 0 0 22px rgba(253, 224, 71, .45); }
    .pk-end.is-fail .pk-end__big b { color: #e2e8f0; text-shadow: none; }
    .pk-final { text-align: center; }
    .pk-final h2 { justify-content: center; }
    .pk-final .pk-stage { max-width: 380px; }
    .pk-final p { margin: 10px 0 0; font-size: 13.5px; color: var(--text-secondary); word-break: keep-all; }
    /* 출차 기록 — 주차권 모양 */
    .pk-tickets { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .pk-ticket { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1.5px dashed #e5d39a; border-radius: 12px; background: #fffbeb; }
    .pk-ticket__f { flex-shrink: 0; min-width: 40px; padding: 5px 7px; border-radius: 8px; background: #0b1020; text-align: center; font: 900 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #facc15; }
    .pk-ticket__t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; color: #422006; }
    .pk-ticket__t small { display: block; font-size: 12px; font-weight: 600; color: #92400e; }
    .pk-ticket__s { font: 800 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #a16207; }
    .pk-empty { font-size: 13px; color: var(--text-muted); }

    @media (max-width: 640px) {
      .er-card.pk { padding: 10px; margin-left: -2px; margin-right: -2px; }
      .pk-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 8px; grid-template-areas: "hud" "msg" "stage" "ctl" "leg"; }
      .pk-hud { flex-wrap: nowrap; gap: 5px; }
      .pk-role { order: 9; flex: 0 0 auto; margin-left: auto; padding: 6px 9px; font-size: 12px; }
      .pk-role i { display: none; }
      .pk-bat { flex: 0 1 auto; }
      .pk-bat .pk-bar { flex: 0 0 auto; width: 28px; }
      .pk-floor { min-width: 46px; height: 44px; }
      .pk-floor b { font-size: 20px; }
      .pk-chip { min-height: 30px; padding: 2px 8px; font-size: 12px; gap: 4px; }
      .pk-chip.is-out { display: none; }
      .pk-chip__t { display: none; }
      .pk-msg { min-height: 44px; padding: 5px 10px; font-size: 13.5px; line-height: 1.35; }
      .pk-body > .pk-msg { height: 64px; }
      .pk-msg__t { -webkit-line-clamp: 2; }
      .pk-msg.is-say { font-size: 15px; line-height: 1.3; }
      .pk-msg__ic, .pk-msg__ic svg { width: 30px; height: 30px; }
      .pk-stage.is-cctv { padding: 6px; }
      .pk-pad { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 50px; max-width: 360px; margin: 0 auto; }
      .pk-pad [data-move], .pk-pad [data-tell] { grid-row: 1 !important; }
      .pk-pad [data-move="L"], .pk-pad [data-tell^="⬅"] { grid-column: 1 !important; }
      .pk-pad [data-move="U"], .pk-pad [data-tell^="⬆"] { grid-column: 2 !important; }
      .pk-pad [data-move="D"], .pk-pad [data-tell^="⬇"] { grid-column: 3 !important; }
      .pk-pad [data-move="R"], .pk-pad [data-tell^="➡"] { grid-column: 4 !important; }
      .pk-call { gap: 6px; }
      .pk-call .pk-pad { width: 100%; }
      .pk-call__more { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pk-call__more button { padding: 0 6px; font-size: 12px; }
      .pk-help { margin-top: 8px; font-size: 12px; }
      /* 대기실 — 준비 버튼을 먼저, 이렇게 해요는 그 아래 */
      .er-wait:has(.pk-how) { display: flex; flex-direction: column; }
      .er-wait:has(.pk-how) > .er-extra { order: 5; margin: 14px 0 0; }
      .er-wait:has(.pk-how) > .er-actions { order: 6; }
      .pk-how ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 641px) and (max-width: 860px) {
      .pk-how ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pk-bat.is-low, .pk-rec i, .pk-msg.is-new, .pk-call button.is-sent { animation: none; }
      .er-enter .pk-end__lights i { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 깜깜한 주차장 — 2인 협동(협동 시리즈 「오늘도 둘이서」 4화 · 23:30 지하주차장). 방 공용은 /_shared/coop.js
    // 한 명은 CCTV(지도 전체 · 지도를 눌러 📍 표시), 한 명은 손전등(불빛 둘레만 · 건전지)으로 차 키 → 내 차. 층마다 역할 교대.
    // 지도는 <canvas> 하나를 계속 쓴다 — 방 화면을 통째로 다시 그려도 캔버스는 새 자리로 옮겨 붙이기만 해서 움직임이 끊기지 않는다.
    // 서버가 보내는 지도 모양(tiles): '.' 길 · '#' 바깥 벽 · 'P' 기둥 · '0'~'7' 주차된 차 · 'W' 콘크리트 벽 · 'X' 공사 중 · '?' 아직 못 본 곳
    const { esc } = HKMatch;
    const Story = window.HKCoopStory || null;
    let room = null, z = null, offset = 0, tickFor = null, coop = null;
    const now = () => (Date.now() + offset) / 1000;
    const COL = (x) => String.fromCharCode(64 + x);
    const label = (x, y) => `${COL(x)}${y}`;
    const BACK = { U: "D", D: "U", L: "R", R: "L" };
    const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
    const sfx = (name) => { if (coop) coop.sfx(name); };
    const calm = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) { return false; } }; // 움직임 줄이기 — 흔들림 · 번쩍임 생략

    // ── 작은 그림(SVG) — 위 막대 · 범례 · 대기실 안내에 같이 쓴다 ──
    const IC = {
      key: `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="8" cy="12" r="4.3" fill="none" stroke="#facc15" stroke-width="2.6"/><path d="M12.2 12H21M17.6 12v3.4M20.6 12v2.6" stroke="#facc15" stroke-width="2.6" stroke-linecap="round"/></svg>`,
      car: `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="4" fill="#f59e0b"/><rect x="13.5" y="8" width="3.6" height="8" rx="1.2" fill="#1e293b"/><rect x="5.5" y="8.6" width="2.6" height="6.8" rx="1" fill="#1e293b"/><rect x="19.4" y="7.4" width="1.4" height="2.6" rx=".6" fill="#fef9c3"/><rect x="19.4" y="14" width="1.4" height="2.6" rx=".6" fill="#fef9c3"/></svg>`,
      puddle: `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><ellipse cx="12" cy="13" rx="9" ry="6" fill="#38bdf8" opacity=".75"/><ellipse cx="9.5" cy="11.5" rx="3.2" ry="1.6" fill="#e0f2fe" opacity=".8"/></svg>`,

    let hover = null;
    const seenPings = new Set();

    const PAL = {
      walk: { bg: "#010204", floor: "#394050", floor2: "#343b4a", line: "#e5e7eb", aisle: "rgba(250,204,21,.45)", wall: "#1a202b", wallEdge: "#4b5563",
        pillar: "#6b7486", pillarTop: "#9aa3b5", plate: "#f8fafc", plateText: "#0f172a", stripe: "#facc15",

      cctv: { bg: "#010703", floor: "#0f2b1c", floor2: "#0d2618", line: "#4ade80", aisle: "rgba(134,239,172,.32)", wall: "#041009", wallEdge: "#1f5135",
        pillar: "#24573a", pillarTop: "#3c8a5c", plate: "#bbf7d0", plateText: "#052e16", stripe: "#86efac",
        cars: ["#2f6346", "#3a7552", "#25503a", "#407d58", "#2b5b40", "#356c4b", "#3d7a54", "#29563d"], glass: "#04140b", text: "#3f9f68", textOn: "#bbf7d0" },

        pillar: "#dfe3ea", pillarTop: "#f8fafc", plate: "#1e293b", plateText: "#f8fafc", stripe: "#eab308",

    const hash = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

    }
    function mode() {
      if (!room || !z) return "walk";

    function layout() {
      const host = cv.parentNode;

      cv.style.width = `${geo.W}px`;
      cv.style.height = `${geo.H}px`;
    }
    function rect(x, y) {
      const { n, cs, wt, ox, oy, inner } = geo;

      const ry = y === 0 ? oy - wt : y === n - 1 ? oy + inner * cs : oy + (y - 1) * cs;

    const tileAt = (x, y) => (z && z.tiles[y] ? z.tiles[y][x] : "?");
    const open = (x, y) => tileAt(x, y) === ".";

    // 주차된 차(위에서 본 모양) — 앞(+x)에 앞유리 · 전조등, 뒤에 뒷유리 · 미등

    }
    // 바닥 · 기둥 · 차 · 벽 — 바뀔 때만 다시 그려 두는 바탕
    function renderBase(md) {
      const P = PAL[md];
      const { n, cs, W, H } = geo;
      const c = bg;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, W, H);
      c.fillStyle = P.bg; c.fillRect(0, 0, W, H);

          }

      TELL.at = performance.now();
      HKApi.coopSay(id, tellText(list))
        .then((next) => { TELL.retry = 0; if (room && room.id === id) coop.set(next); })
        .catch((e) => {
          if (e && e.code === "ESCAPE_TOO_FAST" && TELL.retry < 4) { // 대화창에서 막 보낸 말과 겹쳤다 — 잠깐 뒤 다시
            TELL.retry += 1;
            TELL.buf = (TELL.buf[0] === STOP ? TELL.buf : [...list, ...TELL.buf]).slice(-TELL_MAX);
            TELL.at = performance.now();
          } else { TELL.retry = 0; HKUI.toast((e && e.message) || "보내지 못했어요", "error"); }
        })
        .finally(() => { TELL.busy = false; capSync(); flushTell(); });
    }
    let pingAt = -Infinity;
    async function ping(x, y) {
      if (!room || room.status !== "PLAYING" || !z || z.role !== "cctv") return;
      const t = performance.now();
      if (t - pingAt < 750) { FX.floats.push({ text: "잠깐만요", x, y, t0: t, color: "#fdba74" }); return; }
      pingAt = t;
      FX.taps.push({ x, y, t0: t });
      sfx("tap");
      try { coop.set(await HKApi.coopAct(room.id, "ping", { x, y })); }
      catch (e) { if (!/천천히/.test(e.message || "")) HKUI.toast(e.message || "표시하지 못했어요", "error"); }
    }

    // ── 방이 바뀔 때 — 효과 · 소리 ──
    function syncSeen(v) {
      seenPings.clear();
      (v && v.pings || []).forEach((p) => seenPings.add(p.id));
      lastNote = v && v.note ? v.note.id : null;
      lastRadio = v && v.radio ? v.radio.id : null;
    }
    function onView(old, v) {
      const tms = performance.now();
      const walk = v.role === "walk";
      if (v.level > old.level) {
        const mine = v.role === "walk";
        FX.banner = { t0: tms, dur: 2.6, title: `${old.floor} 탈출!`, sub: mine ? `역할 교대 — 이번엔 내가 손전등으로 ${v.floor}` : `역할 교대 — 이번엔 내가 CCTV로 ${v.floor}`, color: "#fde047" };
        FX.trail = [];
        A.x = null; A.pend = null; A.pface = null; A.r = v.light;
        sfx("success");
        setTimeout(() => sfx("swap"), 380);
      } else {
        const st = v.stats || {}, os = old.stats || {};
        if ((st.catches || 0) > (os.catches || 0)) {
          FX.flash = { t0: tms, color: "rgba(239,68,68,A)" };
          FX.banner = { t0: tms, dur: 2, title: "삐빅! 순찰 로봇", sub: "승강기 앞으로 돌아가요", color: "#f87171" };
          FX.trail = [];
          sfx("hurt");
        }
        if ((v.slips || 0) > (old.slips || 0)) {
          FX.rings.push({ x: v.pos[0], y: v.pos[1], t0: tms, color: "rgba(125,211,252,A)" });
          FX.floats.push({ text: "미끄덩!", x: v.pos[0], y: v.pos[1], t0: tms, color: "#7dd3fc" });
          sfx("whoosh");
        }
        if (v.hasKey && !old.hasKey) {
          FX.sparks.push({ x: v.pos[0], y: v.pos[1], t0: tms, seed: Math.random(), color: "rgba(250,204,21," });
          FX.floats.push({ text: "차 키!", x: v.pos[0], y: v.pos[1], t0: tms, color: "#fde047" });
          sfx("coin");
        }
        if ((st.bats || 0) > (os.bats || 0)) {
          FX.sparks.push({ x: v.pos[0], y: v.pos[1], t0: tms, seed: Math.random(), color: "rgba(74,222,128," });
          FX.floats.push({ text: "🔋 반짝!", x: v.pos[0], y: v.pos[1], t0: tms, color: "#86efac" });
          sfx("powerup");
        }
        const dx = v.pos[0] - old.pos[0], dy = v.pos[1] - old.pos[1];
        if (Math.abs(dx) + Math.abs(dy) === 1) {
          FX.trail.push({ x: old.pos[0], y: old.pos[1], dir: { "1,0": "R", "-1,0": "L", "0,1": "D", "0,-1": "U" }[`${dx},${dy}`], t0: tms, level: v.level });
          if (FX.trail.length > 16) FX.trail.shift();
          if (walk) sfx("land");
        }
      }
      if (v.note && v.note.id !== lastNote) {
        const n = v.note, at = n.at || v.pos;
        if (["wall", "pillar", "car"].includes(n.kind)) {
          FX.shake = tms;
          FX.floats.push({ text: n.kind === "car" ? "삐뽀삐뽀!" : n.kind === "pillar" ? "쿵! 기둥" : "쿵!", x: v.pos[0], y: v.pos[1], t0: tms, color: n.kind === "car" ? "#fbbf24" : "#fca5a5" });
          if (n.kind === "car") FX.alarms.push({ x: at[0], y: at[1], t0: tms });
          if (walk) sfx(n.kind === "car" ? "invalid" : "hit");
        } else if (n.kind === "locked") {
          FX.floats.push({ text: "잠겨 있어요 — 차 키부터!", x: v.pos[0], y: v.pos[1], t0: tms, color: "#fca5a5" });
          sfx("invalid");
        }
      }
      lastNote = v.note ? v.note.id : lastNote;
      (v.pings || []).forEach((p) => {
        if (seenPings.has(p.id)) return;
        seenPings.add(p.id);
        if (walk) sfx("select"); // 표시 자체에 칸 이름표가 붙어 있다
      });
      if (v.radio && v.radio.id !== lastRadio) lastRadio = v.radio.id;
    }

    // ── 끝 화면 ──
    function tierOf(r) {
      if (!r) return "fail";
      const ok = Story && Story.cleared ? Story.cleared(r) : r.status === "CLEAR" && Number(r.score) > 0;
      if (!ok) return "fail";
      return Number(r.score) >= 3 ? "great" : "ok";
    }
    function endCard(ctx) {
      const r = ctx.room, t = tierOf(r), n = Number(r.score || 0);
      const last = z && z.done.length ? z.done[z.done.length - 1].floor : "B1";
      const copy = {
        great: ["불이 다시 들어왔어요!", `B1부터 ${esc(last)}까지 ${n}층을 빠져나왔어요. 층마다 역할을 바꿔 가며 끝까지 길을 맞췄어요.`],
        ok: ["무사히 빠져나왔어요", `${n}층을 빠져나왔어요. 깜깜해도 말로 길을 맞추니 차가 보였어요.`],
        fail: ["불이 들어왔어요", "이번엔 차까지 못 갔어요. 다음엔 차 키부터 같이 찾아봐요."],
      }[t];
      return `<div class="er-end pk-end is-${t}">
          <div class="pk-end__lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="pk-end__when">23:33 · 지하주차장</div>
          <h2>${copy[0]}</h2>
          <div class="pk-end__big"><b>${n}</b>층 탈출</div>
          <p>${copy[1]}</p>
        </div>`;
    }
    function finalHtml() {
      if (!z || !room || room.status !== "CLEAR") return "";
      const where = z.hasKey ? "차 키는 주웠는데, 내 차까지 조금 남았어요." : "🔑 차 키와 🚗 내 차가 여기 있었어요.";
      return `<div class="er-card pk-final"><h2>💡 불이 들어온 ${esc(z.floor)}</h2>
          <div class="pk-stage is-final"><div class="pk-canvas" id="pk-canvas" role="img" aria-label="불이 들어온 마지막 층 지도"></div></div>
          <p>${where}</p></div>`;
    }

    // ── 바뀐 칸만 고치기(patch) ──
    // 걸음 · 표시 · 대화 · 무전이 올 때마다 화면을 통째로 다시 그리면 누르고 있던 방향 버튼 · 빠른 말 버튼이 새 요소로
    // 바뀌어 그 누름이 사라진다. 같은 층 · 같은 역할이면 위 막대 · 안내 줄 · 못 움직임 표시 · 대화 목록만 그 자리에서 고친다.
    let hudSig = "", chatSig = "";
    const hudKey = () => (z ? `${z.role}|${z.floor}|${z.cleared}|${z.hasKey}|${Math.round(z.bat)}` : "");
    function syncHud() {
      const el = document.querySelector(".pk-hud");
      if (!el || !z) return;
      const key = hudKey();
      if (key === hudSig) return;
      hudSig = key;
      el.outerHTML = hudHtml();
    }
    function syncHeld() {
      const card = document.querySelector(".er-card.pk");
      if (card && z) card.classList.toggle("is-held", z.role === "walk" && z.stunUntil > now());
    }
    // 대화 목록 — 공용 coop.js 의 대화 칸(#er-chat)과 같은 모양으로 목록만 다시 채운다(입력 칸 · 빠른 말 버튼은 그대로)
    function chatKey() {
      const tail = (a) => (a && a.length ? `${a.length}:${a[a.length - 1].t}` : "0");
      return room ? `${tail(room.log)}|${tail(room.chat)}` : "";
    }
    function syncChat() {
      const box = document.getElementById("er-chat");
      if (!box || !room) return;
      const key = chatKey();
      if (key === chatSig) return;
      chatSig = key;
      const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      const items = [
        ...(room.log || []).map((l) => ({ t: l.t, html: `<div class="er-msg is-log">${esc(l.text)}</div>` })),
        ...(room.chat || []).map((c) => ({ t: c.t, html: `<div class="er-msg ${c.me ? "is-me" : ""}"><small>${esc(c.name)}</small>${esc(c.text)}</div>` })),
      ].sort((a, b) => (a.t < b.t ? -1 : a.t > b.t ? 1 : 0));
      box.innerHTML = items.map((x) => x.html).join("") || `<div class="er-msg is-log">하고 싶은 말을 여기에 적어 알려 주세요</div>`;
      if (stick) box.scrollTop = box.scrollHeight;
    }
    function patchPlay(prev) {
      const pz = prev && prev.maze;
      if (!z || !pz || pz.level !== z.level || pz.role !== z.role) return false; // 층 · 역할이 바뀌면 통째로
      const host = document.getElementById("pk-canvas");
      if (!host || cv.parentNode !== host || !document.querySelector(".pk-hud") || !document.getElementById("pk-msg")) return false;
      syncHud();
      syncMsg();
      syncHeld();
      syncChat();
      capSync();
      return true;
    }

    // ── 대기실 — 이렇게 해요 ──
    function howHtml() {
      return `<div class="pk-how">
          <div class="pk-how__h">${IC.flash} 이렇게 해요</div>
          <ol>
            <li><b>${IC.cctv}CCTV</b>전체가 보여요. 지도를 누르면 동료 화면에 📍 표시가 떠요.</li>
            <li><b>${IC.battery}손전등</b>둘레만 보여요. 걸으면 건전지가 닳으니 주워서 채워요.</li>
            <li><b>${IC.key}차 키 → 내 차</b>키를 줍고 차에 닿으면 다음 층. 층마다 역할 교대!</li>
            <li><b>${IC.robot}조심해요</b>💧 웅덩이는 미끄덩. B3부터 순찰 로봇이 돌아요.</li>
          </ol>
          <div class="pk-how__tip">기둥마다 <b>D4</b> 같은 이름표가 있어요. 「D4 기둥 오른쪽!」처럼 말해 보세요. 걷기는 지도를 누르거나 밀어서, PC는 방향키로도 돼요.</div>
        </div>`;
    }

    coop = HKCoop.mount({
      room: "parking",
      listName: "주차장 목록",
      heroClass: "is-maze",
      tickMs: 100,
      hero: {
        facts: ["2인 협동", "3분", "CCTV · 손전등", "층마다 역할 교대", "B3부터 순찰 로봇", "끝까지 하면 오늘 도장"],
        note: "한 명은 CCTV로 주차장 전체를, 한 명은 손전등으로 불빛 둘레만 봐요. CCTV는 지도를 눌러 📍 표시를 보낼 수 있어요. Teams 통화를 켜고 하면 더 쉬워요.",
      },
      rankTitle: "탈출 층수 순위",
      rankNote: "같은 두 사람은 가장 많이 내려간 한 판만 올라요.",
      rankText: (x) => `${x.score}층`,
      recentText: (r) => (r.status === "CLEAR" ? (Number(r.score) > 0 ? [`${r.score}층 탈출`, "is-clear"] : ["0층", "is-fail"]) : ["포기", "is-fail"]),
      failTitle: "중간에 그만뒀어요",
      quick: ["⬆️ 위로", "⬇️ 아래로", "⬅️ 왼쪽", "➡️ 오른쪽", "✋ 멈춰!", "📍 표시한 곳으로", "🤖 로봇 지나가면 가", "💧 웅덩이 조심", "🔋 건전지 근처야", "🔑 키 거의 다 왔어", "🚗 차가 코앞이야"],
      remain: () => (z ? z.end - now() : null),
      readyNote: (ctx) => (ctx.room.sideName === "먼저 걷기"
        ? "첫 층(B1)은 <b>내가 손전등</b>을 들고 걸어요. 불빛 둘레만 보이니 CCTV 쪽 안내와 📍 표시를 따라가요."
        : "첫 층(B1)은 <b>내가 CCTV</b>예요. 지도를 눌러 📍 표시를 보내고, 방향 버튼으로 길을 알려 줘요. 💧 웅덩이는 동료 눈에 안 보여요!"),
      readyExtra: () => howHtml(),
      reset: () => {
        tickFor = null; queue.length = 0; inflight = null; localRadio = null; warned30 = false;
        clearTimeout(TELL.timer); TELL.timer = 0; TELL.buf = []; TELL.retry = 0;
        hudSig = ""; chatSig = ""; msgSig = ""; pulsed = null;
        A.x = null; A.r = null; A.pend = null; A.pface = null;
        FX.banner = null; FX.floats = []; FX.rings = []; FX.sparks = []; FX.alarms = []; FX.trail = []; FX.flash = null; FX.taps = []; FX.lightsOn = 0;
      },
      changed: (prev, next) => {
        const old = z;
        if (next.status === "PLAYING" && (!prev || prev.status !== "PLAYING" || prev.id !== next.id)) scrollSoon = true;
        room = next;
        z = next.maze || null;
        if (z) offset = z.now * 1000 - Date.now();
        if (!z) return;
        if (!old || !prev || prev.id !== next.id) { syncSeen(z); syncPulsed(); return; }
        if (prev.status === "PLAYING" && next.status === "CLEAR") FX.lightsOn = performance.now();
        if (next.status === "PLAYING") onView(old, z);
        else syncSeen(z);
      },
      patch: (prev) => patchPlay(prev),
      play: () => playHtml(),
      side: () => (z ? ticketsHtml() : ""),
      end: (ctx) => endCard(ctx),
      failEnd: (ctx) => {
        const c = (z && z.cleared) || Number(ctx.room.score) || 0;
        return `<div class="er-end pk-end is-fail"><div class="pk-end__when">지하주차장</div><h2>중간에 그만뒀어요</h2>
          <p>${c ? `${c}층까지 빠져나왔어요. ` : ""}문 반장님이 비상등을 켜 줬어요. 다음엔 끝까지 같이 가요.</p></div>`;
      },
      stats: (ctx) => {
        if (!z) return [];
        const s = z.stats || {};
        return [
          { label: "탈출한 층", value: `${s.cleared ?? ctx.room.score ?? 0}층` },
          { label: "가장 빠른 층", value: s.best != null ? `${Number(s.best).toFixed(1)}초` : "–" },
          { label: "걸음", value: `${s.steps || 0}걸음` },
          { label: "미끄덩", value: `${s.slips || 0}번` },
          { label: "로봇에 닿음", value: `${s.catches || 0}번` },
          { label: "CCTV 표시", value: `${s.pings || 0}번` },
        ];
      },
      storyTier: (ctx) => tierOf(ctx.room),
      after: () => finalHtml(),
      painted: () => {
        const host = document.getElementById("pk-canvas");
        if (!host || !z) return;
        if (cv.parentNode !== host) host.appendChild(cv);
        // 통째로 그린 지금 모습을 기준으로 적어 둔다(다음 patch 에서 바뀐 칸만 고치게)
        hudSig = hudKey();
        chatSig = chatKey();
        if (room.status === "PLAYING") syncMsg();
        cv.style.touchAction = room && room.status === "PLAYING" && z.role === "walk" ? "none" : "manipulation";
        fit();
        draw(performance.now());
        if (scrollSoon && room.status === "PLAYING") {
          scrollSoon = false;
          const card = document.querySelector(".er-card.pk");
          if (card && window.innerWidth <= 640) {
            const top = card.getBoundingClientRect().top + window.scrollY - 6;
            if (Math.abs(window.scrollY - top) > 20) window.scrollTo({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
          }
        }
      },
      tick: (ctx) => {
        if (!room || room.status !== "PLAYING" || !z) return;
        const left = z.end - now();
        if (left < 30 && left > 0 && !warned30) {
          warned30 = true;
          localRadio = { t: now(), text: "전기 복구까지 30초쯤 남았대요. 불 들어오기 전에 한 층만 더!" };
          sfx("countdown");
        }
        syncMsg();
        const clock = document.getElementById("pk-clock");
        if (clock) clock.textContent = storyClock();
        const tm = document.getElementById("pk-time");
        if (tm) { tm.textContent = HKCoop.mmss(Math.max(0, left)); tm.parentNode.classList.toggle("is-low", left < 30); }
        syncHeld();
        const due = [z.nextAt, robotDue()].filter((t) => t != null).reduce((a, b) => Math.min(a, b), Infinity);
        if (due !== Infinity && now() >= due + 0.05 && tickFor !== due) {
          tickFor = due;
          HKApi.coopTick(room.id).then((next) => ctx.set(next)).catch(() => { tickFor = null; });
        }
      },
      click: async (t, ctx) => {
        if (t.dataset.move) return move(ctx, t.dataset.move);
        if (t.dataset.tell) return tell(t.dataset.tell, t);
      },
    });
    // 방향키 · WASD — 입력 칸에 글을 쓰는 중이거나 확인 창이 떠 있으면 건드리지 않는다.
    // 글쇠 자리(e.code)로 읽어서 한글 입력 상태(ㅈㅁㄴㅇ)에서도 WASD 로 걷는다
    const CODES = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R", KeyW: "U", KeyS: "D", KeyA: "L", KeyD: "R" };
    const KEYS = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R", w: "U", s: "D", a: "L", d: "R", W: "U", S: "D", A: "L", D: "R", "ㅈ": "U", "ㄴ": "D", "ㅁ": "L", "ㅇ": "R" };
    const keyDir = (e) => CODES[e.code] || KEYS[e.key] || null;
    const modalOpen = () => !!document.querySelector(".hk-dialog__overlay, [role='dialog'], [aria-modal='true'], dialog[open]");
    document.addEventListener("keydown", (e) => {
      if (e.target && e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const dir = keyDir(e);
      if (!dir || !walking() || modalOpen()) return;
      e.preventDefault();
      move(coop, dir, e.repeat);
    });
    // 키를 떼면 누르고 있는 동안 줄 선 반복 걸음은 버린다
    document.addEventListener("keyup", (e) => { if (keyDir(e)) dropRepeats(); });
  </script>
</body>
</html>
