<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>커피 나르기 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    .gm-cf { --gm-a: #92400e; --gm-b: #fbbf24; display: flex; flex-direction: column; gap: 8px; align-self: center; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    .gm-cf-hud { display: flex; align-items: center; flex-wrap: nowrap; gap: 8px; height: 36px; min-width: 0; overflow: hidden; }
    .gm-cf-chip { display: inline-flex; align-items: center; gap: 4px; height: 100%; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: #fff; border: 1px solid #e3e8ef; font-size: 14px; color: #0b3558; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; flex: 0 1 auto; overflow: hidden; }
    .gm-cf-chip b { font-size: 17px; }
    .gm-cf-chip svg, .gm-cf-chip i { flex: none; }
    .gm-cf-chip--score { background: linear-gradient(135deg, var(--gm-a), #d97706); color: #fff; border-color: transparent; }
    .gm-cf-chip--life { margin-left: auto; flex: none; gap: 2px; padding: 0 10px; }
    .gm-cf-heart { display: inline-flex; color: #ef4444; transition: opacity .2s, transform .2s; }
    .gm-cf-heart.is-off { opacity: .22; color: #94a3b8; transform: scale(.85); }
    .gm-cf-bar { display: flex; align-items: center; gap: 8px; height: 22px; font-size: 12.5px; font-weight: 700; color: #78350f; white-space: nowrap; }
    .gm-cf-gauge { position: relative; flex: 1; height: 12px; border-radius: 999px; background: #fdf3dc; border: 1px solid #f3dfb2; overflow: hidden; }
    .gm-cf-gauge i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #f59e0b, var(--gm-b)); transition: width .25s; }
    .gm-cf-gauge.is-boost i { background: linear-gradient(90deg, #f97316, #fde047); transition: none; }
    .gm-cf-combo { min-width: 64px; text-align: right; color: #b45309; font-variant-numeric: tabular-nums; }
    .gm-cf-combo.is-off { color: #94a3b8; font-weight: 600; }
    .gm-cf-board { position: relative; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #fbf4e8; box-shadow: 0 1px 3px rgba(15,23,42,.08); touch-action: manipulation; }
    .gm-cf-board canvas { display: block; touch-action: manipulation; cursor: pointer; }
    .gm-cf-toast { position: absolute; z-index: 2; top: 8px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 20px); box-sizing: border-box; padding: 6px 14px; border-radius: 999px; background: rgba(69,26,3,.82); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .15s; }
    .gm-cf-toast.is-on { opacity: 1; }
    .gm-cf-over { position: absolute; inset: 0; z-index: 3; display: flex; padding: 16px; box-sizing: border-box; background: rgba(69,26,3,.34); overflow: auto; }
    .gm-cf-over[hidden] { display: none; }
    .gm-cf-card { width: 100%; max-width: 350px; margin: auto; box-sizing: border-box; background: #fff; border-radius: 16px; padding: 22px 20px; text-align: center; box-shadow: 0 12px 32px rgba(15,23,42,.18); }
    .gm-cf-card h2 { margin: 6px 0 6px; font-size: 22px; color: #0b3558; }
    .gm-cf-card p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; color: #475569; word-break: keep-all; overflow-wrap: anywhere; }
    .gm-cf-card .hk-btn { width: 100%; margin-top: 12px; }
    .gm-cf-badge { display: inline-flex; width: 52px; height: 52px; border-radius: 14px; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); }
    .gm-cf-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 12px 0 0; padding: 12px; border-radius: 12px; background: #fdf6ea; text-align: left; font-size: 13px; color: #334155; }
    .gm-cf-keys dt { font-weight: 700; color: #78350f; }
    .gm-cf-keys dd { margin: 0; word-break: keep-all; }
    .gm-cf-sub { font-size: 13px; }
    .gm-cf-reason { margin: 2px 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #78350f; }
    .gm-cf-big { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 2px; color: var(--gm-a); line-height: 1.1; }
    .gm-cf-big small { font-size: 18px; font-weight: 700; margin-left: 2px; }
    .gm-cf.is-compact .gm-cf-hud { gap: 5px; }
    .gm-cf.is-compact .gm-cf-chip { padding: 0 9px; font-size: 13px; }
    .gm-cf.is-compact .gm-cf-chip b { font-size: 15px; }
    .gm-cf.is-compact .gm-cf-chip--score svg, .gm-cf.is-compact .gm-cf-chip--score i { display: none !important; }
    .gm-cf.is-tight .gm-cf-chip { padding: 0 7px; }
    .gm-cf.is-small .gm-cf-over { padding: 8px; }
    .gm-cf.is-small .gm-cf-card { padding: 12px 12px; }
    .gm-cf.is-small .gm-cf-card h2 { font-size: 18px; margin: 2px 0 4px; }
    .gm-cf.is-small .gm-cf-card p { font-size: 12.5px; line-height: 1.45; margin-bottom: 4px; }
    .gm-cf.is-small .gm-cf-badge { display: none; }
    .gm-cf.is-small .gm-cf-keys { margin-top: 6px; padding: 8px 10px; gap: 4px 8px; }
    .gm-cf.is-small .gm-cf-card .hk-btn { margin-top: 8px; }
    .gm-cf.is-small .gm-cf-big { font-size: 30px; }
    .gm-cf.is-mini .gm-cf-keys { display: none; }
    @media (max-width: 640px) {
      .gm-cf { gap: 6px; }
      .gm-cf-hud { height: 32px; }
    }
    @media (max-width: 480px) {
      .gm-cf-over { padding: 10px; }
      .gm-cf-card { padding: 16px 14px; }
      .gm-cf-card h2 { font-size: 19px; margin: 4px 0; }
      .gm-cf-card p { font-size: 13px; line-height: 1.5; }
      .gm-cf-sub { font-size: 12.5px; }
      .gm-cf-badge { width: 42px; height: 42px; border-radius: 12px; }
      .gm-cf-keys { font-size: 12px; padding: 10px; margin-top: 8px; }
      .gm-cf-card .hk-btn { margin-top: 10px; }
      .gm-cf-reason { font-size: 21px; }
      .gm-cf-big { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "coffee",
    setup(stage, ctx) {
      // ───────────────────────── 화면 뼈대
      const heart = `<span class="gm-cf-heart">${HKUI.icon("heart", 15, "currentColor", "fill:currentColor")}</span>`;
      stage.innerHTML = `<div class="gm-cf">
        <div class="gm-cf-hud">
          <span class="gm-cf-chip gm-cf-chip--score">${HKUI.icon("coffee", 16, "#fff")}<b id="gm-cf-score">0</b>점</span>
          <span class="gm-cf-chip">웨이브 <b id="gm-cf-wave">1</b></span>
          <span class="gm-cf-chip gm-cf-chip--life" id="gm-cf-life" aria-label="생명">${heart}${heart}${heart}</span>
        </div>
        <div class="gm-cf-bar">
          <span>활력</span>
          <span class="gm-cf-gauge" id="gm-cf-gauge"><i></i></span>
          <span class="gm-cf-combo is-off" id="gm-cf-combo">콤보 0</span>
        </div>
        <div class="gm-cf-board" id="gm-cf-board">
          <canvas id="gm-cf-canvas"></canvas>
          <div class="gm-cf-toast" id="gm-cf-toast" role="status"></div>
          <div class="gm-cf-over" id="gm-cf-over" hidden></div>
        </div>
      </div>`;
      HKUI.refreshIcons(stage);

      const $ = (s) => stage.querySelector(s);
      const root = $(".gm-cf");
      const boardEl = $("#gm-cf-board");
      const canvas = $("#gm-cf-canvas");
      const g = canvas.getContext("2d");
      const over = $("#gm-cf-over");
      const toastEl = $("#gm-cf-toast");
      const hudScore = $("#gm-cf-score"), hudWave = $("#gm-cf-wave"), hudLife = $("#gm-cf-life"), hudGauge = $("#gm-cf-gauge"), hudCombo = $("#gm-cf-combo");
      const FONT = getComputedStyle(document.body).fontFamily || "sans-serif";

      // ───────────────────────── 상수 (위치는 레인 길이 0~1 — 화면 크기와 상관없이 같은 속도)
      const LANES = 4, LIVES = 3, MAX_SCORE = 1000000;
      const CUP_SPEED = 1.15;      // 보낸 잔: 레인 끝까지 약 0.9초
      const SEND_GAP = 200;        // 연달아 보내기 최소 간격(ms)
      const DRINK_MS = 1100;       // 마시는 시간
      const PUSH = 0.16;           // 커피를 받으면 밀려나는 거리
      const BOOST_MS = 6000, BOOST_SLOW = 0.45;
      const GAUGE_PER = 1 / 8;     // 8잔 서빙하면 카페인 부스트
      const COL_A = "#92400e", COL_B = "#fbbf24";
      const SHIRTS = ["#60a5fa", "#34d399", "#f472b6", "#a78bfa", "#fb923c", "#2dd4bf", "#f87171", "#818cf8"];
      const HAIRS = ["#3f2a1d", "#1f2937", "#6b3f1f", "#111827", "#7c4a24"];

      // 웨이브별 수치 — 1웨이브는 레인 끝에서 카운터까지 약 17초
      const waveOf = (w) => ({
        count: 6 + 2 * w,                                   // 8, 10, 12, 14 …
        walk: Math.min(0.15, 0.06 * Math.pow(1.1, w - 1)),  // 초당 레인 길이 비율
        gap: Math.max(0.85, 2.7 * Math.pow(0.87, w - 1)),   // 등장 간격(초)
        lanes: Math.min(LANES, w + 1),                      // 사람이 오는 레인 수 2→3→4
        sleepy: Math.min(0.35, 0.1 * (w - 1)),              // 졸린 동료 비율
        double: w === 1 ? 0.12 : Math.min(0.3, 0.12 + 0.04 * (w - 1)),
        back: Math.min(0.42, 0.28 * Math.pow(1.05, w - 1)), // 빈 잔 돌아오는 속도
      });

      const fmt = (n) => Number(n).toLocaleString("ko-KR");
      const rand = (a, b) => a + Math.random() * (b - a);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      // ───────────────────────── 상태
      let state = "ready"; // ready | go | play | paused | count | over
      let lives, score, wave, W, spawnList, spawnT, phase, phaseT, freezeT, freezeMsg;
      let people, cups, empties, fx, gauge, boostT, combo, maxCombo, served, caught, lastSend;
      let lane, laneY, pourT, grace, phaseCount, countStep, overT, hudCache = "", waveLanes;
      let anim = 0, last = null;
      let bw = 0, bh = 0, dpr = 1, laneH = 0, cz = 0, barX0 = 0, barLen = 0, unit = 0;

      const live = () => state === "play" || state === "go" || state === "count";
      const xOf = (p) => barX0 + p * barLen;
      const boosting = () => boostT > 0;

      // ───────────────────────── 초기화
      function reset() {
        lives = LIVES; score = 0; wave = 0;
        people = []; cups = []; empties = []; fx = [];
        gauge = 0; boostT = 0; combo = 0; maxCombo = 0; served = 0; caught = 0;
        lastSend = -1e9; lane = 1; laneY = 1; pourT = 0;
        grace = { cup: 1, empty: 1 }; // 1웨이브의 첫 실수는 봐준다 (규칙 익히기)
        freezeT = 0; freezeMsg = null; overT = 0; phaseT = 0; countStep = 0;
        spawnList = []; spawnT = 0;
        nextWave();
        toastEl.classList.remove("is-on");
        hudCache = "";
        updateHud();
      }

      function nextWave() {
        wave++;
        W = waveOf(wave);
        // 이번 웨이브에 사람이 오는 레인 — 무작위로 고른다
        const all = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
        waveLanes = all.slice(0, W.lanes).sort();
        spawnList = [];
        for (let i = 0; i < W.count; i++) {
          const r = Math.random();
          const sleepy = i > 1 && r < W.sleepy;
          const double = !sleepy && i > 2 && Math.random() < W.double;
          spawnList.push({ sleepy, need: double ? 2 : 1 });
        }
        spawnT = 0.6;
        phase = "intro"; phaseT = 0;
      }

      // ───────────────────────── 크기
      function resize() {
        root.style.width = "";
        const sw = stage.clientWidth;
        const avail = HKPlay.roomFor(stage, boardEl);
        bw = Math.max(260, Math.min(560, sw));
        bh = Math.max(160, avail);
        root.style.width = bw + "px";
        root.classList.toggle("is-compact", bw < 400);
        root.classList.toggle("is-tight", bw < 300);
        root.classList.toggle("is-small", bh < 440);
        root.classList.toggle("is-mini", bh < 360);
        boardEl.style.width = canvas.style.width = bw + "px";
        boardEl.style.height = canvas.style.height = bh + "px";
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(bw * dpr);
        canvas.height = Math.round(bh * dpr);
        laneH = bh / LANES;
        unit = Math.min(laneH * 0.82, bw * 0.3);         // 사람·잔 크기 기준
        cz = Math.max(76, Math.round(bw * 0.22));   // 왼쪽 카운터(탕비실) 폭
        barX0 = cz + unit * 0.08;
        barLen = bw - 8 - barX0;
        draw();
      }

      // ───────────────────────── 입력
      function moveTo(l) {
        l = Math.max(0, Math.min(LANES - 1, l));
        if (l !== lane) { lane = l; ctx.sfx("tap"); }
      }
      function send() {
        if (state !== "play" || freezeT > 0) return;
        if (phase !== "run") { toast("동료가 오면 보내요"); return; }
        if (anim - lastSend < SEND_GAP) return;
        lastSend = anim;
        pourT = 160;
        cups.push({ lane, p: 0 });
        ctx.sfx("whoosh");
      }

      const KEYMAP = { ArrowUp: -1, KeyW: -1, ArrowDown: 1, KeyS: 1 };
      const SENDKEYS = { ArrowRight: 1, KeyD: 1, Enter: 1, NumpadEnter: 1, Space: 1 };
      const NUMKEYS = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
      function onKey(e) {
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
        if (document.querySelector(".hk-dialog__overlay")) return;
        const mv = KEYMAP[e.code], sd = SENDKEYS[e.code], nk = NUMKEYS[e.code];
        const arrow = e.code.startsWith("Arrow");
        if (!live()) {
          // 시작·일시정지·끝 화면: 방향키 스크롤만 막는다 (스페이스·Enter 는 공통 틀과 버튼 몫)
          if (arrow) e.preventDefault();
          return;
        }
        if (mv != null || sd || nk != null || arrow) e.preventDefault();
        if (state !== "play" || (e.repeat && (sd || nk != null))) return;
        if (mv != null) moveTo(lane + mv);
        else if (nk != null) { moveTo(nk); send(); }
        else if (sd) send();
      }
      window.addEventListener("keydown", onKey);

      // 판 누르기 — 레인을 누르면 그 레인으로 가서 보내기, 왼쪽 카운터를 누르면 자리만 옮기기
      canvas.addEventListener("pointerdown", (e) => {
        if (state !== "play") return;
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const l = Math.max(0, Math.min(LANES - 1, Math.floor(y / laneH)));
        moveTo(l);
        if (x > cz) send();
      });
      boardEl.addEventListener("touchstart", (e) => { if (live() && e.target === canvas) e.preventDefault(); }, { passive: false });
      document.documentElement.style.overscrollBehaviorY = "contain";
      document.body.style.overscrollBehaviorY = "contain";

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && live()) pause();
      });

      // ───────────────────────── 겹침 화면 · 토스트
      function showOver(html) {
        over.innerHTML = html;
        over.hidden = false;
        HKUI.refreshIcons(over);
      }
      function hideOver() { over.hidden = true; over.innerHTML = ""; }
      let toastTimer = null;
      function toast(text, ms = 1300) {
        toastEl.textContent = text;
        toastEl.classList.add("is-on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("is-on"), ms);
      }

      function showReady() {
        state = "ready";
        showOver(`<div class="gm-cf-card">
          <span class="gm-cf-badge">${HKUI.icon("coffee", 26, "#fff")}</span>
          <h2>커피 나르기</h2>
          <p>레인을 골라 커피를 밀어 다가오는 동료에게 건네요</p>
          <p class="gm-cf-sub">동료가 카운터에 닿거나 잔이 깨지면 생명 −1<br>다 마신 빈 잔은 그 레인에 서 있으면 받아요</p>
          <p class="gm-cf-sub"><b style="color:#b45309">2</b> 뱃지 동료는 두 잔 · 졸린 동료는 걸음이 빨라요</p>
          <dl class="gm-cf-keys">
            <dt>PC</dt><dd>↑↓ 레인 이동 · → 또는 Enter 보내기 · 1~4 그 레인에 바로 보내기</dd>
            <dt>모바일</dt><dd>레인 누르기 = 보내기 · 왼쪽 카운터 누르기 = 자리만 옮기기</dd>
          </dl>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-cf-start">${HKUI.icon("play", 16, "#fff")} 커피 타임 시작</button>
        </div>`);
        over.querySelector("#gm-cf-start").onclick = start;
      }

      function start() {
        reset();
        hideOver();
        state = "go";
        phaseCount = 0;
        last = null;
        ctx.sfx("go");
        if (ctx.started) ctx.started();
      }

      function pause() {
        if (!live()) return;
        state = "paused";
        ctx.sfx("tap");
        showOver(`<div class="gm-cf-card">
          <span class="gm-cf-badge">${HKUI.icon("pause", 26, "#fff")}</span>
          <h2>잠깐 멈춤</h2>
          <p>동료들도 커피잔도 그 자리에 멈춰 있어요.</p>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-cf-resume">${HKUI.icon("play", 16, "#fff")} 계속하기</button>
          <p class="gm-cf-sub" style="margin:10px 0 0">Esc·스페이스로도 이어 할 수 있어요</p>
        </div>`);
        over.querySelector("#gm-cf-resume").onclick = resume;
      }
      function resume() {
        if (state !== "paused") return;
        hideOver();
        state = "count";
        phaseCount = 0; countStep = 0;
        last = null;
        ctx.sfx("countdown");
      }

      function gameOver() {
        if (state === "over") return;
        state = "over";
        overT = 0;
        ctx.sfx("lose");
        const final = Math.min(MAX_SCORE, Math.max(0, Math.round(score)));
        setTimeout(() => {
          if (state !== "over") return;
          showOver(`<div class="gm-cf-card">
            <div class="gm-cf-reason">커피 타임 끝!</div>
            <p class="gm-cf-sub">${wave}웨이브까지 버텼어요</p>
            <div class="gm-cf-big">${fmt(final)}<small>점</small></div>
            <p>서빙 <b style="color:#0b3558">${served}잔</b> · 빈 잔 <b style="color:#0b3558">${caught}개</b> · 최대 콤보 <b style="color:#0b3558">${maxCombo}</b></p>
            <button type="button" class="hk-btn hk-btn--primary" id="gm-cf-again">${HKUI.icon("rotate-ccw", 16, "#fff")} 다시 하기</button>
          </div>`);
          over.querySelector("#gm-cf-again").onclick = start;
          ctx.submit(final);
        }, 900);
      }

      ctx.onRestart(() => start());
      ctx.onPause(() => state === "play" && pause());

      // ───────────────────────── 규칙
      function addScore(n, x, y, color) {
        score = Math.min(MAX_SCORE, score + n);
        fx.push({ kind: "text", text: `+${fmt(n)}`, x, y, t: 0, color: color || COL_A });
      }

      function spawnOne() {
        const s = spawnList.shift();
        // 오른쪽 끝이 붐비는 레인은 피한다
        const ok = waveLanes.filter((l) => !people.some((p) => p.lane === l && p.st !== "leave" && p.p > 0.86));
        const l = pick(ok.length ? ok : waveLanes);
        people.push({
          lane: l, p: 1.06, st: "walk", t: 0, need: s.need, double: s.need === 2, sleepy: s.sleepy,
          shirt: pick(SHIRTS), hair: pick(HAIRS), phase: Math.random() * 6, pushTo: 0, mood: 0,
        });
      }

      function loseLife(msg, x, laneIdx) {
        lives--;
        combo = 0;
        freezeT = 900;
        freezeMsg = { text: msg, x, lane: laneIdx };
        ctx.sfx("hurt");
        // 숨 돌릴 틈 — 걸어오던 동료들이 한 걸음씩 물러난다
        for (const p of people) if (p.st === "walk") p.p = Math.min(1.02, p.p + 0.12);
      }

      function serve(person, cup) {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        served++;
        const mult = 1 + 0.1 * Math.min(combo - 1, 10);
        const base = 100 + Math.round(100 * Math.max(0, Math.min(1, person.p)));
        const x = xOf(person.p), y = person.lane * laneH + laneH * 0.3;
        addScore(Math.round(base * mult), x, y);
        person.need--;
        person.st = "push"; person.t = 0;
        person.pushTo = Math.min(1.02, person.p + PUSH);
        person.mood = 1;
        if (person.need <= 0 && person.double) {
          addScore(300, x, y - unit * 0.28, "#b45309");
          toast("두 잔 완성! +300");
        }
        gauge = Math.min(1, gauge + GAUGE_PER);
        if (gauge >= 1 && !boosting()) {
          gauge = 0; boostT = BOOST_MS;
          toast("카페인 부스트! 6초 동안 모두 느려져요", 1800);
          ctx.sfx("powerup");
        } else if (combo >= 2) ctx.sfx("combo", Math.min(10, combo - 1));
        else ctx.sfx("coin");
        if (combo >= 5 && combo % 5 === 0) toast(`콤보 ×${combo}!`);
      }

      function update(dt) {
        const s = dt / 1000;
        if (boostT > 0) boostT = Math.max(0, boostT - dt);
        const slow = boosting() ? BOOST_SLOW : 1;

        // 웨이브 단계
        phaseT += dt;
        if (phase === "intro" && phaseT >= 1600) { phase = "run"; phaseT = 0; }
        if (phase === "run") {
          if (spawnList.length) {
            spawnT -= s * slow;
            if (spawnT <= 0) { spawnOne(); spawnT = W.gap * rand(0.75, 1.25); }
          } else if (!people.length && !cups.length && !empties.length) {
            const bonus = 300 * wave;
            score = Math.min(MAX_SCORE, score + bonus);
            phase = "clear"; phaseT = 0;
            toast(`${wave}웨이브 클리어! +${fmt(bonus)}`, 1700);
            ctx.sfx("line");
          }
        }
        if (phase === "clear" && phaseT >= 1900) nextWave();

        // 보낸 잔
        for (let i = cups.length - 1; i >= 0; i--) {
          const c = cups[i];
          c.p += CUP_SPEED * s;
          let hit = null;
          for (const p of people) if (p.lane === c.lane && p.st === "walk" && c.p >= p.p - 0.05 && (!hit || p.p < hit.p)) hit = p;
          if (hit) { cups.splice(i, 1); serve(hit, c); continue; }
          if (c.p >= 1.04) {
            cups.splice(i, 1);
            fx.push({ kind: "shard", x: bw - 14, y: c.lane * laneH + laneH * 0.72, t: 0 });
            ctx.sfx("hit");
            if (wave === 1 && grace.cup > 0) { grace.cup--; combo = 0; toast("빈 레인에 보낸 잔은 깨져요 · 다음부터 생명 −1", 2200); continue; }
            loseLife("커피가 바닥에 쨍그랑!", bw - 30, c.lane);
            return;
          }
        }

        // 빈 잔
        for (let i = empties.length - 1; i >= 0; i--) {
          const e = empties[i];
          e.p -= e.v * s * (boosting() ? 0.6 : 1);
          if (e.p <= 0) {
            empties.splice(i, 1);
            if (e.lane === lane) {
              caught++;
              addScore(50, barX0 + unit * 0.1, e.lane * laneH + laneH * 0.36, "#0f766e");
              gauge = Math.min(1, gauge + 0.04);
              ctx.sfx("pop");
            } else {
              fx.push({ kind: "shard", x: barX0, y: e.lane * laneH + laneH * 0.72, t: 0 });
              ctx.sfx("hit");
              if (wave === 1 && grace.empty > 0) { grace.empty--; combo = 0; toast("빈 잔은 그 레인에 서 있어야 받아요 · 다음부터 생명 −1", 2200); continue; }
              loseLife("빈 잔을 놓쳤어요!", barX0 + 10, e.lane);
              return;
            }
          }
        }

        // 동료
        for (let i = people.length - 1; i >= 0; i--) {
          const p = people[i];
          p.t += dt;
          if (p.st === "walk") {
            // 바로 앞에서 마시는 동료가 있으면 기다린다
            const blocked = people.some((q) => q !== p && q.lane === p.lane && (q.st === "push" || q.st === "drink") && q.p < p.p && p.p - q.p < 0.11);
            if (!blocked) p.p -= W.walk * (p.sleepy ? 1.55 : 1) * slow * s;
            if (p.p <= 0.02) {
              p.st = "angry"; p.t = 0; p.mood = -1;
              loseLife("커피 아직이에요?", xOf(0.02), p.lane);
              return;
            }
          } else if (p.st === "push") {
            p.p += (p.pushTo - p.p) * Math.min(1, s * 12);
            if (p.t >= 260) { p.st = "drink"; p.t = 0; }
          } else if (p.st === "drink") {
            if (p.t >= DRINK_MS) {
              empties.push({ lane: p.lane, p: Math.min(0.98, p.p), v: W.back });
              p.t = 0;
              p.st = p.need > 0 ? "walk" : "leave";
              p.mood = p.need > 0 ? 0 : 1;
            }
          } else if (p.st === "leave") {
            p.p += 0.38 * s;
            if (p.p > 1.15) people.splice(i, 1);
          } else if (p.st === "angry") {
            if (p.t > 200) p.p += 0.5 * s;
            if (p.p > 1.15) people.splice(i, 1);
          }
        }
      }

      // 생명 −1 정지 동안: 화난 동료만 퇴장 연출 없이 그대로, 끝나면 정리
      function endFreeze() {
        freezeMsg = null;
        people = people.filter((p) => p.st !== "angry");
        if (lives <= 0) gameOver();
      }

      // ───────────────────────── HUD
      function updateHud() {
        const gw = boosting() ? boostT / BOOST_MS : gauge;
        const key = `${score}|${wave}|${lives}|${combo}|${Math.round(gw * 100)}|${boosting()}`;
        if (key === hudCache) return;
        hudCache = key;
        hudScore.textContent = fmt(score);
        hudWave.textContent = wave;
        hudLife.querySelectorAll(".gm-cf-heart").forEach((h, i) => h.classList.toggle("is-off", i >= lives));
        hudGauge.firstElementChild.style.width = (gw * 100).toFixed(1) + "%";
        hudGauge.classList.toggle("is-boost", boosting());
        hudCombo.textContent = boosting() ? "부스트!" : combo >= 2 ? `콤보 ×${combo}` : `콤보 ${combo}`;
        hudCombo.classList.toggle("is-off", combo < 2 && !boosting());
      }

      // ───────────────────────── 그리기
      function rr(x, y, w, h, r) {
        g.beginPath();
        if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
      }
      function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }

      const barTopOf = (l) => l * laneH + laneH * 0.68;

      function drawLaneBg(l) {
        const y0 = l * laneH, bt = barTopOf(l);
        // 벽
        g.fillStyle = l % 2 ? "#fbf1df" : "#fdf6ea";
        g.fillRect(0, y0, bw, laneH);
        // 벽 장식: 창문(작게)
        const wy = y0 + laneH * 0.12, wh = Math.min(laneH * 0.26, unit * 0.32);
        if (wh > 14) {
          for (const fx0 of [0.42, 0.78]) {
            const wx = cz + (bw - cz) * fx0 - wh * 0.8;
            g.fillStyle = "rgba(146,64,14,.07)"; rr(wx, wy, wh * 1.6, wh, 5); g.fill();
            g.fillStyle = "rgba(255,255,255,.7)"; rr(wx + 3, wy + 3, wh * 1.6 - 6, wh - 6, 3); g.fill();
            g.fillStyle = "rgba(146,64,14,.08)"; g.fillRect(wx + wh * 0.8 - 1, wy + 3, 2, wh - 6);
          }
        }
        // 이 레인에 빈 잔이 가까이 오는데 내가 없으면 왼쪽에 경고
        const near = empties.some((e) => e.lane === l && e.p < 0.4);
        if (near && lane !== l && state !== "over") {
          const a = 0.18 + 0.12 * Math.sin(anim / 90);
          g.fillStyle = `rgba(239,68,68,${a})`; g.fillRect(0, y0, cz, laneH);
        }
        // 바(긴 사무실 책상) — 동료가 걷는 레인
        const sh = Math.max(5, laneH * 0.07), fh = Math.max(10, laneH * 0.17);
        g.fillStyle = "#e7c49a"; rr(cz - 4, bt, bw - cz + 8, sh + 2, 4); g.fill();
        g.fillStyle = "#b9824f"; g.fillRect(cz - 4, bt + sh, bw - cz + 8, fh);
        g.fillStyle = "rgba(0,0,0,.08)"; g.fillRect(cz - 4, bt + sh, bw - cz + 8, 2);
        // 책상 다리 홈(나뭇결 느낌)
        g.fillStyle = "rgba(120,53,15,.18)";
        for (let x = cz + 40; x < bw - 10; x += 70) g.fillRect(x, bt + sh + 4, 2, fh - 8);
        // 바닥 그림자
        g.fillStyle = "rgba(146,64,14,.06)"; g.fillRect(0, bt + sh + fh, bw, y0 + laneH - (bt + sh + fh));
        // 레인 사이 선
        if (l > 0) { g.fillStyle = "rgba(146,64,14,.12)"; g.fillRect(0, y0, bw, 1); }
      }

      function drawCounter(l) {
        const y0 = l * laneH, bt = barTopOf(l);
        // 탕비실 카운터 (왼쪽)
        g.fillStyle = "#7c3a10"; rr(4, bt - 2, cz - 6, y0 + laneH - bt - 4, 8); g.fill();
        g.fillStyle = "#9a4a16"; rr(4, bt - 4, cz - 6, Math.max(6, laneH * 0.07), 6); g.fill();
        // 레인 번호
        g.fillStyle = "rgba(255,255,255,.85)";
        g.font = `700 ${Math.max(11, Math.min(15, laneH * 0.11))}px ${FONT}`;
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(String(l + 1), 4 + (cz - 6) / 2, bt + (y0 + laneH - bt) / 2 + 1);
      }
      function drawMachine(l) {
        const bt = barTopOf(l);
        // 커피 머신 (카운터 위 왼쪽)
        const mw = Math.min(cz * 0.36, unit * 0.34), mh = Math.min(laneH * 0.44, unit * 0.5);
        const mx = 9, my = bt - 4 - mh;
        g.fillStyle = "#cbd5e1"; rr(mx, my, mw, mh, 5); g.fill();
        g.fillStyle = "#64748b"; rr(mx, my, mw, mh * 0.28, [5, 5, 0, 0]); g.fill();
        g.fillStyle = "#334155"; g.fillRect(mx + mw * 0.3, my + mh * 0.42, mw * 0.4, mh * 0.12);
        g.fillStyle = "#f59e0b"; circle(mx + mw * 0.75, my + mh * 0.14, Math.max(1.5, mw * 0.07)); g.fill();
      }

      function drawCup(x, baseY, sz, full, tilt) {
        const w = sz * 0.5, h = sz * 0.52;
        g.save();
        g.translate(x, baseY);
        if (tilt) g.rotate(tilt);
        // 손잡이
        g.strokeStyle = full ? "#fff" : "#e2e8f0"; g.lineWidth = Math.max(2, sz * 0.09);
        g.beginPath(); g.arc(w * 0.52, -h * 0.55, h * 0.22, -Math.PI / 2, Math.PI / 2); g.stroke();
        // 잔
        g.fillStyle = full ? "#ffffff" : "#f1f5f9";
        rr(-w / 2, -h, w, h, [2, 2, sz * 0.14, sz * 0.14]); g.fill();
        g.strokeStyle = full ? "rgba(146,64,14,.35)" : "rgba(100,116,139,.45)"; g.lineWidth = 1; g.stroke();
        // 띠
        g.fillStyle = full ? COL_B : "#cbd5e1"; g.fillRect(-w / 2, -h * 0.55, w, h * 0.16);
        // 커피 윗면
        if (full) {
          g.fillStyle = "#6b3410"; g.beginPath(); g.ellipse(0, -h, w / 2 - 1, Math.max(1.5, h * 0.11), 0, 0, Math.PI * 2); g.fill();
        }
        g.restore();
        // 김
        if (full) {
          g.strokeStyle = "rgba(148,163,184,.55)"; g.lineWidth = Math.max(1.2, sz * 0.05); g.lineCap = "round";
          for (const k of [-1, 1]) {
            const sx = x + k * w * 0.18, t0 = anim / 260 + k;
            g.beginPath();
            g.moveTo(sx, baseY - h - 2);
            g.quadraticCurveTo(sx + Math.sin(t0) * sz * 0.1, baseY - h - sz * 0.2, sx, baseY - h - sz * 0.36);
            g.stroke();
          }
        }
      }

      function drawPerson(p) {
        const s = unit;
        const bt = barTopOf(p.lane);
        const x = xOf(p.p);
        const walking = p.st === "walk" || p.st === "leave" || (p.st === "angry" && p.t > 200);
        const spd = p.sleepy ? 1.5 : 1;
        const ph = anim / 1000 * 9 * spd + p.phase;
        const bob = walking ? Math.abs(Math.sin(ph)) * s * 0.035 : 0;
        const face = p.st === "leave" || (p.st === "angry" && p.t > 200) ? 1 : -1; // -1: 왼쪽(카운터)을 봄
        const hr = s * 0.15, bodyW = s * 0.4, bodyH = s * 0.36;
        const by = bt + s * 0.04 - bob; // 몸 아래(책상 뒤에 가려짐)
        const hy = by - bodyH - hr * 0.78;
        // 그림자 없음(책상 뒤) · 몸
        g.fillStyle = p.shirt; rr(x - bodyW / 2, by - bodyH, bodyW, bodyH + s * 0.1, [s * 0.16, s * 0.16, 4, 4]); g.fill();
        // 사원증 줄
        g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = Math.max(1, s * 0.02);
        g.beginPath(); g.moveTo(x - bodyW * 0.18, by - bodyH + 2); g.lineTo(x, by - bodyH * 0.4); g.lineTo(x + bodyW * 0.18, by - bodyH + 2); g.stroke();
        g.fillStyle = "#fff"; rr(x - s * 0.05, by - bodyH * 0.42, s * 0.1, s * 0.08, 2); g.fill();
        // 팔
        const swing = walking ? Math.sin(ph) * s * 0.05 : 0;
        g.fillStyle = p.shirt;
        const armY = by - bodyH + s * 0.08;
        const drinking = p.st === "drink" || p.st === "push";
        if (drinking) {
          // 잔 들고 마시기
          const cx = x + face * hr * 1.05, cy = hy + hr * 0.75;
          g.strokeStyle = p.shirt; g.lineWidth = s * 0.08; g.lineCap = "round";
          g.beginPath(); g.moveTo(x + face * bodyW * 0.35, armY); g.lineTo(cx, cy + s * 0.06); g.stroke();
          drawCup(cx, cy + s * 0.12, s * 0.34, p.st === "push" || p.t < DRINK_MS * 0.6, face * 0.35);
        } else {
          g.strokeStyle = p.shirt; g.lineWidth = s * 0.08; g.lineCap = "round";
          g.beginPath(); g.moveTo(x - bodyW * 0.42, armY); g.lineTo(x - bodyW * 0.5 + swing, armY + s * 0.17); g.stroke();
          g.beginPath(); g.moveTo(x + bodyW * 0.42, armY); g.lineTo(x + bodyW * 0.5 - swing, armY + s * 0.17); g.stroke();
        }
        // 머리
        g.fillStyle = "#f8d9bd"; circle(x, hy, hr); g.fill();
        // 머리카락
        g.fillStyle = p.hair;
        g.beginPath(); g.arc(x, hy, hr, Math.PI * 1.05, Math.PI * 1.95); g.closePath(); g.fill();
        g.beginPath(); g.ellipse(x - face * hr * 0.55, hy - hr * 0.35, hr * 0.5, hr * 0.42, 0, 0, Math.PI * 2); g.fill();
        // 눈
        const ex = x + face * hr * 0.32, ey = hy + hr * 0.12, eg = hr * 0.36;
        g.strokeStyle = "#1f2937"; g.fillStyle = "#1f2937"; g.lineWidth = Math.max(1.3, s * 0.022); g.lineCap = "round";
        if (p.st === "drink") {
          // 눈 감고 음미
          for (const k of [-1, 1]) { g.beginPath(); g.arc(ex + k * eg, ey, hr * 0.12, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
        } else if (p.sleepy && p.st !== "leave") {
          for (const k of [-1, 1]) { g.beginPath(); g.moveTo(ex + k * eg - hr * 0.13, ey); g.lineTo(ex + k * eg + hr * 0.13, ey); g.stroke(); }
        } else {
          for (const k of [-1, 1]) { circle(ex + k * eg, ey, Math.max(1.4, hr * 0.1)); g.fill(); }
        }
        // 볼 · 입
        g.fillStyle = p.mood < 0 ? "rgba(239,68,68,.55)" : "rgba(251,113,133,.35)";
        circle(ex + face * eg * 1.4, ey + hr * 0.32, hr * 0.15); g.fill();
        g.lineWidth = Math.max(1.2, s * 0.02);
        if (p.mood > 0 && p.st !== "drink") { g.beginPath(); g.arc(ex, ey + hr * 0.3, hr * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
        else if (p.mood < 0) { g.beginPath(); g.arc(ex, ey + hr * 0.56, hr * 0.18, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
        else if (p.st !== "drink") { g.fillStyle = "#7f1d1d"; g.beginPath(); g.ellipse(ex, ey + hr * 0.45, hr * 0.07, hr * 0.09, 0, 0, Math.PI * 2); g.fill(); }
        // 졸음 표시 Zz
        if (p.sleepy && p.st === "walk") {
          g.fillStyle = "#6366f1";
          g.font = `800 ${Math.max(10, hr * 0.8)}px ${FONT}`; g.textAlign = "left"; g.textBaseline = "alphabetic";
          const zt = (anim / 700 + p.phase) % 1;
          g.globalAlpha = 1 - zt * 0.6;
          g.fillText("z", x + hr * 0.75, hy - hr * 0.8 - zt * hr * 0.6);
          g.font = `800 ${Math.max(8, hr * 0.55)}px ${FONT}`;
          g.fillText("z", x + hr * 1.3, hy - hr * 1.3 - zt * hr * 0.6);
          g.globalAlpha = 1;
        }
        // 두 잔 뱃지
        if (p.double && p.need > 0 && p.st !== "leave") {
          const br = Math.max(8, hr * 0.5), bx = x - hr * 0.2, byy = hy - hr - br * 0.9;
          g.fillStyle = COL_A; circle(bx, byy, br + 1.5); g.fill();
          g.fillStyle = COL_B; circle(bx, byy, br); g.fill();
          g.fillStyle = "#78350f"; g.font = `800 ${Math.round(br * 1.3)}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText(String(p.need), bx, byy + 1);
        }
      }

      function drawBarista() {
        const s = unit;
        const l = laneY;
        const bt = l * laneH + laneH * 0.68;
        const hr = s * 0.15, bodyW = s * 0.42, bodyH = s * 0.36;
        const x = cz - bodyW / 2 - 2;
        const by = bt + s * 0.06;
        const hy = by - bodyH - hr * 0.78;
        // 몸(앞치마)
        g.fillStyle = "#ffffff"; rr(x - bodyW / 2, by - bodyH, bodyW, bodyH + 6, [s * 0.16, s * 0.16, 4, 4]); g.fill();
        g.fillStyle = COL_A; rr(x - bodyW * 0.36, by - bodyH * 0.72, bodyW * 0.72, bodyH * 0.72 + 6, [s * 0.06, s * 0.06, 2, 2]); g.fill();
        g.fillStyle = COL_B; circle(x, by - bodyH * 0.45, s * 0.03); g.fill();
        // 팔 — 보낼 때 앞으로
        const reach = pourT > 0 ? 1 : 0;
        g.strokeStyle = "#ffffff"; g.lineWidth = s * 0.08; g.lineCap = "round";
        const ay = by - bodyH + s * 0.08;
        g.beginPath(); g.moveTo(x + bodyW * 0.4, ay); g.lineTo(x + bodyW * (0.55 + 0.35 * reach), ay + s * (0.15 - 0.1 * reach)); g.stroke();
        g.beginPath(); g.moveTo(x - bodyW * 0.4, ay); g.lineTo(x - bodyW * 0.5, ay + s * 0.17); g.stroke();
        // 머리
        g.fillStyle = "#f8d9bd"; circle(x, hy, hr); g.fill();
        // 모자
        g.fillStyle = COL_A;
        g.beginPath(); g.arc(x, hy - hr * 0.1, hr * 1.02, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
        g.fillRect(x - hr * 0.2, hy - hr * 0.32, hr * 1.35, hr * 0.2);
        // 눈 · 웃음
        const ex = x + hr * 0.3, ey = hy + hr * 0.15;
        g.fillStyle = "#1f2937";
        circle(ex - hr * 0.33, ey, Math.max(1.4, hr * 0.1)); g.fill();
        circle(ex + hr * 0.33, ey, Math.max(1.4, hr * 0.1)); g.fill();
        g.strokeStyle = "#1f2937"; g.lineWidth = Math.max(1.2, s * 0.02);
        g.beginPath(); g.arc(ex, ey + hr * 0.25, hr * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
        g.fillStyle = "rgba(251,113,133,.35)"; circle(ex + hr * 0.5, ey + hr * 0.32, hr * 0.14); g.fill();
      }

      function drawBubble(text, x, l) {
        const y = l * laneH + laneH * 0.14;
        g.font = `800 ${Math.max(12, Math.min(16, laneH * 0.12))}px ${FONT}`;
        g.textAlign = "center"; g.textBaseline = "middle";
        const tw = g.measureText(text).width, ph = Math.max(26, laneH * 0.2);
        let bx = Math.max(6 + tw / 2 + 12, Math.min(bw - 6 - tw / 2 - 12, x));
        g.fillStyle = "#fff"; g.strokeStyle = "#ef4444"; g.lineWidth = 2;
        rr(bx - tw / 2 - 12, y, tw + 24, ph, ph / 2); g.fill(); g.stroke();
        g.fillStyle = "#dc2626"; g.fillText(text, bx, y + ph / 2 + 1);
      }

      function draw() {
        if (!bw || !people) return;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (let l = 0; l < LANES; l++) drawLaneBg(l);
        // 레인별: 동료(책상 뒤) → 책상 앞면 다시 → 잔 → 카운터 · 바리스타
        for (let l = 0; l < LANES; l++) {
          const bt = barTopOf(l), sh = Math.max(5, laneH * 0.07), fh = Math.max(10, laneH * 0.17);
          const list = people.filter((p) => p.lane === l).sort((a, b) => b.p - a.p);
          for (const p of list) drawPerson(p);
          // 책상 윗면·앞면을 다시 그려 사람 아랫부분을 가린다
          g.fillStyle = "#e7c49a"; rr(cz - 4, bt, bw - cz + 8, sh + 2, 4); g.fill();
          g.fillStyle = "#b9824f"; g.fillRect(cz - 4, bt + sh, bw - cz + 8, fh);
          g.fillStyle = "rgba(120,53,15,.18)";
          for (let x = cz + 40; x < bw - 10; x += 70) g.fillRect(x, bt + sh + 4, 2, fh - 8);
          // 잔 (책상 윗면 위)
          for (const c of cups) if (c.lane === l) drawCup(xOf(c.p), bt + sh * 0.7, unit * 0.42, true, 0);
          for (const e of empties) if (e.lane === l) drawCup(xOf(e.p), bt + sh * 0.7, unit * 0.4, false, 0);
          drawMachine(l);
          if (l === Math.round(laneY)) drawBarista();
          drawCounter(l);
        }
        // 효과
        for (const f of fx) {
          if (f.kind === "text") {
            g.globalAlpha = Math.max(0, 1 - f.t);
            g.fillStyle = f.color;
            g.font = `800 ${Math.max(13, unit * 0.17)}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
            g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 3;
            const ty = f.y - f.t * unit * 0.35;
            const half = g.measureText(f.text).width / 2 + 4, tx = Math.max(half, Math.min(bw - half, f.x));
            g.strokeText(f.text, tx, ty); g.fillText(f.text, tx, ty);
            g.globalAlpha = 1;
          } else if (f.kind === "shard") {
            g.fillStyle = "#94a3b8";
            for (let k = 0; k < 6; k++) {
              const a = (k / 6) * Math.PI * 2 + 0.4, d = f.t * unit * 0.4;
              g.globalAlpha = Math.max(0, 1 - f.t);
              g.save(); g.translate(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d * 0.6 - f.t * 6); g.rotate(a + f.t * 4);
              g.fillRect(-3, -2, 6, 4); g.restore();
            }
            g.globalAlpha = 1;
          }
        }
        // 카페인 부스트: 화면이 살짝 따뜻하게
        if (boosting() && state !== "over") {
          g.fillStyle = `rgba(251,191,36,${0.08 + 0.04 * Math.sin(anim / 150)})`;
          g.fillRect(0, 0, bw, bh);
        }
        if (freezeMsg) drawBubble(freezeMsg.text, freezeMsg.x, freezeMsg.lane);
        // 웨이브 시작 · 출발 · 준비 표시
        let banner = null;
        if (state === "go") banner = "커피 타임!";
        else if (state === "count") banner = "준비…";
        else if (state === "play" && phase === "intro") banner = `${wave}웨이브`;
        if (banner) {
          const sub = state === "play" && phase === "intro" ? (wave === 1 ? "레인을 눌러 커피를 보내요" : `레인 ${W.lanes}줄 · 조금 더 빨라져요`) : "";
          g.font = `800 ${Math.max(22, Math.min(34, bw * 0.07))}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
          const tw = Math.max(g.measureText(banner).width, sub ? Math.min(bw - 60, sub.length * 13) : 0), ph = sub ? 78 : 54;
          g.fillStyle = "rgba(255,255,255,.94)"; rr(bw / 2 - tw / 2 - 24, bh / 2 - ph / 2, tw + 48, ph, 18); g.fill();
          g.fillStyle = COL_A; g.fillText(banner, bw / 2, bh / 2 + (sub ? -12 : 1));
          if (sub) { g.font = `600 ${Math.max(12, Math.min(14, bw * 0.035))}px ${FONT}`; g.fillStyle = "#78350f"; g.fillText(sub, bw / 2, bh / 2 + 20); }
        }
        if (state === "over") {
          const a = Math.max(0, 0.22 - overT * 0.0003);
          if (a > 0) { g.fillStyle = `rgba(120,53,15,${a})`; g.fillRect(0, 0, bw, bh); }
        }
      }

      // ───────────────────────── 루프
      function frame(now) {
        if (last == null) last = now;
        const dt = Math.min(100, now - last);
        last = now;
        if (state === "play") {
          anim += dt;
          if (freezeT > 0) {
            freezeT -= dt;
            if (freezeT <= 0) { freezeT = 0; endFreeze(); }
          } else update(dt);
        } else if (state === "go") {
          anim += dt; phaseCount += dt;
          if (phaseCount >= 700) state = "play";
        } else if (state === "count") {
          anim += dt; phaseCount += dt;
          if (countStep === 0 && phaseCount >= 500) { countStep = 1; ctx.sfx("countdown"); }
          if (phaseCount >= 1000) { state = "play"; ctx.sfx("go"); }
        } else if (state === "over") {
          overT += dt; anim += dt;
        }
        if (state !== "paused" && state !== "ready") {
          laneY += (lane - laneY) * Math.min(1, dt / 50);
          if (Math.abs(lane - laneY) < 0.01) laneY = lane;
          if (pourT > 0) pourT -= dt;
          for (const f of fx) f.t += dt / (f.kind === "text" ? 800 : 500);
          fx = fx.filter((f) => f.t < 1);
        }
        updateHud();
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      reset();
      resize();
      showReady();
      requestAnimationFrame(() => { resize(); requestAnimationFrame(frame); });
    },
  });
  </script>
</body>
</html>
