<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>게임 라운지</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    /* 세균 격파 전용 */
    .gm-shell { margin: 0 auto; max-width: 100%; user-select: none; -webkit-user-select: none; }
    .gm-hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px 16px 0 0; background: linear-gradient(135deg, #2b1055, #d53369); color: #fff; }
    .gm-hud__item { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .gm-hud__item small { font-size: 11px; opacity: .75; font-weight: 600; }
    .gm-hud__item b { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .gm-hud__mid { align-items: center; }
    .gm-hud__right { align-items: flex-end; }
    .gm-lives { display: flex; gap: 4px; height: 22px; align-items: center; }
    .gm-life { width: 8px; height: 18px; border-radius: 4px; background: linear-gradient(#fb923c 50%, #fff7ed 50%); box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
    .gm-screen { position: relative; border-radius: 0 0 16px 16px; overflow: hidden; background: #150a2b; }
    .gm-canvas { display: block; touch-action: none; cursor: crosshair; }
    .gm-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(16, 7, 34, .62); backdrop-filter: blur(2px); overflow-y: auto; }
    .gm-overlay[hidden] { display: none; }
    .gm-card { width: 100%; max-width: 320px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 18px 16px 16px; border-radius: 16px; background: rgba(255,255,255,.97); color: var(--color-midnight-navy, #0f172a); text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    .gm-card h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
    .gm-card p { word-break: keep-all; margin: 0 0 10px; font-size: 13.5px; line-height: 1.55; color: var(--text-secondary, #475569); }
    .gm-card .gm-big { font-size: 34px; font-weight: 800; margin: 2px 0 8px; color: #2b1055; }
    .gm-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin: 4px 0 8px; }
    .gm-items div { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 99px; background: #f1f5f9; font-size: 12px; font-weight: 600; color: #334155; white-space: nowrap; }
    .gm-items div.is-new { background: #fee2e2; color: #991b1b; }
    .gm-items-note { margin: 0 0 10px; font-size: 11.5px; color: #64748b; word-break: keep-all; }
    .gm-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; }
    .gm-keys { font-size: 12px; color: var(--text-muted, #64748b); margin: 0 0 14px; line-height: 1.6; }
    .gm-keys kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border-radius: 5px; border: 1px solid #cbd5e1; background: #f8fafc; font: 600 11px/1.5 inherit; }
    .gm-go { width: 100%; border: 0; padding: 12px; border-radius: 12px; font-size: 15.5px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #2b1055, #d53369); }
    .gm-go:focus-visible { outline: 3px solid #fbcfe8; outline-offset: 2px; }
    .gm-note { margin-top: 10px; font-size: 12px; color: var(--text-muted, #64748b); text-align: center; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "shooter",
    setup(stage, ctx) {
      const W = 360, H = 540;
      // 내 기체 y — 위아래로도 움직인다 (화면 아래쪽 58% 안)
      const PY0 = H - 62, PY_MIN = Math.round(H * 0.42), PY_MAX = H - 28;
      let PY = PY0;
      stage.innerHTML = `
        <div class="gm-shell">
          <div class="gm-hud">
            <div class="gm-hud__item"><small>점수</small><b data-score>0</b></div>
            <div class="gm-hud__item gm-hud__mid"><small>웨이브</small><b data-wave>1</b></div>
            <div class="gm-hud__item gm-hud__right"><small>목숨</small><span class="gm-lives" data-lives></span></div>
          </div>
          <div class="gm-screen">
            <canvas class="gm-canvas" aria-label="세균 격파 게임 화면"></canvas>
            <div class="gm-overlay" data-overlay></div>
          </div>
          <div class="gm-note">방향키·WASD 이동 · Esc 일시정지 · 모바일은 화면을 끌어서 이동</div>
        </div>`;
      const shell = stage.querySelector(".gm-shell");
      const canvas = stage.querySelector("canvas");
      const g = canvas.getContext("2d");
      const overlay = stage.querySelector("[data-overlay]");
      const elScore = stage.querySelector("[data-score]");
      const elWave = stage.querySelector("[data-wave]");
      const elLives = stage.querySelector("[data-lives]");

      // ---------- 화면 크기 ----------
      let scale = 1;
      function fit() {
        const sw = stage.clientWidth || W;
        const maxH = Math.max(400, window.innerHeight - 290);
        const cw = Math.floor(Math.min(sw, (maxH * W) / H));
        const ch = Math.round((cw * H) / W);
        shell.style.width = cw + "px";
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        scale = canvas.width / W;
        draw();
      }

      // ---------- 상태 ----------
      const TYPES = {
        a: { r: 11, hp: 1, pts: 50, c1: "#86efac", c2: "#16a34a", spikes: 7 },
        b: { r: 12, hp: 2, pts: 80, c1: "#c4b5fd", c2: "#7c3aed", spikes: 10, oval: true },
        c: { r: 13, hp: 3, pts: 150, c1: "#fda4af", c2: "#e11d48", spikes: 12, sharp: true },
      };
      let state = "ready"; // ready | play | paused | over
      let S = null; // 판 상태
      const keys = { left: false, right: false, up: false, down: false };
      let pointerX = null, pointerY = null;
      let stars = [];
      function makeStars() {
        stars = [];
        for (let i = 0; i < 70; i++) {
          const layer = i % 3;
          stars.push({ x: Math.random() * W, y: Math.random() * H, layer, tw: Math.random() * 6 });
        }
      }
      makeStars();

      // 효과음 — 같은 소리가 gap초 안에 또 나지 않게
      function sfxGap(name, gap, arg) {
        const k = "_sfx_" + name;
        if (S && S[k] != null && S.t - S[k] < gap) return;
        if (S) S[k] = S.t;
        ctx.sfx(name, arg);
      }

      // 아이템 — [종류, 나오는 비율]
      // 무기 아이템이 대부분(약 80%), 보조 아이템은 드물게
      const ITEM_TABLE = [["vitc", 12], ["laser", 10], ["rapid", 10], ["homing", 10], ["orbit", 9], ["wing", 9], ["chili", 9], ["ripple", 9], ["zap", 9], ["bomb", 5], ["mask", 5], ["x2", 4], ["slow", 3], ["water", 2]];
      const ITEM_TOTAL = ITEM_TABLE.reduce((a, [, w]) => a + w, 0);
      // 동그라미 아이템 그림 — [바탕, 글자색, 글자]
      const ITEM_LOOK = { rapid: ["#7c4a1e", "#fff", "커"], laser: ["#facc15", "#713f12", "레"], homing: ["#ef4444", "#fff", "생"], orbit: ["#f5f5f4", "#57534e", "마"], chili: ["#dc2626", "#fff", "고"], ripple: ["#c084fc", "#fff", "양"], zap: ["#3b82f6", "#fff", "블"], slow: ["#f59e0b", "#fff", "꿀"], wing: ["#22c55e", "#fff", "균"], x2: ["#a855f7", "#fff", "D"], bomb: ["#0ea5e9", "#fff", "소"] };
      // 시간제 효과 — [상태 키, 이름, 막대 색, 최대 초]
      const WEAPON_MAX = 40; // 무기는 겹쳐 먹어도 최대 40초
      const TIMED = [["triple", "확산탄", "#fb923c", WEAPON_MAX], ["rapid", "연사", "#b45309", WEAPON_MAX], ["laser", "관통 레이저", "#facc15", WEAPON_MAX], ["homing", "유도탄", "#ef4444", WEAPON_MAX], ["orbit", "마늘 방패", "#d6d3d1", WEAPON_MAX], ["chili", "고추 화염", "#dc2626", WEAPON_MAX], ["ripple", "파동탄", "#c084fc", WEAPON_MAX], ["zap", "번개", "#3b82f6", WEAPON_MAX], ["wing", "도우미", "#22c55e", WEAPON_MAX], ["slow", "느리게", "#f59e0b", 9], ["x2", "점수 2배", "#a855f7", 14]];
      // 무기 — 같은 걸 또 먹으면 시간이 늘고 한 단계 세진다 (최대 3단계)
      // 무기 지속 시간(초) — 먹을 때마다 이만큼 늘고 최대 WEAPON_MAX 초까지 쌓인다
      const WEAPONS = { triple: 20, rapid: 18, laser: 16, homing: 20, orbit: 20, chili: 16, ripple: 20, zap: 20, wing: 24 };
      const WEAPON_NAME = { triple: "확산탄", rapid: "연사", laser: "관통 레이저", homing: "유도탄", orbit: "마늘 방패", chili: "고추 화염", ripple: "양파 파동탄", zap: "블루베리 번개", wing: "도우미" };
      // 고추 화염이 닿는 거리 (단계마다 길어짐)
      const flameLen = () => 90 + lvOf("chili") * 30;
      function lvOf(k) { return S[k] > 0 ? S.lv[k] || 1 : 0; }
      // 마늘 방패 — 내 기체 둘레를 도는 알 (단계마다 2·3·4개)
      function orbs() {
        const n = lvOf("orbit") + 1;
        if (n < 2) return [];
        return Array.from({ length: n }, (_, i) => { const a = S.t * 3.2 + (i / n) * Math.PI * 2; return { x: S.px + Math.cos(a) * 44, y: PY + Math.sin(a) * 30 }; });
      }
      const WING_X = 34;
      // 도우미 자리 — 늘 양옆 둘, 2단계면 가운데 하나, 3단계면 바깥 둘 더
      function wingSpots() { return lvOf("wing") >= 3 ? [-WING_X, WING_X, -WING_X * 1.8, WING_X * 1.8] : lvOf("wing") >= 2 ? [-WING_X, WING_X, 0] : [-WING_X, WING_X]; }
      function drawGarlic(x, y) {
        g.save(); g.translate(x, y);
        g.fillStyle = "rgba(245,245,244,.25)"; g.beginPath(); g.arc(0, 0, 12, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#fafaf9"; g.beginPath(); g.ellipse(0, 1, 8, 7, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#d6d3d1"; g.lineWidth = 1; g.beginPath(); g.moveTo(-3, -5); g.quadraticCurveTo(-4, 1, -2, 7); g.moveTo(3, -5); g.quadraticCurveTo(4, 1, 2, 7); g.stroke();
        g.fillStyle = "#a8a29e"; g.beginPath(); g.moveTo(-2, -6); g.lineTo(0, -11); g.lineTo(2, -6); g.fill();
        g.restore();
      }

      // 유산균 도우미 — 작은 초록 캡슐
      function drawHelper(x, y, t) {
        g.save();
        g.translate(x, y + Math.sin(t * 6 + x) * 2);
        g.fillStyle = "rgba(34,197,94,.25)";
        g.beginPath(); g.arc(0, 0, 12, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#22c55e";
        roundRect(-5, -10, 10, 20, 5); g.fill();
        g.fillStyle = "#bbf7d0";
        roundRect(-5, -10, 10, 9, 5); g.fill();
        g.restore();
      }

      function newGame() {
        PY = PY0;
        S = {
          score: 0, lives: 3, wave: 0, t: 0,
          px: W / 2, fireCd: 0.3, triple: 0, shield: false, invul: 0,
          rapid: 0, laser: 0, homing: 0, orbit: 0, chili: 0, ripple: 0, zap: 0, waves: [], waveCd: 0, zapCd: 0, bolts: [], slow: 0, wing: 0, x2: 0, flashT: 0, lv: {}, homingCd: 0, missiles: [],
          bullets: [], ebullets: [], enemies: [], items: [], parts: [], texts: [],
          boss: null, form: null, diveCd: 3, shotCd: 1.5,
          banner: null, clearT: 0, dead: false, overT: 0,
        };
        nextWave();
        hud();
      }

      function waveParams(w) {
        return {
          rows: Math.min(5, 3 + Math.floor((w - 1) / 2)),
          cols: Math.min(8, 6 + Math.floor((w - 1) / 3)),
          sway: 0.7 + w * 0.09,
          diveEvery: Math.max(1.1, 3.6 - w * 0.28),
          diveCount: Math.min(3, 1 + Math.floor(w / 3)),
          shotEvery: Math.max(0.32, 1.9 - w * 0.16),
          ebSpeed: Math.min(300, 150 + w * 14),
          diveSpeed: Math.min(300, 140 + w * 14),
        };
      }

      function nextWave() {
        S.wave++;
        S.enemies = [];
        S.ebullets = [];
        S.boss = null;
        const P = waveParams(S.wave);
        S.P = P;
        S.diveCd = 3;
        S.shotCd = 1.6;
        if (S.wave % 5 === 0) {
          const n = S.wave / 5;
          const hp = 70 + (n - 1) * 45;
          S.boss = { x: W / 2, y: -70, r: 44, hp, maxHp: hp, t: 0, spreadCd: 2.2, aimCd: 1.4, minionCd: 4, flash: 0, n };
          S.form = null;
          S.banner = { text: "큰 세균 등장!", sub: "체력 바를 다 깎아 주세요", t: 2 };
          if (armedList().length === 0) dropItem(W / 2, 150, pickWeapon()); // 맨손이면 무기 하나
          ctx.sfx("whoosh");
        } else {
          const dx = 36, dy = 30;
          const width = (P.cols - 1) * dx;
          S.form = { t: 0, x0: (W - width) / 2, y0: 70, dx, dy, amp: Math.min(46, (W - 44 - width) / 2) };
          for (let r = 0; r < P.rows; r++) {
            for (let c = 0; c < P.cols; c++) {
              let type = "a";
              if (r === 0 && S.wave >= 2) type = "c";
              else if (r <= 1) type = "b";
              const T = TYPES[type];
              const fromLeft = (r + c) % 2 === 0;
              S.enemies.push({
                type, hp: T.hp, r: T.r, col: c, row: r, x: fromLeft ? -30 : W + 30, y: -20,
                mode: "enter", delay: 0.25 + r * 0.32 + c * 0.06, p: 0,
                sx: fromLeft ? -30 : W + 30, sy: 40 + r * 10, cx: fromLeft ? W * 0.75 : W * 0.25, cy: 240,
                flash: 0, spin: Math.random() * 6,
              });
            }
          }
          S.banner = { text: `웨이브 ${S.wave}`, sub: S.wave === 1 ? "세균 편대가 몰려와요" : "더 빠르고 촘촘해져요", t: 1.6 };
          ctx.sfx("go");
        }
        hud();
      }

      function slotPos(e) {
        const f = S.form;
        const spread = 1 + 0.05 * Math.sin(f.t * 1.4);
        const sway = Math.sin(f.t * S.P.sway) * f.amp;
        const mid = W / 2;
        const bx = f.x0 + e.col * f.dx;
        return { x: mid + (bx - mid) * spread + sway, y: f.y0 + e.row * f.dy + Math.sin(f.t * 2 + e.col * 0.6) * 3 };
      }

      // ---------- 갱신 ----------
      function update(dt) {
        S.t += dt;
        for (const s of stars) {
          s.y += (8 + s.layer * 10) * dt;
          if (s.y > H) { s.y -= H; s.x = Math.random() * W; }
        }
        if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }

        // 게임 오버 연출 중
        if (S.dead) {
          updateParts(dt);
          S.overT -= dt;
          if (S.overT <= 0) finish();
          return;
        }

        // 이동
        const speed = 270;
        let mv = 0;
        if (keys.left) mv -= 1;
        if (keys.right) mv += 1;
        let mvY = 0;
        if (keys.up) mvY -= 1;
        if (keys.down) mvY += 1;
        if (mv || mvY) {
          // 대각선도 같은 빠르기
          const k = mv && mvY ? Math.SQRT1_2 : 1;
          S.px += mv * speed * k * dt;
          PY += mvY * speed * k * dt;
        } else if (pointerX != null) {
          const step = 720 * dt;
          const d = pointerX - S.px;
          S.px += Math.abs(d) < step ? d : Math.sign(d) * step;
          if (pointerY != null) {
            const dy = pointerY - PY;
            PY += Math.abs(dy) < step ? dy : Math.sign(dy) * step;
          }
        }
        S.px = Math.max(22, Math.min(W - 22, S.px));
        PY = Math.max(PY_MIN, Math.min(PY_MAX, PY));
        if (S.invul > 0) S.invul -= dt;
        if (S.triple > 0) S.triple -= dt;
        for (const k of ["rapid", "laser", "homing", "orbit", "chili", "ripple", "zap", "slow", "wing", "x2"]) if (S[k] > 0) S[k] -= dt;
        // 무기 없이 보낸 시간 (필요할 때 무기를 주기 위한 기준)
        if (armedList().length === 0 && !S.clearT) S.unarmedT = (S.unarmedT || 0) + dt; else S.unarmedT = 0;
        if (S.flashT > 0) S.flashT -= dt;

        // 자동 연사
        S.fireCd -= dt;
        if (S.fireCd <= 0 && !S.clearT) {
          S.fireCd = [0.21, 0.13, 0.1, 0.075][lvOf("rapid")];
          // 자동 연사 — 세 발에 한 번만 소리
          S.shotN = (S.shotN || 0) + 1;
          if (S.shotN % 3 === 1) ctx.sfx("shoot");
          const pierce = S.laser > 0;
          S.bullets.push({ x: S.px, y: PY - 20, vx: 0, vy: -540, pierce });
          // 확산탄: 1단계 3갈래, 2단계 5갈래, 3단계 7갈래
          const spread = lvOf("triple");
          for (let i = 1; i <= spread; i++) {
            const vx = 120 * i;
            S.bullets.push({ x: S.px - 6, y: PY - 16, vx: -vx, vy: -520, pierce });
            S.bullets.push({ x: S.px + 6, y: PY - 16, vx, vy: -520, pierce });
          }
          // 관통 레이저 2단계부터 양옆 한 줄씩 더
          if (lvOf("laser") >= 2) for (const d of [-9, 9]) S.bullets.push({ x: S.px + d, y: PY - 18, vx: 0, vy: -560, pierce: true });
          // 유산균 도우미 — 양옆에서 같이 쏜다
          if (S.wing > 0) for (const d of wingSpots()) S.bullets.push({ x: S.px + d, y: PY - 8, vx: 0, vy: -520, pierce });
        }
        for (const b of S.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
        S.bullets = S.bullets.filter((b) => b.y > -20 && b.x > -10 && b.x < W + 10 && !b.hit);
        // 생강 유도탄 — 가장 가까운 세균을 쫓아간다 (단계만큼 한 번에 여러 발)
        if (S.homing > 0 && !S.clearT) {
          S.homingCd -= dt;
          if (S.homingCd <= 0) {
            S.homingCd = 0.55;
            const n = lvOf("homing");
            for (let i = 0; i < n; i++) {
              const side = i % 2 ? 1 : -1;
              S.missiles.push({ x: S.px + side * 10, y: PY - 6, vx: side * 140, vy: -200, t: 0 });
            }
          }
        }
        for (const m of S.missiles) {
          m.t += dt;
          let tgt = null, best = 1e9;
          const pool = S.boss && S.boss.y > 40 ? [S.boss] : S.enemies;
          for (const e of pool) { if (e.dead || (e.mode === "enter" && e.delay > 0)) continue; const d = (e.x - m.x) ** 2 + (e.y - m.y) ** 2; if (d < best) { best = d; tgt = e; } }
          if (tgt) {
            const a = Math.atan2(tgt.y - m.y, tgt.x - m.x);
            m.vx += (Math.cos(a) * 420 - m.vx) * Math.min(1, dt * 5);
            m.vy += (Math.sin(a) * 420 - m.vy) * Math.min(1, dt * 5);
          } else m.vy -= 600 * dt;
          m.x += m.vx * dt; m.y += m.vy * dt;
        }
        S.missiles = S.missiles.filter((m) => m.y > -30 && m.y < H + 30 && m.x > -30 && m.x < W + 30 && m.t < 3 && !m.hit);
        // 양파 파동탄 — 넓게 퍼지며 올라가는 물결, 세균을 뚫고 지나간다
        if (S.ripple > 0 && !S.clearT) {
          S.waveCd -= dt;
          if (S.waveCd <= 0) { S.waveCd = [0, 0.75, 0.55, 0.4][lvOf("ripple")]; S.waves.push({ x: S.px, y: PY - 20, w: 30, hits: new Set() }); }
        }
        for (const wv of S.waves) { wv.y -= 330 * dt; wv.w = Math.min(150, wv.w + 160 * dt); }
        S.waves = S.waves.filter((wv) => wv.y > -20);
        // 블루베리 번개 — 가까운 세균부터 줄줄이 튀는 번개 (단계마다 더 많이)
        for (const bo of S.bolts) bo.t -= dt;
        S.bolts = S.bolts.filter((bo) => bo.t > 0);
        if (S.zap > 0 && !S.clearT) {
          S.zapCd -= dt;
          if (S.zapCd <= 0) {
            S.zapCd = 0.7;
            let from = { x: S.px, y: PY - 20 };
            const done = new Set();
            const pts = [from];
            for (let i = 0; i < 2 + lvOf("zap"); i++) {
              let tgt = null, best = 260 * 260;
              for (const e of S.enemies) {
                if (e.dead || done.has(e) || (e.mode === "enter" && e.delay > 0)) continue;
                const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2;
                if (d < best) { best = d; tgt = e; }
              }
              if (!tgt) break;
              done.add(tgt); pts.push({ x: tgt.x, y: tgt.y });
              tgt.hp--; tgt.flash = 0.1;
              if (tgt.hp <= 0) killEnemy(tgt);
              from = tgt;
            }
            if (pts.length > 1) { S.bolts.push({ pts, t: 0.14 }); sfxGap("laser", 0.5); }
            S.enemies = S.enemies.filter((e) => !e.dead);
          }
        }
        // 꿀 — 여기서부터(적·적 탄·보스·아이템) 시간이 느리게 흐른다. 내 기체와 내 탄은 그대로
        if (S.slow > 0) dt *= 0.45;

        // 편대
        if (S.form) S.form.t += dt;
        const P = S.P;
        for (const e of S.enemies) {
          e.spin += dt;
          if (e.flash > 0) e.flash -= dt;
          if (e.mode === "enter") {
            if (e.delay > 0) { e.delay -= dt; continue; }
            e.p = Math.min(1, e.p + dt / 1.15);
            const tp = slotPos(e);
            const u = e.p, iu = 1 - u;
            e.x = iu * iu * e.sx + 2 * iu * u * e.cx + u * u * tp.x;
            e.y = iu * iu * e.sy + 2 * iu * u * e.cy + u * u * tp.y;
            if (e.p >= 1) e.mode = "form";
          } else if (e.mode === "form") {
            const tp = slotPos(e);
            e.x = tp.x; e.y = tp.y;
          } else if (e.mode === "dive") {
            if (e.wait > 0) {
              e.wait -= dt;
              if (e.col != null && S.form) { const tp = slotPos(e); e.x = e.ox = tp.x; e.y = e.oy = tp.y; }
              continue;
            }
            e.tt += dt;
            if (e.tt < 0.55) {
              // 돌진 전 살짝 위로 말아 오르는 곡선
              const k = e.tt / 0.55;
              e.x = e.ox + Math.sin(k * Math.PI) * 26 * e.dir;
              e.y = e.oy - Math.sin(k * Math.PI * 0.5) * 22;
              e.baseX = e.x;
            } else {
              const toward = Math.sign(S.px - e.baseX) * Math.min(Math.abs(S.px - e.baseX), 70 * dt);
              e.baseX += toward;
              e.y += e.vy * dt;
              e.x = e.baseX + Math.sin((e.tt - 0.55) * e.w) * e.amp * e.dir;
              if (!e.fired && e.y > H * 0.32) {
                e.fired = true;
                aimShot(e.x, e.y, P.ebSpeed * 1.05);
                if (S.wave >= 4) aimShot(e.x, e.y, P.ebSpeed * 0.9, 0.22);
              }
            }
            if (e.y > H + 30) {
              if (e.col == null) { e.gone = true; continue; }
              e.mode = "enter"; e.p = 0; e.delay = 0.2;
              e.sx = e.x; e.sy = -30; e.cx = W / 2 + (Math.random() - 0.5) * 160; e.cy = 30;
            }
          }
        }
        S.enemies = S.enemies.filter((e) => !e.gone);

        // 돌진 · 사격
        const inForm = S.enemies.filter((e) => e.mode === "form");
        if (S.form && !S.clearT) {
          S.diveCd -= dt;
          if (S.diveCd <= 0 && inForm.length) {
            S.diveCd = P.diveEvery * (0.75 + Math.random() * 0.5);
            const n = Math.min(P.diveCount, inForm.length);
            for (let i = 0; i < n; i++) {
              const idx = Math.floor(Math.random() * inForm.length);
              const e = inForm.splice(idx, 1)[0];
              startDive(e, P.diveSpeed, i * 0.18);
            }
          }
          S.shotCd -= dt;
          if (S.shotCd <= 0) {
            S.shotCd = P.shotEvery * (0.7 + Math.random() * 0.6);
            const shooters = S.enemies.filter((e) => e.mode === "form");
            if (shooters.length) {
              const e = shooters[Math.floor(Math.random() * shooters.length)];
              aimShot(e.x, e.y + 8, P.ebSpeed, 0, 0.35);
            }
          }
        }

        // 보스
        const B = S.boss;
        if (B) {
          B.t += dt;
          if (B.flash > 0) B.flash -= dt;
          if (B.y < 110) B.y = Math.min(110, B.y + 70 * dt);
          else {
            B.x = W / 2 + Math.sin(B.t * (0.6 + B.n * 0.08)) * (W / 2 - 64);
            B.y = 110 + Math.sin(B.t * 1.3) * 14;
            B.spreadCd -= dt; B.aimCd -= dt; B.minionCd -= dt;
            const sp = Math.min(260, 140 + B.n * 25);
            if (B.spreadCd <= 0) {
              B.spreadCd = Math.max(1.1, 2.1 - B.n * 0.2);
              const k = 5 + Math.min(4, B.n);
              for (let i = 0; i < k; i++) {
                const a = Math.PI / 2 + (i - (k - 1) / 2) * 0.22 + Math.sin(B.t) * 0.15;
                S.ebullets.push({ x: B.x, y: B.y + 30, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 4.5 });
              }
            }
            if (B.aimCd <= 0) { B.aimCd = Math.max(0.6, 1.2 - B.n * 0.1); aimShot(B.x, B.y + 30, sp * 1.25); }
            if (B.minionCd <= 0) {
              B.minionCd = 5;
              for (const d of [-1, 1]) {
                const T = TYPES.a;
                const e = { type: "a", hp: T.hp, r: T.r, col: null, x: B.x + d * 36, y: B.y + 10, flash: 0, spin: 0 };
                startDive(e, 170 + B.n * 15, 0);
                S.enemies.push(e);
              }
            }
          }
        }

        // 적 탄
        for (const b of S.ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
        S.ebullets = S.ebullets.filter((b) => b.y < H + 10 && b.y > -20 && b.x > -10 && b.x < W + 10 && !b.hit);

        // 아이템
        for (const it of S.items) { it.y += 95 * dt; it.t += dt; }
        S.items = S.items.filter((it) => it.y < H + 20 && !it.got);

        // 충돌: 유도탄 → 적 (한 발에 2 피해)
        for (const m of S.missiles) {
          if (B && B.y > 40 && Math.hypot(m.x - B.x, m.y - B.y) < B.r) {
            m.hit = true; B.hp -= 2; B.flash = 0.06;
            if (B.hp <= 0) killBoss(); else sfxGap("hit", 0.4);
            continue;
          }
          for (const e of S.enemies) {
            if (e.dead || (e.mode === "enter" && e.delay > 0)) continue;
            if (Math.abs(m.x - e.x) < e.r + 4 && Math.abs(m.y - e.y) < e.r + 4) {
              m.hit = true; e.hp -= 2; e.flash = 0.08;
              burst(m.x, m.y, "#fca5a5", 5, 90);
              if (e.hp <= 0) killEnemy(e); else sfxGap("hit", 0.12);
              break;
            }
          }
        }
        // 충돌: 고추 화염 — 앞쪽 부채꼴 안의 세균을 0.15초마다 태운다
        if (S.chili > 0) {
          const len = flameLen();
          for (const e of S.enemies) {
            if (e.dead || (e.mode === "enter" && e.delay > 0) || (e.fireCd || 0) > S.t) continue;
            const dy = PY - 20 - e.y, dx = e.x - S.px;
            if (dy > 0 && dy < len && Math.abs(dx) < 14 + dy * 0.45) {
              e.fireCd = S.t + 0.15; e.hp--; e.flash = 0.08;
              if (e.hp <= 0) killEnemy(e);
            }
          }
          if (B && B.y > 40 && PY - 20 - B.y < len + B.r && Math.abs(B.x - S.px) < B.r + 30 && (B.fireCd || 0) <= S.t) {
            B.fireCd = S.t + 0.2; B.hp--; B.flash = 0.05; if (B.hp <= 0) killBoss();
          }
        }
        // 충돌: 파동탄 → 세균 (같은 물결은 한 세균에 한 번)
        for (const wv of S.waves) {
          for (const e of S.enemies) {
            if (e.dead || wv.hits.has(e) || (e.mode === "enter" && e.delay > 0)) continue;
            if (Math.abs(e.y - wv.y) < e.r + 8 && Math.abs(e.x - wv.x) < wv.w / 2 + e.r) {
              wv.hits.add(e); e.hp--; e.flash = 0.08;
              if (e.hp <= 0) killEnemy(e); else sfxGap("hit", 0.12);
            }
          }
          if (B && B.y > 40 && !wv.hits.has(B) && Math.abs(B.y - wv.y) < B.r && Math.abs(B.x - wv.x) < wv.w / 2 + B.r) {
            wv.hits.add(B); B.hp -= 2; B.flash = 0.06; if (B.hp <= 0) killBoss();
          }
        }
        S.enemies = S.enemies.filter((e) => !e.dead);
        // 충돌: 마늘 방패 → 적 탄은 지우고, 닿은 세균은 0.3초마다 1 피해
        for (const o of orbs()) {
          for (const b of S.ebullets) if (Math.hypot(b.x - o.x, b.y - o.y) < 12 + b.r) { b.hit = true; burst(o.x, o.y, "#f5f5f4", 3, 60); }
          for (const e of S.enemies) {
            if (e.dead || (e.mode === "enter" && e.delay > 0) || (e.orbCd || 0) > S.t) continue;
            if (Math.hypot(e.x - o.x, e.y - o.y) < e.r + 12) {
              e.orbCd = S.t + 0.3; e.hp--; e.flash = 0.08;
              if (e.hp <= 0) killEnemy(e); else sfxGap("hit", 0.12);
            }
          }
        }
        S.enemies = S.enemies.filter((e) => !e.dead);
        // 충돌: 내 탄 → 적
        for (const b of S.bullets) {
          if (B && B.y > 40 && Math.hypot(b.x - B.x, b.y - B.y) < B.r) {
            b.hit = true; B.hp--; B.flash = 0.06;
            if (B.hp <= 0) killBoss();
            else sfxGap("hit", 0.4);
            continue;
          }
          for (const e of S.enemies) {
            if (e.mode === "enter" && e.delay > 0) continue;
            if (Math.abs(b.x - e.x) < e.r + 3 && Math.abs(b.y - e.y) < e.r + 6) {
              // 레몬 관통탄은 사라지지 않고 지나가며, 같은 세균은 한 번만 맞힌다
              if (b.pierce) {
                if (b.hits && b.hits.has(e)) continue;
                (b.hits = b.hits || new Set()).add(e);
              } else b.hit = true;
              e.hp--; e.flash = 0.08;
              if (e.hp <= 0) killEnemy(e);
              else sfxGap("hit", 0.12);
              break;
            }
          }
        }
        S.enemies = S.enemies.filter((e) => !e.dead);

        // 충돌: 적·적 탄 → 나
        if (S.invul <= 0) {
          for (const b of S.ebullets) {
            if (Math.abs(b.x - S.px) < 7 + b.r && Math.abs(b.y - PY) < 14 + b.r) { b.hit = true; hitPlayer(); break; }
          }
        }
        if (S.invul <= 0) {
          for (const e of S.enemies) {
            if (e.mode !== "dive") continue;
            if (Math.hypot(e.x - S.px, e.y - PY) < e.r + 10) { e.hp = 0; killEnemy(e, true); hitPlayer(); break; }
          }
          S.enemies = S.enemies.filter((e) => !e.dead);
        }
        // 아이템 줍기
        for (const it of S.items) {
          if (Math.abs(it.x - S.px) < 22 && Math.abs(it.y - PY) < 24) { it.got = true; takeItem(it); }
        }

        updateParts(dt);

        // 웨이브 클리어
        if (!S.dead && !S.boss && S.enemies.length === 0) {
          if (!S.clearT) {
            const bonus = 300 + S.wave * 200;
            S.score += bonus;
            S.banner = { text: `웨이브 ${S.wave} 클리어!`, sub: `보너스 +${bonus.toLocaleString("ko-KR")}`, t: 1.7 };
            S.clearT = 1.8;
            S.ebullets = [];
            ctx.sfx("line");
            hud();
          } else {
            S.clearT -= dt;
            if (S.clearT <= 0) { S.clearT = 0; nextWave(); }
          }
        }
      }

      function updateParts(dt) {
        for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt; p.life -= dt; }
        S.parts = S.parts.filter((p) => p.life > 0);
        for (const t of S.texts) { t.y -= 30 * dt; t.life -= dt; }
        S.texts = S.texts.filter((t) => t.life > 0);
      }

      function startDive(e, vy, delay) {
        e.mode = "dive"; e.tt = 0; e.wait = delay; e.ox = e.x; e.oy = e.y; e.baseX = e.x;
        e.vy = vy; e.w = 2.2 + Math.random() * 1.6; e.amp = 40 + Math.random() * 50;
        e.dir = e.x < W / 2 ? 1 : -1; e.fired = false;
      }

      function aimShot(x, y, sp, offset = 0, spreadLimit = 1) {
        let a = Math.atan2(PY - y, S.px - x) + offset;
        const down = Math.PI / 2;
        a = Math.max(down - spreadLimit * 1.2, Math.min(down + spreadLimit * 1.2, a));
        S.ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3.5 });
      }

      function burst(x, y, color, n = 10, sp = 140) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const v = sp * (0.4 + Math.random() * 0.8);
          S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.35, max: 0.7, color, r: 1.5 + Math.random() * 2 });
        }
      }

      function killEnemy(e, crash) {
        e.dead = true;
        const T = TYPES[e.type];
        let pts = T.pts;
        if (e.mode === "dive" && !crash) pts *= 2;
        if (S.x2 > 0) pts *= 2;
        S.score += pts;
        burst(e.x, e.y, T.c2, 12);
        S.texts.push({ x: e.x, y: e.y, text: `+${pts}`, life: 0.7, color: e.mode === "dive" ? "#fde047" : "#fff" });
        if (!crash) ctx.sfx(e.mode === "dive" ? "coin" : "pop");
        if (!crash) maybeDrop(e.x, e.y);
        hud();
      }

      function killBoss() {
        const B = S.boss;
        const pts = 3000 * B.n * (S.x2 > 0 ? 2 : 1);
        ctx.sfx("explode");
        S.score += pts;
        for (let i = 0; i < 4; i++) burst(B.x + (Math.random() - 0.5) * 60, B.y + (Math.random() - 0.5) * 50, i % 2 ? "#f472b6" : "#a3e635", 18, 220);
        S.texts.push({ x: B.x, y: B.y, text: `+${pts.toLocaleString("ko-KR")}`, life: 1.2, color: "#fde047" });
        dropItem(B.x, B.y, ["water", "wing", "bomb"][Math.floor(Math.random() * 3)]);
        S.boss = null;
        S.enemies.forEach((e) => { e.dead = true; burst(e.x, e.y, TYPES[e.type].c2, 8); });
        S.enemies = [];
        S.ebullets = [];
        hud();
      }

      // ── 아이템은 필요할 때 — 지금 상황을 보고 나올지, 무엇이 나올지 정한다
      const WEAPON_ITEMS = ["vitc", "laser", "rapid", "homing", "orbit", "chili", "ripple", "zap", "wing"];
      const ITEM_OF = { triple: "vitc", rapid: "rapid", laser: "laser", homing: "homing", orbit: "orbit", chili: "chili", ripple: "ripple", zap: "zap", wing: "wing" };
      function armedList() { return Object.keys(WEAPONS).filter((k) => S[k] > 0); }
      function maybeDrop(x, y) {
        const armed = armedList();
        const expiring = armed.length === 1 && S[armed[0]] < 2.5;
        // 무기 없음 20% · 하나뿐인데 곧 끝남 15% · 하나 7% · 둘 이상 3%
        let p = armed.length === 0 ? 0.2 : expiring ? 0.15 : armed.length === 1 ? 0.07 : 0.03;
        if (S.lives <= 1 && !S.shield) p += 0.08; // 위험할 때 조금 더
        if (S.items.length >= 2) p = 0; // 화면에 이미 두 개 떨어지는 중이면 그만
        // 무기 없이 8초가 지나면 다음 세균은 반드시 무기
        if (armed.length === 0 && S.unarmedT > 8 && S.items.length === 0) { dropItem(x, y, pickWeapon()); S.unarmedT = 0; return; }
        if (Math.random() < p) dropItem(x, y);
      }
      // 무기 고르기 — 이미 쓰는 무기가 있으면 반쯤은 그 무기(단계 올리기)
      function pickWeapon() {
        const armed = armedList();
        if (armed.length && Math.random() < 0.5) return ITEM_OF[armed[Math.floor(Math.random() * armed.length)]];
        return WEAPON_ITEMS[Math.floor(Math.random() * WEAPON_ITEMS.length)];
      }

      function dropItem(x, y, kind) {
        if (!kind) {
          if (S.lives <= 1 && !S.shield && Math.random() < 0.45) kind = Math.random() < 0.5 ? "mask" : "water"; // 목숨이 위험하면 지켜 주는 아이템
          else {
            // 아이템 뽑기 — 숫자가 클수록 자주 나온다
            let r = Math.random() * ITEM_TOTAL;
            kind = ITEM_TABLE.find(([, w]) => (r -= w) < 0)[0];
            if (WEAPON_ITEMS.includes(kind)) kind = pickWeapon();
          }
        }
        S.items.push({ x, y, kind, t: 0 });
      }

      function takeItem(it) {
        let label = "";
        const wk = { vitc: "triple", rapid: "rapid", laser: "laser", homing: "homing", orbit: "orbit", chili: "chili", ripple: "ripple", zap: "zap", wing: "wing" }[it.kind];
        if (wk) {
          // 무기: 켜져 있을 때 또 먹으면 한 단계 위 + 시간 연장
          S.lv[wk] = S[wk] > 0 ? Math.min(3, (S.lv[wk] || 1) + 1) : 1;
          S[wk] = Math.min(WEAPON_MAX, Math.max(S[wk], 0) + WEAPONS[wk]);
          label = `${WEAPON_NAME[wk]} ${S.lv[wk]}단계!`;
        }
        else if (it.kind === "mask") { S.shield = true; label = "마스크 · 보호막!"; }
        else if (it.kind === "slow") { S.slow = 9; label = "꿀 · 세균이 느려져요"; }
        else if (it.kind === "x2") { S.x2 = 14; label = "비타민D · 점수 2배!"; }
        else if (it.kind === "bomb") { label = "손소독제 · 싹 소독!"; sanitize(); }
        else { S.lives = Math.min(6, S.lives + 1); label = "물방울 · 목숨 +1"; }
        S.score += 100;
        ctx.sfx("powerup");
        S.texts.push({ x: Math.max(70, Math.min(W - 70, S.px)), y: PY - 36, text: label, life: 1.2, color: "#fde68a", big: true });
        hud();
      }

      // 손소독제 — 화면의 작은 세균을 모두 없애고, 큰 세균은 체력 20%를 깎는다
      function sanitize() {
        S.flashT = 0.35;
        ctx.sfx("explode");
        for (const e of S.enemies) {
          if (e.mode === "enter" && e.delay > 0) continue;
          e.hp = 0;
          killEnemy(e, true);
        }
        S.enemies = S.enemies.filter((e) => !e.dead);
        S.ebullets = [];
        const B = S.boss;
        if (B && B.y > 40) {
          B.hp -= Math.ceil(B.maxHp * 0.2);
          B.flash = 0.2;
          if (B.hp <= 0) killBoss();
        }
      }

      function hitPlayer() {
        if (S.shield) {
          S.shield = false; S.invul = 1.0;
          ctx.sfx("hit");
          burst(S.px, PY, "#67e8f9", 16, 180);
          S.texts.push({ x: S.px, y: PY - 30, text: "보호막이 막았어요", life: 1, color: "#a5f3fc" });
          return;
        }
        S.lives--;
        burst(S.px, PY, "#fb923c", 24, 220);
        burst(S.px, PY, "#fff7ed", 12, 160);
        S.ebullets = [];
        // 맞으면 무기는 한 단계씩 내려간다 (모두 잃지는 않게)
        for (const k of Object.keys(WEAPONS)) {
          if (!(S[k] > 0)) continue;
          if ((S.lv[k] || 1) > 1) S.lv[k]--; else S[k] = 0;
        }
        S.missiles = []; S.waves = [];
        hud();
        if (S.lives <= 0) {
          S.dead = true; S.overT = 1.3;
          ctx.sfx("explode");
          return;
        }
        ctx.sfx("hurt");
        S.invul = 2.2;
      }

      function hud() {
        if (!S) return;
        elScore.textContent = S.score.toLocaleString("ko-KR");
        elWave.textContent = S.wave;
        const n = Math.max(0, S.lives);
        if (elLives.childElementCount !== n) elLives.innerHTML = Array.from({ length: n }, () => '<i class="gm-life"></i>').join("");
      }

      // ---------- 그리기 ----------
      function draw() {
        g.setTransform(scale, 0, 0, scale, 0, 0);
        const bg = g.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#12072a");
        bg.addColorStop(0.7, "#24104a");
        bg.addColorStop(1, "#3a1150");
        g.fillStyle = bg;
        g.fillRect(0, 0, W, H);
        const t = S ? S.t : 0;
        for (const s of stars) {
          const a = 0.25 + s.layer * 0.22 + Math.sin(t * 2 + s.tw) * 0.1;
          g.fillStyle = s.layer === 2 ? `rgba(253, 186, 216, ${a})` : `rgba(255,255,255,${a})`;
          const r = 0.6 + s.layer * 0.45;
          g.fillRect(s.x - r / 2, s.y - r / 2, r, r);
        }
        if (!S) { drawPlayer(W / 2, PY, false, 0); return; }

        for (const it of S.items) drawItem(it);
        for (const e of S.enemies) {
          if (e.mode === "enter" && e.delay > 0) continue;
          drawGerm(e.x, e.y, e.r, TYPES[e.type], e.spin, e.flash > 0, e.mode === "dive");
        }
        if (S.boss) drawBoss(S.boss);

        // 내 탄
        g.lineCap = "round";
        for (const b of S.bullets) {
          g.strokeStyle = b.pierce ? "rgba(250, 204, 21, .45)" : "rgba(253, 186, 116, .35)";
          g.lineWidth = b.pierce ? 9 : 6;
          g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - b.vx * 0.02, b.y + 12); g.stroke();
          g.strokeStyle = b.pierce ? "#fef9c3" : "#fff4d6";
          g.lineWidth = b.pierce ? 3.4 : 2.4;
          g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - b.vx * 0.02, b.y + 11); g.stroke();
        }
        // 고추 화염
        if (S.chili > 0 && !S.dead) {
          const len = flameLen(), y0 = PY - 22;
          const fg = g.createLinearGradient(0, y0, 0, y0 - len);
          fg.addColorStop(0, "rgba(254, 240, 138, .85)"); fg.addColorStop(0.45, "rgba(249, 115, 22, .55)"); fg.addColorStop(1, "rgba(220, 38, 38, 0)");
          g.fillStyle = fg;
          const fl = Math.sin(S.t * 40) * 4;
          g.beginPath(); g.moveTo(S.px - 6, y0); g.lineTo(S.px - 14 - len * 0.45 + fl, y0 - len); g.lineTo(S.px + 14 + len * 0.45 - fl, y0 - len); g.lineTo(S.px + 6, y0); g.closePath(); g.fill();
        }
        // 양파 파동탄
        for (const wv of S.waves) {
          g.strokeStyle = "rgba(216, 180, 254, .9)"; g.lineWidth = 4; g.lineCap = "round";
          g.beginPath(); g.ellipse(wv.x, wv.y + 10, wv.w / 2, 12, 0, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
          g.strokeStyle = "rgba(192, 132, 252, .35)"; g.lineWidth = 9;
          g.beginPath(); g.ellipse(wv.x, wv.y + 10, wv.w / 2, 12, 0, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
        }
        // 블루베리 번개
        for (const bo of S.bolts) {
          g.globalAlpha = Math.min(1, bo.t / 0.08);
          for (const [w, c] of [[6, "rgba(96, 165, 250, .45)"], [2, "#e0f2fe"]]) {
            g.strokeStyle = c; g.lineWidth = w; g.beginPath();
            bo.pts.forEach((p0, i) => {
              if (!i) return g.moveTo(p0.x, p0.y);
              const q = bo.pts[i - 1];
              for (let k = 1; k <= 4; k++) { const u = k / 4; g.lineTo(q.x + (p0.x - q.x) * u + (k < 4 ? (Math.random() - 0.5) * 14 : 0), q.y + (p0.y - q.y) * u + (k < 4 ? (Math.random() - 0.5) * 14 : 0)); }
            });
            g.stroke();
          }
          g.globalAlpha = 1;
        }
        // 유도탄
        for (const m of S.missiles) {
          g.save(); g.translate(m.x, m.y); g.rotate(Math.atan2(m.vy, m.vx));
          g.fillStyle = "rgba(248, 113, 113, .35)"; g.beginPath(); g.ellipse(-8, 0, 9, 4, 0, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#ef4444"; roundRect(-6, -3, 12, 6, 3); g.fill();
          g.fillStyle = "#fde68a"; g.beginPath(); g.arc(5, 0, 2.2, 0, Math.PI * 2); g.fill();
          g.restore();
        }
        // 적 탄
        for (const b of S.ebullets) {
          g.fillStyle = "rgba(190, 242, 100, .25)";
          g.beginPath(); g.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#d9f99d";
          g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
        }
        if (!S.dead) {
          const blink = S.invul > 0 && Math.floor(S.invul * 12) % 2 === 0;
          if (!blink) {
            if (S.wing > 0) for (const d of wingSpots()) drawHelper(S.px + d, PY + 6 + (Math.abs(d) > WING_X ? 12 : 0), S.t);
            for (const o of orbs()) drawGarlic(o.x, o.y);
            drawPlayer(S.px, PY, S.shield, S.t);
          }
        }
        for (const p of S.parts) {
          g.globalAlpha = Math.max(0, Math.min(1, p.life / 0.4));
          g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
        g.textAlign = "center";
        g.textBaseline = "middle";
        for (const tx of S.texts) {
          g.globalAlpha = Math.min(1, tx.life / 0.3);
          g.font = `800 ${tx.big ? 14 : 12}px Pretendard, system-ui, sans-serif`;
          g.fillStyle = tx.color;
          g.fillText(tx.text, tx.x, tx.y);
        }
        g.globalAlpha = 1;

        // 3갈래 탄 남은 시간
        // 켜져 있는 아이템 효과와 남은 시간
        let barY = H - 18;
        for (const [k, name, color, full] of TIMED) {
          if (!(S[k] > 0)) continue;
          g.fillStyle = "rgba(255,255,255,.15)";
          roundRect(12, barY, 70, 6, 3); g.fill();
          g.fillStyle = color;
          roundRect(12, barY, 70 * Math.min(1, S[k] / full), 6, 3); g.fill();
          g.font = "700 10px Pretendard, system-ui, sans-serif";
          g.textAlign = "left";
          g.fillStyle = "#fff";
          g.fillText(WEAPONS[k] && S.lv[k] > 1 ? `${name} ${S.lv[k]}단계` : name, 88, barY + 3);
          barY -= 14;
        }
        // 꿀(느리게) 중에는 화면이 살짝 노랗게, 손소독제는 하얗게 번쩍
        if (S.slow > 0) { g.fillStyle = "rgba(250, 204, 21, .07)"; g.fillRect(0, 0, W, H); }
        if (S.flashT > 0) { g.fillStyle = `rgba(255,255,255,${S.flashT * 1.6})`; g.fillRect(0, 0, W, H); }
        if (S.shield) {
          g.font = "700 10px Pretendard, system-ui, sans-serif";
          g.textAlign = "right";
          g.fillStyle = "#a5f3fc";
          g.fillText("보호막 1회", W - 12, H - 15);
        }

        // 배너
        if (S.banner) {
          const a = Math.min(1, S.banner.t / 0.35);
          g.globalAlpha = a;
          g.textAlign = "center";
          g.fillStyle = "#fff";
          g.font = "800 24px Pretendard, system-ui, sans-serif";
          g.fillText(S.banner.text, W / 2, H * 0.47);
          g.fillStyle = "#fbcfe8";
          g.font = "600 13px Pretendard, system-ui, sans-serif";
          g.fillText(S.banner.sub, W / 2, H * 0.47 + 26);
          g.globalAlpha = 1;
        }
      }

      function roundRect(x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }

      function drawPlayer(x, y, shield, t) {
        // 분사 불꽃
        const fl = 8 + Math.sin(t * 40) * 3;
        const fg = g.createLinearGradient(0, y + 18, 0, y + 18 + fl + 6);
        fg.addColorStop(0, "rgba(251, 191, 36, .9)");
        fg.addColorStop(1, "rgba(244, 63, 94, 0)");
        g.fillStyle = fg;
        g.beginPath(); g.moveTo(x - 5, y + 17); g.lineTo(x + 5, y + 17); g.lineTo(x, y + 20 + fl); g.closePath(); g.fill();
        // 날개(작은 잎)
        g.fillStyle = "#f472b6";
        g.beginPath(); g.moveTo(x - 9, y + 2); g.quadraticCurveTo(x - 20, y + 10, x - 16, y + 17); g.lineTo(x - 8, y + 12); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(x + 9, y + 2); g.quadraticCurveTo(x + 20, y + 10, x + 16, y + 17); g.lineTo(x + 8, y + 12); g.closePath(); g.fill();
        // 캡슐 몸통
        const w = 18, h = 40, r = 9;
        g.save();
        roundRect(x - w / 2, y - h / 2, w, h, r);
        g.clip();
        const top = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
        top.addColorStop(0, "#ea580c"); top.addColorStop(0.45, "#fb923c"); top.addColorStop(1, "#c2410c");
        g.fillStyle = top;
        g.fillRect(x - w / 2, y - h / 2, w, h / 2);
        const bot = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
        bot.addColorStop(0, "#e7e5e4"); bot.addColorStop(0.45, "#ffffff"); bot.addColorStop(1, "#d6d3d1");
        g.fillStyle = bot;
        g.fillRect(x - w / 2, y, w, h / 2);
        g.fillStyle = "rgba(255,255,255,.55)";
        g.fillRect(x - 5, y - h / 2 + 4, 2.5, h - 10);
        g.restore();
        g.strokeStyle = "rgba(124, 45, 18, .35)";
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x + w / 2, y); g.stroke();
        if (shield) {
          g.strokeStyle = `rgba(103, 232, 249, ${0.55 + Math.sin(t * 6) * 0.2})`;
          g.lineWidth = 2.5;
          g.beginPath(); g.arc(x, y, 26, 0, Math.PI * 2); g.stroke();
          g.fillStyle = "rgba(103, 232, 249, .08)";
          g.fill();
        }
      }

      function drawGerm(x, y, r, T, spin, flash, diving) {
        g.save();
        g.translate(x, y);
        if (T.oval) g.scale(1.15, 0.88);
        // 돌기
        g.strokeStyle = flash ? "#fff" : T.c2;
        g.fillStyle = flash ? "#fff" : T.c2;
        g.lineWidth = T.sharp ? 2 : 2.2;
        for (let i = 0; i < T.spikes; i++) {
          const a = (i / T.spikes) * Math.PI * 2 + spin * (T.sharp ? 1.2 : 0.6);
          const len = T.sharp ? 6 : 4 + Math.sin(spin * 4 + i) * 1;
          const x1 = Math.cos(a) * (r - 1), y1 = Math.sin(a) * (r - 1);
          const x2 = Math.cos(a) * (r + len), y2 = Math.sin(a) * (r + len);
          g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
          if (!T.sharp) { g.beginPath(); g.arc(x2, y2, 2, 0, Math.PI * 2); g.fill(); }
        }
        // 몸
        const grad = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.2, 0, 0, r);
        grad.addColorStop(0, flash ? "#fff" : T.c1);
        grad.addColorStop(1, flash ? "#fde68a" : T.c2);
        g.fillStyle = grad;
        g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
        // 반점
        g.fillStyle = "rgba(255,255,255,.25)";
        g.beginPath(); g.arc(r * 0.35, r * 0.4, r * 0.18, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(-r * 0.45, r * 0.25, r * 0.12, 0, Math.PI * 2); g.fill();
        // 눈
        const ey = -r * 0.12;
        g.fillStyle = "#fff";
        g.beginPath(); g.arc(-r * 0.32, ey, r * 0.24, 0, Math.PI * 2); g.arc(r * 0.32, ey, r * 0.24, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#1e1b4b";
        const look = diving ? r * 0.08 : 0;
        g.beginPath(); g.arc(-r * 0.32, ey + look, r * 0.12, 0, Math.PI * 2); g.arc(r * 0.32, ey + look, r * 0.12, 0, Math.PI * 2); g.fill();
        if (diving) {
          g.strokeStyle = "#1e1b4b"; g.lineWidth = 1.4;
          g.beginPath(); g.moveTo(-r * 0.55, ey - r * 0.38); g.lineTo(-r * 0.15, ey - r * 0.22); g.moveTo(r * 0.55, ey - r * 0.38); g.lineTo(r * 0.15, ey - r * 0.22); g.stroke();
        }
        g.restore();
      }

      function drawBoss(B) {
        const T = { c1: "#f9a8d4", c2: "#9d174d", spikes: 18 };
        g.save();
        g.translate(B.x, B.y);
        const flash = B.flash > 0;
        g.strokeStyle = flash ? "#fff" : "#be185d";
        g.fillStyle = flash ? "#fff" : "#a3e635";
        g.lineWidth = 3;
        for (let i = 0; i < T.spikes; i++) {
          const a = (i / T.spikes) * Math.PI * 2 + B.t * 0.5;
          const len = 10 + Math.sin(B.t * 3 + i * 1.7) * 4;
          g.beginPath(); g.moveTo(Math.cos(a) * (B.r - 2), Math.sin(a) * (B.r - 2)); g.lineTo(Math.cos(a) * (B.r + len), Math.sin(a) * (B.r + len)); g.stroke();
          g.beginPath(); g.arc(Math.cos(a) * (B.r + len), Math.sin(a) * (B.r + len), 3.2, 0, Math.PI * 2); g.fill();
        }
        const grad = g.createRadialGradient(-B.r * 0.35, -B.r * 0.4, B.r * 0.15, 0, 0, B.r);
        grad.addColorStop(0, flash ? "#fff" : "#fbcfe8");
        grad.addColorStop(0.6, flash ? "#fff" : "#ec4899");
        grad.addColorStop(1, flash ? "#fde68a" : "#9d174d");
        g.fillStyle = grad;
        g.beginPath(); g.arc(0, 0, B.r, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgba(255,255,255,.18)";
        for (const [dx, dy, rr] of [[18, 16, 6], [-22, 18, 4], [8, 28, 3.5], [-12, -26, 3]]) { g.beginPath(); g.arc(dx, dy, rr, 0, Math.PI * 2); g.fill(); }
        // 화난 눈
        g.fillStyle = "#fff";
        g.beginPath(); g.arc(-14, -6, 9, 0, Math.PI * 2); g.arc(14, -6, 9, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#1e1b4b";
        const lx = Math.max(-3, Math.min(3, (S.px - B.x) / 40));
        g.beginPath(); g.arc(-14 + lx, -3, 4.5, 0, Math.PI * 2); g.arc(14 + lx, -3, 4.5, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#1e1b4b"; g.lineWidth = 3; g.lineCap = "round";
        g.beginPath(); g.moveTo(-25, -20); g.lineTo(-6, -13); g.moveTo(25, -20); g.lineTo(6, -13); g.stroke();
        g.beginPath(); g.arc(0, 18, 9, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
        g.restore();
        // 체력 바
        const bw = W - 80, bx = 40, by = 14;
        g.fillStyle = "rgba(255,255,255,.14)";
        roundRect(bx, by, bw, 8, 4); g.fill();
        const hg = g.createLinearGradient(bx, 0, bx + bw, 0);
        hg.addColorStop(0, "#f472b6"); hg.addColorStop(1, "#a3e635");
        g.fillStyle = hg;
        roundRect(bx, by, Math.max(8, bw * (B.hp / B.maxHp)), 8, 4); g.fill();
        g.font = "700 10px Pretendard, system-ui, sans-serif";
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillStyle = "#fbcfe8";
        g.fillText(`큰 세균 Lv.${B.n}`, W / 2, by + 18);
      }

      function drawItem(it) {
        const x = it.x, y = it.y + Math.sin(it.t * 5) * 2;
        g.save();
        g.translate(x, y);
        g.fillStyle = "rgba(255,255,255,.12)";
        g.beginPath(); g.arc(0, 0, 15, 0, Math.PI * 2); g.fill();
        if (it.kind === "vitc") {
          g.fillStyle = "#f97316";
          g.beginPath(); g.arc(0, 0, 11, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "#fed7aa"; g.lineWidth = 1.2;
          for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); g.stroke(); }
          g.fillStyle = "#fff";
          g.font = "900 12px Pretendard, system-ui, sans-serif";
          g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText("C", 0, 1);
        } else if (it.kind === "mask") {
          g.strokeStyle = "#e2e8f0"; g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(-10, -4); g.lineTo(-14, -7); g.moveTo(-10, 4); g.lineTo(-14, 7); g.moveTo(10, -4); g.lineTo(14, -7); g.moveTo(10, 4); g.lineTo(14, 7); g.stroke();
          g.fillStyle = "#f8fafc";
          roundRect(-10, -7, 20, 14, 5); g.fill();
          g.strokeStyle = "#93c5fd"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(-7, -2); g.lineTo(7, -2); g.moveTo(-7, 2); g.lineTo(7, 2); g.stroke();
        } else if (ITEM_LOOK[it.kind]) {
          const [bg, fg, ch] = ITEM_LOOK[it.kind];
          g.fillStyle = bg;
          g.beginPath(); g.arc(0, 0, 11, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1.5;
          g.beginPath(); g.arc(0, 0, 11, 0, Math.PI * 2); g.stroke();
          g.fillStyle = fg;
          g.font = "900 11px Pretendard, system-ui, sans-serif";
          g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText(ch, 0, 1);
        } else {
          const dg = g.createLinearGradient(0, -12, 0, 11);
          dg.addColorStop(0, "#7dd3fc"); dg.addColorStop(1, "#2563eb");
          g.fillStyle = dg;
          g.beginPath(); g.moveTo(0, -13); g.bezierCurveTo(6, -5, 10, 0, 10, 4); g.arc(0, 4, 10, 0, Math.PI); g.bezierCurveTo(-10, 0, -6, -5, 0, -13); g.fill();
          g.fillStyle = "rgba(255,255,255,.6)";
          g.beginPath(); g.ellipse(-4, 4, 2, 4, 0.3, 0, Math.PI * 2); g.fill();
        }
        g.restore();
      }

      // ---------- 루프 ----------
      let raf = 0, last = 0;
      function frame(now) {
        raf = 0;
        if (state !== "play") return;
        let dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        const steps = Math.max(1, Math.ceil(dt / 0.017));
        for (let i = 0; i < steps && state === "play"; i++) update(dt / steps);
        draw();
        if (state === "play") raf = requestAnimationFrame(frame);
      }
      function run() {
        if (raf) cancelAnimationFrame(raf);
        last = performance.now();
        raf = requestAnimationFrame(frame);
      }

      // ---------- 화면 전환 ----------
      function showOverlay(html) {
        overlay.innerHTML = html;
        overlay.hidden = false;
        const btn = overlay.querySelector("button");
        if (btn) btn.focus({ preventScroll: true });
      }
      function showReady() {
        state = "ready";
        S = null;
        elScore.textContent = "0"; elWave.textContent = "1";
        elLives.innerHTML = '<i class="gm-life"></i><i class="gm-life"></i><i class="gm-life"></i>';
        draw();
        showOverlay(`<div class="gm-card">
          <h2>세균 격파</h2>
          <p>비타민 캡슐로 세균 편대를 물리쳐요.<br>돌진하는 세균은 <b>2배 점수</b> · 5웨이브마다 큰 세균!</p>
          <div class="gm-items">
            <div><span class="gm-dot" style="background:#f97316">C</span>확산탄</div>
            <div><span class="gm-dot" style="background:#facc15;color:#713f12">레</span>관통 레이저</div>
            <div><span class="gm-dot" style="background:#7c4a1e">커</span>빠른 연사</div>
            <div><span class="gm-dot" style="background:#22c55e">균</span>양옆 도우미</div>
            <div class="is-new"><span class="gm-dot" style="background:#ef4444">생</span>유도탄</div>
            <div class="is-new"><span class="gm-dot" style="background:#a8a29e">마</span>마늘 방패</div>
            <div class="is-new"><span class="gm-dot" style="background:#dc2626">고</span>고추 화염</div>
            <div class="is-new"><span class="gm-dot" style="background:#c084fc">양</span>파동탄</div>
            <div class="is-new"><span class="gm-dot" style="background:#3b82f6">블</span>연쇄 번개</div>
            <div><span class="gm-dot" style="background:#0ea5e9">소</span>화면 소독</div>
          </div>
          <p class="gm-items-note">같은 무기를 또 먹으면 <b>최대 3단계</b> · 빨간 칩은 새 무기 · 가끔 마스크·물방울·비타민D·꿀</p>
          <div class="gm-keys">PC 방향키 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · 자동 연사 · <kbd>Esc</kbd> 일시정지<br>모바일은 화면을 끌면 그쪽으로 따라와요</div>
          <button type="button" class="gm-go" data-act="start">시작</button>
        </div>`);
      }
      function start() {
        overlay.hidden = true;
        overlay.innerHTML = "";
        keys.left = keys.right = keys.up = keys.down = false;
        pointerX = pointerY = null;
        makeStars();
        newGame();
        state = "play";
        run();
      }
      function pause() {
        if (state !== "play") return;
        state = "paused";
        keys.left = keys.right = keys.up = keys.down = false;
        pointerX = pointerY = null;
        showOverlay(`<div class="gm-card"><h2>잠깐 쉬는 중</h2><p>현재 점수 <b>${S.score.toLocaleString("ko-KR")}</b>점 · 웨이브 ${S.wave}</p><button type="button" class="gm-go" data-act="resume">계속하기</button></div>`);
      }
      function resume() {
        if (state !== "paused") return;
        overlay.hidden = true;
        state = "play";
        run();
      }
      function finish() {
        state = "over";
        draw();
        ctx.sfx("lose");
        const score = S.score;
        showOverlay(`<div class="gm-card"><h2>게임 오버</h2><p>웨이브 ${S.wave}까지 버텼어요</p><div class="gm-big">${score.toLocaleString("ko-KR")}점</div><button type="button" class="gm-go" data-act="start">다시 하기</button></div>`);
        ctx.submit(score);
      }

      overlay.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        if (b.dataset.act === "start") start();
        else if (b.dataset.act === "resume") resume();
      });

      // ---------- 입력 ----------
      function typing(e) {
        const t = e.target;
        return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
      }
      const dialogOpen = () => !!document.querySelector(".hk-dialog__overlay");
      window.addEventListener("keydown", (e) => {
        if (typing(e) || dialogOpen()) return;
        const c = e.code;
        const gameKey = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(c);
        if (state === "play") {
          if (gameKey) e.preventDefault();
          if (c === "ArrowLeft" || c === "KeyA") keys.left = true;
          if (c === "ArrowRight" || c === "KeyD") keys.right = true;
          if (c === "ArrowUp" || c === "KeyW") keys.up = true;
          if (c === "ArrowDown" || c === "KeyS") keys.down = true;
          if (c === "KeyP" || c === "Escape") pause();
        } else if (state === "paused") {
          if (gameKey) e.preventDefault();
          if (c === "Space" || c === "Enter" || c === "KeyP") { e.preventDefault(); resume(); }
        } else if (state === "ready") {
          if (gameKey) e.preventDefault();
          if (c === "Space" || c === "Enter") { e.preventDefault(); start(); }
        }
      });
      window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
        if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
        if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
      });
      window.addEventListener("blur", () => { keys.left = keys.right = keys.up = keys.down = false; pointerX = pointerY = null; });
      // 손가락에 가리지 않게 기체는 누른 곳보다 조금 위로
      function toWorldY(e) {
        const rect = canvas.getBoundingClientRect();
        return ((e.clientY - rect.top) / rect.height) * H - 48;
      }

      function toWorldX(e) {
        const rect = canvas.getBoundingClientRect();
        return ((e.clientX - rect.left) / rect.width) * W;
      }
      let dragging = false;
      canvas.addEventListener("pointerdown", (e) => {
        if (state !== "play") return;
        dragging = true;
        pointerX = toWorldX(e);
        pointerY = toWorldY(e);
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!dragging || state !== "play") return;
        pointerX = toWorldX(e);
        pointerY = toWorldY(e);
      });
      const endDrag = () => { dragging = false; pointerX = pointerY = null; };
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

      // ---------- 시작 ----------
      ctx.onRestart(start);
      ctx.onPause(pause);
      if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);
      window.addEventListener("resize", fit);
      fit();
      showReady();
    },
  });
  </script>
</body>
</html>
