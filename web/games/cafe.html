<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 옥상 쉼터 카페</title>
  <meta name="description" content="회사 옥상에 작은 카페를 차려 키워요. 시설을 올리고 메뉴를 늘리고 알바생과 함께 손님을 맞아요. 자리 비운 동안에도 장사해요.">
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <link rel="stylesheet" href="/_shared/mgmt-ui.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/mgmt.js"></script>
  <script src="/_shared/mgmt-fx.js"></script>
  <script src="/_shared/mgmt-music.js"></script>
  <script src="/_shared/cafe.js"></script>
  <style>
    .cf-music.is-off { color: #94a3b8; }
    /* 옥상 쉼터 카페 — 따뜻한 코랄 · 캐러멜 + 크림 · 민트. 장면(아이소메트릭 디오라마)이 주인공 */
    .mgx.cf, .cf-ov, .cf-more {
      --mg-accent: #ff7a45; --mg-accent-deep: #d9541f; --mg-soft: #ffe9dd; --mg-tint: #fff6ef; --mg-ink: #3a2418; --mg-sub: #8a6a58; --mg-line: rgba(110, 60, 30, .10);
      --mg-gold: #ffb020; --mg-gold-deep: #d98a00;
      --mg-shadow: 0 10px 26px rgba(140, 70, 30, .11), 0 2px 6px rgba(140, 70, 30, .07);
      --cf-mint: #3cc9a5; --cf-mint-deep: #1f9e7c; --cf-cream: #fff3e2;
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all;
    }
    body.mgx-body { background: radial-gradient(120% 50% at 50% 0%, #ffe6d6 0%, #fff6ef 60%) fixed, #fff6ef; }
    .mgx-shell.cf { background: transparent; }
    .cf [hidden] { display: none !important; }
    .cf-loading { display: flex; justify-content: center; padding: 120px 0; }
    .cf-closed { padding: 24px 16px; }

    /* 위 막대 */
    .cf-top { background: color-mix(in srgb, #fff6ef 80%, transparent); }
    .cf-top .mgx-top__title { gap: 8px; }
    .cf-logo { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 11px; background: #fff; box-shadow: 0 2px 0 var(--mg-line), 0 4px 10px rgba(140, 70, 30, .08); flex-shrink: 0; }
    .cf-top__name { overflow: hidden; text-overflow: ellipsis; }
    .cf-top__chip { background: var(--mg-accent); color: #fff; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12); }
    @media (max-width: 440px) {
      .cf-top { gap: 4px; padding: 0 8px; }
      .cf-top .mgx-top__back { padding-right: 4px; font-size: 13.5px; }
      .cf-logo { display: none; }
      .cf-top .mgx-top__title { gap: 6px; font-size: 15.5px; }
      .cf-top__chip { min-height: 22px; padding: 0 7px; font-size: 11.5px; }
    }

    /* 배치 — 휴대폰: 장면 · 판 · 아래 독 / PC: 왼쪽 큰 장면 · 오른쪽 판 */
    .cf-main { flex: 1; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 1240px; margin: 0 auto; padding: 10px 12px 0; box-sizing: border-box; }
    .cf-stage { height: calc(min(100vw - 24px, 900px) * .77 + 90px); min-height: 330px; max-height: 76dvh; border-radius: 28px; background: #ffe6cf;
      box-shadow: 0 18px 40px rgba(140, 70, 30, .18), 0 2px 0 rgba(255, 255, 255, .6) inset; }
    .cf-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .cf-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .cf-dock { margin: 2px -12px 0; z-index: 25; }
    .cf-dock .mgx-tab { min-height: 58px; }
    .cf-dock .mgx-tab[aria-selected="true"] { background: var(--mg-soft); color: var(--mg-accent-deep); }
    .cf-dock .mgx-tab[aria-selected="true"] svg { transform: translateY(-2px) scale(1.14); }
    @media (min-width: 960px) {
      .cf-main { display: grid; grid-template-columns: minmax(0, 1fr) 432px; gap: 20px; padding: 18px 24px 32px; align-items: start; }
      .cf-stagecol { position: sticky; top: 74px; }
      .cf-stage { height: calc(100dvh - 96px); min-height: 560px; max-height: 880px; }
      .cf-dock { order: -1; position: sticky; top: 66px; margin: 0; padding: 6px; border: 0; border-radius: 22px; background: rgba(255, 255, 255, .92); box-shadow: var(--mg-shadow); }
      .cf-dock .mgx-tab { min-height: 56px; flex-direction: row; gap: 6px; font-size: 13.5px; }
      .cf-dock .mgx-tab svg { width: 22px; height: 22px; }
      .cf-dock .mgx-dot { top: 6px; right: 6px; }
    }

    /* 장면 위 HUD */
    .cf-hud { gap: 6px; align-items: flex-start; }
    .cf-hud .mgx-pill { border: 1px solid rgba(255, 255, 255, .7); font-family: inherit; }
    .cf-hud button.mgx-pill { cursor: pointer; transition: transform .14s ease; }
    .cf-hud button.mgx-pill:active { transform: scale(.95); }
    .cf-pill b { font-size: 14.5px; font-weight: 900; letter-spacing: -.01em; }
    .cf-gpill { margin-left: auto; padding: 2px 12px 2px 2px; }
    .cf-gpill svg { flex-shrink: 0; }
    .cf-gpill__t { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
    .cf-gpill__t small { font-size: 10.5px; }
    .cf-gpill__t b { font-size: 13px; color: var(--mg-accent-deep); }
    @media (max-width: 560px) {
      .cf-hud { left: 8px; right: 8px; top: 8px; gap: 5px; }
      .cf-hud .mgx-pill { min-height: 32px; font-size: 13px; padding-right: 9px; gap: 5px; }
      .cf-hud .mgx-pill__ic { width: 26px; height: 26px; }
      .cf-pill b { font-size: 13px; }
      .cf-pill small { display: none; }
      .cf-gpill { padding: 1px; }
      .cf-gpill__t { display: none; }
    }
    /* 받을 수입 말풍선 */
    .cf-ready { font-size: 14px; padding: 5px 12px 5px 5px; box-shadow: 0 8px 20px rgba(140, 70, 30, .28); }
    .cf-ready > span:first-child { width: 26px; height: 26px; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); }
    .cf-ready::before { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid rgba(255, 176, 32, .55); animation: cf-ping 1.8s ease-out infinite; pointer-events: none; }
    .cf-ready.is-full { background: var(--mg-accent); color: #fff; }
    .cf-ready.is-full::after { background: var(--mg-accent); }
    .cf-ready.is-full::before { border-color: rgba(255, 122, 69, .7); }
    @keyframes cf-ping { 0% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
    /* 공사 표시 */
    .cf-tags, .cf-spots-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .cf-btag { position: absolute; transform: translate(-50%, -100%); display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 6px 7px; border-radius: 999px; background: rgba(58, 36, 24, .84); color: #ffd98a; font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; box-shadow: 0 4px 12px rgba(58, 36, 24, .25); }
    .cf-btag span { color: #fff; }
    .cf-btag::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: var(--v, 0%); background: #ffb020; }
    /* 꾸미기 자리 「+」 */
    .cf-spot-pin { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 2px dashed rgba(255, 255, 255, .95); border-radius: 999px; background: rgba(255, 122, 69, .35); color: #fff; cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); box-shadow: 0 4px 12px rgba(140, 70, 30, .2); animation: cf-breathe 2.2s ease-in-out infinite; }
    .cf-spot-pin::before { content: ""; position: absolute; inset: -5px; border-radius: inherit; }
    .cf-spot-pin.is-filled { width: 26px; height: 26px; border: 2px solid #fff; background: var(--mg-accent); font-size: 12px; font-weight: 900; animation: none; }
    @keyframes cf-breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }
    /* 재배치 — 단추는 장면 오른쪽 아래(「막힌 곳」 알약 위), 모드 중엔 다른 말풍선 · 단추를 숨기고 자리 핀만 */
    .cf-movebtn { position: absolute; z-index: 7; right: 10px; bottom: 50px; font-family: inherit; color: var(--mg-accent-deep); box-shadow: 0 4px 14px rgba(140, 70, 30, .16); }
    .cf-movebtn:active { transform: scale(.96); }
    .cf-movebar { font-family: inherit; }
    .cf-movebar button { font-family: inherit; }
    .cf-hud, .cf-ready, .cf-limit { transition: opacity .18s ease; }
    .cf.is-moving .cf-hud, .cf.is-moving .cf-ready, .cf.is-moving .cf-limit { opacity: 0; pointer-events: none; }
    .cf.is-moving .cf-hud > * { pointer-events: none; }
    .cf.is-moving .cf-stage canvas { cursor: default !important; }
    .cf.is-moving .cf-stage::after { content: ""; position: absolute; inset: 0; z-index: 4; border-radius: inherit; box-shadow: inset 0 0 0 3px rgba(255, 122, 69, .55); pointer-events: none; }
    .cf-spot-pin.is-move { animation: none; transition: transform .15s ease, background .15s ease, opacity .15s ease; }
    .cf-spot-pin.is-move.is-filled { width: 34px; height: 34px; font-size: 14px; }
    .cf-spot-pin.is-move::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; pointer-events: none; }
    .cf-spot-pin.is-pickable::after { border: 2px solid rgba(255, 255, 255, .95); animation: mgx-movepulse 1.4s ease-in-out infinite; }
    .cf-spot-pin.is-idle { opacity: .5; background: rgba(255, 255, 255, .18); }
    .cf-spot-pin.is-move-src { transform: translate(-50%, -50%) scale(1.18); background: #fff; color: var(--mg-accent-deep); border-color: var(--mg-accent); box-shadow: 0 0 0 4px rgba(255, 122, 69, .45), 0 8px 18px rgba(140, 70, 30, .3); z-index: 2; }
    .cf-spot-pin.is-move-ok { background: rgba(43, 179, 154, .78); border-color: #fff; }
    .cf-spot-pin.is-move-ok.is-filled { background: #2bb39a; }
    .cf-spot-pin.is-move-ok::after { border: 2px dashed rgba(255, 255, 255, .95); animation: mgx-movepulse 1.1s ease-in-out infinite; }
    .cf-spot-pin.is-locked { width: 26px; height: 26px; border: 2px solid rgba(255, 255, 255, .55); background: rgba(70, 45, 30, .38); color: rgba(255, 255, 255, .85); opacity: .6; cursor: not-allowed; }
    @media (max-width: 560px) {
      .cf-movebtn { right: 8px; bottom: 48px; min-height: 38px; padding: 0 12px; }
      .cf-movebar { top: 8px; border-radius: 18px; font-size: 12.5px; padding: 6px 6px 6px 12px; }
      .cf-spot-pin.is-move.is-filled { width: 28px; height: 28px; font-size: 12.5px; } /* 1 · 4번 자리가 가까워 휴대폰에선 조금 작게 · 누르는 범위도 핀 크기 그대로 */
      .cf-spot-pin.is-move::before { inset: 0; }
    }
    /* 시각 · 막힌 곳 */
    .cf-clock { position: absolute; left: 10px; bottom: 10px; z-index: 5; min-height: 30px; padding: 0 11px 0 8px; gap: 5px; font-size: 12.5px; }
    .cf-limit { position: absolute; right: 10px; bottom: 10px; z-index: 5; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; max-width: 58%; padding: 0 12px 0 10px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .86); color: var(--mg-accent-deep); font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 14px rgba(140, 70, 30, .16); }
    .cf-limit span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cf-limit:active { transform: scale(.96); }

    /* 상태 카드(쌓인 수입 · 등급 · 공사) */
    .cf-status { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
    .cf-inc { display: flex; align-items: center; gap: 12px; }
    .cf-inc__body { flex: 1; min-width: 0; }
    .cf-inc__num { font-size: 26px; font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
    .cf-inc__btn { flex-shrink: 0; min-width: 104px; }
    .cf-k { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; color: var(--mg-sub); }
    .cf-mini { font-size: 12.5px; color: var(--mg-sub); line-height: 1.5; }
    .cf-mini b { color: var(--mg-ink); }
    .cf-warn, .cf-mini.cf-warn { color: #e5484d; font-weight: 800; }
    .cf-gr, .cf-builds { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; padding-top: 10px; border-top: 1.5px dashed var(--mg-line); }
    .cf-gr__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cf-gr__head b { font-size: 15px; font-weight: 900; }
    .cf-req { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 12.5px; }
    .cf-req > span { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cf-req em, .cf-prog em { font-style: normal; color: var(--mg-sub); font-weight: 700; white-space: nowrap; }
    .cf-req .mgx-bar, .cf-prog .mgx-bar { height: 10px; }
    .cf-builds .cf-req { grid-template-columns: 104px minmax(0, 1fr) auto; }
    .cf-donecard { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; cursor: pointer; font: inherit; background: linear-gradient(135deg, #fff7e0, #ffe2a8); color: #8a5a00; }
    .cf-donecard div { flex: 1; display: flex; flex-direction: column; }
    .cf-donecard span { font-size: 12.5px; }

    /* 판 공통 */
    .cf-panel { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
    .cf-phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px 0; }
    .cf-phead__t { font-size: 21px; font-weight: 900; letter-spacing: -.03em; }
    .cf-pnote { padding: 0 4px; margin-top: -6px; }
    .cf-list { display: flex; flex-direction: column; gap: 10px; }
    .cf-cost { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; }
    .cf-coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffb020 60%, #d98a00); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .18), 0 0 0 1px rgba(255, 255, 255, .5); flex-shrink: 0; }
    .cf-lock { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 14px; background: rgba(110, 60, 30, .05); color: var(--mg-sub); font-size: 13px; font-weight: 700; }
    .cf-buy { width: 100%; justify-content: space-between; min-height: 52px; padding: 0 16px; }
    .cf-buy small { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; opacity: .96; }
    .cf-buy[disabled] small .cf-coin { filter: grayscale(1); }
    .cf-prog { display: flex; align-items: center; gap: 10px; }
    .cf-prog .mgx-bar { flex: 1; }

    /* 시설 */
    .cf-hint { display: flex; flex-direction: column; gap: 10px; background: linear-gradient(135deg, #fff, #fff3e8); }
    .cf-hint__head { display: flex; gap: 10px; }
    .cf-hint__head b { font-size: 15px; font-weight: 900; }
    .cf-hint__head p { margin: 2px 0 0; font-size: 13px; color: var(--mg-sub); line-height: 1.5; }
    .cf-hint__ic { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 13px; background: #fff0bf; color: #b7791f; flex-shrink: 0; box-shadow: inset 0 -3px 0 rgba(183, 121, 31, .15); }
    .cf-flow { display: flex; flex-direction: column; gap: 6px; }
    .cf-flow__row { display: grid; grid-template-columns: 20px 112px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; background: rgba(110, 60, 30, .04); font-size: 12.5px; }
    .cf-flow__ic { display: inline-flex; color: var(--mg-sub); }
    .cf-flow__row b { font-weight: 900; white-space: nowrap; }
    .cf-flow__bar { height: 8px; border-radius: 999px; background: rgba(110, 60, 30, .08); overflow: hidden; }
    .cf-flow__bar i { display: block; height: 100%; border-radius: inherit; background: #ffc9ad; }
    .cf-flow__row.is-limit { background: #fff; box-shadow: inset 0 0 0 2px var(--mg-accent); color: var(--mg-accent-deep); font-weight: 800; }
    .cf-flow__row.is-limit .cf-flow__ic { color: var(--mg-accent); }
    .cf-flow__row.is-limit .cf-flow__bar i { background: var(--mg-accent); }
    .cf-fac, .cf-staff { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; padding: 12px 14px 14px; }
    .cf-fac__art { display: flex; align-items: center; justify-content: center; width: 92px; height: 78px; border-radius: 18px; overflow: hidden; background: linear-gradient(180deg, #fff3ea, #ffe3d0); box-shadow: inset 0 -3px 0 rgba(217, 84, 31, .08); }
    .cf-fac__art img { width: 96px; height: 80px; display: block; }
    .cf-fac__body { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
    .cf-fac__head { display: flex; align-items: center; gap: 8px; }
    .cf-fac__head b { font-size: 16px; font-weight: 900; letter-spacing: -.02em; }
    .cf-lv { margin-left: auto; padding: 2px 9px; border-radius: 999px; background: var(--mg-soft); color: var(--mg-accent-deep); font-size: 12.5px; font-weight: 900; white-space: nowrap; }
    .cf-pips { display: flex; gap: 3px; }
    .cf-pips i { flex: 1; max-width: 24px; height: 7px; border-radius: 4px; background: rgba(110, 60, 30, .11); }
    .cf-pips i.on { background: linear-gradient(180deg, #ffa071, var(--mg-accent)); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .1); }
    .cf-pips i.cap { background: repeating-linear-gradient(-45deg, rgba(110, 60, 30, .10) 0 2px, transparent 2px 4px); }
    .cf-pips i.build { background: #ffb020; animation: cf-blink 1s ease-in-out infinite; }
    @keyframes cf-blink { 50% { opacity: .35; } }
    .cf-fac__now { font-size: 13px; font-weight: 700; line-height: 1.45; }
    .cf-next { display: flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 800; color: var(--cf-mint-deep); }
    .cf-fac__foot { grid-column: 1 / -1; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .cf-fac.is-locked .cf-fac__art img { filter: grayscale(.9); opacity: .5; }
    .cf-fac.is-building .cf-fac__art { background: repeating-linear-gradient(-45deg, #fff3d6 0 8px, #ffe8b8 8px 16px); }
    .cf-fac.is-flash { animation: cf-flash 1.5s ease; }
    @keyframes cf-flash { 0%, 100% { box-shadow: var(--mg-shadow); } 20%, 60% { box-shadow: 0 0 0 4px var(--mg-accent), var(--mg-shadow); } }

    /* 메뉴 */
    .cf-shelf { display: flex; flex-direction: column; gap: 10px; }
    .cf-shelf__row { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 6px; padding: 8px 8px 16px; border-radius: 16px; background: linear-gradient(180deg, #fff4ea 0 78%, #dcab7b 78% 88%, #bf885a 88%); }
    .cf-slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: 76px; color: var(--mg-sub); font-size: 11.5px; font-weight: 800; text-align: center; line-height: 1.25; }
    .cf-slot.is-on { color: var(--mg-ink); }
    .cf-slot > svg { flex-shrink: 0; }
    .cf-slot:not(.is-on) > svg { width: 20px; height: 20px; padding: 10px; margin-bottom: 4px; border: 2px dashed rgba(110, 60, 30, .22); border-radius: 14px; color: rgba(110, 60, 30, .35); }
    .cf-drinks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 600px) and (max-width: 959px) { .cf-drinks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .cf-drink { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 10px 12px; border-radius: 22px; background: #fff; text-align: center; box-shadow: var(--mg-shadow); }
    .cf-drink__art { display: flex; align-items: center; justify-content: center; width: 100%; height: 96px; margin-bottom: 4px; border-radius: 16px; background: var(--cat-bg); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .04); }
    .cf-cat-coffee { --cat-bg: linear-gradient(180deg, #fff3e6, #ffe0c6); }
    .cf-cat-dessert { --cat-bg: linear-gradient(180deg, #fff1f5, #ffdbe7); }

</head>
<body class="mgx-body">
  <div id="app"><div class="cf-loading"><span class="hk-spin"></span></div></div>
  <script>
    // 매니지먼트 「옥상 쉼터 카페」 — 꽉 찬 게임 화면. 그리는 일 · 계산은 모두 /_shared/cafe.js(HKCafe) 가 맡는다.
    (async () => {
      try { await HKUI.loadLucide(); } catch (_) { /* 아이콘이 없어도 게임은 돈다 */ }
      const profile = await HKMember.requireAuth(location.pathname + location.hash);
      if (!profile) return;
      HKCafe.mount(document.getElementById("app"));
    })();
  </script>
