<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 옥상 쉼터 카페</title>
  <meta name="description" content="회사 옥상에 작은 카페를 차려 키워요. 시설을 올리고 메뉴를 늘리고 알바생과 함께 손님을 맞아요. 자리 비운 동안에도 장사해요.">
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/mgmt.js"></script>
  <script src="/_shared/cafe.js"></script>
  <style>
    .cf, .cf-ov { --cf-blue: #2f6bff; --cf-ink: #0f172a; --cf-sub: #64748b; --cf-line: #e2e8f0; --cf-soft: #f5f7fb; }
    .cf { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; color: var(--cf-ink); word-break: keep-all; }
    .cf *, .cf-ov * { box-sizing: border-box; }
    .cf [hidden] { display: none !important; }
    .cf-loading { display: flex; justify-content: center; padding: 80px 0; }

    .cf-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .cf-head__title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cf-head h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .cf-head p { margin: 2px 0 0; font-size: 13px; color: var(--cf-sub); }
    .cf-back { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; color: var(--cf-ink); flex-shrink: 0; }
    .cf-back:hover { background: var(--cf-soft); }
    .cf-head__btns { display: flex; gap: 6px; flex-shrink: 0; }
    .cf-iconbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--cf-line); border-radius: 14px; background: #fff; color: #334155; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .cf-iconbtn:hover { background: var(--cf-soft); }

    .cf-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    @media (min-width: 960px) { .cf-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); align-items: start; } .cf-right { position: sticky; top: 76px; } }
    .cf-left, .cf-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

    .cf-scene { position: relative; border-radius: 20px; overflow: hidden; background: #cfe3ff; box-shadow: 0 6px 24px rgba(15, 23, 42, .08); }
    .cf-scene canvas { display: block; width: 100%; }
    .cf-scene__chips { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; justify-content: flex-end; gap: 6px; pointer-events: none; }
    .cf-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255, 255, 255, .88); color: #1e293b; font-size: 12px; font-weight: 700; backdrop-filter: blur(4px); }
    .cf-chip--grade { background: var(--cf-blue); color: #fff; }
    .cf-scene__full { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: #fff7ed; color: #c2410c; font-size: 12.5px; font-weight: 700; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); white-space: nowrap; }

    .cf-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 560px) { .cf-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .cf-stat { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border: 1px solid var(--cf-line); border-radius: 16px; min-width: 0; }
    .cf-stat > span { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: #eef3ff; color: var(--cf-blue); flex-shrink: 0; }
    .cf-stat small { display: block; font-size: 11.5px; color: var(--cf-sub); }
    .cf-stat b { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .cf-card { background: #fff; border: 1px solid var(--cf-line); border-radius: 20px; padding: 14px 16px; }
    .cf-label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--cf-sub); }
    .cf-sub { font-size: 12.5px; color: var(--cf-sub); line-height: 1.5; }
    .cf-income__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cf-income__num { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .cf-collect { min-height: 48px; padding: 0 18px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; flex-shrink: 0; }
    .cf-full-txt { color: #c2410c; }
    .cf-bar { height: 10px; border-radius: 999px; background: #edf1f7; overflow: hidden; margin: 10px 0 6px; }
    .cf-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #5b8cff, var(--cf-blue)); transition: width .6s ease; }
    .cf-bar i.is-full { background: linear-gradient(90deg, #fb923c, #f97316); }
    .cf-bar--sm { height: 8px; margin: 0; flex: 1; min-width: 60px; }
    .cf-bar--violet i { background: linear-gradient(90deg, #a78bfa, #7c3aed); }
    .cf-bar--amber i { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
    .cf-bar--green i { background: linear-gradient(90deg, #6ee7b7, #10b981); }

    .cf-grade__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .cf-grade__head b { font-size: 16px; }
    .cf-req, .cf-build, .cf-prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; margin-top: 6px; }
    .cf-req > span, .cf-build > span { width: 84px; flex-shrink: 0; color: #334155; font-weight: 600; }
    .cf-req em, .cf-build em, .cf-prog em { font-style: normal; color: var(--cf-sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cf-pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .cf-pill--gold { background: #fef3c7; color: #b45309; }
    .cf-builds .cf-build > span { width: auto; min-width: 96px; }

    .cf-donecard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; font: inherit; background: linear-gradient(135deg, #fffbeb, #fef3c7); border-color: #fcd34d; color: #92400e; }
    .cf-donecard div { flex: 1; display: flex; flex-direction: column; }
    .cf-donecard span { font-size: 12.5px; }

    .cf-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #eef1f6; border-radius: 16px; }
    .cf-tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; border-radius: 12px; background: transparent; color: #475569; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .cf-tab.is-on { background: #fff; color: var(--cf-blue); box-shadow: 0 2px 8px rgba(15, 23, 42, .08); }
    .cf-tab__dot { position: absolute; top: 5px; right: calc(50% - 20px); min-width: 8px; height: 8px; border-radius: 999px; background: #ef4444; font-size: 10px; line-height: 16px; color: #fff; }
    .cf-tab__dot:not(:empty) { min-width: 16px; height: 16px; padding: 0 4px; top: 3px; right: calc(50% - 24px); }

    .cf-panel { display: flex; flex-direction: column; gap: 10px; }
    .cf-list { display: flex; flex-direction: column; gap: 8px; }
    .cf-item { display: flex; gap: 12px; padding: 14px; background: #fff; border: 1px solid var(--cf-line); border-radius: 18px; }
    .cf-item.is-on { border-color: #bcd0ff; background: #f8faff; }
    .cf-item.is-locked { background: #fafbfc; }
    .cf-item.is-locked .cf-item__icon, .cf-item.is-locked .cf-face { filter: grayscale(.9); opacity: .55; }
    .cf-item__icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; background: #eef3ff; color: var(--cf-blue); }
    .cf-c-coffee { background: #f5ebe0; color: #8b5a33; } .cf-c-seat { background: #ecfdf5; color: #059669; } .cf-c-counter { background: #eef3ff; color: var(--cf-blue); }
    .cf-c-plant { background: #f0fdf4; color: #16a34a; } .cf-c-dessert { background: #fdf2f8; color: #db2777; } .cf-c-tea { background: #f7fee7; color: #65a30d; }
    .cf-c-order { background: #fff7ed; color: #ea580c; } .cf-c-done { background: #dcfce7; color: #16a34a; }
    .cf-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .cf-item__title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cf-item__title b { font-size: 15px; }
    .cf-item__desc { font-size: 12.5px; color: var(--cf-sub); line-height: 1.5; }
    .cf-lv { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--cf-blue); }
    .cf-lv small { color: #94a3b8; font-weight: 600; }
    .cf-now { font-size: 12.5px; color: #334155; font-weight: 600; }
    .cf-next { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #059669; font-weight: 600; }
    .cf-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 700; }
    .cf-tag--barista { background: #f5ebe0; color: #8b5a33; } .cf-tag--pastry { background: #fdf2f8; color: #db2777; } .cf-tag--service { background: #ecfdf5; color: #059669; }
    .cf-act { align-self: flex-start; min-height: 44px; margin-top: 4px; border-radius: 12px; font-weight: 700; white-space: normal; text-align: left; display: inline-flex; align-items: center; gap: 6px; }
    .cf-act:has(small) { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; padding-top: 6px; padding-bottom: 6px; line-height: 1.3; }
    .cf-act small { font-size: 11.5px; font-weight: 600; opacity: .85; }
    .cf-lock { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12.5px; color: #94a3b8; font-weight: 600; }
    .cf-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: #334155; }
    .cf-meta span { display: inline-flex; align-items: center; gap: 3px; }
    .cf-stars { color: #f59e0b; letter-spacing: 1px; font-size: 11px; }
    .cf-stars i { color: #e2e8f0; font-style: normal; }
    .cf-face { width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; }
    .cf-face--deco { width: 64px; height: 52px; border-radius: 14px; }
    .cf-reward { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: #b45309; font-weight: 700; }
    .cf-order.is-done { border-color: #86efac; background: #f0fdf4; }

    .cf-hint { display: flex; gap: 10px; padding: 14px; border-radius: 18px; background: linear-gradient(135deg, #eef4ff, #f6f9ff); border: 1px solid #d6e2ff; }
    .cf-hint__icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 12px; background: #fff; color: var(--cf-blue); flex-shrink: 0; }
    .cf-hint b { font-size: 14px; } .cf-hint p { margin: 2px 0 8px; font-size: 12.5px; color: #475569; line-height: 1.5; }
    .cf-hint small { font-size: 11.5px; color: var(--cf-sub); }
    .cf-flow { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
    .cf-flow__row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: 10px; background: rgba(255, 255, 255, .7); font-size: 12.5px; }
    .cf-flow__row.is-limit { background: #fff; box-shadow: inset 0 0 0 1.5px var(--cf-blue); color: var(--cf-blue); font-weight: 700; }
    .cf-note { display: flex; gap: 8px; padding: 12px 14px; border-radius: 16px; background: var(--cf-soft); font-size: 12.5px; color: #475569; line-height: 1.55; }
    .cf-note > i, .cf-note > svg { flex-shrink: 0; margin-top: 2px; color: var(--cf-blue); }

    .cf-slots { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #fff; border: 1px solid var(--cf-line); border-radius: 18px; }
    .cf-slots__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cf-slots__row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
    .cf-slot { display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 6px 8px; border-radius: 12px; border: 1.5px dashed #cbd5e1; color: #94a3b8; font-size: 12.5px; font-weight: 600; text-align: center; }
    .cf-slot.is-on { border: 1.5px solid #bcd0ff; background: #f3f7ff; color: #1e3a8a; }
    .cf-slots .cf-act { align-self: stretch; justify-content: center; }

    .cf-spots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .cf-spot { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 72px; padding: 10px; border: 1.5px dashed #bcd0ff; border-radius: 14px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
    .cf-spot.is-filled { border-style: solid; background: #f3f7ff; }
    .cf-spot:disabled { border-color: #e2e8f0; color: #94a3b8; cursor: default; background: #fafbfc; }
    .cf-spot__no { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: var(--cf-blue); color: #fff; font-size: 11px; font-weight: 800; }
    .cf-spot:disabled .cf-spot__no { background: #cbd5e1; }
    .cf-spot__name { font-size: 12px; font-weight: 700; color: #334155; }
    .cf-spot__item { font-size: 11.5px; color: var(--cf-sub); }
    .cf-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 12px; color: var(--cf-sub); font-size: 12.5px; text-align: center; }
    .cf-empty b { color: #334155; font-size: 14px; }

    .cf-ov { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 23, 42, .45); animation: cf-fade .18s ease; }
    .cf-modal { position: relative; width: 100%; max-width: 440px; max-height: min(86vh, 720px); overflow-y: auto; padding: 24px 20px 18px; border-radius: 22px; background: #fff; color: var(--cf-ink); box-shadow: 0 24px 60px rgba(15, 23, 42, .25); word-break: keep-all; animation: cf-pop .22s ease; }
    .cf-modal h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; text-align: center; }
    .cf-modal__lead { margin: 0 0 14px; font-size: 14px; color: #475569; line-height: 1.6; text-align: center; }
    .cf-modal__x { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #64748b; cursor: pointer; }
    .cf-modal__x:hover { background: var(--cf-soft); }
    .cf-modal__icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 18px; background: #eef3ff; color: var(--cf-blue); }
    .cf-modal__icon--gold { background: #fef3c7; color: #d97706; }
    .cf-modal__btns { display: flex; gap: 8px; margin-top: 16px; }
    .cf-modal__btns .hk-btn { flex: 1; min-height: 48px; border-radius: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .cf-away { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .cf-away li { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--cf-soft); font-size: 13.5px; line-height: 1.5; }
    .cf-away li > i, .cf-away li > svg { flex-shrink: 0; margin-top: 2px; color: var(--cf-blue); }
    .cf-away li.is-warn { background: #fff7ed; } .cf-away li.is-warn > svg { color: #ea580c; }
    .cf-away li.is-good { background: #fef9c3; } .cf-away li.is-good > svg { color: #ca8a04; }
    .cf-tut__step { text-align: center; font-size: 12px; font-weight: 700; color: var(--cf-blue); margin-bottom: 4px; }
    .cf-help p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.6; color: #334155; }
    .cf-pick { display: flex; flex-direction: column; gap: 6px; }
    .cf-pick__item { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--cf-line); border-radius: 14px; background: #fff; font: inherit; text-align: left; cursor: pointer; min-height: 60px; }
    .cf-pick__item img { grid-row: span 2; width: 64px; height: 52px; border-radius: 10px; }
    .cf-pick__item small { color: var(--cf-sub); font-size: 12px; }
    .cf-pick__item.is-on { border-color: var(--cf-blue); background: #f3f7ff; }
    .cf-done-art { display: flex; justify-content: center; margin-bottom: 6px; }
    .cf-done-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
    .cf-done-stats div { padding: 10px 6px; border-radius: 12px; background: var(--cf-soft); text-align: center; }
    .cf-done-stats small { display: block; font-size: 11.5px; color: var(--cf-sub); }
    .cf-done-stats b { font-size: 14px; }
    .cf-next-up { display: flex; gap: 10px; padding: 12px; border-radius: 14px; background: #eef3ff; color: #1e3a8a; }
    .cf-next-up > svg, .cf-next-up > i { flex-shrink: 0; margin-top: 2px; }
    .cf-next-up p { margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #334155; }
    @keyframes cf-fade { from { opacity: 0; } }
    @keyframes cf-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    @media (max-width: 480px) {
      .cf { padding: 12px 16px 40px; }
      .cf-head h1 { font-size: 19px; } .cf-head p { display: none; }
      .cf-iconbtn span { display: none; } .cf-iconbtn { width: 44px; justify-content: center; padding: 0; }
      .cf-income__num { font-size: 22px; }
      .cf-chip { height: 24px; padding: 0 8px; font-size: 11px; }
      .cf-req > span { width: 72px; }
      .cf-spots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) { .cf-ov, .cf-modal { animation: none; } .cf-bar i { transition: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 매니지먼트 「옥상 쉼터 카페」 — 그리는 일 · 계산은 모두 /_shared/cafe.js(HKCafe) 가 맡는다.
    HKMember.mountPage({
      active: "lounge",
      auth: true,
      render: () => `<div class="cf" id="cf-root"></div>`,
      afterMount: () => { HKCafe.mount(document.getElementById("cf-root")); },
    });
  </script>
</body>
</html>
