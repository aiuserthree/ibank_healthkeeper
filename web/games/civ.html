  <style>
    /* ── 오피스 타운 — 귀여운 장난감 동네. 대표색은 동네와 어울리는 청록, 바탕은 연한 하늘 크림. 장면(네모 칸 동네 · 길 · 차)은 civ.js 가 그리고, 실제 시각에 따라 낮 · 노을 · 밤 ── */
    .cv, .cv-ov {
      --mg-accent: #1497ae; --mg-accent-deep: #0d7487; --mg-soft: #d9f3f4; --mg-tint: #eef8f6; --mg-ink: #173042; --mg-sub: #557083; --mg-line: rgba(23, 48, 66, .08);
      --mg-gold: #ffbf2e; --mg-gold-deep: #e09a12; --mg-good: #16a34a; --mg-warn: #e5484d; --mg-r: 26px; --mg-r-sm: 16px;
      --mg-shadow: 0 10px 28px rgba(23, 48, 66, .09), 0 2px 6px rgba(23, 48, 66, .05);
      --c-money: #eba000; --c-idea: #8b6cf0; --c-mor: #22a864; --c-rep: #ec5c96; --c-ap: #3a92de;
      color: var(--mg-ink); font-variant-numeric: tabular-nums; word-break: keep-all;
    }
    .cv-ov *, .cv-ov *::before, .cv-ov *::after { box-sizing: border-box; }
    :where(.cv-ov) :where(button) { font: inherit; color: inherit; }
    body.mgx-body { background: #eef8f6; }
    .cv { overflow-x: clip; background: radial-gradient(120% 60% at 50% 0%, #f7fcff 0%, #eef8f6 60%); }
    .cv-boot { display: flex; justify-content: center; padding: 140px 0; }
    .cv-closed { padding: 16px; }
    .cv [hidden] { display: none !important; }

    /* 위 막대 */
    .cv-top { background: color-mix(in srgb, #fff 80%, transparent); }
    .cv-top .mgx-top__title { gap: 7px; }
    .cv-logo { flex-shrink: 0; width: 26px; height: 26px; border-radius: 9px; background: linear-gradient(160deg, #5fd3e0, #1497ae); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18);
      -webkit-mask: none; position: relative; }
    .cv-logo::after { content: ""; position: absolute; inset: 5px 6px 6px; background: #fff; clip-path: polygon(0 100%, 0 42%, 30% 42%, 30% 12%, 70% 12%, 70% 30%, 100% 30%, 100% 100%); border-radius: 2px; opacity: .96; }
.cv-ttl { flex-shrink: 0; }
    .cv-erachip { flex-shrink: 1; min-width: 0; min-height: 24px; padding: 0 9px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
    .cv-top .mgx-icon { width: 42px; height: 42px; }
    @media (max-width: 400px) { .cv-top .mgx-top__back { font-size: 13px; padding-right: 4px; } .cv-erachip svg, .cv-erachip i { display: none !important; } .cv-logo { display: none; } }

    /* 뼈대 — 휴대폰: 위 장면 · 아래 판 · 맨 아래 독 / PC: 왼쪽 큰 장면 · 오른쪽 탭 + 판 */
    .cv-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "panel" "dock"; grid-template-rows: auto 1fr auto; align-content: start; }
    .cv-stage { grid-area: stage; height: clamp(330px, 54dvh, 600px); border-radius: 0 0 30px 30px; transition: height .38s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 14px 34px rgba(23, 48, 66, .14); }
    .cv.is-sub .cv-stage { height: clamp(220px, 31dvh, 300px); }
    .cv-panel { grid-area: panel; min-width: 0; padding: 14px 14px 22px; }
    .cv-dock { grid-area: dock; }
    .cv-tab { min-height: 56px; }
    .cv-tab span { font-size: 12px; }
    .cv-dot-s { min-width: 10px; width: 10px; height: 10px; padding: 0; top: 7px; right: calc(50% - 16px); }
    @media (min-width: 960px) {
      .cv-main { width: 100%; max-width: 1240px; margin: 0 auto; padding: 16px 20px 24px; box-sizing: border-box; column-gap: 20px; grid-template-columns: minmax(0, 1fr) 430px; grid-template-rows: auto 1fr; grid-template-areas: "stage dock" "stage panel"; }
      .cv-stage, .cv.is-sub .cv-stage { position: sticky; top: 72px; align-self: start; height: calc(100dvh - 96px); min-height: 540px; border-radius: 30px; }
      .cv-dock { position: sticky; top: 72px; bottom: auto; z-index: 8; margin-bottom: 12px; padding: 6px; border: 0; border-radius: 20px; background: #fff; box-shadow: var(--mg-shadow); }
      .cv-tab { flex-direction: row; gap: 7px; min-height: 48px; font-size: 14.5px; }
      .cv-tab span { font-size: 14.5px; }
      .cv-tab svg { width: 19px !important; height: 19px !important; }
      .cv-dock .mgx-dot { top: 6px; right: 10px; }
      .cv-dock::before { content: ""; position: absolute; left: -12px; right: -12px; top: -18px; height: 18px; background: #eef8f6; }
      .cv-panel { padding: 0 2px 24px; }
    }

    /* ── 장면 — 하늘(먼 도시 실루엣 · 구름 · 새) 위에 떠 있는 네모 칸 동네 판 ── */
    .cv-stage { --sky1: #bfe7ff; --sky2: #eaf8f1; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 52%, #dff2d2 100%); }
    .cv-stage[data-ph="dusk"] { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, #f6e3cf 100%); }
    .cv-stage[data-ph="night"] { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 60%, #3d3f86 100%); box-shadow: 0 14px 34px rgba(30, 26, 80, .35); }
    .cv-sky { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .cv-sun { position: absolute; right: 8%; top: 70px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fffbe2, #ffe07a 60%, #ffcd4a);
      box-shadow: 0 0 0 10px rgba(255, 226, 130, .22), 0 0 50px 16px rgba(255, 214, 100, .3); }
    .cv-stage[data-ph="dusk"] .cv-sun { top: 96px; background: radial-gradient(circle at 40% 38%, #fff3dc, #ffab78 62%, #ff8e64); box-shadow: 0 0 60px 22px rgba(255, 150, 100, .32); }
    .cv-stage[data-ph="night"] .cv-sun { width: 36px; height: 36px; background: transparent; box-shadow: inset -10px 4px 0 0 #fff3c8; filter: drop-shadow(0 0 10px rgba(255, 236, 170, .55)); }
    .cv-stars { position: absolute; inset: 0 0 50% 0; opacity: 0; transition: opacity 1s;
      background-image: radial-gradient(1.6px 1.6px at 8% 22%, #fff 99%, transparent), radial-gradient(1.3px 1.3px at 21% 40%, #fff 99%, transparent), radial-gradient(1.8px 1.8px at 33% 14%, #fff7c2 99%, transparent),
        radial-gradient(1.3px 1.3px at 47% 30%, #fff 99%, transparent), radial-gradient(1.7px 1.7px at 58% 10%, #fff 99%, transparent), radial-gradient(1.2px 1.2px at 66% 44%, #fff 99%, transparent),
        radial-gradient(1.6px 1.6px at 74% 26%, #fff7c2 99%, transparent), radial-gradient(1.3px 1.3px at 88% 52%, #fff 99%, transparent), radial-gradient(1.4px 1.4px at 93% 12%, #fff 99%, transparent),
        radial-gradient(1.2px 1.2px at 13% 60%, #fff 99%, transparent), radial-gradient(1.3px 1.3px at 40% 64%, #fff 99%, transparent); }
    .cv-stage[data-ph="night"] .cv-stars { opacity: .95; animation: cv-twinkle 3.4s ease-in-out infinite alternate; }
    @keyframes cv-twinkle { to { opacity: .55; } }
    .cv-skyline { position: absolute; left: 0; top: 7%; width: 100%; height: 22%; min-height: 80px; }
    .cv-skyline__b { fill: #cfe4fb; opacity: .85; }
    .cv-skyline__w { fill: #ffd56b; opacity: 0; transition: opacity 1s; }
    .cv-stage[data-ph="dusk"] .cv-skyline__b { fill: #f4c9bd; }
    .cv-stage[data-ph="night"] .cv-skyline__b { fill: #34387c; opacity: 1; }
    .cv-stage[data-ph="night"] .cv-skyline__w { opacity: .85; }
    .cv-cl { position: absolute; left: -130px; width: 100px; height: 26px; border-radius: 999px; background: #fff; animation: cv-drift 90s linear infinite; box-shadow: inset 0 -5px 0 rgba(200, 214, 250, .55); }
    .cv-cl::before, .cv-cl::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
    .cv-cl::before { width: 44px; height: 38px; left: 16px; top: -20px; }
    .cv-cl::after { width: 32px; height: 28px; left: 52px; top: -12px; }
    .cv-cl--1 { top: 13%; animation-duration: 110s; animation-delay: -40s; opacity: .95; }
    .cv-cl--2 { top: 30%; transform: scale(.66); animation-duration: 150s; animation-delay: -95s; opacity: .85; }
    .cv-stage[data-ph="night"] .cv-cl { background: rgba(170, 176, 240, .22); box-shadow: none; }
    .cv-stage[data-ph="dusk"] .cv-cl { background: #ffeadc; box-shadow: inset 0 -5px 0 rgba(255, 190, 170, .5); }
    @keyframes cv-drift { from { translate: 0 0; } to { translate: calc(100vw + 300px) 0; } }
    .cv-bird { position: absolute; left: -30px; top: 22%; width: 10px; height: 6px; animation: cv-fly 34s linear infinite; animation-delay: -6s; }
    .cv-bird::before, .cv-bird::after { content: ""; position: absolute; top: 0; width: 6px; height: 4px; border-top: 2px solid #5b6a92; border-radius: 50% 50% 0 0; animation: cv-wing .5s ease-in-out infinite alternate; }
    .cv-bird::before { left: 0; } .cv-bird::after { left: 5px; }
    .cv-bird.is-2 { top: 26%; transform: scale(.75); animation-delay: -9s; }
    .cv-stage[data-ph="night"] .cv-bird { display: none; }
    @keyframes cv-fly { from { translate: 0 0; } 50% { translate: calc(50vw + 30px) -18px; } to { translate: calc(100vw + 60px) 6px; } }
    @keyframes cv-wing { to { transform: scaleY(.35); } }
    /* 지나가는 구름 그림자(낮에만) */
    .cv-cshadow { position: absolute; z-index: 2; left: -45%; top: 18%; width: 46%; height: 38%; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(74, 63, 116, .09), rgba(74, 63, 116, 0)); animation: cv-shade 70s linear infinite; animation-delay: -20s; }
    .cv-stage[data-ph="night"] .cv-cshadow { display: none; }
    @keyframes cv-shade { to { translate: 300% 30%; } }

    .cv-map { position: absolute; inset: 0; z-index: 1; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .cv-stage.is-drag .cv-map { cursor: grabbing; }
    .cv-tile { cursor: pointer; outline: none; }
    .cv-lift { transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
    .cv-tile.is-sel .cv-lift { transform: translateY(-5px); animation: cv-hop .5s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes cv-hop { 0% { transform: translateY(0); } 45% { transform: translateY(-9px); } 100% { transform: translateY(-5px); } }
    .cv-tile:hover .cv-top { filter: brightness(1.04); }
    .cv-glow { fill: none; pointer-events: none; opacity: 0; transition: opacity .2s; stroke: #ffd23f; stroke-width: 2.6; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(255, 200, 40, .9)); }
    .cv-tile.is-sel .cv-glow { opacity: 1; animation: cv-pulse 1.6s ease-in-out infinite; }
    .cv-tile:focus-visible .cv-glow { opacity: .7; }
    @keyframes cv-pulse { 50% { opacity: .55; } }
    .cv-tile.is-pop .cv-lift { animation: cv-rise .7s cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes cv-rise { from { transform: translateY(18px); opacity: 0; } }
    .cv-dim { opacity: .62; filter: saturate(.75); }
    .cv-tile.is-front:hover .cv-dim { opacity: .85; }
    .cv-lit { filter: drop-shadow(0 0 1.6px rgba(255, 200, 80, .95)); }
    .cv-lampg { animation: cv-glowl 3s ease-in-out infinite alternate; }
    @keyframes cv-glowl { to { opacity: .7; } }
    /* 늘 조금씩 살아 움직임 — 나무 · 물결 · 구름 · 깃발 · 사람 · 차 · 풍차 · 불빛 */
    .cv-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: cv-sway 3.6s ease-in-out infinite alternate; }
    @keyframes cv-sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    .cv-wave { stroke-dasharray: 3 3; animation: cv-wave 1.8s linear infinite; }
    @keyframes cv-wave { to { stroke-dashoffset: -12; } }
    .cv-fogc { animation: cv-fog 6s ease-in-out infinite alternate; }
    @keyframes cv-fog { from { transform: translateY(1px); } to { transform: translate(1.5px, -2px); } }
    .cv-flag { transform-box: fill-box; transform-origin: 0 50%; animation: cv-flag 1.2s ease-in-out infinite alternate; }
    @keyframes cv-flag { to { transform: scaleX(.8) skewY(8deg); } }
    .cv-hook { transform-box: fill-box; transform-origin: 50% 0; animation: cv-hook 2.6s ease-in-out infinite alternate; }
    @keyframes cv-hook { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    .cv-walk { animation: cv-walk 5s ease-in-out infinite alternate; }
    @keyframes cv-walk { from { transform: translate(calc(var(--dx, 3px) * -1), calc(var(--dy, 1.5px) * -1)); } to { transform: translate(var(--dx, 3px), var(--dy, 1.5px)); } }
    .cv-bob { animation: cv-bob 2s ease-in-out infinite alternate; }
    @keyframes cv-bob { to { transform: translateY(-1.6px); } }
    .cv-mill { animation: cv-spin 6s linear infinite; }
    .cv-blink { animation: cv-blink 1.4s steps(2, jump-none) infinite; }
    @keyframes cv-blink { 50% { opacity: .25; } }
    .cv-car { pointer-events: none; animation: cv-drive 5s linear infinite; transform: translate(var(--x0), var(--y0)); }
    @keyframes cv-drive { 0% { transform: translate(var(--x0), var(--y0)); opacity: 0; } 10%, 88% { opacity: 1; } 100% { transform: translate(var(--x1), var(--y1)); opacity: 0; } }
    .cv-stage.is-paused *, .cv-stage.is-paused *::before, .cv-stage.is-paused *::after { animation-play-state: paused !important; }

    /* HUD · 진행 칩 · 확대 단추 · 말풍선 */
    .cv-hud { gap: 5px; }
    .cv-pill { min-height: 38px; padding: 3px 12px 3px 3px; gap: 5px; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; transition: transform .14s;
      background: rgba(255, 255, 255, .86); border: 2px solid rgba(255, 255, 255, .95); box-shadow: 0 3px 0 rgba(23, 48, 66, .07), 0 6px 16px rgba(23, 48, 66, .12); }
    .cv-pill:active { transform: scale(.95); }
    .cv-pill .mgx-pill__ic { width: 30px; height: 30px; background: color-mix(in srgb, var(--pill) 22%, #fff); color: color-mix(in srgb, var(--pill) 85%, #1a2440); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--pill) 22%, transparent); }
    .cv-pill b { font-size: 14.5px; font-weight: 900; letter-spacing: -.01em; }
    .cv-pill__tx { display: flex; flex-direction: column; line-height: 1.05; text-align: left; }
    .cv-pill__tx b { font-size: 13.5px; }
    .cv-pill__tx small { font-size: 10.5px; font-weight: 800; color: var(--mg-sub); }
    @media (max-width: 420px) { .cv-hud { left: 5px; right: 5px; top: 8px; gap: 3px; flex-wrap: nowrap; } .cv-pill { flex: 0 1 auto; min-width: 0; min-height: 32px; padding: 1px 6px 1px 1px; gap: 3px; border-width: 1.5px; } .cv-pill .mgx-pill__ic { width: 25px; height: 25px; flex-shrink: 0; }
      .cv-pill .mgx-pill__ic svg { width: 14px !important; height: 14px !important; } .cv-pill b { font-size: 12.5px; letter-spacing: -.02em; } .cv-pill__tx b { font-size: 12.5px; } .cv-pill__tx small { display: none; } }
    .cv-jobs { position: absolute; z-index: 5; left: 10px; right: 62px; bottom: 10px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; pointer-events: none; }
    .cv-jobs > * { pointer-events: auto; }
    .cv-jobc { position: relative; display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 210px; min-height: 46px; padding: 5px 11px 7px 5px; border: 0; border-radius: 16px; overflow: hidden; cursor: pointer; text-align: left;
      background: rgba(255, 255, 255, .88); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); box-shadow: 0 4px 14px rgba(23, 48, 66, .14); transition: transform .14s; }
    .cv-jobc:active { transform: scale(.96); }
    .cv-jobc__ic { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 12px; background: var(--c); color: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
    .cv-jobc__tx { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
    .cv-jobc__tx b { font-size: 12.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cv-jobc__tx small { font-size: 11.5px; font-weight: 800; color: var(--mg-sub); white-space: nowrap; }
    .cv-jobc__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(23, 48, 66, .07); }
    .cv-jobc__bar > i { display: block; height: 100%; width: 0; background: var(--c); transition: width .9s linear; }
    .cv-jobc.is-idle { background: rgba(255, 255, 255, .7); box-shadow: inset 0 0 0 2px rgba(20, 151, 174, .38); }
    .cv-jobc.is-idle .cv-jobc__ic { background: var(--mg-soft); color: var(--mg-accent-deep); box-shadow: none; }
    @media (max-width: 520px) { .cv-jobs { gap: 5px; } .cv-jobc { flex: 1 1 0; max-width: none; gap: 5px; padding-right: 8px; } .cv-jobc.is-idle { flex: 0 1 auto; } .cv-jobc.is-idle small, .cv-jobc .cv-long { display: none; }
      .cv-jobc__ic { width: 30px; height: 30px; border-radius: 11px; } .cv-jobc__tx small { font-size: 11px; overflow: hidden; text-overflow: ellipsis; } }
    .cv-zoom { position: absolute; z-index: 5; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    .cv-zoom .mgx-icon { width: 44px; height: 44px; border-radius: 15px; background: rgba(255, 255, 255, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    @media (hover: none) { .cv-zoom [data-z="in"], .cv-zoom [data-z="out"] { display: none; } }
    /* 재배치 — 단추는 확대 단추 묶음 맨 위(오른쪽 맞춤), 안내 막대는 HUD 자리에. 공용 모양은 mgmt-ui.css 의 .mgx-movebtn · .mgx-movebar */
    .cv-zoom { align-items: flex-end; }
    .cv-movebtn { min-height: 44px; border-radius: 15px; -webkit-tap-highlight-color: transparent; transition: transform .14s; }
    .cv-movebtn:active { transform: scale(.95); }
    .cv.is-sub .cv-movebtn { display: none; }
    .cv-movebar { top: 10px; border-radius: 22px; }
    .cv-movebar b { font-weight: 800; }
    .cv-movebar small i { font-style: normal; }
    .cv-movebar small { font-size: inherit; font-weight: 600; opacity: .78; }
    @media (max-width: 520px) { .cv-movebar { top: 8px; font-size: 12.5px; padding-left: 13px; } .cv-movebar small { display: block; font-size: 11.5px; } .cv-movebar small i { display: none; } }
    .cv-hud, .cv-jobs, .cv-bubs { transition: opacity .18s, visibility .18s; }
    .cv.is-moving .cv-hud, .cv.is-moving .cv-jobs, .cv.is-moving .cv-bubs { opacity: 0; visibility: hidden; pointer-events: none; }
    .cv.is-moving .cv-tile.is-sel:not(.is-move-src) .cv-lift { transform: none; animation: none; }
    .cv.is-moving .cv-tile.is-sel:not(.is-move-src) .cv-glow { opacity: 0; animation: none; }
    .cv-tile.is-move-can .cv-glow { opacity: 1; fill: rgba(255, 255, 255, .22); stroke: #fff; stroke-width: 3.2; filter: drop-shadow(0 0 2.5px rgba(13, 116, 135, 1)) drop-shadow(0 0 5px rgba(20, 151, 174, .8)); animation: mgx-movepulse 1.4s ease-in-out infinite; }
    .cv-tile.is-move-src .cv-lift { transform: translateY(-7px); animation: cv-hop .5s cubic-bezier(.3, 1.6, .5, 1); }
    .cv-tile.is-move-src .cv-glow { opacity: 1; stroke: #ffd23f; stroke-width: 3; animation: none; filter: drop-shadow(0 0 4px rgba(255, 190, 30, 1)); }
    .cv-tile.is-move-ok .cv-glow { opacity: 1; fill: rgba(20, 151, 174, .26); stroke: #14b3c9; stroke-width: 3; filter: drop-shadow(0 0 3px rgba(20, 151, 174, .9)); animation: mgx-movepulse 1.1s ease-in-out infinite; }

    .cv-evtop b { font-size: 18px; font-weight: 900; }
    .cv-evtop span { font-size: 13px; color: var(--mg-sub); }
    .cv-evs { display: flex; flex-direction: column; gap: 14px; }
    .cv-ev { padding: 16px; border-radius: 28px; background: linear-gradient(170deg, #ffffff, #fff8ef); box-shadow: var(--mg-shadow); }
    .cv-ev__head { display: flex; align-items: flex-start; gap: 12px; }
    .cv-ev__t { font-size: 17px; font-weight: 900; line-height: 1.35; }
    .cv-ev__head p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--mg-sub); }
    .cv-ev__pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; perspective: 900px; }
    .cv-pc { position: relative; display: block; min-height: 176px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; transform-style: preserve-3d; -webkit-tap-highlight-color: transparent;
      animation: cv-deal .55s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: calc(var(--d, 0s) + .05s); transition: opacity .3s, transform .3s; }
    .cv-pc.is-b { animation-delay: calc(var(--d, 0s) + .14s); }
    @keyframes cv-deal { from { transform: rotateY(-90deg) translateY(12px); opacity: 0; } }
    .cv-pc__in { position: relative; display: block; height: 100%; min-height: 176px; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1); }
    .cv-pc:not(.is-flip):not([disabled]):hover .cv-pc__in { transform: translateY(-3px); }

    .cv-pc__tag { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 11px; background: rgba(255, 255, 255, .24); font-size: 14px; font-weight: 900; }

    .cv-pc__f > b { font-size: 17.5px; font-weight: 900; line-height: 1.3; letter-spacing: -.01em; }
    .cv-pc__f .cv-fxs { margin-top: auto; }
    .cv-pc__f .cv-why { margin-top: -2px; }
    .cv-pc[disabled] { cursor: not-allowed; }
    .cv-pc[disabled] .cv-pc__f { filter: grayscale(.85); opacity: .6; }
    .cv-ev.is-picking .cv-pc:not(.is-flip) { opacity: .3; transform: scale(.94) translateY(6px); }
    .cv-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px 16px; text-align: center; color: var(--mg-sub); }
    .cv-empty__ic { display: inline-flex; align-items: center; justify-content: center; width: 70px; height: 70px; margin-bottom: 4px; border-radius: 24px; background: var(--mg-soft); color: var(--mg-accent); }
    .cv-empty b { font-size: 17px; color: var(--mg-ink); }

    /* ── 더보기 메뉴 · 아래 판 · 창 ── */
    .cv-menuwrap { position: fixed; inset: 0; z-index: 90; }
    .cv-menubg { position: absolute; inset: 0; border: 0; background: transparent; cursor: default; }
    .cv-menu { position: absolute; display: flex; flex-direction: column; min-width: 188px; padding: 6px; border-radius: 20px; background: #fff; box-shadow: 0 18px 44px rgba(12, 18, 40, .22); animation: cv-popin .2s cubic-bezier(.2, 1.2, .4, 1); }
    .cv-menu button { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border: 0; border-radius: 14px; background: none; font-size: 14.5px; font-weight: 800; cursor: pointer; text-align: left; }
    .cv-menu button:hover, .cv-menu button:focus-visible { background: #f2f5fb; outline: none; }
    .cv-menu button.is-danger { color: var(--mg-warn); }
    .cv-sheetwrap { z-index: 95; }
    .cv-sheet { position: relative; color: var(--mg-ink); }
    .cv-x { position: absolute; top: 10px; right: 10px; z-index: 2; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, .85); color: var(--mg-sub); cursor: pointer; }
    .cv-x:hover { background: #f2f5fb; }
    .cv-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(12, 18, 40, .5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: cv-fade .2s ease; }
    @keyframes cv-fade { from { opacity: 0; } }
    .cv-modal__box { position: relative; width: 100%; max-width: 420px; max-height: calc(100dvh - 32px); overflow-y: auto; padding: 24px 22px 20px; border-radius: 32px; background: #fff; box-shadow: 0 30px 80px rgba(12, 18, 40, .35); animation: cv-popin .34s cubic-bezier(.2, 1.25, .4, 1); }
    .cv-modal__box.is-wide { max-width: 560px; }
    @keyframes cv-popin { from { transform: translateY(16px) scale(.94); opacity: 0; } }
    .cv-mt { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; line-height: 1.3; }
    .cv-mt.is-big { font-size: 25px; }
    .cv-msub { margin: 6px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--mg-sub); }
    .cv-modal .mgx-btn.is-wide { margin-top: 18px; }
    .cv-hero { position: relative; align-self: stretch; display: flex; align-items: flex-end; justify-content: center; height: 190px; margin: -24px -22px 14px; padding-bottom: 14px; border-radius: 32px 32px 0 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1), var(--sky2)); }
    .cv-hero.is-sm { height: 150px; }
    .cv-hero.is-tall { height: 240px; }
    .cv-rays { position: absolute; left: 50%; top: 60%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 255, 255, .42) 0 9deg, transparent 9deg 18deg); animation: cv-spin 22s linear infinite;
      -webkit-mask: radial-gradient(circle, #000 12%, transparent 62%); mask: radial-gradient(circle, #000 12%, transparent 62%); }
    @keyframes cv-spin { to { transform: rotate(360deg); } }
    .cv-hero__art { position: relative; width: 150px; height: auto; max-height: 100%; filter: drop-shadow(0 12px 14px rgba(23, 48, 66, .2)); animation: cv-float 3s ease-in-out infinite alternate, cv-rise .7s cubic-bezier(.3, 1.5, .5, 1) both; }
    .cv-hero.is-sm .cv-hero__art { width: 118px; }
    .cv-hero.is-tall .cv-hero__art { width: 150px; }
    @keyframes cv-float { to { translate: 0 -6px; } }
    .cv-away, .cv-cele, .cv-guide { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .cv-away .cv-lbl { align-self: flex-start; }
    .cv-away .cv-note { width: 100%; text-align: left; }
    .cv-away__rows { width: 100%; margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .cv-away__rows li { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 16px; background: color-mix(in srgb, var(--c, #94a3b8) 9%, #fff); font-size: 14px; font-weight: 800; }
    .cv-away__rows li b { margin-left: auto; font-size: 16px; font-weight: 900; color: color-mix(in srgb, var(--c, #19a957) 80%, #10162e); }
    .cv-away__ends { width: 100%; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .cv-away__ends li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; }
    .cv-away__ends li.is-none { color: var(--mg-sub); font-size: 13px; line-height: 1.5; font-weight: 600; }
    .cv-guide > small { margin-top: 10px; font-size: 12.5px; font-weight: 800; color: #8a93ad; }
    .cv-guide__ic { margin-top: 8px; }
    .cv-guide .cv-msub { min-height: 70px; }
    .cv-guide__dots { display: flex; gap: 6px; margin-top: 10px; }
    .cv-guide__dots i { width: 8px; height: 8px; border-radius: 999px; background: #dfe4ef; transition: width .25s; }
    .cv-guide__dots i.is-on { width: 24px; background: var(--mg-accent); }
    .cv-guide__btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 18px; }
    .cv-cele .mgx-chip { margin-top: 2px; }
    .cv-cele__list { width: 100%; margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .cv-cele__list li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 16px; background: #f4f6fb; font-size: 14px; font-weight: 800; }
    .cv-cele .cv-note { text-align: left; }
    .cv-help .cv-mt { justify-content: flex-start; padding-right: 40px; }
    .cv-help p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--mg-sub); }
    .cv-help ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .cv-help li { display: flex; align-items: flex-start; gap: 10px; }

    @media (prefers-reduced-motion: reduce) {
      .cv-ov *, .cv-modal, .cv-modal__box, .cv-cl, .cv-stars { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="mgx-body">
  <div id="app"><div class="cv-boot"><span class="hk-spin"></span></div></div>
  <script>
    // 오피스 타운 — 빈 동네 땅에 작은 회사를 차리고 귀여운 회사 동네를 꾸미는 매일 키우기 게임(매니지먼트 key: civ, 옛 이름 「회사 문명」)
    // 규칙 · 그리기는 모두 /_shared/civ.js(CivCore · HKCiv) 가 맡고, 저장은 /_shared/mgmt.js(HKMgmt) 가 한다.
    // 사이트 머리 메뉴 없이 꽉 찬 게임 화면으로 그린다(로그인 확인만 HKMember.requireAuth).
    (async () => {
      const profile = await HKMember.requireAuth();
      if (!profile) return;
      try { await HKUI.loadLucide(); } catch (_) { /* 아이콘 없이도 돈다 */ }
      if (window.HKMgmtMusic) HKMgmtMusic.create("civ"); // 배경음악 「우리 동네 출근길」 — 머리의 음표 단추로 켜고 끈다
      HKCiv.mount(document.getElementById("app"));
    })();
  </script>
</body>
</html>
