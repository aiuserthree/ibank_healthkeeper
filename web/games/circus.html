<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>점심 서커스 — 점심 라운지</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    .gm-cc { display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none; }
    .gm-cc-hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .gm-cc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid #e3e8ef; font-size: 13.5px; color: #0b3558; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .gm-cc-chip b { font-size: 16px; }
    .gm-cc-chip--score { background: linear-gradient(135deg, #be123c, #f59e0b); color: #fff; border-color: transparent; }
    .gm-cc-lives { display: inline-flex; gap: 2px; }
    .gm-cc-lives .is-off { opacity: .22; }
    .gm-cc-chip--streak { margin-left: auto; }
    .gm-cc-chip--streak.is-hot { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
    .gm-cc-meter { width: 54px; height: 6px; border-radius: 3px; background: #f1f5f9; overflow: hidden; }
    .gm-cc-meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #be123c, #f59e0b); border-radius: 3px; transition: width .15s; }
    .gm-cc-board { position: relative; border-radius: 16px; overflow: hidden; background: #3b0a1e; box-shadow: 0 1px 3px rgba(15,23,42,.08); touch-action: none; cursor: pointer; }
    .gm-cc-board canvas { display: block; width: 100%; touch-action: none; }
    .gm-cc-over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(59, 10, 30, .42); cursor: default; }
    .gm-cc-over[hidden] { display: none; }
    .gm-cc-card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 16px 18px; text-align: center; box-shadow: 0 12px 32px rgba(15,23,42,.2); max-height: 100%; overflow-y: auto; }
    .gm-cc-card h2 { margin: 6px 0 6px; font-size: 22px; color: #0b3558; }
    .gm-cc-card p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; color: #475569; }
    .gm-cc-card .hk-btn { width: 100%; margin-top: 12px; }
    .gm-cc-badge { display: inline-flex; width: 46px; height: 46px; border-radius: 14px; align-items: center; justify-content: center; background: linear-gradient(135deg, #be123c, #f59e0b); }
    .gm-cc-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 10px 0 0; padding: 12px; border-radius: 12px; background: #fff7ed; text-align: left; font-size: 13px; color: #334155; }
    .gm-cc-keys dt { font-weight: 700; color: #9f1239; white-space: nowrap; }
    .gm-cc-keys dd { margin: 0; }
    .gm-cc-big { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 4px 0; color: #0b3558; font-variant-numeric: tabular-nums; }
    .gm-cc-break { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: #f8fafc; font-size: 13.5px; color: #475569; text-align: left; font-variant-numeric: tabular-nums; }
    .gm-cc-break b { color: #0b3558; text-align: right; }
    .gm-cc-jump { height: 60px; border: 0; border-radius: 16px; background: linear-gradient(135deg, #be123c, #f59e0b); color: #fff; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .gm-cc-jump.is-down { filter: brightness(.88); transform: translateY(1px); }
    @media (hover: hover) and (pointer: fine) and (min-width: 900px) { .gm-cc-jump { display: none; } }
    @media (max-width: 520px) {
      .gm-cc-chip { padding: 6px 9px; font-size: 12.5px; gap: 4px; }
      .gm-cc-chip b { font-size: 15px; }
      .gm-cc-hud { flex-wrap: nowrap; gap: 6px; }
      .gm-cc-meter, .gm-cc-chip .gm-cc-ico { display: none; }
      .gm-cc-chip--streak { min-width: 0; }
      .gm-cc-card { padding: 16px 14px; }
      .gm-cc-card h2 { font-size: 19px; margin: 4px 0; }
      .gm-cc-card p { font-size: 13px; }
      .gm-cc-badge { display: none; }
      .gm-cc-keys { padding: 10px; font-size: 12.5px; gap: 4px 8px; }
      .gm-cc-note { display: none; }
      .gm-cc-big { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "circus",
    setup(stage, ctx) {
      stage.innerHTML = `<div class="gm-cc">
        <div class="gm-cc-hud">
          <span class="gm-cc-chip gm-cc-chip--score">${HKUI.icon("star", 15, "#fff")} <b id="gm-cc-score">0</b>점</span>
          <span class="gm-cc-chip"><span class="gm-cc-ico">${HKUI.icon("ruler", 15, "#be123c")}</span> <b id="gm-cc-dist">0</b>m</span>
          <span class="gm-cc-chip"><span class="gm-cc-lives" id="gm-cc-lives"></span></span>
          <span class="gm-cc-chip gm-cc-chip--streak" id="gm-cc-streak">${HKUI.icon("hand-heart", 15, "currentColor")} <span id="gm-cc-streaktext">연속 0</span><span class="gm-cc-meter"><i id="gm-cc-meter"></i></span></span>
        </div>
        <div class="gm-cc-board" id="gm-cc-board">
          <canvas id="gm-cc-canvas"></canvas>
          <div class="gm-cc-over" id="gm-cc-over"></div>
        </div>
        <button type="button" class="gm-cc-jump" id="gm-cc-jump" aria-label="점프">${HKUI.icon("arrow-big-up", 22, "#fff")} 점프 <small style="font-weight:600;opacity:.8">(길게 누르면 더 높이)</small></button>
      </div>`;
      HKUI.refreshIcons(stage);

      const $ = (s) => stage.querySelector(s);
      const canvas = $("#gm-cc-canvas");
      const g = canvas.getContext("2d");
      const board = $("#gm-cc-board");
      const over = $("#gm-cc-over");
      const jumpBtn = $("#gm-cc-jump");
      const FONT = getComputedStyle(document.body).fontFamily || "sans-serif";
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const rand = (a, b) => a + Math.random() * (b - a);

      // 논리 좌표: 높이 340, 바닥 y=300, 1m = 40px
      const LH = 340, GY = 300, PX_PER_M = 40, PLAYER_SX = 120;
      const BALL_R = 20, JUMP_V = 520, GRAV = 1800, HOLD_GRAV = 650, HOLD_MAX = 0.24;
      const LIVES = 3, CLAP_NEED = 10, CLAP_TIME = 5;
      let W = 360, H = 240, dpr = 1, scale = 1, LW = 500, TOP = 0;

      // ───────────────────────── 상태
      let state = "ready"; // ready | play | paused | over | done
      let px, py, vy, onGround, holding, holdT, bufferT, lives, invT, streak, clapT, scoreDist, bonus, obstacles, nextX, floats, sparks, shake, clock, items, clean, claps, lastHitT;

      function reset() {
        px = 0; py = 0; vy = 0; onGround = true; holding = false; holdT = 0; bufferT = 0;
        lives = LIVES; invT = 0; streak = 0; clapT = 0; scoreDist = 0; bonus = 0;
        obstacles = []; nextX = 700; floats = []; sparks = []; shake = 0; items = 0; clean = 0; claps = 0; lastHitT = 0;
        updateHud();
      }

      const meters = () => px / PX_PER_M;
      const speed = () => Math.min(430, 200 + 0.8 * meters());
      const total = () => Math.floor(scoreDist) + bonus;

      function updateHud() {
        $("#gm-cc-score").textContent = total().toLocaleString("ko-KR");
        $("#gm-cc-dist").textContent = Math.floor(meters()).toLocaleString("ko-KR");
        $("#gm-cc-lives").innerHTML = Array.from({ length: LIVES }, (_, i) => `<span class="${i < lives ? "" : "is-off"}">${HKUI.icon("heart", 15, "#e11d48")}</span>`).join("");
        HKUI.refreshIcons($("#gm-cc-lives"));
        const st = $("#gm-cc-streak");
        st.classList.toggle("is-hot", clapT > 0 || streak >= 7);
        $("#gm-cc-streaktext").textContent = clapT > 0 ? "갈채 ×2" : `연속 ${streak}`;
        $("#gm-cc-meter").style.width = (clapT > 0 ? (clapT / CLAP_TIME) * 100 : (streak / CLAP_NEED) * 100) + "%";
      }
      let hudT = 0;

      // ───────────────────────── 장애물 만들기
      function spawn() {
        const m = nextX / PX_PER_M;
        const r = Math.random();
        let kind;
        if (m < 50) kind = r < 0.55 ? "pot" : "low";
        else if (m < 140) kind = r < 0.35 ? "pot" : r < 0.65 ? "low" : r < 0.85 ? "high" : "double";
        else kind = r < 0.24 ? "pot" : r < 0.44 ? "low" : r < 0.62 ? "high" : r < 0.76 ? "double" : r < 0.88 ? "moving" : "pots";
        const x = nextX;
        let span = 40;
        if (kind === "pot") obstacles.push({ t: "pot", x });
        else if (kind === "pots") { obstacles.push({ t: "pot", x }); obstacles.push({ t: "pot", x: x + 62, chain: true }); span = 110; }
        else {
          const ring = { t: "ring", x, vx: 0, bot: 22, open: 165, lunch: Math.random() < 0.35, ph: Math.random() * 6 };
          if (kind === "high") { ring.bot = 70; ring.open = 170; }
          if (kind === "double") { ring.bot = 52; ring.open = 168; ring.lunch = Math.random() < 0.5; obstacles.push({ t: "pot", x, under: true }); }
          if (kind === "moving") { ring.vx = -70; ring.x += 160; }
          obstacles.push(ring);
          span = kind === "moving" ? 200 : 40;
        }
        const v = speed();
        const tight = clamp(1 - (m - 250) / 1500, 0.72, 1); // 속도가 다 오른 뒤에는 간격을 좁혀요
        nextX = x + span + Math.max(230, v * rand(1.05, 1.7) * tight);
      }

      // 플레이어 몸 판정(공·몸통·머리)
      function bodyShapes() {
        const x = px + PLAYER_SX * 0; // 세계 좌표 x = px
        const by = GY - BALL_R - py;
        return [
          { x, y: by, r: BALL_R - 3 },
          { x, y: by - BALL_R - 14, r: 11 },
          { x, y: GY - 81 - py, r: 9 },
        ];
      }
      function hitCircle(cx, cy, cr) {
        for (const s of bodyShapes()) if ((s.x - cx) ** 2 + (s.y - cy) ** 2 < (s.r + cr) ** 2) return true;
        return false;
      }
      function hitRect(x0, y0, x1, y1) {
        for (const s of bodyShapes()) {
          const nx = clamp(s.x, x0, x1), ny = clamp(s.y, y0, y1);
          if ((s.x - nx) ** 2 + (s.y - ny) ** 2 < s.r * s.r) return true;
        }
        return false;
      }

      function miss(o) {
        o.hit = true;
        if (o.pair) o.pair.hit = true;
        if (invT > 0) return;
        lives--;
        invT = 1.6;
        streak = 0;
        shake = 1;
        lastHitT = clock;
        floats.push({ x: px, y: GY - 110 - py, text: lives > 0 ? "앗, 뜨거워요!" : "공연 끝!", c: "#fecaca", t: 0 });
        for (let i = 0; i < 14; i++) sparks.push({ x: px, y: GY - 50 - py, vx: rand(-160, 160), vy: rand(-260, -40), t: 0, life: 0.6, c: i % 2 ? "#f97316" : "#fde047" });
        updateHud();
        if (lives <= 0) gameOver();
      }

      function passed(o) {
        o.done = true;
        if (o.hit || o.under || o.chain) return;
        // 이층 고리는 고리+단지 둘 다 무사해야 해요
        if (o.t === "ring" && o.pair && o.pair.hit) return;
        streak++;
        clean++;
        if (streak >= CLAP_NEED) {
          streak = 0;
          clapT = CLAP_TIME;
          claps++;
          bonus += 50;
          floats.push({ x: px + 40, y: GY - 160, text: "박수 갈채! +50 · 5초간 2배", c: "#fde68a", t: 0, big: true });
        }
        updateHud();
      }

      function gameOver() {
        state = "over";
        holding = false;
        setTimeout(() => {
          if (state !== "over") return;
          state = "done";
          showResult();
          ctx.submit(Math.min(100000, total()));
        }, 1300);
      }

      // ───────────────────────── 한 걸음
      function update(dt) {
        const v = speed();
        const mult = clapT > 0 ? 2 : 1;
        const dx = v * dt;
        px += dx;
        scoreDist += (dx / PX_PER_M) * mult;
        if (clapT > 0) { clapT = Math.max(0, clapT - dt); if (clapT === 0) updateHud(); }
        if (invT > 0) invT -= dt;

        // 점프
        if (bufferT > 0) bufferT -= dt;
        if (onGround && bufferT > 0) { vy = JUMP_V; onGround = false; holdT = 0; bufferT = 0; }
        if (!onGround) {
          const low = holding && holdT < HOLD_MAX && vy > 0;
          holdT += dt;
          vy -= (low ? HOLD_GRAV : GRAV) * dt;
          py += vy * dt;
          if (py <= 0) { py = 0; vy = 0; onGround = true; if (bufferT > 0) { vy = JUMP_V; onGround = false; holdT = 0; bufferT = 0; } }
        }

        // 장애물
        while (nextX < px + LW + 200) spawn();
        for (const o of obstacles) {
          if (o.t === "ring") {
            o.x += o.vx * dt;
            if (o.under && !o.pair) { /* 단지는 따로 */ }
          }
        }
        // 이층 고리: 고리와 아래 단지를 짝지어요
        for (let i = 0; i < obstacles.length; i++) {
          const o = obstacles[i];
          if (o.under && !o.pairSet) { const r = obstacles[i + 1]; if (r && r.t === "ring") { r.pair = o; o.pair = r; } o.pairSet = true; }
        }
        for (const o of obstacles) {
          if (o.hit && !o.done && o.x < px - 60) { o.done = true; continue; }
          if (o.done || o.hit) continue;
          if (o.t === "pot") {
            if (Math.abs(o.x - px) < 50 && hitRect(o.x - 12, GY - 27, o.x + 12, GY)) miss(o);
            // 불꽃
            else if (Math.abs(o.x - px) < 40 && hitCircle(o.x, GY - 38 + Math.sin(clock * 20 + o.x) * 2, 6)) miss(o);
          } else {
            const top = GY - o.bot - o.open, bot = GY - o.bot;
            if (Math.abs(o.x - px) < 40) {
              if (hitCircle(o.x, top, 7) || hitCircle(o.x, bot, 7)) miss(o);
              if (!o.hit && o.lunch && !o.got && hitCircle(o.x, (top + bot) / 2, 13)) {
                o.got = true; items++;
                const add = 20 * mult;
                bonus += add;
                floats.push({ x: o.x, y: (top + bot) / 2 - 20, text: `도시락 +${add}`, c: "#fde68a", t: 0 });
                updateHud();
              }
            }
          }
          if (!o.hit && o.x < px - 46) {
            passed(o);
            if (o.t === "ring" && !o.hit) for (let i = 0; i < 8; i++) sparks.push({ x: o.x, y: GY - o.bot - o.open / 2 + rand(-40, 40), vx: rand(-60, 120), vy: rand(-120, 60), t: 0, life: 0.5, c: "#fde68a" });
          }
        }
        obstacles = obstacles.filter((o) => o.x > px - PLAYER_SX - 120);

        for (const f of floats) { f.t += dt; f.y -= 30 * dt; }
        floats = floats.filter((f) => f.t < (f.big ? 2 : 1.1));
        for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; }
        sparks = sparks.filter((s) => s.t < s.life);
        hudT += dt;
        if (hudT > 0.1) { hudT = 0; $("#gm-cc-score").textContent = total().toLocaleString("ko-KR"); $("#gm-cc-dist").textContent = Math.floor(meters()).toLocaleString("ko-KR"); if (clapT > 0) $("#gm-cc-meter").style.width = (clapT / CLAP_TIME) * 100 + "%"; }
      }

      // ───────────────────────── 그리기
      function resize() {
        const w = Math.round(board.clientWidth || stage.clientWidth || 360);
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        W = w;
        // 좁은 화면은 세로로 길게: 앞을 볼 폭(논리 480)을 지키고 남는 높이는 천막 위쪽으로
        H = Math.round(w < 600 ? clamp(w * 1.0, 250, 430) : clamp(w * 0.72, 250, 400));
        scale = Math.min(H / LH, W / 480);
        LW = W / scale;
        TOP = H / scale - LH;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.height = H + "px";
        draw();
      }

      function rr(x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }

      function drawBackground(cam) {
        // 천막 줄무늬 벽
        const sw = 46, off = (cam * 0.15) % (sw * 2);
        const T0 = -TOP;
        g.fillStyle = "#fbe5cf"; g.fillRect(0, T0, LW, GY - T0);
        g.fillStyle = "#c81e4a";
        for (let x = -off; x < LW + sw * 2; x += sw * 2) {
          g.beginPath(); g.moveTo(x, T0); g.lineTo(x + sw, T0); g.lineTo(x + sw * 1.25, GY); g.lineTo(x + sw * 0.25, GY); g.closePath(); g.fill();
        }
        // 위쪽 그늘
        const sh = g.createLinearGradient(0, T0, 0, T0 + 120);
        sh.addColorStop(0, "rgba(59,10,30,.45)"); sh.addColorStop(1, "rgba(59,10,30,0)");
        g.fillStyle = sh; g.fillRect(0, T0, LW, 120);
        // 조명
        g.save();
        g.globalCompositeOperation = "lighter";
        for (let i = 0; i < 3; i++) {
          const cx = LW * (0.2 + i * 0.32) + Math.sin(clock * 0.6 + i * 2) * 40;
          const grd = g.createLinearGradient(0, 0, 0, GY);
          grd.addColorStop(0, "rgba(255,240,200,.16)"); grd.addColorStop(1, "rgba(255,240,200,0)");
          g.fillStyle = grd;
          g.beginPath(); g.moveTo(cx - 10, T0); g.lineTo(cx + 10, T0); g.lineTo(cx + 90, GY); g.lineTo(cx - 90, GY); g.closePath(); g.fill();
        }
        g.restore();

        // 관객석 실루엣 (세 줄)
        const clap = clapT > 0;
        const rows = [{ y: 196, s: 0.42, c: "#5b1630", r: 10 }, { y: 214, s: 0.5, c: "#4a1027", r: 11 }, { y: 234, s: 0.58, c: "#3b0a1e", r: 12 }];
        g.fillStyle = "#2d0716"; g.fillRect(0, 238, LW, GY - 238);
        rows.forEach((row, ri) => {
          const step = row.r * 2.6;
          const o = (cam * row.s) % step;
          for (let x = -o - step; x < LW + step; x += step) {
            const id = Math.floor((x + cam * row.s) / step);
            const seed = Math.abs(Math.sin(id * 12.9898 + ri * 7.1)) ;
            const bob = clap ? Math.abs(Math.sin(clock * 12 + id)) * 5 : Math.sin(clock * 2 + id) * 0.8;
            g.fillStyle = row.c;
            g.beginPath(); g.arc(x, row.y - bob, row.r, 0, Math.PI * 2); g.fill();
            rr(x - row.r * 1.25, row.y - bob + row.r * 0.6, row.r * 2.5, 30, row.r);
            g.fill();
            if (clap && seed > 0.45) { // 손 번쩍
              g.strokeStyle = row.c; g.lineWidth = 3.5; g.lineCap = "round";
              g.beginPath(); g.moveTo(x - row.r, row.y - bob + row.r); g.lineTo(x - row.r - 4, row.y - bob - row.r - 6 - Math.sin(clock * 20 + id) * 3); g.stroke();
              g.beginPath(); g.moveTo(x + row.r, row.y - bob + row.r); g.lineTo(x + row.r + 4, row.y - bob - row.r - 6 + Math.sin(clock * 20 + id) * 3); g.stroke();
            }
          }
        });
        // 관객석 반짝이
        if (clap) {
          for (let i = 0; i < 26; i++) {
            const sx = (Math.sin(i * 91.7 + Math.floor(clock * 6) * 3.3) * 0.5 + 0.5) * LW;
            const sy = 150 + (Math.sin(i * 47.3 + Math.floor(clock * 6)) * 0.5 + 0.5) * 90;
            const a = 0.5 + 0.5 * Math.sin(clock * 16 + i);
            g.globalAlpha = a;
            star(sx, sy, 5 + (i % 3) * 2, i % 2 ? "#fde68a" : "#ffffff");
          }
          g.globalAlpha = 1;
        }
        // 가랜드(위쪽 장식 천)
        const vw = 34, vo = (cam * 0.15) % vw;
        for (let x = -vo - vw; x < LW + vw; x += vw) {
          const i = Math.round((x + cam * 0.15) / vw);
          g.fillStyle = i % 2 ? "#f59e0b" : "#be123c";
          g.beginPath(); g.moveTo(x, T0); g.lineTo(x + vw, T0); g.arc(x + vw / 2, T0 + 4, vw / 2, 0, Math.PI); g.closePath(); g.fill();
        }
        g.fillStyle = "#7f1d1d"; g.fillRect(0, T0, LW, 5);

        // 무대 바닥
        const fg = g.createLinearGradient(0, GY, 0, LH);
        fg.addColorStop(0, "#f2c894"); fg.addColorStop(1, "#d99a5b");
        g.fillStyle = fg; g.fillRect(0, GY, LW, LH - GY);
        g.fillStyle = "#9a3412"; g.fillRect(0, GY, LW, 4);
        // 거리 눈금
        const m0 = Math.floor(cam / PX_PER_M);
        g.font = `700 11px ${FONT}`; g.textAlign = "center"; g.textBaseline = "top";
        for (let m = m0; m < m0 + LW / PX_PER_M + 2; m++) {
          const x = m * PX_PER_M - cam;
          g.fillStyle = "rgba(124,45,18,.35)";
          g.fillRect(x, GY + 6, 2, m % 10 === 0 ? 12 : 5);
          if (m % 10 === 0 && m > 0) { g.fillStyle = "rgba(124,45,18,.7)"; g.fillText(`${m}m`, x, GY + 20); }
        }
      }

      function star(x, y, r, c) {
        g.fillStyle = c;
        g.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI) / 4, rr2 = i % 2 ? r * 0.38 : r;
          g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
        }
        g.closePath(); g.fill();
      }

      function flame(x, y, s, seed) {
        const f = Math.sin(clock * 18 + seed) * 0.15 + Math.sin(clock * 31 + seed * 2) * 0.08;
        g.fillStyle = "#f97316";
        g.beginPath(); g.moveTo(x - 7 * s, y); g.quadraticCurveTo(x - 8 * s, y - 10 * s, x + f * 10 * s, y - 20 * s * (1 + f)); g.quadraticCurveTo(x + 8 * s, y - 10 * s, x + 7 * s, y); g.closePath(); g.fill();
        g.fillStyle = "#fde047";
        g.beginPath(); g.moveTo(x - 3.5 * s, y); g.quadraticCurveTo(x - 4 * s, y - 6 * s, x + f * 6 * s, y - 11 * s * (1 + f)); g.quadraticCurveTo(x + 4 * s, y - 6 * s, x + 3.5 * s, y); g.closePath(); g.fill();
      }

      function drawPot(o, cam) {
        const x = o.x - cam;
        g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(x, GY + 2, 18, 4, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = o.hit ? "#78716c" : "#9a3412";
        g.beginPath(); g.moveTo(x - 15, GY - 28); g.lineTo(x + 15, GY - 28); g.lineTo(x + 11, GY); g.lineTo(x - 11, GY); g.closePath(); g.fill();
        g.fillStyle = "#fbbf24"; g.fillRect(x - 13, GY - 19, 26, 4);
        g.fillStyle = "#7c2d12"; rr(x - 17, GY - 31, 34, 6, 3); g.fill();
        if (!o.hit) flame(x, GY - 30, 1.1, o.x);
      }

      function drawRing(o, cam, half) {
        const x = o.x - cam, top = GY - o.bot - o.open, bot = GY - o.bot, cy = (top + bot) / 2, ry = o.open / 2;
        if (half === "back") {
          // 매단 줄
          g.strokeStyle = "rgba(60,20,20,.55)"; g.lineWidth = 2;
          g.beginPath(); g.moveTo(x, -TOP); g.lineTo(x, top - 3); g.stroke();
          if (o.lunch && !o.got) drawLunch(x, cy);
        }
        g.lineWidth = 7;
        g.strokeStyle = o.hit ? "#a8a29e" : half === "back" ? "#b45309" : "#f59e0b";
        g.beginPath();
        if (half === "back") g.ellipse(x, cy, 13, ry, 0, Math.PI / 2, (Math.PI * 3) / 2);
        else g.ellipse(x, cy, 13, ry, 0, -Math.PI / 2, Math.PI / 2);
        g.stroke();
        if (!o.hit && half === "front") {
          for (let i = 0; i < 9; i++) {
            const a = -Math.PI / 2 + (i / 8) * Math.PI;
            const fx = x + Math.cos(a) * 13, fy = cy + Math.sin(a) * ry;
            g.save(); g.translate(fx, fy); g.rotate(a + Math.PI / 2 - Math.PI / 2 + (Math.cos(a) * 0.3));
            flame(0, 0, 0.55, i * 3 + o.ph);
            g.restore();
          }
        }
      }

      function drawLunch(x, y) {
        const b = Math.sin(clock * 4) * 2;
        g.fillStyle = "rgba(253,230,138,.35)"; g.beginPath(); g.arc(x, y + b, 17, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#2563eb"; rr(x - 12, y - 8 + b, 24, 17, 4); g.fill();
        g.fillStyle = "#fbbf24"; rr(x - 13, y - 10 + b, 26, 7, 3); g.fill();
        g.fillStyle = "#fff"; g.fillRect(x - 2, y - 8 + b, 4, 17);
        g.strokeStyle = "#7c2d12"; g.lineWidth = 2; g.lineCap = "round";
        g.beginPath(); g.moveTo(x + 6, y - 14 + b); g.lineTo(x + 14, y - 20 + b); g.moveTo(x + 9, y - 13 + b); g.lineTo(x + 16, y - 18 + b); g.stroke();
      }

      function drawPlayer() {
        const x = PLAYER_SX, by = GY - BALL_R - py;
        if (invT > 0 && Math.floor(invT * 12) % 2 === 0) g.globalAlpha = 0.35;
        // 그림자
        const sh = 1 - Math.min(0.7, py / 200);
        g.fillStyle = `rgba(0,0,0,${0.22 * sh})`; g.beginPath(); g.ellipse(x, GY + 2, 20 * sh, 4 * sh, 0, 0, Math.PI * 2); g.fill();
        // 공
        const rot = px / BALL_R;
        g.save(); g.translate(x, by); g.rotate(rot);
        g.fillStyle = "#2563eb"; g.beginPath(); g.arc(0, 0, BALL_R, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#fbbf24";
        for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, BALL_R, (i * 2 * Math.PI) / 3, (i * 2 * Math.PI) / 3 + Math.PI / 3); g.closePath(); g.fill(); }
        g.fillStyle = "#fff"; g.beginPath(); g.arc(0, 0, 5, 0, Math.PI * 2); g.fill();
        g.restore();
        g.fillStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.arc(x - 7, by - 8, 5, 0, Math.PI * 2); g.fill();
        // 다리
        const feetY = by - BALL_R;
        const step = onGround ? Math.sin(px / 9) * 3 : 0;
        g.strokeStyle = "#1e293b"; g.lineWidth = 4; g.lineCap = "round";
        g.beginPath(); g.moveTo(x - 5 + step, feetY); g.lineTo(x - 3, feetY - 10); g.moveTo(x + 5 - step, feetY); g.lineTo(x + 3, feetY - 10); g.stroke();
        // 몸통(줄무늬 셔츠)
        const tTop = feetY - 30, tBot = feetY - 9;
        g.save();
        rr(x - 10, tTop, 20, tBot - tTop, 6); g.clip();
        g.fillStyle = "#fff"; g.fillRect(x - 10, tTop, 20, tBot - tTop);
        g.fillStyle = "#be123c";
        for (let y = tTop + 2; y < tBot; y += 6) g.fillRect(x - 10, y, 20, 3);
        g.restore();
        // 팔(균형 잡기)
        const wave = onGround ? Math.sin(clock * 6) * 0.25 : -0.7;
        g.strokeStyle = "#ffd7b5"; g.lineWidth = 3.5;
        g.beginPath();
        g.moveTo(x - 9, tTop + 5); g.lineTo(x - 22, tTop + 2 + wave * 14);
        g.moveTo(x + 9, tTop + 5); g.lineTo(x + 22, tTop + 2 - wave * 14);
        g.stroke();
        // 얼굴
        const hy = tTop - 11;
        g.fillStyle = "#ffd7b5"; g.beginPath(); g.arc(x, hy, 11, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#3f2a1d"; g.beginPath(); g.arc(x, hy - 4, 11, Math.PI * 1.05, Math.PI * 1.95); g.fill();
        g.fillStyle = "#1e293b";
        g.beginPath(); g.arc(x + 2, hy + 1, 1.6, 0, Math.PI * 2); g.arc(x + 7, hy + 1, 1.6, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#9f1239"; g.lineWidth = 1.6;
        g.beginPath(); g.arc(x + 4.5, hy + 4, 3, 0.2, Math.PI - 0.2); g.stroke();
        g.fillStyle = "rgba(244,114,182,.5)"; g.beginPath(); g.arc(x - 3, hy + 4, 2.2, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }

      function draw() {
        if (px == null) return;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, canvas.width, canvas.height);
        let sx = 0, sy = 0;
        if (shake > 0) { sx = (Math.random() - 0.5) * 8 * shake; sy = (Math.random() - 0.5) * 6 * shake; }
        g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * sx, dpr * (sy + TOP * scale));
        const cam = px - PLAYER_SX;
        drawBackground(cam);
        const vis = obstacles.filter((o) => o.x - cam > -60 && o.x - cam < LW + 60);
        for (const o of vis) if (o.t === "ring") drawRing(o, cam, "back");
        for (const o of vis) if (o.t === "pot") drawPot(o, cam);
        drawPlayer();
        for (const o of vis) if (o.t === "ring") drawRing(o, cam, "front");
        // 불꽃 튐
        for (const s of sparks) { g.globalAlpha = 1 - s.t / s.life; star(s.x - cam, s.y, 4, s.c); }
        g.globalAlpha = 1;
        // 떠오르는 글자
        g.textAlign = "center"; g.textBaseline = "middle";
        for (const f of floats) {
          const life = f.big ? 2 : 1.1;
          g.globalAlpha = Math.min(1, (life - f.t) / 0.3);
          g.font = `800 ${f.big ? 18 : 15}px ${FONT}`;
          g.lineWidth = 4; g.strokeStyle = "rgba(59,10,30,.75)";
          const fx = f.big ? LW / 2 : f.x - cam;
          const fy = f.big ? 70 : f.y;
          g.strokeText(f.text, fx, fy); g.fillStyle = f.c; g.fillText(f.text, fx, fy);
        }
        g.globalAlpha = 1;
        // 박수 갈채 띠
        if (clapT > 0) {
          const a = Math.min(1, clapT * 2);
          g.globalAlpha = a;
          g.font = `800 14px ${FONT}`;
          const text = `박수 갈채 · 점수 2배 ${clapT.toFixed(1)}초`;
          const tw = g.measureText(text).width + 26;
          g.fillStyle = "rgba(190,18,60,.9)"; rr(LW / 2 - tw / 2, 14 - TOP, tw, 28, 14); g.fill();
          g.fillStyle = "#fff"; g.fillText(text, LW / 2, 29 - TOP);
          g.globalAlpha = 1;
        }
        if (state === "over" || state === "done") {
          g.fillStyle = "rgba(59,10,30,.35)"; g.fillRect(0, -TOP, LW, LH + TOP);
        }
      }

      // ───────────────────────── 루프
      let last = 0;
      clock = 0;
      function frame(ts) {
        requestAnimationFrame(frame);
        const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
        last = ts;
        if (state === "play") {
          clock += dt;
          // 작은 걸음으로 나눠서(빠른 속도에서도 판정이 새지 않게)
          let left = dt;
          while (left > 0) { const h = Math.min(left, 1 / 120); update(h); left -= h; if (state !== "play") break; }
          shake = Math.max(0, shake - dt * 3);
        } else if (state === "over") {
          clock += dt;
          shake = Math.max(0, shake - dt * 3);
          for (const f of floats) { f.t += dt; f.y -= 30 * dt; }
          for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; }
        }
        draw();
      }

      // ───────────────────────── 조작
      function press() {
        if (state === "ready") { begin(); return; }
        if (state === "paused") { resume(); return; }
        if (state !== "play") return;
        holding = true;
        bufferT = 0.13;
      }
      function release() { holding = false; }

      const JUMP_KEYS = ["Space", "ArrowUp", "KeyW", "Enter"];
      function typing(t) { return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable); }
      window.addEventListener("keydown", (e) => {
        if (typing(e.target)) return;
        if (document.querySelector(".hk-dialog__overlay")) return;
        if ((e.code === "Escape" || e.code === "KeyP") && state === "play") { pause(); return; }
        if (JUMP_KEYS.includes(e.code) || e.code === "ArrowDown") {
          e.preventDefault();
          if (e.repeat || !JUMP_KEYS.includes(e.code)) return;
          press();
        }
      });
      window.addEventListener("keyup", (e) => { if (JUMP_KEYS.includes(e.code)) release(); });
      window.addEventListener("blur", release);

      canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); if (state === "play") press(); });
      canvas.addEventListener("pointerup", release);
      canvas.addEventListener("pointercancel", release);
      canvas.addEventListener("pointerleave", release);
      board.addEventListener("touchstart", (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
      board.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
      jumpBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); try { jumpBtn.setPointerCapture(e.pointerId); } catch (_) { /* 무시 */ } jumpBtn.classList.add("is-down"); press(); });
      const btnUp = () => { jumpBtn.classList.remove("is-down"); release(); };
      jumpBtn.addEventListener("pointerup", btnUp);
      jumpBtn.addEventListener("pointercancel", btnUp);
      jumpBtn.addEventListener("lostpointercapture", btnUp);
      jumpBtn.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
      jumpBtn.addEventListener("contextmenu", (e) => e.preventDefault());
      jumpBtn.addEventListener("click", (e) => e.preventDefault());

      document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pause(); });

      // ───────────────────────── 겹침 화면
      function showOver(html) { over.innerHTML = html; over.hidden = false; HKUI.refreshIcons(over); }
      function hideOver() { over.hidden = true; over.innerHTML = ""; }

      function showReady() {
        state = "ready";
        reset();
        const coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
        showOver(`<div class="gm-cc-card">
          <span class="gm-cc-badge">${HKUI.icon("tent", 28, "#fff")}</span>
          <h2>점심 서커스</h2>
          <p>공 위의 곡예사가 저절로 앞으로 가요. <b>불꽃 단지</b>는 넘고, <b>불꽃 고리</b>는 한가운데로 통과하세요.</p>
          <dl class="gm-cc-keys">
            <dt>${coarse ? "점프 버튼·화면 탭" : "스페이스·↑"}</dt><dd>점프 · 길게 누르면 더 높이</dd>
            <dt>고리 속 도시락</dt><dd>+20점</dd>
            <dt>10번 연속 성공</dt><dd>박수 갈채! 5초간 점수 2배</dd>
            <dt>목숨 3개</dt><dd>갈수록 빨라져요 · 높은 고리는 길게</dd>
          </dl>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-cc-start">${HKUI.icon("play", 16, "#fff")} 공연 시작</button>
        </div>`);
        $("#gm-cc-start").onclick = begin;
        draw();
      }

      function showResult() {
        const dist = Math.floor(meters());
        showOver(`<div class="gm-cc-card">
          <span class="gm-cc-badge">${HKUI.icon("tent", 28, "#fff")}</span>
          <h2>오늘 공연 끝!</h2>
          <div class="gm-cc-big">${total().toLocaleString("ko-KR")}점</div>
          <div class="gm-cc-break">
            <span>이동 거리</span><b>${dist.toLocaleString("ko-KR")}m</b>
            <span>거리 점수(박수 갈채 2배 포함)</span><b>${Math.floor(scoreDist).toLocaleString("ko-KR")}</b>
            <span>도시락 ${items}개 · 박수 갈채 ${claps}번</span><b>+${bonus.toLocaleString("ko-KR")}</b>
          </div>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-cc-again">${HKUI.icon("rotate-ccw", 16, "#fff")} 다시 공연하기</button>
        </div>`);
        $("#gm-cc-again").onclick = () => { document.querySelector(".hk-dialog__overlay")?.remove(); begin(); };
      }

      function begin() {
        hideOver();
        reset();
        state = "play";
        last = 0;
      }
      function pause() {
        if (state !== "play") return;
        state = "paused";
        holding = false;
        showOver(`<div class="gm-cc-card">
          <span class="gm-cc-badge">${HKUI.icon("pause", 26, "#fff")}</span>
          <h2>잠깐 쉬어요</h2>
          <p>곡예사도 숨 고르는 중이에요.</p>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-cc-resume">${HKUI.icon("play", 16, "#fff")} 이어서 공연하기</button>
        </div>`);
        $("#gm-cc-resume").onclick = resume;
      }
      function resume() {
        if (state !== "paused") return;
        hideOver();
        state = "play";
        last = 0;
      }

      ctx.onRestart(begin);

      if (/[?&]debug\b/.test(location.search)) {
        window.__gmCircus = { get: () => ({ state, px, py, vy, onGround, lives, streak, clapT, total: total(), bonus, items, claps, clean, obstacles, invT, speed: speed() }), press, release, setLives: (n) => (lives = n), setStreak: (n) => (streak = n) };
      }

      if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(board);
      window.addEventListener("resize", resize);
      showReady();
      resize();
      requestAnimationFrame(frame);
    },
  });
  </script>
</body>
</html>
