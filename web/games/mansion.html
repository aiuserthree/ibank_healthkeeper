  <style>
    /* 한밤의 두뇌 저택 — 보라 · 금색 · 촛불의 한밤 저택. 그림은 모두 DOM · CSS 로 그린다 */
    .mn-main { align-items: stretch !important; padding: 10px !important; background: #0b0614; }
    .hk-pf.is-playing .hk-pf__pause:not([hidden]) { display: inline-flex; }
    .hk-pf__tools > [hidden] { display: none !important; }
    .mn { --gold: #f5c86b; --gold2: #e0a03a; --ink: #f4eeff; --mute: #b9a8d6; --line: rgba(245, 200, 107, .22); --panel: rgba(255, 255, 255, .055); --good: #6ee7b7; --bad: #fb7185;
      position: relative; flex: 1; min-width: 0; min-height: 520px; border-radius: 16px; overflow: hidden; color: var(--ink); display: flex; flex-direction: column;
      background: radial-gradient(120% 70% at 50% -10%, #3b1d63 0%, rgba(59, 29, 99, 0) 60%), radial-gradient(60% 45% at 0% 100%, rgba(224, 160, 58, .16), transparent 70%), radial-gradient(60% 45% at 100% 100%, rgba(224, 160, 58, .12), transparent 70%), linear-gradient(180deg, #1c0f30, #120922 60%, #0d0718);
      box-shadow: 0 10px 30px rgba(15, 23, 42, .3); }
    .mn button { font: inherit; }
    /* 배경 — 달 · 저택 그림자 · 촛불 */
    .mn-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .mn.is-board .mn-deco { opacity: .45; }
    .mn.is-board .mn-deco .mn-moon { opacity: .35; }
    .mn-deco .mn-moon { position: absolute; right: 9%; top: 7%; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 38% 38%, #fff7da, #f5d98b 60%, #c79a3c); box-shadow: 0 0 60px rgba(245, 217, 139, .45); opacity: .9; }
    .mn-deco svg.mn-mansion { position: absolute; left: 50%; bottom: 0; width: min(900px, 120%); transform: translateX(-50%); opacity: .55; }
    .mn-candle { position: absolute; bottom: 18px; width: 10px; height: 34px; border-radius: 3px; background: linear-gradient(180deg, #fef3c7, #d6b98a); }
    .mn-candle::before { content: ""; position: absolute; left: 50%; top: -16px; width: 10px; height: 16px; margin-left: -5px; border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 50% 70%, #fff7cc, #fbbf24 55%, rgba(251, 146, 60, 0) 72%); animation: mn-flick 1.6s infinite ease-in-out; }
    .mn-candle::after { content: ""; position: absolute; left: 50%; top: -40px; width: 80px; height: 80px; margin-left: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(251, 191, 36, .28), rgba(251, 191, 36, 0) 65%); animation: mn-glow 2.4s infinite ease-in-out; }
    .mn-candle.is-l { left: 5%; } .mn-candle.is-r { right: 5%; height: 26px; }
    @keyframes mn-flick { 0%, 100% { transform: scale(1) rotate(-2deg); } 40% { transform: scale(1.08, .92) rotate(3deg); } 70% { transform: scale(.95, 1.06) rotate(-1deg); } }
    @keyframes mn-glow { 0%, 100% { opacity: .8; } 50% { opacity: 1; transform: scale(1.08); } }
    /* 판 — 위 3자리 · 가운데 무대 · 아래 3자리 */
    .mn-board { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
    .mn-board[hidden] { display: none; }
    .mn-row { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex-shrink: 0; }
    .mn-seat { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 12px; border-radius: 14px; background: linear-gradient(rgba(255, 255, 255, .055), rgba(255, 255, 255, .03)), #1c0f30; border: 1px solid rgba(255, 255, 255, .08); transition: box-shadow .25s, border-color .25s, background .25s; }
    .mn-seat.is-me { border-color: rgba(245, 200, 107, .7); box-shadow: 0 0 0 1px rgba(245, 200, 107, .25), 0 0 20px rgba(245, 200, 107, .16); }
    .mn-seat.is-done { background: linear-gradient(rgba(110, 231, 183, .09), rgba(110, 231, 183, .05)), #1c0f30; }
    .mn-seat.is-cellar { background: linear-gradient(180deg, rgba(40, 32, 52, .95), rgba(14, 10, 20, .95)); border-color: rgba(148, 163, 184, .4); }
    .mn-seat.is-off .mn-ava { filter: grayscale(.8) brightness(.7); }
    .mn-ava { flex-shrink: 0; position: relative; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; letter-spacing: -.5px; color: #1b0f2e; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), 0 0 0 2px rgba(255, 255, 255, .12); }
    .mn-ava.is-bot { font-size: 18px; }
    .mn-seat__t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .mn-seat__t b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mn-seat__t small { font-size: 11.5px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mn-seat__st { min-height: 15px; font-size: 11.5px; font-weight: 700; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mn-seat__st.is-done { color: var(--good); }
    .mn-seat__st.is-off { color: #fca5a5; }
    .mn-seat__st.is-think::after { content: ""; display: inline-block; width: 12px; text-align: left; animation: mn-dots 1.2s steps(4) infinite; }
    @keyframes mn-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    .mn-stars { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 19px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
    .mn-stars svg { width: 16px; height: 16px; filter: drop-shadow(0 0 4px rgba(245, 200, 107, .6)); }
    .mn-stars.is-pulse { animation: mn-pulse .5s ease; }
    @keyframes mn-pulse { 50% { transform: scale(1.3); } }
    .mn-tag { position: absolute; left: 8px; top: -9px; padding: 1px 7px; border-radius: 999px; background: #334155; color: #e2e8f0; font-size: 10.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; }
    .mn-tag[hidden] { display: none; }
    /* 공개 카드 — 뒤집기 */
    .mn-chip { position: absolute; right: 78px; top: 50%; width: 46px; height: 40px; margin-top: -20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #1b0f2e; background: #fef3c7; box-shadow: 0 6px 14px rgba(0, 0, 0, .35); transform: perspective(300px) rotateY(90deg); opacity: 0; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), opacity .2s; pointer-events: none; z-index: 2; }
    .mn-chip.is-back { opacity: 1; transform: perspective(300px) rotateY(0); background: linear-gradient(135deg, #4c1d95, #7c3aed); color: var(--gold); border: 1px solid var(--gold); animation: mn-shake .3s infinite; }
    .mn-chip.is-on { opacity: 1; transform: perspective(300px) rotateY(0); }
    .mn-chip.is-good { background: #a7f3d0; } .mn-chip.is-bad { background: #fecdd3; } .mn-chip.is-gold { background: linear-gradient(135deg, #fde68a, #f59e0b); }
    .mn-chip.is-sun { background: #fde68a; } .mn-chip.is-moon { background: #c7d2fe; }
    @keyframes mn-shake { 0%, 100% { transform: perspective(300px) rotate(-4deg); } 50% { transform: perspective(300px) rotate(4deg); } }
    .mn-delta { position: absolute; left: 22px; top: 2px; z-index: 4; font-size: 20px; font-weight: 900; color: var(--good); text-shadow: 0 2px 6px rgba(0, 0, 0, .6); pointer-events: none; animation: mn-up 1.7s ease-out forwards; }
    .mn-delta.is-dn { color: var(--bad); }
    @keyframes mn-up { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 15% { opacity: 1; transform: translateY(0) scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }
    /* 말풍선 */
    .mn-bub { position: absolute; left: 50%; z-index: 6; max-width: 190px; width: max-content; padding: 7px 11px; border-radius: 14px; background: #fff; color: #1b0f2e; font-size: 13px; font-weight: 700; line-height: 1.35; word-break: keep-all; box-shadow: 0 8px 20px rgba(0, 0, 0, .4); transform: translateX(-50%); animation: mn-bub 3.4s ease forwards; pointer-events: none; }
    .mn-bub::after { content: ""; position: absolute; left: 50%; width: 10px; height: 10px; margin-left: -5px; background: inherit; transform: rotate(45deg); }
    .mn-row.is-top .mn-bub { top: calc(100% + 8px); } .mn-row.is-top .mn-bub::after { top: -4px; }
    .mn-row.is-bot .mn-bub { bottom: calc(100% + 8px); } .mn-row.is-bot .mn-bub::after { bottom: -4px; }
    .mn-bub.is-gift { background: linear-gradient(135deg, #fde68a, #fbbf24); }
    .mn-bub.is-me { box-shadow: 0 0 0 2px var(--gold), 0 8px 20px rgba(0, 0, 0, .4); }
    @keyframes mn-bub { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 8% { opacity: 1; transform: translateX(-50%) scale(1.05); } 12% { transform: translateX(-50%) scale(1); } 88% { opacity: 1; } 100% { opacity: 0; } }
    .mn-fly { position: fixed; z-index: 80; width: 18px; height: 18px; pointer-events: none; color: var(--gold, #f5c86b); filter: drop-shadow(0 0 6px rgba(245, 200, 107, .9)); }
    .mn-fly svg { width: 100%; height: 100%; display: block; }
    /* 무대 */
    .mn-stage { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(40, 21, 66, .97), rgba(22, 12, 38, .98)); box-shadow: inset 0 0 50px rgba(0, 0, 0, .35), 0 0 30px rgba(124, 58, 237, .12); overflow: hidden; }
    .mn-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
    .mn-rnd { flex-shrink: 0; font-size: 12px; font-weight: 800; color: #2a1442; background: var(--gold); padding: 3px 9px; border-radius: 999px; }
    .mn-gname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mn-gname svg { flex-shrink: 0; color: var(--gold); }
    .mn-step { flex-shrink: 0; font-size: 12.5px; color: var(--mute); font-weight: 700; }
    .mn-sec { flex-shrink: 0; min-width: 34px; text-align: right; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); }
    .mn-sec.is-hurry { color: var(--bad); animation: mn-pulse 1s infinite; }
    .mn-timer { position: relative; height: 6px; margin: 0 16px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; flex-shrink: 0; }
    .mn-timer i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold)); border-radius: 99px; transition: width .2s linear; }
    .mn-timer.is-hurry i { background: linear-gradient(90deg, #ef4444, #fb7185); }
    .mn-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 12px 16px 16px; text-align: center; }
    .mn-in { margin: auto; width: 100%; max-width: 580px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .mn-in.is-pop { animation: mn-pop .35s ease; }
    @keyframes mn-pop { 0% { opacity: 0; transform: scale(.94); } 100% { opacity: 1; transform: none; } }
    .mn-h { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.3px; word-break: keep-all; }
    .mn-h.is-gold { color: var(--gold); text-shadow: 0 0 18px rgba(245, 200, 107, .35); }
    .mn-p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--mute); word-break: keep-all; }
    .mn-p b { color: var(--ink); }
    .mn-kick { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
    .mn-gi__ic { width: 76px; height: 76px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--gold); background: radial-gradient(circle at 50% 30%, rgba(245, 200, 107, .25), rgba(124, 58, 237, .25)); border: 1px solid var(--line); box-shadow: 0 0 40px rgba(245, 200, 107, .2); animation: mn-float 2.4s ease-in-out infinite; }
    @keyframes mn-float { 50% { transform: translateY(-6px); } }
    .mn-cards4 { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
    .mn-cards4 span { width: 52px; height: 72px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: var(--gold); background: repeating-linear-gradient(45deg, #3b1d63 0 6px, #2a1448 6px 12px); border: 1.5px solid var(--gold); box-shadow: 0 8px 18px rgba(0, 0, 0, .4); animation: mn-float 2.4s ease-in-out infinite; }
    .mn-cards4 span:nth-child(2) { animation-delay: .3s; } .mn-cards4 span:nth-child(3) { animation-delay: .6s; } .mn-cards4 span:nth-child(4) { animation-delay: .9s; }
    .mn-note { position: absolute; left: 50%; top: 52px; z-index: 5; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 6px 12px; border-radius: 999px; background: rgba(251, 113, 133, .92); color: #fff; font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mn-note[hidden] { display: none; }
    /* 고르기 단추 */
    .mn-pick2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 440px; }
    .mn-big { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 112px; padding: 12px 8px; border-radius: 18px; border: 1.5px solid rgba(255, 255, 255, .18); color: #fff; cursor: pointer; box-shadow: 0 10px 22px rgba(0, 0, 0, .35); transition: transform .12s, box-shadow .12s; }
    .mn-big:hover { transform: translateY(-2px); }
    .mn-big:active { transform: translateY(1px); }
    .mn-big b { font-size: 22px; font-weight: 900; }
    .mn-big small { font-size: 12px; opacity: .85; word-break: keep-all; }
    .mn-big.is-coop { background: linear-gradient(160deg, #0f766e, #134e4a); }
    .mn-big.is-bet { background: linear-gradient(160deg, #be123c, #4c0519); }
    .mn-big.is-sun { background: linear-gradient(160deg, #f59e0b, #9a3412); }
    .mn-big.is-moon { background: linear-gradient(160deg, #6366f1, #1e1b4b); }
    .mn-num { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .mn-num b { min-width: 92px; font-size: 52px; line-height: 1; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 0 20px rgba(245, 200, 107, .35); }
    .mn-sbtn { min-width: 44px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .08); color: var(--ink); font-size: 16px !important; font-weight: 800; cursor: pointer; }
    .mn-sbtn:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
    .mn-sbtn:disabled { opacity: .35; cursor: not-allowed; }
    .mn-sbtn.is-on { border-color: var(--gold); color: var(--gold); background: rgba(245, 200, 107, .12); }
    .mn-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .mn-nums { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 440px; }
    .mn-nums .mn-sbtn { height: 60px; font-size: 24px !important; }
    .mn-go { min-width: 200px; height: 48px !important; font-size: 16px !important; }
    .mn-range { width: 100%; max-width: 420px; accent-color: #f5c86b; height: 28px; }
    .mn-wait { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 22px; border-radius: 18px; background: rgba(255, 255, 255, .05); border: 1px dashed var(--line); }
    .mn-wait b { font-size: 18px; }
    .mn-wait svg { color: var(--gold); }
    .mn-cnt { font-size: 13px; font-weight: 800; color: var(--gold); }
    .mn-hist { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; font-size: 12px; color: var(--mute); }
    .mn-hist span { padding: 2px 8px; border-radius: 999px; background: rgba(255, 255, 255, .07); }
    .mn-vs { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; }
    .mn-vs span { padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .08); }
    .mn-vs svg { color: var(--gold); }
    .mn-small { font-size: 12px; color: var(--mute); word-break: keep-all; line-height: 1.5; }
    /* 상자 · 항아리 그림 */
    .mn-chest { position: relative; width: 104px; height: 78px; margin: 6px auto 2px; filter: drop-shadow(0 0 18px var(--bc)); animation: mn-wob 1.8s ease-in-out infinite; }
    .mn-chest::before { content: ""; position: absolute; left: -5px; right: -5px; top: 0; height: 28px; border-radius: 14px 14px 4px 4px; background: linear-gradient(180deg, color-mix(in srgb, var(--bc) 70%, white), var(--bc)); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); transform-origin: 10% 100%; transition: transform .5s cubic-bezier(.3, 1.5, .5, 1); z-index: 1; }
    .mn-chest::after { content: ""; position: absolute; left: 0; right: 0; top: 26px; bottom: 0; border-radius: 4px 4px 12px 12px; background: linear-gradient(180deg, var(--bc), color-mix(in srgb, var(--bc) 55%, black)); }
    .mn-chest i { position: absolute; left: 50%; top: 18px; z-index: 2; width: 16px; height: 20px; margin-left: -8px; border-radius: 4px; background: #fde68a; box-shadow: 0 0 10px rgba(253, 230, 138, .8); }
    .mn-chest.is-open { animation: none; }
    .mn-chest.is-open::before { transform: translateY(-10px) rotate(-28deg); }
    .mn-chest.is-open i { opacity: 0; }
    @keyframes mn-wob { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(0); } }
    .mn-pot { position: relative; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); background: radial-gradient(circle at 50% 40%, rgba(245, 200, 107, .25), rgba(124, 58, 237, .2) 70%); border: 1px solid var(--line); }
    .mn-pot b { position: absolute; bottom: 4px; right: 2px; min-width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--gold); color: #2a1442; font-size: 18px; font-weight: 900; }
    .mn-pot.is-broke { animation: mn-shake .15s 6; color: var(--bad); }
    .mn-boom { font-size: 30px; font-weight: 900; color: var(--gold); text-shadow: 0 0 24px rgba(245, 200, 107, .5); }
    .mn-boom.is-bad { color: var(--bad); text-shadow: 0 0 24px rgba(251, 113, 133, .5); }
    /* 기억 릴레이 */
    .mn-memshow { position: relative; width: 120px; height: 120px; border-radius: 26px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); box-shadow: inset 0 0 30px rgba(0, 0, 0, .5); }
    .mn-memshow > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.6); transition: opacity .12s, transform .18s; }
    .mn-memshow > span.is-on { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 16px currentColor); }
    .mn-dots { display: flex; gap: 6px; }
    .mn-dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .15); }
    .mn-dots i.is-on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .mn-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 44px; }
    .mn-slots span { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .06); border: 1px dashed rgba(255, 255, 255, .2); }
    .mn-slots span.is-fill { border-style: solid; border-color: var(--line); background: rgba(255, 255, 255, .1); }
    .mn-syms { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 440px; }
    .mn-syms button { height: 62px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .07); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .mn-syms button:active { transform: scale(.94); background: rgba(255, 255, 255, .16); }
    /* 공개 */
    .mn-drum { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .mn-drum svg { color: var(--bad); animation: mn-beat .5s infinite; }
    .mn-drum b { font-size: 24px; font-weight: 900; }

  (async function () {
    // 한밤의 두뇌 저택 — 혼자 연습(컴퓨터 5명 · 기록 안 함) · 여러 명(동료 최대 6명 · 빈자리는 컴퓨터 · 1등만 1승)

    const KEY = "mansion";
    const TINT = "linear-gradient(135deg, #1e1b4b, #a78bfa)";
    const DEV = HKLunch.isLocal() || /\.test$/.test(location.hostname) || (() => { try { return localStorage.getItem("hk-dev") === "1"; } catch (_) { return false; } })();

    const PMAX = 6;           // 자리 수(사람 + 컴퓨터)

    const ROUNDS = 4;         // 한 판 라운드 수
    // 시간(밀리초) — 라운드 게임 하나 2분 안팎 · 한 판 10~15분
    const T = FAST
      ? { intro: 1200, gi: 1200, rv: 2400, rs: 1600, tr: 3000, drum: 500, step: 260 }
      : { intro: 6000, gi: 8000, rv: 6200, rs: 7000, tr: 30000, drum: 1100, step: 700 };

      function queue(q) { if (E.bq.length < 40) E.bq.push(q); }
      function doBotAct(q, now) {

        if (q.t === "gift") return gift(q.s, q.to, q.n, now, true);
        return false;
      }
      function botReact(now, rv) {
        const at = () => now + T.drum + rnd(500, 1500);

          for (const [a, b] of rv.pairs) {
            [[a, b], [b, a]].forEach(([x, y]) => { if (isBot(x) && !rv.c[x] && rv.c[y] && Math.random() < 0.55) queue({ at: at(), s: x, t: "say", p: 2, to: y }); });

        } else if (E.g === "auc" && rv.w >= 0 && isBot(rv.w) && rv.d[rv.w] > 0 && Math.random() < 0.5) queue({ at: at(), s: rv.w, t: "say", p: 6, to: -1 });
      }

          if (!isBot(s)) continue;

          const leader = others.reduce((a, x) => (E.stars[x] > E.stars[a] ? x : a), others[0]);
          const friend = others.reduce((a, x) => (E.trust[s][x] > E.trust[s][a] ? x : a), pick(others));
          if (k === K_LOYAL) {

            if (E.trust[s][friend] >= 2 && Math.random() < 0.7) { const t = at(); queue({ at: t, s, t: "gift", to: friend, n: 1 }); queue({ at: t + 400, s, t: "say", p: 3, to: friend }); }
          } else if (k === K_GREED) {
            queue({ at: at(), s, t: "say", p: pick([6, 2, 1]), to: Math.random() < 0.5 ? leader : -1 });
          } else if (k === K_CALC) {
            queue({ at: at(), s, t: "say", p: pick([1, 0]), to: leader });
            if (Math.random() < 0.25) queue({ at: at(), s, t: "gift", to: friend, n: 1 });
          } else if (k === K_FICKLE) {

            if (Math.random() < 0.3) queue({ at: at(), s, t: "gift", to: pick(others), n: rnd(1, 2) });
          } else {
            queue({ at: at(), s, t: "say", p: 5, to: leader });
            if (Math.random() < 0.35) queue({ at: at(), s, t: "gift", to: leader, n: 1 });
          }
          if (Math.random() < 0.35) queue({ at: at(), s, t: "say", p: pick([[1, 0], [0, 7, 3], [6, 2], [0, 1, 2, 6, 7], [5, 0]][k]), to: -1 });
        }
      }
      // 컴퓨터에게 말을 걸면 대답한다
      function botHear(from, p, to, now) {
        if (!(to >= 0) || !isBot(to)) return;
        const k = charOf(to);
        let r = -1;
        if (p === 0) { r = [1, 7, 6, pick([7, 1, 6]), 7][k]; if (k === K_LOYAL || k === K_TIMID) E.trust[to][from] += 1; }
        else if (p === 1) r = [0, 7, 0, pick([7, 6, 0]), 7][k];
        else if (p === 2) r = [1, 7, 6, 6, 5][k];
        else if (p === 3 || p === 5) r = k === K_LOYAL || k === K_TIMID ? 7 : k === K_GREED ? 6 : -1;
        else if (p === 6) r = k === K_GREED ? 2 : k === K_FICKLE ? 6 : -1;

      // 손님 연결이 끊기면 그 자리는 컴퓨터가 대신 고른다 · 돌아오면 다시 사람이

        if (E.ph === "end") o.fin = E.fin;

    }

        const rows = order.map((s) => `<div class="mn-rl ${s === V.seat ? "is-me" : ""}"><b>${place(s)}</b>${avaHtml(s, V.names, V.chars)}<span class="mn-rl__n">${esc(nm(s))}</span><span class="mn-d ${rs.d[s] > 0 ? "is-up" : rs.d[s] < 0 ? "is-dn" : ""}">${sign(rs.d[s])}</span><em>${STAR.replace("<svg", '<svg width="13" height="13"')} ${p.stars[s]}</em></div>`).join("");

        return `<div class="mn-in is-pop"><h3 class="mn-h">${p.r}라운드 결과 — ${esc(G ? G.name : "")}</h3><div class="mn-rlist">${rows}</div>
          ${rs.cel >= 0 ? `<div class="mn-cellar">${icon("door-open", 24)}<div>${nmHtml(rs.cel)}${rs.cel === V.seat ? "가" : " 님이"} 지하실로 내려가요<small>별조각 꼴찌 — 다음 라운드에 얻는 별조각이 절반이에요</small></div></div>` : ""}
          ${nx ? `<p class="mn-small">다음 게임: <b>${esc(nx.name)}</b> · 그 전에 30초 거래 시간이 있어요</p>` : `<p class="mn-small">마지막 라운드였어요</p>`}</div>`;
      }
      function tradeHtml(p) {
        const nx = p.nx ? GAMES[p.nx] : null;
        const tg = [...Array(PMAX).keys()].filter((s) => s !== V.seat);
        return `<div class="mn-in is-pop"><h3 class="mn-h is-gold">거래 시간</h3>
          <p class="mn-p">말풍선을 보내거나 별조각을 선물해요${nx ? ` · 다음 게임은 <b>${esc(nx.name)}</b>` : ""}</p>
          <div class="mn-tgts" id="mn-tgts"><button type="button" data-tgt="-1"><span class="mn-dot" style="--c:#e9d5ff">${icon("users", 12)}</span><span>모두에게</span></button>${tg.map((s) => `<button type="button" data-tgt="${s}"><span class="mn-dot" style="--c:${SEAT_COL[s]}">${esc(seatLetter(V.chars[s] >= 0 ? CHARS[V.chars[s]].ch : V.names[s], V.chars[s] >= 0))}</span><span>${esc(nm(s))}</span></button>`).join("")}</div>
          <div class="mn-says">${SAY.map((t, i) => `<button type="button" data-say="${i}">${esc(t)}</button>`).join("")}</div>
          <div class="mn-gifts"><span>${icon("gift", 15)} 선물</span>${[1, 2, 3].map((n) => `<button type="button" class="mn-sbtn" data-gift="${n}">${n}개</button>`).join("")}</div>
          <p class="mn-small" id="mn-gnote"></p>
          <div class="mn-feed" id="mn-feed"></div></div>`;
      }
      function paintTrade() {
        const p = V.pub;
        if (!p || p.ph !== "tr") return;
        document.querySelectorAll("#mn-tgts [data-tgt]").forEach((b) => b.classList.toggle("is-on", Number(b.dataset.tgt) === V.tgt));
        const given = (p.gf || []).includes(V.seat), st = p.stars[V.seat];
        document.querySelectorAll("[data-gift]").forEach((b) => { b.disabled = given || Number(b.dataset.gift) > st; });
        const gn = $("#mn-gnote");
        if (gn) gn.textContent = given ? "이번 거래 시간에는 선물을 이미 했어요" : V.tgt < 0 ? "선물은 받을 사람을 한 명 고른 뒤에 해요 · 거래 시간마다 한 번" : `${nm(V.tgt)}${V.tgt === V.seat ? "" : "님"}에게 선물해요 · 거래 시간마다 한 번`;
        paintFeed();
      }
      function evText(e) {
        const [, type, from, a, b] = e;
        if (type === 1) return `${nmHtml(from)} → ${nmHtml(b)} 별조각 ${a}개 선물`;
        return `${nmHtml(from)}${b >= 0 ? ` → ${nmHtml(b)}` : ""}: “${esc(SAY[a] || "")}”`;
      }
      function addFeed(e) { V.feed.unshift(evText(e)); if (V.feed.length > 4) V.feed.length = 4; }
      function paintFeed() { const f = $("#mn-feed"); if (f) f.innerHTML = V.feed.map((x) => `<div>${x}</div>`).join(""); }
      function onEvent(e) {
        const [, type, from, a, b] = e;
        addFeed(e); paintFeed();
        if (type === 1) {
          bubble(from, `${b === V.seat ? "나에게 " : ""}별조각 ${a}개 선물!`, "gift");
          const f = V.seatEl[from], t = V.seatEl[b];

          sfx("coin");
        } else {
          const text = SAY[a] || "";
          bubble(from, b >= 0 ? `${b === V.seat ? "" : `${V.names[b]}님, `}${text}` : text, b === V.seat ? "me" : "");
          sfx(b === V.seat ? "squeak" : "pop");
        }
      }
      function bubble(s, text, kind) {
        const e = V.seatEl[s];
        if (!e) return;
        e.querySelectorAll(".mn-bub").forEach((x) => x.remove());
        const b = document.createElement("div");
        b.className = `mn-bub ${kind ? `is-${kind}` : ""}`;
        b.textContent = text;
        e.appendChild(b);
        setTimeout(() => b.remove(), 3400);
      }
      function fly(fromEl, toEl, n, delay) {
        if (!fromEl || !toEl || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
        const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
        for (let i = 0; i < Math.min(n, 6); i++) {
          const d = document.createElement("span");
          d.className = "mn-fly";
          d.innerHTML = STAR;
          d.style.left = `${x0 - 9}px`; d.style.top = `${y0 - 9}px`;
          document.body.appendChild(d);
          const mx = (x1 - x0) / 2 + (Math.random() - 0.5) * 90, my = Math.min(0, y1 - y0) - 30 - Math.random() * 40;
          const an = d.animate([
            { transform: "translate(0,0) scale(.5)", opacity: 0 },
            { transform: `translate(${mx}px, ${my}px) scale(1.15)`, opacity: 1, offset: 0.45 },
            { transform: `translate(${x1 - x0}px, ${y1 - y0}px) scale(.7)`, opacity: 0.3 },
          ], { duration: 760, delay: delay + i * 90, easing: "cubic-bezier(.3,.7,.4,1)", fill: "both" });
          an.onfinish = () => d.remove();

      // ── 내가 고르기 · 말하기 · 선물
      function choose(v) {
        const p = V && V.pub;

        const k = keyOf(p);

        V.act({ t: "c", k, v });
        if (!V) return;
        const q = V.pub; // 혼자 · 주인은 위에서 바로 새 상태가 들어온다

        paintSeats(q);
      }
      function onClick(e) {

        if (!b || b.disabled || !b.closest("#mn-board")) return;
        const p = V.pub;
        if (b.dataset.v != null && p.ph === "ch") return choose(Number(b.dataset.v));
        if (b.dataset.bid) { const max = Math.max(0, Math.min(12, p.stars[V.seat])); V.bid = clamp(V.bid + Number(b.dataset.bid), 0, max); $("#mn-bidv").textContent = V.bid; sfx("tap"); return; }
        if (b.dataset.bset) { V.bid = Number(b.dataset.bset); $("#mn-bidv").textContent = V.bid; sfx("tap"); return; }
        if (b.dataset.av) { V.av = clamp(V.av + Number(b.dataset.av), 0, 100); $("#mn-avv").textContent = V.av; const r = $("#mn-avr"); if (r) r.value = String(V.av); sfx("tap"); return; }
        if (b.dataset.act === "pick") return choose(p.g === "auc" ? V.bid : V.av);

          V.mem.push(Number(b.dataset.sym));
          sfx("mbox", { n: Number(b.dataset.sym) + 1 });
          paintSlots();

          return;
        }
        if (b.dataset.act === "memdel") { V.mem.pop(); paintSlots(); sfx("tap"); return; }
        if (b.dataset.tgt != null) { V.tgt = Number(b.dataset.tgt); sfx("tap"); paintTrade(); return; }
        if (b.dataset.say != null && p.ph === "tr") {

        if (b.dataset.gift != null && p.ph === "tr") {

          V.act({ t: "gift", to: V.tgt, n: Number(b.dataset.gift) });
          document.querySelectorAll("[data-gift]").forEach((x) => { x.disabled = true; });
        }
      }
      $("#mn").addEventListener("click", onClick);
      $("#mn").addEventListener("input", (e) => {
        if (!V || e.target.id !== "mn-avr") return;

      });
      // 키보드 — 1 · 2 로 두 갈래 고르기, 0~5 로 항아리, Enter 로 내기
      function onKey(e) {
        if (!V || !V.pub || V.pub.ph !== "ch" || V.pick) return false;
        const p = V.pub, n = /^Digit(\d)$/.exec(e.code);
        if (n && (p.g === "vlt" || p.g === "min") && (n[1] === "1" || n[1] === "2")) { choose(Number(n[1]) - 1); return true; }
        if (n && p.g === "pot" && Number(n[1]) <= 5) { choose(Number(n[1])); return true; }
        if (n && p.g === "mem" && Number(n[1]) >= 1 && Number(n[1]) <= 6) { const btn = document.querySelector(`[data-sym="${Number(n[1]) - 1}"]`); if (btn) btn.click(); return true; }

      return { start, stop, apply, note, onKey, get: () => V, freeze: () => { if (V && V.pub) { V.pub = { ...V.pub, left: Math.max(0, V.dl - Date.now()), pz: 1 }; V.paused = true; } } };
    })();

    // ───── 결과 화면 — 최종 순위 · 라운드별 기록
    function placeOf(stars, s) { return 1 + stars.filter((x) => x > stars[s]).length; }
    function resultHtml(pub, ctx, opt) {
      const stars = pub.stars, seat = ctx.seat, win = pub.fin ? pub.fin.winner : null;

      const title = seat < 0 ? "판이 끝났어요" : win === seat ? "1등이에요!" : win == null && stars[seat] === top ? "공동 1등이에요" : `${myPlace}등이에요`;
      const winBot = win != null && isBotC(ctx.chars[win]);

      const list = order.map((s) => `<div class="mn-rank ${stars[s] === top ? "is-top" : ""} ${s === seat ? "is-me" : ""}"><b>${placeOf(stars, s)}</b>${avaHtml(s, ctx.names, ctx.chars)}<span>${esc(nm(s))} <small>${ctx.chars[s] >= 0 ? `컴퓨터 · ${CHARS[ctx.chars[s]].kind}` : ctx.chars[s] === -2 ? "컴퓨터" : ""}</small></span><em>${STAR} ${stars[s]}</em></div>`).join("");

      return `<div class="mn-box is-small" role="dialog" aria-label="최종 결과" style="max-width:520px">

    // ════════════════════════════════════════════════════════════════

    function showMenu() {

    function startSolo() {

          <h2>한밤의 두뇌 저택 게임 방법</h2>

          <div class="mn-mini">초대 받은 사람에게 Teams 로 알려요 · 대기실은 2시간 동안 열려 있어요 · 준비한 사람이 모이면 연 사람이 시작해요</div>

    }
    async function openParty(id) {
      closeConn(); stopSolo(); View.stop(); clearInterval(lobbyPoll); clearInterval(sentPoll); closeLayer();
      screen = "connect"; setPlaying(false); pauseBtn.hidden = true;
      showOver(cardHtml("castle", "저택을 불러오는 중…", ""));
      let p;
      try { p = await HKApi.partyDetail(id); } catch (e) { HKMatch.fail(e); history.replaceState(null, "", location.pathname); return showPartyLobby(); }
      if (location.hash !== `#p${id}`) return;
      if (p.game && p.game !== KEY) { location.href = `/games/${p.game}#p${id}`; return; }
      const back = `<button type="button" class="hk-btn hk-btn--secondary" data-act="plobby">여러 명 저택 목록</button>`;
      if (p.status === "DONE") { try { localStorage.removeItem(PART_REP(id)); localStorage.removeItem(ENG_KEY(id)); } catch (_) { /* 없음 */ } return showPartyDone(p); }
      if (p.status === "CANCELLED" || p.status === "EXPIRED") { screen = "lost"; return showOver(cardHtml("flag", p.status === "CANCELLED" ? "닫힌 대기실이에요" : "시간이 지나 닫힌 대기실이에요", `${p.host.name}님의 저택`, back)); }

        screen = "pinvite";
        const ppl = p.seats.filter((s) => s.seat !== "DECLINED" && s.seat !== "LEFT").map((s) => s.name).join(" · ");
        return showOver(cardHtml("castle", `${p.host.name}님이 한밤의 두뇌 저택에 초대했어요`, `${ppl} · 빈자리는 컴퓨터가 앉아요 · 1등만 1승`,
          `<button type="button" class="hk-btn hk-btn--secondary" data-act="pdecline" data-id="${id}">거절</button><button type="button" class="hk-btn hk-btn--primary" data-act="pjoin" data-id="${id}">들어가기</button>`));
      }
      if (p.mySeat !== "HOST" && p.mySeat !== "JOINED") { screen = "lost"; return showOver(cardHtml("flag", "들어갈 수 없는 저택이에요", "", back)); }
      if (p.status === "RACING" && !p.players.includes(p.meId)) { screen = "lost"; return showOver(cardHtml("flag", "이미 시작한 판이에요", "준비하기 전에 시작해서 이번 판에는 함께하지 못했어요", back)); }

    function playParty(p) {
      closeConn(); closeLayer(); View.stop();
      screen = "connect"; setPlaying(false); pauseBtn.hidden = true;
      showOver(cardHtml("wifi", "저택에 들어가는 중…", `${p.host.name}님의 저택`, `<button type="button" class="hk-btn hk-btn--secondary" data-act="plobby">그만두기</button>`));

      async function refresh() { const n = await HKApi.partyDetail(p.id).catch(() => null); if (!n || S.closed) return; p = S.party = n; n.seats.forEach((s) => { names[s.id] = s.name; }); if (isHost()) hostChanged(); else paint(); }

      // ── 대기실 화면
      function paint() {
        if (S.closed || S.phase !== "wait" || !S.role || !["connect", "ready"].includes(screen)) return;
        screen = "ready";
        const host = isHost();
        const roster = host ? seated().map((id) => ({ id, here: id === S.me || S.here.has(id), rd: id === S.me ? 1 : S.rd[id] ? 1 : 0 })) : S.roster;
        const rows = p.seats.map((s) => {
          const r = roster.find((x) => x.id === s.id);

                : `<button type="button" class="hk-btn hk-btn--primary" data-act="pready" data-on="${myRd ? 0 : 1}">${myRd ? "준비 취소" : "준비"}</button>`}

          </div>`);
      }
      const lbMsg = () => ({ t: "lb", ph: S.phase, roster: seated().map((id) => ({ id, here: id === S.me || S.here.has(id), rd: id === S.me ? 1 : S.rd[id] ? 1 : 0 })) });
      function hostChanged() { if (!isHost()) return; if (S.phase === "wait") send(lbMsg()); paint(); }
      // ── 판 진행(주인)
      function bc(to) { const pub = S.eng.pub(Date.now()); if (to) send({ ...pub, to }); else { S.lastBc = Date.now(); send(pub); } return pub; }
      function saveEng(force) {
        const now = Date.now();
        if (!force && now - S.saveAt < 1000) return;

      }
      function emit() { if (!S.eng) return; const pub = bc(); View.apply(pub); saveEng(pub.ph === "end"); }
      function startLoop() {

          if (S.closed || !S.eng) return;

      }

        if (!S.eng || !S.go) return false;

    // 「‹ 아케이드」 · 「대전 보기」 — 판 중 · 결과 저장 중이면 확인 창을 거친 뒤 간다

        const ok = await HKUI.confirmDialog("저택에서 나갈까요?", before ? "아직 시작 전이에요. 목록에서 다시 들어올 수 있어요." : host ? "판은 이 화면이 진행해요. 나가면 다른 사람들이 기다리게 돼요(40초 넘게 안 돌아오면 판이 멈춰요)." : "나가 있는 동안 내 자리는 컴퓨터가 대신 골라요. 목록에서 다시 들어올 수 있어요.", { confirmLabel: "나가기", cancelLabel: "계속하기" });
        if (!ok) return;
        leaving = true; closeConn(); go();
        return;
      }
      const was = screen === "play";
      if (was) pauseSolo();
      if (await HKUI.confirmDialog("연습을 그만할까요?", "연습 판은 저장되지 않아요.", { confirmLabel: "그만하기", cancelLabel: "계속하기" })) { stopSolo(); go(); }
      else if (was) resumeSolo();
    };
    $("#mn-back").addEventListener("click", (e) => guardLeave(e, HKGoArcade));
    $("#mn-vs").addEventListener("click", (e) => guardLeave(e, () => { location.href = "/together#tg-versus"; }));
    addEventListener("keydown", (e) => {
      if (document.querySelector(".hk-dialog__overlay")) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA") && t.type !== "range") return;
      if (e.code === "Escape") {
        e.preventDefault();
        if (setOpen()) return closeLayer();
        if (screen === "play" && solo) return pauseSolo();
        if (screen === "pause") return resumeSolo();
        return;
      }
      if (e.repeat || setOpen() || screen !== "play") return;
      if (View.onKey(e)) e.preventDefault();
    });
    // 연습 — 다른 화면으로 가면 멈춘다
    document.addEventListener("visibilitychange", () => { if (document.hidden && screen === "play" && solo) pauseSolo("다른 화면으로 가서 멈췄어요"); });

    // 시험용 엿보기(내 컴퓨터 주소에서만)
    if (DEV) window.__mn = { pub: () => (View.get() || {}).pub || null, seat: () => (View.get() || {}).seat, screen: () => screen, sess: () => sess, solo: () => solo };
  })();
  </script>
</body>
</html>
