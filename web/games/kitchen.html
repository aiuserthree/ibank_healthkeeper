          <div class="ks-combo ${c >= 3 ? "is-hot" : ""}" data-spot="combo"><div class="ks-combo__top"><b>콤보 ${c}</b><em>${c >= 1 ? `팁 ×${mult.toFixed(2).replace(/0$/, "").replace(/\.0$/, "")}` : "빨리 내면 올라요"}</em></div><div class="ks-combo__segs">${segs}</div><small>막대가 반 넘게 남았을 때 내면 +1</small></div>
          ${known(k.today) ? `<div class="ks-today">${dishSvg(k.today)}<span><small>오늘의 메뉴</small><b>${esc(dishName(k.today))} +${won(k.todayBonus)}</b></span></div>` : ""}
          <div class="ks-clock ${left < 30 ? "is-low" : ""}" aria-hidden="true"><b data-clock>${mmss(left)}</b><small>남은 시간</small></div>
          <div class="ks-rush" data-rush aria-hidden="true">${HKUI.icon("zap", 13, "currentColor")} 점심 러시! <b data-rush-left>${k.rush ? `${Math.max(0, Math.ceil(k.rush.end - now()))}초` : ""}</b></div>
        </div>`;
    }
    // 도움말 — 숫자는 서버가 보낸 값으로
    function tips() {
      const burn = (k && k.burnSec) || RULES.burnSec;
      const steps = (k && k.gimbapSteps) || RULES.gimbapSteps;
      return isHall()
        ? ["★ 단골은 1.5배를 내지만 금방 가요. 먼저 앉혀요.", "막대가 반 넘게 남았을 때 내면 콤보! 팁이 최대 2배예요.", "포장 손님도 주문을 전달하고, 다 나오면 포장대에서 건네요.", "주방은 주문을 못 봐요. 앉히면 바로 「주문 전달」!", "서빙은 주문한 음식이 배식구에 다 있을(✓) 때 돼요.", "배식구 음식을 누르면 버릴 수 있어요."]
        : ["주문서는 급한 것부터 왼쪽에 있어요.", `다 익으면 바로 꺼내요. ${burn}초 지나면 타요.`, "다 나오면 벨을 눌러 홀을 불러요.", `김밥은 버튼을 ${steps}번 눌러 말아요.`, "주황 칸은 지금 필요한 음식이에요."];
    }
    const tipAt = (t) => { const list = tips(); return list[Math.floor(Math.max(0, t - k.start) / 9) % list.length]; };
    function sayActive(t = now()) { return k.say && t - k.say.at < (k.saySec || 6) ? k.say : null; }
    function newsHtml() {
      const s = sayActive();
      const face = s && window.HKCoopStory && s.name && s.who !== "shop" ? HKCoopStory.npcFace(s.name) : "";
      const isNew = s && s.id !== lastSay;
      if (s) lastSay = s.id;
      sayOn = !!s;
      const call = s && (s.call || s.who === "boksun") ? `<em>${HKUI.icon("phone", 10, "currentColor")} 전화</em>` : "";
      return `<div class="ks-news ${s ? "is-say" : ""} ${isNew ? "is-new" : ""} ${s && s.who === "shop" ? "is-shop" : ""}" data-news aria-live="polite">
          <div class="ks-news__tip"><i>?</i><span data-tip>${esc(tipAt(now()))}</span></div>
          <div class="ks-news__say">${s ? `<span class="ks-news__face">${face || `<span class="ks-megaphone">${HKUI.icon("megaphone", 20, "currentColor")}</span>`}</span><div class="ks-news__bub"><span class="ks-news__clamp"><b class="ks-news__who">${esc(s.name || "가게 소식")}${call}</b><span class="ks-news__text">${esc(s.text)}</span></span></div>` : ""}</div>
        </div>`;
    }

    // ---------- 홀 ----------
    function windowHtml() {
      const items = (k.pass || []).filter(known);
      const fresh = items.length > lastPass;
      const shelf = items.map((d, i) => `<button type="button" class="ks-shelf__item ${fresh && i >= lastPass ? "is-new" : ""}" data-toss="${esc(d)}" title="${esc(dishName(d))} — 누르면 버려요" aria-label="${esc(dishName(d))} 버리기">${dishSvg(d)}</button>`).join("");
      const full = items.length >= k.passMax;
      return `<div class="ks-window ${now() < ringUntil ? "is-ring" : ""}" data-spot="pass">
          <div class="ks-window__label"><b><span class="ks-window__ic">${HKUI.icon("concierge-bell", 14, "currentColor")}</span>배식구</b><small class="${full ? "is-full" : ""}">${items.length} / ${k.passMax}${full ? `<em> 꽉 참</em>` : ""}</small></div>
          <div class="ks-window__in"><span class="ks-lamps" aria-hidden="true"><i></i><i></i><i></i></span>
            <div class="ks-shelf">${shelf || `<span class="ks-shelf__empty">${isHall() ? "주방에서 음식이 나오면 여기에 올라와요" : "다 된 음식을 꺼내면 여기에 올라가요"}</span>`}</div>
            <span class="ks-ding">띵! 다 됐대요</span></div></div>`;
    }
    function tableHtml(t, free) {
      const head = (tag) => `<div class="ks-table__top"><span class="ks-table__n">${t.n + 1}</span><span class="ks-table__tag">${tag}</span></div>`;
      const spot = `data-spot="t${t.n}"`;
      if (t.s === "empty") {
        return `<div class="ks-table is-empty" ${spot}>${head("빈 자리")}
            <div class="ks-table__mid"><div class="ks-table__stage"><div class="ks-chair"></div><div class="ks-desk"></div></div><div class="ks-table__bub is-blank"></div></div>
            <div class="ks-hint">${free && k.queue.length ? "손님을 안내해요" : ""}</div></div>`;
      }
      if (t.s === "dirty") {
        return `<div class="ks-table is-dirty" ${spot}>${head("다 먹은 그릇")}
            <div class="ks-table__mid"><div class="ks-table__stage"><div class="ks-chair"></div><div class="ks-desk"><div class="ks-desk__on is-dirty">${dishSvg("tteok")}</div><span class="ks-crumbs"></span></div></div><div class="ks-table__bub is-blank"></div></div>
            <button type="button" class="ks-btn is-clean ${busy.has(`clean:${t.n}`) ? "is-busy" : ""}" data-clean="${t.n}">${HKUI.icon("sparkles", 15, "currentColor")} 치우기</button></div>`;
      }
      const star = t.vip ? `<span class="ks-star">★${t.who ? "" : " 단골"}</span>` : "";
      if (t.s === "eat") {
        return `<div class="ks-table is-eat ${t.vip ? "is-vip" : ""}" ${spot}>${star}${head(t.name ? esc(t.name) : "냠냠 먹는 중")}
            <div class="ks-table__mid"><div class="ks-table__stage">${guestSvg(t, { mood: "eat" })}<div class="ks-desk"><div class="ks-desk__on">${(t.items || []).filter(known).map((d) => dishSvg(d)).join("")}</div></div></div><div class="ks-table__bub is-say">맛있어요!</div></div>
            ${bar(t.eatEnd - (k.eatSec || 4), t.eatEnd, "fill", "is-eat")}<div class="ks-eatlabel">${won(t.pay)}${t.tip ? `<small>팁 ${won(t.tip)}</small>` : ""}</div></div>`;
      }
      const st = passMarks(t.items || []);
      const ready = st.length && st.every((x) => x === "ok");
      const key = `t${t.n}`;
      const btn = ready
        ? `<button type="button" class="ks-btn is-go ${busy.has(`serve:${key}`) ? "is-busy" : ""}" data-serve="${key}">${HKUI.icon("hand-platter", 15, "currentColor")} 서빙</button>`
        : !t.sent
          ? `<button type="button" class="ks-btn is-send ${busy.has(`send:${key}`) ? "is-busy" : ""}" data-send="${key}">${HKUI.icon("send", 14, "currentColor")} 주문 전달</button>`
          : `<div class="ks-sent">${HKUI.icon("check", 14, "currentColor")} 전달함</div>`;
      return `<div class="ks-table is-wait ${ready ? "is-ready" : ""} ${t.vip ? "is-vip" : ""}" ${spot}>${star}${head(t.name ? esc(t.name) : t.vip ? "단골손님" : "주문했어요")}
          <div class="ks-table__mid"><div class="ks-table__stage"><span ${moodAttrs(t)} data-cu>${guestSvg(t, { mood: moodOf(ratioOf(t)) })}</span><div class="ks-desk"></div></div><div class="ks-table__bub">${itemsHtml(t.items, st)}</div></div>
          ${bar(t.until - t.pat, t.until, "left")}${btn}</div>`;
    }
    function hallHtml() {
      const free = k.tables.some((t) => t.s === "empty");
      const queue = k.queue.map((q) => {
        const isNew = !seenGuests.has(`q${q.id}`) && !firstPaint;
        seenGuests.add(`q${q.id}`);
        const label = q.name ? esc(q.name) : `${q.size}개 주문`;
        return `<button type="button" class="ks-guest ${q.vip ? "is-vip" : ""} ${isNew ? "is-new" : ""}" data-seat="${q.id}" ${free ? "" : "disabled"} aria-label="${q.vip ? "단골 " : ""}손님 자리 안내">
            ${q.vip ? `<span class="ks-star">★ 단골</span>` : ""}
            <span ${moodAttrs(q)} data-cu>${guestSvg(q, { mood: moodOf(ratioOf(q)) })}</span>
            <span class="ks-guest__cnt">${label}</span><span class="ks-guest__go">${free ? "눌러서 안내" : "자리 없음"}</span>
            ${bar(q.until - q.pat, q.until, "left")}</button>`;
      }).join("");
      const counter = k.counter.map((c) => {
        if (c.s !== "wait") return `<div class="ks-slot" data-spot="c${c.n}">포장 손님<br>자리</div>`;
        const st = passMarks(c.items || []);
        const ready = st.length && st.every((x) => x === "ok");
        const key = `c${c.n}`;
        const btn = ready
          ? `<button type="button" class="ks-btn is-go ${busy.has(`give:${key}`) ? "is-busy" : ""}" data-give="${key}">${HKUI.icon("shopping-bag", 15, "currentColor")} 건네기</button>`
          : !c.sent
            ? `<button type="button" class="ks-btn is-send ${busy.has(`send:${key}`) ? "is-busy" : ""}" data-send="${key}">${HKUI.icon("send", 14, "currentColor")} 전달</button>`
            : `<div class="ks-sent">${HKUI.icon("check", 14, "currentColor")} 전달함</div>`;
        const isNew = !seenGuests.has(`c${c.id}`) && !firstPaint;
        seenGuests.add(`c${c.id}`);
        return `<div class="ks-togo ${ready ? "is-ready" : ""} ${isNew ? "is-walk" : ""}" data-spot="c${c.n}"><span class="ks-togo__tag">포장 ${c.n + 1}</span>
            <div class="ks-togo__row"><span ${moodAttrs(c)} data-cu>${guestSvg(c, { togo: true, mood: moodOf(ratioOf(c)) })}</span>${itemsHtml(c.items, st)}</div>${bar(c.until - c.pat, c.until, "left")}${btn}</div>`;
      }).join("");
      return `<div class="ks-scene ks-scene--hall">
          ${windowHtml()}
          <div class="ks-tables" aria-label="테이블">${k.tables.map((t) => tableHtml(t, free)).join("")}</div>
          <div class="ks-front">
            <div class="ks-panel ks-door" data-spot="queue"><h3>${HKUI.icon("door-open", 15, "currentColor")} 줄 선 손님<small>${k.queue.length} / ${k.queueMax}</small></h3>
              <div class="ks-queue">${queue || `<div class="ks-empty">기다리는 손님이 없어요</div>`}</div></div>
            <div class="ks-panel"><h3>${HKUI.icon("shopping-bag", 15, "currentColor")} 포장대<small>자리 안 써요</small></h3><div class="ks-counter">${counter}</div></div>
          </div>
        </div>`;
    }

    // ---------- 주방 ----------
    function burnerPhase(b, t = now()) {
      if (!b) return "empty";
      if (b.burnt || t >= b.burn) return "burn";
      if (t < b.done) return "cook";
      return t >= b.burn - 2 ? "warn" : "done";
    }
    function needs() {
      // 주문서에서 아직 배식구 · 화구 · 김밥말이에 없는 음식(급한 것 먼저)
      const mk = marks(k.tickets);
      const out = [];
      [...k.tickets].sort((a, b) => a.until - b.until).forEach((tk) => (mk.get(tk) || []).forEach((m, i) => { if (!m) out.push(tk.items[i]); }));
      return out;
    }
    function kitchenHtml() {
      const mk = marks(k.tickets);
      const need = needs();
      const tickets = k.tickets.map((tk) => {
        const st = mk.get(tk) || [];
        const ready = st.length && st.every((x) => x === "ok");
        const isNew = !seenTickets.has(tk.where + tk.until) && !firstPaint;
        seenTickets.add(tk.where + tk.until);
        const urgent = ratioOf(tk) < 0.3;
        return `<div class="ks-ticket ${tk.togo ? "is-togo" : ""} ${tk.vip ? "is-vip" : ""} ${ready ? "is-ready" : ""} ${urgent ? "is-urgent" : ""} ${isNew ? "is-new" : ""}" ${moodAttrs(tk)} data-ticket>
            <div class="ks-ticket__head">${tk.togo ? HKUI.icon("shopping-bag", 13, "currentColor") : ""}${esc(tk.label)}${tk.vip ? `<span class="ks-star">★ 단골</span>` : ""}</div>
            ${itemsHtml(tk.items, st)}${bar(tk.until - tk.pat, tk.until, "left")}${ready ? `<div class="ks-ticket__ready">다 나왔어요 · 벨!</div>` : ""}</div>`;
      }).join("");
      const allReady = k.tickets.some((tk) => (mk.get(tk) || []).every((x) => x === "ok"));
      const burners = k.burners.map((b, i) => {
        const ph = burnerPhase(b);
        const isBusy = busy.has(`b${i}`);
        if (ph === "empty") {
          const pick = DISHES.filter((d) => k.menu[d] && k.menu[d].cook).map((d) => `<button type="button" class="${need.includes(d) ? "is-need" : ""}" data-cook="${i}:${d}" aria-label="${esc(dishName(d))} 올리기">${dishSvg(d)}${esc(dishName(d))}</button>`).join("");
          return `<div class="ks-burner is-empty ${isBusy ? "is-busy" : ""}" data-spot="b${i}"><div class="ks-burner__ring" style="--p:0"><div class="ks-burner__pot is-empty"></div></div>
              <div class="ks-burner__label">${i + 1}번 화구 · 비었어요</div><div class="ks-pick">${pick}</div></div>`;
        }
        const label = { cook: `${esc(dishName(b.dish))} 끓는 중`, done: "다 됐어요! 꺼내요", warn: "곧 타요! 빨리!", burn: "타 버렸어요" }[ph];
        const btn = ph === "cook"
          ? `<button type="button" class="ks-btn is-wait" disabled>${Math.max(0, Math.ceil(b.done - now()))}초 남았어요</button>`
          : ph === "burn"
            ? `<button type="button" class="ks-btn is-trash" data-take="${i}">${HKUI.icon("trash-2", 14, "currentColor")} 버리기</button>`
            : `<button type="button" class="ks-btn is-go" data-take="${i}">${HKUI.icon("arrow-up-from-line", 14, "currentColor")} 꺼내기</button>`;
        const p = ph === "cook" ? Math.max(0, Math.min(1, (now() - b.start) / (b.done - b.start))) : ph === "burn" ? 1 : Math.max(0, Math.min(1, 1 - (now() - b.done) / (b.burn - b.done)));
        return `<div class="ks-burner is-${ph} ${isBusy ? "is-busy" : ""}" data-spot="b${i}" data-burner="${i}" data-start="${b.start}" data-done="${b.done}" data-burnat="${b.burn}">
            <div class="ks-burner__ring" style="--p:${p.toFixed(3)}"><div class="ks-steam"><i></i><i></i><i></i></div><div class="ks-burner__pot">${dishSvg(b.dish)}</div>${ph !== "burn" ? `<div class="ks-flames"><i></i><i></i><i></i></div>` : ""}</div>
            <div class="ks-burner__label">${label}</div>${btn}</div>`;
      }).join("");
      const g = k.gimbap;
      const step = g.step;
      const mat = `<svg viewBox="0 0 120 56" aria-hidden="true">${step === 3
          ? `<rect x="10" y="16" width="100" height="26" rx="13" fill="#14532d"/><path d="M18 20h84" stroke="#166534" stroke-width="2"/><ellipse cx="110" cy="29" rx="6" ry="12" fill="#fff"/><circle cx="110" cy="27" r="2.4" fill="#f59e0b"/><circle cx="110" cy="33" r="2" fill="#16a34a"/>`
          : `<rect x="6" y="4" width="108" height="48" rx="3" fill="#14532d"/>${step >= 1 ? `<rect x="10" y="12" width="100" height="36" rx="3" fill="#fff"/>` : ""}${step >= 2 ? `<g stroke-width="5" stroke-linecap="round"><path d="M18 22h84" stroke="#f59e0b"/><path d="M18 29h84" stroke="#16a34a"/><path d="M18 36h84" stroke="#f97316"/><path d="M18 43h84" stroke="#fda4af"/></g>` : ""}`}</svg>`;
      const needG = need.includes("gimbap");
      return `<div class="ks-scene ks-scene--kitchen">
          <div class="ks-panel ks-rail"><h3>${HKUI.icon("clipboard-list", 15, "currentColor")} 주문서<small class="${k.waiting ? "is-wait" : ""}">${k.waiting ? `홀에 전달 안 된 손님 ${k.waiting}명` : "홀이 전달한 주문만 보여요"}</small></h3>
            <div class="ks-tickets">${tickets || `<div class="ks-empty" style="grid-column:1/-1">아직 들어온 주문이 없어요</div>`}</div></div>
          <div class="ks-line">
            <div class="ks-stove"><h3>${HKUI.icon("flame", 15, "currentColor")} 화구<small>다 익고 ${k.burnSec}초 지나면 타요</small></h3><div class="ks-burners">${burners}</div></div>
            <div class="ks-side">
              <div class="ks-panel ks-gimbap"><h3>${HKUI.icon("hand", 15, "currentColor")} 김밥 말기${needG ? `<small style="color:#c2410c">필요해요!</small>` : ""}</h3>
                <div class="ks-mat" data-mat>${mat}</div><div class="ks-dots">${g.steps.map((_, i) => `<i class="${i < step ? "is-on" : ""}"></i>`).join("")}</div>
                <button type="button" class="ks-btn" data-roll>${esc(g.steps[step] || "")}<em class="ks-q" ${rollQ ? "" : "hidden"}>+${rollQ}</em></button></div>
              <button type="button" class="ks-bell ${allReady ? "is-hint" : ""}" data-bell aria-label="벨 울려 홀 부르기">${bellSvg()}<span>벨 띵!<small>다 되면 홀을 불러요</small></span></button>
            </div>
          </div>
          ${windowHtml()}
        </div>`;
    }

    function feedHtml() {
      const ic = { pay: "🪙", miss: "💢", burn: "🔥", say: "📞" };
      // 사장님 전화만 전화 그림 — 문 반장님 말 · 가게 소식은 말풍선
      const icon = (l) => (l.kind === "say" && !String(l.text).includes("(전화)") ? "💬" : ic[l.kind] || "·");
      const items = (k.log || []).slice().reverse().map((l) => `<li class="is-${esc(l.kind || "")}"><i aria-hidden="true">${icon(l)}</i><span>${esc(l.text)}</span></li>`).join("");
      return `<div class="er-card"><h2>${HKUI.icon("store", 16, "currentColor")} 가게 소식</h2>${items ? `<ul class="ks-feed">${items}</ul>` : `<div style="font-size:13px;color:var(--text-muted)">아직 소식이 없어요</div>`}</div>`;
    }

    // ---------- 효과(떠다니는 글자 · 번쩍임) ----------
    function fxLayer() {
      let el = document.getElementById("ks-fx");
      if (!el) { el = document.createElement("div"); el.id = "ks-fx"; document.body.appendChild(el); }
      return el;
    }
    // 떠다니는 글자 — 그 자리가 화면 밖이면 back 자리(위에 붙은 머리 칸의 하트 · 매출)에, 그것도 없으면 화면 위쪽 가운데에 띄운다
    function float(spot, html, cls, dy = 0, back = "money") {
      if (reduced()) return;
      const top = stickTop();
      const hud = document.querySelector("[data-hud]");
      const hudBottom = hud ? hud.getBoundingClientRect().bottom : top;
      // 글자가 뜰 자리가 보이는지 — 위에 붙은 머리 칸 아래(머리 칸 안의 자리는 그 칸 안)부터 화면 아래까지
      const seen = (el) => {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        const y = r.top + Math.min(r.height * 0.35, 60);
        const minTop = hud && hud.contains(el) ? top : Math.max(top, hudBottom);
        return r.height && y > minTop + 8 && y < innerHeight - 24 ? r : null;
      };
      const r = seen(document.querySelector(`[data-spot="${spot}"]`)) || seen(document.querySelector(`[data-spot="${back}"]`));
      const el = document.createElement("div");
      el.className = `ks-float ${cls}`;
      el.innerHTML = html;
      if (r) {
        el.style.left = `${r.left + r.width / 2 + scrollX}px`;
        el.style.top = `${r.top + Math.min(r.height * 0.35, 60) + scrollY + dy}px`;
      } else {
        el.style.left = `${innerWidth / 2 + scrollX}px`;
        el.style.top = `${top + 70 + scrollY}px`;
      }
      fxLayer().appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
    function flash(kind = "") {
      if (reduced()) return;
      const el = document.createElement("div");
      el.id = "ks-flash";
      if (kind) el.className = `is-${kind}`;
      document.getElementById("ks-flash")?.remove();
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }
    function pulse(sel, cls, ms = 600) {
      const el = document.querySelector(sel);
      if (!el) return;
      el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), ms);
    }
    // 새 효과 알림 하나 — 소리와 그림. sfx 는 한 번에 들어온 효과들 사이에서 같은 소리를 한 번만 낸다
    function runFx(e, sfx, show) {
      const hall = isHall();
      if (e.k === "pay") {
        if (show) float(hall ? e.where : "money", `+${won(e.amount)}${e.tip ? `<small>팁 ${won(e.tip)}</small>` : ""}`, "is-coin");
        pulse(".ks-money", "is-bump", 500);
        sfx("coin");
      } else if (e.k === "combo") {
        if (show) float("combo", `콤보 ${e.n}! ×${String(e.mult).replace(/0+$/, "").replace(/\.$/, "")}`, "is-combo", 10);
        pulse(".ks-combo", "is-pop", 600);
        sfx("combo", Math.min(10, e.n));
      } else if (e.k === "break") {
        if (show) float("combo", `콤보 ${e.n} 끊겼어요`, "is-break", 10);
        sfx("invalid");
      } else if (e.k === "miss") {
        if (show) float(hall ? (e.where === "counter" ? "queue" : e.where) : "hearts", "♥ −1 손님을 놓쳤어요", "is-miss", 0, "hearts");
        pulse(".ks-hearts", "is-hurt", 500);
        flash("miss");
        sfx("hurt");
      } else if (e.k === "burn") {
        if (!hall && show) float(`b${e.burner}`, "타 버렸어요…", "is-break", 0, "combo");
        sfx("fail");
      } else if (e.k === "bell") {
        if (hall) { ringUntil = now() + 1.2; pulse(".ks-window", "is-ring", 1000); if (show) float("pass", "띵!", "is-bell", -10); flash(); sfx("success"); }
      } else if (e.k === "arrive") {
        if (hall) sfx(e.vip ? "powerup" : "pop");
      } else if (e.k === "ticket") {
        if (!hall) sfx("pop");
      }
    }
    // 서버의 새 효과 — 처음 보는 id 이면서 방금(FX_FRESH 초 안) 일어난 것만. 오래된 건 본 것으로 치고 넘긴다
    function takeFx(next) {
      const list = (next && next.ev) || [];
      const max = list.reduce((m, e) => Math.max(m, e.id), 0);
      if (lastEv < 0) { lastEv = max; return; } // 처음 들어올 때는 지난 효과를 다시 보여 주지 않는다
      const t = Number(next.now) || now();
      list.filter((e) => e.id > lastEv && t - e.at <= FX_FRESH).forEach((e) => fxQ.push(e));
      lastEv = Math.max(lastEv, max);
      if (next.say && next.say.id > lastSay && t - next.say.at < 2) fxQ.push({ k: "say", id: next.say.id, who: next.say.who });
    }

    // ---------- 0.1초마다 — 막대 · 기분 · 화구 · 소식 · 머리 칸(붙음 · 시계 · 러시) · 마지막 5초 ----------
    function tick(ctx) {
      if (!room || room.status !== "PLAYING" || !k) return;
      const t = now();
      document.querySelectorAll(".ks-bar[data-from]").forEach((el) => {
        const from = Number(el.dataset.from), to = Number(el.dataset.to);
        let f = Math.max(0, Math.min(1, (t - from) / Math.max(0.01, to - from)));
        if (el.dataset.mode === "left") f = 1 - f;
        el.firstChild.style.width = `${(f * 100).toFixed(1)}%`;
        if (el.dataset.mode === "left") { el.classList.toggle("is-warn", f < 0.5 && f >= 0.25); el.classList.toggle("is-bad", f < 0.25); }
      });
      document.querySelectorAll("[data-cu][data-until]").forEach((el) => {
        const m = moodOf(Math.max(0, Math.min(1, (Number(el.dataset.until) - t) / Number(el.dataset.pat || 1))));
        const svg = el.firstElementChild;
        if (svg && svg.dataset.mood !== m) svg.dataset.mood = m;
      });
      document.querySelectorAll("[data-ticket][data-until]").forEach((el) => {
        el.classList.toggle("is-urgent", (Number(el.dataset.until) - t) / Number(el.dataset.pat || 1) < 0.3);
      });
      document.querySelectorAll(".ks-burner[data-burner]").forEach((el) => {
        const s = Number(el.dataset.start), d = Number(el.dataset.done), bu = Number(el.dataset.burnat);
        const p = t < d ? (t - s) / (d - s) : t < bu ? 1 - (t - d) / (bu - d) : 1;
        el.querySelector(".ks-burner__ring").style.setProperty("--p", Math.max(0, Math.min(1, p)).toFixed(3));
        const w = el.querySelector(".ks-btn.is-wait");
        if (w && t < d) w.textContent = `${Math.max(0, Math.ceil(d - t))}초 남았어요`;
      });
      // 소식 줄 — 사장님 말이 끝나면 도움말로(다시 그리지 않고 칸만 바꾼다 · 높이는 그대로)
      const news = document.querySelector("[data-news]");
      if (news) {
        const on = !!sayActive(t);
        if (on !== sayOn) { sayOn = on; news.classList.toggle("is-say", on); news.classList.remove("is-new"); }
        const ti = Math.floor(Math.max(0, t - k.start) / 9);
        if (ti !== lastTip) { lastTip = ti; const el = news.querySelector("[data-tip]"); if (el) el.textContent = tipAt(t); }
      }
      // 머리 칸 — 화면 위에 붙었는지(위 막대 시계가 가려지면 머리 칸에 남은 시간을 보인다) · 러시 띠 · 시계
      const hud = document.querySelector("[data-hud]");
      if (hud) {
        const top = stickTop();
        const ks = hud.parentElement;
        if (ks && ks.style.getPropertyValue("--ks-stick") !== `${top}px`) ks.style.setProperty("--ks-stick", `${top}px`);
        const timer = document.getElementById("er-timer");
        const isStuck = timer ? timer.getBoundingClientRect().bottom < top + 4 : hud.getBoundingClientRect().top <= top + 1;
        if (isStuck !== stuck) { stuck = isStuck; hud.classList.toggle("is-stuck", isStuck); }
        const rush = inRush(t);
        if (hud.classList.contains("is-rush") !== rush) hud.classList.toggle("is-rush", rush);
        if (rush) { const el = hud.querySelector("[data-rush-left]"); const txt = `${Math.ceil(k.rush.end - t)}초`; if (el && el.textContent !== txt) el.textContent = txt; }
        const clock = hud.querySelector("[data-clock]");
        if (clock) {
          const left = Math.max(0, k.end - t);
          const txt = mmss(left);
          if (clock.textContent !== txt) clock.textContent = txt;
          clock.parentElement.classList.toggle("is-low", left < 30);
        }
      }
      // 화구 단계가 바뀌면(다 익음 · 곧 탐 · 탐) 다시 그리고 알린다
      if (k.burners) {
        const ps = k.burners.map((b) => burnerPhase(b, t));
        const p = ps.join(",");
        if (p !== phases) {
          const before = phases.split(",");
          phases = p;
          ps.forEach((ph, i) => {
            if (before[i] === "cook" && (ph === "done" || ph === "warn")) ctx.sfx("select");
          });
          ctx.paint();
        }
        const warnKey = ps.map((ph, i) => (ph === "warn" ? `${i}:${Math.ceil(k.burners[i].burn - t)}` : "")).join(",");
        if (warnKey !== lastWarn) { if (/\d:\d/.test(warnKey)) ctx.sfx("tick"); lastWarn = warnKey; }
      }
      // 마지막 5초
      const left = Math.ceil(k.end - t);
      if (left <= 5 && left >= 1 && left !== lastCount) { lastCount = left; ctx.sfx("countdown"); }
      if (k.nextAt && t >= k.nextAt + 0.05 && tickFor !== k.nextAt) {
        tickFor = k.nextAt;
        HKApi.coopTick(room.id).then((next) => { if (fresher(next)) ctx.set(next); }).catch(() => { tickFor = null; });
      }
    }

    // ---------- 보내기 — 같은 버튼을 빠르게 두 번 눌러도 한 번만 ----------
    const ACT_SFX = { seat: "select", send: "swap", serve: "tap", clean: "whoosh", cook: "sizzle", take: "drop", bell: "select", toss: "drop" };
    const SEND_GAP = 170; // ms — 서버의 연타 막기(같은 사람 0.15초)보다 조금 길게
    async function doAct(ctx, action, arg, key, el) {
      if (busy.has(key)) return;
      busy.add(key);
      if (el) el.classList.add("is-busy");
      const before = k;
      try {
        lastSend = Date.now();
        const next = await HKApi.coopAct(room.id, action, arg);
        if (action === "roll") { const nk = next.kitchen; ctx.sfx(nk && nk.gimbap && nk.gimbap.step === 0 && before && before.gimbap && before.gimbap.step > 0 ? "pop" : "tap"); }
        else if (action === "take") { const b = before && before.burners && before.burners[arg]; ctx.sfx(b && burnerPhase(b) === "burn" ? "invalid" : "drop"); }
        else if (ACT_SFX[action]) ctx.sfx(ACT_SFX[action]);
        if (action === "bell") pulse(".ks-bell", "is-ring", 700);
        busy.delete(key);
        if (fresher(next)) ctx.set(next); else ctx.paint();
        if (action === "roll") pulse("[data-mat]", "is-step", 300);
        if (next.stamp && next.stamp.new) HKUI.toast(`오늘 도장을 받았어요 (${next.stamp.count}/${next.stamp.goal})`);
        return true;
      } catch (e) {
        busy.delete(key);
        if (el) el.classList.remove("is-busy");
        if (e.code === "ESCAPE_TOO_FAST") return "fast"; // 연타 — 조용히
        ctx.sfx("invalid");
        HKUI.toast(e.message || "할 수 없어요", "error");
        if (["KITCHEN_GONE", "ESCAPE_NOT_PLAYING"].includes(e.code)) ctx.refresh();
        return false;
      }
    }
    // 김밥 말기 — 빠르게 여러 번 눌러도 사라지지 않게 눌린 횟수를 세어 두었다가 하나씩 보낸다(한 줄 = 단계 수만큼까지)
    function rollBadge() {
      const el = document.querySelector("[data-roll] .ks-q");
      if (el) { el.textContent = `+${rollQ}`; el.hidden = !rollQ; }
    }
    function queueRoll(ctx) {
      const steps = (k && k.gimbap && k.gimbap.steps.length) || RULES.gimbapSteps;
      if (rollQ >= steps) return;
      rollQ += 1;
      rollBadge();
      pumpRoll(ctx);
    }
    async function pumpRoll(ctx) {
      if (rollBusy || !rollQ) return;
      rollBusy = true;
      let tries = 0;
      while (rollQ > 0 && room && room.status === "PLAYING") {
        const wait = SEND_GAP - (Date.now() - lastSend);
        if (wait > 0) await new Promise((res) => setTimeout(res, wait));
        const ok = await doAct(ctx, "roll", null, "roll");
        if (ok === "fast" && tries < 3) { tries += 1; continue; } // 연타 막기에 걸리면 조금 뒤 다시
        tries = 0;
        if (ok !== true) { rollQ = 0; break; } // 배식구가 꽉 찼거나 끝남 — 남은 탭은 버린다
        rollQ -= 1;
        rollBadge();
      }
      rollQ = Math.max(0, rollQ);
      rollBadge();
      rollBusy = false;
    }

    // ---------- 대기실 — 내 할 일 · 이렇게 해요 ----------
    function readyNote(ctx) {
      const hall = ctx.room.sideName === "홀";
      const g = { id: 3, vip: false };
      const steps = hall
        ? [[guestSvg(g, { mood: "0" }), "안내", "줄 선 손님을 눌러 자리에"], [`<span style="display:grid;place-items:center;width:34px;height:34px;color:#c2410c">${HKUI.icon("send", 22, "currentColor")}</span>`, "전달", "주문을 주방에 알려요"], [dishSvg("tteok"), "서빙", "음식이 다 ✓ 이면"], [`<span style="display:grid;place-items:center;width:34px;height:34px;color:#0369a1">${HKUI.icon("sparkles", 22, "currentColor")}</span>`, "치우기", "다 먹은 자리를 비워요"]]
        : [[`<span style="display:grid;place-items:center;width:34px;height:34px;color:#c2410c">${HKUI.icon("clipboard-list", 22, "currentColor")}</span>`, "주문서", "홀이 전달한 것만 보여요"], [dishSvg("ramen"), "끓이기", "화구에 올리고 다 익으면 꺼내요"], [dishSvg("gimbap"), "김밥", `버튼 ${RULES.gimbapSteps}번으로 말아요`], [`<span style="display:grid;place-items:center;width:34px;height:34px">${bellSvg()}</span>`, "벨", "다 되면 띵! 홀을 불러요"]];
      return `<div class="ks-role__head"><b>나는 ${esc(ctx.room.sideName || "")}</b> — ${hall ? "손님과 주방 사이를 바쁘게 오가요. 주방은 주문을 못 보니 꼭 전달해 줘요." : "주문을 직접 못 봐요. 홀이 전달한 주문서를 보고 만들어요."}</div>
        <ol class="ks-flow">${steps.map(([ic, b, s]) => `<li>${ic}<span><b>${b}</b><small>${s}</small></span></li>`).join("")}</ol>`;
    }
    function readyExtra(ctx) {
      // 화면 시계는 남은 시간을 거꾸로 센다 — 러시가 시작하는 때를 그 시계로 말한다(3분 판이면 1분 25초)
      const limit = (ctx && ctx.room && ctx.room.limitSec) || 180;
      const r = Math.max(0, limit - RULES.rushAt);
      const rushLeft = `${Math.floor(r / 60) ? `${Math.floor(r / 60)}분 ` : ""}${r % 60 ? `${r % 60}초` : ""}`.trim();
      const rules = [
        ["#fef9c3", "#a16207", "★", "단골손님", "1.5배를 내지만 금방 가요"],
        ["#ede9fe", "#6d28d9", HKUI.icon("shopping-bag", 15, "currentColor"), "포장", "전달하고 나오면 포장대에서 건네요"],
        ["#ffedd5", "#c2410c", "×2", "콤보", "빨리 내면 팁이 최대 2배"],
        ["#fef3c7", "#b45309", HKUI.icon("bell-ring", 15, "currentColor"), "벨", "다 되면 주방이 띵!"],
        ["#fee2e2", "#dc2626", HKUI.icon("zap", 15, "currentColor"), "점심 러시", `남은 시간 ${rushLeft}쯤 몰려와요`],
        ["#fce7f3", "#db2777", `♥${RULES.hearts}`, `하트 ${RULES.hearts}개`, "다 잃으면 문을 닫아요"],
      ];
      return `<div class="ks-how"><h4>${HKUI.icon("lightbulb", 16, "currentColor")} 이렇게 해요</h4><ul class="ks-rules">${rules.map(([bg, fg, ic, b, s]) => `<li><i style="background:${bg};color:${fg}">${ic}</i><span><b>${b}</b>${s}</span></li>`).join("")}</ul></div>`;
    }

    // ---------- 끝 ----------
    function tierOf(r) {
      if (!r || r.status !== "CLEAR" || r.end === "HEARTS" || !(Number(r.score) > 0)) return "fail";
      return Number(r.score) >= GREAT ? "great" : "ok";
    }
    function endCard() {
      const kk = room.kitchen || {};
      const tier = tierOf(room);
      const hearts = room.end === "HEARTS";
      const title = hearts ? "가게 문을 일찍 닫았어요" : tier === "great" ? "대박 영업이에요!" : tier === "ok" ? "영업 끝!" : "영업 끝";
      const msg = hearts
        ? "손님을 너무 많이 놓쳤어요. 다음엔 더 크게 말해 봐요!"
        : tier === "great" ? "사장님보다 많이 팔았어요. 단골 단톡방이 들썩여요!"
          : tier === "ok" ? "손님들이 맛있게 먹고 갔어요. 둘이 손발이 척척!"
            : "아직 한 그릇도 못 팔았어요. 다시 해 봐요!";
      const art = tier === "great" ? `${dishSvg("tteok")}${coinSvg()}${dishSvg("ramen")}` : tier === "ok" ? `${dishSvg("gimbap")}${dishSvg("tteok")}${dishSvg("odeng")}` : `${dishSvg("odeng")}`;
      return `<div class="er-end is-kitchen is-${tier} ${tier === "fail" ? "is-low" : ""}">
          <div class="ks-endart">${art}</div>
          <h2>${title}</h2><p>${msg}</p>
          <div class="er-end__time">${won(room.score)}</div>
          <div class="ks-endsub">${kk.tips ? `<span>팁 ${won(kk.tips)}</span>` : ""}${known(kk.today) ? `<span>오늘의 메뉴 ${esc(dishName(kk.today))}</span>` : ""}<span>남은 하트 ${kk.hearts ?? 0}개</span></div>
        </div>`;
    }

    HKCoop.mount({
      room: "lunch",
      listName: "분식집 목록",
      heroClass: "is-kitchen",
      wide: true,
      tickMs: 100,
      hero: { facts: ["2인 협동", "3분 영업", "홀 · 주방", "단골 · 포장 · 콤보", "끝까지 하면 오늘 도장"], note: "주방은 주문을 직접 볼 수 없어요. 홀이 주문을 전달하고, 주방은 다 된 음식을 배식구에 올리고 벨을 울려요. 서로 말로 알려 주면 매출이 쑥쑥 올라요." },
      rankTitle: "매출 순위",
      rankNote: "같은 두 사람은 가장 높은 매출 한 판만 올라요.",
      rankText: (x) => won(x.score),
      recentText: (r) => (r.status === "CLEAR" ? (r.end === "HEARTS" ? [`일찍 닫음 · ${won(r.score)}`, "is-fail"] : [`매출 ${won(r.score)}`, "is-clear"]) : ["포기", "is-fail"]),
      failTitle: "영업 중단",
      quick: ["주문 들어가요!", "단골 왔어요 ★", "포장 하나요", "떡볶이 빨리요", "다 됐어요, 벨!", "배식구 확인해요", "잠깐만요"],
      remain: () => (k ? k.end - now() : null),
      timerNote: () => "영업 남은 시간",
      readyNote,
      readyExtra,
      reset: () => { tickFor = null; phases = ""; lastEv = -1; fxQ = []; lastSay = 0; seenTickets = new Set(); seenGuests = new Set(); lastPass = 0; firstPaint = true; busy.clear(); rollQ = 0; stuck = null; },
      changed: (prev, next) => {
        room = next;
        const nk = next.kitchen || null;
        if (prev && prev.id === next.id && nk) takeFx(nk);
        else if (nk) { lastEv = (nk.ev || []).reduce((m, e) => Math.max(m, e.id), 0); lastSay = nk.say ? nk.say.id : 0; }
        k = nk;
        if (k) offset = k.now * 1000 - Date.now();
      },
      painted: (ctx) => {
        if (room && room.status === "PLAYING" && k) {
          lastPass = (k.pass || []).length;
          firstPaint = false;
          const ks = document.querySelector(".ks");
          if (ks) ks.style.setProperty("--ks-stick", `${stickTop()}px`);
          // 한 번에 들어온 효과들 — 같은 소리는 한 번만, 떠다니는 글자는 마지막 몇 개만
          const list = fxQ.splice(0);
          const played = new Set();
          const sfx = (name, arg) => { if (played.has(name)) return; played.add(name); ctx.sfx(name, arg); };
          const floats = list.filter((e) => ["pay", "combo", "break", "miss", "burn", "bell"].includes(e.k));
          list.forEach((e) => { if (e.k === "say") sfx("whoosh"); else runFx(e, sfx, floats.indexOf(e) >= floats.length - FX_MAX); });
        } else { fxQ = []; rollQ = 0; }
      },
      play: () => (k ? `<div class="er-card ks">${hudHtml()}${newsHtml()}${isHall() ? hallHtml() : kitchenHtml()}</div>` : ""),
      side: () => (k ? feedHtml() : ""),
      end: () => endCard(),
      failEnd: () => {
        const kk = room.kitchen || {};
        return `<div class="er-end is-fail"><div class="ks-endart">${dishSvg("odeng")}</div><h2>영업 중단</h2>
            <p>${room.end === "LEFT" ? "한 사람이 가게를 나가서 영업을 멈췄어요." : room.end === "TIMEOUT" ? "시간이 다 됐어요." : "포기해서 가게 문을 잠시 닫았어요."}</p>
            ${kk.money ? `<div class="ks-endsub"><span>그때까지 매출 ${won(kk.money)}</span><span>손님 ${kk.served || 0}명</span></div>` : ""}</div>`;
      },
      stats: () => {
        const kk = room.kitchen || {};
        if (!room.kitchen) return [];
        return [
          { label: "손님", value: `${kk.served || 0}명` },
          { label: "최고 콤보", value: `${kk.bestCombo || 0}` },
          { label: "★ 단골", value: `${kk.vip || 0}명` },
          { label: "포장", value: `${kk.togo || 0}건` },
          { label: "놓친 손님", value: `${kk.missed || 0}명` },
          { label: "탄 음식", value: `${kk.burnt || 0}개` },
        ];
      },
      storyTier: (ctx) => tierOf(ctx.room),
      tick,
      click: async (t, ctx) => {
        const d = t.dataset;
        if (!room || room.status !== "PLAYING") return;
        if (d.seat) return doAct(ctx, "seat", Number(d.seat), `seat:${d.seat}`, t);
        if (d.send) return doAct(ctx, "send", d.send, `send:${d.send}`, t);
        if (d.serve) return doAct(ctx, "serve", d.serve, `serve:${d.serve}`, t);
        if (d.give) return doAct(ctx, "give", d.give, `give:${d.give}`, t);
        if (d.clean) return doAct(ctx, "clean", Number(d.clean), `clean:${d.clean}`, t);
        if (d.cook) { const [b, dish] = d.cook.split(":"); return doAct(ctx, "cook", { burner: Number(b), dish }, `b${b}`, t.closest(".ks-burner")); }
        if (d.take) return doAct(ctx, "take", Number(d.take), `b${d.take}`, t.closest(".ks-burner"));
        if ("roll" in d) return queueRoll(ctx);
        if ("bell" in d) return doAct(ctx, "bell", null, "bell");
        if (d.toss) {
          if (!known(d.toss)) return;
          if (!(await HKUI.confirmDialog(`${dishName(d.toss)}${josa(dishName(d.toss), "을", "를")} 버릴까요?`, "배식구에서 하나를 버려요. 잘못 만든 음식만 버려 주세요.", { confirmLabel: "버리기", confirmVariant: "danger" }))) return;
          return doAct(ctx, "toss", d.toss, `toss:${d.toss}`);
        }
      },
    });

    // PC 마우스 — 누르고 떼는 사이에 실시간 소식(상대가 한 일)으로 방 화면이 통째로 다시 그려지면 눌렀던 버튼이 없어져
    // 브라우저가 click 을 보내지 않는다(분식집은 1초에 두 번쯤 다시 그려져 열 번에 한 번꼴로 눌림이 사라졌다).
    // 뗀 자리에 같은 버튼(data-* 가 같은 것)이 다시 그려져 있으면 그 버튼을 대신 눌러 준다.
    // 터치는 브라우저가 뗀 자리의 버튼에 click 을 보내 주므로 손대지 않는다.
    let press = null;
    const btnSig = (b) => JSON.stringify({ ...b.dataset });
    document.addEventListener("pointerdown", (e) => {
      const b = e.pointerType === "mouse" && e.button === 0 && e.target.closest ? e.target.closest("#er-root button") : null;
      press = b ? { b, sig: btnSig(b), x: e.clientX, y: e.clientY, clicked: false } : null;
    }, true);
    document.addEventListener("click", () => { if (press) press.clicked = true; }, true);
    document.addEventListener("pointerup", (e) => {
      const p = press;
      if (!p || e.pointerType !== "mouse") return;
      setTimeout(() => { // 브라우저가 보낸 click 이 있으면 그걸로 끝
        if (press === p) press = null;
        if (p.clicked || p.b.isConnected || Math.hypot(e.clientX - p.x, e.clientY - p.y) > 8) return;
        const at = document.elementFromPoint(e.clientX, e.clientY);
        const b = at && at.closest ? at.closest("#er-root button") : null;
        if (b && !b.disabled && btnSig(b) === p.sig) b.click();
      }, 0);
    }, true);
  </script>
</body>
</html>
