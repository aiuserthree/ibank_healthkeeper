<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 점심 분식집</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <script src="/_shared/coop.js"></script>
  <style>
    .er-hero.is-kitchen { background: radial-gradient(120% 90% at 85% 0%, #f59e0b 0%, rgba(245, 158, 11, 0) 55%), linear-gradient(160deg, #431407, #9a3412); }
    .ks-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .ks-stat { display: flex; align-items: baseline; gap: 6px; padding: 8px 12px; border-radius: 12px; background: #fff7ed; font-size: 13px; font-weight: 700; color: #9a3412; }
    .ks-stat b { font-size: 18px; color: #431407; font-variant-numeric: tabular-nums; }
    .ks-hearts { letter-spacing: 2px; color: #ef4444; font-size: 16px; }
    .ks-hearts .is-off { color: #fecaca; }
    .ks-sec { margin-top: 14px; }
    .ks-sec:first-child { margin-top: 0; }
    .ks-sec h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 14px; font-weight: 800; color: #475569; }
    .ks-sec h3 small { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .ks-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ks-dish { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 4px; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; font-size: 13px; font-weight: 700; }
    .ks-dish i { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-style: normal; font-size: 11.5px; font-weight: 800; }
    .ks-dish.is-ok { border-color: #86efac; background: #f0fdf4; }
    .ks-dish.is-ok::after { content: "✓"; color: #16a34a; font-weight: 800; }
    .ks-bar { position: relative; height: 6px; margin-top: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
    .ks-bar span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: #22c55e; }
    .ks-bar.is-warn span { background: #f59e0b; }
    .ks-bar.is-bad span { background: #ef4444; }
    .ks-queue { display: flex; gap: 8px; min-height: 76px; }
    .ks-guest { width: 92px; padding: 10px 8px 8px; border: 1.5px solid #fed7aa; border-radius: 14px; background: #fffbeb; text-align: center; font: inherit; cursor: pointer; }
    .ks-guest:hover { border-color: #f59e0b; }
    .ks-guest:disabled { cursor: not-allowed; opacity: .6; }
    .ks-guest b { display: block; font-size: 22px; line-height: 1; }
    .ks-guest small { display: block; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: #92400e; }
    .ks-empty { display: grid; place-items: center; flex: 1; min-height: 70px; border: 1.5px dashed #e2e8f0; border-radius: 14px; font-size: 13px; color: var(--text-muted); }
    .ks-tables { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .ks-table { display: flex; flex-direction: column; min-height: 168px; padding: 12px; border: 1.5px solid var(--border-default); border-radius: 14px; background: #f8fafc; }
    .ks-table__n { font-size: 12px; font-weight: 800; color: #94a3b8; }
    .ks-table__body { flex: 1; margin-top: 6px; }
    .ks-table__state { font-size: 14px; font-weight: 700; color: #64748b; }
    .ks-table .ks-row { gap: 5px; }
    .ks-table .hk-btn { width: 100%; margin-top: 8px; padding-left: 8px; padding-right: 8px; }
    .ks-table.is-wait { border-color: #fdba74; background: #fff; }
    .ks-table.is-ready { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .15); }
    .ks-table.is-dirty { background: #f1f5f9; }
    .ks-sent { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: #16a34a; text-align: center; }
    .ks-pass { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; padding: 8px; border-radius: 12px; background: #fff7ed; border: 1px dashed #fdba74; }
    .ks-pass .ks-dish { padding-right: 4px; }
    .ks-toss { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-left: 2px; padding: 0; border: 0; border-radius: 50%; background: #f1f5f9; color: #64748b; font: inherit; font-size: 12px; cursor: pointer; }
    .ks-tickets { display: flex; flex-direction: column; gap: 8px; }
    .ks-ticket { padding: 10px 12px; border-left: 4px solid #f59e0b; border-radius: 10px; background: #fffbeb; }
    .ks-ticket__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13px; font-weight: 800; }
    .ks-burners { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ks-burner { position: relative; padding: 12px; border-radius: 16px; background: #1f2937; color: #f8fafc; min-height: 150px; }
    .ks-burner__ring { display: grid; place-items: center; width: 64px; height: 64px; margin: 2px auto 8px; border-radius: 50%; border: 5px solid #4b5563; font-size: 13px; font-weight: 800; }
    .ks-burner.is-cook .ks-burner__ring { border-color: #f97316; box-shadow: 0 0 18px rgba(249, 115, 22, .55); }
    .ks-burner.is-done .ks-burner__ring { border-color: #22c55e; box-shadow: 0 0 18px rgba(34, 197, 94, .6); }
    .ks-burner.is-burn .ks-burner__ring { border-color: #111827; background: #111827; color: #9ca3af; }
    .ks-burner__label { text-align: center; font-size: 13px; font-weight: 700; color: #cbd5e1; }
    .ks-burner .ks-bar { background: #374151; }
    .ks-burner__pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .ks-burner__pick button, .ks-burner__go { padding: 9px 4px; border: 0; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    .ks-burner__pick button { background: #374151; color: #f8fafc; white-space: nowrap; }
    .ks-burner__pick button:hover { background: #4b5563; }
    .ks-burner__go { width: 100%; margin-top: 8px; background: #22c55e; color: #052e16; }
    .ks-burner.is-burn .ks-burner__go { background: #6b7280; color: #fff; }
    .ks-burner.is-cook .ks-burner__go { background: #374151; color: #94a3b8; cursor: default; }
    .ks-gimbap { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #f0fdf4; }
    .ks-steps { display: flex; gap: 4px; flex: 1; }
    .ks-steps span { flex: 1; padding: 6px 2px; border-radius: 8px; background: #dcfce7; text-align: center; font-size: 11.5px; font-weight: 700; color: #166534; word-break: keep-all; }
    .ks-steps span.is-done { background: #16a34a; color: #fff; }
    .ks-roll { flex-shrink: 0; min-width: 104px; }
    .ks-note { margin-top: 8px; font-size: 12.5px; color: var(--text-muted); word-break: keep-all; }
    .ks-feed { margin: 0; padding: 0; list-style: none; font-size: 13px; color: #475569; }
    .ks-feed li { padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
    .ks-feed li:last-child { border-bottom: 0; }
    .er-end.is-kitchen { background: linear-gradient(160deg, #9a3412, #f59e0b); }
    .ks-end-stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ks-end-stats span { padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .18); font-size: 13.5px; font-weight: 700; }
    @media (max-width: 640px) {
      .ks-tables { grid-template-columns: minmax(0, 1fr); }
      .ks-table { min-height: 0; }
      .ks-guest { width: 76px; }
      .ks-queue { overflow-x: auto; }
      .ks-burner__pick { grid-template-columns: minmax(0, 1fr); }
      .ks-burner__ring { width: 56px; height: 56px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 점심 분식집 — 2인 협동. 홀(손님 · 주문 전달 · 서빙 · 치우기)과 주방(화구 · 김밥)이 3분 동안 가게를 운영 (방 공용은 /_shared/coop.js)
    const { esc } = HKMatch;
    const { won } = HKCoop;
    const DISH = { tteok: ["떡", "#dc2626"], ramen: ["라", "#ea580c"], odeng: ["어", "#a16207"], gimbap: ["김", "#16a34a"] };
    let room = null, k = null, offset = 0, tickFor = null, phases = "";

    const now = () => (Date.now() + offset) / 1000; // 서버 시계(초)
    const dishName = (key) => (k && k.menu[key] ? k.menu[key].name : key);
    const chip = (key, ok, extra = "") => `<span class="ks-dish ${ok ? "is-ok" : ""}"><i style="background:${DISH[key][1]}">${DISH[key][0]}</i>${esc(dishName(key))}${extra}</span>`;
    // 줄어드는 막대(남은 참을성) · 차오르는 막대(익는 정도) — tick 이 너비를 맞춘다
    const bar = (from, to, mode) => `<div class="ks-bar" data-from="${from}" data-to="${to}" data-mode="${mode}"><span></span></div>`;
    const heartsHtml = () => `<span class="ks-hearts">${Array.from({ length: k.maxHearts }, (_, i) => `<span class="${i < k.hearts ? "" : "is-off"}">♥</span>`).join("")}</span>`;

    function statsHtml() {
      return `<div class="ks-stats">
          <div class="ks-stat">매출 <b>${won(k.money)}</b></div>
          <div class="ks-stat">손님 <b>${k.served}</b>명</div>
          <div class="ks-stat">${heartsHtml()}</div>
        </div>`;
    }
    function passHtml(canToss = true) {
      const items = k.pass.map((d, i) => chip(d, false, canToss ? `<button type="button" class="ks-toss" data-toss="${i}" aria-label="버리기">×</button>` : "")).join("");
      return `<div class="ks-sec"><h3>${HKUI.icon("utensils", 15)} 배식구<small>${k.pass.length} / ${k.passMax}</small></h3><div class="ks-pass">${items || `<span style="font-size:13px;color:var(--text-muted)">아직 나온 음식이 없어요</span>`}</div></div>`;
    }
    function hasAll(items) {
      const left = [...k.pass];
      return items.every((it) => { const i = left.indexOf(it); if (i < 0) return false; left.splice(i, 1); return true; });
    }

    // ---------- 홀 ----------
    function hallHtml() {
      const freeTable = k.tables.some((t) => t.s === "empty");
      const queue = k.queue.map((q) => `<button type="button" class="ks-guest" data-seat="${q.id}" ${freeTable ? "" : "disabled"} title="${freeTable ? "자리 안내" : "빈 테이블이 없어요"}">
          <b>${["🙂", "😀", "🧑", "🙋"][q.id % 4]}</b><small>${freeTable ? "자리 안내" : "자리 없음"}</small>${bar(q.until - k.queuePatience, q.until, "left")}</button>`).join("");
      const tables = k.tables.map((t) => {
        if (t.s === "empty") return `<div class="ks-table"><span class="ks-table__n">${t.n + 1}번 테이블</span><div class="ks-table__body"><span class="ks-table__state">빈 자리</span></div></div>`;
        if (t.s === "dirty") return `<div class="ks-table is-dirty"><span class="ks-table__n">${t.n + 1}번 테이블</span><div class="ks-table__body"><span class="ks-table__state">🍽️ 다 먹은 그릇</span></div><button type="button" class="hk-btn hk-btn--secondary" data-clean="${t.n}">치우기</button></div>`;
        if (t.s === "eat") return `<div class="ks-table"><span class="ks-table__n">${t.n + 1}번 테이블</span><div class="ks-table__body"><span class="ks-table__state">😋 먹는 중 · ${won(t.pay)}</span>${bar(t.eatEnd - 4, t.eatEnd, "fill")}</div></div>`;
        const ready = hasAll(t.items);
        return `<div class="ks-table is-wait ${ready ? "is-ready" : ""}"><span class="ks-table__n">${t.n + 1}번 테이블 · 주문</span>
            <div class="ks-table__body"><div class="ks-row">${t.items.map((it) => chip(it, false)).join("")}</div>${bar(t.until - k.tablePatience, t.until, "left")}</div>
            ${t.sent ? `<div class="ks-sent">✓ 주방에 전달함</div>` : `<button type="button" class="hk-btn hk-btn--secondary" data-send="${t.n}">주방에 전달</button>`}
            <button type="button" class="hk-btn hk-btn--primary" data-serve="${t.n}" ${ready ? "" : "disabled"}>서빙</button></div>`;
      }).join("");
      return `<div class="ks-sec"><h3>${HKUI.icon("users", 15)} 대기 줄<small>${k.queue.length} / ${k.queueMax}</small></h3><div class="ks-queue">${queue || `<div class="ks-empty">기다리는 손님이 없어요</div>`}</div></div>
        <div class="ks-sec"><h3>${HKUI.icon("armchair", 15)} 테이블</h3><div class="ks-tables">${tables}</div></div>
        ${passHtml()}`;
    }

    // ---------- 주방 ----------
    function burnerPhase(b) {
      if (!b) return "empty";
      const t = now();
      return t < b.done ? "cook" : t <= b.burn ? "done" : "burn";
    }
    function kitchenHtml() {
      const tickets = k.tickets.map((t) => `<div class="ks-ticket"><div class="ks-ticket__head"><span>${t.n + 1}번 테이블</span></div><div class="ks-row">${t.items.map((it) => chip(it, false)).join("")}</div>${bar(t.until - k.tablePatience, t.until, "left")}</div>`).join("");
      const burners = k.burners.map((b, i) => {
        const ph = burnerPhase(b);
        if (ph === "empty") {
          return `<div class="ks-burner"><div class="ks-burner__ring">${i + 1}번 화구</div>
              <div class="ks-burner__pick">${Object.keys(k.menu).filter((d) => k.menu[d].cook).map((d) => `<button type="button" data-cook="${i}:${d}">${esc(dishName(d))}</button>`).join("")}</div></div>`;
        }
        const label = { cook: "끓는 중…", done: "다 됐어요! 꺼내세요", burn: "타 버렸어요" }[ph];
        const barHtml = ph === "cook" ? bar(b.start, b.done, "fill") : ph === "done" ? bar(b.done, b.burn, "left") : "";
        return `<div class="ks-burner is-${ph}" data-phase="${ph}"><div class="ks-burner__ring">${esc(dishName(b.dish))}</div>
            <div class="ks-burner__label">${label}</div>${barHtml}
            <button type="button" class="ks-burner__go" data-take="${i}" ${ph === "cook" ? "disabled" : ""}>${ph === "burn" ? "버리기" : ph === "done" ? "꺼내기" : "기다리는 중"}</button></div>`;
      }).join("");
      const g = k.gimbap;
      return `<div class="ks-sec"><h3>${HKUI.icon("clipboard-list", 15)} 주문서<small>홀이 전달한 주문만 보여요</small></h3><div class="ks-tickets">${tickets || `<div class="ks-empty">아직 들어온 주문이 없어요</div>`}</div>
          ${k.waiting ? `<div class="ks-note">홀에 아직 전달 안 된 손님이 ${k.waiting}명 있어요.</div>` : ""}</div>
        <div class="ks-sec"><h3>${HKUI.icon("flame", 15)} 화구<small>다 익고 ${k.burnSec}초 안에 꺼내야 안 타요</small></h3><div class="ks-burners">${burners}</div></div>
        <div class="ks-sec"><h3>${HKUI.icon("hand", 15)} 김밥 말기</h3><div class="ks-gimbap"><div class="ks-steps">${g.steps.map((s, i) => `<span class="${i < g.step ? "is-done" : ""}">${esc(s)}</span>`).join("")}</div>
          <button type="button" class="hk-btn hk-btn--primary ks-roll" data-roll>${esc(g.steps[g.step])}</button></div></div>
        ${passHtml()}`;
    }

    function feedHtml() {
      const items = (k.log || []).slice().reverse().map((l) => `<li>${esc(l.text)}</li>`).join("");
      return `<div class="er-card"><h2>가게 소식</h2>${items ? `<ul class="ks-feed">${items}</ul>` : `<div style="font-size:13px;color:var(--text-muted)">아직 소식이 없어요</div>`}</div>`;
    }

    // 막대 너비 · 화구 상태 · 시간 일(손님 도착 등) 맞추기 — 0.1초마다
    function tick(ctx) {
      if (!room || room.status !== "PLAYING" || !k) return;
      const t = now();
      document.querySelectorAll(".ks-bar[data-from]").forEach((el) => {
        const from = Number(el.dataset.from), to = Number(el.dataset.to);
        let f = Math.max(0, Math.min(1, (t - from) / (to - from)));
        if (el.dataset.mode === "left") f = 1 - f;
        el.firstChild.style.width = `${(f * 100).toFixed(1)}%`;
        if (el.dataset.mode === "left") { el.classList.toggle("is-warn", f < 0.5 && f >= 0.25); el.classList.toggle("is-bad", f < 0.25); }
      });
      if (k.burners) {
        const p = k.burners.map(burnerPhase).join(",");
        if (p !== phases) { phases = p; ctx.paint(); }
      }
      if (k.nextAt && t >= k.nextAt + 0.05 && tickFor !== k.nextAt) {
        tickFor = k.nextAt;
        HKApi.coopTick(room.id).then((next) => ctx.set(next)).catch(() => { tickFor = null; });
      }
    }

    async function doAct(ctx, action, arg) {
      try {
        const next = await HKApi.coopAct(room.id, action, arg);
        ctx.set(next);
        if (next.stamp && next.stamp.new) HKUI.toast(`오늘 도장을 받았어요 (${next.stamp.count}/${next.stamp.goal})`);
      } catch (e) { HKUI.toast(e.message || "할 수 없어요", "error"); }
    }

    HKCoop.mount({
      room: "lunch",
      listName: "분식집 목록",
      heroClass: "is-kitchen",
      wide: true,
      tickMs: 100,
      hero: { facts: ["2인 협동", "3분 영업", "홀 · 주방", "끝까지 하면 오늘 도장"], note: "주방은 주문을 직접 볼 수 없어요. 홀이 주문을 전달해 주고, 주방은 다 된 음식을 배식구에 올려요. 서로 말로 알려 주면 매출이 쑥쑥 올라요." },
      rankTitle: "매출 순위",
      rankNote: "같은 두 사람은 가장 높은 매출 한 판만 올라요.",
      rankText: (x) => won(x.score),
      recentText: (r) => (r.status === "CLEAR" ? [`매출 ${won(r.score)}`, "is-clear"] : ["포기", "is-fail"]),
      failTitle: "영업 중단",
      quick: ["주문 들어가요!", "떡볶이 빨리요", "라면 올려 주세요", "김밥 말아 주세요", "배식구 확인해요", "잠깐만요"],
      remain: () => (k ? k.end - now() : null),
      timerNote: () => "영업 남은 시간",
      readyNote: (ctx) => (ctx.room.sideName === "홀"
        ? "<b>홀</b>은 줄 선 손님을 눌러 자리에 앉히고, 주문을 <b>「주방에 전달」</b>해요. 배식구에 음식이 다 나오면 <b>「서빙」</b>, 손님이 다 먹으면 <b>「치우기」</b>. 손님을 3명 놓치면 가게 문을 닫아요."
        : "<b>주방</b>은 주문을 직접 못 봐요. 홀이 전달한 주문서를 보고 화구에 떡볶이·라면·어묵을 올리고, 다 익으면 바로 <b>「꺼내기」</b>(늦으면 타요). 김밥은 버튼을 4번 눌러 말아요."),
      reset: () => { tickFor = null; phases = ""; },
      changed: (prev, next) => {
        room = next;
        k = next.kitchen || null;
        if (k) offset = k.now * 1000 - Date.now();
      },
      play: () => (k ? `<div class="er-card">${statsHtml()}${room.sideName === "홀" ? hallHtml() : kitchenHtml()}</div>` : ""),
      side: () => (k ? feedHtml() : ""),
      end: (ctx, again) => {
        const kk = room.kitchen || {};
        return `<div class="er-end is-kitchen"><h2>${room.end === "HEARTS" ? "가게 문을 일찍 닫았어요" : "영업 끝!"}</h2><p>${esc(room.outro)}</p>
            <div class="er-end__time">${won(room.score)}</div>
            <div class="ks-end-stats"><span>손님 ${kk.served || 0}명</span><span>놓친 손님 ${kk.missed || 0}명</span><span>탄 음식 ${kk.burnt || 0}개</span></div>
            <div class="er-actions">${again}<a class="hk-btn hk-btn--secondary" href="#" style="text-decoration:none">분식집 목록</a></div></div>`;
      },
      tick,
      click: async (t, ctx) => {
        const d = t.dataset;
        if (d.seat) return doAct(ctx, "seat", Number(d.seat));
        if (d.send) return doAct(ctx, "send", Number(d.send));
        if (d.serve) return doAct(ctx, "serve", Number(d.serve));
        if (d.clean) return doAct(ctx, "clean", Number(d.clean));
        if (d.cook) { const [b, dish] = d.cook.split(":"); return doAct(ctx, "cook", { burner: Number(b), dish }); }
        if (d.take) return doAct(ctx, "take", Number(d.take));
        if ("roll" in d) return doAct(ctx, "roll", null);
        if (d.toss) return doAct(ctx, "toss", Number(d.toss));
      },
    });
  </script>
</body>
</html>
