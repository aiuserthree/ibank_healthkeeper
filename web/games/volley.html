<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>옥상 배구 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <script src="/_shared/volley.js"></script>
  <style>
    /* 옥상 배구 — 판(16:9) · PC 키 안내 · 휴대폰 조작판 · 위에 덮는 카드 */
    .vb-main { align-items: stretch !important; }
    /* 경기 중 일시정지 버튼 — PC 에서도 보인다 (P · Esc 와 같음) */
    .hk-pf.is-playing .hk-pf__pause:not([hidden]) { display: inline-flex; }
    .vb { position: relative; display: grid; box-sizing: border-box; --gw: 640px; --btn: 78px; --stick: 132px; }
    .vb.is-pc { margin: auto; grid-template-areas: "game" "keys"; grid-template-rows: auto auto; gap: 8px; }
    /* 휴대폰 세로 — 위 판 · 가운데 안내 · 아래 조작판(엄지 닿는 곳) */
    .vb.is-port { width: 100%; min-height: 100%; grid-template-areas: "game game" "tip tip" "stick btns"; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
    /* 휴대폰 가로 — 양옆 조작판 폭은 JS 가 노치(안전 영역)까지 더해 정한다 */
    .vb.is-land { width: 100%; height: 100%; grid-template-areas: "stick game btns"; grid-template-columns: var(--side-l, 150px) minmax(0, 1fr) var(--side-r, 150px); align-items: center; }
    .vb-game { grid-area: game; position: relative; width: var(--gw); height: calc(var(--gw) * 0.5625); border-radius: 16px; overflow: hidden; background: #9fd7fb; box-shadow: 0 10px 30px rgba(15, 23, 42, .14); touch-action: none; justify-self: center; }
    .vb-game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .vb-keys { grid-area: keys; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13px; color: var(--text-secondary); }
    .vb-keys span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .vb kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid #cbd5e1; border-bottom-width: 2px; background: #fff; font: 700 12px/1 inherit; color: #0f172a; box-sizing: border-box; }
    .vb-keys b { color: #0f172a; font-weight: 800; }
    .vb-stick, .vb-btns, .vb-tip { display: none; }
    .vb.is-port .vb-keys, .vb.is-land .vb-keys { display: none; }
    .vb.is-port .vb-tip { grid-area: tip; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px 8px; font-size: 13px; color: var(--text-muted); text-align: center; word-break: keep-all; }
    .vb-tip__rot { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--border-default); font-weight: 700; color: #475569; }
    .vb-tip__how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 360px; }
    .vb-tip__how div { padding: 8px 4px; border-radius: 12px; background: rgba(255, 255, 255, .7); font-size: 12px; line-height: 1.4; color: #475569; word-break: keep-all; }
    .vb-tip__how b { display: block; font-size: 13px; color: #0f172a; }
    @media (max-height: 700px) { .vb-tip__how { display: none; } }
    .vb.is-port .vb-stick, .vb.is-land .vb-stick { grid-area: stick; display: flex; }
    .vb.is-port .vb-btns, .vb.is-land .vb-btns { grid-area: btns; display: grid; }
    /* 이동 막대 — 누른 자리에서부터 끈다 */
    .vb-stick { position: relative; min-width: 0; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; touch-action: none; padding: 10px 6px calc(var(--sa-b, 0px) + 14px); box-sizing: border-box; }
    .vb.is-land .vb-stick { height: 100%; justify-content: center; padding-bottom: 10px; }
    .vb-stick__base { position: relative; width: var(--stick); height: var(--stick); border-radius: 50%; background: rgba(15, 23, 42, .06); border: 2px solid rgba(15, 23, 42, .1); display: flex; align-items: center; justify-content: center; }
    .vb-stick__base::before, .vb-stick__base::after { content: ""; position: absolute; top: 50%; width: 0; height: 0; border: 9px solid transparent; transform: translateY(-50%); }
    .vb-stick__base::before { left: 10px; border-right-color: rgba(15, 23, 42, .28); border-left-width: 0; }
    .vb-stick__base::after { right: 10px; border-left-color: rgba(15, 23, 42, .28); border-right-width: 0; }
    .vb-stick__knob { width: calc(var(--stick) * .44); height: calc(var(--stick) * .44); border-radius: 50%; background: linear-gradient(160deg, #ffffff, #e2e8f0); box-shadow: 0 4px 12px rgba(15, 23, 42, .22); transition: transform .05s linear; }
    .vb-stick.is-on .vb-stick__knob { background: linear-gradient(160deg, #dbe7ff, #b9cdfb); }
    .vb-stick small, .vb-btns small { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    /* 점프 · 강타 · 다이빙 */
    .vb-btns { min-width: 0; grid-template-columns: auto auto; grid-template-areas: "dive dive" "hit jump"; justify-content: center; align-content: end; gap: 12px 14px; padding: 10px 6px calc(var(--sa-b, 0px) + 14px); touch-action: none; }
    .vb.is-land .vb-btns { align-content: center; padding-bottom: 10px; }
    .vb-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: var(--btn); height: var(--btn); border-radius: 50%; border: 0; color: #fff; font: 800 15px/1.1 inherit; touch-action: none; cursor: pointer; box-shadow: 0 5px 0 rgba(15, 23, 42, .18); -webkit-tap-highlight-color: transparent; }
    .vb-btn[data-act="jump"] { grid-area: jump; background: linear-gradient(160deg, #4f86ff, #2f6bff); }
    .vb-btn[data-act="spike"] { grid-area: hit; background: linear-gradient(160deg, #ff9a63, #ff7a3d); }
    .vb-btn[data-act="dive"] { grid-area: dive; justify-self: center; width: calc(var(--btn) * 1.55); height: calc(var(--btn) * .58); border-radius: 999px; background: linear-gradient(160deg, #64748b, #475569); font-size: 14px; }
    .vb-btn.is-down { transform: translateY(3px) scale(.96); box-shadow: 0 2px 0 rgba(15, 23, 42, .18); filter: brightness(.92); }
    .vb.is-land .vb-btns { gap: 10px 8px; padding-left: 2px; padding-right: calc(var(--sa-r, 0px) + 2px); }
    .vb.is-land .vb-btn { font-size: 14px; }
    .vb.is-land .vb-btn[data-act="dive"] { width: calc(var(--btn) * 1.6); height: calc(var(--btn) * .66); font-size: 13px; }
    .vb.is-land .vb-stick { padding-left: calc(var(--sa-l, 0px) + 2px); padding-right: 2px; }
    /* 이동을 버튼으로 (환경 — 막대 대신) */
    .vb-move { display: none; gap: 12px; }
    .vb.is-btnmove .vb-stick__base { display: none; }
    .vb.is-btnmove .vb-move { display: flex; }
    .vb-btn[data-act="left"], .vb-btn[data-act="right"] { background: linear-gradient(160deg, #94a3b8, #64748b); font-size: 24px; }
    /* PC — 코트 안 조작판(레퍼런스의 코트 조이스틱): 경기판 아래 모서리에 반투명으로, 마우스로도 누른다. 경기 중에만 먹는다 */
    .vb.is-pc .vb-stick { grid-area: game; display: flex; align-self: end; justify-self: start; z-index: 2; padding: 0 0 8px 10px; gap: 0; }
    /* 오른쪽 아래 세로로 — 위에서부터 점프 · 강타 · 다이빙 (레퍼런스 PC 코트 조작판과 같은 자리 · 순서) */
    .vb.is-pc .vb-btns { grid-area: game; display: grid; align-self: end; justify-self: end; z-index: 2; grid-template-columns: auto; grid-template-areas: "jump" "hit" "dive"; gap: 8px; padding: 0 10px 8px 0; }
    .vb.is-pc .vb-stick small { display: none; }
    .vb.is-pc .vb-stick__base { width: 112px; height: 48px; border-radius: 999px; background: rgba(15, 23, 42, .22); border-color: rgba(255, 255, 255, .45); }
    .vb.is-pc .vb-stick__base::before { border-right-color: rgba(255, 255, 255, .8); }
    .vb.is-pc .vb-stick__base::after { border-left-color: rgba(255, 255, 255, .8); }
    .vb.is-pc .vb-stick__knob { width: 40px; height: 40px; opacity: .92; }
    .vb.is-pc .vb-btn { width: 60px; height: 44px; border-radius: 14px; font-size: 13px; opacity: .88; box-shadow: 0 3px 0 rgba(15, 23, 42, .2); }
    .vb.is-pc .vb-btn[data-act="dive"] { width: 60px; height: 44px; border-radius: 14px; font-size: 13px; }
    .hk-pf:not(.is-playing) .vb.is-pc .vb-stick, .hk-pf:not(.is-playing) .vb.is-pc .vb-btns { opacity: .4; pointer-events: none; }
    /* PC — 아래 버튼(환경설정): 경기판 아래 한 줄 ← → 점프 다이빙 강타 */
    .vb.is-pc.is-btnmove { grid-template-areas: "game game" "stick btns" "keys keys"; grid-template-columns: 1fr 1fr; }
    .vb.is-pc.is-btnmove .vb-game { grid-area: game; }
    .vb.is-pc.is-btnmove .vb-keys { grid-area: keys; }
    .vb.is-pc.is-btnmove .vb-stick { grid-area: stick; align-self: center; justify-self: end; padding: 0 4px 0 0; }
    .vb.is-pc.is-btnmove .vb-btns { grid-area: btns; align-self: center; justify-self: start; grid-template-areas: "jump dive hit"; padding: 0 0 0 4px; }
    .vb.is-pc.is-btnmove .vb-move { gap: 8px; }
    .vb.is-pc.is-btnmove .vb-btn { opacity: 1; }
    .vb.is-pc .vb-btn[data-act="left"], .vb.is-pc .vb-btn[data-act="right"] { font-size: 20px; }
    /* 선수 고르기 — 작은 그림 + 이름 */
    .vb-chars button { display: inline-flex; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; min-width: 0; }
    .vb-chr { width: 22px; height: 30px; object-fit: contain; flex-shrink: 0; }
    .vb-chr--q { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; color: #475569; font-weight: 800; font-size: 13px; }
    .vb-chr.is-sm { width: 18px; height: 22px; }
    .vb-card.vb-set .vb-row__k { width: 58px; text-align: left; }
    .vb-card.vb-opt { max-width: 470px; text-align: left; }
    .vb-card.vb-opt h2, .vb-card.vb-rules h2 { margin-bottom: 2px; }
    .vb-card.vb-rules { max-width: 600px; }
    .vb-rules h3 { margin: 14px 0 4px; font-size: 15px; font-weight: 800; color: #0f172a; }
    .vb-rules ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); word-break: keep-all; }
    .vb-rules li + li { margin-top: 3px; }
    .vb-rules kbd { height: 20px; min-width: 20px; font-size: 11px; }
    .hk-pf__tools > [hidden] { display: none !important; }
    .vb-card.vb-set .vb-seg button { font-size: 13px; }
    .vb-over--set { z-index: 6; }
    /* 온라인 준비 · 계속 준비 */
    .vb-who { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
    .vb-who div { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 12px; background: #f1f5f9; font-size: 13px; font-weight: 700; color: #475569; }
    .vb-who div.is-on { background: #dcfce7; color: #15803d; }
    .vb-card .vb-row__k { text-align: left; }
    /* 위에 덮는 화면 (모드 고르기 · 멈춤 · 결과 · 연결) */
    .vb-over { position: absolute; inset: 0; z-index: 5; display: flex; padding: 14px; overflow-y: auto; background: rgba(10, 30, 50, .42); border-radius: 16px; box-sizing: border-box; }
    .vb-over[hidden] { display: none; }
    .vb.is-port .vb-over, .vb.is-land .vb-over { border-radius: 12px; }
    .vb-card { margin: auto; width: 100%; max-width: 560px; box-sizing: border-box; padding: 20px; border-radius: 18px; background: #fff; box-shadow: 0 18px 44px rgba(15, 23, 42, .28); color: var(--color-midnight-navy, #0b3558); }
    .vb-card h2 { margin: 0; font-size: 22px; font-weight: 800; color: #0f172a; word-break: keep-all; }
    .vb-card p { margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: var(--text-secondary); word-break: keep-all; }
    .vb-menu__head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .vb-logo { flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0ea5e9, #ff7a3d); }
    .vb-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .vb-mode { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px; border-radius: 14px; border: 2px solid #e2e8f0; background: #fff; text-align: left; font: inherit; color: #0f172a; cursor: pointer; }
    .vb-mode:hover:not(:disabled) { border-color: #93c5fd; }
    .vb-mode.is-on { border-color: #2f6bff; background: #eff5ff; box-shadow: 0 0 0 3px rgba(47, 107, 255, .14); }
    .vb-mode:disabled { cursor: not-allowed; opacity: .62; background: #f8fafc; }
    .vb-mode__ic { display: inline-flex; width: 30px; height: 30px; border-radius: 9px; align-items: center; justify-content: center; margin-bottom: 4px; background: #e0ecff; color: #2f6bff; }
    .vb-mode[data-mode="local"] .vb-mode__ic { background: #ffedd5; color: #ea580c; }
    .vb-mode[data-mode="online"] .vb-mode__ic { background: #dcfce7; color: #16a34a; }
    .vb-mode b { font-size: 15px; font-weight: 800; }
    .vb-mode small { font-size: 12px; line-height: 1.35; color: var(--text-muted); word-break: keep-all; }
    .vb-mode__tag { position: absolute; top: 8px; right: 8px; padding: 2px 7px; border-radius: 999px; background: #f1f5f9; font-size: 11px; font-weight: 700; color: #64748b; }
    .vb-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .vb-row[hidden] { display: none; }
    .vb-row__k { flex-shrink: 0; width: 46px; font-size: 13px; font-weight: 800; color: #475569; }
    .vb-seg { flex: 1; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #f1f5f9; }
    .vb-seg button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #475569; cursor: pointer; }
    .vb-seg button.is-on { background: #fff; color: #0f172a; box-shadow: 0 1px 3px rgba(15, 23, 42, .14); }
    .vb-note { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #fff7ed; font-size: 13px; line-height: 1.5; color: #9a3412; word-break: keep-all; }
    .vb-note[hidden] { display: none; }
    .vb-go { width: 100%; height: 50px; margin-top: 14px; font-size: 16px !important; }
    .vb-help { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #f8fafc; font-size: 12.5px; line-height: 1.7; color: #475569; word-break: keep-all; }
    .vb-help div { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
    .vb-help b { color: #0f172a; }
    .vb-help .vb kbd, .vb-help kbd { height: 20px; min-width: 20px; font-size: 11px; }
    /* 멈춤 · 결과 */
    .vb-card.is-small { max-width: 380px; text-align: center; }
    .vb-badge { display: inline-flex; width: 56px; height: 56px; border-radius: 16px; align-items: center; justify-content: center; margin-bottom: 8px; background: #e2e8f0; color: #475569; }
    .vb-badge.is-win { background: linear-gradient(135deg, #ffd23f, #ff9f1c); color: #fff; }
    .vb-badge.is-lose { background: #e0e7ff; color: #4f46e5; }
    .vb-score { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 4px; }
    .vb-score__side { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; font-weight: 700; }
    .vb-score__side span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 92px; }
    .vb-score__num { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; color: #0f172a; }
    .vb-score__num.is-l { color: #2f6bff; }
    .vb-score__num.is-r { color: #ff7a3d; }
    .vb-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
    .vb-stats div { padding: 10px 4px; border-radius: 12px; background: #f8fafc; }
    .vb-stats b { display: block; font-size: 17px; font-weight: 800; color: #0f172a; }
    .vb-stats small { font-size: 11.5px; color: var(--text-muted); }
    .vb-btnrow { display: flex; gap: 8px; margin-top: 16px; }
    .vb-btnrow .hk-btn { flex: 1; height: 46px; }
    .vb-card .vb-mini { margin-top: 10px; font-size: 12px; color: var(--text-muted); }
    .vb-card.is-wide { max-width: 760px; padding: 0; overflow: hidden; }
    .vb-card.is-wide .gk { padding: 18px 18px 24px; }
    .vb-card .vb-mini.is-ok { color: #15803d; font-weight: 700; }
    /* 코트 보기 — 결과 카드를 접고 끝난 코트를 본다. 아래 가운데 버튼으로 다시 연다 */
    .vb-resback { position: absolute; left: 50%; bottom: 12px; z-index: 4; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .94); box-shadow: 0 6px 18px rgba(15, 23, 42, .22); font: 800 14px/1 inherit; color: #0f172a; cursor: pointer; }
    .vb-resback[hidden] { display: none; }
    .vb-btnrow.is-3 .hk-btn { padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .vb-again { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #eff5ff; font-size: 13px; font-weight: 700; color: #1d4ed8; word-break: keep-all; }
    .vb-again[hidden] { display: none; }
    .vb-card .vb-mini.is-bad { color: #b45309; font-weight: 700; }
    /* 휴대폰 */
    @media (max-width: 640px) {
      /* 위 막대 — 게임 옵션 · 게임 방법 · 환경설정 · 전체 화면까지 한 줄에 들어가게 */
      .hk-pf__bar .hk-pf__icon { display: none; }
      .hk-pf__tools { gap: 5px; }
      .hk-pf__tools .hk-play-sound { padding: 7px 8px; }
      .vb-over { padding: 8px; }
      .vb-card { padding: 16px 14px; border-radius: 16px; }
      .vb-card h2 { font-size: 19px; }
      .vb-modes { gap: 6px; }
      .vb-mode { padding: 10px 8px; }
      .vb-mode b { font-size: 14px; }
      .vb-mode small { font-size: 11px; }
      .vb-mode__tag { top: 6px; right: 6px; font-size: 10px; padding: 1px 6px; }
      .vb-logo { width: 42px; height: 42px; }
    }
    /* 휴대폰 가로 — 위 막대를 얇게 */
    @media (max-height: 520px) and (pointer: coarse) {
      .hk-pf__bar { height: 42px; padding-left: calc(var(--sa-l, 0px) + 8px); padding-right: calc(var(--sa-r, 0px) + 8px); }
      .hk-pf__title small, .hk-pf__back span { display: none; }
      .hk-pf__tools .hk-play-sound span { display: none; }
      .hk-pf__tools .hk-play-sound { padding: 6px 9px; }
      .hk-pf .hk-pf__main { padding: 4px !important; }
    }
    @media (max-height: 520px) and (orientation: landscape) {
      .vb-over { padding: 6px; }
      .vb-card { padding: 12px 16px; }
      .vb-menu__head { display: none; } /* 제목은 위 막대에 있다 — 선수 고르기 줄까지 한 화면에 */
      .vb-card .vb-badge { display: none; } /* 낮은 화면 — 준비 · 멈춤 · 결과 카드의 큰 그림은 빼고 버튼까지 한 화면에 */
      .vb-who { margin-top: 8px; }
      .vb-who div { padding: 7px 6px; }
      .vb-btnrow { margin-top: 10px; }
      .vb-mode small { display: none; }
      .vb-mode__ic { display: none; }

      .vb-opt > p, .vb-opt .vb-mini { display: none; } /* 게임 옵션 — 버튼(적용하고 새 경기)까지 한 화면에 */
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (async function () {
    // 옥상 배구 — 컴퓨터와 · 둘이 한 화면 · 동료와(실시간 1:1). 연습 · 대전 게임이라 아케이드 순위에 점수를 올리지 않는다
    const esc = HKUI.escapeHtml;
    const KEY = "volley";
    const TINT = "linear-gradient(135deg, #0ea5e9, #ff7a3d)";
    // 시험용 — 한 브라우저 두 탭으로 온라인을 흉내 낸다(#rt-host · #rt-guest, 뒤에 :80 을 붙이면 0.08초 늦게). 사용자에게는 보이지 않는다
    const DEV = HKLunch.isLocal() || /\.test$/.test(location.hostname) || (() => { try { return localStorage.getItem("hk-dev") === "1"; } catch (_) { return false; } })();
    // 동료와(실시간) — 서버 대전 엔진은 app/services/versus_volley.py (결과만 받아 두 사람 점수를 맞춰 본다)
    const ONLINE_READY = true;
    const IS_TOUCH = matchMedia("(pointer: coarse)").matches;
    const LEVELS = [["easy", "쉬움"], ["normal", "보통"], ["hard", "어려움"]];
    const LEVEL_NAME = Object.fromEntries(LEVELS);
    const PREF_KEY = "hk-volley-pref";
    // ctrl: 화면 조작 — "court"(코트 조이스틱 · 기본) | "buttons"(아래 버튼). char: 내 선수(고르지 않았으면 null — 온라인 손님은 주황)
    // rival: 상대 선수 — "random"(나와 다른 선수 · 기본) | 번호. fps: 화면 표시 60 · 30(가볍게 — 동료와)
    const pref = { mode: "cpu", level: "normal", target: 7, ctrl: "court", char: null, rival: "random", fps: 60 };
    try { Object.assign(pref, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch (_) { /* 처음 */ }
    if (!["cpu", "local"].includes(pref.mode) || (pref.mode === "local" && IS_TOUCH)) pref.mode = "cpu";
    if (!LEVEL_NAME[pref.level]) pref.level = "normal";
    if (![7, 15].includes(pref.target)) pref.target = 7;
    if (pref.move === "btn") pref.ctrl = "buttons"; // 예전 저장값(이동: 막대 · 버튼)
    delete pref.move;
    if (!["court", "buttons"].includes(pref.ctrl)) pref.ctrl = "court";
    const LOOKS = HKVolley.LOOKS;
    const okLook = (v) => Number.isInteger(v) && v >= 0 && v < LOOKS.length;
    if (!okLook(pref.char)) pref.char = null;
    if (pref.rival !== "random" && !okLook(pref.rival)) pref.rival = "random";
    if (pref.fps !== 30) pref.fps = 60;
    const myChar = () => (okLook(pref.char) ? pref.char : 0);
    // 상대 선수 — 랜덤이면 나와 다른 선수 중 하나 (레퍼런스와 같음)
    const rivalChar = () => {
      if (okLook(pref.rival)) return pref.rival;
      const others = LOOKS.map((l) => l.id).filter((i) => i !== myChar());
      return others[Math.floor(Math.random() * others.length)];
    };
    const chrImg = (i) => `<img class="vb-chr" src="${HKVolley.thumb(i)}" alt="">`;
    // 내 최고 랠리 — 난이도 · 목표 점수마다 이 브라우저에 (컴퓨터와 끝낸 경기만)
    const BEST_KEY = "hk-volley-best";
    const bestOf = (lv, tg) => { try { return Number((JSON.parse(localStorage.getItem(BEST_KEY) || "{}") || {})[`${lv}-${tg}`]) || 0; } catch (_) { return 0; } };
    const putBest = (lv, tg, n) => { try { const o = JSON.parse(localStorage.getItem(BEST_KEY) || "{}") || {}; o[`${lv}-${tg}`] = n; localStorage.setItem(BEST_KEY, JSON.stringify(o)); } catch (_) { /* 저장 못 해도 경기는 그대로 */ } };
    const savePref = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (_) { /* 저장 못 해도 이번엔 그대로 */ } };

    await HKUI.loadLucide();
    const profile = await HKMember.requireAuth(location.pathname + location.hash);
    if (!profile) return;
    const icon = (n, s = 18, c = "currentColor") => HKUI.icon(n, s, c);
    document.body.classList.add("hk-pf-body");
    const editable = (t) => t && t.closest && t.closest("input, textarea, [contenteditable]");
    document.addEventListener("selectstart", (e) => { if (!editable(e.target)) e.preventDefault(); });
    document.addEventListener("contextmenu", (e) => { if (!editable(e.target)) e.preventDefault(); });
    // 조작판 · 판 위에서 길게 누르기 · 두 번 톡 확대가 시작되지 않게 (조작은 포인터 이벤트로 받는다)
    document.addEventListener("touchstart", (e) => {
      if (e.target.closest && e.target.closest(".vb-stick, .vb-btns, .vb-game") && !e.target.closest(".vb-over")) e.preventDefault();
    }, { passive: false });
    document.addEventListener("gesturestart", (e) => e.preventDefault());

    document.getElementById("app").innerHTML = `<div class="hk-pf" id="vb-pf">
        <header class="hk-pf__bar">
          <a class="hk-pf__back" href="${HKRoutes.lounge}" id="vb-back">${icon("chevron-left", 20)}<span>아케이드</span></a>
          <span class="hk-pf__icon" style="background:${TINT}">${icon("volleyball", 18, "#fff")}</span>
          <div class="hk-pf__title"><b>옥상 배구</b><small>점심시간 회사 옥상에서 1:1 배구</small></div>
          <div class="hk-pf__tools">
            <button type="button" class="hk-play-sound hk-pf__pause" id="vb-pause" aria-label="일시정지">${icon("pause")}<span>일시정지</span></button>
            <button type="button" class="hk-play-sound" id="vb-opt" aria-label="게임 옵션" hidden>${icon("sliders-horizontal")}<span>게임 옵션</span></button>
            <button type="button" class="hk-play-sound" id="vb-rules" aria-label="게임 방법">${icon("book-open")}<span>게임 방법</span></button>
            <button type="button" class="hk-play-sound" id="vb-set" aria-label="환경설정">${icon("settings-2")}<span>환경설정</span></button>
            <button type="button" class="hk-play-sound" id="vb-full" aria-label="전체 화면으로 보기" hidden></button>
            <button type="button" class="hk-play-sound" id="vb-sound"></button>
          </div>
        </header>
        <div class="hk-pf__body">
          <main class="hk-pf__main vb-main" id="vb-main">
            <div class="vb is-pc" id="vb">
              <div class="vb-game"><canvas id="vb-canvas" aria-label="옥상 배구 경기장"></canvas><button type="button" class="vb-resback" id="vb-resback" hidden>경기 결과 보기</button></div>
              <div class="vb-keys" id="vb-keys"></div>
              <div class="vb-tip">
                <span class="vb-tip__rot">${icon("rotate-cw", 15)} 가로로 돌리면 더 크게 보여요</span>
                <div class="vb-tip__how"><div><b>받기</b>몸에 닿으면 저절로</div><div><b>강타</b>닿기 직전에 눌러요</div><div><b>다이빙</b>보는 쪽으로 몸을 날려요</div></div>
              </div>
              <div class="vb-stick" id="vb-stick"><span class="vb-stick__base"><span class="vb-stick__knob" id="vb-knob"></span></span>
                <div class="vb-move"><button type="button" class="vb-btn" data-act="left" aria-label="왼쪽 이동">←</button><button type="button" class="vb-btn" data-act="right" aria-label="오른쪽 이동">→</button></div>
                <small id="vb-stick-tip">끌어서 이동</small></div>
              <div class="vb-btns" id="vb-btns">
                <button type="button" class="vb-btn" data-act="dive">다이빙</button>
                <button type="button" class="vb-btn" data-act="spike">강타</button>
                <button type="button" class="vb-btn" data-act="jump">점프</button>
              </div>
              <div class="vb-over" id="vb-over" hidden></div>
              <div class="vb-over vb-over--set" id="vb-setover" hidden></div>
            </div>
          </main>
        </div>
      </div>`;
    HKUI.refreshIcons();
    const $ = (s) => document.querySelector(s);
    const canvas = $("#vb-canvas"), over = $("#vb-over"), vb = $("#vb");

    // ───── 판 크기 — PC 는 화면에 맞는 16:9, 휴대폰 세로는 위에 판 · 아래 조작판, 가로는 양옆 조작판
    // 노치 아이폰(viewport-fit=cover)은 가로로 들면 양옆에 안전 영역이 생긴다 — 재서 조작판 폭에 더한다
    const saProbe = document.createElement("div");
    saProbe.id = "vb-sa";
    saProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
    document.body.appendChild(saProbe);
    const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
    function safeArea() {
      const c = getComputedStyle(saProbe), n = (v) => parseFloat(v) || 0;
      return { l: n(c.paddingLeft), r: n(c.paddingRight), b: n(c.paddingBottom) };
    }
    function layout() {
      const main = $("#vb-main"), cs = getComputedStyle(main), pf = $("#vb-pf");
      const sa = safeArea();
      pf.style.setProperty("--sa-l", `${sa.l}px`);
      pf.style.setProperty("--sa-r", `${sa.r}px`);
      pf.style.setProperty("--sa-b", `${sa.b}px`);
      const land = IS_TOUCH && innerWidth > innerHeight;
      const kind = !IS_TOUCH ? "is-pc" : land ? "is-land" : "is-port";
      vb.classList.remove("is-pc", "is-land", "is-port");
      vb.classList.add(kind);
      // 클래스를 바꾼 뒤에 잰다 (가로 모드는 위 막대 · 여백이 얇아진다)
      const aw = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const ah = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      let gw;
      if (kind === "is-port") {
        gw = aw;
        // 한 칸(화면 절반)에 버튼 둘 · 막대 하나가 들어가게 — 넓을수록 크게
        const col = aw / 2 - 12;
        vb.style.setProperty("--btn", `${Math.round(clampN((col - 14) / 2, 60, 92))}px`);
        vb.style.setProperty("--stick", `${Math.round(clampN(col - 24, 112, 168))}px`);
      } else if (kind === "is-land") {
        const inner = Math.round(clampN(aw * 0.165, 116, 168)); // 조작판이 쓰는 폭(안전 영역 빼고)
        const sl = inner + sa.l, sr = inner + sa.r;
        vb.style.setProperty("--side-l", `${sl}px`);
        vb.style.setProperty("--side-r", `${sr}px`);
        vb.style.setProperty("--btn", `${Math.floor(clampN((inner - 4 - 8) / 2, 48, 66))}px`);
        vb.style.setProperty("--stick", `${Math.round(clampN(inner - 14, 96, 128))}px`);
        gw = Math.min(aw - sl - sr, ah * 16 / 9);
      } else gw = Math.min(aw, (ah - 36 - (pref.ctrl === "buttons" ? 58 : 0)) * 16 / 9, 1240); // 아래 버튼 줄이면 그만큼 낮게
      vb.style.setProperty("--gw", `${Math.max(240, Math.floor(gw))}px`);
    }
    layout();
    let layoutT = 0;
    addEventListener("resize", () => { clearTimeout(layoutT); layoutT = setTimeout(layout, 60); });
    addEventListener("orientationchange", () => setTimeout(layout, 250));

    // ───── 소리 버튼 (모든 게임 공통 설정)
    const soundBtn = $("#vb-sound");
    const paintSound = () => {
      const m = HKSound.isMuted();
      soundBtn.innerHTML = `${icon(m ? "volume-x" : "volume-2")}<span>${m ? "소리 꺼짐" : "소리 켜짐"}</span>`;
      soundBtn.setAttribute("aria-pressed", m ? "false" : "true");
      soundBtn.classList.toggle("is-off", m);
      HKUI.refreshIcons(soundBtn);
    };
    paintSound();
    HKSound.onChange(paintSound);
    soundBtn.onclick = () => { HKSound.toggle(); HKSound.play("select"); soundBtn.blur(); };

    // ───── 엔진 · 화면 상태
    let engine = null, screen = "menu", playing = null; // playing: { mode, level, target, rival, online, role, report, resign }
    let resultAt = 0; // 결과 카드가 뜬 때 — 바로 뒤 Space · Enter 는 무시 (끝날 무렵 연타가 다시 하기로 새지 않게)
    const pauseBtn = $("#vb-pause");
    function stopEngine() { if (engine) { engine.destroy(); engine = null; } }
    // 잡고 있던 터치(막대 · 버튼)를 놓는다 — 득점 · 멈춤 · 새 서브 때. 다시 손을 대야 먹는다 (조작판 코드가 아래에서 채운다)
    let dropTouchImpl = () => {};
    function dropTouch() { dropTouchImpl(); }
    if (DEV) window.__vbEngine = () => engine; // 시험용
    function setPlaying(on) { $("#vb-pf").classList.toggle("is-playing", on); paintTools(); }
    const resBack = $("#vb-resback");
    function showOver(html) { over.innerHTML = html; over.hidden = false; resBack.hidden = true; HKUI.refreshIcons(over); paintTools(); }
    function hideOver() { over.hidden = true; over.innerHTML = ""; resBack.hidden = true; paintTools(); }
    // 코트 보기 — 결과 카드를 접어 끝난 코트를 그대로 보여 주고, 「경기 결과 보기」로 다시 연다 (레퍼런스와 같음)
    function courtView() {
      if (screen !== "result") return;
      screen = "court"; over.hidden = true; resBack.hidden = false;
    }
    function resultBack() {
      if (screen !== "court") return;
      screen = "result"; over.hidden = false; resBack.hidden = true;
    }
    resBack.onclick = () => { resBack.blur(); resultBack(); };
    const me = { name: profile.name || "나", avatarUrl: profile.avatarUrl || "" };

    function keysHtml(mode) {
      const k = (t) => `<kbd>${t}</kbd>`;
      if (mode === "local") {
        return `<span><b>1P</b> ${k("A")}${k("D")} 이동 ${k("W")}${k("Space")} 점프 ${k("S")} 다이빙 ${k("Z")}${k("X")} 강타</span>
          <span><b>2P</b> ${k("←")}${k("→")} 이동 ${k("↑")} 점프 ${k("↓")} 다이빙 ${k("Enter")} 강타</span>
          <span>${k("P")}${k("Esc")} 멈춤</span>`;
      }
      return `<span>${k("←")}${k("→")} 이동</span><span>${k("↑")}${k("Space")} 점프</span><span>${k("↓")} 다이빙</span><span>${k("Z")}${k("X")} 강타</span>
        <span>${k("P")}${k("Esc")} ${mode === "online" ? "일시정지" : "멈춤"}</span>`;
    }
    function helpHtml(mode) {
      const k = (t) => `<kbd>${t}</kbd>`;
      const rule = `<div>공이 몸에 닿으면 저절로 받아요 · 상대 코트 바닥에 떨어뜨리면 1점, 먼저 7점(또는 15점) 내면 승리 · 듀스 없음</div>
        <div>${IS_TOUCH ? "득점 · 멈춤 뒤에는 손을 떼고 다시 대야 움직여요" : "득점하면 누르던 키가 풀려요 · 다시 눌러야 움직여요"}. 멈추면 「계속하기」를 눌러야 이어 가요</div>
        <div>선수는 모습만 달라요(능력은 같아요) · 화면 조작은 환경설정에서 바꿔요</div>`;
      if (IS_TOUCH) {
        return `<div>왼손으로 이동 · 오른손으로 <b>점프 · 강타 · 다이빙</b> (기술은 누를 때마다 한 번)</div>
          <div>강타는 공에 닿기 직전에 — 높이 뛰어 치면 내리꽂고, 낮으면 위로 넘겨요</div>${rule}`;
      }
      if (mode === "local") {
        return `<div><b>1P</b> ${k("A")}${k("D")} 이동 · ${k("W")}${k("Space")} 점프 · ${k("S")} 다이빙 · ${k("Z")}${k("X")} 강타</div>
          <div><b>2P</b> ${k("←")}${k("→")} 이동 · ${k("↑")} 점프 · ${k("↓")} 다이빙 · ${k("Enter")} 강타</div>${rule}`;
      }
      return `<div>${k("←")}${k("→")} 이동 · ${k("↑")}${k("Space")} 점프 · ${k("↓")} 다이빙 · ${k("Z")}${k("X")} 강타</div>
        <div>강타는 공에 닿기 직전에 — 높이 뛰어 치면 내리꽂고, 낮으면 위로 넘겨요</div>${rule}`;
    }

    // ───── 첫 화면 — 뒤에서는 컴퓨터끼리 구경 경기
    function showMenu() {
      stopEngine(); closeConn();
      screen = "menu"; playing = null; setPlaying(false);
      pauseBtn.hidden = false; pauseBtn.disabled = false;
      $("#vb-keys").innerHTML = "";
      const d0 = Math.floor(Math.random() * LOOKS.length), d1 = (d0 + 1 + Math.floor(Math.random() * (LOOKS.length - 1))) % LOOKS.length;
      engine = HKVolley.create(canvas, { mode: "demo", target: 99, me: { name: "토스" }, rival: { name: "스파이크" }, looks: [d0, d1] });
      engine.start();
      const localOff = IS_TOUCH;
      showOver(`<div class="vb-card vb-menu" role="dialog" aria-label="옥상 배구 시작">
          <div class="vb-menu__head">
            <span class="vb-logo">${icon("volleyball", 26, "#fff")}</span>
            <div><h2>옥상 배구</h2><p>점심시간, 회사 옥상에서 1:1 배구 한 판</p></div>
          </div>
          <div class="vb-modes" role="radiogroup" aria-label="모드">
            <button type="button" class="vb-mode" data-mode="cpu" role="radio"><span class="vb-mode__ic">${icon("bot", 18)}</span><b>컴퓨터와</b><small>혼자 연습해요</small></button>
            <button type="button" class="vb-mode" data-mode="local" role="radio" ${localOff ? "disabled" : ""}><span class="vb-mode__ic">${icon("users", 18)}</span><b>둘이 한 화면</b><small>${localOff ? "키보드 있는 PC에서" : "키보드 하나로 겨뤄요"}</small></button>
            <button type="button" class="vb-mode" data-mode="online" role="radio" ${ONLINE_READY ? "" : "disabled"}><span class="vb-mode__ic">${icon("wifi", 18)}</span><b>동료와</b><small>실시간 1:1 대전</small>${ONLINE_READY ? "" : `<span class="vb-mode__tag">곧 열려요</span>`}</button>
          </div>
          <div class="vb-row" data-row="level"><span class="vb-row__k">난이도</span><div class="vb-seg">${LEVELS.map(([k, t]) => `<button type="button" data-level="${k}">${t}</button>`).join("")}</div></div>
          <div class="vb-row" data-row="target"><span class="vb-row__k">점수</span><div class="vb-seg"><button type="button" data-target="7">7점 빠른 경기</button><button type="button" data-target="15">15점 긴 경기</button></div></div>
          <div class="vb-row" data-row="char"><span class="vb-row__k">내 선수</span><div class="vb-seg vb-chars">${LOOKS.map((l) => `<button type="button" data-char="${l.id}">${chrImg(l.id)}${l.name}</button>`).join("")}</div></div>

          <button type="button" class="hk-btn hk-btn--primary vb-go" id="vb-go">경기 시작</button>
          <div class="vb-help" id="vb-help"></div>
        </div>`);
      paintMenu();
    }
    function paintMenu() {
      over.querySelectorAll("[data-mode]").forEach((b) => { const on = b.dataset.mode === pref.mode; b.classList.toggle("is-on", on); b.setAttribute("aria-checked", on ? "true" : "false"); });
      over.querySelectorAll("[data-level]").forEach((b) => b.classList.toggle("is-on", b.dataset.level === pref.level));
      over.querySelectorAll("[data-target]").forEach((b) => b.classList.toggle("is-on", Number(b.dataset.target) === pref.target));
      over.querySelectorAll("[data-char]").forEach((b) => b.classList.toggle("is-on", Number(b.dataset.char) === myChar()));
      over.querySelectorAll("[data-rival]").forEach((b) => b.classList.toggle("is-on", b.dataset.rival === String(pref.rival)));
      paintMove();
      const lv = over.querySelector('[data-row="level"]');
      if (lv) lv.hidden = pref.mode !== "cpu";
      // 동료와 — 상대 선수는 상대가 고른다
      const rr = over.querySelector('[data-row="rival"]');
      if (rr) rr.hidden = pref.mode === "online";
      // 온라인은 목표 점수를 들어간 뒤 준비 화면에서 도전한 사람이 정한다
      const tg = over.querySelector('[data-row="target"]');
      if (tg) tg.hidden = pref.mode === "online";
      const help = $("#vb-help");
      if (help) help.innerHTML = helpHtml(pref.mode);
    }

    // 화면 조작 — 코트 조이스틱(기본) · 아래 버튼 (환경설정)
    function paintMove() {
      vb.classList.toggle("is-btnmove", pref.ctrl === "buttons");
      const tip = $("#vb-stick-tip");
      if (tip) tip.textContent = pref.ctrl === "buttons" ? "눌러서 이동" : "끌어서 이동";
    }
    paintMove();

    // ───── 경기
    // wait: 레퍼런스의 「다시 경기」처럼 새 코트를 그려 두고 「서브 준비」에서 한 번 더 눌러 시작한다
    function startGame(mode, wait) {
      stopEngine();
      hideOver();
      dropTouch();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // 스페이스가 버튼을 누르지 않게
      const rival = mode === "cpu" ? { name: `컴퓨터(${LEVEL_NAME[pref.level]})` } : { name: "2P" };
      playing = { mode, level: pref.level, target: pref.target, rival };
      pauseBtn.hidden = false; pauseBtn.disabled = false;
      $("#vb-keys").innerHTML = keysHtml(mode);
      playing.best = mode === "cpu" ? bestOf(pref.level, pref.target) : 0;
      engine = HKVolley.create(canvas, {
        mode, level: pref.level, target: pref.target, touch: IS_TOUCH, best: playing.best,
        looks: [myChar(), rivalChar()], // 선택은 새 경기를 시작할 때 적용 (다시 하기도 랜덤이면 새로 뽑는다)
        me: mode === "local" ? { name: "1P" } : me, rival,
        onEvent: (e) => {
          if (e.type === "autopause") pauseGame("화면이 잠깐 멈춰서 경기를 세웠어요");
          else if (e.type === "inputreset" && e.drop) dropTouch();
        },
        onEnd: (r) => showResult(r),
      });
      if (wait) {
        screen = "serveready"; setPlaying(false);
        showOver(`<div class="vb-card is-small" role="dialog" aria-label="서브 준비">
            <span class="vb-badge">${icon("volleyball", 26)}</span>
            <h2>서브 준비</h2>
            <p>${IS_TOUCH ? "서브 시작을 누르면" : "서브 시작이나 Space를 누르면"} 시작해요 · 내 서브는 점프로 공에 닿을 때까지 기다려요</p>
            <div class="vb-btnrow is-3">
              <button type="button" class="hk-btn hk-btn--secondary" data-act="menu">모드 고르기</button>
              <button type="button" class="hk-btn hk-btn--secondary" data-act="opts">게임 옵션</button>
              <button type="button" class="hk-btn hk-btn--primary" data-act="serve">서브 시작</button>
            </div>
          </div>`);
        return;
      }
      beginServe();
    }
    function beginServe() {
      if (!engine || !playing || playing.online) return;
      hideOver();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      screen = "play"; setPlaying(true);
      engine.start();
    }
    function pauseGame(why) {
      if (screen === "play" && playing && playing.online) { if (engine) engine.requestPause(); return; }
      if (screen !== "play" || !engine || !engine.pause()) return;
      screen = "pause";
      dropTouch();
      pauseBtn.disabled = true; // 레퍼런스: 일시정지 버튼은 멈추기만 — 이어 가기는 「계속하기」로
      const s = engine.score();
      showOver(`<div class="vb-card is-small" role="dialog" aria-label="일시정지">
          <span class="vb-badge">${icon("pause", 26)}</span>
          <h2>잠깐 멈췄어요</h2>
          <p>${why ? `${esc(why)} · ` : ""}지금 ${s.left} : ${s.right}</p>
          <div class="vb-btnrow">
            <button type="button" class="hk-btn hk-btn--secondary" data-act="quit">그만하기</button>
            <button type="button" class="hk-btn hk-btn--primary" data-act="resume">계속하기</button>
          </div>
        </div>`);
    }
    function resumeGame() {
      if (screen !== "pause" || !engine) return;
      hideOver();
      screen = "play";
      pauseBtn.disabled = false;
      engine.resume();
    }
    // ───── 위에 따로 덮는 창 — 환경설정 · 게임 옵션 · 게임 방법 (한 번에 하나)
    // 아래 화면(메뉴 · 멈춤 · 준비 · 결과 등)은 그대로 두고 덮는다. 혼자 · 둘이는 열면 경기가 멈추고(레퍼런스와 같음), 동료와는 계속된다
    const setOver = $("#vb-setover"), optBtn = $("#vb-opt");
    let layer = ""; // 지금 연 창 — "settings" | "options" | "rules"
    const setOpen = () => !setOver.hidden;
    function openLayer(kind, html) {
      if (soloPlaying()) pauseGame();
      layer = kind;
      setOver.innerHTML = html;
      setOver.hidden = false;
      setOver.scrollTop = 0;
      HKUI.refreshIcons(setOver);
    }
    function closeSettings() {
      if (!setOpen()) return;
      setOver.hidden = true; setOver.innerHTML = ""; layer = "";
    }
    // 위 막대 버튼 — 같은 창을 다시 누르면 닫고, 다른 창이면 바꿔 연다
    function toggleLayer(kind, open) { if (setOpen() && layer === kind) closeSettings(); else open(); }
    // 게임 옵션은 컴퓨터와 · 둘이 한 화면에서만 (동료와는 준비 화면에서 고른다 · 처음 화면에는 같은 줄이 있다)
    const canOptions = () => !!(playing && !playing.online);
    function paintTools() {
      optBtn.hidden = !canOptions();
      if (!canOptions() && layer === "options") closeSettings();
    }

    // 환경설정 — 화면 조작(코트 조이스틱 · 아래 버튼) · 화면 표시(동료와: 기본 60fps · 가볍게 30fps)
    function paintSettings() {
      setOver.querySelectorAll("[data-ctrl]").forEach((b) => b.classList.toggle("is-on", b.dataset.ctrl === pref.ctrl));
      setOver.querySelectorAll("[data-fps]").forEach((b) => b.classList.toggle("is-on", Number(b.dataset.fps) === pref.fps));
    }
    function openSettings() {
      const online = !!(playing && playing.online);
      openLayer("settings", `<div class="vb-card is-small vb-set" role="dialog" aria-label="환경설정">
          <span class="vb-badge">${icon("settings-2", 26)}</span>
          <h2>환경설정</h2>
          <div class="vb-row"><span class="vb-row__k">화면 조작</span><div class="vb-seg"><button type="button" data-ctrl="court">코트 조이스틱</button><button type="button" data-ctrl="buttons">아래 버튼</button></div></div>
          ${online ? `<div class="vb-row"><span class="vb-row__k">화면 표시</span><div class="vb-seg"><button type="button" data-fps="60">기본 · 60fps</button><button type="button" data-fps="30">가볍게 · 30fps</button></div></div>` : ""}
          <p class="vb-mini">${IS_TOUCH ? "코트 조이스틱: 왼손으로 끌어 이동 · 아래 버튼: ← → 를 눌러 이동" : "코트 조이스틱: 경기판 안 조작판(마우스) · 아래 버튼: 경기판 아래 버튼 줄"} · 키보드는 늘 써요 · 소리는 위 막대 소리 버튼으로 켜고 꺼요</p>
          <p class="vb-mini">${online ? "내 화면에만 적용돼요 · 열어 둬도 경기는 계속돼요 · 쉬려면 일시정지를 눌러 주세요" : "내 화면에만 적용돼요 · 열면 경기가 멈춰요 · 난이도 · 목표 점수 · 선수는 게임 옵션에서 바꿔요"}</p>
          <div class="vb-btnrow"><button type="button" class="hk-btn hk-btn--primary" data-act="setclose">닫기</button></div>
        </div>`);
      paintSettings();
    }

    // 게임 옵션 — 난이도 · 목표 점수 · 선수. 적용하면 지금 경기를 끝내고 새 경기(서브 준비)로 (레퍼런스의 「적용하고 새 경기」)
    let draft = null; // 적용하기 전 고른 값
    function paintOptions() {
      if (!draft) return;
      const dc = okLook(draft.char) ? draft.char : 0;
      setOver.querySelectorAll("[data-dlevel]").forEach((b) => b.classList.toggle("is-on", b.dataset.dlevel === draft.level));
      setOver.querySelectorAll("[data-dtarget]").forEach((b) => b.classList.toggle("is-on", Number(b.dataset.dtarget) === draft.target));
      setOver.querySelectorAll("[data-dchar]").forEach((b) => b.classList.toggle("is-on", Number(b.dataset.dchar) === dc));
      setOver.querySelectorAll("[data-drival]").forEach((b) => b.classList.toggle("is-on", b.dataset.drival === String(draft.rival)));
    }
    function openOptions() {
      if (!canOptions()) return;
      const local = playing.mode === "local";
      draft = { level: pref.level, target: pref.target, char: pref.char, rival: pref.rival };
      openLayer("options", `<div class="vb-card is-small vb-set vb-opt" role="dialog" aria-label="게임 옵션">
          <h2>게임 옵션</h2>
          <p>${local ? "목표 점수와 선수를" : "상대 난이도 · 목표 점수 · 선수를"} 골라요. 적용하면 지금 경기를 끝내고 새 경기를 준비해요.</p>
          ${local ? "" : `<div class="vb-row"><span class="vb-row__k">난이도</span><div class="vb-seg">${LEVELS.map(([k, t]) => `<button type="button" data-dlevel="${k}">${t}</button>`).join("")}</div></div>`}
          <div class="vb-row"><span class="vb-row__k">점수</span><div class="vb-seg"><button type="button" data-dtarget="7">7점 빠른 경기</button><button type="button" data-dtarget="15">15점 긴 경기</button></div></div>
          <div class="vb-row"><span class="vb-row__k">${local ? "1P 선수" : "내 선수"}</span><div class="vb-seg vb-chars">${LOOKS.map((l) => `<button type="button" data-dchar="${l.id}">${chrImg(l.id)}${l.name}</button>`).join("")}</div></div>
          <div class="vb-row"><span class="vb-row__k">${local ? "2P 선수" : "상대"}</span><div class="vb-seg vb-chars"><button type="button" data-drival="random"><span class="vb-chr vb-chr--q">?</span>랜덤</button>${LOOKS.map((l) => `<button type="button" data-drival="${l.id}">${chrImg(l.id)}${l.name}</button>`).join("")}</div></div>
          <p class="vb-mini">선수는 모습만 달라요(능력은 같아요) · 랜덤은 ${local ? "1P" : "나"}와 다른 선수 중에서 골라요</p>
          <div class="vb-btnrow"><button type="button" class="hk-btn hk-btn--secondary" data-act="setclose">취소</button><button type="button" class="hk-btn hk-btn--primary" data-act="optapply">적용하고 새 경기</button></div>
        </div>`);
      paintOptions();
    }
    function applyOptions() {
      if (!draft || !canOptions()) { closeSettings(); return; }
      Object.assign(pref, draft);
      draft = null;
      savePref();
      const mode = playing.mode;
      closeSettings();
      startGame(mode, true);
    }

    // 게임 방법 — 규칙 · 조작 · 서브 · 멈춤 · 기록 (경기 중에도 연다)
    function rulesHtml() {
      const k = (t) => `<kbd>${t}</kbd>`;
      const local = !!(playing && playing.mode === "local") || (!playing && pref.mode === "local");
      const keys = IS_TOUCH ? `<li>왼손으로 코트 조이스틱을 좌우로 밀어 이동하고, 오른손으로 <b>점프 · 강타 · 다이빙</b>을 눌러요. 두 손가락을 함께 써도 돼요.</li>`
        : local ? `<li><b>1P</b> ${k("A")}${k("D")} 이동 · ${k("W")}${k("Space")} 점프 · ${k("S")} 다이빙 · ${k("Z")}${k("X")} 강타</li><li><b>2P</b> ${k("←")}${k("→")} 이동 · ${k("↑")} 점프 · ${k("↓")} 다이빙 · ${k("Enter")} 강타</li>`
        : `<li>${k("←")}${k("→")} 또는 ${k("A")}${k("D")} 이동 · ${k("↑")}${k("W")}${k("Space")} 점프 · ${k("↓")}${k("S")} 다이빙 · ${k("Z")}${k("X")} 강타 · ${k("P")}${k("Esc")} 멈춤</li>`;
      return `<div class="vb-card vb-rules" role="dialog" aria-label="게임 방법">
          <h2>옥상 배구 게임 방법</h2>
          <h3>공을 넘기고 코트를 지켜요</h3>
          <ul>
            <li>공이 몸에 닿으면 저절로 받아요. 상대 코트 바닥에 공을 떨어뜨리면 1점이에요.</li>
            <li>먼저 7점(또는 15점)을 내면 이겨요. 듀스도, 터치 수 제한도 없어요.</li>
            <li>내 자리는 머리 위 「나」(둘이 한 화면은 1P · 2P)로 보여 줘요. 발밑 줄은 왼쪽 자리가 이어진 줄, 오른쪽 자리가 끊긴 줄이에요.</li>
          </ul>
          <h3>이동 · 점프 · 다이빙 · 강타</h3>
          <ul>
            ${keys}
            <li>다이빙은 보는 쪽으로 짧게 몸을 날려요. 이동을 함께 누르면 방향을 정할 수 있어요.</li>
            <li>강타를 누르면 약 0.23초 동안 강타 준비예요(손이 빛나요). 그 안에 공이 몸에 닿으면 더 세게 쳐요. 높이 뛰어 치면 내리꽂고, 낮으면 위로 넘겨요. 강타만 눌러서는 뛰지 않아요.</li>
            <li>화면 조작은 코트 조이스틱이 기본이고, 환경설정에서 아래 버튼으로 바꿀 수 있어요(바꾸면 경기가 멈춰요). 기술은 버튼을 다시 눌러야 또 나가요.</li>
          </ul>
          <h3>서브와 멈춤</h3>
          <ul>
            <li>처음에는 서브 시작${IS_TOUCH ? "" : "(또는 Space)"}을 눌러야 조작이 열려요. 서브는 점수를 내준 쪽이 넣고, 첫 서브는 왼쪽이에요.</li>
            <li>서브 공은 서브하는 사람이 뛰어 몸에 닿을 때까지 멈춰 있어요. 시간이 지나도 저절로 나가지 않아요. 컴퓨터도 잠깐 준비한 뒤 직접 뛰어 쳐요.</li>
            <li>득점하면 1.5초 보여 준 뒤 다음 서브예요. 누르던 ${IS_TOUCH ? "손은 떼고 다시 대야" : "키는 풀려서 다시 눌러야"} 움직여요.${IS_TOUCH ? "" : " Space로 시작했다면 한 번 떼고 다시 눌러야 점프해요."}</li>
            <li>${IS_TOUCH ? "" : "P · Esc, "}다른 창 · 탭으로 가기, 경기판 밖으로 초점 옮기기, 화면 크기 바꾸기, 긴 지연은 경기를 멈춰요. 돌아와도 저절로 이어 가지 않으니 「계속하기」를 눌러 주세요.</li>
          </ul>
          <h3>동료와</h3>
          <ul>
            <li>목표 점수는 도전한 사람이, 선수는 각자 골라요. 바꾸면 두 사람 준비가 풀리고, 두 사람 모두 준비하면 3초 뒤 시작해요.</li>
            <li>다른 창을 눌러도 경기는 계속되고 누르던 조작만 풀려요. 다른 탭 · 앱으로 가면 잠시 뒤 멈춰요. 일시정지 뒤에는 두 사람 모두 「계속 준비」를 눌러야 이어 가요.</li>
            <li>두 사람이 보낸 결과가 맞으면 대전 기록에 남아요.</li>
          </ul>
          <h3>기록</h3>
          <ul>
            <li>컴퓨터와 끝낸 경기의 가장 긴 랠리(두 사람이 공을 받은 횟수)만 난이도 · 목표 점수별로 이 브라우저에 남겨요. 아케이드 순위에는 들어가지 않아요.</li>
            <li>하던 경기는 저장되지 않아요. 나가거나 새로 불러오면 사라져요.</li>
          </ul>
          <div class="vb-btnrow"><button type="button" class="hk-btn hk-btn--primary" data-act="setclose">닫기</button></div>
        </div>`;
    }
    function openRules() { openLayer("rules", rulesHtml()); }
    function sideHtml(p) {
      return `<span class="vb-score__side">${HKUI.avatar(p.name, "sm", p.avatarUrl || "")}<span>${esc(p.name)}</span></span>`;
    }
    function timeText(sec) {
      // 먼저 반올림해야 59.6초가 「60초」 · 119.6초가 「1분 60초」로 나오지 않는다
      const t = Math.round(sec), m = Math.floor(t / 60), s = t % 60;
      return m ? (s ? `${m}분 ${s}초` : `${m}분`) : `${s}초`;
    }
    function showResult(r) {
      if (!playing) return;
      screen = "result"; setPlaying(false);
      resultAt = performance.now();
      const P = playing;
      const local = P.mode === "local";
      const title = local ? `${r.winner === 0 ? "1P" : "2P"} 승리!` : r.win ? "이겼어요!" : "아쉽게 졌어요";
      const lead0 = local ? "키보드 하나로 둘이 겨뤘어요" : P.online ? `${esc(P.rival.name)}님과의 경기` : `${esc(P.rival.name)}와 ${r.win ? "겨뤄 이겼어요" : "겨뤘어요"}`;
      // 내 최고 랠리 — 컴퓨터와 끝낸 경기만 난이도 · 목표 점수마다
      let bestNote = "";
      if (P.mode === "cpu") {
        const old = bestOf(P.level, P.target);
        if (r.rally > old) { putBest(P.level, P.target, r.rally); bestNote = old ? " · 최고 랠리 새 기록!" : ""; }
        bestNote = ` · 내 최고 랠리 ${Math.max(old, r.rally)}회${bestNote}`;
      }

      // 동료와 — 두 사람 모두 결과를 서버에 알린다 (서버가 두 점수를 맞춰 보고 승패를 적는다)
      if (P.online && typeof P.report === "function") {
        Promise.resolve(P.report(r)).catch(() => null).then((ok) => {

    }

    // ───── 동료와 — 실시간 1:1 (host 가 판을 계산, guest 는 받아 그림)
    // connect(matchId, h) 는 HKRt.connect(/_shared/rt.js) 와 같은 약속이다 — 시험용 devConnect 도 똑같이 군다
    //   h.onHello({ role, peerHere })   붙을 때마다(다시 붙어도). role 은 서버가 정한다: host = 도전한 사람, guest = 받은 사람

    const PEER_GRACE = 20000; // 상대가 이만큼 안 돌아오면 「상대가 나갔어요」 (그동안 판은 멈춰 있다)

      $("#vb-keys").innerHTML = keysHtml("online");

      const S2 = { closed: false, graceT: 0, role: null, peerHere: false };

      const lost = async (title, sub) => {

        const d = check ? await check().catch(() => null) : null;
        if (d && d.status === "DONE" && screen === "lost") {

          showOver(cardHtml(d.result === "win" ? "trophy" : "flag", title, `${t}${d.reasonLabel ? ` · ${d.reasonLabel}` : ""}`, `<button type="button" class="hk-btn hk-btn--primary" data-act="menu">처음으로</button>`));
        }

      // 상대가 안 보임 — 판을 멈추고 기다린다. 경기 전(기다리는 중)이면 그냥 계속 기다린다
      const peerAway = () => {

      function begin(role) {

        engine = HKVolley.create(canvas, {
          mode: role, target, touch: IS_TOUCH, me, rival, fps: pref.fps,
          look: okLook(pref.char) ? pref.char : role === "host" ? 0 : 1, // 고르지 않았으면 주인 파랑 · 손님 주황
          resume: role === "host" ? loadSave() : null, // 주인이 새로고침했으면 그 점수부터

        onPeer: (here) => {

        },
        onMessage: (m) => {

          if (m && m.t === "again" && Number.isInteger(m.id) && m.id > 0) {
            if (playing && playing.online) { playing.againId = m.id; showAgain(m.id); }

          }
          handlers.forEach((fn) => fn(m));
        },
        onClose: (c) => {
          if (S2.closed) return;
          if (c && c.final) lost(c.text || "연결이 끊겼어요");

        },
      });
    }
    // 상대가 결과 화면에서 다시 도전했다 — 내 결과 카드에 「다시 경기 수락」 (수락하면 새 판으로 바로 들어가 준비 화면에서 만난다)
    function showAgain(id) {
      if (!playing || !playing.online || (screen !== "result" && screen !== "court")) return;
      const box = $("#vb-again"), row = $("#vb-endbtns");
      if (!box || !row) return;
      box.hidden = false;
      box.textContent = `${playing.rival.name}님이 다시 도전했어요`;
      const mine = row.querySelector('[data-act="rematch"]');
      if (mine) mine.remove(); // 두 사람이 서로 도전장을 보내지 않게 — 받은 것을 수락한다
      const acc = row.querySelector('[data-act="accept"]');
      if (acc) acc.dataset.id = String(id);
      else row.insertAdjacentHTML("beforeend", `<button type="button" class="hk-btn hk-btn--primary" data-act="accept" data-id="${id}">다시 경기 수락</button>`);
      if (screen === "court") resultBack(); // 접어 둔 결과 카드를 다시 연다
    }
    async function giveUp() {
      if (!playing || !playing.online) return;
      const P = playing;
      const ok = await HKUI.confirmDialog("기권할까요?", "상대의 승리로 경기를 마쳐요.", { confirmLabel: "기권하기", cancelLabel: "계속하기" });
      if (!ok || playing !== P) return;

    }
    // 온라인 준비 화면 — 경기 전: 목표 점수(도전한 사람만) · 준비, 일시정지 중: 계속 준비. 엔진이 상태가 바뀔 때마다 알려 준다
    function showLobby(L) {
      if (!playing || !playing.online || !["play", "ready", "opause"].includes(screen)) return;
      const who2 = (on, name, here, look) => `<div class="${on ? "is-on" : ""}">${icon(on ? "check-circle-2" : here ? "circle" : "loader", 15)}${okLook(look) && here ? `<img class="vb-chr is-sm" src="${HKVolley.thumb(look)}" alt="">` : ""}${esc(name)} · ${on ? "준비 완료" : here ? "준비 전" : "들어오는 중…"}</div>`;

        showOver(`<div class="vb-card is-small" role="dialog" aria-label="경기 준비">

            <h2>경기를 준비해 주세요</h2>

            <div class="vb-row"><span class="vb-row__k">내 선수</span><div class="vb-seg vb-chars">${LOOKS.map((l) => `<button type="button" data-olook="${l.id}" class="${L.looks && L.looks[0] === l.id ? "is-on" : ""}">${chrImg(l.id)}${l.name}</button>`).join("")}</div></div>
            <div class="vb-who">${who2(L.ready[0], "나", true, L.looks && L.looks[0])}${who2(L.ready[1], rv, L.peer, L.looks && L.looks[1])}</div>
            <div class="vb-btnrow">
              <button type="button" class="hk-btn hk-btn--secondary" data-act="menu">그만두기</button>
              <button type="button" class="hk-btn hk-btn--primary" data-act="ready" data-on="${L.ready[0] ? 0 : 1}">${L.ready[0] ? "준비 취소" : "준비"}</button>
            </div>
            <div class="vb-mini">${L.host ? "목표 점수는 도전한 내가, 선수는 각자 골라요" : "목표 점수는 도전한 사람이, 선수는 각자 골라요"} · 바꾸면 두 사람 준비가 풀려요 · 선수 능력은 같아요 · 두 사람 모두 준비하면 3초 뒤 시작해요</div>
          </div>`);
      } else if (L.paused) {
        screen = "opause";
        dropTouch();

        const why = {
          pause: `${by} 일시정지를 눌렀어요`,
          away: `${by} 다른 화면으로 가서 멈췄어요`,
          slow: `${L.pausedBy === "me" ? "내" : `${esc(rv)}님`} 조작 신호가 늦어 멈췄어요`,

            <span class="vb-badge">${icon("pause", 26)}</span>
            <h2>잠깐 멈췄어요</h2>
            <p>${why} · 두 사람 모두 계속 준비를 누르면 3초 뒤 이어서 해요</p>
            <div class="vb-who">${who2(L.ready[0], "나", true)}${who2(L.ready[1], rv, L.peer)}</div>
            <div class="vb-btnrow">
              <button type="button" class="hk-btn hk-btn--secondary" data-act="giveup">기권하기</button>
              <button type="button" class="hk-btn hk-btn--primary" data-act="ready" data-on="${L.ready[0] ? 0 : 1}">${L.ready[0] ? "준비 취소" : "계속 준비"}</button>

    }
    // 시험용 연결 — 같은 브라우저의 두 탭이 BroadcastChannel 로 주고받는다. HKRt.connect 와 같은 순서 · 모양으로 알린다
    function devConnect(matchId, h) {
      const role = /^#rt-host/.test(location.hash) ? "host" : "guest";
      const ch = new BroadcastChannel(`hk-volley-dev-${matchId}`);
      const id = Math.random().toString(36).slice(2);
      const lag = Number((location.hash.split(":")[1] || "0").replace(/\D/g, "")) || 0;
      let closed = false;
      const post = (o) => { if (closed) return false; try { ch.postMessage({ from: id, ...o }); return true; } catch (_) { return false; } };
      ch.onmessage = (e) => {
        const d = e.data;
        if (closed || !d || d.from === id) return;
        if (d.hello) { if (h.onPeer) h.onPeer(true); if (d.hello === 1) post({ hello: 2 }); return; }
        if (d.bye) { if (h.onPeer) h.onPeer(false); return; }
        const run = () => !closed && h.onMessage && h.onMessage(d.m);
        if (lag) setTimeout(run, lag); else run();
      };
      setTimeout(() => { if (closed) return; if (h.onHello) h.onHello({ role, peerHere: false }); post({ hello: 1 }); }, 0);
      const bye = () => post({ bye: 1 });
      addEventListener("pagehide", bye);
      return {
        send: (m) => post({ m }),
        close: () => { if (closed) return; bye(); closed = true; ch.close(); removeEventListener("pagehide", bye); if (h.onClose) h.onClose({ final: true }); },
      };
    }
    function loadScript(src) {

    const sleep = (ms) => new Promise((f) => setTimeout(f, ms));
    // 경기 결과 알리기 — 두 사람 모두 보낸다. 점수는 세계 기준 [주인(도전한 사람), 손님(받은 사람)].
    // 서버 대전 엔진(versus_volley.act)이 data.score 를 받아 두 사람 것이 같으면 승패를 적는다 (STALE_CHECK = False 로 두면 seq 를 따지지 않는다)
    async function reportResult(id, r) {
      const data = { score: [r.left, r.right], target: r.target, rally: r.rally, sec: r.sec };
      // 서버는 수락 뒤 40초가 지나야 결과를 받는다(VOLLEY_TOO_EARLY) — 빨리 끝난 경기는 받아 줄 때까지 기다렸다 다시 보낸다
      const earlyUntil = Date.now() + 60000;
      let fails = 0;
      while (fails < 3) {
        try {
          const d = await HKApi.matchDetail(id);
          if (d.status !== "ACTIVE") return d.status === "DONE";
          if (d.reported && d.reported.me) return true; // 앞에서 보낸 것이 이미 들어갔다(답만 못 받음)

        } catch (e) {
