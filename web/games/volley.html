          if (++fails < 3) await sleep(800 * fails);
        }
      }
      return false;
    }
    // 보낼 결과를 이 기기에 적어 둔다 — 보내다 실패하거나 창을 닫아도, 다시 들어오면 새 경기 대신 이것을 다시 보낸다
    let saving = 0, leaving = false; // 결과를 보내는 중인 수 · 나가기로 고름(나갈 때 한 번 더 묻지 않게)
    const repKey = (id) => `hk-volley-rep-${id}`;
    const loadRep = (id) => {
      try { const v = JSON.parse(localStorage.getItem(repKey(id)) || "null"); return v && Number.isInteger(v.left) && Number.isInteger(v.right) && Date.now() - v.at < 3 * 3600e3 ? v : null; } catch (_) { return null; }
    };
    const putRep = (id, r) => {
      try { localStorage.setItem(repKey(id), JSON.stringify({ left: r.left, right: r.right, me: r.me, rival: r.rival, target: r.target, rally: r.rally, sec: r.sec, at: Date.now() })); } catch (_) { /* 저장 못 해도 보내기는 그대로 */ }
    };
    const dropRep = (id) => { try { localStorage.removeItem(repKey(id)); } catch (_) { /* 없음 */ } };
    async function sendResult(id, r) {
      putRep(id, r);
      saving++;
      try {
        const ok = await reportResult(id, r);
        if (ok) dropRep(id);
        return ok;
      } finally { saving--; }
    }
    // 대전 목록 — 도전 · 수락은 공용 HKMatch. 수락하면 #m{id} 로 들어온다 (ONLINE_READY 일 때만)
    let lobbyPoll = 0;
    async function showOnlineLobby() {
      stopEngine(); closeConn(); clearInterval(lobbyPoll);
      screen = "lobby"; setPlaying(false);
      showOver(`<div class="vb-card is-wide"><div id="vb-lobby"></div></div>`);
      const box = $("#vb-lobby");
      const score = (m) => (Array.isArray(m.score) && m.score.length === 2 ? `${m.score[0]} : ${m.score[1]}` : "");
      await HKMatch.lobby(box, KEY, {
        title: "옥상 배구 — 동료와", lead: "동료에게 도전장을 보내요. 상대가 수락하면 둘 다 들어와 실시간으로 겨뤄요.",
        bot: false, rankNote: "같은 상대에게 하루에 거둔 승은 1승으로 쳐요", rankEmpty: "아직 끝난 경기가 없어요",
        labels: { myTurn: "들어갈 경기", waiting: "들어갈 경기", turnTag: "들어가기", waitTag: "들어가기", recent: "최근 경기" },
        rowNote: (m) => ["실시간 경기", HKMatch.due(m.deadlineAt)].filter(Boolean).join(" · "),
        resultNote: (m) => [score(m), HKMatch.reason(m)].filter(Boolean).join(" · ") || "경기 끝",
      });
      if (screen !== "lobby" || !box.isConnected) return;
      const back = box.querySelector(".gk__back");
      if (back) { back.textContent = "‹ 처음으로"; back.setAttribute("href", "#"); }
      box.onclick = async (e) => {
        const t = e.target.closest("button, a");
        if (!t) return;
        if (t.getAttribute("href") === "#") { e.preventDefault(); location.hash = ""; showMenu(); return; }
        await HKMatch.act(t, KEY, showOnlineLobby);
      };
      // 내가 보낸 도전을 상대가 받으면 바로 들어간다 (실시간이라 둘 다 들어와야 시작)
      const sent = new Set([...box.querySelectorAll("[data-decline]")].filter((b) => !b.closest(".gk__row").querySelector("[data-accept]")).map((b) => Number(b.dataset.decline)));
      if (!sent.size) return;
      lobbyPoll = setInterval(async () => {
        if (screen !== "lobby") { clearInterval(lobbyPoll); return; }
        const d = await HKApi.matchOverview(KEY).catch(() => null);
        if (!d || screen !== "lobby") return;
        const m = [...(d.myTurn || []), ...(d.waiting || [])].find((x) => sent.has(x.id) && x.status === "ACTIVE");
        if (!m) return;
        clearInterval(lobbyPoll);
        HKUI.toast(`${m.opponent ? m.opponent.name : "상대"}님이 도전을 받았어요`);
        location.hash = `m${m.id}`;
      }, 4000);
    }
    const endBtns = `<button type="button" class="hk-btn hk-btn--secondary" data-act="menu">처음으로</button><button type="button" class="hk-btn hk-btn--primary" data-act="lobby">대전 목록</button>`;
    // 끝난 경기 — 서버에 적힌 결과
    function showServerResult(m) {
      screen = "lost"; setPlaying(false);
      const t = m.result === "win" ? "이긴 경기예요" : m.result === "lose" ? "진 경기예요" : "비긴 경기예요";
      const sc = Array.isArray(m.score) && m.score.length === 2 ? `${m.score[0]} : ${m.score[1]}` : "";
      showOver(cardHtml(m.result === "win" ? "trophy" : "flag", t, [`${m.opponent ? m.opponent.name : "상대"}님과의 경기`, sc, m.reasonLabel].filter(Boolean).join(" · "), endBtns));
    }
    // 내 결과는 들어갔고 상대 결과를 기다리는 판 — 새 경기를 열지 않는다. 5초마다 물어 끝나면 서버 결과로 바꾼다
    let sentPoll = 0;
    function showSent(id) {
      clearInterval(sentPoll);
      screen = "sent"; playing = null; setPlaying(false);
      showOver(cardHtml("send", "결과를 보냈어요", "상대 결과가 오면 대전 기록에 남아요", endBtns));
      const still = () => screen === "sent" && location.hash === `#m${id}`;
      sentPoll = setInterval(async () => {
        if (!still()) { clearInterval(sentPoll); return; }
        const d = await HKApi.matchDetail(id).catch(() => null);
        if (!d || !still() || d.status === "ACTIVE") return;
        clearInterval(sentPoll);
        if (d.status === "DONE") showServerResult(d);
      }, 5000);
    }
    // 못 보낸 결과가 이 기기에 남아 있다 — 새 경기 대신 그것을 다시 보낸다
    async function resendResult(id, saved, m) {
      screen = "result"; playing = null; setPlaying(false);
      const rivalName = (m.opponent && m.opponent.name) || "상대";
      const sc = Number.isInteger(saved.me) && Number.isInteger(saved.rival) ? ` · ${saved.me} : ${saved.rival}` : "";
      showOver(cardHtml("send", "결과를 다시 보내는 중…", `${rivalName}님과의 경기${sc}`));
      const ok = await sendResult(id, saved);
      if (screen !== "result" || location.hash !== `#m${id}`) return;
      const d = ok ? await HKApi.matchDetail(id).catch(() => null) : null;
      if (screen !== "result" || location.hash !== `#m${id}`) return;
      if (d && d.status === "DONE") return showServerResult(d);
      if (ok) return showSent(id);
      screen = "lost";
      showOver(cardHtml("wifi-off", "결과를 아직 보내지 못했어요", "대전 목록에서 이 경기에 다시 들어오면 다시 보내요", endBtns));
    }
    async function openMatch(id) {
      stopEngine(); closeConn(); clearInterval(lobbyPoll); clearInterval(sentPoll);
      screen = "connect"; setPlaying(false);
      showOver(cardHtml("wifi", "경기를 불러오는 중…", ""));
      let m;
      try { m = await HKApi.matchDetail(id); } catch (e) { HKMatch.fail(e); history.replaceState(null, "", location.pathname); return showMenu(); }
      if (m.game !== KEY) { location.href = `/games/${m.game}#m${id}`; return; }
      if (m.status === "DONE") { dropRep(id); return showServerResult(m); }
      if (m.status !== "ACTIVE") {
        dropRep(id);
        HKUI.toast(m.status === "PENDING" ? "상대가 아직 도전을 받지 않았어요" : "이미 끝난 도전이에요");
        history.replaceState(null, "", location.pathname);
        return showOnlineLobby();
      }
      // 내 결과는 이미 들어갔다 — 새 경기를 열면 0 : 0 부터 다시 시작돼 버린다
      if (m.reported && m.reported.me) { dropRep(id); return showSent(id); }
      const saved = loadRep(id);
      if (saved) return resendResult(id, saved, m);
      if (!window.HKRt) { try { await loadScript("/_shared/rt.js"); } catch (_) { HKUI.toast("실시간 연결을 열지 못했어요", "error"); return showMenu(); } }
      const rival = { id: (m.opponent && m.opponent.id) || null, name: (m.opponent && m.opponent.name) || "상대", avatarUrl: (m.opponent && m.opponent.avatarUrl) || "" };
      playOnline({
        matchId: id, rival, target: [7, 15].includes(Number(m.target)) ? Number(m.target) : 7,
        // 자리는 연결이 알려 준 role(서버가 정함)을 쓴다. 혹시 없으면 판 정보의 role
        fallbackRole: m.role === "host" || m.role === "guest" ? m.role : null,
        connect: (mid, h) => window.HKRt.connect(mid, h),
        report: (r) => sendResult(id, r),
        resign: () => HKApi.matchResign(id).catch(() => null),
        check: () => HKApi.matchDetail(id),
      });
    }

    // ───── 업무 시간이면 게임 대신 안내
    const status = await HKApi.playStatus().catch(() => ({ open: true }));
    function route() {
      const dev = /^#rt-(host|guest)/.exec(location.hash);
      const mm = /^#m(\d+)$/.exec(location.hash);
      if (dev && DEV) {
        const role = dev[1];
        return playOnline({ matchId: "dev", fallbackRole: role, target: pref.target, rival: { name: role === "host" ? "손님(시험)" : "주인(시험)" }, connect: devConnect });
      }
      if (mm && ONLINE_READY) return openMatch(Number(mm[1]));
      showMenu();
    }
    if (!status.open) {
      engine = HKVolley.create(canvas, { mode: "demo", target: 99 });
      showOver(`<div class="vb-card is-small">${HKPlay.closedHtml(status.opensAt)}</div>`);
      over.querySelector(".hk-play-closed").style.cssText = "border:0;padding:8px 4px";
      setInterval(async () => { const st = await HKApi.playStatus().catch(() => null); if (st && st.open) location.reload(); }, 60000);
      return;
    }
    route();
    addEventListener("hashchange", () => { closeConn(); route(); });
    addEventListener("pagehide", closeConn);
    // 결과를 보내는 동안만 창을 닫거나 새로 불러올 때 한 번 묻는다
    addEventListener("beforeunload", (e) => { if (saving > 0 && !leaving) { e.preventDefault(); e.returnValue = ""; } });

    // ───── 화면 버튼
    const overClick = (e) => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      // 고른 뒤에는 버튼에서 손을 뗀다 — 이어서 Enter · Space 를 누르면 바로 시작
      if (b.dataset.mode) { pref.mode = b.dataset.mode; savePref(); HKSound.play("select"); paintMenu(); b.blur(); return; }
      if (b.dataset.level) { pref.level = b.dataset.level; savePref(); HKSound.play("tap"); paintMenu(); b.blur(); return; }
      if (b.dataset.target) { pref.target = Number(b.dataset.target); savePref(); HKSound.play("tap"); paintMenu(); b.blur(); return; }
      if (b.dataset.char) { pref.char = Number(b.dataset.char); savePref(); HKSound.play("tap"); paintMenu(); b.blur(); return; }
      if (b.dataset.rival) { pref.rival = b.dataset.rival === "random" ? "random" : Number(b.dataset.rival); savePref(); HKSound.play("tap"); paintMenu(); b.blur(); return; }
      if (b.dataset.otarget) { if (engine) engine.setTarget(Number(b.dataset.otarget)); HKSound.play("tap"); return; }
      // 동료와 · 경기 전 — 내 선수 (바꾸면 두 사람 준비가 풀린다)
      if (b.dataset.olook) { pref.char = Number(b.dataset.olook); savePref(); if (engine) engine.setLook(pref.char); HKSound.play("tap"); return; }
      // 게임 옵션 — 적용하기 전 고르기
      if (b.dataset.dlevel && draft) { draft.level = b.dataset.dlevel; paintOptions(); HKSound.play("tap"); return; }
      if (b.dataset.dtarget && draft) { draft.target = Number(b.dataset.dtarget) === 15 ? 15 : 7; paintOptions(); HKSound.play("tap"); return; }
      if (b.dataset.dchar && draft) { draft.char = Number(b.dataset.dchar); paintOptions(); HKSound.play("tap"); return; }
      if (b.dataset.drival && draft) { draft.rival = b.dataset.drival === "random" ? "random" : Number(b.dataset.drival); paintOptions(); HKSound.play("tap"); return; }
      // 환경설정 — 화면 조작 · 화면 표시
      if (b.dataset.ctrl) { pref.ctrl = b.dataset.ctrl; savePref(); dropTouch(); paintMove(); layout(); paintSettings(); HKSound.play("tap"); return; }
      if (b.dataset.fps) { pref.fps = Number(b.dataset.fps) === 30 ? 30 : 60; savePref(); if (engine && engine.setFps) engine.setFps(pref.fps); paintSettings(); HKSound.play("tap"); return; }
      if (b.id === "vb-go") {
        if (pref.mode === "online") { if (ONLINE_READY) showOnlineLobby(); return; }
        return startGame(pref.mode);
      }
      const act = b.dataset.act;
      if (act === "setclose") return closeSettings();
      if (act === "optapply") return applyOptions();
      if (act === "opts") { b.blur(); return openOptions(); } // 닫은 뒤 Space 가 이 버튼을 다시 누르지 않고 서브를 시작하게
      if (act === "resume") return resumeGame();
      if (act === "serve") return beginServe();
      if (act === "court") return courtView();
      if (act === "accept") {
        const id = Number(b.dataset.id);
        if (!(id > 0)) return;
        b.disabled = true;
        HKApi.matchAccept(id).then(() => { closeConn(); location.hash = `m${id}`; })
          .catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "ready") { if (engine) engine.setReady(b.dataset.on === "1"); HKSound.play("select"); return; }
      if (act === "giveup") return giveUp();
      if (act === "rematch" && playing && playing.rival && playing.rival.id) {
        b.disabled = true;
        HKApi.matchCreate(Number(playing.rival.id), KEY).then((m) => {
          // 같은 연결로 상대 결과 화면에 「다시 경기 수락」을 띄운다 — 못 받아도 상대 대전 목록에 도전장으로 남는다
          const id = m && Number(m.id);
          if (id > 0 && conn) { try { conn.send({ t: "again", id }); } catch (_) { /* 연결이 끊겼으면 목록으로만 */ } }
          HKUI.toast("다시 도전장을 보냈어요 · 상대가 받으면 바로 들어가요");
          // 보낸 메시지가 나간 뒤에 연결을 닫는다 (대전 목록이 수락을 기다렸다가 새 판으로 들어간다)
          setTimeout(() => { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); showOnlineLobby(); }, 300);
        }).catch((err) => { b.disabled = false; HKMatch.fail(err); });
        return;
      }
      if (act === "quit" || act === "menu") { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); return showMenu(); }
      if (act === "lobby") { closeConn(); if (location.hash) history.replaceState(null, "", location.pathname); return showOnlineLobby(); }
      if (act === "again" && playing) return startGame(playing.mode, true);
    };
    over.addEventListener("click", overClick);
    setOver.addEventListener("click", overClick);
    // 일시정지 버튼은 멈추기만 한다 (레퍼런스와 같음 — 이어 가기는 「계속하기」)
    $("#vb-pause").onclick = (e) => { e.currentTarget.blur(); if (screen === "play") pauseGame(); };
    $("#vb-set").onclick = (e) => { e.currentTarget.blur(); toggleLayer("settings", openSettings); };
    optBtn.onclick = (e) => { e.currentTarget.blur(); toggleLayer("options", openOptions); };
    $("#vb-rules").onclick = (e) => { e.currentTarget.blur(); toggleLayer("rules", openRules); };
    // 전체 화면 — 브라우저 전체 화면(지원하는 곳만 버튼을 보인다 · 아이폰은 이 페이지가 이미 꽉 찬 화면). 크기가 바뀌니 혼자 · 둘이는 멈춘다(레퍼런스와 같음)
    const fullBtn = $("#vb-full"), fsRoot = document.documentElement;
    const canFull = !!(document.fullscreenEnabled && fsRoot.requestFullscreen && document.exitFullscreen);
    function paintFull() {
      const on = !!document.fullscreenElement;
      fullBtn.innerHTML = `${icon(on ? "minimize" : "maximize")}<span>${on ? "화면 축소" : "전체 화면"}</span>`;
      fullBtn.setAttribute("aria-label", on ? "전체 화면 닫기" : "전체 화면으로 보기");
      fullBtn.setAttribute("aria-pressed", on ? "true" : "false");
      HKUI.refreshIcons(fullBtn);
    }
    fullBtn.hidden = !canFull;
    if (canFull) {
      paintFull();
      // 켜고 끌 때마다 혼자 · 둘이 경기는 멈춘다 — 크기가 그대로인 화면(이미 꽉 찬 창 등)이어도 (레퍼런스와 같음)
      document.addEventListener("fullscreenchange", () => { paintFull(); if (soloPlaying()) pauseGame("화면 크기가 바뀌어 멈췄어요"); });
      fullBtn.onclick = (e) => {
        e.currentTarget.blur();
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else fsRoot.requestFullscreen().catch(() => HKUI.toast("전체 화면을 열지 못했어요"));
      };
    }
    $("#vb-back").addEventListener("click", async (e) => {
      // 결과를 남기는 중(빨리 끝난 경기는 서버가 받아 줄 때까지 기다린다) — 나가면 결과가 안 들어가 무승부가 될 수 있다
      if (saving > 0 && screen !== "play" && screen !== "pause") {
        e.preventDefault();
        const ok = await HKUI.confirmDialog("결과를 남기는 중이에요", "지금 나가면 무승부가 될 수 있어요.", { confirmLabel: "나가기", cancelLabel: "기다리기" });
        if (ok) { leaving = true; closeConn(); location.href = HKRoutes.lounge; }
        return;
      }
      if (!["play", "pause", "ready", "opause"].includes(screen)) return;
      e.preventDefault();
      if (playing && playing.online) {
        // 동료와 — 시작 전이면 그냥 나가고(나중에 다시 들어올 수 있다), 경기 중이면 기권
        const before = !engine || engine.phase() === "wait";
        const ok = await HKUI.confirmDialog("경기를 그만할까요?", before ? "아직 시작 전이에요. 나중에 대전 목록에서 다시 들어올 수 있어요." : "그만하면 이 경기는 기권으로 져요.", { confirmLabel: "그만하기", cancelLabel: "계속하기" });
        if (!ok || !["play", "ready", "opause"].includes(screen)) return;
        if (!before && engine && !engine.isOver() && playing.resign) await playing.resign();
        closeConn(); location.href = HKRoutes.lounge;
        return;
      }
      const wasPlaying = screen === "play";
      if (wasPlaying && playing && !playing.online) pauseGame();
      if (await HKUI.confirmDialog("경기를 그만할까요?", "지금 경기는 저장되지 않아요.", { confirmLabel: "그만하기", cancelLabel: "계속하기" })) {
        closeConn(); location.href = HKRoutes.lounge;
      } else if (wasPlaying && screen === "pause") resumeGame();
    });
    addEventListener("keydown", (e) => {
      if (document.querySelector(".hk-dialog__overlay")) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      // 환경설정 · 게임 옵션 · 게임 방법이 열려 있으면 Esc 로 닫기만 — 아래 화면의 Space · Enter 단축키는 쉬게
      // (창 안 버튼은 Space · Enter 로 누를 수 있고, 동료와는 경기 키가 그대로 먹는다)
      if (setOpen()) {
        if (e.code === "Escape") { e.preventDefault(); closeSettings(); }
        else if ((e.code === "Space" || e.code === "Enter" || e.code === "KeyP") && !(playing && playing.online && screen === "play") && !(t && t.closest && t.closest("#vb-setover button"))) e.preventDefault();
        return;
      }
      // P · Esc 는 멈추기만 한다 (레퍼런스와 같음 — 이어 가기는 「계속하기」). 결과에서 Esc 는 코트 보기
      if (e.code === "Escape" || e.code === "KeyP") {
        if (screen === "play") { e.preventDefault(); if (!e.repeat) pauseGame(); }
        else if (screen === "pause") e.preventDefault();
        else if (screen === "result" && e.code === "Escape") { e.preventDefault(); courtView(); }
        return;
      }
      if (e.repeat) return;
      const onBtn = t && t.closest && t.closest("button, a");
      // 서브 준비 · 득점 안내 중 멈춤은 Space 로도 시작 · 계속 (레퍼런스의 Space 단축키). 이 키는 점프로 새지 않게 여기서 끝낸다
      if (e.code === "Space" && !onBtn && (screen === "serveready" || (screen === "pause" && engine && engine.phase() === "point"))) {
        e.preventDefault(); e.stopImmediatePropagation();
        if (screen === "serveready") beginServe(); else resumeGame();
        return;
      }
      if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") {
        if (screen === "menu" && !onBtn) { e.preventDefault(); $("#vb-go")?.click(); }
        else if ((screen === "ready" || screen === "opause") && !onBtn) { e.preventDefault(); over.querySelector('[data-act="ready"]')?.click(); }
        else if (screen === "result" && !onBtn && playing && !playing.online) {
          e.preventDefault();
          if (performance.now() - resultAt > 900) startGame(playing.mode, true); // 카드가 뜬 직후 연타는 무시
        }
      }
    });
    // 혼자 · 둘이 한 화면 — 다른 창으로 가거나 · 창 크기가 바뀌거나 · 경기판 밖으로 초점이 가면 멈춘다 (돌아와도 저절로 이어 가지 않는다)
    const soloPlaying = () => screen === "play" && playing && !playing.online;
    const inBoard = (el) => !!(el && el.closest && el.closest("#vb"));
    // 이 버튼들은 눌렀을 때 저마다 멈춘다 (전체 화면은 크기가 바뀌어 멈춘다)
    const ownStop = (el) => !!(el && el.closest && el.closest("#vb-pause, #vb-back, #vb-set, #vb-opt, #vb-rules, #vb-full"));
    document.addEventListener("pointerdown", (e) => { if (soloPlaying() && !inBoard(e.target) && !ownStop(e.target)) pauseGame("경기판 밖을 눌러 멈췄어요"); }, true);
    document.addEventListener("focusin", (e) => { if (soloPlaying() && !inBoard(e.target) && !ownStop(e.target)) pauseGame("경기판 밖으로 초점이 옮겨 가 멈췄어요"); });
    document.addEventListener("visibilitychange", () => { if (document.hidden && soloPlaying()) pauseGame(); });
    addEventListener("blur", () => { if (soloPlaying()) pauseGame("다른 창으로 가서 멈췄어요"); });
    let winSize = `${innerWidth}x${innerHeight}`;
    addEventListener("resize", () => {
      const now = `${innerWidth}x${innerHeight}`;
      if (now === winSize) return;
      winSize = now;
      if (soloPlaying()) pauseGame("화면 크기가 바뀌어 멈췄어요");
    });
    // 보이는 화면 크기(휴대폰 주소창 · 확대 등)가 바뀌어도 멈춘다 (레퍼런스: visualViewport resize)
    if (window.visualViewport) {
      const vv = window.visualViewport;
      let vvSize = `${Math.round(vv.width)}x${Math.round(vv.height)}`;
      vv.addEventListener("resize", () => {
        const now = `${Math.round(vv.width)}x${Math.round(vv.height)}`;
        if (now === vvSize) return;
        vvSize = now;
        if (soloPlaying()) pauseGame("화면 크기가 바뀌어 멈췄어요");
      });
    }

    // ───── 휴대폰 조작판 — 이동 막대 + 점프 · 강타 · 다이빙 (여러 손가락 동시에)
    const stick = $("#vb-stick"), knob = $("#vb-knob");
    // 막대는 좌우만 — 가운데에서 막대 폭의 12%(적어도 8px) 넘게 밀면 그쪽으로 간다
    let stickId = null, stickDir = null, sx0 = 0, sy0 = 0, knobR = 40, dead = 12;
    // 방향이 바뀔 때만 누르고 뗀다 — 단계가 바뀌어 풀린 방향은 막대를 가운데로 돌렸다 다시 밀어야 먹는다 (레퍼런스와 같음)
    function stickSet(dx) {
      const dir = dx < -dead ? "left" : dx > dead ? "right" : null;
      if (dir !== stickDir) {
        if (stickDir && engine) engine.control(stickDir, false);
        stickDir = dir;
        if (dir && engine) engine.control(dir, true);
      }
      knob.style.transform = `translateX(${clampN(dx, -knobR, knobR)}px)`;
    }
    // 터치가 취소됨(전화 · 알림 · 시스템 제스처 등) — 혼자 · 둘이는 멈춘다(레퍼런스와 같음), 온라인은 조작만 푼다
    const touchCancel = () => { if (soloPlaying()) pauseGame("터치가 취소돼 멈췄어요"); };
    stick.addEventListener("pointerdown", (e) => {
      if (stickId !== null || vb.classList.contains("is-btnmove")) return;
      stickId = e.pointerId;
      const base = stick.querySelector(".vb-stick__base").getBoundingClientRect();
      knobR = Math.max(30, base.width / 2 - 24); // 막대 크기에 맞춰 손잡이가 움직이는 거리
      dead = Math.max(8, base.width * 0.12);
      // 막대 둘레를 누르면 거기서부터, 먼 곳을 누르면 그 자리를 가운데로 본다
      const inBase = Math.hypot(e.clientX - (base.left + base.width / 2), e.clientY - (base.top + base.height / 2)) < base.width / 2;
      sx0 = inBase ? base.left + base.width / 2 : e.clientX;
      sy0 = inBase ? base.top + base.height / 2 : e.clientY;
      stick.classList.add("is-on");
      try { stick.setPointerCapture(e.pointerId); } catch (_) { stickId = null; stick.classList.remove("is-on"); touchCancel(); return; }
      stickSet(e.clientX - sx0);
    });
    stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickSet(e.clientX - sx0); });
    // 손을 뗌(up) · 취소(cancel) · 잡기를 잃음(lostpointercapture — 뗄 때도 오지만 그땐 이미 놓은 뒤라 지나간다)
    const stickEnd = (e, cancel) => { if (e.pointerId !== stickId) return; stickId = null; stick.classList.remove("is-on"); stickSet(0); if (cancel) touchCancel(); };
    stick.addEventListener("pointerup", (e) => stickEnd(e, false));
    stick.addEventListener("pointercancel", (e) => stickEnd(e, true));
    stick.addEventListener("lostpointercapture", (e) => stickEnd(e, true));
    const drops = [() => {
      if (stickId === null) { stickSet(0); return; }
      const id = stickId;
      stickId = null; // 먼저 놓아야 아래 lostpointercapture 가 「취소」로 멈추지 않는다
      stick.classList.remove("is-on");
      stickSet(0);
      try { stick.releasePointerCapture(id); } catch (_) { /* 이미 놓음 */ }
    }];
    // 점프 · 강타 · 다이빙(누를 때 한 번) · ← →(누르는 동안)
    document.querySelectorAll("#vb-btns .vb-btn, .vb-move .vb-btn").forEach((b) => {
      const act = b.dataset.act;
      let pid = null;
      b.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (pid !== null) return;
        pid = e.pointerId;
        try { b.setPointerCapture(e.pointerId); } catch (_) { pid = null; touchCancel(); return; }
        b.classList.add("is-down");
        if (engine) engine.control(act, true);
      });
      const up = (e, cancel) => { if (e.pointerId !== pid) return; pid = null; b.classList.remove("is-down"); if (engine) engine.control(act, false); if (cancel) touchCancel(); };
      b.addEventListener("pointerup", (e) => up(e, false));
      b.addEventListener("pointercancel", (e) => up(e, true));
      b.addEventListener("lostpointercapture", (e) => up(e, true));
      drops.push(() => {
        if (pid === null) return;
        const id = pid;
        pid = null;
        b.classList.remove("is-down");
        if (engine) engine.control(act, false);
        try { b.releasePointerCapture(id); } catch (_) { /* 이미 놓음 */ }
      });
    });
    dropTouchImpl = () => drops.forEach((f) => f());
  })();
  </script>
</body>
</html>
