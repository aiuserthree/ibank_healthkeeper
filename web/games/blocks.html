<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>점심 블록 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    .gm-wrap { margin: 0 auto; display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .gm-hud { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 16px; border-radius: 14px; background: linear-gradient(135deg, #2f6bff, #45c3ff); color: #fff; }
    .gm-stat { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .gm-stat small { font-size: 11.5px; opacity: .85; font-weight: 600; }
    .gm-stat b { font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .gm-stat--score { flex: 1; }
    .gm-stat--score b { font-size: 24px; }
    .gm-stat--sm { width: 56px; }
    .gm-hud__btn { width: 38px; height: 38px; border-radius: 11px; border: 0; background: rgba(255,255,255,.2); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .gm-hud__btn:hover { background: rgba(255,255,255,.3); }
    .gm-hud__btn:disabled { opacity: .45; cursor: default; }
    .gm-main { display: flex; gap: 10px; justify-content: center; align-items: flex-start; }
    .gm-board { position: relative; border-radius: 14px; overflow: hidden; background: #0c1a3a; touch-action: none; box-shadow: 0 6px 20px rgba(15, 35, 90, .18); flex-shrink: 0; }
    .gm-board canvas { display: block; }
    .gm-side { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .gm-card { background: var(--surface-card, #fff); border: 1px solid var(--border-default, #e3e8f2); border-radius: 12px; padding: 10px 10px 12px; }
    .gm-lbl { font-size: 12px; font-weight: 700; color: var(--text-secondary, #475569); margin-bottom: 6px; }
    .gm-next { display: block; margin: 0 auto; }
    .gm-bento-n { font-size: 18px; font-weight: 800; color: var(--color-midnight-navy, #0f1d3d); font-variant-numeric: tabular-nums; }
    .gm-bento-n small { font-size: 12px; font-weight: 600; color: var(--text-muted, #64748b); margin-left: 2px; }
    .gm-bar { height: 8px; border-radius: 99px; background: var(--color-mist, #eef2f8); overflow: hidden; margin-top: 6px; }
    .gm-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ffb648, #ff8a3d); transition: width .3s; }
    .gm-bento-art { display: block; margin: 2px 0 6px; }
    .gm-bento-row { display: flex; align-items: center; gap: 8px; }
    .gm-bento-row .gm-bento-art { flex: 1; min-width: 0; }
    /* 도시락 옆 D 키 — 도시락이 있으면 주황으로 빛나고, 눌러도 꺼내 쓴다 */
    .gm-bkey { flex-shrink: 0; width: 44px; height: 44px; margin: 0 0 6px; border-radius: 10px; border: 1px solid #d5dbe6; border-bottom-width: 4px; background: #f8f9fb; color: #9aa6b8; font-family: inherit; font-size: 22px; font-weight: 900; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
    .gm-bkey.is-ready { background: #fff4e6; border-color: #ffa94d; color: #e8590c; box-shadow: 0 0 0 3px rgba(255, 169, 77, .25); animation: gm-bkey 1.4s ease-in-out infinite; }
    .gm-bkey:active { transform: translateY(2px); border-bottom-width: 2px; }
    @keyframes gm-bkey { 50% { box-shadow: 0 0 0 6px rgba(255, 169, 77, .12); } }
    @media (prefers-reduced-motion: reduce) { .gm-bkey.is-ready { animation: none; } }
    .gm-tip { font-size: 11.5px; line-height: 1.45; color: var(--text-muted, #64748b); }
    .gm-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px 14px; text-align: center; color: #fff; background: rgba(8, 16, 40, .8); backdrop-filter: blur(2px); }
    .gm-overlay[hidden] { display: none; }
    .gm-overlay h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
    .gm-overlay p { margin: 0; font-size: 13px; line-height: 1.55; color: rgba(255,255,255,.86); }
    .gm-overlay .gm-keys { display: grid; grid-template-columns: auto auto; gap: 4px 10px; font-size: 12px; color: rgba(255,255,255,.82); text-align: left; background: rgba(255,255,255,.08); border-radius: 12px; padding: 10px 12px; }
    .gm-overlay .gm-keys b { color: #fff; font-weight: 700; white-space: nowrap; }
    .gm-start { border: 0; border-radius: 12px; padding: 12px 28px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(135deg, #2f6bff, #45c3ff); box-shadow: 0 6px 16px rgba(47, 107, 255, .4); display: inline-flex; align-items: center; gap: 6px; }
    .gm-start:hover { filter: brightness(1.06); }
    .gm-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #ffcf8a; }
    .gm-fx { position: absolute; left: 0; right: 0; top: 34%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    .gm-pop { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.45); animation: gm-pop 1.1s ease-out forwards; white-space: nowrap; }
    .gm-pop--bento { color: #ffcf8a; font-size: 17px; }
    @media (max-width: 420px) { .gm-pop { font-size: 16px; } .gm-pop--bento { font-size: 14px; } }
    .gm-pop--lv { color: #8fe3ff; }
    @keyframes gm-pop { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1.08); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
    .gm-pad { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .gm-pad button[data-act="bento"] { background: #fff4e6; border-color: #ffd8a8; color: #e8590c; gap: 3px; font-weight: 800; }
    .gm-pad button[data-act="bento"].is-empty { opacity: .45; }
    .gm-pad button { height: 56px; border-radius: 14px; border: 1px solid #d6e4ff; background: #eef4ff; color: #2f6bff; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer; }
    .gm-pad button:active, .gm-pad button.is-down { background: #2f6bff; color: #fff; }
    .gm-pad button[data-act="drop"] { background: #2f6bff; color: #fff; border-color: #2f6bff; }
    @media (max-width: 640px), (pointer: coarse) { .gm-pad { display: grid; } .gm-hidepc { display: none; } }
    @media (max-width: 420px) { .gm-stat b { font-size: 17px; } .gm-stat--score b { font-size: 21px; } .gm-stat--sm { width: 46px; } .gm-card { padding: 8px 8px 10px; } .gm-tip { display: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    HKPlay.mountGame({
      key: "blocks",
      setup(stage, ctx) {
        const COLS = 10, ROWS = 18;
        const CLEAR_MS = 220, LOCK_MS = 450, BENTO_FX_MS = 750, OVER_MS = 900;
        const LINE_PTS = [0, 100, 300, 500, 800];
        // 우리만의 조각 세트: 3칸 2종 + 4칸 5종 (+ 10줄마다 도시락 1개 적립 — 원할 때 B 로 꺼내 씀)
        const BENTO_MAX = 3;
        const DEFS = {
          i3: { size: 3, cells: [[0, 1], [1, 1], [2, 1]], color: "#45c3ff" },
          v3: { size: 2, cells: [[0, 0], [1, 0], [1, 1]], color: "#7aa8ff" },
          i4: { size: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]], color: "#2f6bff" },
          t4: { size: 3, cells: [[0, 1], [1, 1], [2, 1], [1, 0]], color: "#5b5ff0" },
          l4: { size: 3, cells: [[0, 1], [1, 1], [2, 1], [2, 0]], color: "#0ea5e9" },
          s4: { size: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]], color: "#14b8a6" },
          o4: { size: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], color: "#93c5fd" },
          bento: { size: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], color: "#ff9f43" },
        };
        const BAG = ["i3", "v3", "i4", "t4", "l4", "s4", "o4"];

        stage.innerHTML = `<div class="gm-wrap">
          <div class="gm-hud">
            <div class="gm-stat gm-stat--score"><small>점수</small><b data-v="score">0</b></div>
            <div class="gm-stat gm-stat--sm"><small>레벨</small><b data-v="level">1</b></div>
            <div class="gm-stat gm-stat--sm"><small>줄</small><b data-v="lines">0</b></div>
            <button type="button" class="gm-hud__btn" data-pause aria-label="일시정지" disabled>${HKUI.icon("pause", 18, "#fff")}</button>
          </div>
          <div class="gm-main">
            <div class="gm-board">
              <canvas class="gm-cv"></canvas>
              <div class="gm-fx"></div>
              <div class="gm-overlay" data-ov></div>
            </div>
            <div class="gm-side">
              <div class="gm-card"><div class="gm-lbl">다음</div><canvas class="gm-next"></canvas></div>
              <div class="gm-card">
                <div class="gm-lbl">도시락</div>
                <div class="gm-bento-row"><canvas class="gm-bento-art"></canvas><button type="button" class="gm-bkey gm-hidepc" data-v="bkey" aria-label="D 키 · 도시락 쓰기" title="D 키 · 도시락 쓰기">D</button></div>
                <div class="gm-bento-n" data-v="bento">0<small>개</small></div>
                <div class="gm-bar"><i data-v="bentobar"></i></div>
                <div class="gm-tip" style="margin-top:4px" data-v="bentonext">다음 도시락까지 10줄</div>
                <div class="gm-tip" style="margin-top:6px"><b>D</b> 키로 원할 때 꺼내 써요 · 착지하면 두 열의 아래 3줄을 비워 줘요</div>
              </div>
            </div>
          </div>
          <div class="gm-pad">
            <button type="button" data-act="rot" aria-label="회전">${HKUI.icon("rotate-cw", 24, "currentColor")}</button>
            <button type="button" data-act="left" aria-label="왼쪽">${HKUI.icon("arrow-left", 24, "currentColor")}</button>
            <button type="button" data-act="right" aria-label="오른쪽">${HKUI.icon("arrow-right", 24, "currentColor")}</button>
            <button type="button" data-act="drop" aria-label="바로 내리기">${HKUI.icon("arrow-down-to-line", 24, "currentColor")}</button>
            <button type="button" data-act="bento" aria-label="도시락 쓰기">${HKUI.icon("package-open", 22, "currentColor")}<small data-v="bentopad">0</small></button>
          </div>
        </div>`;
        HKUI.refreshIcons(stage);

        const $ = (s) => stage.querySelector(s);
        const boardEl = $(".gm-board"), cv = $(".gm-cv"), g = cv.getContext("2d");
        const nextCv = $(".gm-next"), ng = nextCv.getContext("2d");
        const artCv = $(".gm-bento-art"), ag = artCv.getContext("2d");
        const ov = $("[data-ov]"), fxEl = $(".gm-fx"), pauseBtn = $("[data-pause]");
        const sideEl = $(".gm-side"), wrapEl = $(".gm-wrap");
        const V = {};
        stage.querySelectorAll("[data-v]").forEach((el) => (V[el.dataset.v] = el));
        V.bkey.addEventListener("click", (e) => { e.currentTarget.blur(); useBento(); });

        let cell = 24, dpr = 1, sideW = 110;
        let grid, cur, queue, bag, score, lines, level, state, dropAcc, lockAcc, lockMoves;
        let clearing, bentoFx, nextBentoAt, overT, submitted, lastT = 0;
        let bentoStock = 0; // 모아 둔 도시락 개수
        let playMs = 0, speedStep = 0; // 플레이한 시간 · 30초마다 '빨라져요' 알림
        // 효과음 — 판을 하는 동안만 (시작 전·일시정지 중에는 조용히). 옮기기 소리는 몰리지 않게 간격을 둔다
        const sfx = (name, arg) => { if (state === "play") ctx.sfx(name, arg); };
        let lastMoveSfx = 0;

        // ---------- 크기 ----------
        function layout(again = true) {
          const W = stage.clientWidth || 360;
          sideW = W < 420 ? 74 : 140;
          const gap = 10;
          const maxW = W - sideW - gap;
          const maxH = Math.max(320, HKPlay.roomFor(stage, cv));
          cell = Math.floor(Math.min(maxW / COLS, maxH / ROWS, 44));
          cell = Math.max(cell, 15);
          dpr = Math.min(window.devicePixelRatio || 1, 3);
          cv.width = COLS * cell * dpr; cv.height = ROWS * cell * dpr;
          cv.style.width = COLS * cell + "px"; cv.style.height = ROWS * cell + "px";
          sideEl.style.width = sideW + "px";
          wrapEl.style.maxWidth = COLS * cell + gap + sideW + "px";
          const nc = Math.floor(Math.min((sideW - 20) / 4.4, 17));
          const nw = sideW - 22, nh = nc * 7.4;
          nextCv.width = nw * dpr; nextCv.height = nh * dpr; nextCv.style.width = nw + "px"; nextCv.style.height = nh + "px";
          nextCv._c = nc;
          const aw = sideW - 22 - (V.bkey && V.bkey.offsetParent ? 52 : 0), ah = Math.round(Math.min(aw * 0.5, 36));
          artCv.width = aw * dpr; artCv.height = ah * dpr; artCv.style.width = aw + "px"; artCv.style.height = ah + "px";
          drawArt();
          render();
          drawNext();
          // 처음엔 옆 칸이 판보다 길어서 남은 높이를 작게 재므로, 판을 한 번 그린 뒤 다시 맞춘다
          if (again) layout(false);
        }

        // ---------- 상태 ----------
        function emptyRow() { return new Array(COLS).fill(null); }
        function reset() {
          grid = Array.from({ length: ROWS }, emptyRow);
          bag = []; queue = []; refill();
          cur = null; score = 0; lines = 0; level = 1;
          dropAcc = 0; lockAcc = 0; lockMoves = 0;
          clearing = null; bentoFx = null; nextBentoAt = 10; bentoStock = 0; playMs = 0; speedStep = 0; overT = 0; submitted = false;
          fxEl.innerHTML = "";
          updateHud();
        }
        function refill() {
          while (queue.length < 4) {
            if (!bag.length) {
              bag = BAG.slice();
              for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
            }
            queue.push(bag.pop());
          }
        }
        // 내려오는 간격(ms) — 레벨(10줄마다)에 더해 시간이 갈수록 빨라진다 (1분마다 20%씩, 최소 30%)
        function gravity() {
          const timeK = Math.max(0.3, Math.pow(0.8, playMs / 60000));
          return Math.max(55, 650 * Math.pow(0.78, level - 1) * timeK);
        }

        function collide(cells, px, py) {
          for (const [x, y] of cells) {
            const X = px + x, Y = py + y;
            if (X < 0 || X >= COLS || Y >= ROWS) return true;
            if (Y >= 0 && grid[Y][X]) return true;
          }
          return false;
        }
        function spawn() {
          const key = queue.shift(); refill();
          const d = DEFS[key];
          const cells = d.cells.map((c) => c.slice());
          const minY = Math.min(...cells.map((c) => c[1]));
          cur = { key, cells, size: d.size, x: Math.floor((COLS - d.size) / 2), y: -minY };
          dropAcc = 0; lockAcc = 0; lockMoves = 0;
          drawNext();
          if (collide(cur.cells, cur.x, cur.y)) gameOver();
        }
        function grounded() { return cur && collide(cur.cells, cur.x, cur.y + 1); }
        function touched() {
          if (grounded() && lockMoves < 15) { lockAcc = 0; lockMoves++; }
        }
        function move(dx) {
          if (!canAct()) return;
          if (!collide(cur.cells, cur.x + dx, cur.y)) {
            cur.x += dx; touched();
            const now = performance.now();
            if (now - lastMoveSfx >= 90) { lastMoveSfx = now; sfx("tick"); }
          }
        }
        function rotate() {
          if (!canAct() || cur.key === "o4" || cur.key === "bento") return;
          const n = cur.size;
          const rc = cur.cells.map(([x, y]) => [n - 1 - y, x]);
          for (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0], [0, 1]]) {
            if (!collide(rc, cur.x + kx, cur.y + ky)) { cur.cells = rc; cur.x += kx; cur.y += ky; touched(); sfx("swap"); return; }
          }
        }
        function softDrop() {
          if (!canAct()) return;
          if (!collide(cur.cells, cur.x, cur.y + 1)) { cur.y++; dropAcc = 0; }
          else lockAcc = LOCK_MS;
        }
        function dropY() { let y = cur.y; while (!collide(cur.cells, cur.x, y + 1)) y++; return y; }
        function hardDrop() {
          if (!canAct()) return;
          const y = dropY();
          score += 2 * (y - cur.y);
          cur.y = y;
          lock(true);
        }
        function canAct() { return state === "play" && cur && !clearing; }
        // 도시락 꺼내 쓰기 — 지금 떨어지는 조각을 다음 차례로 돌려 두고 도시락을 위에서 새로 떨어뜨린다
        function useBento() {
          if (!canAct() || cur.key === "bento") return;
          if (bentoStock <= 0) { pop("아직 도시락이 없어요"); sfx("invalid"); return; }
          const d = DEFS.bento;
          const cells = d.cells.map((c) => c.slice());
          const x = Math.max(0, Math.min(COLS - d.size, cur.x));
          if (collide(cells, x, 0)) { sfx("invalid"); return; }
          queue.unshift(cur.key);
          cur = { key: "bento", cells, size: d.size, x, y: 0 };
          dropAcc = 0; lockAcc = 0; lockMoves = 0;
          bentoStock--;
          sfx("powerup");
          pop("도시락 출동!", "bento");
          drawNext();
          updateHud();
        }

        function lock(hard) {
          const p = cur; cur = null;
          if (p.key === "bento") { bentoLand(p); return; }
          let top = false;
          for (const [x, y] of p.cells) {
            const X = p.x + x, Y = p.y + y;
            if (Y < 0) { top = true; continue; }
            grid[Y][X] = DEFS[p.key].color;
          }
          updateHud();
          if (top) { gameOver(); return; }
          // 줄이 지워질 때는 checkLines 가 line 을 낸다 — 착지 소리는 줄이 안 찰 때만
          if (!grid.some((row) => row.every(Boolean))) sfx(hard ? "drop" : "land");
          checkLines();
        }
        function checkLines() {
          const rows = [];
          for (let r = 0; r < ROWS; r++) if (grid[r].every(Boolean)) rows.push(r);
          if (rows.length) { clearing = { rows, t: 0 }; sfx("line"); }
          else spawn();
        }
        function finishClear() {
          const rows = clearing.rows; clearing = null;
          grid = grid.filter((_, r) => !rows.includes(r));
          while (grid.length < ROWS) grid.unshift(emptyRow());
          const n = rows.length;
          const base = n <= 4 ? LINE_PTS[n] : 800 + (n - 4) * 300;
          score += base * level;
          pop(n === 1 ? `+${base * level}` : `${n}줄! +${(base * level).toLocaleString("ko-KR")}`);
          lines += n;
          const nl = 1 + Math.floor(lines / 10);
          if (nl > level) { level = nl; pop(`레벨 업! Lv.${level}`, "lv"); sfx("powerup"); }
          let bentos = 0;
          while (lines >= nextBentoAt) { bentos++; nextBentoAt += 10; }
          spawn();
          if (bentos && state === "play") {
            const before = bentoStock;
            bentoStock = Math.min(BENTO_MAX, bentoStock + bentos);
            if (bentoStock > before) pop(`도시락 +1! D로 꺼내 써요 (${bentoStock}개)`, "bento");
          }
          updateHud();
        }
        // 도시락: 착지한 두 열의 아래 3줄을 비우고 그 위를 끌어내림
        function bentoLand(p) {
          const cols = [...new Set(p.cells.map(([x]) => p.x + x))];
          for (const c of cols) {
            const col = [];
            for (let r = 0; r < ROWS - 3; r++) col.push(grid[r][c]);
            for (let r = 0; r < ROWS; r++) grid[r][c] = r < 3 ? null : col[r - 3];
          }
          bentoFx = { cols, t: 0 };
          sfx("explode");
          pop("도시락 냠! 아래 3줄 비움", "bento");
          updateHud();
          checkLines();
        }
        function gameOver() {
          if (state === "play") ctx.sfx("lose");
          state = "over"; cur = null; overT = 0;
          pauseBtn.disabled = true;
        }
        function finishOver() {
          if (submitted) return;
          submitted = true;
          showOverlay(`<h2>쌓기 끝!</h2>
            <p>${level}레벨 · ${lines}줄을 지웠어요</p>
            <p style="font-size:26px;font-weight:900;color:#fff">${score.toLocaleString("ko-KR")}점</p>
            <button type="button" class="gm-start" data-again>${HKUI.icon("rotate-ccw", 18, "#fff")} 다시 하기</button>`);
          ov.querySelector("[data-again]").onclick = startGame;
          ctx.submit(score);
        }

        // ---------- 화면 ----------
        function updateHud() {
          V.score.textContent = score.toLocaleString("ko-KR");
          V.level.textContent = level;
          V.lines.textContent = lines;
          const left = nextBentoAt - lines;
          V.bento.innerHTML = `${bentoStock}<small>개${bentoStock >= BENTO_MAX ? " (최대)" : ""}</small>`;
          V.bentobar.style.width = ((10 - left) / 10) * 100 + "%";
          V.bentonext.textContent = bentoStock >= BENTO_MAX ? "가득 찼어요 · 꺼내 써요!" : `다음 도시락까지 ${left}줄`;
          if (V.bkey) V.bkey.classList.toggle("is-ready", bentoStock > 0);
          if (V.bentopad) {
            V.bentopad.textContent = bentoStock;
            V.bentopad.closest("button").classList.toggle("is-empty", bentoStock <= 0);
          }
        }
        function pop(text, kind) {
          const el = document.createElement("div");
          el.className = "gm-pop" + (kind ? " gm-pop--" + kind : "");
          el.textContent = text;
          fxEl.appendChild(el);
          setTimeout(() => el.remove(), 1150);
        }
        function rr(c, x, y, w, h, r) {
          c.beginPath();
          c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
          c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
        }
        function shade(hex, amt) {
          const n = parseInt(hex.slice(1), 16);
          let r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
          const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
          r = Math.round((t - r) * p + r); gg = Math.round((t - gg) * p + gg); b = Math.round((t - b) * p + b);
          return `rgb(${r},${gg},${b})`;
        }
        function drawBlock(c, px, py, s, color, alpha = 1) {
          const pad = Math.max(1, s * 0.06), w = s - pad * 2, r = s * 0.24;
          c.globalAlpha = alpha;
          const gr = c.createLinearGradient(px, py, px + s, py + s);
          gr.addColorStop(0, shade(color, 0.28)); gr.addColorStop(1, shade(color, -0.12));
          c.fillStyle = gr; rr(c, px + pad, py + pad, w, w, r); c.fill();
          c.fillStyle = "rgba(255,255,255,.35)";
          rr(c, px + pad + s * 0.16, py + pad + s * 0.12, w * 0.42, s * 0.12, s * 0.06); c.fill();
          c.globalAlpha = 1;
        }
        function drawGhost(c, px, py, s, color) {
          const pad = Math.max(1, s * 0.1), w = s - pad * 2;
          c.fillStyle = color; c.globalAlpha = 0.18; rr(c, px + pad, py + pad, w, w, s * 0.2); c.fill();
          c.globalAlpha = 0.7; c.strokeStyle = shade(color, 0.4); c.lineWidth = Math.max(1, s * 0.06); c.stroke();
          c.globalAlpha = 1;
        }
        // 2×2 도시락 그림 (x, y는 좌상단, s는 한 칸 크기)
        function drawBento(c, x, y, s, ghost) {
          const w = s * 2, pad = s * 0.08, r = s * 0.32;
          if (ghost) {
            c.globalAlpha = 0.6; c.strokeStyle = "#ffb648"; c.lineWidth = Math.max(1.5, s * 0.08); c.setLineDash([s * 0.2, s * 0.14]);
            rr(c, x + pad, y + pad, w - pad * 2, w - pad * 2, r); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
            return;
          }
          const gr = c.createLinearGradient(x, y, x, y + w);
          gr.addColorStop(0, "#ffbe6b"); gr.addColorStop(1, "#f08a2c");
          c.fillStyle = gr; rr(c, x + pad, y + pad, w - pad * 2, w - pad * 2, r); c.fill();
          const ix = x + s * 0.3, iy = y + s * 0.3, iw = w - s * 0.6;
          c.fillStyle = "#fff8ec"; rr(c, ix, iy, iw * 0.52, iw, s * 0.14); c.fill();          // 밥
          c.fillStyle = "#e85d5d"; c.beginPath(); c.arc(ix + iw * 0.26, iy + iw * 0.5, s * 0.13, 0, Math.PI * 2); c.fill(); // 매실
          c.fillStyle = "#5fcf8c"; rr(c, ix + iw * 0.58, iy, iw * 0.42, iw * 0.46, s * 0.12); c.fill(); // 채소
          c.fillStyle = "#ffd85a"; rr(c, ix + iw * 0.58, iy + iw * 0.54, iw * 0.42, iw * 0.46, s * 0.12); c.fill(); // 달걀
          c.fillStyle = "rgba(255,255,255,.35)"; rr(c, x + s * 0.3, y + pad + s * 0.06, w * 0.4, s * 0.1, s * 0.05); c.fill();
        }
        function drawPiece(c, key, cells, ox, oy, s, alpha) {
          if (key === "bento") { drawBento(c, ox, oy, s); return; }
          for (const [x, y] of cells) drawBlock(c, ox + x * s, oy + y * s, s, DEFS[key].color, alpha);
        }

        function render() {
          if (!grid) return;
          const s = cell;
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          const W = COLS * s, H = ROWS * s;
          const bg = g.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, "#0e1d45"); bg.addColorStop(1, "#14306b");
          g.fillStyle = bg; g.fillRect(0, 0, W, H);
          g.strokeStyle = "rgba(140,180,255,.07)"; g.lineWidth = 1;
          g.beginPath();
          for (let x = 1; x < COLS; x++) { g.moveTo(x * s + 0.5, 0); g.lineTo(x * s + 0.5, H); }
          for (let y = 1; y < ROWS; y++) { g.moveTo(0, y * s + 0.5); g.lineTo(W, y * s + 0.5); }
          g.stroke();
          // 도시락 효과: 열 빛기둥
          if (bentoFx) {
            const k = 1 - bentoFx.t / BENTO_FX_MS;
            for (const c of bentoFx.cols) {
              const gr = g.createLinearGradient(0, 0, 0, H);
              gr.addColorStop(0, "rgba(255,182,72,0)"); gr.addColorStop(1, `rgba(255,182,72,${0.55 * k})`);
              g.fillStyle = gr; g.fillRect(c * s, 0, s, H);
            }
          }
          const overRows = state === "over" ? Math.min(ROWS, Math.floor((overT / (OVER_MS * 0.8)) * ROWS)) : 0;
          for (let r = 0; r < ROWS; r++) {
            const flashing = clearing && clearing.rows.includes(r);
            for (let c = 0; c < COLS; c++) {
              const v = grid[r][c];
              if (!v) continue;
              const color = r >= ROWS - overRows ? "#64748b" : v;
              drawBlock(g, c * s, r * s, s, color);
            }
            if (flashing) {
              const k = clearing.t / CLEAR_MS;
              g.fillStyle = `rgba(255,255,255,${0.85 - k * 0.6})`;
              g.fillRect(0, r * s, W * (1 - k * 0.15), s);
            }
          }
          if (cur && state !== "over") {
            const gy = dropY();
            if (gy !== cur.y) {
              if (cur.key === "bento") drawBento(g, cur.x * s, gy * s, s, true);
              else for (const [x, y] of cur.cells) if (gy + y >= 0) drawGhost(g, (cur.x + x) * s, (gy + y) * s, s, DEFS[cur.key].color);
            }
            g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
            drawPiece(g, cur.key, cur.cells, cur.x * s, cur.y * s, s);
            g.restore();
          }
        }
        function drawNext() {
          const s = nextCv._c || 16, W = nextCv.width / dpr, H = nextCv.height / dpr;
          ng.setTransform(dpr, 0, 0, dpr, 0, 0);
          ng.clearRect(0, 0, W, H);
          if (!queue) return;
          for (let i = 0; i < 2; i++) {
            const key = queue[i]; if (!key) continue;
            const d = DEFS[key];
            const xs = d.cells.map((c) => c[0]), ys = d.cells.map((c) => c[1]);
            const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
            const sc = i === 0 ? s : s * 0.8;
            const pw = (maxX - minX + 1) * sc, ph = (maxY - minY + 1) * sc;
            const slotY = i === 0 ? 0 : H * 0.55, slotH = i === 0 ? H * 0.55 : H * 0.45;
            const ox = (W - pw) / 2 - minX * sc, oy = slotY + (slotH - ph) / 2 - minY * sc;
            if (i === 1) ng.globalAlpha = 0.6;
            drawPiece(ng, key, d.cells, ox, oy, sc, i === 1 ? 0.6 : 1);
            ng.globalAlpha = 1;
          }
        }
        function drawArt() {
          const W = artCv.width / dpr, H = artCv.height / dpr;
          ag.setTransform(dpr, 0, 0, dpr, 0, 0); ag.clearRect(0, 0, W, H);
          const s = H / 2;
          drawBento(ag, (W - H) / 2, 0, s);
        }

        // ---------- 흐름 ----------
        function showOverlay(html) { ov.hidden = false; ov.innerHTML = html; HKUI.refreshIcons(ov); }
        function hideOverlay() { ov.hidden = true; ov.innerHTML = ""; }
        function showStart() {
          state = "idle";
          reset();
          pauseBtn.disabled = true;
          render(); drawNext();
          showOverlay(`<h2>점심 블록</h2>
            <p>떨어지는 조각으로 가로줄을 꽉 채우면 사라져요.<br>시간이 갈수록·10줄마다 빨라지고 <b style="color:#ffcf8a">도시락</b>이 하나씩 모여요 — 필요할 때 <b>D</b>로!</p>
            <div class="gm-keys">
              <b>← →</b><span>옮기기</span>
              <b>↑ / X</b><span>돌리기</span>
              <b>↓</b><span>한 칸씩 내리기</span>
              <b>D</b><span>도시락 쓰기</span>
              <b>스페이스</b><span>바로 내리기</span>
              <b>Esc</b><span>일시정지</span>
            </div>
            <p style="font-size:12px">휴대폰은 좌우 밀기 · 톡 돌리기 · 아래로 휙 내리기</p>
            <button type="button" class="gm-start" data-go>${HKUI.icon("play", 18, "#fff")} 시작</button>`);
          ov.querySelector("[data-go]").onclick = startGame;
        }
        function startGame() {
          reset();
          hideOverlay();
          state = "play";
          pauseBtn.disabled = false;
          sfx("go");
          spawn();
          lastT = performance.now();
          const r = boardEl.getBoundingClientRect();
          if (r.bottom > window.innerHeight || r.top < 0) stage.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        function pause() {
          if (state !== "play") return;
          state = "pause";
          showOverlay(`<h2>잠깐 쉬는 중</h2><p>준비되면 이어서 해요</p>
            <button type="button" class="gm-start" data-resume>${HKUI.icon("play", 18, "#fff")} 계속하기</button>`);
          ov.querySelector("[data-resume]").onclick = resume;
        }
        function resume() {
          if (state !== "pause") return;
          hideOverlay();
          state = "play";
          lastT = performance.now();
        }
        pauseBtn.onclick = () => (state === "play" ? pause() : resume());

        function update(dt) {
          if (bentoFx) { bentoFx.t += dt; if (bentoFx.t >= BENTO_FX_MS) bentoFx = null; }
          if (state === "over") {
            overT += dt;
            if (overT >= OVER_MS) finishOver();
            return;
          }
          if (state !== "play") return;
          playMs += dt;
          if (Math.floor(playMs / 30000) > speedStep) {
            speedStep = Math.floor(playMs / 30000);
            pop("속도 UP! 더 빨리 내려와요", "lv");
            sfx("whoosh");
          }
          if (clearing) { clearing.t += dt; if (clearing.t >= CLEAR_MS) finishClear(); return; }
          if (!cur) return;
          if (grounded()) {
            dropAcc = 0;
            lockAcc += dt;
            if (lockAcc >= LOCK_MS) lock();
          } else {
            lockAcc = 0;
            dropAcc += dt;
            const iv = gravity();
            while (dropAcc >= iv && cur && !grounded()) { dropAcc -= iv; cur.y++; }
          }
        }
        function frame(t) {
          const dt = Math.min(100, t - lastT); lastT = t;
          if (state === "play" || state === "over" || bentoFx) update(dt);
          render();
          requestAnimationFrame(frame);
        }

        // ---------- 입력 ----------
        document.addEventListener("keydown", (e) => {
          const tg = e.target;
          if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.isContentEditable)) return;
          if (document.querySelector(".hk-dialog__overlay")) return;
          const k = e.key;
          if (state === "pause" && (k === "p" || k === "P" || k === "Escape")) { e.preventDefault(); resume(); return; }
          if (state !== "play") return;
          const map = {
            ArrowLeft: () => move(-1), ArrowRight: () => move(1), ArrowUp: rotate, x: rotate, X: rotate, "ㅌ": rotate,
            ArrowDown: softDrop, s: softDrop, S: softDrop, "ㄴ": softDrop, " ": hardDrop, Spacebar: hardDrop, Enter: hardDrop, p: pause, P: pause, Escape: pause,
            d: useBento, D: useBento, "ㅇ": useBento,
          };
          const fn = map[k];
          if (!fn) return;
          e.preventDefault();
          if ((k === " " || k === "ArrowUp" || k === "x" || k === "X") && e.repeat) return;
          fn();
        });

        // 판 위 터치: 좌우로 밀면 이동, 톡 치면 회전, 아래로 휙 내리면 바로 내리기
        let tp = null;
        boardEl.addEventListener("pointerdown", (e) => {
          if (state !== "play" || e.target.closest(".gm-overlay:not([hidden])")) return;
          tp = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, t0: performance.now(), moved: false, dropped: false };
          try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
        });
        boardEl.addEventListener("pointermove", (e) => {
          if (!tp || e.pointerId !== tp.id || state !== "play") return;
          const step = cell * 0.9;
          let dx = e.clientX - tp.lx;
          while (dx >= step) { move(1); tp.lx += step; dx -= step; tp.moved = true; }
          while (dx <= -step) { move(-1); tp.lx -= step; dx += step; tp.moved = true; }
          const dy = e.clientY - tp.y0, adx = Math.abs(e.clientX - tp.x0);
          if (!tp.dropped && dy > cell * 2.4 && dy > adx * 1.4 && performance.now() - tp.t0 < 450) {
            tp.dropped = true; tp.moved = true; hardDrop();
          }
          if (Math.abs(dy) > 10) tp.moved = tp.moved || Math.abs(dy) > 14;
        });
        const endTouch = (e) => {
          if (!tp || e.pointerId !== tp.id) return;
          const dist = Math.hypot(e.clientX - tp.x0, e.clientY - tp.y0);
          if (!tp.moved && dist < 12 && performance.now() - tp.t0 < 350 && e.type === "pointerup") rotate();
          tp = null;
        };
        boardEl.addEventListener("pointerup", endTouch);
        boardEl.addEventListener("pointercancel", endTouch);

        // 화면 아래 버튼 (좌우는 누르고 있으면 반복)
        stage.querySelectorAll(".gm-pad button").forEach((b) => {
          let hold = null;
          const act = b.dataset.act;
          const fire = () => (act === "left" ? move(-1) : act === "right" ? move(1) : act === "rot" ? rotate() : act === "bento" ? useBento() : hardDrop());
          const stop = () => { clearTimeout(hold); clearInterval(hold); hold = null; b.classList.remove("is-down"); };
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            if (state !== "play") return;
            b.classList.add("is-down");
            fire();
            if (act === "left" || act === "right") hold = setTimeout(() => (hold = setInterval(fire, 70)), 180);
          });
          ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, stop));
          b.addEventListener("contextmenu", (e) => e.preventDefault());
        });

        document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
        let rt = null;
        window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

        ctx.onRestart(startGame);
        ctx.onPause(pause);
        showStart();
        layout();
        requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });
      },
    });
  </script>
</body>
</html>
