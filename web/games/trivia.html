<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>오늘의 상식 퀴즈 — 게임 라운지</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>

  <style>
    .gm-tv { --gm-a: #0e7490; --gm-b: #0891b2; --gm-c: #22d3ee; --gm-ink: #0e7490; --gm-soft: #ecfeff; --gm-line: #a5f3fc;
      --gm-ok: #16a34a; --gm-ok-soft: #ecfdf3; --gm-ng: #e5484d; --gm-ng-soft: #fff1f1;
      --gm-fs: 16px; --gm-qs: 20px;
      position: relative; background: var(--surface-card, #fff); border: 1px solid var(--color-mist-border, #e3e8f0); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(8, 145, 178, .12);
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .gm-tv button { touch-action: manipulation; }

    /* 위 막대 — 몇 번째 문제 · 진행 칸 · 점수 */
    .gm-tv__top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: #fff; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); }
    .gm-tv__top b { font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .gm-tv__dots { flex: 1; display: flex; gap: 7px; min-width: 0; max-width: 400px; }
    .gm-tv__seg { display: flex; flex-direction: column; gap: 3px; min-width: 0; opacity: .6; }
    .gm-tv__seg small { font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: -.01em; white-space: nowrap; }
    .gm-tv__seg.is-cur { opacity: 1; }
    .gm-tv__seg.is-cur small { color: #fff; }
    .gm-tv__seg.is-past { opacity: .85; }
    .gm-tv__segdots { display: flex; gap: 3px; }
    .gm-tv__dot { flex: 1 1 0; min-width: 3px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.28); }
    .gm-tv__dot.is-now { background: var(--gm-c); box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
    .gm-tv__dot.is-ok { background: #fff; }
    .gm-tv__dot.is-ng { background: rgba(10, 40, 60, .45); }
    .gm-tv__score { margin-left: auto; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .gm-tv__body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
    .gm-tv__meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
    .gm-tv__cat { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--gm-soft); color: var(--gm-ink); font-weight: 700; }
    .gm-tv__lv { padding: 3px 8px; border-radius: 999px; font-weight: 700; font-size: 12px; }
    .gm-tv__lv.lv-1 { background: #dcfce7; color: #166534; }
    .gm-tv__lv.lv-2 { background: #e0f2fe; color: #075985; }
    .gm-tv__lv.lv-3 { background: #fef3c7; color: #92400e; }
    .gm-tv__lv.lv-4 { background: #ffe4e0; color: #b42318; }
    .gm-tv__neg { font-style: normal; color: #b42318; text-decoration: underline; text-underline-offset: 4px; }
    .gm-tv__streak { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; color: #c2410c; }

    .gm-tv__q { min-height: 96px; display: flex; align-items: center; justify-content: center; padding: 14px 16px; border-radius: 14px; background: var(--color-mist, #f3f6fa); text-align: center; word-break: keep-all; box-sizing: border-box; }
    .gm-tv__qt { margin: 0; font-size: var(--gm-qs); line-height: 1.5; font-weight: 700; color: var(--color-midnight-navy); }

    .gm-tv__opts { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .gm-tv__opts.is-grid { grid-template-columns: 1fr 1fr; }
    .gm-tv__opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 9px 14px; border-radius: 14px; border: 2px solid var(--border-default, #d6dde8); background: #fff; color: var(--color-midnight-navy); font: inherit; font-size: var(--gm-fs); font-weight: 600; line-height: 1.35; text-align: left; cursor: pointer; word-break: keep-all; transition: border-color .12s, background .12s, transform .08s; }
    .gm-tv__opt:hover:not([disabled]) { border-color: var(--gm-b); background: var(--gm-soft); }
    .gm-tv__opt:active:not([disabled]) { transform: scale(.985); }
    .gm-tv__opt[disabled] { cursor: default; }
    .gm-tv__num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--gm-soft); color: var(--gm-ink); font-size: 13.5px; font-weight: 800; }
    .gm-tv__txt { flex: 1; min-width: 0; }
    .gm-tv__mark { flex-shrink: 0; display: inline-flex; }
    .gm-tv__opt.is-picked { border-color: var(--gm-b); background: var(--gm-soft); }
    .gm-tv__opt.is-correct { border-color: var(--gm-ok); background: var(--gm-ok-soft); }
    .gm-tv__opt.is-correct .gm-tv__num { background: var(--gm-ok); color: #fff; }
    .gm-tv__opt.is-wrong { border-color: var(--gm-ng); background: var(--gm-ng-soft); animation: gm-tv-shake .35s; }
    .gm-tv__opt.is-wrong .gm-tv__num { background: var(--gm-ng); color: #fff; }
    .gm-tv__opt.is-dim { opacity: .5; }

    .gm-tv__fb { min-height: 82px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--color-mist-border, #e3e8f0); box-sizing: border-box; }
    .gm-tv__hint { font-size: 13.5px; color: var(--text-muted, #8a94a6); text-align: center; }
    .gm-tv__fb.is-ok { border: 0; background: var(--gm-ok-soft); animation: gm-tv-fade .18s ease-out; }
    .gm-tv__fb.is-ng { border: 0; background: var(--gm-ng-soft); animation: gm-tv-fade .18s ease-out; }
    .gm-tv__fb-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 15.5px; font-weight: 800; }
    .gm-tv__fb.is-ok .gm-tv__fb-head { color: #087a35; }
    .gm-tv__fb.is-ng .gm-tv__fb-head { color: #b42318; }
    .gm-tv__fb-head em { font-style: normal; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: #fff; color: #c2410c; }
    .gm-tv__fb p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--text-secondary); word-break: keep-all; }

    /* 단계 알림 — 워밍업 · 본선 · 결승 */
    .gm-tv__body { position: relative; }
    .gm-tv__call { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(255, 255, 255, .93); animation: gm-tv-call .35s ease-out; text-align: center; }
    .gm-tv__call b { font-size: 30px; font-weight: 900; letter-spacing: -.02em; color: var(--gm-a); }
    .gm-tv__call span { font-size: 14.5px; font-weight: 700; color: var(--text-secondary); }
    .gm-tv__call.s-0 b { color: #15803d; }
    .gm-tv__call.s-2 b { color: #b45309; }
    .gm-tv__call.s-3 b { color: #b42318; }
    @keyframes gm-tv-call { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    .gm-tv__ladder { display: flex; align-items: stretch; justify-content: center; gap: 2px; width: 100%; max-width: 500px; }
    .gm-tv__rung { flex: 1; min-width: 0; display: flex; word-break: keep-all; flex-direction: column; gap: 2px; padding: 8px 3px; border-radius: 12px; background: var(--gm-soft); color: var(--gm-ink); font-size: 12.5px; }
    .gm-tv__rung b { font-size: 15px; }
    .gm-tv__rung em { font-style: normal; font-weight: 700; font-size: 12px; opacity: .85; }
    .gm-tv__rung.s-0 { background: #dcfce7; color: #166534; }
    .gm-tv__rung.s-2 { background: #fef3c7; color: #92400e; }
    .gm-tv__rung.s-3 { background: #ffe4e0; color: #b42318; }
    .gm-tv__arrow { display: flex; align-items: center; color: var(--text-muted, #8a94a6); }
    .gm-tv.is-narrow .gm-tv__arrow { display: none; }
    .gm-tv.is-narrow .gm-tv__rung { font-size: 11.5px; }
    .gm-tv.is-narrow .gm-tv__rung b { font-size: 14px; }
    .gm-tv.is-narrow .gm-tv__rung em { font-size: 11px; }
    .gm-tv__stsum { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: -4px; }
    .gm-tv__stchip { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--gm-soft); color: var(--gm-ink); font-variant-numeric: tabular-nums; }
    .gm-tv__stchip.s-0 { background: #dcfce7; color: #166534; }
    .gm-tv__stchip.s-2 { background: #fef3c7; color: #92400e; }
    .gm-tv__stchip.s-3 { background: #ffe4e0; color: #b42318; }

    /* 일시정지 */
    .gm-tv__pause { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(236, 254, 255, .97); text-align: center; padding: 20px; }
    .gm-tv__pause b { font-size: 20px; color: var(--color-midnight-navy); }

    /* 시작 · 끝 화면 */
    .gm-tv__intro { padding: 24px 22px 22px; display: flex; flex-direction: column; align-items: center; gap: 13px; text-align: center; }
    .gm-tv__badge { width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--gm-b), var(--gm-c)); box-shadow: 0 8px 20px rgba(8, 145, 178, .3); }
    .gm-tv__date { font-size: 13px; font-weight: 700; color: var(--gm-ink); background: var(--gm-soft); padding: 5px 12px; border-radius: 999px; }
    .gm-tv__h { margin: 0; font-size: 24px; color: var(--color-midnight-navy); }
    .gm-tv__sub { margin: -6px 0 0; font-size: 14px; color: var(--text-secondary); word-break: keep-all; }
    .gm-tv__rules { margin: 0; padding: 14px 16px; list-style: none; width: 100%; max-width: 460px; text-align: left; border-radius: 12px; background: var(--color-mist, #f3f6fa); display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.5; color: var(--text-secondary); word-break: keep-all; box-sizing: border-box; }
    .gm-tv__rules li { display: flex; gap: 8px; }
    .gm-tv__rules li > span:first-child { flex-shrink: 0; width: 18px; height: 18px; border-radius: 6px; margin-top: 2px; background: var(--gm-soft); color: var(--gm-ink); font-size: 11.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .gm-tv__rules b { color: var(--color-midnight-navy); }
    .gm-tv__chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 460px; }
    .gm-tv__chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: #fff; border: 1px solid var(--gm-line); color: var(--gm-ink); font-size: 12.5px; font-weight: 700; }
    .gm-tv__chip small { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    .gm-tv__note { width: 100%; max-width: 460px; padding: 10px 14px; border-radius: 12px; background: #fff7e6; color: #9a6400; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; }
    .gm-tv__start { min-width: 200px; height: 52px; border: 0; border-radius: 14px; color: #fff; font: inherit; font-size: 17px; font-weight: 800; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); box-shadow: 0 6px 18px rgba(8, 145, 178, .3); cursor: pointer; }
    .gm-tv__start:hover:not([disabled]) { filter: brightness(1.07); }
    .gm-tv__start[disabled] { opacity: .55; cursor: default; }
    .gm-tv__kbd { font-size: 12.5px; color: var(--text-muted, #8a94a6); }

    .gm-tv__sum-big { font-size: 40px; font-weight: 800; color: var(--color-midnight-navy); letter-spacing: -.02em; line-height: 1.1; }
    .gm-tv__sum-big small { font-size: 18px; color: var(--text-secondary); font-weight: 700; }
    .gm-tv__stats { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 12px; background: var(--color-mist, #f3f6fa); overflow: hidden; }
    .gm-tv__stats > div { display: flex; flex-direction: column; gap: 2px; padding: 9px 4px; font-size: 12px; color: var(--text-secondary); }
    .gm-tv__stats b { font-size: 16px; color: var(--color-midnight-navy); font-variant-numeric: tabular-nums; }
    .gm-tv__stats .is-total { background: var(--gm-soft); }
    .gm-tv__stats .is-total b { color: var(--gm-ink); }
    .gm-tv__cats { width: 100%; max-width: 480px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .gm-tv__catc { --p: 0%; display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--gm-ink); border: 1px solid var(--gm-line); background: linear-gradient(90deg, var(--gm-soft) var(--p), #fff var(--p)); }
    .gm-tv__catc b { font-variant-numeric: tabular-nums; color: var(--color-midnight-navy); }
    .gm-tv__catc.is-zero { color: var(--text-secondary); border-color: var(--color-mist-border, #e3e8f0); }
    .gm-tv__review { width: 100%; max-width: 540px; max-height: min(28vh, 300px); overflow-y: auto; border-radius: 12px; border: 1px solid var(--color-mist-border, #e3e8f0); text-align: left; overscroll-behavior: contain; }
    .gm-tv__review ol { margin: 0; padding: 0; list-style: none; }
    .gm-tv__review li { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--color-mist-border, #e3e8f0); }
    .gm-tv__review li:last-child { border-bottom: 0; }
    .gm-tv__review li > i, .gm-tv__review li > svg { flex-shrink: 0; margin-top: 2px; }
    .gm-tv__rv { min-width: 0; display: flex; flex-direction: column; gap: 3px; word-break: keep-all; }
    .gm-tv__rv-tag { font-size: 12px; font-weight: 700; color: var(--gm-ink); }
    .gm-tv__rv-q { font-size: 14.5px; font-weight: 700; color: var(--color-midnight-navy); line-height: 1.45; }
    .gm-tv__rv-a { font-size: 13.5px; color: var(--text-secondary); }
    .gm-tv__rv-a b { color: #087a35; }
    .gm-tv__rv-a s { color: #b42318; }
    .gm-tv__rv-e { font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
    .gm-tv__label { align-self: stretch; max-width: 540px; margin: 2px auto -4px; width: 100%; text-align: left; font-size: 13px; font-weight: 800; color: var(--color-midnight-navy); }

    .gm-tv.is-narrow .gm-tv__body { padding: 14px 14px 16px; gap: 11px; }
    .gm-tv.is-narrow .gm-tv__intro { padding: 20px 14px 18px; }
    .gm-tv.is-narrow .gm-tv__top { padding: 11px 14px; gap: 8px; }
    .gm-tv.is-narrow .gm-tv__dots { gap: 2px; }
    .gm-tv.is-narrow .gm-tv__dot { height: 6px; }
    .gm-tv.is-narrow .gm-tv__opt { gap: 10px; padding: 9px 12px; min-height: 56px; }
    .gm-tv.is-narrow .gm-tv__h { font-size: 21px; }
    .gm-tv.is-narrow .gm-tv__label { display: none; }
    .gm-tv.is-narrow .gm-tv__catc { padding: 3px 8px; font-size: 12px; }

    @keyframes gm-tv-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
    @keyframes gm-tv-fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 문제 은행 — [분야, 난이도(1 쉬움 · 2 보통 · 3 어려움 · 4 아주 어려움), 문제, 정답, [오답 3개], 해설]
    // 쉬움은 누구나 대부분 맞힐 가벼운 상식, 보통은 교양 있는 직장인 수준, 어려움·아주 어려움은 TV 퀴즈 본선 수준. 확립된 사실만 — 바뀌는 기록·순위·인구·현직 인물·최근 사건, 논란·정치적 내용은 넣지 않는다.
    const BANK = [
      // ── 과학: 물리 ──
      ["sci", 3, "진공에서의 빛의 속력을 어떤 매질 속 빛의 속력으로 나눈 값은?", "굴절률", ["반사율", "투과율", "흡광도"], "굴절률 n = c / v 예요. 물은 약 1.33, 다이아몬드는 약 2.42예요."],
      ["sci", 3, "섭씨로 나타낸 절대 영도(0 K)는?", "−273.15℃", ["−271.15℃", "−459.67℃", "−237.15℃"], "0 K는 −273.15℃예요. −459.67은 화씨로 나타낸 절대 영도예요."],
      ["sci", 4, "물의 얼음·물·수증기가 함께 평형을 이루는 삼중점의 온도는 약 몇 ℃일까요?", "0.01℃", ["0℃", "4℃", "−0.01℃"], "물의 삼중점은 약 273.16 K, 곧 0.01℃(약 611 Pa)예요."],
      ["sci", 4, "자기장의 세기(자속 밀도)를 나타내는 SI 단위는?", "테슬라(T)", ["웨버(Wb)", "헨리(H)", "가우스(G)"], "자속 밀도의 SI 단위는 테슬라예요. 가우스는 CGS 단위, 웨버는 자속의 단위예요."],
      ["sci", 4, "코일의 자체 유도 계수(인덕턴스)를 나타내는 SI 단위는?", "헨리(H)", ["패럿(F)", "지멘스(S)", "웨버(Wb)"], "인덕턴스 단위 헨리는 미국 물리학자 조지프 헨리의 이름에서 왔어요. 패럿은 전기 용량 단위예요."],
      ["sci", 4, "1초에 원자핵 하나가 붕괴하는 방사능의 세기를 뜻하는 SI 단위는?", "베크렐(Bq)", ["시버트(Sv)", "그레이(Gy)", "퀴리(Ci)"], "방사능의 SI 단위는 베크렐이에요. 시버트는 인체 영향(등가 선량), 그레이는 흡수 선량, 퀴리는 옛 단위예요."],
      ["sci", 4, "‘행성과 태양을 잇는 선분은 같은 시간 동안 같은 넓이를 쓸고 지나간다’는 법칙은?", "케플러 제2법칙", ["케플러 제1법칙", "케플러 제3법칙", "뉴턴 제2법칙"], "면적 속도 일정 법칙이라 해요. 그래서 행성은 태양에 가까울수록 빨리 움직여요."],
      ["sci", 3, "케플러 제3법칙에 따르면 행성 공전 주기의 제곱은 궤도 긴반지름의 몇 제곱에 비례할까요?", "세제곱", ["제곱", "네제곱", "한 제곱(정비례)"], "T² ∝ a³ 이에요. 조화의 법칙이라고도 불러요."],
      ["sci", 3, "한 원자 안에서 두 전자가 똑같은 양자 상태를 가질 수 없다는 원리는?", "파울리 배타 원리", ["훈트 규칙", "하이젠베르크 불확정성 원리", "쌓음 원리"], "볼프강 파울리가 1925년에 제안했어요. 그래서 한 오비탈에는 전자가 최대 2개만 들어가요."],

        let qs = [], idx = 0, results = [], streak = 0;
        let timer = 0;
        let phase = "intro"; // intro | play | judge | feedback | paused | done
        let pausedFrom = "";

        const totalScore = () => results.reduce((s, r) => s + (r ? r.pts + r.bonus : 0), 0);
        function stopLoops() {
          clearTimeout(timer);
        }
        function formatDate(iso) {
          const [y, m, d] = iso.split("-").map(Number);
          const wd = "일월화수목금토"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
          return `${m}월 ${d}일 (${wd})`;
        }
        const catChip = (c, n) => `<span class="gm-tv__chip">${HKUI.icon(CATS[c].icon, 13, "currentColor")} ${CATS[c].label}${n ? ` <small>${n}</small>` : ""}</span>`;
        const qText = (q) => esc(q.q).replace(/아닌|않는|않은|없는/.test(q.q) && q.q.includes("아닌") ? /(아닌)/ : /(않는|않은|없는)/, `<em class="gm-tv__neg">$1</em>`);

        // stage 폭에 맞춰 글자 크기와 보기 배치(2열/1열)를 다시 정한다 — 공통 틀이 폭을 바꾸면 resize 가 온다
        function layout() {
          const card = stage.querySelector(".gm-tv");
          if (!card) return;
          const w = stage.clientWidth || 360;
          card.style.setProperty("--gm-fs", `${Math.max(15, Math.min(18, w / 32)).toFixed(1)}px`);
          card.style.setProperty("--gm-qs", `${Math.max(17, Math.min(23, w / 26)).toFixed(1)}px`);
          card.classList.toggle("is-narrow", w < 460);
          const box = stage.querySelector("[data-opts]");
          if (box) box.classList.toggle("is-grid", +box.dataset.max <= (w >= 600 ? 12 : w >= 440 ? 8 : 5));
        }
        window.addEventListener("resize", layout);

        // ── 시작 화면 ──
        function showIntro() {
          stopLoops();
          phase = "intro";
          const today = pickDay(ctx.today);
          const counts = {};
          today.forEach((i) => (counts[BANK[i][0]] = (counts[BANK[i][0]] || 0) + 1));
          stage.innerHTML = `<div class="gm-tv">
            <div class="gm-tv__intro">
              <span class="gm-tv__badge">${HKUI.icon("lightbulb", 34, "#fff")}</span>
              <span class="gm-tv__date">${formatDate(ctx.today)} · 오늘의 ${COUNT}문제</span>
              <h2 class="gm-tv__h">오늘의 상식 퀴즈</h2>
              <p class="gm-tv__sub">단계를 올라갈수록 어려워져요.</p>
              <div class="gm-tv__ladder">${STAGES.map((st, si) => `<div class="gm-tv__rung s-${si}"><b>${st.name}</b><span>${LV[st.lv]}</span><em>${st.n}문제 · ${BASE_PTS[st.lv]}점</em></div>`).join(`<span class="gm-tv__arrow">${HKUI.icon("chevron-right", 16, "currentColor")}</span>`)}</div>
              <div class="gm-tv__chips">${Object.keys(CATS).filter((c) => counts[c]).map((c) => catChip(c, counts[c])).join("")}</div>
              <ul class="gm-tv__rules">
                <li><span>1</span><span>시간 제한 없이 천천히 풀어요. 보기 4개 중 하나를 골라요. PC는 숫자 <b>1~4</b> 키나 클릭, 휴대폰은 보기를 눌러요.</span></li>
                <li><span>2</span><span>정답 기본점 <b>쉬움 ${BASE_PTS[1]} · 보통 ${BASE_PTS[2]} · 어려움 ${BASE_PTS[3]} · 아주 어려움 ${BASE_PTS[4]}</b> · <b>${STREAK_N}연속</b> 정답마다 <b>+${STREAK_BONUS}</b></span></li>
                <li><span>3</span><span>오늘 문제는 모든 직원이 같고, 날마다 겹치지 않는 새 문제가 나와요.</span></li>
              </ul>
              ${ctx.dailyDone ? `<div class="gm-tv__note">${HKUI.icon("info", 16, "currentColor")} 오늘 기록은 이미 반영됐어요 · 이번 판은 연습</div>` : ""}
              <button type="button" class="gm-tv__start" data-start>시작하기</button>
              ${coarse ? "" : `<span class="gm-tv__kbd">스페이스 키로도 시작할 수 있어요</span>`}
            </div>
          </div>`;
          stage.querySelector("[data-start]").onclick = (e) => begin(e.currentTarget);
          HKUI.refreshIcons(stage);
          layout();
        }

        // 오늘의 도전 시작 신고 — 새로고침 후 다시 시작하면 연습으로 처리된다
        async function begin(btn) {
          if (phase !== "intro" && phase !== "done") return;
          if (btn) btn.disabled = true;
          phase = "starting";
          await ctx.begin();
          qs = todaysQuestions();
          idx = 0;
          results = [];
          streak = 0;
          ctx.sfx("go");
          showQuestion();
        }

        // ── 문제 화면 ──
        function showQuestion() {
          stopLoops();
          const q = qs[idx];
          const cat = CATS[q.c];
          phase = "play";
          const cur = stageOf(idx);
          const dots = STAGES.map((st, si) => {
            const from = stageStart(si);
            const row = Array.from({ length: st.n }, (_, k) => {
              const i = from + k, r = results[i];
              const cls = r ? (r.ok ? "is-ok" : "is-ng") : i === idx ? "is-now" : "";
              return `<span class="gm-tv__dot ${cls}"></span>`;
            }).join("");
            return `<span class="gm-tv__seg${si === cur ? " is-cur" : si < cur ? " is-past" : ""}" style="flex:${st.n}"><small>${st.name}</small><span class="gm-tv__segdots">${row}</span></span>`;
          }).join("");
          const maxLen = Math.max(...q.opts.map((o) => o.length));
          stage.innerHTML = `<div class="gm-tv">
            <div class="gm-tv__top"><b>${idx + 1} / ${qs.length}</b><span class="gm-tv__dots" aria-hidden="true">${dots}</span><span class="gm-tv__score">${totalScore().toLocaleString("ko-KR")}점</span></div>
            <div class="gm-tv__body">
              <div class="gm-tv__meta">
                <span class="gm-tv__cat">${HKUI.icon(cat.icon, 14, "currentColor")} ${cat.label}</span>
                <span class="gm-tv__lv lv-${q.d}">${LV[q.d]}</span>
                ${streak >= 2 ? `<span class="gm-tv__streak">${HKUI.icon("flame", 14, "currentColor")} ${streak}연속</span>` : ""}
              </div>
              <div class="gm-tv__q"><p class="gm-tv__qt">${qText(q)}</p></div>
              <div class="gm-tv__opts" data-opts data-max="${maxLen}" role="group" aria-label="보기">${q.opts.map((o, i) => `<button type="button" class="gm-tv__opt" data-opt="${i}"><span class="gm-tv__num">${i + 1}</span><span class="gm-tv__txt">${esc(o)}</span><span class="gm-tv__mark" data-mark></span></button>`).join("")}</div>
              <div class="gm-tv__fb" data-fb><span class="gm-tv__hint">${coarse ? "보기를 눌러 골라요" : "숫자 1~4 키나 클릭으로 골라요"}</span></div>
            </div>
          </div>`;
          stage.querySelectorAll(".gm-tv__opt").forEach((b) => (b.onclick = () => choose(+b.dataset.opt)));
          HKUI.refreshIcons(stage);
          layout();
          // 단계가 바뀌는 첫 문제 — "본선 시작!" 알림을 잠깐 띄운 뒤에 보기를 고를 수 있다
          if (idx === stageStart(cur)) {
            phase = "call";
            const st = STAGES[cur];
            const c = document.createElement("div");
            c.className = `gm-tv__call s-${cur}`;
            c.innerHTML = `<b>${st.call}</b><span>${LV[st.lv]} ${st.n}문제 · 정답 ${BASE_PTS[st.lv]}점</span>`;
            stage.querySelector(".gm-tv__body").appendChild(c);
            if (cur > 0) ctx.sfx("powerup");
            timer = setTimeout(startClock, CALL_MS);
            return;
          }
          startClock();
        }
        function startClock() {
          if (phase !== "play" && phase !== "call") return;
          stage.querySelector(".gm-tv__call")?.remove();
          phase = "play";
        }

        // 보기를 고르면 잠깐 표시하고(선택음) 곧바로 채점
        let pickIdx = -1;
        function choose(i) {
          if (phase !== "play" || i < 0 || i >= qs[idx].opts.length) return;
          stopLoops();
          phase = "judge";
          pickIdx = i;
          ctx.sfx("select");
          const btns = stage.querySelectorAll(".gm-tv__opt");
          btns.forEach((b) => (b.disabled = true));
          btns[i]?.classList.add("is-picked");
          timer = setTimeout(() => reveal(i), JUDGE_MS);
        }

        function reveal(i) {
          if (phase !== "play" && phase !== "judge") return;
          stopLoops();
          phase = "feedback";
          const q = qs[idx];
          const ok = i >= 0 && q.opts[i] === q.a;
          const pts = ok ? BASE_PTS[q.d] : 0;
          streak = ok ? streak + 1 : 0;
          const bonus = ok && streak % STREAK_N === 0 ? STREAK_BONUS : 0;
          results[idx] = { ok, pts, bonus, base: ok ? BASE_PTS[q.d] : 0, pick: i >= 0 ? q.opts[i] : null };
          if (ok) ctx.sfx(streak >= 2 ? "combo" : "success", Math.min(streak, 10));
          else ctx.sfx("fail");

          // 보기 색칠 — 정답은 초록, 고른 오답은 빨강
          stage.querySelectorAll(".gm-tv__opt").forEach((b, k) => {
            b.disabled = true;
            b.classList.remove("is-picked");
            const mark = b.querySelector("[data-mark]");
            if (q.opts[k] === q.a) {
              b.classList.add("is-correct");
              mark.innerHTML = HKUI.icon("circle-check", 20, "var(--gm-ok)");
            } else if (k === i) {
              b.classList.add("is-wrong");
              mark.innerHTML = HKUI.icon("circle-x", 20, "var(--gm-ng)");
            } else {
              b.classList.add("is-dim");
            }
          });
          const score = stage.querySelector(".gm-tv__score");
          if (score) score.textContent = `${totalScore().toLocaleString("ko-KR")}점`;
          const dot = stage.querySelectorAll(".gm-tv__dot")[idx];
          if (dot) dot.className = `gm-tv__dot ${ok ? "is-ok" : "is-ng"}`;
          const fb = stage.querySelector("[data-fb]");
          fb.className = `gm-tv__fb ${ok ? "is-ok" : "is-ng"}`;
          fb.innerHTML = ok
            ? `<div class="gm-tv__fb-head">${HKUI.icon("check", 18, "currentColor")} 정답이에요! +${pts}점${bonus ? ` <em>${streak}연속 보너스 +${bonus}</em>` : ""}</div><p>${esc(q.e)}</p>`
            : `<div class="gm-tv__fb-head">${HKUI.icon("x", 18, "currentColor")} 아쉬워요 · 정답은 ‘${esc(q.a)}’</div><p>${esc(q.e)}</p>`;
          HKUI.refreshIcons(stage);
          timer = setTimeout(next, FEEDBACK_MS);
        }

        function next() {
          idx++;
          if (idx < qs.length) showQuestion();
          else showSummary();
        }

        // ── 끝 화면(요약 · 분야별 정답 · 문제별 해설) → 기록 저장 ──
        async function showSummary() {
          stopLoops();
          phase = "done";
          const okCount = results.filter((r) => r.ok).length;
          const baseSum = results.reduce((s, r) => s + r.base, 0);
          const stageSum = STAGES.map((st, si) => {
            const from = stageStart(si);
            const ok = results.slice(from, from + st.n).filter((r) => r.ok).length;
            return `<span class="gm-tv__stchip s-${si}"><b>${st.name}</b> ${ok}/${st.n}</span>`;
          }).join("");
          const streakBonus = results.reduce((s, r) => s + r.bonus, 0);
          const score = totalScore();
          const byCat = {};
          qs.forEach((q, i) => {
            byCat[q.c] = byCat[q.c] || { n: 0, ok: 0 };
            byCat[q.c].n++;
            if (results[i].ok) byCat[q.c].ok++;
          });
          const cats = Object.keys(CATS).filter((c) => byCat[c]).map((c) => `<span class="gm-tv__catc${byCat[c].ok ? "" : " is-zero"}" style="--p:${Math.round((byCat[c].ok / byCat[c].n) * 100)}%">${HKUI.icon(CATS[c].icon, 13, "currentColor")} ${CATS[c].label} <b>${byCat[c].ok}/${byCat[c].n}</b></span>`).join("");
          const review = qs.map((q, i) => {
            const r = results[i];
            const mine = r.ok ? "" : ` · 내 답 <s>${esc(r.pick)}</s>`;
            return `<li>
              ${HKUI.icon(r.ok ? "circle-check" : "circle-x", 20, r.ok ? "#16a34a" : "#94a3b8")}
              <div class="gm-tv__rv">
                <span class="gm-tv__rv-tag">${i + 1}번 · ${STAGES[stageOf(i)].name} · ${CATS[q.c].label} · ${LV[q.d]}${r.ok ? ` · +${r.pts + r.bonus}점` : ""}</span>
                <span class="gm-tv__rv-q">${esc(q.q)}</span>
                <span class="gm-tv__rv-a">정답 <b>${esc(q.a)}</b>${mine}</span>
                <span class="gm-tv__rv-e">${esc(q.e)}</span>
              </div>
            </li>`;
          }).join("");
          stage.innerHTML = `<div class="gm-tv">
            <div class="gm-tv__intro">
              <span class="gm-tv__date">${formatDate(ctx.today)} · 오늘의 상식 퀴즈</span>
              <div class="gm-tv__sum-big">${okCount}<small> / ${qs.length} 정답 · ${score.toLocaleString("ko-KR")}점</small></div>
              <div class="gm-tv__stsum">${stageSum}</div>
              <div class="gm-tv__stats" data-calc>
                <div><span>정답 기본점</span><b>${baseSum.toLocaleString("ko-KR")}</b></div>
                <div><span>연속 보너스</span><b>+${streakBonus}</b></div>
                <div class="is-total"><span>합계</span><b>${score.toLocaleString("ko-KR")}</b></div>
              </div>
              <div class="gm-tv__label">분야별 정답</div>
              <div class="gm-tv__cats">${cats}</div>
              <div class="gm-tv__label">문제별 해설</div>
              <div class="gm-tv__review" tabindex="0" aria-label="문제별 해설"><ol>${review}</ol></div>
              <button type="button" class="gm-tv__start" data-again disabled>다시 하기</button>
            </div>
          </div>`;
          const again = stage.querySelector("[data-again]");
          again.onclick = () => begin(again);
          HKUI.refreshIcons(stage);
          layout();
          // 기록 저장이 끝난 뒤에 다시 하기를 열어 둔다 (저장 전에 새 판이 시작되지 않게)
          try {
            await ctx.submit(score);
          } finally {
            if (phase === "done") again.disabled = false;
          }
        }

        // ── 일시정지 (탭을 떠나면) ──
        function pause() {
          if (phase === "judge") reveal(pickIdx); // 채점은 마저 하고 멈춘다
          if (phase !== "play" && phase !== "feedback" && phase !== "call") return;
          stopLoops();
          stage.querySelector(".gm-tv__call")?.remove();
          if (phase === "call") phase = "play";
          pausedFrom = phase;
          phase = "paused";
          const p = document.createElement("div");
          p.className = "gm-tv__pause";
          p.innerHTML = `${HKUI.icon("pause", 30, "#0e7490")}<b>잠시 멈췄어요</b><span style="font-size:14px;color:var(--text-secondary)">돌아오면 이어서 풀 수 있어요</span><button type="button" class="gm-tv__start" data-resume>계속하기</button>`;
          stage.querySelector(".gm-tv").appendChild(p);
          HKUI.refreshIcons(p);
          p.querySelector("[data-resume]").onclick = () => {
            if (phase !== "paused") return;
            p.remove();
            if (pausedFrom === "feedback") {
              phase = "feedback";
              next();
              return;
            }
            phase = "play";
          };
        }
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) pause();
        });

        // PC — 숫자 1~4 (윗줄·숫자 패드). 문제를 푸는 동안 스페이스는 화면이 굴러가지 않게만 막는다
        window.addEventListener("keydown", (e) => {
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const tag = (e.target && e.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
          if (e.code === "Space" && ["play", "judge", "feedback", "starting", "call"].includes(phase)) {
            e.preventDefault();
            return;
          }
          if (phase !== "play" || e.repeat) return;
          const m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code || "") || /^([1-4])$/.exec(e.key || "");
          if (!m) return;
          e.preventDefault();
          choose(+m[1] - 1);
        });

        ctx.onRestart(() => {
          if (phase === "done") begin(stage.querySelector("[data-again]"));
        });
        showIntro();
      },
    });
  </script>
</body>
</html>
