<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 사내 오목</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <style>
    .gk__board { display: block; width: 100%; max-width: 620px; margin: 0 auto; aspect-ratio: 1; touch-action: manipulation; cursor: pointer; border-radius: 6px; box-shadow: 0 8px 24px rgba(15, 23, 42, .18); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 사내 오목 — 도전 → 수락 → 번갈아 두기. 수는 아케이드가 열린 시간에만 둘 수 있고, 한 수 기한은 24시간
    const { esc, REASON, ava, closedNote, due, fail } = HKMatch;
    const GAME = "gomoku";
        const PLACE_TEXT = matchMedia("(hover: hover) and (pointer: fine)").matches ? "여기에 두기 (Space)" : "여기에 두기"; // PC는 스페이스로도 둔다
    let root = null, open = { open: true, opensAt: null }, match = null, pick = null, timer = 0, sending = false;
    let waiter = null; // 서버에서 상대 수를 기다리는 요청
    function stopPoll() { clearTimeout(timer); timer = 0; if (waiter) { waiter.abort(); waiter = null; } }
    async function showLobby() {
      stopPoll(); match = null; pick = null;
      open = await HKMatch.lobby(root, GAME, { title: "사내 오목", lead: "동료에게 도전장을 보내거나 컴퓨터와 두어요. 한 수를 24시간 안에 두지 않으면 시간 초과로 져요. 대국이 끝나면 오늘 도장을 받아요." });
    }

    // ---------- 판 ----------
    const CELL = 40, PAD = 28;
    function drawBoard() {
      const c = document.getElementById("gk-board");
      if (!c || !match) return;
      const n = match.size, side = PAD * 2 + CELL * (n - 1), dpr = Math.min(2, window.devicePixelRatio || 1);
      if (c.width !== side * dpr) { c.width = c.height = side * dpr; }
      const g = c.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = "#deb887"; g.fillRect(0, 0, side, side);
      g.strokeStyle = "#6b4a2b"; g.lineWidth = 1;
      const at = (i) => PAD + i * CELL;
      for (let i = 0; i < n; i++) {
        g.beginPath(); g.moveTo(at(0), at(i) + .5); g.lineTo(at(n - 1), at(i) + .5); g.stroke();
        g.beginPath(); g.moveTo(at(i) + .5, at(0)); g.lineTo(at(i) + .5, at(n - 1)); g.stroke();
      }
      g.fillStyle = "#6b4a2b";
      for (const [x, y] of [[3, 3], [11, 3], [7, 7], [3, 11], [11, 11]]) { g.beginPath(); g.arc(at(x), at(y), 4, 0, 7); g.fill(); }
      const stone = (x, y, black, alpha) => {
        g.globalAlpha = alpha;
        g.beginPath(); g.arc(at(x), at(y), CELL * .44, 0, 7);
        const s = g.createRadialGradient(at(x) - 5, at(y) - 6, 2, at(x), at(y), CELL * .44);
        s.addColorStop(0, black ? "#4b5563" : "#fff"); s.addColorStop(1, black ? "#0b0f19" : "#d6d3d1");
        g.fillStyle = s; g.fill();
        g.globalAlpha = 1;
      };
      match.moves.forEach(([x, y], i) => stone(x, y, i % 2 === 0, 1));
      const last = match.moves[match.moves.length - 1];
      if (last) { g.fillStyle = "#ef4444"; g.fillRect(at(last[0]) - 4, at(last[1]) - 4, 8, 8); }
      if (pick) stone(pick[0], pick[1], match.myColor === "black", .6);
    }
    function statusText() {
      if (match.status === "DONE") return { win: "이겼어요", lose: "졌어요", draw: "비겼어요" }[match.result];
      if (match.status === "ACTIVE") return match.myTurn ? "내 차례" : "상대 차례";
      if (match.status === "PENDING") return match.incoming ? "받은 도전" : "수락 기다리는 중";
      return match.status === "DECLINED" ? "취소된 도전" : "만료된 도전";
    }
    function paintMatch() {
      const canPlay = match.status === "ACTIVE" && match.myTurn && open.open;
      const place = match.status === "ACTIVE"
        ? `<button type="button" class="hk-btn hk-btn--primary gk__place" id="gk-place" ${canPlay && pick ? "" : "disabled"}>${!open.open ? `${esc(open.opensAt || "")}부터 둘 수 있어요` : !match.myTurn ? "상대 차례예요" : pick ? PLACE_TEXT : "둘 자리를 눌러 주세요"}</button>
           <button type="button" class="hk-btn hk-btn--secondary" id="gk-resign" ${open.open ? "" : "disabled"}>기권</button>`
        : `<a class="hk-btn hk-btn--primary gk__place" href="#" style="text-align:center;text-decoration:none">대국 목록</a>`;
      const note = match.status === "ACTIVE" ? `${match.moveCount}수 · 이번 수 ${due(match.deadlineAt)}` : match.status === "DONE" ? `${REASON[match.endReason] || ""} · ${match.moveCount}수` : "";
      root.innerHTML = `<div class="gk">
          <a class="gk__back" href="#">‹ 대국 목록</a>
          ${closedNote(open)}
          ${HKMatch.versus(match, statusText())}
          <canvas class="gk__board" id="gk-board" aria-label="오목 판"></canvas>
          <div class="gk__bar">${place}</div>
          ${note ? `<div class="gk__due">${esc(note)}</div>` : ""}
        </div>`;
      drawBoard();
      document.getElementById("gk-board").addEventListener("click", tapBoard);
    }
    function tapBoard(e) {
      if (!match || match.status !== "ACTIVE" || !match.myTurn || !open.open || sending) return;
      const c = e.currentTarget, r = c.getBoundingClientRect(), n = match.size;
      const side = PAD * 2 + CELL * (n - 1), k = side / r.width;
      const x = Math.round(((e.clientX - r.left) * k - PAD) / CELL), y = Math.round(((e.clientY - r.top) * k - PAD) / CELL);
      if (x < 0 || y < 0 || x >= n || y >= n || match.moves.some((m) => m[0] === x && m[1] === y)) return;
      pick = [x, y];
      drawBoard();
      const b = document.getElementById("gk-place");
      if (b) { b.disabled = false; b.textContent = PLACE_TEXT; }
    }
    // 상대 차례면 서버에서 판이 바뀔 때까지 기다린다 — 상대가 두는 즉시 돌아와 바로 그린다. 화면이 보일 때만
    function schedulePoll(delay = 0) {
      stopPoll();
      if (!match || ["DONE", "DECLINED", "EXPIRED"].includes(match.status) || match.myTurn) return;
      timer = setTimeout(async () => {
        timer = 0;
        if (document.hidden || !match) return; // 다시 보이면 visibilitychange 에서 판을 새로 연다
        const id = match.id, ctl = new AbortController();
        waiter = ctl;
        let next;
        try { next = await HKApi.matchWait(id, match.moveCount, match.status, ctl.signal); }
        catch (_) {
          if (waiter === ctl) { waiter = null; schedulePoll(3000); } // 잠깐 끊기면 3초 뒤 다시
          return;
        }
        if (waiter !== ctl || !match || match.id !== id) return; // 그새 내가 두었거나 다른 판으로 감
        waiter = null;
        const changed = next.moveCount !== match.moveCount || next.status !== match.status;
        match = next;
        if (changed) { pick = null; paintMatch(); }
        schedulePoll();
      }, delay);
    }
    async function showMatch(id) {
      stopPoll(); pick = null;
      try { [match, open] = await Promise.all([HKApi.matchDetail(id), HKApi.playStatus().catch(() => ({ open: true }))]); }
      catch (e) { fail(e); location.hash = ""; return; }
      if (match.game !== GAME) { location.href = `/games/${match.game}#m${id}`; return; }
      paintMatch();
      schedulePoll();
    }
    async function afterMove(next) {
      // 컴퓨터의 수는 내 수와 같이 오니, 내 돌을 먼저 보여 주고 잠깐 뒤에 둔다
      const seen = match.moves.length;
      if (next.bot && next.moves.length === seen + 2) {
        match = { ...next, moves: next.moves.slice(0, seen + 1), status: "ACTIVE", myTurn: false, result: null, moveCount: seen + 1 };
        pick = null; paintMatch();
        const msg = document.querySelector(".gk__msg");
        if (msg) msg.textContent = "컴퓨터가 생각 중…";
        await new Promise((f) => setTimeout(f, 650));
        if (!match || match.id !== next.id) return;
      }
      match = next; pick = null; paintMatch(); schedulePoll();
      if (next.stamp && next.stamp.new) HKUI.toast(`오늘 도장을 받았어요 (${next.stamp.count}/${next.stamp.goal})`);
    }
    async function place() {
      if (!pick || sending) return;
      sending = true;
      try { afterMove(await HKApi.matchMove(match.id, { x: pick[0], y: pick[1] }, match.moves.length)); }
      catch (e) { fail(e); await showMatch(match.id); }
      sending = false;
    }

    function route() {
      const m = /^#m(\d+)$/.exec(location.hash);
      if (m) showMatch(Number(m[1])); else showLobby();
    }
    HKMember.mountPage({
      active: "lounge",
      auth: true,
      render: () => `<div id="gk-root"></div>`,
      afterMount: () => {
        root = document.getElementById("gk-root");
        root.addEventListener("click", async (e) => {
          const t = e.target.closest("button, a");
          if (!t) return;
          if (t.id === "gk-place") return place();
          if (t.id === "gk-resign") {
            if (!(await HKUI.confirmDialog("기권할까요?", "이 판은 패배로 끝나요.", { confirmLabel: "기권" }))) return;
            try { afterMove(await HKApi.matchResign(match.id)); } catch (err) { fail(err); }
            return;
          }
          if (t.getAttribute("href") === "#") { e.preventDefault(); location.hash = ""; return; }
          await HKMatch.act(t, GAME, showLobby);
        });
        window.addEventListener("hashchange", route);
        window.addEventListener("keydown", (e) => {
          if (e.code !== "Space" || !match || document.querySelector(".hk-dialog__overlay")) return;
          e.preventDefault(); // 판을 보는 동안 스페이스로 화면이 내려가지 않게
          if (pick && !e.repeat) place();
        });
        document.addEventListener("visibilitychange", () => { if (!document.hidden && match) showMatch(match.id); });
        route();
      },
    });
  </script>
</body>
</html>
