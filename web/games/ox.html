<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>OX 서바이벌 — 점심 라운지</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    .gm-ox { --gm-a: #f59e0b; --gm-b: #fcd34d; --gm-ink: #9a5b00; --gm-soft: #fff8e6; --gm-line: #fde3a7; --gm-o: #2f6bff; --gm-x: #e5484d;
      position: relative; background: var(--surface-card, #fff); border: 1px solid var(--color-mist-border, #e3e8f0); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(245, 158, 11, .12); user-select: none; -webkit-user-select: none; touch-action: manipulation; }

    /* 생존 사다리 */
    .gm-ox__ladder { padding: 14px 16px 10px; background: linear-gradient(180deg, var(--gm-soft), #fff); border-bottom: 1px solid var(--gm-line); }
    .gm-ox__ladder-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--gm-ink); font-weight: 700; margin-bottom: 8px; }
    .gm-ox__ladder-head span:last-child { color: var(--color-midnight-navy); font-variant-numeric: tabular-nums; }
    .gm-ox__rungs { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 82px; padding-top: 22px; }
    .gm-ox__rung { position: relative; flex: 1 1 0; min-width: 0; border-radius: 6px 6px 3px 3px; background: #eef1f6; border: 1.5px solid #dfe5ee; transition: background .3s, border-color .3s; }
    .gm-ox__rung.is-pass { background: linear-gradient(180deg, var(--gm-b), var(--gm-a)); border-color: var(--gm-a); }
    .gm-ox__rung.is-now { background: #fff; border: 2px solid var(--gm-a); box-shadow: 0 0 0 3px rgba(245, 158, 11, .18); }
    .gm-ox__rung.is-crux:not(.is-pass) { border-style: dashed; border-color: #f08a4b; }
    .gm-ox__rung.is-fail { background: #fde4e4; border-color: var(--gm-x); }
    .gm-ox__rung-n { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 10px; font-weight: 700; color: #94a3b8; }
    .gm-ox__rung.is-pass .gm-ox__rung-n { color: #fff; }
    .gm-ox__flag { position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); font-size: 10px; font-weight: 800; color: #e2672a; white-space: nowrap; }
    .gm-ox__goal { position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); color: var(--gm-a); display: flex; }
    .gm-ox__me { position: absolute; left: 50%; bottom: calc(100% + 3px); width: 16px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: var(--color-midnight-navy, #0f1b3d); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(15, 27, 61, .3); animation: gm-hop .4s ease-out; z-index: 2; }

    .gm-ox__timer { height: 8px; background: #f3f4f6; }
    .gm-ox__timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gm-a), var(--gm-b)); transform-origin: left center; }
    .gm-ox__timer.is-low i { background: var(--gm-x); }

    .gm-ox__body { padding: 18px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
    .gm-ox__meta { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-secondary); }
    .gm-ox__qno { font-weight: 800; font-size: 15px; color: var(--color-midnight-navy); }
    .gm-ox__crux { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: #ffe9dc; color: #d4561b; font-size: 12.5px; font-weight: 800; animation: gm-pulse 1.1s ease-in-out infinite; }
    .gm-ox__sec { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; color: var(--color-midnight-navy); font-size: 15px; }
    .gm-ox__q { margin: 0; min-height: 96px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 20px; line-height: 1.5; font-weight: 700; color: var(--color-midnight-navy); padding: 16px 14px; border-radius: 14px; background: var(--color-mist, #f3f6fa); word-break: keep-all; }
    .gm-ox__btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gm-ox__btn { position: relative; height: 128px; border-radius: 16px; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; transition: transform .08s, box-shadow .15s; }
    .gm-ox__btn:active { transform: scale(.97); }
    .gm-ox__btn--o { background: #eef3ff; color: var(--gm-o); border-color: #cfdcff; }
    .gm-ox__btn--x { background: #fff0f0; color: var(--gm-x); border-color: #ffd0d0; }
    .gm-ox__btn--o:hover { box-shadow: 0 6px 16px rgba(47, 107, 255, .18); }
    .gm-ox__btn--x:hover { box-shadow: 0 6px 16px rgba(229, 72, 77, .18); }
    .gm-ox__btn.is-picked { transform: scale(.96); }
    .gm-ox__btn kbd { font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-muted); }
    .gm-ox__mark-o { width: 58px; height: 58px; border-radius: 50%; border: 10px solid currentColor; box-sizing: border-box; }
    .gm-ox__mark-x { position: relative; width: 60px; height: 60px; }
    .gm-ox__mark-x::before, .gm-ox__mark-x::after { content: ""; position: absolute; left: 50%; top: 50%; width: 70px; height: 10px; border-radius: 5px; background: currentColor; transform: translate(-50%, -50%) rotate(45deg); }
    .gm-ox__mark-x::after { transform: translate(-50%, -50%) rotate(-45deg); }

    /* 정답 해설 띠 (1초) */
    .gm-ox__fb { position: absolute; left: 0; right: 0; bottom: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; text-align: center; background: rgba(255, 255, 255, .96); animation: gm-fade .15s ease-out; z-index: 3; }
    .gm-ox__fb-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 16px; color: #fff; background: linear-gradient(135deg, var(--gm-a), #f7b733); }
    .gm-ox__fb-pts { font-size: 13.5px; font-weight: 700; color: var(--gm-ink); }
    .gm-ox__fb-tip { margin: 0; max-width: 420px; font-size: 15.5px; line-height: 1.55; color: var(--color-midnight-navy); word-break: keep-all; }

    .gm-ox__pause { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; background: rgba(255, 248, 230, .98); }
    .gm-ox__pause b { font-size: 20px; color: var(--color-midnight-navy); }

    /* 시작 · 끝 화면 */
    .gm-ox__intro { padding: 24px 22px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .gm-ox__date { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--gm-ink); background: var(--gm-soft); border: 1px solid var(--gm-line); padding: 6px 14px; border-radius: 999px; }
    .gm-ox__h { margin: 0; font-size: 24px; color: var(--color-midnight-navy); }
    .gm-ox__hero { display: flex; align-items: center; gap: 14px; }
    .gm-ox__hero .gm-ox__mark-o { width: 46px; height: 46px; border-width: 8px; color: var(--gm-o); }
    .gm-ox__hero .gm-ox__mark-x { width: 46px; height: 46px; color: var(--gm-x); }
    .gm-ox__hero .gm-ox__mark-x::before, .gm-ox__hero .gm-ox__mark-x::after { width: 54px; height: 8px; }
    .gm-ox__rules { margin: 0; padding: 14px 16px; list-style: none; width: 100%; max-width: 430px; text-align: left; border-radius: 12px; background: var(--color-mist, #f3f6fa); display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.5; color: var(--text-secondary); }
    .gm-ox__rules li { display: flex; gap: 8px; }
    .gm-ox__rules li > span:first-child { flex-shrink: 0; width: 18px; height: 18px; border-radius: 6px; margin-top: 2px; background: #fff; border: 1px solid var(--gm-line); color: var(--gm-ink); font-size: 11.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .gm-ox__rules b { color: var(--color-midnight-navy); }
    .gm-ox__note { width: 100%; max-width: 430px; padding: 10px 14px; border-radius: 12px; background: #eef3ff; color: #2350c8; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .gm-ox__start { min-width: 200px; height: 52px; border: 0; border-radius: 14px; color: #4a2c00; font-size: 17px; font-weight: 800; background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); box-shadow: 0 6px 18px rgba(245, 158, 11, .32); cursor: pointer; }
    .gm-ox__start:hover { filter: brightness(1.04); }
    .gm-ox__start--ghost { background: #fff; color: var(--color-midnight-navy); border: 1px solid var(--border-default, #d6dde8); box-shadow: none; }
    .gm-ox__end-badge { width: 72px; height: 72px; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
    .gm-ox__end-badge.is-out { background: #fde4e4; }
    .gm-ox__end-badge.is-win { background: linear-gradient(135deg, var(--gm-a), var(--gm-b)); }
    .gm-ox__end-title { font-size: 28px; font-weight: 800; color: var(--color-midnight-navy); letter-spacing: -.01em; }
    .gm-ox__end-sub { margin: -6px 0 0; font-size: 15px; color: var(--text-secondary); }
    .gm-ox__why { width: 100%; max-width: 430px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid #ffd0d0; background: #fff7f7; display: flex; flex-direction: column; gap: 8px; }
    .gm-ox__why-q { font-size: 15px; font-weight: 700; color: var(--color-midnight-navy); line-height: 1.5; word-break: keep-all; }
    .gm-ox__why-a { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); }
    .gm-ox__why-a b { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; color: #fff; font-size: 15px; }
    .gm-ox__why-tip { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--color-midnight-navy); word-break: keep-all; }
    .gm-ox__calc { width: 100%; max-width: 430px; display: grid; grid-template-columns: 1fr auto; gap: 6px 0; font-size: 14px; color: var(--text-secondary); padding: 12px 16px; border-radius: 12px; background: var(--color-mist, #f3f6fa); text-align: left; }
    .gm-ox__calc b { color: var(--color-midnight-navy); text-align: right; font-variant-numeric: tabular-nums; }
    .gm-ox__calc .is-total { border-top: 1px solid var(--color-mist-border, #e3e8f0); padding-top: 6px; font-weight: 800; color: var(--color-midnight-navy); }
    .gm-ox__review { width: 100%; max-width: 430px; text-align: left; }
    .gm-ox__review summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--gm-ink); padding: 6px 0; }
    .gm-ox__review ol { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .gm-ox__review li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--color-mist-border, #e3e8f0); font-size: 13.5px; line-height: 1.5; color: var(--text-secondary); word-break: keep-all; }
    .gm-ox__review li b { color: var(--color-midnight-navy); }
    .gm-ox__chip { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
    .gm-ox__chip.is-o { background: var(--gm-o); } .gm-ox__chip.is-x { background: var(--gm-x); }
    .gm-ox__confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .gm-ox__confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: gm-fall 2.4s linear forwards; }

    @keyframes gm-hop { 0% { transform: translate(-50%, 8px); opacity: .3; } 60% { transform: translate(-50%, -6px); opacity: 1; } 100% { transform: translate(-50%, 0); } }
    @keyframes gm-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes gm-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes gm-fall { to { transform: translateY(560px) rotate(540deg); opacity: .2; } }
    @keyframes gm-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    .gm-ox.is-shake { animation: gm-shake .35s; }

    @media (max-width: 480px) {
      .gm-ox__ladder { padding: 12px 12px 8px; }
      .gm-ox__rungs { gap: 2px; height: 74px; }
      .gm-ox__rung-n { font-size: 9px; }
      .gm-ox__body { padding: 16px 14px; gap: 12px; }
      .gm-ox__q { font-size: 18px; min-height: 104px; }
      .gm-ox__btn { height: 116px; }
      .gm-ox__btn kbd { display: none; }
      .gm-ox__intro { padding: 22px 14px; }
      .gm-ox__h { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // [문장, 정답(true=O), 해설, 난이도 1~3]
    // 의학적으로 널리 확립된 상식만. "경우에 따라 다름"인 문장은 넣지 않음.
    const BANK = [
      // ── O ──
      ["흡연은 폐암의 주요 원인이에요.", true, "담배 연기 속 여러 발암물질이 폐암 위험을 크게 높여요.", 1],
      ["간접흡연도 건강에 해로워요.", true, "남이 피운 담배 연기에도 해로운 물질이 그대로 들어 있어요.", 1],
      ["소금을 많이 먹으면 혈압이 오를 수 있어요.", true, "나트륨을 줄이는 것은 혈압 관리의 기본이에요.", 1],
      ["칼슘은 뼈 건강에 중요한 영양소예요.", true, "뼈와 치아를 이루는 주성분이라 꾸준히 챙겨야 해요.", 1],
      ["오래 앉아 있다면 중간중간 일어나 움직이는 것이 좋아요.", true, "잠깐씩 일어나 걷기만 해도 굳은 몸과 혈액순환에 도움이 돼요.", 1],
      ["식이섬유는 장 운동을 도와요.", true, "채소·과일·통곡물을 챙기면 배변에도 도움이 돼요.", 1],
      ["땀을 많이 흘린 뒤에는 수분을 보충해야 해요.", true, "빠져나간 만큼 물을 채워 줘야 탈수를 막을 수 있어요.", 1],
      ["걷기도 유산소 운동이에요.", true, "빠르게 걸으면 훌륭한 중강도 유산소 운동이 돼요.", 1],
      ["계단 오르기는 생활 속에서 할 수 있는 좋은 운동이에요.", true, "짧은 시간에도 심박수를 올리고 다리 근육을 써요.", 1],
      ["단백질은 근육을 만드는 데 필요한 영양소예요.", true, "콩·두부·달걀·생선·살코기로 골고루 챙겨 주세요.", 1],
      ["채소와 과일에는 비타민과 식이섬유가 풍부해요.", true, "여러 색의 채소와 과일을 골고루 먹으면 좋아요.", 1],
      ["기침할 때는 손바닥보다 옷소매로 입과 코를 가리는 것이 좋아요.", true, "손에 묻은 침방울이 문고리 등으로 퍼지는 것을 막을 수 있어요.", 1],
      ["성인은 하루 7시간 이상 자는 것이 권장돼요.", true, "충분한 잠은 면역력과 집중력을 지키는 기본이에요.", 2],

      ["세계보건기구(WHO)는 성인에게 일주일에 150분 이상의 중강도 신체활동을 권장해요.", true, "하루 30분씩 주 5일이면 채울 수 있어요.", 2],

                <li><span>1</span><span>건강 상식 문장이 맞으면 <b>O</b>, 틀리면 <b>X</b>. 문제마다 <b>10초</b>예요.</span></li>
                <li><span>2</span><span>한 번이라도 틀리거나 시간이 지나면 <b>탈락</b>! 15문제를 모두 맞히면 완주예요.</span></li>
                <li><span>3</span><span><b>5번·10번</b>은 고비 문제. 뒤로 갈수록 어려워져요.</span></li>
                <li><span>4</span><span>맞힌 문제 × 100 + 남은 시간(0.1초당 1점) · 완주하면 <b>+500</b></span></li>
                <li><span>5</span><span>PC는 <b>O / X</b> 키 또는 <b>← / →</b>, 휴대폰은 버튼을 눌러요.</span></li>
              </ul>
              ${ctx.dailyDone ? `<div class="gm-ox__note">${HKUI.icon("info", 16, "currentColor")} 오늘 기록은 이미 반영됐어요 · 이번 판은 연습</div>` : ""}
              <button type="button" class="gm-ox__start" data-start>도전 시작</button>
            </div>
          </div>`;
          stage.querySelector("[data-start]").onclick = async (e) => {
            // 오늘의 도전 시작 신고 — 새로고침 후 다시 시작하면 연습으로 처리된다
            e.currentTarget.disabled = true;
            await ctx.begin();
            startGame();
          };
          HKUI.refreshIcons(stage);
        }

        function startGame() {
          qs = todaysQuestions();
          idx = 0;
          alive = 0;
          tenthsSum = 0;
          submitted = false;
          showQuestion();
        }

        // ── 문제 화면 ──
        function showQuestion() {
          stopLoops();
          phase = "play";
          remainMs = LIMIT_MS;
          const n = idx + 1;
          const crux = CRUX.includes(n);
          stage.innerHTML = `<div class="gm-ox">
            ${ladderHtml()}
            <div class="gm-ox__timer" data-timer><i></i></div>
            <div class="gm-ox__body">
              <div class="gm-ox__meta">
                <span class="gm-ox__qno">Q${n}</span><span>/ ${TOTAL}</span>
                ${crux ? `<span class="gm-ox__crux">${HKUI.icon("flame", 13, "currentColor")} 고비 문제</span>` : ""}
                <span class="gm-ox__sec" data-sec>10.0초</span>
              </div>
              <p class="gm-ox__q">${esc(qs[idx][0])}</p>
              <div class="gm-ox__btns">
                <button type="button" class="gm-ox__btn gm-ox__btn--o" data-ans="o" aria-label="O, 맞아요"><span class="gm-ox__mark-o"></span><span>맞아요 <kbd>O · ←</kbd></span></button>
                <button type="button" class="gm-ox__btn gm-ox__btn--x" data-ans="x" aria-label="X, 아니에요"><span class="gm-ox__mark-x"></span><span>아니에요 <kbd>X · →</kbd></span></button>
              </div>
            </div>
          </div>`;
          stage.querySelectorAll("[data-ans]").forEach((b) => {
            b.onclick = () => answer(b.dataset.ans === "o");
          });
          HKUI.refreshIcons(stage);
          lastTs = performance.now();
          raf = requestAnimationFrame(tick);
        }

        function tick(ts) {
          if (phase !== "play") return;
          const dt = Math.min(ts - lastTs, 250);
          lastTs = ts;
          remainMs = Math.max(0, remainMs - dt);
          const bar = stage.querySelector("[data-timer]");
          if (bar) {
            bar.firstElementChild.style.transform = `scaleX(${remainMs / LIMIT_MS})`;
            bar.classList.toggle("is-low", remainMs < 3000);
            stage.querySelector("[data-sec]").textContent = `${(Math.ceil(remainMs / 100) / 10).toFixed(1)}초`;
          }
          if (remainMs <= 0) {
            eliminate(null);
            return;
          }
          raf = requestAnimationFrame(tick);
        }

        function answer(saidO) {
          if (phase !== "play") return;
          const picked = stage.querySelector(`[data-ans="${saidO ? "o" : "x"}"]`);
          picked?.classList.add("is-picked");
          if (saidO !== qs[idx][1]) {
            eliminate(saidO);
            return;
          }
          stopLoops();
          phase = "feedback";
          const tenths = Math.floor(remainMs / 100);
          tenthsSum += tenths;
          alive++;
          // 사다리 한 칸 올리기 + 해설 1초
          stage.querySelector(".gm-ox__ladder").outerHTML = ladderHtml();
          const fb = document.createElement("div");
          fb.className = "gm-ox__fb";
          fb.innerHTML = `<span class="gm-ox__fb-badge">${HKUI.icon("check", 18, "#fff")} 정답! 한 칸 위로</span>
            <span class="gm-ox__fb-pts">+100 · 남은 시간 +${tenths}</span>
            <p class="gm-ox__fb-tip">${esc(qs[idx][2])}</p>`;
          stage.querySelector(".gm-ox__body").style.position = "relative";
          stage.querySelector(".gm-ox__body").appendChild(fb);
          HKUI.refreshIcons(stage);
          timer = setTimeout(() => {
            idx++;
            if (idx >= TOTAL) finish();
            else showQuestion();
          }, FEEDBACK_MS);
        }

        const scoreNow = (won) => alive * 100 + tenthsSum + (won ? FINISH_BONUS : 0);

        function scheduleSubmit(score) {
          const go = () => {
            if (submitted) return;
            submitted = true;
            clearTimeout(submitTimer);
            ctx.submit(score);
          };
          stage.querySelector("[data-save]")?.addEventListener("click", go);
          submitTimer = setTimeout(go, 2600);
        }

        function reviewHtml(upto) {
          const items = qs.slice(0, upto).map((q) => `<li><span class="gm-ox__chip ${q[1] ? "is-o" : "is-x"}">${q[1] ? "O" : "X"}</span><span><b>${esc(q[0])}</b><br>${esc(q[2])}</span></li>`).join("");
          return items ? `<details class="gm-ox__review"><summary>오늘 문제 다시 보기 (${upto}문제)</summary><ol>${items}</ol></details>` : "";
        }

        // ── 탈락 ──
        function eliminate(saidO) {
          stopLoops();
          phase = "over";
          const q = qs[idx];
          const timeout = saidO === null;
          const score = scoreNow(false);
          const card = stage.querySelector(".gm-ox");
          card.classList.add("is-shake");
          timer = setTimeout(() => {
            stage.innerHTML = `<div class="gm-ox">
              ${ladderHtml(idx)}
              <div class="gm-ox__intro">
                <div class="gm-ox__end-badge is-out">${HKUI.icon(timeout ? "timer-off" : "x", 34, "#e5484d")}</div>
                <div class="gm-ox__end-title">탈락!</div>
                <p class="gm-ox__end-sub">${timeout ? "시간이 다 됐어요" : "아쉽게 틀렸어요"} · Q${idx + 1}에서 멈췄어요 (${alive}문제 생존)</p>
                <div class="gm-ox__why">
                  <div class="gm-ox__why-q">${esc(q[0])}</div>
                  <div class="gm-ox__why-a">정답은 <b style="background:${q[1] ? "var(--gm-o)" : "var(--gm-x)"}">${q[1] ? "O" : "X"}</b>${timeout ? "" : ` · 내 답 ${saidO ? "O" : "X"}`}</div>
                  <p class="gm-ox__why-tip">${esc(q[2])}</p>
                </div>
                <div class="gm-ox__calc">
                  <span>맞힌 문제 ${alive}개 × 100</span><b>${alive * 100}</b>
                  <span>남은 시간 보너스</span><b>+${tenthsSum}</b>
                  <span class="is-total">합계</span><b class="is-total">${score}점</b>
                </div>
                ${reviewHtml(idx + 1)}
                <button type="button" class="gm-ox__start" data-save>기록 저장하고 순위 보기</button>
              </div>
            </div>`;
            HKUI.refreshIcons(stage);
            scheduleSubmit(score);
          }, 380);
        }

        // ── 완주 ──
        function finish() {
          stopLoops();
          phase = "over";
          const score = scoreNow(true);
          const colors = ["#f59e0b", "#fcd34d", "#2f6bff", "#e5484d", "#16a06a", "#e0508a"];
          const bits = Array.from({ length: 40 }, () => `<i style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * colors.length)]};animation-delay:${(Math.random() * 0.8).toFixed(2)}s;transform:rotate(${Math.floor(Math.random() * 180)}deg)"></i>`).join("");
          stage.innerHTML = `<div class="gm-ox">
            <div class="gm-ox__confetti" aria-hidden="true">${bits}</div>
            ${ladderHtml()}
            <div class="gm-ox__intro">
              <div class="gm-ox__end-badge is-win">${HKUI.icon("trophy", 36, "#fff")}</div>
              <div class="gm-ox__end-title">완주!</div>
              <p class="gm-ox__end-sub">15문제를 모두 맞혔어요. 오늘의 건강 상식 박사예요!</p>
              <div class="gm-ox__calc">
                <span>맞힌 문제 15개 × 100</span><b>1500</b>
                <span>남은 시간 보너스</span><b>+${tenthsSum}</b>
                <span>완주 보너스</span><b>+${FINISH_BONUS}</b>
                <span class="is-total">합계</span><b class="is-total">${score}점</b>
              </div>
              ${reviewHtml(TOTAL)}
              <button type="button" class="gm-ox__start" data-save>기록 저장하고 순위 보기</button>
            </div>
          </div>`;
          HKUI.refreshIcons(stage);
          scheduleSubmit(score);
        }

        // ── 키보드: O / X 또는 ← / → ──
        document.addEventListener("keydown", (e) => {
          if (phase !== "play" && phase !== "feedback") return;
          const t = e.target;
          if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
          if (document.querySelector(".hk-dialog__overlay")) return;
          const k = e.code;
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(k)) e.preventDefault();
          if (phase !== "play" || e.repeat) return;
          if (k === "KeyO" || k === "ArrowLeft") answer(true);
          else if (k === "KeyX" || k === "ArrowRight") answer(false);
        });

        // ── 일시정지 (탭을 떠나면) — 문제는 가려 둬요 ──
        function pause() {
          if (phase !== "play") return;
          stopLoops();
          phase = "paused";
          const p = document.createElement("div");
          p.className = "gm-ox__pause";
          p.innerHTML = `${HKUI.icon("pause", 30, "#f59e0b")}<b>잠시 멈췄어요</b><span style="font-size:14px;color:var(--text-secondary)">남은 시간은 그대로예요</span><button type="button" class="gm-ox__start" data-resume>이어서 하기</button>`;
          stage.querySelector(".gm-ox").appendChild(p);
          HKUI.refreshIcons(p);
          p.querySelector("[data-resume]").onclick = () => {
            p.remove();
            phase = "play";
            lastTs = performance.now();
            raf = requestAnimationFrame(tick);
          };
        }
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) pause();
        });

        ctx.onRestart(showIntro);
        showIntro();
      },
    });
  </script>
</body>
</html>
