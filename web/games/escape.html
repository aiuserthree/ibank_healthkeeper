<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 야근 사무실 탈출</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <script src="/_shared/coop.js"></script>
  <style>
    .er-things { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
    .er-thing { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 92px; padding: 12px; border: 1.5px solid var(--border-default); border-radius: 14px; background: #f8fafc; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .er-thing:hover { border-color: #94a3b8; }
    .er-thing.is-on { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .er-thing.is-dim { opacity: .55; }
    .er-thing b { font-size: 14px; line-height: 1.35; word-break: keep-all; }
    .er-thing__ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #fff; color: #334155; box-shadow: 0 1px 2px rgba(15, 23, 42, .08); }
    .er-thing__tag { position: absolute; top: 9px; right: 9px; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 800; }
    .er-thing__tag.is-lock { background: #fef3c7; color: #92400e; }
    .er-thing__tag.is-open { background: #dcfce7; color: #166534; }
    .er-thing__tag.is-new { background: #2563eb; color: #fff; }
    .er-detail { margin-top: 14px; padding: 16px; border-radius: 14px; background: #f1f5f9; }
    .er-detail h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 17px; font-weight: 800; }
    .er-detail p { margin: 0; font-size: 15px; line-height: 1.7; word-break: keep-all; }
    .er-art { margin-top: 14px; }
    .er-art svg { display: block; width: 100%; height: auto; max-width: 560px; margin: 0 auto; }
    .er-booking { width: 100%; max-width: 460px; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; font-size: 14px; }
    .er-booking th, .er-booking td { padding: 9px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .er-booking th { background: #e2e8f0; font-size: 12.5px; color: #475569; }
    .er-lock { margin-top: 16px; padding: 14px; border: 1.5px dashed #94a3b8; border-radius: 14px; background: #fff; }
    .er-lock__head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 800; }
    .er-lock__done { padding: 12px; border-radius: 12px; background: #dcfce7; color: #166534; font-weight: 800; text-align: center; }
    .er-digits { width: 100%; max-width: 240px; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font: 800 28px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5em; text-align: center; }
    .er-digits:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
    .er-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .er-slots { display: flex; gap: 8px; margin-bottom: 10px; }
    .er-slot { width: 44px; height: 44px; border: 2px dashed #cbd5e1; border-radius: 12px; }
    .er-swatch { width: 52px; height: 44px; border: 0; border-radius: 12px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15); color: #fff; font: inherit; font-size: 12px; font-weight: 800; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
    .er-switches { display: flex; gap: 10px; margin-bottom: 12px; }
    .er-switch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; font: inherit; font-size: 12px; font-weight: 700; color: #475569; cursor: pointer; }
    .er-switch__body { position: relative; width: 38px; height: 64px; border-radius: 10px; background: #334155; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .4); }
    .er-switch__knob { position: absolute; left: 5px; right: 5px; height: 26px; border-radius: 7px; background: #e2e8f0; transition: top .12s; }
    .er-switch.is-up .er-switch__knob { top: 5px; background: #fde047; }
    .er-switch.is-down .er-switch__knob { top: 33px; }
    .er-hint { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fef9c3; color: #713f12; font-size: 14px; line-height: 1.6; word-break: keep-all; }
    .er-cardbtn { width: 100%; padding: 16px; font-size: 17px; }
    .er-cardnote { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 800; color: #1d4ed8; }
    .er-prog { margin: 0; padding: 0; list-style: none; }
    .er-prog li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .er-prog li:last-child { border-bottom: 0; }
    .er-prog small { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .er-prog .is-solved b { text-decoration: line-through; color: var(--text-muted); }
    .er-prog .is-closed { opacity: .5; }
    .er-prog__hint { display: block; margin: -2px 0 8px 26px; font-size: 12.5px; line-height: 1.55; color: #713f12; word-break: keep-all; }
    @media (max-width: 640px) { .er-things { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 야근 사무실 탈출 — 2인 협동 방탈출. 초대 → 수락 → 둘 다 준비 → 20분 안에 탈출 (방 공용은 /_shared/coop.js)
    const { esc } = HKMatch;
    const { mmss } = HKCoop;
    const COLORS = { red: ["#ef4444", "빨강"], yellow: ["#eab308", "노랑"], green: ["#22c55e", "초록"], blue: ["#3b82f6", "파랑"] };
    let room = null, pick = null, seen = new Set();
    const draft = { digits: {}, colors: {}, switches: {} };

    // ---------- 그림(단서) ----------
    function artHtml(a) {
      if (!a) return "";
      if (a.kind === "folders") {
        const w = 560, cell = w / a.items.length;
        const folders = a.items.map((it, i) => {
          const x = i * cell + cell / 2, c = COLORS[it.color][0];
          return `<g transform="translate(${x - 34},70)">
              <path d="M0 10 q0-8 8-8 h20 l8 9 h28 q8 0 8 8 v40 q0 8-8 8 h-56 q-8 0-8-8z" fill="${c}"/>
              <rect x="0" y="20" width="72" height="47" rx="7" fill="${c}" opacity=".85"/>
            </g><text x="${x}" y="164" text-anchor="middle" font-size="13" fill="#e2e8f0" font-family="sans-serif">${esc(it.label)}</text>`;
        }).join("");
        return `<svg viewBox="0 0 ${w} 230" role="img" aria-label="모니터 바탕화면 폴더">
            <rect x="6" y="6" width="${w - 12}" height="196" rx="14" fill="#111827"/>
            <rect x="18" y="18" width="${w - 36}" height="172" rx="6" fill="#1e3a8a"/>
            <circle cx="${w - 50}" cy="46" r="26" fill="#fde68a" opacity=".25"/>
            ${folders}
            <rect x="${w / 2 - 40}" y="202" width="80" height="14" fill="#374151"/><rect x="${w / 2 - 80}" y="214" width="160" height="10" rx="5" fill="#4b5563"/>
          </svg>`;
      }
      if (a.kind === "switches") {
        const sw = a.items.map((v, i) => {
          const x = 40 + i * 92;
          return `<g transform="translate(${x},28)"><rect width="52" height="96" rx="12" fill="#334155"/><rect x="7" y="${v ? 8 : 50}" width="38" height="38" rx="8" fill="${v ? "#fde047" : "#cbd5e1"}"/>
              <text x="26" y="${v ? -8 : 120}" text-anchor="middle" font-size="22" fill="#0f172a">${v ? "▲" : "▼"}</text></g>
              <text x="${x + 26}" y="170" text-anchor="middle" font-size="13" fill="#475569" font-family="sans-serif">${i + 1}번</text>`;
        }).join("");
        return `<svg viewBox="0 0 520 186" role="img" aria-label="차단기 스위치 그림"><rect x="2" y="2" width="516" height="182" rx="16" fill="#fefce8" stroke="#eab308" stroke-dasharray="6 5"/>${sw}</svg>`;
      }
      if (a.kind === "booking") {
        return `<table class="er-booking"><thead><tr><th>시간</th><th>회의실</th><th>회의</th></tr></thead><tbody>${a.items.map((b) => `<tr><td>${esc(b.time)}</td><td><b>${esc(b.room)}</b></td><td>${esc(b.what)}</td></tr>`).join("")}</tbody></table>`;
      }
      if (a.kind === "cake") {
        return `<svg viewBox="0 0 420 220" role="img" aria-label="케이크 상자 메모">
            <rect x="60" y="70" width="300" height="130" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
            <path d="M60 70 L210 30 L360 70" fill="#ffedd5" stroke="#fdba74" stroke-width="3"/>
            <rect x="200" y="30" width="20" height="170" fill="#f472b6" opacity=".7"/>
            <g transform="rotate(-4 210 130)"><rect x="110" y="88" width="200" height="94" rx="6" fill="#fef08a" stroke="#eab308"/>
            ${a.lines.map((l, i) => `<text x="210" y="${116 + i * 26}" text-anchor="middle" font-size="${i === 1 ? 22 : 15}" font-weight="${i === 1 ? 800 : 600}" fill="#713f12" font-family="sans-serif">${esc(l)}</text>`).join("")}</g>
          </svg>`;
      }
      if (a.kind === "clocks") {
        const n = a.items.length, w = 140 * n;
        const faces = a.items.map((c, i) => {
          const cx = 70 + i * 140, cy = 78, r = 54;
          const ang = ((c.hour % 12) + c.minute / 60) * 30 * Math.PI / 180, mang = c.minute * 6 * Math.PI / 180;
          const nums = Array.from({ length: 12 }, (_, k) => { const t = (k + 1) * 30 * Math.PI / 180; return `<text x="${cx + Math.sin(t) * 41}" y="${cy - Math.cos(t) * 41 + 4.5}" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">${k + 1}</text>`; }).join("");
          return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#334155" stroke-width="4"/>${nums}
              <line x1="${cx}" y1="${cy}" x2="${cx + Math.sin(ang) * 26}" y2="${cy - Math.cos(ang) * 26}" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
              <line x1="${cx}" y1="${cy}" x2="${cx + Math.sin(mang) * 38}" y2="${cy - Math.cos(mang) * 38}" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
              <circle cx="${cx}" cy="${cy}" r="4" fill="#0f172a"/>
              <text x="${cx}" y="${cy + r + 24}" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="sans-serif">${esc(c.room)}</text>`;
        }).join("");
        return `<svg viewBox="0 0 ${w} 168" role="img" aria-label="회의실 시계들">${faces}</svg>`;
      }
      return "";
    }

    // ---------- 자물쇠 ----------
    function lockHtml(t) {
      const L = t.lock;
      if (!L) return "";
      if (L.solved) return `<div class="er-lock"><div class="er-lock__done">열렸어요 ✓</div></div>`;
      if (!L.open) return "";
      let body = "";
      if (L.kind === "digits") {
        body = `<div class="er-row"><input class="er-digits" id="er-in-${L.key}" data-digits="${L.key}" inputmode="numeric" autocomplete="off" maxlength="${L.length}" placeholder="${"0".repeat(L.length)}" value="${esc(draft.digits[L.key] || "")}">
            <button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}">열기</button></div>`;
      } else if (L.kind === "colors") {
        const cur = draft.colors[L.key] || [];
        body = `<div class="er-slots">${Array.from({ length: L.length }, (_, i) => `<span class="er-slot" style="${cur[i] ? `border:0;background:${COLORS[cur[i]][0]}` : ""}"></span>`).join("")}</div>
            <div class="er-row">${L.options.map((c) => `<button type="button" class="er-swatch" style="background:${COLORS[c][0]}" data-color="${L.key}:${c}">${COLORS[c][1]}</button>`).join("")}</div>
            <div class="er-row" style="margin-top:10px"><button type="button" class="hk-btn hk-btn--secondary" data-clear="${L.key}">지우기</button><button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}" ${cur.length === L.length ? "" : "disabled"}>열기</button></div>`;
      } else if (L.kind === "switches") {
        const cur = draft.switches[L.key] || Array(L.length).fill(0);
        body = `<div class="er-switches">${cur.map((v, i) => `<button type="button" class="er-switch ${v ? "is-up" : "is-down"}" data-switch="${L.key}:${i}" aria-label="${i + 1}번 스위치 ${v ? "올림" : "내림"}"><span class="er-switch__body"><span class="er-switch__knob"></span></span>${i + 1}번</button>`).join("")}</div>
            <button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}">이대로 맞추기</button>`;
      } else if (L.kind === "cards") {
        const c = room.cards, now = Date.now();
        const mine = c.mine && c.mine > now, theirs = c.partner && c.partner > now;
        body = `<button type="button" class="hk-btn hk-btn--primary er-cardbtn" data-card ${mine ? "disabled" : ""}>${mine ? "사원증을 댔어요" : "사원증 대기"}</button>
            <div class="er-cardnote" id="er-cardnote">${theirs ? `${esc(room.partner.name)}님이 사원증을 댔어요! 지금 대세요` : mine ? `${esc(room.partner.name)}님을 기다리는 중…` : `${c.window}초 안에 둘 다 대야 열려요`}</div>`;
      }
      const hint = L.hint ? `<div class="er-hint"><b>힌트</b> ${esc(L.hint)}</div>` : `<div style="margin-top:12px"><button type="button" class="er-linkbtn" data-hint="${L.key}">힌트 보기 (+${room.hintPenalty}초)</button></div>`;
      return `<div class="er-lock"><div class="er-lock__head">${HKUI.icon("lock-keyhole", 16)} ${L.kind === "cards" ? "카드 리더기" : "자물쇠"}</div>${body}${hint}</div>`;
    }

    // ---------- 진행 화면 ----------
    function progressHtml() {
      return `<div class="er-card"><h2>자물쇠 ${room.progress.filter((p) => p.solved).length} / ${room.progress.length}</h2><ul class="er-prog">${room.progress.map((p) => `<li class="${p.solved ? "is-solved" : p.open ? "" : "is-closed"}">${HKUI.icon(p.solved ? "circle-check-big" : p.open ? "lock-keyhole" : "lock", 18, p.solved ? "#16a34a" : p.open ? "#b45309" : "#94a3b8")}<b>${esc(p.title)}</b><small>${esc(p.where)}</small></li>${p.hint && !p.solved ? `<span class="er-prog__hint">💡 ${esc(p.hint)}</span>` : ""}`).join("")}</ul></div>`;
    }
    function playHtml() {
      const things = room.things;
      if (!pick || !things.some((t) => t.key === pick)) pick = (things.find((t) => t.lock && t.lock.open && !t.lock.solved) || things[0] || {}).key;
      const t = things.find((x) => x.key === pick);
      const tiles = things.map((x) => {
        const tag = !seen.has(x.key) && seen.size ? `<span class="er-thing__tag is-new">새로</span>` : x.lock ? (x.lock.solved ? `<span class="er-thing__tag is-open">열림</span>` : x.lock.open ? `<span class="er-thing__tag is-lock">잠김</span>` : "") : "";
        return `<button type="button" class="er-thing ${x.key === pick ? "is-on" : ""} ${x.dim ? "is-dim" : ""}" data-thing="${x.key}"><span class="er-thing__ico">${HKUI.icon(x.icon, 20)}</span><b>${esc(x.title)}</b>${tag}</button>`;
      }).join("");
      const detail = t ? `<div class="er-detail"><h3>${HKUI.icon(t.icon, 20)} ${esc(t.title)}</h3><p>${esc(t.text)}</p>${t.art ? `<div class="er-art">${artHtml(t.art)}</div>` : ""}${room.status === "PLAYING" ? lockHtml(t) : ""}</div>` : "";
      return `<div class="er-card"><h2>${esc(room.sideName)}에서 보이는 것</h2><div class="er-things">${tiles}</div>${detail}</div>`;
    }
    const lockOf = (k) => room.things.find((x) => x.lock && x.lock.key === k).lock;

    HKCoop.mount({
      room: "overtime",
      listName: "방탈출 목록",
      hero: { facts: ["2인 협동", "제한 20분", "힌트 +60초 · 오답 +15초", "탈출하면 오늘 도장"], note: "서로 다른 쪽에 갇혀 단서를 말로 주고받아요. 옆자리 동료나 Teams 통화를 켜고 하면 더 재밌어요." },
      rankTitle: "탈출 순위",
      rankNote: "두 사람 모두 처음 탈출한 판만 순위에 올라요. 기록은 걸린 시간에 힌트·오답 벌점을 더한 시간이에요.",
      rankText: (x) => mmss(x.sec),
      recentText: (r) => (r.status === "CLEAR" ? [`탈출 ${mmss(r.recordSec)}`, "is-clear"] : ["실패", "is-fail"]),
      failTitle: "탈출 실패",
      quick: ["이거 봐 줘", "찾았어!", "숫자 불러 줄게", "잠깐만", "다시 한 번 말해 줘"],
      timerNote: (ctx) => (ctx.room.penaltySec ? `벌점 +${ctx.room.penaltySec}초` : "남은 시간"),
      reset: () => { pick = null; seen = new Set(); },
      changed: (prev, next) => { room = next; },
      painted: (ctx) => { (ctx.room.things || []).forEach((t) => seen.add(t.key)); },
      play: () => playHtml(),
      side: () => progressHtml(),
      end: () => `<div class="er-end"><h2>탈출 성공!</h2><p>${esc(room.outro)}</p><div class="er-end__time">${mmss(room.recordSec)}</div>
            <p>${room.penaltySec ? `벌점 ${room.penaltySec}초 포함 · ` : ""}${room.ranked ? "탈출 순위에 올랐어요" : "처음 탈출한 판이 아니라 순위에는 넣지 않아요"}</p>
            <div class="er-actions"><a class="hk-btn hk-btn--secondary" href="#" style="text-decoration:none">방탈출 목록</a></div></div>`,
      after: () => (room.things && room.things.length ? `<div style="margin-top:14px">${playHtml()}</div>` : ""),
      click: async (t, ctx) => {
        const d = t.dataset;
        if (d.thing) { pick = d.thing; ctx.paint(); return; }
        if (d.color) { const [k, c] = d.color.split(":"); const cur = draft.colors[k] || []; if (cur.length < lockOf(k).length) draft.colors[k] = [...cur, c]; ctx.paint(); return; }
        if (d.clear) { draft.colors[d.clear] = []; ctx.paint(); return; }
        if (d.switch) { const [k, i] = d.switch.split(":"); const L = lockOf(k); const cur = draft.switches[k] || Array(L.length).fill(0); cur[Number(i)] = cur[Number(i)] ? 0 : 1; draft.switches[k] = cur; ctx.paint(); return; }
        if (d.solve) {
          const k = d.solve, L = lockOf(k);
          const answer = L.kind === "digits" ? (draft.digits[k] || "") : L.kind === "colors" ? (draft.colors[k] || []) : (draft.switches[k] || Array(L.length).fill(0));
          if (L.kind === "digits" && answer.length !== L.length) { HKUI.toast(`숫자 ${L.length}자리를 눌러 주세요`, "error"); return; }
          const r = await ctx.act(() => HKApi.coopSolve(room.id, k, answer));
          if (r && r.ok === false) { HKUI.toast(`안 열려요… (+${room.wrongPenalty}초)`, "error"); if (L.kind === "colors") { draft.colors[k] = []; ctx.paint(); } }
          return;
        }
        if (d.hint) {
          if (!(await HKUI.confirmDialog("힌트를 볼까요?", `힌트를 보면 기록에 ${room.hintPenalty}초가 더해져요. 상대 화면에도 같은 힌트가 보여요.`, { confirmLabel: "힌트 보기" }))) return;
          return ctx.act(() => HKApi.coopHint(room.id, d.hint));
        }
        if ("card" in d) {
          const r = await ctx.act(() => HKApi.coopCard(room.id));
          if (r && r.stamp && r.stamp.new) HKUI.toast(`오늘 도장을 받았어요 (${r.stamp.count}/${r.stamp.goal})`);
        }
      },
      input: (el) => { if (el.dataset.digits) { el.value = el.value.replace(/\D/g, ""); draft.digits[el.dataset.digits] = el.value; } },
      keydown: (e) => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.digits) { e.preventDefault(); document.querySelector(`[data-solve="${e.target.dataset.digits}"]`)?.click(); } },
      tick: () => {
        const note = document.getElementById("er-cardnote");
        if (!note || !room || !room.cards) return;
        const now = Date.now(), c = room.cards;
        const mine = c.mine && c.mine > now, theirs = c.partner && c.partner > now;
        note.textContent = theirs ? `${room.partner.name}님이 사원증을 댔어요! ${Math.ceil((c.partner - now) / 1000)}초 안에 대세요`
          : mine ? `${room.partner.name}님을 기다리는 중… ${Math.ceil((c.mine - now) / 1000)}초` : `${c.window}초 안에 둘 다 대야 열려요`;
        const btn = document.querySelector("[data-card]");
        if (btn && !mine && btn.disabled) { btn.disabled = false; btn.textContent = "사원증 대기"; }
      },
    });
  </script>
</body>
</html>
