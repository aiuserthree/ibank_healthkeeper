<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/_shared/no-zoom.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 야근 사무실 탈출</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <script src="/_shared/play.js"></script>
  <script src="/_shared/coop-story.js"></script>
  <script src="/_shared/coop.js"></script>
  <style>
    /* ── 야근 사무실 탈출 (협동 시리즈 3화) — 밤 사무실 그림 · 누를 곳 · 가방 · 자물쇠 ── */
    .ot { display: flex; flex-direction: column; gap: 12px; }
    /* 인터폰 · 안내 방송 */
    .ot-radio { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 14px 8px 8px; border-radius: 16px; background: linear-gradient(120deg, #0b1220, #111c33); color: #e2e8f0; box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .18); }
    .ot-radio__face { flex-shrink: 0; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .06); }
    .ot-radio__face svg { display: block; width: 36px; height: 36px; }
    .ot-radio.is-system .ot-radio__face { background: rgba(244, 63, 94, .16); color: #fda4af; }
    .ot-radio__body { min-width: 0; }
    .ot-radio__name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #7dd3fc; }
    .ot-radio.is-system .ot-radio__name { color: #fda4af; }
    .ot-radio__name i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ot-blink 1.2s steps(2, start) infinite; }
    .ot-radio__text { margin-top: 1px; font-size: 14px; font-weight: 600; line-height: 1.45; word-break: keep-all; }
    .ot-radio.is-new { animation: ot-drop .5s cubic-bezier(.2, .9, .3, 1.3) both; }
    /* 방 그림 */
    .ot-stage { position: relative; overflow: hidden; aspect-ratio: 5 / 3; border-radius: 18px; background: #0b1220; box-shadow: 0 12px 30px rgba(2, 6, 23, .28), inset 0 0 0 1px rgba(148, 163, 184, .16); -webkit-user-select: none; user-select: none; }
    .ot-stage > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .ot-dark { position: absolute; inset: 0; pointer-events: none; transition: opacity 1.6s ease; background: radial-gradient(70% 90% at var(--lx, 18%) var(--ly, 58%), rgba(2, 6, 23, .05), rgba(2, 6, 23, .58) 70%); }
    .ot-stage.is-power .ot-dark { opacity: 0; }
    .ot-alarm { position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(239, 68, 68, .38), rgba(239, 68, 68, 0) 62%); animation: ot-alarm 2s ease-in-out infinite; }
    .ot-stage.is-flicker > svg { animation: ot-flicker 1.1s steps(1, end) both; }
    .ot-stage.is-flicker .ot-dark { animation: ot-flicker-dark 1.1s steps(1, end) both; }
    .ot-pulse { animation: ot-blink 1.4s ease-in-out infinite; }
    .ot-hot { position: absolute; z-index: 2; min-width: 40px; min-height: 40px; padding: 0; transform: translate(-50%, -50%); border: 2px solid transparent; border-radius: 12px; background: transparent; color: inherit; font: inherit; cursor: pointer; transition: border-color .15s ease, background .15s ease, box-shadow .15s ease; }
    .ot-hot:hover, .ot-hot:focus-visible { outline: none; border-color: rgba(125, 211, 252, .85); background: rgba(125, 211, 252, .1); }
    .ot-hot.is-on { border-color: #38bdf8; background: rgba(56, 189, 248, .14); box-shadow: 0 0 0 4px rgba(56, 189, 248, .22), 0 0 26px rgba(56, 189, 248, .35); }
    .ot-hot__tag { position: absolute; left: 50%; top: 100%; z-index: 1; max-width: 140px; overflow: hidden; padding: 2px 8px; border-radius: 999px; transform: translate(-50%, 3px); background: rgba(2, 6, 23, .8); color: #e2e8f0; font-size: 11.5px; font-weight: 700; line-height: 1.5; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; }
    .ot-hot.is-up .ot-hot__tag { top: auto; bottom: 100%; transform: translate(-50%, -3px); }
    .ot-hot.is-in .ot-hot__tag { top: auto; bottom: 6px; transform: translate(-50%, 0); }
    .ot-hot.is-on .ot-hot__tag { background: #0284c7; color: #fff; }
    .ot-hot__dot { display: none; position: absolute; top: -6px; right: -6px; width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 2px #0b1220; }
    .ot-hot.is-lock .ot-hot__dot, .ot-hot.is-open .ot-hot__dot, .ot-hot.is-use .ot-hot__dot, .ot-hot.is-new .ot-hot__dot { display: block; }
    .ot-hot.is-lock .ot-hot__dot { background: #f59e0b; }
    .ot-hot.is-open .ot-hot__dot { background: #22c55e; }
    .ot-hot.is-use .ot-hot__dot { background: #a78bfa; }
    .ot-hot.is-new .ot-hot__dot { background: #38bdf8; animation: ot-ping 1.4s ease-out infinite; }
    .ot-hot.is-dim .ot-hot__tag { color: #94a3b8; }
    .ot-fly { position: absolute; z-index: 3; width: 9%; aspect-ratio: 1; pointer-events: none; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .5)); }
    .ot-fly svg { display: block; width: 100%; height: 100%; }
    .ot-fly.is-out { animation: ot-fly-out 1s cubic-bezier(.5, 0, .7, .4) both; }
    .ot-fly.is-in { animation: ot-fly-in 1.1s cubic-bezier(.2, .8, .3, 1) both; }
    .ot-stage[data-side="pantry"] .ot-fly.is-out { animation-name: ot-fly-out-l; }
    .ot-stage[data-side="pantry"] .ot-fly.is-in { animation-name: ot-fly-in-l; }
    /* 가방 */
    .ot-bag { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 16px; background: #0f172a; color: #e2e8f0; }
    .ot-bag__label { display: inline-flex; align-items: center; gap: 6px; margin-right: 2px; font-size: 13px; font-weight: 800; color: #93c5fd; }
    .ot-item { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 3px 12px 3px 4px; border: 1px solid rgba(148, 163, 184, .28); border-radius: 14px; background: rgba(255, 255, 255, .06); color: #f8fafc; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
    .ot-item:hover { border-color: #7dd3fc; }
    .ot-item svg { display: block; width: 36px; height: 36px; }
    .ot-item.is-on { border-color: #38bdf8; background: rgba(56, 189, 248, .18); }
    .ot-item.is-new { border-color: #fbbf24; animation: ot-glow 1.1s ease-in-out 4; }
    .ot-item.is-use::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #a78bfa; }
    .ot-item__n { padding: 1px 6px; border-radius: 999px; background: rgba(251, 191, 36, .2); color: #fde68a; font-size: 12px; font-weight: 800; }
    .ot-bag__empty { font-size: 13px; color: #94a3b8; }
    .ot-bag__mate { margin-left: auto; font-size: 12.5px; color: #94a3b8; word-break: keep-all; }
    .ot-bag__mate b { color: #cbd5e1; }
    /* 휴대폰 — 물건 목록(그림 위 누를 곳의 글자 판) */
    .ot-list { display: none; }
    .ot-chip { display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--border-default); border-radius: 999px; background: #fff; color: var(--color-midnight-navy); font: inherit; font-size: 13.5px; font-weight: 700; white-space: nowrap; cursor: pointer; scroll-snap-align: start; }
    .ot-chip i.ot-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
    .ot-chip.is-lock i.ot-dot { background: #f59e0b; }
    .ot-chip.is-open i.ot-dot { background: #22c55e; }
    .ot-chip.is-use i.ot-dot { background: #a78bfa; }
    .ot-chip.is-new i.ot-dot { background: #38bdf8; }
    .ot-chip.is-on { border-color: #0284c7; background: #e0f2fe; color: #075985; }
    .ot-chip.is-dim { color: #94a3b8; }
    /* 자세히 */
    .ot-detail { padding: 16px; border: 1px solid var(--border-default); border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .05); scroll-margin-top: 12px; }
    .ot-detail__head { display: flex; align-items: center; gap: 10px; }
    .ot-detail__ico { display: grid; flex-shrink: 0; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: #e0f2fe; color: #0369a1; }
    .ot-detail__ico svg { width: 34px; height: 34px; }
    .ot-detail__head h3 { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 800; word-break: keep-all; }
    .ot-tag { flex-shrink: 0; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .ot-tag.is-lock { background: #fef3c7; color: #92400e; }
    .ot-tag.is-open { background: #dcfce7; color: #166534; }
    .ot-tag.is-dim { background: #f1f5f9; color: #64748b; }
    .ot-tag.is-bag { background: #ede9fe; color: #5b21b6; }
    .ot-text { margin: 10px 0 0; font-size: 15px; line-height: 1.7; word-break: keep-all; color: #1e293b; }
    .ot-note { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: #f1f5f9; color: #475569; font-size: 13.5px; line-height: 1.6; word-break: keep-all; }
    .ot-note.is-why { background: #fff7ed; color: #9a3412; }
    .ot-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ot-actions .hk-btn { min-height: 44px; }
    .ot-usebtn { display: inline-flex; align-items: center; gap: 8px; }
    .ot-usebtn svg { width: 28px; height: 28px; margin: -4px 0 -4px -6px; }
    /* 단서 그림(가까이) */
    .ot-art { margin-top: 14px; }
    .ot-art svg { display: block; width: 100%; height: auto; max-width: 560px; margin: 0 auto; }
    .ot-booking { width: 100%; max-width: 460px; margin: 0 auto; border-collapse: collapse; overflow: hidden; border-radius: 6px; background: #fffdf5; box-shadow: 0 2px 10px rgba(15, 23, 42, .12); font-size: 14.5px; }
    .ot-booking caption { padding: 10px 12px 6px; caption-side: top; border-radius: 6px 6px 0 0; background: #fffdf5; font-size: 13px; font-weight: 800; color: #475569; text-align: left; }
    .ot-booking th, .ot-booking td { padding: 10px 12px; border-bottom: 1px solid #ece5d3; text-align: left; }
    .ot-booking th { background: #f5efe0; font-size: 12.5px; color: #78716c; }
    .ot-booking td:first-child { font-weight: 800; font-variant-numeric: tabular-nums; }
    /* 자물쇠 */
    .ot-lock { margin-top: 16px; padding: 14px; border: 1.5px dashed #cbd5e1; border-radius: 16px; background: #f8fafc; }
    .ot-lock__head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 800; color: #334155; }
    .ot-lock__head small { margin-left: auto; font-size: 12px; font-weight: 700; color: #94a3b8; }
    .ot-lock.is-bad { animation: ot-shake .45s ease both; border-color: #f87171; background: #fef2f2; }
    .ot-go { display: flex; justify-content: center; margin-top: 12px; }
    .ot-go .hk-btn { min-width: 160px; min-height: 46px; font-size: 16px; }
    .ot-opened { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #dcfce7; color: #166534; font-weight: 800; }
    .ot-opened svg { flex-shrink: 0; width: 42px; height: 42px; }
    .ot-opened.is-pop svg .ot-shackle { animation: ot-shackle .7s cubic-bezier(.3, 1.6, .5, 1) both; }
    .ot-opened.is-pop { animation: ot-pop .5s ease both; }
    /* 숫자 다이얼(서랍) */
    .ot-rollers { display: flex; justify-content: center; gap: 8px; max-width: 300px; margin: 0 auto; padding: 14px 12px; border-radius: 18px; background: linear-gradient(180deg, #d97706, #92400e); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25), inset 0 -4px 10px rgba(0, 0, 0, .25), 0 6px 16px rgba(146, 64, 14, .25); }
    .ot-roller { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ot-roller button { width: 50px; height: 40px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .2); color: #fffbeb; font-size: 16px; cursor: pointer; }
    .ot-roller button:hover { background: rgba(255, 255, 255, .32); }
    .ot-roller b { display: grid; place-items: center; width: 50px; height: 60px; border-radius: 10px; background: linear-gradient(180deg, #e7e5e4, #fffbeb 30%, #fffbeb 70%, #e7e5e4); color: #78350f; font: 800 32px/1 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: inset 0 3px 6px rgba(0, 0, 0, .2); }
    .ot-roller.is-cur b { box-shadow: inset 0 3px 6px rgba(0, 0, 0, .2), 0 0 0 3px #fde68a; }
    /* 보안 패널 숫자판 */
    .ot-keypad { max-width: 300px; margin: 0 auto; padding: 14px; border-radius: 20px; background: linear-gradient(180deg, #1f2937, #111827); box-shadow: inset 0 0 0 2px #334155, 0 8px 20px rgba(2, 6, 23, .25); }
    .ot-lcd { display: flex; justify-content: center; gap: 10px; height: 56px; margin-bottom: 12px; border-radius: 12px; background: #052e16; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .5); }
    .ot-lcd span { display: grid; place-items: center; width: 34px; color: #4ade80; font: 800 30px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-shadow: 0 0 10px rgba(74, 222, 128, .65); }
    .ot-lcd span.is-empty { color: #166534; text-shadow: none; }
    .ot-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .ot-keys button { height: 50px; border: 0; border-radius: 12px; background: #334155; color: #f8fafc; font-size: 21px; font-weight: 800; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .3); }
    .ot-keys button:active { transform: translateY(1px); box-shadow: none; }
    .ot-keys button.is-del { font-size: 14px; background: #475569; }
    .ot-keys button.is-ok { font-size: 15px; background: #16a34a; }
    .ot-keys button.is-ok:disabled { background: #1e3a2a; color: #64748b; }
    /* 색 버튼(사물함) */
    .ot-slots { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .ot-slot { width: 48px; height: 48px; border: 2px dashed #cbd5e1; border-radius: 14px; box-sizing: border-box; }
    .ot-slot.is-set { border: 0; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18); }
    .ot-swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; max-width: 360px; margin: 0 auto; }
    .ot-swatch { min-height: 48px; padding: 0; border: 0; border-radius: 14px; color: #fff; font: inherit; font-size: 13px; font-weight: 800; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18); }
    .ot-swatch:active { transform: translateY(1px); }
    /* 차단기 스위치 */
    .ot-breaker { display: flex; justify-content: center; gap: 10px; max-width: 360px; margin: 0 auto; padding: 14px 10px; border-radius: 16px; background: #475569; box-shadow: inset 0 0 0 3px #334155; }
    .ot-switch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: #e2e8f0; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; }
    .ot-switch__body { position: relative; width: 44px; height: 76px; border-radius: 10px; background: #1e293b; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .5); }
    .ot-switch__knob { position: absolute; left: 6px; right: 6px; height: 30px; border-radius: 7px; background: #cbd5e1; transition: top .14s ease; }
    .ot-switch.is-up .ot-switch__knob { top: 6px; background: #fde047; box-shadow: 0 0 10px rgba(253, 224, 71, .6); }
    .ot-switch.is-down .ot-switch__knob { top: 40px; }
    .ot-fuse { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -4px auto 12px; font-size: 13px; font-weight: 700; color: #475569; }
    .ot-fuse svg { width: 40px; height: 40px; }
    /* 커피머신 관리자 메뉴 */
    .ot-machine { max-width: 380px; margin: 0 auto; padding: 14px; border-radius: 18px; background: linear-gradient(180deg, #1f2937, #0b1220); box-shadow: inset 0 0 0 2px #334155; }
    .ot-machine__screen { margin-bottom: 12px; padding: 8px 12px; border-radius: 10px; background: #083344; color: #67e8f9; font-size: 13px; font-weight: 800; text-align: center; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .45); }
    .ot-count { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px 40px 44px; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid rgba(148, 163, 184, .16); color: #f1f5f9; }
    .ot-count:last-of-type { border-bottom: 0; }
    .ot-count svg { width: 40px; height: 40px; }
    .ot-count b { font-size: 15px; }
    .ot-count button { height: 44px; border: 0; border-radius: 12px; background: #334155; color: #fff; font-size: 22px; font-weight: 800; cursor: pointer; }
    .ot-count button:disabled { opacity: .35; cursor: default; }
    .ot-count output { font: 800 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; color: #fde68a; }
    /* 사원증 */
    .ot-cardbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; border-radius: 16px; font-size: 18px; }
    .ot-cardbtn svg { width: 44px; height: 44px; }
    .ot-cardnote { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 800; color: #1d4ed8; }
    .ot-cardnote.is-hot { color: #b91c1c; animation: ot-blink 1s steps(2, start) infinite; }
    /* 힌트 */
    .ot-hints { display: grid; gap: 8px; margin-top: 12px; }
    .ot-hint { padding: 10px 12px; border-radius: 12px; background: #fef9c3; color: #713f12; font-size: 14px; line-height: 1.6; word-break: keep-all; }
    .ot-hint b { display: block; font-size: 12px; font-weight: 800; color: #a16207; }
    .ot-hintbtn { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 40px; padding: 0 14px; border: 1.5px solid #fcd34d; border-radius: 999px; background: #fffbeb; color: #92400e; font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; }
    .ot-hintbtn:hover { background: #fef3c7; }
    .ot-hintbtn small { font-weight: 700; color: #b45309; }
    /* 할 일(옆 칸) */
    .ot-prog { margin: 0; padding: 0; list-style: none; }
    .ot-prog li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .ot-prog li:last-child { border-bottom: 0; }
    .ot-prog li > span:nth-child(2) { min-width: 0; font-weight: 700; word-break: keep-all; }
    .ot-prog li.is-task > span:nth-child(2) { font-weight: 600; color: #475569; }
    .ot-prog small.ot-where { padding: 2px 8px; border-radius: 999px; background: #f1f5f9; font-size: 11.5px; font-weight: 700; color: #64748b; white-space: nowrap; }
    .ot-prog small.ot-where.is-mine { background: #e0f2fe; color: #0369a1; }
    .ot-prog li.is-solved > span:nth-child(2) { color: #94a3b8; text-decoration: line-through; }
    .ot-prog li.is-closed { opacity: .5; }
    .ot-prog .ot-hint { grid-column: 2 / -1; padding: 8px 10px; font-size: 13px; }
    .ot-prog .ot-hintbtn { grid-column: 2 / -1; min-height: 40px; font-size: 12.5px; }
    .ot-hlv { margin-left: 4px; padding: 1px 6px; border-radius: 999px; background: #fef9c3; color: #a16207; font-size: 11px; font-weight: 800; }
    .ot-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .ot-sum span { padding: 5px 10px; border-radius: 999px; background: #f1f5f9; font-size: 12.5px; font-weight: 700; color: #475569; }
    .ot-sum span.is-warn { background: #fff7ed; color: #c2410c; }
    /* 대기실 — 이렇게 해요 */
    .ot-how { margin: 0; padding: 12px; border-radius: 16px; background: #0b1220; color: #e2e8f0; }
    .ot-how h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 14px; font-weight: 800; color: #7dd3fc; }
    .ot-how ol { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: how; }

    @media (max-width: 640px) {

      .ot-radio.is-new, .ot-hot.is-new .ot-hot__dot, .ot-item.is-new, .ot-lock.is-bad, .ot-opened.is-pop, .ot-opened.is-pop svg .ot-shackle,

<body>
  <div id="app"></div>
  <script>
    // 야근 사무실 탈출 — 2인 협동 방탈출(협동 시리즈 「오늘도 둘이서」 3화). 초대 → 수락 → 둘 다 준비 → 20분 안에 탈출.
    // 방 공용(목록 · 대기실 · 대화 · 끝 화면 · 실시간)은 /_shared/coop.js, 이야기 · 화 색은 /_shared/coop-story.js.
    // 판마다 정답이 바뀐다(서버). 화면은 서버가 보내 준 내 쪽 것만 그린다 — 밤 사무실 그림 위 누를 곳 · 가방 · 자물쇠 · 인터폰.
    const { esc } = HKMatch;
    const { mmss } = HKCoop;
    const COLORS = { red: ["#ef4444", "빨강"], yellow: ["#eab308", "노랑"], green: ["#22c55e", "초록"], blue: ["#3b82f6", "파랑"], purple: ["#a855f7", "보라"] };
    const COFFEE = { shot: "샷", milk: "우유", syrup: "시럽", ice: "얼음" };
    const LOCKS = 6; // 자물쇠 수(출입문 포함)
    // 그림 위 누를 곳 [x, y, w, h] — 800×480 판 기준
    const HOT = {
      office: { monitor: [62, 212, 136, 98], mug: [196, 264, 40, 42], notice: [230, 58, 112, 122], booking: [350, 74, 90, 114], memo: [288, 286, 78, 34], drawer: [378, 322, 80, 92], door: [466, 106, 120, 276], panel: [588, 186, 58, 88], slot: [678, 284, 118, 52] },
      pantry: { slot: [4, 284, 118, 52], fridge: [142, 122, 108, 276], coffee: [260, 192, 100, 116], water: [372, 206, 80, 102], locker: [486, 140, 104, 258], breaker: [590, 96, 68, 104], exit: [594, 226, 54, 72], clocks: [660, 100, 136, 296] },
    };
    // 어둠 속 빛이 나오는 곳(노트북 · 비상구 표시등) — 정전일 때 그림을 덮는 그늘의 가운데
    const LIGHT = { office: ["17%", "56%"], pantry: ["86%", "28%"] };
    const ALARM = { office: ["66%", "21%"], pantry: ["79%", "50%"] };

    let room = null, pick = null, wantScroll = false;
    let fx = null, fly = null, flicker = false, beatNew = false, clientBeat = null, said5 = false;
    let seen = new Set(), newAt = {}, newItems = new Set(), seenBeats = new Set();
    let listX = 0, chipFocus = false; // 휴대폰 물건 목록(.ot-list)을 넘긴 위치 — 다시 그려도 그대로 둔다
    const draft = { digits: {}, colors: {}, switches: {}, counts: {}, cur: {} };

    // 공용 coop.js 는 상대가 한 일마다 tap 소리를 내요. 이 게임이 바로 뒤에 더 알맞은 소리(열림 · 받기 · 전기)를 내면
    // tap 은 빼서 소리가 겹치지 않게 해요 — 이 페이지에서만. tap 은 아주 잠깐(30ms) 늦게 나요.
    (function () {
      const S = window.HKSound;
      if (!S || typeof S.play !== "function") return;
      const play = S.play.bind(S);
      let held = 0;
      S.play = function (name, arg) {
        if (name === "tap") { clearTimeout(held); held = setTimeout(() => { held = 0; play(name, arg); }, 30); return undefined; }
        if (name === "success" || name === "drop" || name === "powerup") { clearTimeout(held); held = 0; }
        return play(name, arg);
      };
    })();
    // 물건 목록을 손으로 넘기면 위치를 기억해요(scroll 은 거품이 안 올라와서 잡는 단계에서 받아요)
    document.addEventListener("scroll", (e) => {
      const el = e.target;
      if (el && el.classList && el.classList.contains("ot-list")) listX = el.scrollLeft;
    }, true);

    // ---------- 작은 그림(물건 · 커피 재료 · 안내 방송) ----------
    const ITEM_ART = {
      fuse: `<rect x="11" y="18" width="26" height="12" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/><path d="M15 24h18" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 2"/><rect x="5" y="16" width="9" height="16" rx="2.5" fill="#cbd5e1" stroke="#94a3b8"/><rect x="34" y="16" width="9" height="16" rx="2.5" fill="#cbd5e1" stroke="#94a3b8"/>`,
      panelkey: `<circle cx="15" cy="24" r="9" fill="none" stroke="#2563eb" stroke-width="4.5"/><rect x="22" y="21.5" width="21" height="5" rx="2" fill="#e2e8f0" stroke="#94a3b8"/><rect x="34" y="26" width="3.5" height="6" fill="#e2e8f0" stroke="#94a3b8"/><rect x="39" y="26" width="3.5" height="4" fill="#e2e8f0" stroke="#94a3b8"/>`,
      card: `<path d="M24 4v10" stroke="#1d4ed8" stroke-width="3"/><rect x="8" y="13" width="32" height="25" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="8" y="13" width="32" height="7" rx="3" fill="#2563eb"/><circle cx="17" cy="28" r="4.5" fill="#94a3b8"/><rect x="24" y="25" width="12" height="2.6" rx="1.3" fill="#cbd5e1"/><rect x="24" y="30" width="9" height="2.6" rx="1.3" fill="#cbd5e1"/>`,
      kimbap: `<rect x="5" y="15" width="34" height="18" rx="9" fill="#d1d5db"/><path d="M9 18l6 12M17 17l6 13M25 17l6 13" stroke="#f8fafc" stroke-width="1.5" opacity=".7"/><circle cx="37" cy="24" r="9" fill="#111827"/><circle cx="37" cy="24" r="6.6" fill="#fef9c3"/><circle cx="35" cy="22" r="1.7" fill="#ef4444"/><circle cx="39.4" cy="24.6" r="1.7" fill="#16a34a"/><circle cx="36" cy="27" r="1.5" fill="#f97316"/><circle cx="38.6" cy="20.8" r="1.3" fill="#a16207"/>`,
    };
    const itemSvg = (k) => `<svg viewBox="0 0 48 48" aria-hidden="true">${ITEM_ART[k] || `<rect x="10" y="10" width="28" height="28" rx="6" fill="#94a3b8"/>`}</svg>`;
    const CUP = {
      shot: `<ellipse cx="18" cy="15" rx="11" ry="3" fill="#d97706"/><path d="M7 15h22v7a11 11 0 0 1-22 0z" fill="#7c2d12"/><path d="M29 17h3a4 4 0 0 1 0 8h-3" stroke="#7c2d12" stroke-width="3" fill="none"/><rect x="5" y="32" width="26" height="3" rx="1.5" fill="#a8a29e"/>`,
      milk: `<path d="M12 13l4-7h8l4 7v23H12z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/><rect x="12" y="20" width="16" height="9" fill="#60a5fa"/><path d="M16 6h8" stroke="#94a3b8" stroke-width="2"/>`,
      syrup: `<rect x="11" y="16" width="18" height="20" rx="4" fill="#f59e0b"/><rect x="11" y="22" width="18" height="6" fill="#fde68a"/><rect x="17" y="9" width="6" height="7" fill="#78350f"/><path d="M20 9V5h9" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      ice: `<path d="M20 6l12 6v14l-12 6-12-6V12z" fill="#bae6fd" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/><path d="M8 12l12 6 12-6M20 18v14" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M13 13l4-2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`,
    };
    const cupSvg = (k, extra = "") => `<svg viewBox="0 0 40 40" aria-hidden="true">${CUP[k] || ""}${extra}</svg>`;
    const SPEAKER = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 16h6l8-7v22l-8-7H9z" fill="currentColor"/><path d="M27 14a8 8 0 0 1 0 12M30.5 10.5a13 13 0 0 1 0 19" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
    function faceOf(b) {
      if (b.who === "npc" && window.HKCoopStory) return HKCoopStory.npcFace(b.name) || SPEAKER;
      return SPEAKER;
    }

    // ---------- 방 그림 ----------
    const has = (list, k) => (list || []).includes(k);
    function state() {
      const solved = new Set((room.progress || []).filter((p) => p.solved && p.kind !== "task").map((p) => p.key));
      const used = new Set(room.used || []);
      const thing = (k) => (room.things || []).find((t) => t.key === k);
      return { solved, used, thing, power: !!room.power, bag: (room.bag || []).map((b) => b.key) };
    }
    function lamps(on, xs) {
      return xs.map((x) => `<rect x="${x - 52}" y="6" width="104" height="9" rx="3" fill="${on ? "#fef9c3" : "#26324a"}"/>${on ? `<rect x="${x - 52}" y="6" width="104" height="9" rx="3" fill="#fef08a" opacity=".6" filter="url(#otBlur)"/><polygon points="${x - 52},15 ${x + 52},15 ${x + 130},380 ${x - 130},380" fill="#fef3c7" opacity=".05"/>` : ""}`).join("");
    }
    function silhouette(x, on) {
      return `<g opacity="${on ? 0.32 : 0.18}" fill="#cbd5e1"><circle cx="${x}" cy="226" r="17"/><path d="M${x - 32} 380v-96q0-40 32-40t32 40v96z"/></g>`;
    }
    function glassWall(x0, w, mateHere, slotX, power) {
      const left = x0 === 0;
      const mull = left ? x0 + w : x0;
      return `<rect x="${x0}" y="0" width="${w}" height="480" fill="url(#otGlass)"/>
        ${mateHere ? silhouette(x0 + w / 2 + (left ? -6 : 6), power) : ""}
        <path d="M${x0 + (left ? 18 : 30)} 40l${left ? 60 : 70} -40M${x0 + (left ? 8 : 18)} 150l${left ? 96 : 110} -100M${x0 + (left ? 30 : 46)} 470l${left ? 80 : 80} -90" stroke="#e0f2fe" stroke-width="3" opacity=".12"/>
        <rect x="${mull - 3}" y="0" width="6" height="480" fill="#64748b"/>
        <rect x="${x0}" y="376" width="${w}" height="8" fill="#475569"/>
        <rect x="${slotX}" y="296" width="106" height="30" rx="5" fill="#94a3b8"/><rect x="${slotX + 8}" y="306" width="90" height="9" rx="3" fill="#0f172a"/>
        <path d="M${slotX + 4} 299h98" stroke="#e2e8f0" stroke-width="2" opacity=".6"/>`;
    }
    function defs(side) {
      const wall = side === "office" ? ["#22304d", "#18233a"] : ["#1f3140", "#16242f"];
      return `<defs>
        <linearGradient id="otWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wall[0]}"/><stop offset="1" stop-color="${wall[1]}"/></linearGradient>
        <linearGradient id="otFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121b2e"/><stop offset="1" stop-color="#0a101d"/></linearGradient>
        <linearGradient id="otSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1736"/><stop offset="1" stop-color="#23356a"/></linearGradient>
        <linearGradient id="otGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd" stop-opacity=".1"/><stop offset=".5" stop-color="#bfdbfe" stop-opacity=".2"/><stop offset="1" stop-color="#93c5fd" stop-opacity=".1"/></linearGradient>
        <linearGradient id="otScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
        <radialGradient id="otGlowB"><stop offset="0" stop-color="#60a5fa" stop-opacity=".5"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
        <radialGradient id="otGlowG"><stop offset="0" stop-color="#4ade80" stop-opacity=".55"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
        <filter id="otBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
      </defs>`;
    }
    function exitSign(x, y) {
      return `<ellipse cx="${x + 40}" cy="${y + 11}" rx="60" ry="22" fill="url(#otGlowG)"/><rect x="${x}" y="${y}" width="80" height="22" rx="3" fill="#15803d"/>
        <g fill="#dcfce7"><circle cx="${x + 15}" cy="${y + 6}" r="2.6"/><path d="M${x + 13} ${y + 9}l-4 5h3l-2 5h2l3-4 2 4h2l-2-6 3 1 1-2-5-3z"/></g>
        <text x="${x + 50}" y="${y + 16}" text-anchor="middle" font-size="12" font-weight="900" fill="#dcfce7" font-family="sans-serif">비상구</text>`;
    }
    function miniClock(cx, cy, h, show) {
      if (!show) return `<circle cx="${cx}" cy="${cy}" r="9" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>`;
      const a = ((h % 12) * 30 * Math.PI) / 180;
      return `<circle cx="${cx}" cy="${cy}" r="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><line x1="${cx}" y1="${cy}" x2="${(cx + Math.sin(a) * 5.4).toFixed(1)}" y2="${(cy - Math.cos(a) * 5.4).toFixed(1)}" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 7}" stroke="#64748b" stroke-width="1.2"/>`;
    }

    function officeSvg(v) {
      const on = v.power, S = v.solved, U = v.used;
      const mon = v.thing("monitor"), folders = mon && mon.art ? mon.art.items : [];
      const drawerOpen = S.has("drawer"), panelOk = S.has("panel"), cover = U.has("cover");
      const city = [[36, 170, 26, 66], [64, 148, 22, 88], [88, 182, 30, 54], [120, 130, 26, 106], [148, 160, 34, 76], [184, 176, 28, 60]]
        .map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0b1530"/>`).join("");
      const lit = [[42, 182], [70, 160], [70, 196], [96, 194], [126, 144], [126, 170], [134, 204], [156, 172], [190, 188], [164, 200]]

      if (a.kind === "clocks") {
        const n = a.items.length, w = 140 * n;
        const faces = a.items.map((c, i) => {
          const cx = 70 + i * 140, cy = 92, r = 52;
          const ang = (((c.hour % 12) + c.minute / 60) * 30 * Math.PI) / 180, mang = (c.minute * 6 * Math.PI) / 180;
          const nums = Array.from({ length: 12 }, (_, k) => { const t = ((k + 1) * 30 * Math.PI) / 180; return `<text x="${(cx + Math.sin(t) * 40).toFixed(1)}" y="${(cy - Math.cos(t) * 40 + 4.5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" font-family="sans-serif">${k + 1}</text>`; }).join("");
          return `<rect x="${cx - 62}" y="18" width="124" height="190" rx="8" fill="#334155"/><rect x="${cx - 54}" y="26" width="108" height="182" rx="4" fill="#475569"/>
              <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#1f2937" stroke-width="4"/>${nums}
              <line x1="${cx}" y1="${cy}" x2="${(cx + Math.sin(ang) * 25).toFixed(1)}" y2="${(cy - Math.cos(ang) * 25).toFixed(1)}" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
              <line x1="${cx}" y1="${cy}" x2="${(cx + Math.sin(mang) * 37).toFixed(1)}" y2="${(cy - Math.cos(mang) * 37).toFixed(1)}" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
              <circle cx="${cx}" cy="${cy}" r="4" fill="#0f172a"/>
              <rect x="${cx - 44}" y="162" width="88" height="26" rx="6" fill="#f8fafc"/><text x="${cx}" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" font-family="sans-serif">${esc(c.room)}</text>`;
        }).join("");
        return `<svg viewBox="0 0 ${w} 216" role="img" aria-label="회의실 시계 ${a.items.map((c) => `${c.room} ${c.hour}시`).join(", ")}">${faces}</svg>`;
      }
      if (a.kind === "notice") {
        const rows = a.items.map((it, i) => {
          const y = 132 + i * 50;
          const icons = it.count
            ? Array.from({ length: it.count }, (_, k) => `<g transform="translate(${40 + k * 46},${y - 22})"><svg width="40" height="40" viewBox="0 0 40 40">${CUP[it.key] || ""}</svg></g>`).join("")
            : `<g transform="translate(40,${y - 22})" opacity=".45"><svg width="40" height="40" viewBox="0 0 40 40">${CUP[it.key] || ""}</svg></g><path d="M40 ${y - 20}l36 36M76 ${y - 20}l-36 36" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>`;
          return `${icons}<path d="M30 ${y + 24}h300" stroke="#e2e8f0" stroke-width="1.5"/>`;
        }).join("");
        const h = 140 + a.items.length * 50;
        // 화면 낭독기도 같은 단서를 듣게 — 그림 순서대로 개수(엑스는 0개)
        const said = a.items.map((it) => `${COFFEE[it.key] || it.key} ${it.count ? `${it.count}개` : "엑스(0개)"}`).join(", ");
        return `<svg viewBox="0 0 360 ${h}" role="img" aria-label="관리실 안내문 — 커피머신 관리자 메뉴 그림. 위에서부터 ${esc(said)}">
            <rect x="10" y="6" width="340" height="${h - 12}" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="10" y="6" width="340" height="40" rx="6" fill="#dc2626"/>
            <circle cx="180" cy="6" r="6" fill="#f59e0b"/>
            <text x="180" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="sans-serif">관리실 안내 · 보안 시스템 시험</text>
            <text x="28" y="70" font-size="13" font-weight="700" fill="#334155" font-family="sans-serif">시험 중 커피머신이 멈추면</text>
            <text x="28" y="90" font-size="13" font-weight="700" fill="#334155" font-family="sans-serif">아래 관리자 메뉴를 눌러 주세요.</text>
            ${rows}
            <text x="330" y="${h - 22}" text-anchor="end" font-size="12" font-weight="700" fill="#64748b" font-family="sans-serif">— 관리실 문 반장</text>
          </svg>`;
      }
      return "";
    }

    // ---------- 자물쇠 ----------
    const lockOf = (k) => { const t = (room.things || []).find((x) => x.lock && x.lock.key === k); return t ? t.lock : null; };
    function rollVal(k, n) { const v = draft.digits[k]; return v && v.length === n ? v : "0".repeat(n); }
    // 힌트 단계 이름 — 한 단계뿐인 자물쇠(출입문)는 그냥 「힌트」
    function hintName(L, lv) {
      const max = L.hintMax || (L.hints || []).length;
      return max > 1 ? `힌트 ${lv}단계 · ${["살짝", "확실하게"][lv - 1] || ""}` : "힌트";
    }
    // 단계 벌점(초) — 자물쇠가 따로 정한 값(출입문은 0초)이 먼저
    function hintCost(L, lv) {
      const own = L && L.hintCost && L.hintCost.length ? L.hintCost[lv - 1] : null;
      return own != null ? Number(own) : Number((room.hintPenalties || [30, 60])[lv - 1] || 0);
    }
    function hintsHtml(L, compact) {
      const shown = (L.hints || []).map((h, i) => `<div class="ot-hint"><b>${hintName(L, i + 1)}</b>${esc(h)}</div>`).join("");
      const lv = (L.hintLv || 0) + 1, pen = hintCost(L, lv);
      const btn = L.canHint ? `<button type="button" class="ot-hintbtn" data-hint="${esc(L.key)}:${lv}">${HKUI.icon("lightbulb", 16, "currentColor")} ${hintName(L, lv)} <small>(${pen ? `+${pen}초` : "벌점 없음"})</small></button>` : "";
      if (!shown && !btn) return "";
      return compact ? `${shown}${btn}` : `<div class="ot-hints">${shown}${btn}</div>`;
    }
    function openedHtml(L) {
      const pop = fx && fx.kind === "ok" && fx.key === L.key && Date.now() - fx.at < 1500;
      return `<div class="ot-opened ${pop ? "is-pop" : ""}"><svg viewBox="0 0 42 42" aria-hidden="true"><path class="ot-shackle" d="M13 19v-6a8 8 0 0 1 16 0" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round" style="transform-origin:29px 19px"/><rect x="8" y="18" width="26" height="20" rx="5" fill="#22c55e"/><circle cx="21" cy="27" r="3" fill="#14532d"/></svg>${L.kind === "cards" ? "출입문이 열렸어요!" : "열렸어요!"}</div>`;
    }
    function lockHtml(t) {
      const L = t.lock;
      if (!L) return "";
      if (L.solved) return `<div class="ot-lock" style="border-style:solid;border-color:#86efac;background:#f0fdf4">${openedHtml(L)}</div>`;
      if (room.status !== "PLAYING") return "";
      if (!L.open) return L.why ? `<div class="ot-note is-why">${HKUI.icon("info", 16, "currentColor")} ${esc(L.why)}</div>${hintsHtml(L)}` : hintsHtml(L);
      const bad = fx && fx.kind === "bad" && fx.key === L.key && Date.now() - fx.at < 600;
      let head = "", body = "";
      if (L.kind === "digits" && L.key === "drawer") {
        const val = rollVal(L.key, L.length), cur = Date.now() - (draft.cur[`${L.key}:t`] || 0) < 2000 ? draft.cur[L.key] || 0 : -1; // 키보드로 치는 중일 때만 다음 칸 표시
        head = `${HKUI.icon("lock-keyhole", 16)} 숫자 자물쇠 <small>위·아래로 돌려요 · 키보드 숫자도 돼요</small>`;
        body = `<div class="ot-rollers">${[...val].map((d, i) => `<div class="ot-roller ${i === cur ? "is-cur" : ""}"><button type="button" data-roll="${L.key}:${i}:1" aria-label="${i + 1}번째 숫자 올리기">▲</button><b aria-live="polite">${d}</b><button type="button" data-roll="${L.key}:${i}:-1" aria-label="${i + 1}번째 숫자 내리기">▼</button></div>`).join("")}</div>
          <div class="ot-go"><button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}">${HKUI.icon("key-round", 18, "currentColor")} 열어 보기</button></div>`;
      } else if (L.kind === "digits") {
        const val = (draft.digits[L.key] || "").slice(0, L.length);
        head = `${HKUI.icon("shield", 16)} 보안 패널 <small>숫자 ${L.length}자리</small>`;
        body = `<div class="ot-keypad"><div class="ot-lcd" aria-label="입력한 숫자 ${val.length}자리">${Array.from({ length: L.length }, (_, i) => `<span class="${val[i] ? "" : "is-empty"}">${val[i] || "_"}</span>`).join("")}</div>
          <div class="ot-keys">${["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((n) => `<button type="button" data-key="${L.key}:${n}">${n}</button>`).join("")}<button type="button" class="is-del" data-key="${L.key}:del">지우기</button><button type="button" data-key="${L.key}:0">0</button><button type="button" class="is-ok" data-solve="${L.key}" ${val.length === L.length ? "" : "disabled"}>확인</button></div></div>`;
      } else if (L.kind === "colors") {
        const cur = draft.colors[L.key] || [];
        head = `${HKUI.icon("palette", 16)} 색 버튼 자물쇠 <small>${L.length}번 눌러요</small>`;
        body = `<div class="ot-slots">${Array.from({ length: L.length }, (_, i) => `<span class="ot-slot ${cur[i] ? "is-set" : ""}" style="${cur[i] ? `background:${COLORS[cur[i]][0]}` : ""}" aria-label="${i + 1}번째 ${cur[i] ? COLORS[cur[i]][1] : "빈칸"}"></span>`).join("")}</div>
          <div class="ot-swatches">${L.options.map((c) => `<button type="button" class="ot-swatch" style="background:${(COLORS[c] || ["#94a3b8"])[0]}" data-color="${L.key}:${c}">${(COLORS[c] || [0, c])[1]}</button>`).join("")}</div>
          <div class="ot-go" style="gap:8px"><button type="button" class="hk-btn hk-btn--secondary" data-uncolor="${L.key}" ${cur.length ? "" : "disabled"}>하나 지우기</button><button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}" ${cur.length === L.length ? "" : "disabled"}>열어 보기</button></div>`;
      } else if (L.kind === "switches") {
        const cur = draft.switches[L.key] || Array(L.length).fill(0);
        head = `${HKUI.icon("zap", 16)} 차단기 <small>스위치를 눌러 위·아래로</small>`;
        body = `<div class="ot-fuse">${itemSvg("fuse")} 퓨즈가 끼워져 있어요</div>
          <div class="ot-breaker">${cur.map((v, i) => `<button type="button" class="ot-switch ${v ? "is-up" : "is-down"}" data-switch="${L.key}:${i}" aria-pressed="${v ? "true" : "false"}" aria-label="${i + 1}번 스위치 ${v ? "위" : "아래"}"><span class="ot-switch__body"><span class="ot-switch__knob"></span></span>${i + 1}번</button>`).join("")}</div>
          <div class="ot-go"><button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}">${HKUI.icon("zap", 18, "currentColor")} 이대로 올리기</button></div>`;
      } else if (L.kind === "counts") {
        const cur = draft.counts[L.key] || Array(L.length).fill(0);
        head = `${HKUI.icon("coffee", 16)} 커피머신 관리자 메뉴 <small>칸마다 0~${L.max}</small>`;
        body = `<div class="ot-machine"><div class="ot-machine__screen">보안 시험 중 · 관리자 메뉴를 골라 주세요</div>
          ${L.options.map((k, i) => `<div class="ot-count">${cupSvg(k)}<b>${esc(COFFEE[k] || k)}</b><button type="button" data-count="${L.key}:${i}:-1" ${cur[i] <= 0 ? "disabled" : ""} aria-label="${esc(COFFEE[k] || k)} 빼기">−</button><output aria-live="polite">${cur[i]}</output><button type="button" data-count="${L.key}:${i}:1" ${cur[i] >= L.max ? "disabled" : ""} aria-label="${esc(COFFEE[k] || k)} 더하기">+</button></div>`).join("")}</div>
          <div class="ot-go"><button type="button" class="hk-btn hk-btn--primary" data-solve="${L.key}">${HKUI.icon("coffee", 18, "currentColor")} 이대로 주문</button></div>`;
      } else if (L.kind === "cards") {
        const c = room.cards || {}, now = Date.now();
        const mine = c.mine && c.mine > now, theirs = c.partner && c.partner > now;
        head = `${HKUI.icon("id-card", 16)} 카드 리더기 <small>${c.window || 5}초 안에 둘이 같이</small>`;
        body = `<button type="button" class="hk-btn hk-btn--primary ot-cardbtn" data-card ${mine ? "disabled" : ""}>${itemSvg("card")}<span>${mine ? "사원증을 댔어요" : "사원증 대기"}</span></button>
          <div class="ot-cardnote ${theirs ? "is-hot" : ""}" id="ot-cardnote">${cardNote()}</div>`;
      }
      return `<div class="ot-lock ${bad ? "is-bad" : ""}" data-lockbox="${L.key}"><div class="ot-lock__head">${head}</div>${body}${hintsHtml(L)}</div>`;
    }
    function cardNote() {
      const c = (room && room.cards) || {}, now = Date.now(), name = esc((room && room.partner && room.partner.name) || "동기");
      if (c.partner && c.partner > now) return `${name}님이 사원증을 댔어요! ${Math.ceil((c.partner - now) / 1000)}초 안에 대세요`;
      if (c.mine && c.mine > now) return `${name}님을 기다리는 중… ${Math.ceil((c.mine - now) / 1000)}초`;
      return `'셋, 둘, 하나' 하고 ${c.window || 5}초 안에 둘 다 대야 열려요`;
    }

    // ---------- 진행 화면 ----------
    function hotClass(t) {
      const cls = [];
      if (t.dim) cls.push("is-dim");
      if (t.lock && !t.lock.solved && t.lock.open) cls.push("is-lock");
      else if (t.lock && t.lock.solved) cls.push("is-open");
      if (t.use && t.use.length) cls.push("is-use");
      if (isNew(t.key)) cls.push("is-new");
      if (pick === t.key) cls.push("is-on");
      return cls.join(" ");
    }
    const isNew = (k) => newAt[k] && Date.now() - newAt[k] < 30000;
    function stageHtml(review) {
      const v = state(), side = room.sideKey === "pantry" ? "pantry" : "office";
      const map = HOT[side];
      const hots = (room.things || []).filter((t) => map[t.key]).map((t) => {
        const [x, y, w, h] = map[t.key];
        const where = y + h > 410 ? "is-up" : y + h > 380 ? "is-in" : "";
        const status = t.dim ? "아직 어두워요" : t.lock ? (t.lock.solved ? "열림" : t.lock.open ? "잠김" : "") : "";
        return `<button type="button" class="ot-hot ${hotClass(t)} ${where}" data-thing="${esc(t.key)}" style="left:${((x + w / 2) / 8).toFixed(2)}%;top:${((y + h / 2) / 4.8).toFixed(2)}%;width:${(w / 8).toFixed(2)}%;height:${(h / 4.8).toFixed(2)}%" aria-label="${esc(t.title)}${status ? ` (${status})` : ""}"><span class="ot-hot__tag">${esc(t.title)}</span><i class="ot-hot__dot" aria-hidden="true"></i></button>`;
      }).join("");
      const panelOk = v.solved.has("panel");
      const [lx, ly] = LIGHT[side], [ax, ay] = ALARM[side];
      let flyHtml = "";
      if (fly && Date.now() - fly.at < 1300) {
        const [sx, sy, sw, sh] = map.slot;
        flyHtml = `<div class="ot-fly is-${fly.dir}" style="left:${((sx + sw / 2) / 8).toFixed(2)}%;top:${((sy + sh / 2) / 4.8).toFixed(2)}%">${itemSvg(fly.item)}</div>`;
      }
      return `<div class="ot-stage ${v.power ? "is-power" : ""} ${flicker ? "is-flicker" : ""}" data-side="${side}" style="--lx:${lx};--ly:${ly}">
          ${side === "office" ? officeSvg(v) : pantrySvg(v)}
          <div class="ot-dark"></div>${!panelOk && room.status === "PLAYING" ? `<div class="ot-alarm" style="left:${ax};top:${ay}"></div>` : ""}
          ${hots}${flyHtml}
        </div>`;
    }
    function radioHtml() {
      const beats = room.beats || [];
      const b = clientBeat || beats[beats.length - 1];
      if (!b) return "";
      return `<div class="ot-radio ${b.who === "system" ? "is-system" : ""} ${beatNew ? "is-new" : ""}" role="status" aria-live="polite">
          <span class="ot-radio__face">${faceOf(b)}</span>
          <span class="ot-radio__body"><span class="ot-radio__name"><i aria-hidden="true"></i>${esc(b.name)}${b.who === "npc" ? " · 인터폰" : " · 안내 방송"}</span><span class="ot-radio__text">${esc(b.text)}</span></span>
        </div>`;
    }
    // 같은 물건은 한 칸으로 묶어요(김밥을 넘겨받으면 「김밥 한 줄 ×2」)
    function grouped(list) {
      const out = [];
      (list || []).forEach((b) => { const g = out.find((x) => x.key === b.key); if (g) g.n += 1; else out.push({ ...b, n: 1 }); });
      return out;
    }
    function bagHtml() {
      const bag = grouped(room.bag);
      const items = bag.map((b) => `<button type="button" class="ot-item ${pick === `i:${b.key}` ? "is-on" : ""} ${newItems.has(b.key) ? "is-new" : ""} ${b.canUse ? "is-use" : ""}" data-bag="${esc(b.key)}" aria-label="가방 — ${esc(b.title)}${b.n > 1 ? ` ${b.n}개` : ""}">${itemSvg(b.key)}${esc(b.title)}${b.n > 1 ? `<small class="ot-item__n" aria-hidden="true">×${b.n}</small>` : ""}</button>`).join("");
      const mate = grouped(room.partnerBag).map((b) => `${esc(b.key === "card" ? "사원증" : b.title)}${b.n > 1 ? ` ×${b.n}` : ""}`).join(", ");
      return `<div class="ot-bag"><span class="ot-bag__label">${HKUI.icon("backpack", 16, "currentColor")} 내 가방</span>${items || `<span class="ot-bag__empty">비어 있어요</span>`}
          <span class="ot-bag__mate">건너편 가방: <b>${mate || "비어 있어요"}</b></span></div>`;
    }
    function listHtml() {
      return `<nav class="ot-list" aria-label="${esc(room.sideName || "")}에서 보이는 것">${(room.things || []).map((t) => `<button type="button" class="ot-chip ${hotClass(t)}" data-thing="${esc(t.key)}"><i class="ot-dot" aria-hidden="true"></i>${esc(t.title)}</button>`).join("")}</nav>`;
    }
    function detailHtml() {
      if (pick && pick.startsWith("i:")) {
        const b = grouped(room.bag).find((x) => x.key === pick.slice(2));
        if (b) {
          const acts = [];
          if (room.status === "PLAYING") {
            if (b.canUse) acts.push(`<button type="button" class="hk-btn hk-btn--primary" data-item="${esc(b.key)}:use">${esc(b.useLabel || "쓰기")}</button>`);
            if (b.pass) acts.push(`<button type="button" class="hk-btn ${b.canUse ? "hk-btn--secondary" : "hk-btn--primary"}" data-item="${esc(b.key)}:send">${HKUI.icon("mail", 16, "currentColor")} 투입구로 넘기기</button>`);
            if (b.eat) acts.push(`<button type="button" class="hk-btn hk-btn--secondary" data-item="${esc(b.key)}:eat">${b.bite ? "한 조각 먹기" : "먹기"}</button>`);
          }
          const note = b.key === "card" ? "출입문 리더기에 댈 때 써요. 리더기를 눌러 「사원증 대기」를 누르면 돼요."
            : b.elsewhere ? "이쪽에는 쓸 곳이 안 보여요. 건너편에서 필요할지도 몰라요."
            : b.useAt && !b.canUse ? "쓸 곳이 아직 열리지 않았어요."
            : b.bite && !b.eat ? "배불러요. 남은 김밥은 퇴근길에 먹어요." : "";
          return `<div class="ot-detail" id="ot-detail"><div class="ot-detail__head"><span class="ot-detail__ico">${itemSvg(b.key)}</span><h3>${esc(b.title)}${b.n > 1 ? ` ×${b.n}` : ""}</h3><span class="ot-tag is-bag">가방</span></div>
              <p class="ot-text">${esc(b.text)}</p>${note ? `<p class="ot-note">${esc(note)}</p>` : ""}${acts.length ? `<div class="ot-actions">${acts.join("")}</div>` : ""}</div>`;
        }
        pick = null;
      }
      const things = room.things || [];
      if (!pick || !things.some((t) => t.key === pick)) pick = (things.find((t) => t.lock && t.lock.open && !t.lock.solved) || things.find((t) => !t.dim) || things[0] || {}).key;
      const t = things.find((x) => x.key === pick);
      if (!t) return "";
      const tag = t.dim ? `<span class="ot-tag is-dim">아직 어두워요</span>` : t.lock ? (t.lock.solved ? `<span class="ot-tag is-open">열림</span>` : `<span class="ot-tag is-lock">잠김</span>`) : "";
      const uses = room.status === "PLAYING" && (t.use || []).length
        ? `<div class="ot-actions">${t.use.map((u) => `<button type="button" class="hk-btn hk-btn--primary ot-usebtn" data-item="${esc(u.item)}:use">${itemSvg(u.item)}${esc(u.label)}</button>`).join("")}</div>` : "";
      let slot = "";
      if (t.slot && room.status === "PLAYING") {
        const bag = grouped(room.bag).filter((b) => b.pass); // 같은 물건 두 개여도 버튼은 하나(한 번에 하나씩 넘어가요)
        slot = bag.length
          ? `<div class="ot-actions">${bag.map((b) => `<button type="button" class="hk-btn hk-btn--secondary ot-usebtn" data-item="${esc(b.key)}:send">${itemSvg(b.key)}「${esc(b.title)}」 넘기기</button>`).join("")}</div>`
          : `<p class="ot-note">넘길 물건이 가방에 없어요. 사원증은 넘기지 않아요.</p>`;
      }
      return `<div class="ot-detail" id="ot-detail"><div class="ot-detail__head"><span class="ot-detail__ico">${HKUI.icon(t.icon || "search", 22, "currentColor")}</span><h3>${esc(t.title)}</h3>${tag}</div>
          <p class="ot-text">${esc(t.text)}</p>${t.art ? `<div class="ot-art">${artHtml(t.art)}</div>` : ""}${uses}${slot}${lockHtml(t)}</div>`;
    }
    function playHtml(review) {
      return `<div class="ot">${review ? "" : radioHtml()}${stageHtml(review)}${bagHtml()}${listHtml()}${detailHtml()}</div>`;
    }
    function progressHtml() {
      const prog = room.progress || [];
      const locks = prog.filter((p) => p.kind !== "task");
      const done = locks.filter((p) => p.solved).length;
      const rows = prog.map((p) => {
        const task = p.kind === "task";
        const ico = p.solved ? HKUI.icon("circle-check-big", 18, "#16a34a") : task ? HKUI.icon("arrow-left-right", 18, p.open ? "#7c3aed" : "#94a3b8") : HKUI.icon(p.open ? "lock-keyhole" : "lock", 18, p.open ? "#b45309" : "#94a3b8");
        const hint = !p.solved && room.status === "PLAYING" && !p.mine ? hintsHtml(p, true) : "";
        const mineHint = !p.solved && p.mine && p.hintLv ? ` <small class="ot-hlv">힌트 ${p.hintLv}</small>` : "";
        return `<li class="${p.solved ? "is-solved" : p.open ? "" : "is-closed"} ${task ? "is-task" : ""}">${ico}<span>${esc(p.title)}${mineHint}</span><small class="ot-where ${p.mine ? "is-mine" : ""}">${p.mine ? (p.key === "door" ? "둘이 함께" : "내 쪽") : esc(p.where)}</small>${hint}</li>`;
      }).join("");
      const sum = [];
      if (room.hints) sum.push(`<span class="is-warn">힌트 ${room.hints}번 +${room.hintSec}초</span>`);
      if (room.wrong) sum.push(`<span class="is-warn">오답 ${room.wrong}번 +${room.wrong * room.wrongPenalty}초</span>`);
      if (room.handoffs) sum.push(`<span>넘긴 물건 ${room.handoffs}번</span>`);
      return `<div class="er-card"><h2>${HKUI.icon("list-checks", 16, "currentColor")} 할 일 · 자물쇠 ${done} / ${locks.length}</h2><ul class="ot-prog">${rows}</ul>${sum.length ? `<div class="ot-sum">${sum.join("")}</div>` : ""}</div>`;
    }

    // ---------- 대기실 · 끝 ----------
    const howIco = {
      look: `<svg viewBox="0 0 30 30"><circle cx="13" cy="13" r="8" stroke="#7dd3fc" stroke-width="3" fill="none"/><path d="M19 19l7 7" stroke="#7dd3fc" stroke-width="3.4" stroke-linecap="round"/></svg>`,
      talk: `<svg viewBox="0 0 30 30"><path d="M4 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H7a3 3 0 0 1-3-3z" fill="#7dd3fc"/><path d="M24 11h1a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-1v3l-4-3h-4" stroke="#fde68a" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>`,
      slot: `<svg viewBox="0 0 30 30"><rect x="2" y="12" width="26" height="8" rx="2" fill="#94a3b8"/><rect x="5" y="15" width="20" height="3" rx="1" fill="#0f172a"/><rect x="9" y="4" width="12" height="9" rx="1" fill="#fde68a"/></svg>`,
      card: `<svg viewBox="0 0 48 48">${ITEM_ART.card}</svg>`,
    };
    function readyExtra(ctx) {
      const room = ctx.room;
      return `<div class="ot-how"><h3>${HKUI.icon("info", 16, "currentColor")} 이렇게 해요</h3><ol>
          <li>${howIco.look}<b>둘러보기</b><span>그림 속 물건을 눌러 살펴봐요</span></li>
          <li>${howIco.talk}<b>말로 알려 주기</b><span>내 자물쇠 단서는 늘 건너편에 있어요</span></li>
          <li>${howIco.slot}<b>서류 투입구</b><span>유리 벽 너머로 물건을 넘겨요</span></li>
          <li>${howIco.card}<b>사원증 두 장</b><span>마지막 문은 5초 안에 같이 대요</span></li></ol>
          <p>판마다 정답이 바뀌어요 · 힌트 +${(room && room.hintPenalties && room.hintPenalties[0]) || 30}초/+${(room && room.hintPenalties && room.hintPenalties[1]) || 60}초 · 오답 +${(room && room.wrongPenalty) || 15}초</p></div>`;
    }
    function exitArt(open) {

          <rect x="0" y="0" width="340" height="170" fill="none"/>
          <rect x="100" y="16" width="140" height="150" rx="4" fill="#0b1220" stroke="#475569" stroke-width="6"/>
          ${open ? `<g class="ot-light"><rect x="106" y="22" width="128" height="144" fill="#fde68a"/><polygon points="106,166 234,166 330,170 10,170" fill="#fde68a" opacity=".35"/>
            <g class="ot-walk" fill="#1e293b"><circle cx="150" cy="96" r="10"/><path d="M134 166v-38q0-16 16-16t16 16v38z"/><circle cx="190" cy="96" r="10"/><path d="M174 166v-38q0-16 16-16t16 16v38z"/></g></g>` : ""}
          <g class="${open ? "ot-door-l" : ""}"><rect x="106" y="22" width="64" height="144" fill="#334155"/><rect x="158" y="86" width="5" height="24" rx="2" fill="#94a3b8"/></g>
          <g class="${open ? "ot-door-r" : ""}"><rect x="170" y="22" width="64" height="144" fill="#3b4a66"/><rect x="177" y="86" width="5" height="24" rx="2" fill="#94a3b8"/></g>
          <rect x="140" y="0" width="60" height="14" rx="3" fill="#15803d"/><text x="170" y="11" text-anchor="middle" font-size="9" font-weight="900" fill="#dcfce7" font-family="sans-serif">비상구</text>
          ${open ? "" : `<circle cx="170" cy="30" r="6" fill="#ef4444"/>`}
        </svg></div>`;
    }
    function bestHtml(r) {
      if (r.pairBest == null) return `<p class="ot-best is-new">둘의 첫 탈출 기록이에요!</p>`;
      if (r.recordSec < r.pairBest) return `<p class="ot-best is-new">둘의 최고 기록을 ${mmss(r.pairBest - r.recordSec)} 앞당겼어요!</p>`;
      return `<p class="ot-best">둘의 최고 기록은 ${mmss(r.pairBest)}예요</p>`;
    }
    function solvedCount(r) { return (r.progress || []).filter((p) => p.kind !== "task" && p.solved).length; }

    const CTX = HKCoop.mount({
      room: "overtime",
      listName: "방탈출 목록",
      hero: {
        facts: ["2인 협동", "제한 20분", "판마다 정답이 바뀌어요", "서류 투입구로 물건 넘기기", "탈출하면 오늘 도장"],
        note: "서로 다른 쪽에 갇혀 단서를 말로 주고받아요. 옆자리 동료나 Teams 통화를 켜고 하면 더 재밌어요.",
      },
      rankTitle: "탈출 순위",
      rankNote: "판마다 정답이 새로 바뀌어요. 같은 두 사람은 가장 빠른 탈출 한 판만 순위에 올라요. 기록은 걸린 시간에 힌트·오답 벌점을 더한 시간이에요.",
      rankText: (x) => mmss(x.sec),
      recentText: (r) => (r.status === "CLEAR" ? [`탈출 ${mmss(r.recordSec)}`, "is-clear"] : ["실패", "is-fail"]),
      failTitle: "탈출 실패",
      quick: ["이거 봐 줘", "찾았어!", "숫자 불러 줄게", "색 불러 줄게", "투입구로 넘길게", "잠깐만", "다시 말해 줘", "셋, 둘, 하나!"],
      timerNote: (ctx) => (ctx.room.penaltySec ? `벌점 +${ctx.room.penaltySec}초` : "남은 시간"),
      readyExtra, // 나 & 상대 칸이 이미 쪽을 보여 줘서 역할 안내(readyNote)는 따로 두지 않는다 — 휴대폰에서도 준비 버튼이 첫 화면에
      reset: () => {
        pick = null; fx = null; fly = null; flicker = false; beatNew = false; clientBeat = null; said5 = false; listX = 0; chipFocus = false;
        seen = new Set(); newAt = {}; newItems = new Set(); seenBeats = new Set();
        Object.keys(draft).forEach((k) => { draft[k] = {}; });
      },
      changed: (prev, next, ctx) => {
        room = next;
        const visible = (next.things || []).filter((t) => !t.dim).map((t) => t.key);
        const beats = next.beats || [];
        if (!prev || prev.id !== next.id || prev.status !== "PLAYING") {
          visible.forEach((k) => seen.add(k));
          beats.forEach((b) => seenBeats.add(b.key));
          // 시작하는 순간 — 보안 시스템 방송이 먼저 내려오고, 몇 초 뒤 문 반장님 인터폰으로 넘어간다
          if (prev && prev.id === next.id && next.status === "PLAYING" && beats.length > 1) {
            beatNew = true; clientBeat = beats[0];
            setTimeout(() => { if (room && room.id === next.id && room.status === "PLAYING" && clientBeat === beats[0]) { clientBeat = null; beatNew = true; ctx.paint(); } }, 4200);
          }
          return;
        }
        if (next.status !== "PLAYING") return;
        visible.forEach((k) => { if (!seen.has(k)) { seen.add(k); newAt[k] = Date.now(); } });
        const last = beats[beats.length - 1];
        beatNew = !!(last && !seenBeats.has(last.key));
        if (beatNew) clientBeat = null;
        beats.forEach((b) => seenBeats.add(b.key));
        const was = new Set((prev.progress || []).filter((p) => p.solved).map((p) => p.key));
        const unlocked = (next.progress || []).filter((p) => p.solved && !was.has(p.key) && p.kind !== "task");
        const count = (bag) => (bag || []).reduce((m, b) => { m[b.key] = (m[b.key] || 0) + 1; return m; }, {});
        const a = count(prev.bag), b = count(next.bag);
        const gained = Object.keys(b).filter((k) => b[k] > (a[k] || 0));
        gained.forEach((k) => newItems.add(k));
        if (!prev.power && next.power) { flicker = true; setTimeout(() => { flicker = false; }, 1300); ctx.sfx("powerup"); }
        else if (unlocked.length) ctx.sfx("success");
        else if (gained.length) { fly = { item: gained[0], dir: "in", at: Date.now() }; ctx.sfx("drop"); }
      },
      painted: () => {
        // 휴대폰 물건 목록 — 통째로 다시 그려도 넘기던 자리 그대로. 내가 고른 칩은 목록 안에서 보이게만 옮겨요(쪽 전체는 안 움직여요)
        const list = document.querySelector(".ot-list");
        if (list && list.offsetParent !== null) {
          list.scrollLeft = listX;
          if (chipFocus) {
            const on = list.querySelector(".ot-chip.is-on");
            if (on) {
              const lr = list.getBoundingClientRect(), cr = on.getBoundingClientRect();
              if (cr.left < lr.left + 8) list.scrollLeft += cr.left - lr.left - 12;
              else if (cr.right > lr.right - 8) list.scrollLeft += cr.right - lr.right + 12;
            }
          }
          listX = list.scrollLeft;
        }
        chipFocus = false;
        if (wantScroll) {
          wantScroll = false;
          const el = document.getElementById("ot-detail");
          if (el) {
            const r = el.getBoundingClientRect();
            if (r.top > window.innerHeight - 120 || r.top < 0) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
          }
        }
        beatNew = false;
        if (fly && Date.now() - fly.at > 1300) fly = null;
      },
      play: () => playHtml(false),
      side: (ctx) => (ctx.room.status === "PLAYING" ? progressHtml() : ""),
      end: (ctx) => {
        const r = ctx.room, pen = r.penaltySec || 0;
        const why = [r.hints ? `힌트 ${r.hints}번` : "", r.wrong ? `오답 ${r.wrong}번` : ""].filter(Boolean).join(" · ");
        return `<div class="er-end ot-end">${exitArt(true)}<h2>탈출 성공!</h2><p>${esc(r.outro)}</p><div class="er-end__time">${mmss(r.recordSec)}</div>
            <p class="ot-end__sub">걸린 시간 ${mmss(Math.max(0, r.recordSec - pen))}${pen ? ` + 벌점 ${pen}초${why ? ` (${why})` : ""}` : " · 벌점 없음"}</p>${bestHtml(r)}</div>`;
      },
      failEnd: (ctx) => {
        const r = ctx.room;
        const why = r.end === "TIMEOUT" ? "20분이 다 됐어요. 문 반장님이 비상 열쇠를 들고 올라오고 있어요." : "포기했어요. 문 반장님이 비상 열쇠를 들고 올라오고 있어요.";
        return `<div class="er-end is-fail ot-end">${exitArt(false)}<h2>탈출 실패</h2><p>${why}</p><p class="ot-best">자물쇠 ${solvedCount(r)} / ${LOCKS} 풀었어요</p></div>`;
      },
      stats: (ctx) => {
        const r = ctx.room;
        // 세 칸 — 휴대폰에서도 한 줄에(이름은 짧게 — 힌트 · 오답 횟수는 끝 카드의 걸린 시간 줄에)
        const pen = { label: "벌점", value: r.penaltySec ? `+${r.penaltySec}초` : "없어요" };
        const pass = { label: "넘긴 물건", value: `${r.handoffs || 0}번` };
        if (r.status === "CLEAR") return [{ label: "탈출 기록", value: mmss(r.recordSec) }, pen, pass];
        return [{ label: "푼 자물쇠", value: `${solvedCount(r)} / ${LOCKS}` }, pen, pass];
      },
      // 끝 이야기 갈래 — 10분 안에 힌트 1단계 이하로 탈출하면 great, 탈출하면 ok, 그 밖은 fail
      storyTier: (ctx) => {
        const r = ctx.room;
        if (!r || r.status !== "CLEAR" || r.end !== "CLEAR") return "fail";
        return Number(r.recordSec) <= 600 && Number(r.hints || 0) <= 1 ? "great" : "ok";
      },
      after: (ctx) => {
        const r = ctx.room;
        const ans = (r.answers || []).length
          ? `<div class="er-card ot-answers"><h2>${HKUI.icon("key-round", 16, "currentColor")} 이번 판 정답</h2><ul>${r.answers.map((a) => `<li><b>${esc(a.title)}</b><small>${esc(a.where)}</small><code>${esc(a.answer)}</code></li>`).join("")}</ul>
              <div class="gk__due">판마다 정답이 바뀌어요. 다음 판은 또 달라요!</div></div>` : "";
        const scene = r.things && r.things.length ? `<div class="er-card ot-review" style="margin-top:14px"><h2>${HKUI.icon("scan-search", 16, "currentColor")} ${esc(r.sideName || "")} 다시 보기</h2>${playHtml(true)}</div>` : "";
        return ans + scene;
      },
      click: async (t, ctx) => {
        const d = t.dataset;
        if (d.thing) { pick = d.thing; delete newAt[d.thing]; wantScroll = true; chipFocus = true; ctx.sfx("tap"); ctx.paint(); return; }
        if (d.bag) { pick = `i:${d.bag}`; newItems.delete(d.bag); wantScroll = true; ctx.sfx("tap"); ctx.paint(); return; }
        if (d.roll) {
          const [k, i, dir] = d.roll.split(":"); const L = lockOf(k); if (!L) return;
          const arr = [...rollVal(k, L.length)]; arr[Number(i)] = String((Number(arr[Number(i)]) + Number(dir) + 10) % 10);
          draft.digits[k] = arr.join(""); ctx.sfx("tick"); ctx.paint(); return;
        }
        if (d.key) {
          const [k, v] = d.key.split(":"); const L = lockOf(k); if (!L) return;
          const cur = draft.digits[k] || "";
          draft.digits[k] = v === "del" ? cur.slice(0, -1) : (cur + v).slice(0, L.length);
          ctx.sfx("tap"); ctx.paint(); return;
        }
        if (d.color) { const [k, c] = d.color.split(":"); const L = lockOf(k); const cur = draft.colors[k] || []; if (L && cur.length < L.length) { draft.colors[k] = [...cur, c]; ctx.sfx("select"); } ctx.paint(); return; }
        if (d.uncolor) { draft.colors[d.uncolor] = (draft.colors[d.uncolor] || []).slice(0, -1); ctx.paint(); return; }
        if (d.switch) { const [k, i] = d.switch.split(":"); const L = lockOf(k); if (!L) return; const cur = draft.switches[k] || Array(L.length).fill(0); cur[Number(i)] = cur[Number(i)] ? 0 : 1; draft.switches[k] = cur; ctx.sfx("swap"); ctx.paint(); return; }
        if (d.count) {
          const [k, i, dl] = d.count.split(":"); const L = lockOf(k); if (!L) return;
          const cur = draft.counts[k] || Array(L.length).fill(0); cur[Number(i)] = Math.max(0, Math.min(L.max, cur[Number(i)] + Number(dl))); draft.counts[k] = cur;
          ctx.sfx("select"); ctx.paint(); return;
        }
        if (d.solve) return solve(d.solve, ctx);
        if (d.hint) {
          const [k, lv] = d.hint.split(":");
          const p = (room.progress || []).find((x) => x.key === k) || lockOf(k) || {};
          const pen = hintCost(p, Number(lv));
          if (pen > 0) { // 벌점 없는 힌트(출입문 요령)는 묻지 않고 바로 보여 줘요
            const name = hintName(p, Number(lv)), [head, tier] = name.split(" · ");
            const ok = await HKUI.confirmDialog(`${head}를 볼까요?`, `「${esc(p.title || "")}」 ${esc(head)}${tier ? `(${esc(tier)})` : ""}를 보면 기록에 <b>${pen}초</b>가 더해져요. ${esc(room.partner.name)}님 화면에도 같은 힌트가 보여요.`, { confirmLabel: "힌트 보기" });
            if (!ok) return;
          }
          const r = await ctx.act(() => HKApi.coopHintStep(room.id, k, Number(lv)));
          if (r) ctx.sfx("tick");
          return;
        }
        if (d.item) {
          const [key, action] = d.item.split(":");
          const had = (room.bag || []).find((b) => b.key === key), wasPick = pick;
          const r = await ctx.act(() => HKApi.coopItem(room.id, key, action));
          if (!r) return;
          if (action === "send") { fly = { item: key, dir: "out", at: Date.now() }; if (wasPick === `i:${key}` || wasPick === "slot") { pick = "slot"; chipFocus = true; } ctx.sfx("whoosh"); HKUI.toast(`${room.partner.name}님 가방으로 넘겼어요`); ctx.paint(); }
          else if (action === "use") { if (had && had.useAt) { pick = had.useAt; chipFocus = true; } ctx.sfx("select"); ctx.paint(); }
          else if (action === "eat") { if (wasPick === `i:${key}` && !(room.bag || []).some((b) => b.key === key)) pick = null; ctx.sfx("pop"); HKUI.toast("냠냠, 한 조각 먹었어요. 든든해요!"); ctx.paint(); }
          return;
        }
        if ("card" in d) {
          ctx.sfx("select");
          const r = await ctx.act(() => HKApi.coopCard(room.id));
          if (r && r.stamp && r.stamp.new) HKUI.toast(`오늘 도장을 받았어요 (${r.stamp.count}/${r.stamp.goal})`);
        }
      },
      tick: (ctx) => {
        if (!room) return;
        const note = document.getElementById("ot-cardnote");
        if (note && room.cards) {
          const now = Date.now(), c = room.cards;
          note.innerHTML = cardNote();
          note.classList.toggle("is-hot", !!(c.partner && c.partner > now));
          const btn = document.querySelector("[data-card]");
          if (btn && btn.disabled && !(c.mine && c.mine > now)) { btn.disabled = false; btn.querySelector("span").textContent = "사원증 대기"; }
        }
        // 5분 남았을 때 문 반장님 인터폰 한 번
        if (room.status === "PLAYING" && room.deadlineAt && !said5) {
          const left = (new Date(room.deadlineAt) - Date.now()) / 1000;
          if (left > 0 && left <= 300) {
            said5 = true;
            clientBeat = { key: "five", who: "npc", name: "문 반장님", text: "5분 남았어요! 시험이 끝나면 비상 잠금으로 바뀌어요. 서둘러요!" };
            beatNew = true; ctx.sfx("countdown"); ctx.paint();
          }
        }
      },
    });

    async function solve(k, ctx) {
      const L = lockOf(k);
      if (!L || !L.open || L.solved) return;
      let answer;
      if (L.kind === "digits") {
        answer = k === "drawer" ? rollVal(k, L.length) : (draft.digits[k] || "");
        if (answer.length !== L.length) { HKUI.toast(`숫자 ${L.length}자리를 눌러 주세요`, "error"); return; }
      } else if (L.kind === "colors") answer = draft.colors[k] || [];
      else if (L.kind === "switches") answer = draft.switches[k] || Array(L.length).fill(0);
      else if (L.kind === "counts") answer = draft.counts[k] || Array(L.length).fill(0);
      else return;
      // 손대지 않은 처음 값(0000 · 스위치 모두 아래 · 모두 0개)은 정답일 수 없어요 — 벌점 없이 먼저 맞추라고 알려 줘요(서버도 막아요)
      const blank = L.kind === "digits" ? /^0+$/.test(answer) : (L.kind === "switches" || L.kind === "counts") && answer.every((v) => !v);
      if (blank) {
        const say = { drawer: "다이얼을 돌려 네 자리를 먼저 맞춰 주세요", switches: "스위치를 눌러 위·아래를 먼저 맞춰 주세요", counts: "칸마다 개수를 먼저 골라 주세요" };
        HKUI.toast(say[k === "drawer" ? "drawer" : L.kind] || "숫자를 다시 눌러 주세요", "error");
        return;
      }
      const r = await ctx.act(() => HKApi.coopSolve(room.id, k, answer));
      if (!r) return;
      if (r.ok === false) {
        fx = { key: k, kind: "bad", at: Date.now() };
        ctx.sfx("invalid");
        HKUI.toast(`안 열려요… (+${room.wrongPenalty}초)`, "error");
        if (L.kind === "colors") draft.colors[k] = [];
        if (L.kind === "digits" && k !== "drawer") draft.digits[k] = "";
        ctx.paint();
      } else if (r.ok) {
        fx = { key: k, kind: "ok", at: Date.now() };
        ctx.paint();
      }
    }

    // 키보드 — 숫자 자물쇠가 열려 있으면 숫자 · 지우기 · Enter 로도
    document.addEventListener("keydown", (e) => {
      if (!room || room.status !== "PLAYING" || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
      if (document.querySelector(".hk-dialog__overlay")) return;
      const t = (room.things || []).find((x) => x.key === pick);
      const L = t && t.lock;
      if (!L || L.kind !== "digits" || !L.open || L.solved) return;
      const k = L.key;
      if (/^[0-9]$/.test(e.key)) {
        e.preventDefault();
        if (k === "drawer") {
          const arr = [...rollVal(k, L.length)];
          const cur = Date.now() - (draft.cur[`${k}:t`] || 0) > 2000 ? 0 : draft.cur[k] || 0;
          arr[cur] = e.key; draft.digits[k] = arr.join(""); draft.cur[k] = (cur + 1) % L.length; draft.cur[`${k}:t`] = Date.now();
        } else draft.digits[k] = ((draft.digits[k] || "") + e.key).slice(0, L.length);
        CTX.paint();
      } else if (e.key === "Backspace") {
        e.preventDefault();
        if (k === "drawer") { draft.cur[k] = Math.max(0, (draft.cur[k] || 0) - 1); draft.cur[`${k}:t`] = Date.now(); }
        else draft.digits[k] = (draft.digits[k] || "").slice(0, -1);
        CTX.paint();
      } else if (e.key === "Enter" && tag !== "BUTTON") {
        e.preventDefault();
        solve(k, CTX);
      }
    });
  </script>
</body>
</html>
