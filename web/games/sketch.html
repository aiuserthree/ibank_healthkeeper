<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 화이트보드 그림 퀴즈</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/match-lobby.js"></script>
  <script src="/_shared/play.js"></script>
  <script src="/_shared/coop-story.js"></script>
  <script src="/_shared/coop.js"></script>
  <style>
    /* 화이트보드 그림 퀴즈 — 17:40 본관 소회의실. 청록 벽 앞 은색 틀 화이트보드. 화 색(청록)은 .er 의 --ch-* 를 쓴다 */
    .er-hero.is-sketch { background: radial-gradient(120% 90% at 85% 0%, #2dd4bf 0%, rgba(45, 212, 191, 0) 55%), linear-gradient(160deg, #0f766e, #155e75); }

    /* ── 무대(소회의실 벽) ── */
    /* 보드 너비 — 넓은 화면에서는 사이트 머리 · 상태 줄 · 카드 · 받침대 · 도구 줄까지 한 화면에 들어오게 높이에서 거꾸로 셈한다(답 · 반응은 옆 칸 맨 위) */
    .sk-stage { --fw: min(100%, max(min(100%, 360px), calc((100vh - 420px) * 4 / 3 + 18px))); position: relative; isolation: isolate; padding: 14px 14px 12px; border-radius: 22px; color: #134e4a;
      background: radial-gradient(90% 60% at 50% 0%, rgba(255, 255, 255, .75), transparent 70%), linear-gradient(180deg, #ecfeff 0%, #ccfbf1 100%);
      box-shadow: 0 10px 28px rgba(15, 118, 110, .14), inset 0 -4px 0 #0d9488; }
    .sk-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .sk-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .sk-chip { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 11px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px #99f6e4; font-size: 13px; font-weight: 700; color: #0f766e; white-space: nowrap; }
    .sk-chip b { font-size: 16px; font-weight: 900; color: #134e4a; font-variant-numeric: tabular-nums; }
    .sk-chip.is-score b { font-size: 18px; }
    .sk-chip.is-bump { animation: sk-bump .55s ease; }
    @keyframes sk-bump { 35% { transform: scale(1.18); box-shadow: inset 0 0 0 2px #f59e0b, 0 0 0 6px rgba(245, 158, 11, .25); } }
    .sk-chip.is-fire { background: linear-gradient(90deg, #f97316, #facc15); box-shadow: none; color: #451a03; }
    .sk-chip.is-fire b { color: #451a03; }
    .sk-chip.is-clock { min-width: 74px; justify-content: center; background: #134e4a; box-shadow: none; color: #99f6e4; }
    .sk-chip.is-clock b { color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sk-chip.is-clock.is-low { background: #b91c1c; color: #fecaca; animation: sk-low 1s ease-in-out infinite; }
    @keyframes sk-low { 50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, .25); } }
    .sk-role { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 900; white-space: nowrap; }
    .sk-role.is-draw { background: #fde047; color: #713f12; box-shadow: 0 3px 0 #ca8a04; }
    .sk-role.is-guess { background: #22c55e; color: #fff; box-shadow: 0 3px 0 #15803d; }
    .sk-role i { font-style: normal; }

    /* 제시어 쪽지(그리는 사람) · 낱말 카드(맞히는 사람) */
    .sk-cardwrap { margin-top: 12px; perspective: 900px; }
    .sk-card { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 rgba(13, 148, 136, .25), 0 10px 22px rgba(15, 118, 110, .12); }
    .sk-card.is-draw { background: linear-gradient(180deg, #fef9c3, #fef08a); box-shadow: 0 4px 0 rgba(202, 138, 4, .35), 0 10px 22px rgba(113, 63, 18, .12); transform: rotate(-.5deg); }
    .sk-card.is-draw::before { content: ""; position: absolute; top: -9px; left: 50%; width: 74px; height: 18px; margin-left: -37px; border-radius: 3px; background: rgba(255, 255, 255, .6); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); transform: rotate(-2deg); }
    .sk-card.is-rise { animation: sk-rise .45s cubic-bezier(.2, .8, .25, 1.1) both; animation-delay: var(--fxd, 0ms); }
    @keyframes sk-rise { from { opacity: 0; transform: translateY(26px) rotate(-.5deg); } }
    .sk-card.is-flip { animation: sk-flip .4s cubic-bezier(.2, .8, .25, 1) both; animation-delay: var(--fxd, 0ms); }
    @keyframes sk-flip { 0% { transform: rotateY(-90deg); opacity: .2; } 70% { transform: rotateY(8deg); opacity: 1; } 100% { transform: none; } }
    .sk-card__main { flex: 1 1 220px; min-width: 0; }
    .sk-card__main > small { display: block; font-size: 12.5px; font-weight: 800; color: #0f766e; }
    .sk-card.is-draw .sk-card__main > small { color: #92400e; }
    .sk-word { display: inline-block; margin: 1px 0 2px; font-size: 38px; font-weight: 900; line-height: 1.15; color: #422006; word-break: keep-all; transition: filter .15s ease; user-select: none; -webkit-user-select: none; }
    .sk-word.is-hidden { filter: blur(12px); cursor: pointer; }
    .sk-word.is-hidden.is-peek { filter: none; }
    .sk-foul { display: flex; align-items: center; gap: 5px; margin: 0; font-size: 13px; font-weight: 800; color: #b91c1c; }
    .sk-card__side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .sk-card.is-draw .sk-card__main { flex-basis: 200px; }
    .sk-next { display: inline-flex; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .75); font-size: 12.5px; font-weight: 900; color: #0f766e; white-space: nowrap; }
    .sk-card.is-draw .sk-next { color: #92400e; }
    .sk-hide { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 0 12px; border: 1.5px solid rgba(146, 64, 14, .25); border-radius: 999px; background: rgba(255, 255, 255, .7); color: #92400e; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .sk-hide[aria-pressed="true"] { background: #92400e; border-color: #92400e; color: #fff; }
    .sk-peek { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .55); font-size: 12.5px; font-weight: 700; color: #92400e; white-space: nowrap; }
    .sk-peek b { font-weight: 900; font-variant-numeric: tabular-nums; }
    .sk-peek.is-open { background: #92400e; color: #fff; }
    .sk-peek.is-open b { letter-spacing: .08em; }
    .sk-tiles { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0 2px; }
    .sk-tile { display: grid; place-items: center; width: 46px; height: 52px; border-radius: 12px; background: linear-gradient(180deg, #f0fdfa, #ccfbf1); box-shadow: inset 0 -4px 0 #5eead4; color: #0f766e; font-size: 26px; font-weight: 900; }
    .sk-tile.is-q { color: rgba(15, 118, 110, .28); }
    .sk-tiles.is-reveal .sk-tile { animation: sk-tile .5s cubic-bezier(.2, .8, .25, 1) both; animation-delay: calc(var(--i) * 80ms); }
    @keyframes sk-tile { 0% { transform: rotateY(90deg); } 100% { transform: none; } }
    .sk-hintbar { flex: 1 1 160px; min-width: 140px; }
    .sk-hintbar i { display: block; height: 6px; overflow: hidden; border-radius: 99px; background: #ccfbf1; }
    .sk-hintbar i span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #14b8a6, #f59e0b); transform-origin: left center; transition: transform .25s linear; }
    .sk-hintbar small { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 800; color: #0f766e; }
    .sk-hintbar.is-open small { color: #b45309; }

    /* ── 화이트보드(은색 틀 · 받침대) ── */
    .sk-boardwrap { margin-top: 12px; }
    .sk-frame { position: relative; width: var(--fw); margin: 0 auto; padding: 9px; border-radius: 14px;
      background: linear-gradient(145deg, #f8fafc 0%, #cbd5e1 40%, #94a3b8 100%); box-shadow: 0 10px 26px rgba(15, 23, 42, .18), inset 0 1px 0 #fff; }
    .sk-board { position: relative; overflow: hidden; aspect-ratio: 4 / 3; border-radius: 6px; background: #ffffff; box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .08), inset 0 2px 8px rgba(15, 23, 42, .06); overscroll-behavior: contain; outline: none; }
    .sk-board:focus-visible { box-shadow: inset 0 0 0 2px #99f6e4; }
    .sk-cv, .sk-ghost { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .sk-cv { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .sk-stage.is-draw .sk-cv { touch-action: none; cursor: crosshair; }
    .sk-stage.is-draw.is-locked .sk-cv { cursor: not-allowed; }
    .sk-ghost { pointer-events: none; z-index: 2; }
    .sk-ghost[hidden] { display: none; }
    .sk-ghost.is-wipe { animation: sk-wipe .45s ease-in both; animation-delay: var(--wd, 1200ms); }
    @keyframes sk-wipe { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }
    .sk-eraser { position: absolute; z-index: 4; top: 50%; left: 0; width: 64px; height: 90px; margin: -45px 0 0 -32px; pointer-events: none; opacity: 0; }
    .sk-eraser.is-on { animation: sk-eraser .45s ease-in both; animation-delay: var(--wd, 1200ms); }
    @keyframes sk-eraser { 0% { opacity: 0; left: 0; } 8%, 90% { opacity: 1; } 100% { opacity: 0; left: 100%; } }
    .sk-pen { position: absolute; z-index: 3; left: 0; top: 0; width: 34px; height: 34px; margin: -31px 0 0 -3px; pointer-events: none; opacity: 0; transition: opacity .4s ease; filter: drop-shadow(0 2px 2px rgba(15, 23, 42, .3)); }
    .sk-pen.is-on { opacity: 1; transition: opacity .1s ease; }
    .sk-react { position: absolute; z-index: 5; top: 10px; left: 50%; max-width: 86%; padding: 8px 16px; border-radius: 18px; background: #134e4a; color: #fff; font-size: 16px; font-weight: 900; line-height: 1.35; text-align: center; word-break: keep-all; transform: translateX(-50%); box-shadow: 0 6px 16px rgba(15, 23, 42, .25); pointer-events: none; }
    .sk-react::after { content: ""; position: absolute; bottom: -8px; left: 22px; border: 9px solid transparent; border-top-color: #134e4a; border-bottom: 0; }
    .sk-react.is-mine { background: #fde047; color: #713f12; }
    .sk-react.is-mine::after { left: auto; right: 22px; border-top-color: #fde047; }
    .sk-react small { display: block; font-size: 11px; font-weight: 800; opacity: .75; }
    .sk-react.is-new { animation: sk-pop .38s cubic-bezier(.2, .9, .3, 1.3) both; }
    .sk-react[hidden] { display: none; }
    @keyframes sk-pop { from { opacity: 0; transform: translateX(-50%) scale(.6); } }
    .sk-empty-hint { position: absolute; z-index: 1; inset: 0; display: grid; place-items: center; padding: 20px; pointer-events: none; text-align: center; color: #94a3b8; font-size: 15px; font-weight: 700; line-height: 1.6; word-break: keep-all; }
    .sk-empty-hint[hidden] { display: none; }
    .sk-empty-hint b { display: block; font-size: 30px; }

    /* 낱말이 바뀔 때 — 정답 · 넘김 덮개 */
    .sk-fx { position: absolute; z-index: 6; inset: 0; display: grid; place-items: center; align-content: center; gap: 8px; padding: 16px; text-align: center; pointer-events: none; opacity: 0; }
    .sk-fx.is-on { animation: sk-fx var(--fxs, 1200ms) ease both; }
    @keyframes sk-fx { 0% { opacity: 0; } 10%, 82% { opacity: 1; } 100% { opacity: 0; } }
    .sk-fx.is-ok { background: rgba(22, 163, 74, .86); }
    .sk-fx.is-pass { background: rgba(71, 85, 105, .84); }
    .sk-fx b { display: block; font-size: 40px; font-weight: 900; line-height: 1.1; color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .18); word-break: keep-all; }
    .sk-fx.is-on b { animation: sk-big .5s cubic-bezier(.2, .9, .3, 1.3) both; }
    @keyframes sk-big { from { transform: scale(.5); } }
    .sk-fx span { display: inline-block; padding: 5px 14px; border-radius: 999px; background: #fff; color: #14532d; font-size: 18px; font-weight: 900; word-break: keep-all; }
    .sk-fx.is-pass span { color: #334155; }
    .sk-fx em { display: inline-block; padding: 4px 12px; border-radius: 999px; background: linear-gradient(90deg, #f97316, #facc15); color: #451a03; font-size: 16px; font-style: normal; font-weight: 900; }
    .sk-fx i { position: absolute; left: 50%; top: 45%; width: 9px; height: 14px; border-radius: 2px; background: var(--c); animation: sk-conf 1s cubic-bezier(.15, .7, .3, 1) both; }
    @keyframes sk-conf { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
    .sk-fly { position: fixed; z-index: 80; padding: 4px 12px; border-radius: 999px; background: #fde047; color: #713f12; font-size: 20px; font-weight: 900; pointer-events: none; box-shadow: 0 6px 14px rgba(0, 0, 0, .2); }

    /* 받침대 — 놓인 마커가 곧 색 고르기 */
    .sk-ledge { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin: 0 6px; padding: 0 10px; min-height: 18px; border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, #94a3b8, #64748b); box-shadow: 0 6px 12px rgba(15, 23, 42, .18), inset 0 2px 0 rgba(255, 255, 255, .35); }
    .sk-tools > .sk-ledge { width: calc(var(--fw) - 12px); box-sizing: border-box; margin: 0 auto; }
    .sk-ledge.is-deco { width: min(60%, 320px); margin: 0 auto; gap: 10px; }
    .sk-mk { position: relative; display: grid; place-items: end center; width: 52px; height: 46px; padding: 0 0 6px; border: 0; background: none; cursor: pointer; transition: transform .15s ease; }
    .sk-mk svg { display: block; width: 50px; height: 18px; filter: drop-shadow(0 2px 1px rgba(15, 23, 42, .3)); }
    .sk-mk[aria-pressed="true"] { transform: translateY(-6px); }
    .sk-mk[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #0f766e; }
    .sk-mk:focus-visible { outline: 3px solid #14b8a6; outline-offset: -2px; border-radius: 10px; }
    .sk-ledge.is-deco svg { width: 40px; height: 14px; margin-bottom: 4px; }

    /* 도구 줄 */
    .sk-tools { margin-top: 10px; }
    .sk-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .sk-widths { position: relative; display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px #99f6e4; }
    .sk-widths .sk-wcur { display: none; }
    .sk-wlist { display: flex; gap: 2px; }
    .sk-w { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
    .sk-w i { display: block; border-radius: 50%; background: #134e4a; }
    .sk-w[aria-pressed="true"] { background: #ccfbf1; box-shadow: inset 0 0 0 2px #0d9488; }
    .sk-tool { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1.5px solid #99f6e4; border-radius: 999px; background: #fff; color: #134e4a; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: background .15s ease, border-color .15s ease; }
    .sk-tool:hover:not(:disabled) { border-color: #14b8a6; background: #f0fdfa; }
    .sk-tool:disabled { opacity: .45; cursor: default; }
    .sk-tool.is-arm { border-color: #dc2626; background: #fef2f2; color: #b91c1c; }
    .sk-tool .sk-ico { flex-shrink: 0; }
    .sk-lab-m { display: none; }
    .sk-pass { position: relative; isolation: isolate; border-color: transparent; background: #0f766e; color: #fff; box-shadow: 0 3px 0 #134e4a; }
    .sk-pass::before { content: ""; position: absolute; inset: -4px; z-index: -1; border-radius: 999px; background: conic-gradient(#f59e0b calc(var(--p, 1) * 360deg), rgba(15, 118, 110, .18) 0); }
    .sk-pass::after { content: ""; position: absolute; inset: -1.5px; z-index: -1; border-radius: 999px; background: inherit; }
    .sk-pass:hover:not(:disabled) { background: #115e59; }
    .sk-pass:disabled { opacity: 1; background: #5f9e98; box-shadow: none; }
    .sk-pass.is-shake, .sk-shake { animation: sk-shake .45s ease; }
    @keyframes sk-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .sk-passnote { flex-basis: 100%; margin: 0; text-align: center; font-size: 12px; font-weight: 700; color: #0f766e; }
    .sk-ink { display: flex; align-items: center; gap: 8px; max-width: 420px; margin: 8px auto 0; font-size: 12px; font-weight: 800; color: #0f766e; }
    .sk-ink i { flex: 1; height: 6px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, .8); }
    .sk-ink i span { display: block; height: 100%; border-radius: inherit; background: #14b8a6; }
    .sk-ink.is-hot { color: #c2410c; }
    .sk-ink.is-hot i span { background: #f97316; }

    /* 답 입력(맞히는 사람) — 노드 하나를 다시 끼워 쓴다(휴대폰 자판이 닫히지 않게) */
    .sk-gslot { margin-top: 12px; }
    .sk-gform { position: relative; z-index: 4; margin: 0; }
    .sk-grow { display: flex; gap: 8px; }
    .sk-gin { flex: 1; min-width: 0; height: 54px; box-sizing: border-box; padding: 0 14px; border: 2px solid #5eead4; border-radius: 15px; background: #fff; color: #134e4a; font: inherit; font-size: 18px; font-weight: 800; }
    .sk-gin::placeholder { color: #94a3b8; font-weight: 600; font-size: 15px; }
    .sk-gin:focus { outline: none; border-color: #0d9488; box-shadow: 0 0 0 4px rgba(20, 184, 166, .2); }
    .sk-gin:disabled { background: #f1f5f9; border-color: #cbd5e1; }
    .sk-ggo { flex-shrink: 0; min-width: 92px; height: 54px; padding: 0 16px; border: 0; border-radius: 15px; background: #0f766e; color: #fff; font: inherit; font-size: 16.5px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #134e4a; }
    .sk-ggo:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #134e4a; }
    .sk-ggo:disabled { background: #94a3b8; box-shadow: none; cursor: default; }
    .sk-gnote { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; margin-top: 6px; padding: 0 4px; font-size: 12.5px; font-weight: 700; color: #0f766e; }
    .sk-gnote > span { min-width: 0; word-break: keep-all; }
    .sk-gform.is-bad .sk-gnote > span { color: #dc2626; font-weight: 800; }
    .sk-gform.is-good .sk-gnote > span { color: #15803d; font-weight: 900; }
    .sk-gform.is-shake .sk-grow { animation: sk-shake .45s ease; }
    .sk-tries { display: inline-flex; flex-shrink: 0; align-items: center; gap: 3px; }
    .sk-tries i { width: 7px; height: 7px; border-radius: 50%; background: #14b8a6; }
    .sk-tries i.is-off { background: #cbd5e1; }
    .sk-tries.is-low i:not(.is-off) { background: #f97316; }

    /* 답 칩 · 반응 버튼 */
    .sk-answers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; min-height: 32px; }
    .sk-answers > small { font-size: 12.5px; font-weight: 800; color: #0f766e; }
    .sk-answers .sk-left { margin-left: auto; font-size: 12px; font-weight: 700; color: #0f766e; }
    .sk-a { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; background: #e2e8f0; color: #64748b; font-size: 14px; font-weight: 700; text-decoration: line-through; text-decoration-color: rgba(100, 116, 139, .6); }
    .sk-gs .sk-a { background: #fee2e2; color: #991b1b; text-decoration-color: rgba(153, 27, 27, .45); }
    .sk-a.is-near, .sk-gs .sk-a.is-near { background: #ffedd5; color: #9a3412; text-decoration: none; }
    .sk-a.is-near em { padding: 1px 6px; border-radius: 999px; background: #f97316; color: #fff; font-size: 11px; font-style: normal; font-weight: 900; }
    .sk-a.is-ok, .sk-gs .sk-a.is-ok { background: #dcfce7; color: #166534; text-decoration: none; }
    .sk-a.is-new { animation: sk-chip .4s cubic-bezier(.2, .9, .3, 1.3) both; }
    .sk-gs .sk-a.is-new:not(.is-near):not(.is-ok) { animation: sk-chip .4s cubic-bezier(.2, .9, .3, 1.3) both, sk-shake .45s .4s ease; }

  <div id="app"></div>
  <script>
    // 화이트보드 그림 퀴즈 — 2인 협동(협동 시리즈 번외 2화). 한 사람이 제시어를 화이트보드에 그리고, 다른 사람이 그림을 보고 맞힌다.

    // 방 공용(목록 · 대기실 · 끝 화면 · 실시간)은 /_shared/coop.js, 이야기는 /_shared/coop-story.js.

    // 그림 조각이 올 때마다 화면을 통째로 다시 그리면 캔버스가 새로 만들어지고(그리던 획이 끊김) 답 입력 칸이 다시 만들어져
    // 휴대폰 자판이 닫힌다. 그래서 ① 캔버스 · 답 입력 칸은 노드 하나를 계속 쓰며 자리(#sk-slot · #sk-gslot)에 다시 끼우고,
    // ② 같은 낱말 안의 소식은 coop.js 의 patch 훅으로 바뀐 칸만 고친다(낱말이 바뀔 때만 통째로 다시 그린다).

    const { esc } = HKMatch;
    const S = window.HKCoopStory || null;

    const GAP = 250; // 그림 조각 사이 최소 간격(ms) — 펜이 빨라도 초당 4조각 이하, 대신 한 조각에 점을 더 싣는다
    const MIN_STEP = 4; // 바로 앞 점과 이만큼(좌표 단위)도 안 떨어진 점은 버린다(서버는 3)

    const CATS = [
      { key: "all", name: "전체", ico: "🎲" },
      { key: "office", name: "사무실 물건", ico: "📎" },

    ];
    const DEF_PAL = ["#1f2937", "#dc2626", "#2563eb", "#16a34a", "#f59e0b", "#92400e", "#ffffff"];
    const DEF_PALN = ["검정", "빨강", "파랑", "초록", "주황", "갈색", "지우개"];
    const DEF_W = [4, 9, 18, 36];
    const W_NAMES = ["가늘게", "보통", "굵게", "아주 굵게"];
    const ERASER = 6;
    const PLAYED_KEY = "hk-sketch-played", HIDE_KEY = "hk-sketch-hide", TOOL_KEY = "hk-sketch-tool";
    const reduce = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) { return false; } };
    const phone = () => { try { return matchMedia("(max-width: 640px)").matches; } catch (_) { return false; } };
    const wideMq = window.matchMedia ? matchMedia("(min-width: 861px)") : null; // 옆 칸이 보드 옆에 서는 화면(app.css .er-grid 와 같은 기준)
    const wide = () => !!(wideMq && wideMq.matches);
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* 기억 못 해도 그만 */ } },
    };

    let C = null, room = null, w = null, offset = 0, tickFor = null, lastBeep = null;
    let howOpen = !store.get(PLAYED_KEY, 0); // 처음이면 「이렇게 해요」를 펼쳐 둔다
    let pastOpen = null; // 옆 칸 「지나간 낱말」 펼침 — 처음엔 넓은 화면만 펼친다
    let hideWord = !!store.get(HIDE_KEY, 0);
    const tool = Object.assign({ c: 0, w: 1, pw: 1 }, store.get(TOOL_KEY, {}));
    document.addEventListener("toggle", (e) => {
      const t = e.target;
      if (!t.classList) return;
      if (t.classList.contains("sk-how")) howOpen = t.open;
      if (t.classList.contains("sk-past")) pastOpen = t.open;
    }, true);
    const now = () => (Date.now() + offset) / 1000;
    const mate = () => (room && room.partner && room.partner.name) || "동료";
    const sfx = (name) => { if (C) C.sfx(name); };
    const pal = () => (w && w.pal) || DEF_PAL;
    const palNames = () => (w && w.palNames) || DEF_PALN;
    const widths = () => (w && w.widths) || DEF_W;
    const face = () => (S ? S.npcFace(MA) : "");
    const cnt = (s) => (s.p.length / 2) | 0;
    const drawing = () => !!(w && room && room.status === "PLAYING" && w.role === "draw");

    // ── 캔버스 — 노드 하나를 계속 쓴다(비트맵이 남아 깜빡이지 않게) ─────────────────
    const cv = document.createElement("canvas");
    cv.className = "sk-cv";
    cv.setAttribute("role", "img"); // 보드 칸(group) 안의 말풍선 · 덮개(aria-live)가 읽히도록 그림 역할은 캔버스에만 준다
    const g2 = cv.getContext("2d");
    const ghost = document.createElement("canvas"); // 낱말이 바뀔 때 지난 그림을 잠깐 남겨 두고 지우개로 쓱
    ghost.className = "sk-ghost";
    ghost.hidden = true;
    const eraserEl = document.createElement("div");
    eraserEl.className = "sk-eraser";
    eraserEl.setAttribute("aria-hidden", "true");
    eraserEl.innerHTML = `<svg viewBox="0 0 64 90"><rect x="8" y="6" width="48" height="78" rx="8" fill="#0f766e"/><rect x="8" y="58" width="48" height="26" rx="6" fill="#e2e8f0"/><rect x="14" y="14" width="36" height="8" rx="4" fill="#5eead4"/></svg>`;
    const penEl = document.createElement("div"); // 맞히는 사람 화면 — 상대가 지금 그리는 곳에 마커
    penEl.className = "sk-pen";
    penEl.setAttribute("aria-hidden", "true");
    const fxEl = document.createElement("div");
    fxEl.className = "sk-fx";
    fxEl.setAttribute("aria-live", "polite");
    let cw = 0, ch = 0, dpr = 1;

    function fit() {
      const host = cv.parentNode;
      if (!host) return false;
      const width = Math.round(host.getBoundingClientRect().width);
      if (!width) return false;
      const d = Math.min(window.devicePixelRatio || 1, 2.5);
      const height = Math.round((width * 3) / 4);
      if (width === cw && height === ch && d === dpr && cv.width === Math.round(width * d)) return false;
      cw = width; ch = height; dpr = d;
      cv.width = Math.round(width * d); cv.height = Math.round(height * d);
      return true;
    }
    // 좌표는 0~1000(가로) · 0~1000(세로) — 세로는 3/4 로 줄여 같은 배율(굵기가 일그러지지 않게)로 그린다
    function setT(ctx = g2, width = cw, ratio = dpr) { const s = (ratio * width) / 1000; ctx.setTransform(s, 0, 0, s, 0, 0); }
    function wipe(ctx = g2, canvas = cv) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    // 획 하나의 점 [from, to) 를 그린다 — 이웃한 두 점의 가운데를 잇는 2차 곡선. 이미 from 개를 그렸으면 그 뒤만 잇는다
    function paintStroke(s, from, to, ctx = g2, minW = 0) {
      if (to <= from || to < 1) return;
      const p = s.p, Y = 0.75, colors = pal(), ws = widths();
      const X = (i) => p[i * 2], YY = (i) => p[i * 2 + 1] * Y;
      const lw = Math.max(ws[s.w] != null ? ws[s.w] : ws[1], minW);
      ctx.strokeStyle = ctx.fillStyle = colors[s.c] || colors[0];
      ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (to === 1) { ctx.beginPath(); ctx.arc(X(0), YY(0), lw / 2, 0, Math.PI * 2); ctx.fill(); return; }
      ctx.beginPath();
      let start;
      if (from <= 1) { ctx.moveTo(X(0), YY(0)); ctx.lineTo((X(0) + X(1)) / 2, (YY(0) + YY(1)) / 2); start = 1; }
      else { start = from - 1; ctx.moveTo((X(start - 1) + X(start)) / 2, (YY(start - 1) + YY(start)) / 2); }
      for (let i = start; i < to - 1; i++) ctx.quadraticCurveTo(X(i), YY(i), (X(i) + X(i + 1)) / 2, (YY(i) + YY(i + 1)) / 2);
      ctx.lineTo(X(to - 1), YY(to - 1));
      ctx.stroke();
    }

    // ── 그리는 사람 — 내 모델(서버가 받은 획 + 아직 안 보낸 점) · 대기열 ─────────────────
    // 획 = { kind: "stroke", i, n, c, w, p: [x, y, …], sent(보낸 점 수), seq(다음 조각 번호), done(펜을 뗌), drawn(캔버스에 그린 점 수) }
    let mine = [];
    let ops = []; // 획(위 객체 그대로) · { kind: "undo", s } · { kind: "clear" } — 한 번에 하나씩 차례대로 보낸다
    let inflight = false, lastSent = 0, pumpTimer = 0, nextId = 0, penLock = false, retryN = 0;
    let awaitRoom = false; // 방을 다시 받는 중(C.refresh) — 받기 전에는 서버 그림으로 맞추지 않는다
    let active = null; // 지금 그리는 획 { s, id: pointerId }
    let clearArm = 0, wOpen = false, passBusy = false, passShake = 0;

    const localPts = () => mine.reduce((a, s) => a + cnt(s), 0);
    function syncId() { if (w) nextId = Math.max(nextId, w.lastId || 0); }
    function drawMine() { wipe(); setT(); for (const s of mine) { paintStroke(s, 0, cnt(s)); s.drawn = cnt(s); } }
    function fromServer() {
      mine = (w ? w.strokes : []).map((s) => ({ kind: "stroke", i: s.i, n: w.n, c: s.c, w: s.w, p: s.p.slice(), sent: s.p.length / 2, seq: 1e6, done: true, drawn: 0 }));
      if (cv.parentNode) drawMine();
    }
    function resetDraw() {
      mine = []; ops = []; active = null; penLock = false; clearArm = 0; retryN = 0;
      clearTimeout(pumpTimer); pumpTimer = 0;
    }
    function removeOp(op) { const i = ops.indexOf(op); if (i >= 0) ops.splice(i, 1); }
    function finishOp(op, take) {
      if (op.kind === "stroke") {
        op.sent += take; op.seq += 1; op.fix = 0;
        if (op.done && op.sent >= cnt(op)) removeOp(op);
      } else removeOp(op);
    }
    // 응답 받은 방으로 — 이미 더 새 방을 받았으면 버린다(응답 순서가 엇갈릴 때)
    function accept(next) {
      if (!next || !next.id || !C || !C.room || C.room.id !== next.id) return; // 그사이 다른 방으로 갔으면 버린다
      if (Number(next.seq) < Number(C.room.seq)) return;
      C.set(next);
      if (next.stamp && next.stamp.new) HKUI.toast(`오늘 도장을 받았어요 (${next.stamp.count}/${next.stamp.goal})`);
    }

    async function pump() {
      clearTimeout(pumpTimer); pumpTimer = 0;
      if (inflight || !ops.length || !room || !w || room.status !== "PLAYING") return;
      const wait = lastSent + GAP - Date.now();
      if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
      const op = ops[0];
      let action, arg = null, take = 0;
      if (op.kind === "stroke") {
        const have = cnt(op);
        if (op.sent >= have) { if (op.done) { ops.shift(); pump(); } return; } // 새 점이 오면 pointermove 가 다시 부른다
        // 응답이 끊겨 다시 보낼 때는 꼭 같은 조각(같은 점 수)으로 — 서버가 이미 받았으면 SKETCH_STALE 로 그대로 넘어가게
        take = op.fix ? Math.min(op.fix, have - op.sent) : Math.min(have - op.sent, (w && w.chunkMax) || 80);
        const pts = [];
        for (let i = op.sent; i < op.sent + take; i++) pts.push([op.p[i * 2], op.p[i * 2 + 1]]);
        action = "stroke";
        arg = { id: op.i, seq: op.seq, n: op.n, c: op.c, w: op.w, pts };
      } else if (op.kind === "undo") {
        if (op.s && !op.s.sent) { ops.shift(); pump(); return; } // 서버에 닿지 못한 획 — 되돌릴 것도 없다
        action = "undo";
      } else action = op.kind;
      inflight = true;
      lastSent = Date.now();
      op.flying = take; // 날아가는 중인 점 수 — 그사이 되돌리기를 눌러도 이 점까지는 남겨 둔다(같은 조각을 다시 보낼 수 있게)
      const id = room.id;
      const refetch = () => { awaitRoom = true; if (C) C.refresh(); };
      try {
        const next = await HKApi.coopAct(id, action, arg);
        retryN = 0;
        finishOp(op, take);
        accept(next);
      } catch (e) {
        const code = e && e.code;
        if (code === "ESCAPE_TOO_FAST") lastSent = Date.now() - GAP + 150; // 150ms 뒤 같은 조각을 다시(거절된 조각은 저장되지 않았다)
        else if (code === "SKETCH_STALE") finishOp(op, take); // 이미 받았거나 지난 조각 — 받은 것으로 친다
        else if (code === "SKETCH_RESYNC") await resync();
        else if (code === "SKETCH_FULL") {
          ops = ops.filter((o) => o.kind !== "stroke");
          if (active) active = null;
          penLock = true;
          fromServer();
          HKUI.toast(e.message || "그림이 너무 복잡해요. 조금 지우고 이어 그려 주세요.", "error");
          syncTools(true);
        } else if (code === "SKETCH_EMPTY") { removeOp(op); syncTools(true); }
        else if (["SKETCH_NOT_DRAWER", "ESCAPE_NOT_PLAYING", "WORDS_NOT_YOUR_TURN"].includes(code)) { ops = []; refetch(); }
        else if (code === "SKETCH_BAD_STROKE") { console.warn("sketch: 받지 않은 그림 조각", arg); if (op.kind === "stroke") { op.sent = cnt(op); op.done = true; } removeOp(op); }
        else if (op.kind === "undo" && (!e || !e.status || e.status >= 500)) { // 되돌리기는 두 번 하면 안 된다 — 다시 받아 맞춘다
          removeOp(op); refetch();
        } else if (!e || !e.status || e.status >= 500) { // 연결이 끊김 — 순서를 지키려고 같은 조각을 조금 뒤에 다시
          if (op.kind === "stroke") op.fix = take;
          retryN += 1;
          if (retryN > 8) { ops = []; retryN = 0; HKUI.toast("그림을 보내지 못했어요. 연결을 확인해 주세요.", "error"); refetch(); }
          else lastSent = Date.now() + Math.min(3000, 300 * retryN) - GAP;
        } else { removeOp(op); HKUI.toast(e.message || "지금은 할 수 없어요.", "error"); }
      } finally {
        inflight = false;
        op.flying = 0;
        pump();
        reconcile(); // 보낼 것이 다 끝났으면 서버 그림과 맞춰 본다(응답이 끊긴 채 저장된 획 등)
      }
    }
    // 새 획 번호가 뒤처졌다(다른 창 등) — 방을 다시 받아 lastId 로 맞추고, 아직 안 보낸 획은 새 번호로 처음부터 보낸다
    async function resync() {
      if (!room) return;
      try {
        const fresh = await HKApi.coopDetail(room.id);
        const v = fresh && fresh.sketch;
        if (!v || !w || v.n !== w.n) { ops = []; accept(fresh); return; }
        nextId = Math.max(0, v.lastId || 0);
        ops = ops.filter((o) => o.kind !== "stroke" || mine.includes(o));
        for (const o of ops) if (o.kind === "stroke" && o.sent === 0) { o.i = ++nextId; o.seq = 0; o.fix = 0; }
        accept(fresh);
      } catch (_) { lastSent = Date.now() + 600; }
    }

    // ── 펜 입력 ──
    function toPt(e) {
      const r = cv.getBoundingClientRect();
      const x = Math.round(((e.clientX - r.left) / r.width) * 1000), y = Math.round(((e.clientY - r.top) / r.height) * 1000);
      return [Math.max(0, Math.min(1000, x)), Math.max(0, Math.min(1000, y))];
    }
    function full() { return mine.length >= ((w && w.strokesMax) || 200) || localPts() >= ((w && w.ptsMax) || 4000); }
    function canPen() { return drawing() && !penLock && !(fx && performance.now() < fx.until); }
    function down(e) {
      if (!drawing()) return;
      if (active) return; // 두 번째 손가락(핀치)은 무시
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      const board = cv.parentNode;
      if (board && board.focus) board.focus({ preventScroll: true });
      if (!canPen()) {
        if (penLock) HKUI.toast("그림이 너무 복잡해요. 조금 지우고 이어 그려 주세요.", "error");
        return;
      }
      if (full()) { penLock = true; syncTools(true); HKUI.toast("그림이 너무 복잡해요. 조금 지우고 이어 그려 주세요.", "error"); return; }
      syncId();
      const [x, y] = toPt(e);
      const s = { kind: "stroke", i: ++nextId, n: w.n, c: tool.c, w: tool.w, p: [x, y], sent: 0, seq: 0, done: false, drawn: 0 };
      mine.push(s);
      ops.push(s);
      active = { s, id: e.pointerId };
      try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 캡처 못 해도 그린다 */ }
      setT();
      paintStroke(s, 0, 1);
      s.drawn = 1;
      emptyHint();
      pump();
    }
    function move(e) {
      if (!active || e.pointerId !== active.id) return;
      const s = active.s;
      const list = typeof e.getCoalescedEvents === "function" ? e.getCoalescedEvents() : [];
      const evs = list && list.length ? list : [e];
      const max = (w && w.ptsMax) || 4000;
      let total = localPts();
      for (const ev of evs) {
        if (total >= max) break;
        const [x, y] = toPt(ev);
        const lx = s.p[s.p.length - 2], ly = s.p[s.p.length - 1];
        if ((x - lx) ** 2 + (y - ly) ** 2 < MIN_STEP * MIN_STEP) continue;
        s.p.push(x, y);
        total += 1;
      }
      const have = cnt(s);
      if (have > s.drawn) { setT(); paintStroke(s, s.drawn, have); s.drawn = have; pump(); syncInkBar(); }
    }
    function up(e) {
      if (!active || (e && e.pointerId !== active.id)) return;
      active.s.done = true;
      active = null;
      syncTools();
      pump();
    }
    cv.addEventListener("pointerdown", down);
    cv.addEventListener("pointermove", move);
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    cv.addEventListener("lostpointercapture", up); // 그리다가 화면이 통째로 다시 그려지면 — 모은 점은 마저 보내고 그 획을 끝낸다
    cv.addEventListener("contextmenu", (e) => { if (drawing()) e.preventDefault(); });

    function undo() {
      if (!drawing()) return;
      if (active) up();
      const s = mine.pop();
      if (!s) return;
      const qi = ops.indexOf(s);
      const flying = inflight && qi === 0; // 이 획의 조각이 지금 날아가는 중
      if (qi >= 0 && s.sent === 0 && !flying) ops.splice(qi, 1); // 아직 하나도 안 보낸 획 — 대기열에서 빼면 끝
      else {
        // 남은 점은 보내지 않는다. 날아가는 조각의 점은 남겨 둔다 — 응답이 끊겨도 같은 조각을 다시 보내 서버와 맞춘 뒤 되돌린다
        if (qi >= 0) { s.p.length = Math.min(s.p.length, (s.sent + (flying ? s.flying || 0 : 0)) * 2); s.done = true; }
        ops.push({ kind: "undo", s });
      }
      penLock = false;
      drawMine();
      sfx("tap");
      syncTools(true);
      emptyHint();
      pump();
    }
    function clearAll() {
      if (!drawing()) return;
      if (active) up();
      const anySent = (w && w.strokes.length > 0) || mine.some((s) => s.sent > 0) || inflight;
      for (const s of mine) {
        const qi = ops.indexOf(s);
        if (qi < 0) continue;
        if (s.sent === 0 && !(inflight && qi === 0)) ops.splice(qi, 1);
        else { s.p.length = Math.min(s.p.length, s.sent * 2); s.done = true; }
      }
      mine = [];
      ops = ops.filter((o) => o.kind !== "undo");
      if (anySent) ops.push({ kind: "clear" });
      clearArm = 0; penLock = false;
      drawMine();
      sfx("drop");
      syncTools(true);
      emptyHint();
      pump();
    }
    async function pass() {
      if (!drawing() || passBusy) return;
      if (now() < w.passAt) { passShake = Date.now(); syncTools(true); return; }
      passBusy = true;
      try {
        const next = await HKApi.coopAct(room.id, "pass", null);
        ops = []; active = null;
        accept(next);
      } catch (e) {
        if (e.code === "ESCAPE_TOO_FAST") { passShake = Date.now(); syncTools(true); }
        else if (["SKETCH_NOT_DRAWER", "ESCAPE_NOT_PLAYING"].includes(e.code)) C.refresh();
        else HKUI.toast(e.message || "넘기지 못했어요", "error");
      } finally { passBusy = false; }
    }
    function pick(c) {
      if (c === tool.c) return;
      if (c === ERASER) { if (tool.c !== ERASER) tool.pw = tool.w; tool.w = 3; } // 지우개는 굵게
      else if (tool.c === ERASER) tool.w = tool.pw != null ? tool.pw : 1;
      tool.c = c;
      store.set(TOOL_KEY, tool);
      sfx("select");
      syncTools(true);
    }
    function pickW(i) { tool.w = i; if (tool.c !== ERASER) tool.pw = i; wOpen = false; store.set(TOOL_KEY, tool); sfx("select"); syncTools(true); }

    // ── 맞히는 사람 — 받은 획을 조금씩 이어 그린다 ─────────────────
    const ink = { n: -1, ink: -1, ids: [], cnt: [], list: [], end: 0, raf: 0, penT: 0 };
    function inkFull() {
      if (!w || !cv.parentNode) return;
      wipe(); setT();
      for (const s of w.strokes) paintStroke(s, 0, cnt(s));
      ink.n = w.n; ink.ink = w.ink; ink.list = w.strokes;
      ink.ids = w.strokes.map((s) => s.i); ink.cnt = w.strokes.map(cnt);
    }
    function inkSync() {
      if (!w || !cv.parentNode) return;
      if (ink.n === w.n && ink.ink === w.ink) return; // 그림 버전이 같으면 다시 그리지 않는다
      const list = w.strokes;
      const prefix = ink.n === w.n && ink.ids.length <= list.length && ink.ids.every((id, i) => list[i].i === id && cnt(list[i]) >= ink.cnt[i]);
      if (!prefix) { inkFull(); return; } // 되돌리기 · 지우기 — 처음부터
      ink.ink = w.ink; ink.list = list;
      while (ink.ids.length < list.length) { ink.ids.push(list[ink.ids.length].i); ink.cnt.push(0); }

    // ── 바뀐 칸만 고치기(patch) ─────────────────
    const sig = {};

      if (d.color != null) return `[data-color="${d.color}"]`;
      if (d.width != null) return `[data-width="${d.width}"]`;
      const k = ["wtoggle", "undo", "clear", "pass"].find((x) => x in d);
      return k ? `[data-${k}]` : null;
    }
    function syncTools(force) {

      const key = [tool.c, tool.w, wOpen, mine.length > 0, (w.strokes || []).length > 0, clearArm > Date.now(), now() >= w.passAt, penLock, k.show, k.hot, passShake > Date.now() - 500].join("|");
      if (force || sig["sk-tools"] !== key) {
        sig["sk-tools"] = key;
        const fk = toolKey(document.activeElement, el);
        el.innerHTML = toolsHtml();
        if (fk) { // 누른 단추가 새로 만들어져도 초점을 그 자리에 — 키보드 · 단축키가 끊기지 않게

    const syncInkBar = () => syncTools();

    let reactShown = null;

    // ── 답 입력(맞히는 사람) — 노드 하나를 계속 쓴다 ─────────────────
    const gform = document.createElement("form");

    ggo.addEventListener("mousedown", (e) => e.preventDefault()); // 단추를 눌러도 입력 칸 초점(휴대폰 자판)이 그대로
    let composing = false, pendingSend = false, noteUntil = 0, noteKind = "", noteText = "", gN = null, outOfTries = false;

    async function submitGuess() {
      if (!w || !room || room.status !== "PLAYING" || w.role !== "guess") return;
      const text = gin.value.trim();

      if (w.triesLeft <= 0) { shakeForm(); sfx("invalid"); return; }
      gin.value = "";
      try {
        const next = await HKApi.coopAct(room.id, "guess", text);

      } catch (e) {
        if (!gin.value) gin.value = text; // 못 냈으면 적던 글을 돌려놓는다

        else if (code === "ESCAPE_CHAT_EMPTY") shakeForm();

    // 휴대폰 — 자판이 올라와 입력 줄을 가리면 가린 만큼만 위로(이미 자판 위에 보이면 그대로 둔다)

          ${rows.length ? `<ul class="sk-list">${rows.join("")}</ul>` : `<div class="sk-nolist">이번 판에는 기록이 없어요</div>`}</section>`;

    function drawArt(canvas, a, minPx) {

    // ── 단축키(그리는 사람) — Ctrl/Cmd+Z 되돌리기 · 1~7 색 · [ ] 굵기 ─────────────────

    // ── 바뀐 것 알아채기 — 효과음 · 덮개 ─────────────────
    function onNewWord(pw, nw) {

    // 그리는 사람 — 대기열이 비어 있고 서버 획 목록이 내 모델과 다르면(다른 창 등) 서버 것으로 다시 그린다
    function reconcile() {
      if (!w || !room || room.status !== "PLAYING" || w.role !== "draw" || ops.length || inflight || active || awaitRoom) return;
      const a = mine.map((s) => s.i).join(","), b = w.strokes.map((s) => s.i).join(",");

    }

    // 크기가 바뀌면 지금 획으로 처음부터 다시 그린다
    const ro = window.ResizeObserver ? new ResizeObserver(() => {
      if (!w || !cv.parentNode) return;

    }) : { observe() {}, disconnect() {} };
    const coop = HKCoop.mount({
      room: "sketch",
      listName: "그림 퀴즈 목록",
      heroClass: "is-sketch",
      tickMs: 250,
      // 그림 조각 여러 개를 view 한 번으로 묶어 받는다(상대 그림은 최대 0.2초 늦게). 내가 그리는 동안은 보낸 조각의 응답이
      // 곧 새 방 정보(동료의 답 포함)라서 /wait 를 길게 미룬다 — 조각마다 /wait 를 끊고 다시 걸지 않게
      waitDelay: () => (drawing() && ops.length > 0 ? 900 : 200),
      chatWhilePlaying: false,
      hero: {
        facts: ["2인 협동", "3분", "번갈아 그리기 · 맞히기", "분야 고르기", "끝까지 하면 오늘 도장"],
        note: "그림에 글자·숫자를 쓰면 반칙이에요. 옆자리에서 같이 해도 좋지만, 말로 알려 주기는 금지!",
      },
      rankTitle: "그림 퀴즈 점수 순위",
      rankNote: "같은 두 사람은 가장 높은 한 판만 올라요.",
      rankText: (x) => `${Number(x.score || 0)}점`,
      recentText: (r) => (r.status === "CLEAR" ? [`${Number(r.score || 0)}점`, Number(r.score) > 0 ? "is-clear" : "is-fail"] : ["포기", "is-fail"]),
      failTitle: "그만뒀어요",
      quick: ["준비됐어요!", "그림 실력 기대해요", "천천히 해요", "한 판 더?"],
      remain: () => null, // 위 막대 시계 대신 무대 안의 시계 칩(⏱)을 쓴다 — 보드와 한 화면에 보이게
      timerNote: () => "남은 시간",
      readyNote: (ctx) => (ctx.room.sideName === "먼저 그리기"
        ? "첫 낱말은 <b>내가 그려요</b>. 제시어를 보고 화이트보드에 그림으로만 알려 주세요. 글자·숫자를 쓰면 반칙이에요."
        : "첫 낱말은 <b>내가 맞혀요</b>. 동료의 그림을 보고 정답을 적어 주세요. 40초가 지나면 초성 힌트가 나와요."),
      readyExtra: (ctx) => {
        const cur = (ctx.room.opts && ctx.room.opts.category) || "all";
        return `<div class="sk-pick">
            <div class="sk-pick__head"><b>오늘의 분야</b><small>설정을 바꾸면 둘 다 다시 「준비」를 눌러야 해요.</small></div>
            <div class="sk-pick__row" role="radiogroup" aria-label="분야 고르기">${CATS.map((c) => `<button type="button" class="sk-cat ${c.key === cur ? "is-on" : ""}" data-cat="${c.key}" role="radio" aria-checked="${c.key === cur}"><span aria-hidden="true">${c.ico}</span>${esc(c.name)}</button>`).join("")}</div>
            <p class="sk-promise"><span aria-hidden="true">✋</span>약속 — 그림에 글자·숫자를 쓰면 반칙이에요</p>
          </div>
          <details class="sk-how" ${howOpen ? "open" : ""}><summary>${HKUI.icon("book-open", 17, "currentColor")} 이렇게 해요<small>규칙 · 점수</small></summary>
            <div class="sk-how__in">
              <ol>
                <li>그리는 사람만 <em>제시어</em>를 봐요. 화이트보드에 <em>그림으로만</em> 알려 주세요.</li>
                <li>맞히는 사람은 분야와 글자 수를 보고 답을 적어요. 40초가 지나면 <em>초성 힌트</em>가 나와요.</li>
                <li>답은 낱말마다 10번까지(초성이 나오면 10번 더). 막히면 그리는 사람이 넘길 수 있어요.</li>
                <li>맞히거나 넘기면 다음 낱말로 가고, <em>그리는 사람이 바뀌어요</em>. 게임 중엔 대화창 대신 반응 버튼으로 말해요.</li>
              </ol>
              <div class="sk-points"><span><b>+2</b>정답</span><span><b>+1</b>이어 맞히면</span><span><b>+2</b>4개째부터</span><span><b>0</b>넘겨도 감점 없음</span></div>
            </div>
          </details>`;
      },
      reset: () => {
        tickFor = null; w = null; room = null; lastBeep = null; flipFor = null; tilesFor = null; gN = null; scrolledFor = null;
        resetDraw(); nextId = 0; inflight = false; fx = null; ghost.hidden = true;
        ink.n = -1; ink.ink = -1; ink.ids = []; ink.cnt = [];
        gin.value = ""; chipSeen = { n: -1, t: 0 };
        Object.keys(sig).forEach((k) => delete sig[k]);
      },
      changed: (prev, next, ctx) => {
        C = ctx;
        const pw = w;
        room = next;
        w = next.sketch || null;
        awaitRoom = false;
        if (!w) return;
        offset = w.now * 1000 - Date.now();
        syncId();
        if (next.status === "PLAYING") store.set(PLAYED_KEY, 1);
        if (!pw || !prev || prev.id !== next.id) { // 처음 들어옴(새로 고침 포함) — 서버 그림으로
          resetDraw();
          if (w.role === "draw") fromServer();
          ink.n = -1;
          return;
        }
        if (next.status !== "PLAYING") { resetDraw(); return; }
        if (prev.status !== "PLAYING") { resetDraw(); ink.n = -1; return; }
        if (w.n !== pw.n) { onNewWord(pw, w); ink.n = -1; return; }
        onSameWord(pw, w);
        reconcile();
      },
      // 같은 낱말 안의 소식 — 보드(새 획만) · 답 칩 · 반응 · 점수 · 도구 · 힌트만 고친다. 낱말이 바뀌면 통째로 다시 그린다
      patch: (prev, next) => {
        if (!w || !prev.sketch || !next.sketch || prev.sketch.n !== w.n || !document.getElementById("sk-stage")) return false;
        if (!cv.parentNode || !document.getElementById("sk-slot")) return false;
        if (w.role === "guess") inkSync();
        syncRegions();
        return true;
      },
      play: () => playHtml(),
      side: () => sideHtml(),
      painted: () => {
        if (room && room.status === "READY") { // 대기실 — 고른 분야 칩이 보이게(폰 가로 스크롤)
          const on = document.querySelector(".sk-cat.is-on"), row = on && on.parentNode;
          if (row && row.scrollWidth > row.clientWidth) row.scrollLeft = Math.max(0, on.offsetLeft - row.offsetLeft - (row.clientWidth - on.offsetWidth) / 2);
        }
        if (!w) return;
        if (room.status === "PLAYING") {
          const slot = document.getElementById("sk-slot");
          if (slot) {
            slot.insertBefore(cv, slot.firstChild);
            slot.insertBefore(ghost, cv.nextSibling);
            slot.append(eraserEl, penEl, fxEl);
            cv.setAttribute("aria-label", w.role === "draw" ? "내가 그리는 그림" : `${mate()}님이 그린 그림`);
            fit();
            if (w.role === "draw") drawMine(); else inkFull();
            ro.disconnect(); ro.observe(slot);
          }
          const gs = document.getElementById("sk-gslot");
          if (gs) { gs.appendChild(gform); syncGuess(); }
          // 처음 나타날 때 — 마우스를 쓰는 화면(PC)에서는 바로 적을 수 있게 입력 칸에 초점.
          // coop.js 가 그린 뒤 전에 초점이 있던 칸(그리던 보드 등)으로 초점을 되돌리므로 그다음에 옮긴다
          if (gs && w.role === "guess" && flipFor !== w.n && matchMedia("(pointer: fine)").matches) {
            const n = w.n;
            setTimeout(() => {
              const ae = document.activeElement;
              if (w && w.n === n && w.role === "guess" && gin.isConnected && (!ae || ae === document.body || ae.id === "sk-slot")) gin.focus({ preventScroll: true });
            }, 0);
          }
          // 지금 그린 칸들의 기준을 적어 둔다(다음 patch 에서 바뀐 칸만 고치게)
          sig["sk-status"] = [w.score, w.right, w.streak, w.role].join("|");
          sig["sk-peek"] = `${w.hint}`;
          sig["sk-answers"] = `${w.n}|${w.guesses.map((g) => g.t).join(",")}|${w.triesLeft}|${w.hint}`;
          delete sig["sk-tools"]; syncTools();
          const re = document.getElementById("sk-react");
          if (re) re.dataset.key = w.react && now() - w.react.t < REACT_SEC ? `${w.react.t}|${w.react.text}` : "";
          if (re && re.dataset.key) reactShown = re.dataset.key;
          fxRender();
          emptyHint();
          if (scrolledFor !== room.id) {
            scrolledFor = room.id;
            const id = room.id;
            // 무대를 화면 위로 — 웹폰트를 다 받은 뒤에 잰다(받기 전에는 위 칸들이 더 높아서 너무 많이 올라간다)
            let waits = 0;
            const go = () => requestAnimationFrame(() => {
              const st = document.getElementById("sk-stage");
              if (!st || !room || room.id !== id || room.status !== "PLAYING") return;
              if (document.fonts && document.fonts.status === "loading" && waits++ < 3) { document.fonts.ready.then(go, go); return; } // 새 글꼴 굵기를 받는 중
              const hdr = document.querySelector(".hk-site-header"); // 위에 붙은 사이트 머리 높이만큼 덜 올린다
              const head = hdr && /sticky|fixed/.test(getComputedStyle(hdr).position) ? hdr.getBoundingClientRect().height : 0;
              let y = 0; // 문서 안 위치 — 나타나는 움직임(.er-enter 의 translateY)에 흔들리지 않게 offsetTop 으로 잰다
              for (let el = st; el; el = el.offsetParent) y += el.offsetTop;
              const top = Math.round(y - head - 8);
              // 위아래 모두 — 대기실에서 아래쪽 「준비」를 누르느라 내려가 있으면 시작 때 시계 · 제시어 쪽지가 화면 위로 잘려 있다
              if (Math.abs(window.scrollY - top) > 4) window.scrollTo({ top, behavior: reduce() ? "auto" : "smooth" });
            });
            const fonts = document.fonts;
            if (fonts && fonts.status !== "loaded" && fonts.ready) fonts.ready.then(go, go); else go();
          }
          flipFor = w.n;
        } else {
          ro.disconnect();
          paintArt();
        }
      },
      storyTier: (ctx) => {
        const r = ctx.room;
        if (!r) return null;
        if (r.status !== "CLEAR") return "fail";
        const score = w ? w.score : Number(r.score || 0);
        const right = w ? w.right : score > 0 ? 1 : 0;
        return score >= GREAT ? "great" : right > 0 ? "ok" : "fail";
      },
      stats: () => (w ? [
        { label: "점수", value: `${w.score}점` },
        { label: "맞힌 낱말", value: `${w.right}개` },
        { label: "최고 연속", value: `${w.best}개` },
        { label: "넘긴 낱말", value: `${w.passed}개` },
      ] : []),
      end: (ctx, again) => {
        const score = w ? w.score : Number(ctx.room.score || 0);
        const right = w ? w.right : 0;
        const head = w && w.reason === "words" ? "낱말을 모두 썼어요!" : "시간 끝!";
        const line = right > 0 ? ctx.room.outro || "" : "다음엔 꼭 통할 거예요!";
        return `<div class="er-end sk-end ${score ? "" : "is-zero"}">
            <span class="sk-end__ep">본관 소회의실 · 그림 퀴즈 결과</span>
            <div class="sk-end__wb">
              <h2>${head}</h2>
              <p>${esc(line)}</p>
              <div class="sk-end__score"><b>${score}</b><span>점</span><svg viewBox="0 0 160 14" aria-hidden="true"><path d="M4 9c30-6 60-7 90-4s46 3 62-1" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
              ${w ? `<p class="sk-end__sub">${w.right}개 맞힘 · 최고 ${w.best}연속 · 넘김 ${w.passed}개</p>` : ""}
              ${w && w.reason === "time" && w.word ? `<p class="sk-end__last">마지막 낱말은 「${esc(w.word)}」${wasJosa(w.word)}</p>` : ""}
            </div>
            <div class="sk-end__mc">${face()}<p><b>${MA}</b>${esc(endMc(score, right))}</p></div>
            <div class="er-actions">${again}<a class="hk-btn hk-btn--secondary" href="#" style="text-decoration:none">목록</a></div>
          </div>`;
      },
      failEnd: (ctx, again) => `<div class="er-end sk-end is-zero">
          <span class="sk-end__ep">본관 소회의실</span>
          <div class="sk-end__wb"><h2>그만뒀어요</h2>
            ${w && w.right > 0 ? `<div class="sk-end__score"><b>${w.score}</b><span>점</span></div><p class="sk-end__sub">그만둘 때까지 ${w.right}개를 맞혔어요</p>` : "<p>다음엔 끝까지 같이 그려 봐요.</p>"}</div>
          <div class="sk-end__mc">${face()}<p><b>${MA}</b>괜찮아요! 보드마커는 그대로 둘게요. 다음에 또 와요.</p></div>
          <div class="er-actions">${again}<a class="hk-btn hk-btn--secondary" href="#" style="text-decoration:none">목록</a></div>
        </div>`,
      after: () => (w ? artHtml() + logHtml() : ""),
      tick: (ctx) => {
        if (!room || room.status !== "PLAYING" || !w) return;
        const t = now();
        if (w.role === "guess") {
          const hl = document.getElementById("sk-hint-left");
          if (hl && !w.hint) hl.textContent = `초성 힌트까지 ${hintLeft()}초`;
          const hb = document.getElementById("sk-hint-bar");
          if (hb && !w.hint) hb.style.transform = `scaleX(${Math.max(0, Math.min(1, (t - w.wordAt) / Math.max(1, w.hintAt - w.wordAt))).toFixed(3)})`;
          if (w.triesLeft <= 0 || noteUntil) { syncGuess(); if (noteUntil && noteUntil < Date.now()) noteUntil = 0; }
        } else {
          const pl = document.getElementById("sk-peek-left");
          if (pl && !w.hint) pl.textContent = String(hintLeft());
          const pb = document.getElementById("sk-pass");
          if (pb) pb.style.setProperty("--p", passP().toFixed(3));
          if (clearArm && clearArm <= Date.now()) { clearArm = 0; syncTools(true); }
          syncTools(); // 넘기기가 켜지는 때 등
        }
        syncReact();
        const left = w.end - t;
        const ck = document.getElementById("sk-clock");
        if (ck) { ck.querySelector("b").textContent = clockText(left); ck.classList.toggle("is-low", left <= 30); }
        const s = Math.ceil(left);
        if (s >= 1 && s <= 10 && s !== lastBeep) { lastBeep = s; ctx.sfx("tick"); }
        if (w.nextAt && t >= w.nextAt + 0.05 && tickFor !== w.nextAt) {
          tickFor = w.nextAt;
          HKApi.coopTick(room.id).then((next) => accept(next)).catch(() => { tickFor = null; });
        }
      },
      keydown: (e) => shortcut(e),
      click: async (t, ctx) => {
        const d = t.dataset;
        if (d.cat) {
          if (t.classList.contains("is-on") || !ctx.room || ctx.room.status !== "READY") return;
          ctx.sfx("select");
          return ctx.act(() => HKApi.coopOptions(ctx.room.id, { category: d.cat }));
        }
        if (d.art != null && d.art !== "") return openArt(Number(d.art));
        if (!w || !room || room.status !== "PLAYING") return;
        if (d.color != null) return pick(Number(d.color));
        if (d.width != null) return pickW(Number(d.width));
        if ("wtoggle" in d) { wOpen = !wOpen; syncTools(true); return; }
        if ("undo" in d) return undo();
        if ("clear" in d) {
          if (clearArm > Date.now()) return clearAll();
          clearArm = Date.now() + 2000;
          syncTools(true);
          return;
        }
        if ("pass" in d) return pass();
        if (d.react != null) return react(Number(d.react));
        if ("hide" in d) {
          hideWord = !hideWord;
          store.set(HIDE_KEY, hideWord ? 1 : 0);
          const word = document.getElementById("sk-word");
          if (word) { word.classList.toggle("is-hidden", hideWord); word.title = hideWord ? "누르고 있으면 보여요" : ""; }
          t.setAttribute("aria-pressed", String(hideWord));
          const lab = t.querySelector("span");
          if (lab) lab.textContent = hideWord ? "가림" : "가리기";
        }
      },
    });
    C = coop;
    // 창 너비가 옆 칸 기준을 넘나들면 답 · 반응 칸 자리가 바뀌므로 다시 그린다
    if (wideMq) {
      const onWide = () => { if (C && room && room.status === "PLAYING" && document.getElementById("sk-stage")) C.paint(); };
      if (wideMq.addEventListener) wideMq.addEventListener("change", onWide); else if (wideMq.addListener) wideMq.addListener(onWide);
    }
    // 가린 제시어 — 누르고 있는 동안만 보인다
    document.addEventListener("pointerdown", (e) => {
      const el = e.target.closest && e.target.closest(".sk-word.is-hidden");
      if (el) el.classList.add("is-peek");
    });
    const unpeek = () => document.querySelectorAll(".sk-word.is-peek").forEach((el) => el.classList.remove("is-peek"));
    ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, unpeek));
    // 굵기 펼침 — 바깥을 누르면 접는다
    document.addEventListener("pointerdown", (e) => {
      if (wOpen && !(e.target.closest && e.target.closest(".sk-widths"))) { wOpen = false; syncTools(true); }
    });
  </script>
</body>
</html>
