  <style>
    .gm-kt { display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none; }
    .gm-kt-hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .gm-kt-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid #e3e8ef; font-size: 13.5px; color: #0b3558; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .gm-kt-chip--time { background: linear-gradient(135deg, #dc2626, #f97316); color: #fff; border-color: transparent; }
    .gm-kt-chip--course { margin-left: auto; color: #9a3412; background: #fff7ed; border-color: #fed7aa; }
    .gm-kt-board { position: relative; border-radius: 16px; overflow: hidden; background: #d9d4c7; box-shadow: 0 1px 3px rgba(15,23,42,.08); touch-action: none; }
    .gm-kt-board canvas { display: block; width: 100%; touch-action: none; }
    .gm-kt-over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(69, 10, 10, .34); }

    .gm-kt-card { width: 100%; max-width: 350px; background: #fff; border-radius: 16px; padding: 22px 20px; text-align: center; box-shadow: 0 12px 32px rgba(15,23,42,.2); max-height: 100%; overflow-y: auto; }
    .gm-kt-card h2 { margin: 6px 0 6px; font-size: 22px; color: #0b3558; }
    .gm-kt-card p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; color: #475569; }
    .gm-kt-card .hk-btn { width: 100%; margin-top: 12px; }
    .gm-kt-badge { display: inline-flex; width: 52px; height: 52px; border-radius: 14px; align-items: center; justify-content: center; background: linear-gradient(135deg, #dc2626, #f97316); }
    .gm-kt-course { display: inline-block; margin: 2px 0 8px; padding: 4px 10px; border-radius: 999px; background: #fff7ed; color: #9a3412; font-size: 12.5px; font-weight: 700; }
    .gm-kt-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 10px 0 0; padding: 12px; border-radius: 12px; background: #fdf4ec; text-align: left; font-size: 13px; color: #334155; }
    .gm-kt-keys dt { font-weight: 700; color: #7c2d12; white-space: nowrap; }

    .gm-kt-big { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 4px 0; color: #0b3558; font-variant-numeric: tabular-nums; }
    .gm-kt-laps { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13.5px; color: #475569; font-variant-numeric: tabular-nums; }
    .gm-kt-laps li { display: flex; justify-content: space-between; padding: 4px 6px; border-radius: 8px; }
    .gm-kt-laps li.is-best { background: #fff7ed; color: #9a3412; font-weight: 700; }
    .gm-kt-pad { display: flex; justify-content: space-between; gap: 10px; }
    .gm-kt-pad__grp { display: flex; gap: 8px; }
    .gm-kt-btn { width: 68px; height: 60px; border: 1px solid #e5d5c8; background: #fff; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7c2d12; font-size: 11.5px; font-weight: 700; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .gm-kt-btn.is-down { background: #fff1e6; border-color: #f97316; }
    .gm-kt-btn--drift { width: 84px; background: linear-gradient(135deg, #dc2626, #f97316); border-color: transparent; color: #fff; }
    .gm-kt-btn--drift.is-down { background: #b91c1c; }
    @media (hover: hover) and (pointer: fine) and (min-width: 900px) { .gm-kt-pad { display: none; } }
    @media (max-width: 520px) {
      .gm-kt-chip { padding: 6px 10px; font-size: 12.5px; }
      .gm-kt-chip b { font-size: 15px; }
      .gm-kt-chip--course .gm-kt-long { display: none; }
      .gm-kt-card { padding: 16px 14px; }
      .gm-kt-card h2 { font-size: 19px; margin: 4px 0; }
      .gm-kt-card p { font-size: 13px; }
      .gm-kt-badge { width: 42px; height: 42px; border-radius: 12px; }
      .gm-kt-keys { padding: 10px; font-size: 12.5px; gap: 4px 8px; }
      .gm-kt-note { display: none; }
      .gm-kt-btn { width: 64px; height: 58px; }
      .gm-kt-btn--drift { width: 80px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "kart",
    setup(stage, ctx) {
      // ───────────────────────── 코스 (요일별: 월·수·금 A, 화·목 B — KST)
      const COURSES = {
        A: {
          name: "본관 순환 코스",
          short: "A코스",
          pts: [[0,0],[600,0],[1200,0],[1550,-150],[1600,-550],[1400,-830],[1530,-1090],[1300,-1380],[800,-1420],[420,-1250],[120,-1460],[-320,-1380],[-520,-1000],[-320,-690],[-520,-380],[-330,-40]],
          rects: [
            { kind: "bldg", x: -20, y: -1060, w: 1080, h: 700, label: "본관" },
            { kind: "lobby", x: 380, y: -360, w: 240, h: 60, label: "로비" },
            { kind: "park", x: 1790, y: -1300, w: 420, h: 1150, label: "주차장" },
            { kind: "bldg2", x: -1000, y: -1300, w: 280, h: 560, label: "별관" },
          ],
          fountain: [300, -1780],
          labels: [[1500, -820, "주차장 시케인"], [180, -1340, "정원 S커브"], [600, 70, "로비 앞 직선"]],
        },
        B: {
          name: "정원 헤어핀 코스",
          short: "B코스",
          pts: [[0,0],[944,0],[1416,-177],[1534,-590],[1357,-1003],[826,-1062],[472,-826],[118,-1003],[-59,-1357],[-472,-1475],[-885,-1239],[-944,-767],[-590,-531],[-531,-177]],
          rects: [
            { kind: "bldg", x: -300, y: -660, w: 1300, h: 330, label: "본관" },
            { kind: "lobby", x: 300, y: -330, w: 240, h: 50, label: "로비" },
            { kind: "park", x: 1720, y: -1150, w: 420, h: 1000, label: "주차장" },
            { kind: "bldg2", x: -1350, y: -600, w: 280, h: 500, label: "별관" },
          ],
          fountain: [-560, -1020],
          labels: [[640, -930, "정원 헤어핀"], [-700, -1420, "북쪽 정원"], [470, 70, "로비 앞 직선"]],
        },
      };
      // 설계 좌표를 1.15배로 키워서 써요(3바퀴 1분~1분 30초)
      const SC = 1.15;
      for (const c of Object.values(COURSES)) {
        c.pts = c.pts.map(([x, y]) => [x * SC, y * SC]);
        c.rects.forEach((r) => { r.x *= SC; r.y *= SC; r.w *= SC; r.h *= SC; });
        c.fountain = c.fountain.map((v) => v * SC);
        c.labels = c.labels.map(([x, y, t]) => [x * SC, y * SC, t]);
      }
      const dow = new Date(ctx.today + "T00:00:00Z").getUTCDay(); // 0=일
      const forced = /[?&]debug\b/.test(location.search) && (location.search.match(/[?&]course=([AB])/) || [])[1];
      const COURSE_KEY = forced || (dow === 2 || dow === 4 ? "B" : "A");
      const COURSE = COURSES[COURSE_KEY];

      const STEP = 10, HALF = 80, BOUND = 132, KR = 17;
      const LAPS = 3, NCP = 12;
      const MAXV = 360, ACC = 330, BRAKE = 720, REVMAX = 120, COAST = 150, GRASS_MAX = 150, BOOSTV = 480;
      const VIEW_W = 640;
      const TINT = ["#dc2626", "#f97316"];

      // 닫힌 Catmull-Rom → 일정 간격 재표본
      function buildTrack(pts) {
        const n = pts.length, dense = [];
        for (let i = 0; i < n; i++) {
          const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
          const m = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 2);
          for (let k = 0; k < m; k++) {
            const t = k / m, t2 = t * t, t3 = t2 * t;
            const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
            dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
          }
        }
        const out = [dense[0]];
        let acc = 0;
        for (let i = 1; i <= dense.length; i++) {
          const a = dense[i - 1], b = dense[i % dense.length];
          let ax = a[0], ay = a[1], d = Math.hypot(b[0] - ax, b[1] - ay);
          while (acc + d >= STEP) {
            const r = (STEP - acc) / d;
            ax += (b[0] - ax) * r; ay += (b[1] - ay) * r;
            out.push([ax, ay]);
            d = Math.hypot(b[0] - ax, b[1] - ay);
            acc = 0;
          }
          acc += d;
        }
        if (Math.hypot(out[out.length - 1][0] - out[0][0], out[out.length - 1][1] - out[0][1]) < STEP * 0.5) out.pop();
        const N = out.length;
        const xs = new Float32Array(N), ys = new Float32Array(N), txs = new Float32Array(N), tys = new Float32Array(N);
        for (let i = 0; i < N; i++) { xs[i] = out[i][0]; ys[i] = out[i][1]; }
        for (let i = 0; i < N; i++) {
          const a = (i - 1 + N) % N, b = (i + 1) % N;
          const dx = xs[b] - xs[a], dy = ys[b] - ys[a], l = Math.hypot(dx, dy) || 1;
          txs[i] = dx / l; tys[i] = dy / l;
        }
        let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        for (let i = 0; i < N; i++) { minX = Math.min(minX, xs[i]); maxX = Math.max(maxX, xs[i]); minY = Math.min(minY, ys[i]); maxY = Math.max(maxY, ys[i]); }
        const path = new Path2D();
        path.moveTo(xs[0], ys[0]);
        for (let i = 1; i < N; i++) path.lineTo(xs[i], ys[i]);
        path.closePath();
        return { N, xs, ys, txs, tys, path, minX, maxX, minY, maxY, len: N * STEP };
      }
      const T = buildTrack(COURSE.pts);

      // 가장 가까운 중심선 위치 (직전 위치 주변만 찾아서 지름길로 튀지 않게)
      function locate(x, y, hint, win) {
        const N = T.N;
        let best = hint, bd = Infinity;
        for (let o = -win; o <= win; o++) {
          const i = (hint + o + N) % N;
          const dx = x - T.xs[i], dy = y - T.ys[i], d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = i; }
        }
        // 이웃 두 선분에 투영해 정확한 거리
        let res = null;
        for (const j of [(best - 1 + N) % N, best]) {
          const k = (j + 1) % N;
          const ax = T.xs[j], ay = T.ys[j], bx = T.xs[k] - ax, by = T.ys[k] - ay;
          const l2 = bx * bx + by * by || 1;
          const t = Math.max(0, Math.min(1, ((x - ax) * bx + (y - ay) * by) / l2));
          const px = ax + bx * t, py = ay + by * t;
          const d = Math.hypot(x - px, y - py);
          if (!res || d < res.d) res = { i: best, d, px, py, nx: d > 1e-6 ? (x - px) / d : -by / Math.sqrt(l2), ny: d > 1e-6 ? (y - py) / d : bx / Math.sqrt(l2) };
        }
        return res;
      }
      function nearestGlobal(x, y) {
        let best = 0, bd = Infinity;
        for (let i = 0; i < T.N; i++) { const d = (x - T.xs[i]) ** 2 + (y - T.ys[i]) ** 2; if (d < bd) { bd = d; best = i; } }
        return { i: best, d: Math.sqrt(bd) };
      }

      // 장식: 건물·주차장(코스와 겹치면 빼요), 나무, 화분(잔디 위 장애물)
      const rects = COURSE.rects.filter((r) => {
        for (let i = 0; i < T.N; i++) {
          const dx = Math.max(r.x - T.xs[i], 0, T.xs[i] - (r.x + r.w)), dy = Math.max(r.y - T.ys[i], 0, T.ys[i] - (r.y + r.h));
          if (Math.hypot(dx, dy) < BOUND + 14) return false;
        }
        return true;
      });
      const inRects = (x, y, pad) => rects.some((r) => x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad);
      const decoRng = HKPlay.seededRng("kart-deco-" + COURSE_KEY);
      const trees = [];
      for (let k = 0; k < 900 && trees.length < 150; k++) {
        const x = T.minX - 500 + decoRng() * (T.maxX - T.minX + 1000);
        const y = T.minY - 500 + decoRng() * (T.maxY - T.minY + 900);
        const r = 18 + decoRng() * 16;
        if (nearestGlobal(x, y).d < BOUND + 18 + r) continue;
        if (inRects(x, y, r + 10)) continue;
        if (Math.hypot(x - COURSE.fountain[0], y - COURSE.fountain[1]) < 110 + r) continue;
        if (trees.some((t) => Math.hypot(t.x - x, t.y - y) < t.r + r + 6)) continue;
        trees.push({ x, y, r, s: decoRng() });
      }
      // 잔디 안쪽 코너에 놓인 동그란 화단(부딪히면 튕겨요)
      const planters = [];
      for (let i = 0; i < T.N; i += 3) {
        const a = (i - 12 + T.N) % T.N, b = (i + 12) % T.N;
        const cross = T.txs[a] * T.tys[b] - T.tys[a] * T.txs[b];
        if (Math.abs(cross) < 0.55) continue;
        const side = cross > 0 ? 1 : -1; // 안쪽 방향(오른쪽 법선 기준)
        const nx = -T.tys[i] * side, ny = T.txs[i] * side;
        const x = T.xs[i] + nx * (HALF + 32), y = T.ys[i] + ny * (HALF + 32);
        if (nearestGlobal(x, y).d < HALF + 28) continue;
        if (planters.some((p) => Math.hypot(p.x - x, p.y - y) < 420)) continue;
        planters.push({ x, y, r: 17 });
      }

      // 체크포인트
      const CP = Array.from({ length: NCP }, (_, c) => Math.floor((c * T.N) / NCP));

      // ───────────────────────── 화면 뼈대
      stage.innerHTML = `<div class="gm-kt">
        <div class="gm-kt-hud">
          <span class="gm-kt-chip gm-kt-chip--time">${HKUI.icon("timer", 16, "#fff")} <b id="gm-kt-total">0:00.00</b></span>
          <span class="gm-kt-chip">${HKUI.icon("flag", 15, "#dc2626")} 최고 랩 <b id="gm-kt-best">-</b></span>
          <span class="gm-kt-chip gm-kt-chip--course">${HKUI.icon("map", 15, "currentColor")} ${COURSE.short}<span class="gm-kt-long"> · ${COURSE.name}</span></span>
        </div>
        <div class="gm-kt-board" id="gm-kt-board">
          <canvas id="gm-kt-canvas"></canvas>
          <div class="gm-kt-over" id="gm-kt-over"></div>
        </div>
        <div class="gm-kt-pad">
          <div class="gm-kt-pad__grp">
            <button type="button" class="gm-kt-btn" data-k="left" aria-label="왼쪽으로">${HKUI.icon("chevron-left", 30, "currentColor")}</button>
            <button type="button" class="gm-kt-btn" data-k="right" aria-label="오른쪽으로">${HKUI.icon("chevron-right", 30, "currentColor")}</button>
          </div>
          <div class="gm-kt-pad__grp">
            <button type="button" class="gm-kt-btn" data-k="brake" aria-label="브레이크">${HKUI.icon("octagon-pause", 20, "currentColor")}브레이크</button>
            <button type="button" class="gm-kt-btn gm-kt-btn--drift" data-k="drift" aria-label="드리프트">${HKUI.icon("coffee", 20, "currentColor")}드리프트</button>
          </div>
        </div>
      </div>`;
      HKUI.refreshIcons(stage);

      const $ = (s) => stage.querySelector(s);
      const canvas = $("#gm-kt-canvas");
      const g = canvas.getContext("2d");
      const board = $("#gm-kt-board");
      const over = $("#gm-kt-over");
      const FONT = getComputedStyle(document.body).fontFamily || "sans-serif";
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const fmt = (sec) => {
        const c = Math.max(0, Math.round(sec * 100));
        const m = Math.floor(c / 6000), s = Math.floor((c % 6000) / 100);
        return `${m}:${String(s).padStart(2, "0")}.${String(c % 100).padStart(2, "0")}`;
      };
      const LS_KEY = "gm-kart-bestlap-" + COURSE_KEY;
      const lsGet = () => { try { const v = parseFloat(localStorage.getItem(LS_KEY)); return isFinite(v) ? v : null; } catch (e) { return null; } };
      const lsSet = (v) => { try { localStorage.setItem(LS_KEY, String(v)); } catch (e) { /* 저장 못 해도 괜찮아요 */ } };

      let W = 360, H = 400, dpr = 1, scale = 0.8;

      // ───────────────────────── 상태
      let state = "ready"; // ready | count | race | finish | paused | done
      let pausedFrom = null;
      let kart, cam, raceTime, countT, lap, nextCp, started, lapStart, laps, bestLap, toasts, smoke, skids, wrongT, shake, finishT, goT;
      const inp = { left: false, right: false, gas: false, brake: false, drift: false };
      let autoGas = window.matchMedia && matchMedia("(pointer: coarse)").matches;

      function reset() {
        const i0 = T.N - 9;
        const a = Math.atan2(T.tys[i0], T.txs[i0]);
        kart = { x: T.xs[i0], y: T.ys[i0], a, vx: 0, vy: 0, idx: i0, drift: 0, charge: 0, boost: 0, onGrass: false, steerVis: 0, hitT: 0 };
        cam = { x: kart.x, y: kart.y };
        raceTime = 0; countT = 3; lap = 0; nextCp = 0; started = false; lapStart = 0;
        laps = []; bestLap = null; toasts = []; smoke = []; skids = []; wrongT = 0; shake = 0; finishT = 0; goT = 0;
        for (const k in inp) inp[k] = false;
        updateHud();
      }

      function updateHud() {
        $("#gm-kt-total").textContent = fmt(raceTime);
        $("#gm-kt-best").textContent = bestLap != null ? fmt(bestLap) : "-";
      }

      function toast(text, color) { toasts.push({ text, color: color || "#fff", t: 0 }); if (toasts.length > 3) toasts.shift(); }

      // ───────────────────────── 물리 (고정 1/120초)
      const H_STEP = 1 / 120;
      function physics(h) {
        const k = kart;
        const racing = state === "race";
        const fx = Math.cos(k.a), fy = Math.sin(k.a);
        let vf = k.vx * fx + k.vy * fy;
        let vr = -k.vx * fy + k.vy * fx;
        const steer = racing ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
        const gas = racing && (inp.gas || (autoGas && !inp.brake));
        const brake = racing && inp.brake;
        const loc = locate(k.x, k.y, k.idx, 30);
        k.idx = loc.i;
        k.onGrass = loc.d > HALF;

        // 드리프트 시작 / 유지 / 끝
        if (racing && inp.drift && !k.drift && steer !== 0 && vf > 150 && !k.onGrass) { k.drift = steer; k.charge = 0; }
        if (k.drift) {
          if (!racing || !inp.drift || vf < 90 || k.onGrass) {
            const ok = racing && !inp.drift && vf >= 90 && !k.onGrass;
            if (ok && k.charge >= 1) { k.boost = 1.25; toast("더블샷 부스터!", "#fde68a"); }
            else if (ok && k.charge >= 0.5) { k.boost = 0.7; toast("원샷 부스터!", "#fed7aa"); }
            k.drift = 0; k.charge = 0;
          } else {
            k.charge = Math.min(1, k.charge + h / 1.1);
          }
        }

        // 조향
        const sp = Math.min(1, Math.abs(vf) / 110);
        let rate;
        if (k.drift) rate = k.drift * (1.95 + 1.1 * steer * k.drift) * sp;
        else rate = steer * 2.75 * sp * (1 - 0.22 * Math.min(1, Math.abs(vf) / MAXV)) * (vf < 0 ? -1 : 1);
        k.a += rate * h;
        k.steerVis += (steer - k.steerVis) * Math.min(1, h * 12);

        // 속도
        let maxv = k.onGrass ? GRASS_MAX : MAXV;
        if (k.boost > 0) {
          k.boost -= h;
          if (!k.onGrass) { maxv = BOOSTV; vf += 700 * h; } else maxv = GRASS_MAX * 1.25;
        }
        if (gas) { if (vf < maxv) vf += ACC * h * (1 - 0.55 * Math.max(0, vf) / MAXV) * (vf < 0 ? 2 : 1); }
        else if (brake) { if (vf > 5) vf -= BRAKE * h; else vf = Math.max(-REVMAX, vf - 260 * h); }
        else vf -= Math.sign(vf) * Math.min(Math.abs(vf), COAST * h);
        if (vf > maxv) vf = Math.max(maxv, vf - (k.onGrass ? 560 : 320) * h);
        if (k.drift) vf -= 28 * h;
        if (!racing && state !== "count") vf -= Math.sign(vf) * Math.min(Math.abs(vf), 260 * h); // 결승 뒤엔 천천히 멈춰요

        // 옆으로 미끄러짐(접지)
        const grip = k.drift ? 2.3 : k.onGrass ? 5 : 11;
        const nvr = vr * Math.exp(-grip * h);
        if (k.drift) vf += Math.abs(vr - nvr) * 0.65; // 미끄러지며 잃은 속도 일부를 앞으로
        vr = nvr;
        if (k.drift && Math.abs(vf) > 100) vr -= k.drift * 40 * h * 6; // 바깥으로 살짝 밀리는 느낌

        const nfx = Math.cos(k.a), nfy = Math.sin(k.a);
        k.vx = nfx * vf - nfy * vr;
        k.vy = nfy * vf + nfx * vr;
        k.x += k.vx * h; k.y += k.vy * h;

        // 벽(화단 울타리·건물)
        const l2 = locate(k.x, k.y, k.idx, 6);
        if (l2.d > BOUND - KR) {
          k.x = l2.px + l2.nx * (BOUND - KR - 0.5);
          k.y = l2.py + l2.ny * (BOUND - KR - 0.5);
          bounce(l2.nx, l2.ny);
        }
        for (const p of planters) {
          const dx = k.x - p.x, dy = k.y - p.y, d = Math.hypot(dx, dy);
          if (d < p.r + KR && d > 0) {
            const nx = dx / d, ny = dy / d;
            k.x = p.x + nx * (p.r + KR + 0.5); k.y = p.y + ny * (p.r + KR + 0.5);
            bounce(-nx, -ny);
          }
        }
        if (k.hitT > 0) k.hitT -= h;

        if (racing) {
          raceTime += h;
          // 체크포인트
          const cpi = CP[nextCp];
          if ((k.idx - cpi + T.N) % T.N < 30) passCp(nextCp);
          // 역주행
          const tx = T.txs[k.idx], ty = T.tys[k.idx];
          const along = k.vx * tx + k.vy * ty;
          const headDot = Math.cos(k.a) * tx + Math.sin(k.a) * ty;
          if (along < -25 || (headDot < -0.35 && Math.hypot(k.vx, k.vy) > 30)) wrongT += h; else wrongT = Math.max(0, wrongT - h * 2);
        }

        // 연기·타이어 자국
        if (k.drift && Math.random() < 0.5) {
          const bx = k.x - Math.cos(k.a) * 12, by = k.y - Math.sin(k.a) * 12;
          smoke.push({ x: bx + (Math.random() - 0.5) * 14, y: by + (Math.random() - 0.5) * 14, r: 5 + Math.random() * 4, t: 0, life: 0.5, c: k.charge >= 1 ? "#fbbf24" : k.charge >= 0.5 ? "#c08457" : "#e5e7eb" });
        }
        if (k.boost > 0 && Math.random() < 0.7) {
          smoke.push({ x: k.x - Math.cos(k.a) * 18, y: k.y - Math.sin(k.a) * 18, r: 4 + Math.random() * 4, t: 0, life: 0.3, c: "#fb923c", flame: true });
        }
        if (smoke.length > 160) smoke.splice(0, smoke.length - 160);
        if (k.drift || (Math.abs(vr) > 60 && !k.onGrass)) {
          const ca = Math.cos(k.a), sa = Math.sin(k.a);
          for (const s of [-1, 1]) {
            const wx = k.x - ca * 10 - sa * 8 * s, wy = k.y - sa * 10 + ca * 8 * s;
            const last = skids[s < 0 ? "l" : "r"];
            if (last && Math.hypot(last.x - wx, last.y - wy) < 18) skids.push({ x1: last.x, y1: last.y, x2: wx, y2: wy });
            skids[s < 0 ? "l" : "r"] = { x: wx, y: wy };
          }
          if (skids.length > 700) skids.splice(0, skids.length - 700);
        } else { skids.l = null; skids.r = null; }
      }

      function bounce(nx, ny) {
        const k = kart;
        const vn = k.vx * nx + k.vy * ny;
        if (vn > 0) {
          k.vx -= nx * vn * 1.45; k.vy -= ny * vn * 1.45;
          k.vx *= 0.7; k.vy *= 0.7;
          if (vn > 60 && k.hitT <= 0) { shake = Math.min(1, vn / 300); k.hitT = 0.25; }
        }
        if (k.drift) { k.drift = 0; k.charge = 0; }
      }

      function passCp(c) {
        nextCp = (c + 1) % NCP;
        if (c !== 0) return;
        if (!started) { started = true; lapStart = 0; lap = 1; return; }
        const lt = raceTime - lapStart;
        laps.push(lt);
        lapStart = raceTime;
        const isBest = bestLap == null || lt < bestLap;
        if (isBest) bestLap = lt;
        if (lap >= LAPS) { finish(); return; }
        lap++;
        toast(`${lap - 1}랩 ${fmt(lt)}${isBest && laps.length > 1 ? " · 최고 랩!" : ""}`, isBest && laps.length > 1 ? "#fde68a" : "#fff");
        if (lap === LAPS) setTimeout(() => state === "race" && toast("마지막 바퀴예요!", "#fecaca"), 900);
        updateHud();
      }

      function finish() {
        state = "finish";
        finishT = 0;
        kart.drift = 0; kart.boost = 0;
        updateHud();
        const prev = lsGet();
        if (bestLap != null && (prev == null || bestLap < prev)) lsSet(bestLap);
        const total = raceTime;
        setTimeout(() => {
          if (state !== "finish") return;
          state = "done";
          showFinishCard(total);
          ctx.submit(Math.min(59999, Math.round(total * 100)));
        }, 1500);
      }

      // ───────────────────────── 그리기
      function resize() {
        const w = Math.round(board.clientWidth || stage.clientWidth || 360);
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const padH = window.matchMedia && matchMedia("(hover: hover) and (pointer: fine) and (min-width: 900px)").matches ? 0 : 72;
        const avail = (window.innerHeight || 800) - (window.innerWidth >= 900 ? 300 : 210) - padH;
        H = Math.round(clamp(avail, w * 0.78, w * (w < 600 ? 1.4 : 1.12)));
        W = w;
        scale = clamp(W / VIEW_W, 0.5, 0.92);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.height = H + "px";
        draw(0);
      }

      function roundRect(x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }

      function drawWorld(time) {
        // 바깥 포장 바닥
        const vx0 = cam.x - W / 2 / scale - 40, vy0 = cam.y - H / 2 / scale - 40, vw = W / scale + 80, vh = H / scale + 80;
        g.fillStyle = "#ddd7c9";
        g.fillRect(vx0, vy0, vw, vh);
        g.strokeStyle = "rgba(120,110,90,.12)";
        g.lineWidth = 2;
        g.beginPath();
        const gs = 80;
        for (let x = Math.floor(vx0 / gs) * gs; x < vx0 + vw; x += gs) { g.moveTo(x, vy0); g.lineTo(x, vy0 + vh); }
        for (let y = Math.floor(vy0 / gs) * gs; y < vy0 + vh; y += gs) { g.moveTo(vx0, y); g.lineTo(vx0 + vw, y); }
        g.stroke();

        g.lineJoin = "round"; g.lineCap = "round";
        // 화단 울타리
        g.strokeStyle = "#2f6b34"; g.lineWidth = 2 * BOUND + 30; g.stroke(T.path);
        g.setLineDash([16, 12]); g.strokeStyle = "#4b8f43"; g.lineWidth = 2 * BOUND + 20; g.stroke(T.path); g.setLineDash([]);
        // 잔디
        g.strokeStyle = "#8fcd6c"; g.lineWidth = 2 * BOUND; g.stroke(T.path);
        g.setLineDash([46, 46]); g.strokeStyle = "#86c463"; g.lineWidth = 2 * BOUND; g.lineCap = "butt"; g.stroke(T.path); g.setLineDash([]);
        g.lineCap = "round";
        // 연석
        g.strokeStyle = "#f8fafc"; g.lineWidth = 2 * HALF + 14; g.stroke(T.path);
        g.setLineDash([22, 22]); g.strokeStyle = "#ef4444"; g.lineCap = "butt"; g.stroke(T.path); g.setLineDash([]);
        g.lineCap = "round";
        // 노면
        g.strokeStyle = "#5d6473"; g.lineWidth = 2 * HALF; g.stroke(T.path);
        g.setLineDash([34, 34]); g.strokeStyle = "rgba(255,255,255,.28)"; g.lineWidth = 3; g.lineCap = "butt"; g.stroke(T.path); g.setLineDash([]);
        g.lineCap = "round";

        // 타이어 자국
        g.strokeStyle = "rgba(25,25,30,.28)"; g.lineWidth = 4;
        g.beginPath();
        for (const s of skids) { g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); }
        g.stroke();

        // 진행 방향 화살표
        g.fillStyle = "rgba(255,255,255,.16)";
        for (let i = 20; i < T.N - 10; i += 45) {
          const x = T.xs[i], y = T.ys[i];
          if (Math.abs(x - cam.x) > W / scale || Math.abs(y - cam.y) > H / scale) continue;
          g.save(); g.translate(x, y); g.rotate(Math.atan2(T.tys[i], T.txs[i]));
          for (const o of [-26, 26]) {
            g.beginPath(); g.moveTo(10, o); g.lineTo(-8, o - 12); g.lineTo(-2, o); g.lineTo(-8, o + 12); g.closePath(); g.fill();
          }
          g.restore();
        }

        // 출발선 (체커)
        {
          const x = T.xs[0], y = T.ys[0];
          g.save(); g.translate(x, y); g.rotate(Math.atan2(T.tys[0], T.txs[0]));
          const sq = 10;
          for (let r = 0; r < 2; r++) for (let c = -HALF / sq; c < HALF / sq; c++) {
            g.fillStyle = (r + c) % 2 === 0 ? "#fff" : "#111827";
            g.fillRect(-sq + r * sq, c * sq, sq, sq);
          }
          // 출발 게이트 기둥
          g.fillStyle = "#334155";
          g.fillRect(-4, -HALF - 26, 8, 14); g.fillRect(-4, HALF + 12, 8, 14);
          g.restore();
        }

        // 화단(동그란)
        for (const p of planters) {
          g.fillStyle = "#9a6b4a"; g.beginPath(); g.arc(p.x, p.y, p.r + 4, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#3f8a3b"; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
          for (let q = 0; q < 5; q++) {
            const an = q * 1.257 + p.x;
            g.fillStyle = q % 2 ? "#f472b6" : "#fde047";
            g.beginPath(); g.arc(p.x + Math.cos(an) * p.r * 0.55, p.y + Math.sin(an) * p.r * 0.55, 3.2, 0, Math.PI * 2); g.fill();
          }
        }

        // 건물·주차장
        for (const r of rects) drawRect(r);
        // 분수
        {
          const [fxp, fyp] = COURSE.fountain;
          g.fillStyle = "#cbd5e1"; g.beginPath(); g.arc(fxp, fyp, 92, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#7dd3fc"; g.beginPath(); g.arc(fxp, fyp, 78, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 3;
          for (let q = 0; q < 3; q++) { const rr = ((time * 30 + q * 26) % 78); g.globalAlpha = 1 - rr / 78; g.beginPath(); g.arc(fxp, fyp, rr, 0, Math.PI * 2); g.stroke(); }
          g.globalAlpha = 1;
          g.fillStyle = "#e2e8f0"; g.beginPath(); g.arc(fxp, fyp, 14, 0, Math.PI * 2); g.fill();
        }
        // 나무
        for (const t of trees) {
          if (Math.abs(t.x - cam.x) > W / scale / 2 + 60 || Math.abs(t.y - cam.y) > H / scale / 2 + 60) continue;
          g.fillStyle = "rgba(30,50,30,.18)"; g.beginPath(); g.arc(t.x + 6, t.y + 7, t.r, 0, Math.PI * 2); g.fill();
          g.fillStyle = t.s > 0.5 ? "#3f8f46" : "#4f9d3e"; g.beginPath(); g.arc(t.x, t.y, t.r, 0, Math.PI * 2); g.fill();
          g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.arc(t.x - t.r * 0.3, t.y - t.r * 0.3, t.r * 0.5, 0, Math.PI * 2); g.fill();
        }
        // 구간 이름
        g.font = `700 20px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
        for (const [lx, ly, text] of COURSE.labels) {
          g.fillStyle = "rgba(255,255,255,.75)";
          const tw = g.measureText(text).width + 22;
          roundRect(lx - tw / 2, ly - 16, tw, 32, 16); g.fill();
          g.fillStyle = "#7c2d12"; g.fillText(text, lx, ly + 1);
        }

        // 연기·불꽃
        for (const s of smoke) {
          const a = 1 - s.t / s.life;
          g.globalAlpha = a * (s.flame ? 0.9 : 0.55);
          g.fillStyle = s.c;
          g.beginPath(); g.arc(s.x, s.y, s.r * (1 + s.t * 2), 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;

        drawKart(time);
      }

      function drawRect(r) {
        if (r.kind === "park") {
          g.fillStyle = "#9ca3af"; roundRect(r.x, r.y, r.w, r.h, 18); g.fill();
          g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 3;
          const rows = Math.floor(r.h / 52);
          const carCols = ["#f8fafc", "#60a5fa", "#fbbf24", "#1f2937", "#a78bfa", "#f87171"];
          for (let i = 0; i < rows; i++) {
            const y = r.y + 20 + i * 52;
            for (const [x0, dir] of [[r.x + 20, 1], [r.x + r.w - 20, -1]]) {
              g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + dir * 110, y); g.stroke();
              if ((i * 7 + (dir > 0 ? 3 : 5)) % 3 !== 0 && i < rows - 1) {
                const cx = x0 + dir * 58, cy = y + 26;
                g.fillStyle = carCols[(i + (dir > 0 ? 0 : 3)) % carCols.length];
                roundRect(cx - 38, cy - 17, 76, 34, 9); g.fill();
                g.fillStyle = "rgba(15,23,42,.35)"; roundRect(cx - 14, cy - 13, 30, 26, 6); g.fill();
              }
            }
          }
          g.fillStyle = "#475569"; g.font = `800 26px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText("P", r.x + r.w / 2, r.y + r.h / 2);
          return;
        }
        if (r.kind === "lobby") {
          g.fillStyle = "rgba(0,0,0,.12)"; roundRect(r.x + 8, r.y + 8, r.w, r.h, 10); g.fill();
          g.fillStyle = "#f97316"; roundRect(r.x, r.y, r.w, r.h, 10); g.fill();
          g.fillStyle = "rgba(255,255,255,.25)"; for (let x = r.x + 16; x < r.x + r.w - 10; x += 28) g.fillRect(x, r.y + 6, 12, r.h - 12);
          g.fillStyle = "#fff"; g.font = `800 20px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2 + 1);
          return;
        }
        const main = r.kind === "bldg";
        g.fillStyle = "rgba(15,23,42,.18)"; roundRect(r.x + 14, r.y + 16, r.w, r.h, 16); g.fill();
        g.fillStyle = main ? "#e7e2f3" : "#e6edf3"; roundRect(r.x, r.y, r.w, r.h, 16); g.fill();
        g.fillStyle = main ? "#d4cce8" : "#d3dde7"; roundRect(r.x + 18, r.y + 18, r.w - 36, r.h - 36, 10); g.fill();
        // 옥상 설비
        g.fillStyle = "#b8b0cf";
        for (let x = r.x + 50; x < r.x + r.w - 80; x += 160) for (let y = r.y + 50; y < r.y + r.h - 70; y += 140) { roundRect(x, y, 60, 40, 6); g.fill(); }
        // 옥상 정원(본관)
        if (main) {
          g.fillStyle = "#a7d48c"; roundRect(r.x + r.w / 2 - 110, r.y + r.h / 2 - 60, 220, 120, 14); g.fill();
        }
        g.fillStyle = "#3b2f63"; g.font = `800 ${main ? 44 : 28}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2 + 2);
      }

      function drawKart(time) {
        const k = kart;
        g.save();
        g.translate(k.x, k.y);
        g.rotate(k.a);
        g.scale(1.45, 1.45);
        if (k.hitT > 0 && Math.floor(time * 20) % 2) g.globalAlpha = 0.75;
        // 그림자
        g.fillStyle = "rgba(0,0,0,.25)"; roundRect(-15, -9, 32, 22, 7); g.fill();
        // 바퀴
        g.fillStyle = "#1f2937";
        const st = k.steerVis * 0.4;
        for (const [x, y, s] of [[-10, -11, 0], [-10, 11, 0], [10, -11, st], [10, 11, st]]) {
          g.save(); g.translate(x, y); g.rotate(s); g.fillRect(-5, -3.5, 10, 7); g.restore();
        }
        // 차체
        const grd = g.createLinearGradient(-16, 0, 18, 0);
        grd.addColorStop(0, TINT[0]); grd.addColorStop(1, TINT[1]);
        g.fillStyle = grd; roundRect(-16, -9, 33, 18, 7); g.fill();
        g.fillStyle = "#fff"; roundRect(12, -7, 6, 14, 3); g.fill(); // 앞 범퍼
        g.fillStyle = "#7f1d1d"; g.fillRect(-16, -2, 33, 4); // 줄무늬
        // 운전자 헬멧
        g.fillStyle = "#fff"; g.beginPath(); g.arc(-3, 0, 6.4, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#0b3558"; g.beginPath(); g.arc(-1, 0, 6.4, -0.9, 0.9); g.fill();
        // 뒤 컵홀더의 커피
        g.fillStyle = "#fff"; g.beginPath(); g.arc(-13, 5.5, 2.6, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#7c4a2d"; g.beginPath(); g.arc(-13, 5.5, 1.6, 0, Math.PI * 2); g.fill();
        g.restore();
      }

      function drawHud(time) {
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        // 랩 / 현재 랩 시간
        const lapNow = state === "race" || state === "finish" ? (started ? raceTime - lapStart : raceTime) : 0;
        g.fillStyle = "rgba(15,23,42,.62)"; roundRect(10, 10, 132, 54, 12); g.fill();
        g.fillStyle = "#fed7aa"; g.font = `700 12px ${FONT}`; g.textAlign = "left"; g.textBaseline = "alphabetic";
        g.fillText(`랩 ${Math.max(1, Math.min(LAPS, lap))} / ${LAPS}`, 20, 29);
        g.fillStyle = "#fff"; g.font = `800 21px ${FONT}`;
        g.fillText(state === "finish" || state === "done" ? fmt(laps[laps.length - 1] || 0) : fmt(lapNow), 20, 53);

        // 미니맵
        const mm = Math.min(110, W * 0.28);
        const sx = mm / (T.maxX - T.minX + 300), sy = mm / (T.maxY - T.minY + 300), ms = Math.min(sx, sy);
        const mw = (T.maxX - T.minX + 300) * ms, mh = (T.maxY - T.minY + 300) * ms;
        const mx = W - mw - 12, my = 10;
        g.fillStyle = "rgba(255,255,255,.92)"; roundRect(mx - 4, my, mw + 8, mh + 8, 12); g.fill();
        g.save();
        g.translate(mx + (150 - T.minX) * ms, my + 4 + (150 - T.minY) * ms);
        g.scale(ms, ms);
        g.strokeStyle = "#64748b"; g.lineWidth = 2 * HALF; g.lineJoin = "round"; g.stroke(T.path);
        g.fillStyle = "#111827"; g.beginPath(); g.arc(T.xs[0], T.ys[0], 3.5 / ms, 0, Math.PI * 2); g.fill();
        g.restore();
        g.fillStyle = TINT[0];
        g.beginPath(); g.arc(mx + (150 - T.minX + kart.x) * ms, my + 4 + (150 - T.minY + kart.y) * ms, 4.5, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke();

        // 커피 게이지(드리프트 게이지)
        const cx = 14, cy = H - 70;
        g.fillStyle = "rgba(15,23,42,.62)"; roundRect(cx - 4, cy - 6, 126, 64, 12); g.fill();
        // 컵
        const cupX = cx + 8, cupY = cy + 6, cupW = 30, cupH = 40;
        const fill = kart.drift ? kart.charge : 0;
        g.save();
        g.beginPath(); g.moveTo(cupX, cupY); g.lineTo(cupX + cupW, cupY); g.lineTo(cupX + cupW - 4, cupY + cupH); g.lineTo(cupX + 4, cupY + cupH); g.closePath();
        g.fillStyle = "#fff"; g.fill();
        g.clip();
        g.fillStyle = fill >= 1 ? "#4a2511" : "#8b5a3c";
        g.fillRect(cupX, cupY + cupH * (1 - fill), cupW, cupH * fill + 1);
        if (fill >= 1 && Math.floor(time * 8) % 2) { g.fillStyle = "rgba(253,230,138,.5)"; g.fillRect(cupX, cupY, cupW, cupH); }
        g.restore();
        g.strokeStyle = "#fde68a"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cupX, cupY + cupH * 0.5); g.lineTo(cupX + cupW, cupY + cupH * 0.5); g.stroke();
        g.fillStyle = "#e5e7eb"; g.fillRect(cupX - 2, cupY - 5, cupW + 4, 5);
        g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.arc(cupX + cupW + 1, cupY + 18, 7, -1.2, 1.2); g.stroke();
        g.fillStyle = "#fde68a"; g.font = `700 11.5px ${FONT}`; g.textAlign = "left";
        g.fillText("커피 게이지", cx + 52, cy + 14);
        g.fillStyle = "#fff"; g.font = `800 15px ${FONT}`;
        g.fillText(kart.boost > 0 ? "부스터!" : fill >= 1 ? "더블샷" : fill >= 0.5 ? "원샷" : kart.drift ? "충전 중" : "드리프트", cx + 52, cy + 34);
        g.fillStyle = "rgba(255,255,255,.6)"; g.font = `600 11px ${FONT}`;
        g.fillText(`${Math.round(Math.hypot(kart.vx, kart.vy) * 0.16)} km/h`, cx + 52, cy + 50);

        // 알림
        g.textAlign = "center"; g.textBaseline = "middle";
        let ty = H * 0.2;
        for (const t of toasts) {
          const a = t.t < 0.15 ? t.t / 0.15 : t.t > 1.4 ? Math.max(0, (1.8 - t.t) / 0.4) : 1;
          g.globalAlpha = a;
          g.font = `800 19px ${FONT}`;
          const tw = g.measureText(t.text).width + 28;
          g.fillStyle = "rgba(15,23,42,.66)"; roundRect(W / 2 - tw / 2, ty - 18, tw, 36, 18); g.fill();
          g.fillStyle = t.color; g.fillText(t.text, W / 2, ty + 1);
          ty += 44;
        }
        g.globalAlpha = 1;
        if (state === "race" && wrongT > 0.6) {
          g.font = `800 20px ${FONT}`;
          const text = "반대 방향이에요 · 돌아가 주세요";
          const tw = g.measureText(text).width + 30;
          g.fillStyle = Math.floor(time * 4) % 2 ? "rgba(220,38,38,.92)" : "rgba(153,27,27,.92)";
          roundRect(W / 2 - tw / 2, H * 0.62 - 20, tw, 40, 20); g.fill();
          g.fillStyle = "#fff"; g.fillText(text, W / 2, H * 0.62 + 1);
        }
        // 카운트다운
        if (state === "count" || (state === "race" && goT < 0.7)) {
          const n = state === "count" ? Math.ceil(countT) : 0;
          const text = n > 0 ? String(n) : "출발!";
          const ph = state === "count" ? countT - Math.floor(countT) : 1 - goT / 0.7;
          g.font = `900 ${n > 0 ? 84 : 60}px ${FONT}`;
          g.globalAlpha = Math.min(1, ph * 2 + 0.2);
          g.lineWidth = 8; g.strokeStyle = "rgba(15,23,42,.6)"; g.strokeText(text, W / 2, H * 0.3);
          g.fillStyle = n > 0 ? "#fff" : "#fde68a"; g.fillText(text, W / 2, H * 0.3);
          g.globalAlpha = 1;
        }
        if (state === "finish") {
          g.font = `900 52px ${FONT}`;
          g.lineWidth = 8; g.strokeStyle = "rgba(15,23,42,.6)"; g.strokeText("완주!", W / 2, H * 0.4);
          g.fillStyle = "#fde68a"; g.fillText("완주!", W / 2, H * 0.4);
          g.font = `800 26px ${FONT}`; g.lineWidth = 6; g.strokeText(fmt(raceTime), W / 2, H * 0.4 + 50);
          g.fillStyle = "#fff"; g.fillText(fmt(raceTime), W / 2, H * 0.4 + 50);
        }
      }

      function draw(time) {
        if (!kart) return;
        g.setTransform(1, 0, 0, 1, 0, 0);
        let sxo = 0, syo = 0;
        if (shake > 0) { sxo = (Math.random() - 0.5) * 10 * shake; syo = (Math.random() - 0.5) * 10 * shake; }
        g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (W / 2 - cam.x * scale + sxo), dpr * (H / 2 - cam.y * scale + syo));
        drawWorld(time);
        drawHud(time);
      }

      // ───────────────────────── 루프
      let last = 0, accum = 0, raf = 0, clock = 0;
      function frame(ts) {
        raf = requestAnimationFrame(frame);
        const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
        last = ts;
        if (state === "paused" || state === "ready") { draw(clock); return; }
        clock += dt;
        if (state === "count") {
          countT -= dt;
          if (countT <= 0) { state = "race"; goT = 0; countT = 0; }
        } else if (state === "race") goT += dt;
        accum += dt;
        while (accum >= H_STEP) { physics(H_STEP); accum -= H_STEP; }
        if (state === "finish") finishT += dt;
        // 카메라: 카트를 따라가며 진행 방향을 조금 앞서 봐요
        const lead = 0.42;
        const tx = kart.x + clamp(kart.vx * lead, -170, 170), ty = kart.y + clamp(kart.vy * lead, -170, 170);
        const f = 1 - Math.exp(-dt * 5);
        cam.x += (tx - cam.x) * f; cam.y += (ty - cam.y) * f;
        shake = Math.max(0, shake - dt * 3);
        for (const s of smoke) { s.t += dt; }
        smoke = smoke.filter((s) => s.t < s.life);
        for (const t of toasts) t.t += dt;
        toasts = toasts.filter((t) => t.t < 1.8);
        if (state === "race") $("#gm-kt-total").textContent = fmt(raceTime);
        draw(clock);
      }

      // ───────────────────────── 조작
      const KEYS = { ArrowUp: "gas", KeyW: "gas", ArrowDown: "brake", KeyS: "brake", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "drift", ShiftLeft: "drift", ShiftRight: "drift" };
      function typing(t) { return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable); }
      window.addEventListener("keydown", (e) => {
        if (typing(e.target)) return;
        if (document.querySelector(".hk-dialog__overlay")) return;
        const k = KEYS[e.code];
        if (state === "ready" || state === "paused") {
          if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); state === "ready" ? begin() : resume(); }
          else if (k) e.preventDefault();
          return;
        }
        if ((e.code === "Escape" || e.code === "KeyP") && (state === "race" || state === "count")) { pause(); return; }
        if (k) {
          e.preventDefault();
          inp[k] = true;
          if (k === "gas") autoGas = false;
        }
      });
      window.addEventListener("keyup", (e) => { const k = KEYS[e.code]; if (k) inp[k] = false; });
      window.addEventListener("blur", () => { for (const k in inp) inp[k] = false; });

      stage.querySelectorAll(".gm-kt-btn").forEach((b) => {
        const k = b.dataset.k;
        const down = (e) => {
          e.preventDefault();
          try { b.setPointerCapture(e.pointerId); } catch (_) { /* 무시 */ }
          b.classList.add("is-down");
          autoGas = true;
          if (state === "ready") { begin(); return; }
          inp[k] = true;
        };
        const up = () => { b.classList.remove("is-down"); inp[k] = false; };
        b.addEventListener("pointerdown", down);
        b.addEventListener("pointerup", up);
        b.addEventListener("pointercancel", up);
        b.addEventListener("lostpointercapture", up);
        b.addEventListener("contextmenu", (e) => e.preventDefault());
      });
      board.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
      stage.querySelector(".gm-kt-pad").addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && (state === "race" || state === "count")) pause();
      });

      // ───────────────────────── 겹침 화면
      function showOver(html) { over.innerHTML = html; over.hidden = false; HKUI.refreshIcons(over); }
      function hideOver() { over.hidden = true; over.innerHTML = ""; }

      function showReady() {
        state = "ready";
        reset();
        const myBest = lsGet();
        const coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
        showOver(`<div class="gm-kt-card">
          <span class="gm-kt-badge">${HKUI.icon("car-front", 28, "#fff")}</span>
          <h2>사내 카트 레이스</h2>
          <span class="gm-kt-course">오늘은 ${COURSE.short} · ${COURSE.name}</span>
          <p>회사 건물을 <b>3바퀴</b> 도는 타임어택이에요. 드리프트로 <b>커피 게이지</b>를 채웠다가 놓으면 부스터가 붙어요.</p>
          <dl class="gm-kt-keys">
            ${coarse ? `<dt>가속</dt><dd>자동이에요</dd><dt>◀ ▶</dt><dd>방향 바꾸기</dd><dt>드리프트</dt><dd>꾹 누른 채 돌다가 놓으면 부스터</dd><dt>브레이크</dt><dd>감속 · 오래 누르면 후진</dd>`
              : `<dt>↑ / ↓</dt><dd>가속 / 브레이크·후진</dd><dt>← / →</dt><dd>방향 바꾸기</dd><dt>스페이스·Shift</dt><dd>돌면서 꾹 → 놓으면 부스터</dd><dt>Esc</dt><dd>잠깐 멈추기</dd>`}
          </dl>
          <p class="gm-kt-note" style="margin-top:10px;font-size:12.5px">잔디에선 느려지고 화단에 부딪히면 튕겨요 · 월·수·금 A코스, 화·목 B코스${myBest != null ? ` · 내 최고 랩 <b>${fmt(myBest)}</b>` : ""}</p>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-kt-start">${HKUI.icon("flag", 16, "#fff")} 출발하기</button>
        </div>`);
        $("#gm-kt-start").onclick = begin;
      }

      function showFinishCard(total) {
        const bi = laps.indexOf(bestLap);
        showOver(`<div class="gm-kt-card">
          <span class="gm-kt-badge">${HKUI.icon("flag", 28, "#fff")}</span>
          <h2>완주했어요!</h2>
          <div class="gm-kt-big">${fmt(total)}</div>
          <ul class="gm-kt-laps">${laps.map((l, i) => `<li class="${i === bi ? "is-best" : ""}"><span>${i + 1}랩${i === bi ? " · 최고" : ""}</span><span>${fmt(l)}</span></li>`).join("")}</ul>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-kt-again">${HKUI.icon("rotate-ccw", 16, "#fff")} 다시 달리기</button>
        </div>`);
        $("#gm-kt-again").onclick = () => { document.querySelector(".hk-dialog__overlay")?.remove(); begin(); };
      }

      function begin() {
        hideOver();
        reset();
        state = "count";
        countT = 3;
        last = 0;
      }
      function pause() {
        if (state !== "race" && state !== "count") return;
        pausedFrom = state;
        state = "paused";
        for (const k in inp) inp[k] = false;
        showOver(`<div class="gm-kt-card">
          <span class="gm-kt-badge">${HKUI.icon("pause", 26, "#fff")}</span>
          <h2>잠깐 멈췄어요</h2>
          <p>기록 시계도 함께 멈춰 있어요.</p>
          <button type="button" class="hk-btn hk-btn--primary" id="gm-kt-resume">${HKUI.icon("play", 16, "#fff")} 이어서 달리기</button>
        </div>`);
        $("#gm-kt-resume").onclick = resume;
      }
      function resume() {
        if (state !== "paused") return;
        hideOver();
        state = pausedFrom || "race";
        last = 0;
      }

      ctx.onRestart(begin);

      if (/[?&]debug\b/.test(location.search)) {
        window.__gmKart = { inp, T, CP, get: () => ({ state, kart, lap, nextCp, raceTime, laps, bestLap, autoGas }), setAutoGas: (v) => (autoGas = v), course: COURSE_KEY, rects: rects.length, trees: trees.length, planters: planters.length };
      }

      if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(board);
      window.addEventListener("resize", resize);
      showReady();
      resize();
      raf = requestAnimationFrame(frame);
    },
  });
  </script>
</body>
</html>
