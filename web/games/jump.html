<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>출근 점프 — 점심 라운지</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <style>
    .gm-jp { display: flex; flex-direction: column; gap: 10px; user-select: none; -webkit-user-select: none; }
    .gm-jp-hud { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .gm-jp-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: #fff; border: 1px solid #e3e8ef; font-size: 13.5px; color: #0b3558; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .gm-jp-chip b { font-size: 15px; }
    .gm-jp-chip--stage { background: linear-gradient(135deg, #0ea5e9, #84cc16); color: #fff; border-color: transparent; }
    .gm-jp-chip--score { margin-left: auto; }
    .gm-jp-chip--time.is-warn { background: #fff1f0; border-color: #fecaca; color: #dc2626; }
    .gm-jp-lives { display: inline-flex; gap: 2px; }
    .gm-jp-board { position: relative; border-radius: 16px; overflow: hidden; background: #e0f2fe; box-shadow: 0 1px 3px rgba(15,23,42,.08); touch-action: none; }
    .gm-jp-board canvas { display: block; width: 100%; touch-action: none; }
    .gm-jp-over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(8, 72, 110, .36); }
    .gm-jp-over[hidden] { display: none; }
    .gm-jp-card { width: 100%; max-width: 360px; margin: auto; background: #fff; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 12px 32px rgba(15,23,42,.18); }
    .gm-jp-card h2 { margin: 6px 0 6px; font-size: 21px; color: #0b3558; }
    .gm-jp-card p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; color: #475569; }
    .gm-jp-card .hk-btn { width: 100%; margin-top: 12px; }
    .gm-jp-badge { display: inline-flex; width: 50px; height: 50px; border-radius: 14px; align-items: center; justify-content: center; background: linear-gradient(135deg, #0ea5e9, #84cc16); }
    .gm-jp-tag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #ecfccb; color: #3f6212; font-size: 12.5px; font-weight: 700; }
    .gm-jp-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 10px 0 0; padding: 11px 12px; border-radius: 12px; background: #f0f9ff; text-align: left; font-size: 13px; color: #334155; }
    .gm-jp-keys dt { font-weight: 700; color: #0b3558; }
    .gm-jp-keys dd { margin: 0; }
    @media (hover: none) { .gm-jp-keys .gm-jp-pc { display: none; } }
    .gm-jp-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
    .gm-jp-items span { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 999px; background: #f1f5f9; font-size: 12.5px; color: #334155; font-weight: 600; }
    .gm-jp-sum { list-style: none; margin: 10px 0 0; padding: 0; text-align: left; }
    .gm-jp-sum li { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 10px; font-size: 14px; color: #334155; }
    .gm-jp-sum li:nth-child(odd) { background: #f4f8fb; }
    .gm-jp-sum li b { color: #0b3558; font-variant-numeric: tabular-nums; }
    .gm-jp-big { font-size: 38px; font-weight: 800; letter-spacing: -1px; margin: 6px 0 0; color: #0b3558; font-variant-numeric: tabular-nums; }
    .gm-jp-big small { font-size: 17px; margin-left: 2px; }
    .gm-jp-pad { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 8px; }
    .gm-jp-btn { height: 64px; border: 1px solid #d6e2ec; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; color: #0b3558; font-size: 14px; font-weight: 700; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .gm-jp-btn.is-down { background: #e0f2fe; border-color: #0ea5e9; }
    .gm-jp-btn--jump { background: linear-gradient(135deg, #0ea5e9, #84cc16); border-color: transparent; color: #fff; font-size: 15px; }
    .gm-jp-btn--jump.is-down { background: #0284c7; }
    @media (min-width: 900px) and (hover: hover) { .gm-jp-pad { display: none; } }
    @media (max-width: 480px) {
      .gm-jp-over { padding: 8px; }
      .gm-jp-card { padding: 14px; }
      .gm-jp-card h2 { font-size: 18px; margin: 4px 0; }
      .gm-jp-card p { font-size: 13px; line-height: 1.5; }
      .gm-jp-badge { width: 40px; height: 40px; border-radius: 12px; }
      .gm-jp-keys { font-size: 12px; padding: 9px 10px; margin-top: 6px; }
      .gm-jp-card .hk-btn { margin-top: 10px; }
      .gm-jp-chip { padding: 5px 9px; font-size: 12.5px; }
      .gm-jp-chip b { font-size: 13.5px; }
      .gm-jp-big { font-size: 32px; }
      .gm-jp-sum li { padding: 6px 8px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  HKPlay.mountGame({
    key: "jump",
    setup(stage, ctx) {
      stage.innerHTML = `<div class="gm-jp">
        <div class="gm-jp-hud">
          <span class="gm-jp-chip gm-jp-chip--stage" id="gm-jp-stage">1-1 동네 골목</span>
          <span class="gm-jp-chip gm-jp-lives" id="gm-jp-lives"></span>
          <span class="gm-jp-chip gm-jp-chip--time" id="gm-jp-timechip">${HKUI.icon("alarm-clock", 15, "currentColor")} <b id="gm-jp-time">120</b></span>
          <span class="gm-jp-chip">${HKUI.icon("paperclip", 15, "#0ea5e9")} <b id="gm-jp-clips">0</b></span>
          <span class="gm-jp-chip gm-jp-chip--score"><b id="gm-jp-score">0</b>점</span>
        </div>
        <div class="gm-jp-board" id="gm-jp-board">
          <canvas id="gm-jp-canvas"></canvas>
          <div class="gm-jp-over" id="gm-jp-over"></div>
        </div>
        <div class="gm-jp-pad">
          <button type="button" class="gm-jp-btn" data-b="left" aria-label="왼쪽">${HKUI.icon("chevron-left", 30, "currentColor")}</button>
          <button type="button" class="gm-jp-btn" data-b="right" aria-label="오른쪽">${HKUI.icon("chevron-right", 30, "currentColor")}</button>
          <button type="button" class="gm-jp-btn gm-jp-btn--jump" data-b="jump" aria-label="점프">${HKUI.icon("arrow-big-up", 24, "currentColor")} 점프</button>
        </div>
      </div>`;
      HKUI.refreshIcons(stage);

      const $ = (s) => stage.querySelector(s);
      const canvas = $("#gm-jp-canvas");
      const g = canvas.getContext("2d");
      const board = $("#gm-jp-board");
      const over = $("#gm-jp-over");
      const FONT = getComputedStyle(document.body).fontFamily || "sans-serif";
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const font = (size, w = 700) => (g.font = `${w} ${size}px ${FONT}`);
      function rr(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

      // ───────────────────────── 상수
      const T = 20, ROWS = 12, VH = ROWS * T;
      const GRAV = 1500, JUMP_V = 470, JUMP_V_COFFEE = 505;
      const RUN = 135, RUN_COFFEE = 185;
      const STAGE_TIME = 120;
      const PW = 12, PH = 20;

      // ───────────────────────── 스테이지 설계 (직접 배치)
      // run(a,b,h): a~b-1 열에 h행부터 바닥 · block: 단단한 상자 · plat: 위에서만 올라서는 발판
      // mover(c,r,len,축,범위칸,주기초,위상) · clips(c,r,개수,간격,행변화) · spam(c) · bell(c,r,범위)
      const STAGES = [
        {
          name: "1-1 동네 골목", theme: 0, cols: 192, goalLabel: "지하철",
          build(b) {
            b.run(0, 22, 9); b.clips(8, 7, 4); b.plat(13, 6, 3); b.clips(13, 5, 3); b.spam(19);
            b.run(24, 40, 9); b.coffee(26, 6); b.block(30, 7, 2, 2); b.clips(30, 6, 2); b.spam(35);
            b.run(40, 42, 8); b.run(42, 44, 7); b.run(44, 46, 6); b.run(46, 54, 6); b.clips(47, 5, 6); b.bell(50, 3, 1.5);
            b.run(54, 56, 7); b.run(56, 58, 8); b.run(58, 66, 9); b.spam(62);
            b.clips(67, 6, 2, 1, -1);
            b.run(69, 84, 9); b.badge(72, 6); b.plat(75, 6, 4); b.plat(80, 4, 3); b.clips(80, 3, 3); b.spam(78); b.spam(83);
            b.run(84, 96, 9); b.check(87); b.clips(90, 7, 4);
            b.mover(96, 9, 3, "x", 5, 4.4); b.clips(99, 5, 4);
            b.run(104, 120, 9); b.bell(108, 5, 1.5); b.bell(114, 4, 2); b.clips(106, 7, 6, 2);
            b.run(120, 140, 9); b.block(124, 7, 1, 2); b.block(128, 7, 1, 2); b.spam(132); b.spam(136); b.clips(130, 7, 8);
            b.run(140, 142, 8); b.run(142, 150, 7); b.clips(144, 5, 4);
            b.run(153, 160, 7); b.bell(156, 3, 1.5); b.clips(151, 4, 2);
            b.run(160, 162, 8); b.run(162, 192, 9); b.coffee(165, 7); b.plat(170, 6, 6); b.clips(170, 5, 6); b.spam(171); b.spam(175); b.spam(179);
            b.goal(186);
          },
        },
        {
          name: "1-2 지하철역", theme: 1, cols: 196, goalLabel: "출구",
          build(b) {
            b.run(0, 18, 9); b.clips(6, 7, 5); b.plat(14, 7, 3); b.spam(12);
            b.run(18, 20, 8); b.run(20, 22, 7); b.run(22, 24, 6); b.run(24, 36, 6); b.block(28, 5, 1, 1); b.block(32, 5, 1, 1); b.clips(25, 4, 6, 2); b.bell(30, 2, 1.5);
            b.run(36, 38, 7); b.run(38, 40, 8); b.run(40, 50, 9); b.spam(44); b.spam(47);
            b.mover(50, 8, 3, "x", 5, 4); b.clips(52, 5, 5);
            b.run(58, 74, 9); b.badge(60, 6); b.spam(64); b.plat(66, 6, 4); b.clips(66, 5, 4); b.bell(71, 4, 1.5);
            b.run(74, 90, 9); b.check(75); b.coffee(77, 7); b.spam(80); b.spam(84); b.spam(87);
            b.clips(91, 6, 2); b.run(93, 100, 9); b.spam(97); b.clips(101, 6, 2);
            b.run(103, 112, 9);
            b.run(112, 130, 9); b.mover(115, 8, 2, "y", 4.6, 3.6); b.block(118, 4, 2, 5); b.clips(118, 3, 2); b.spam(124); b.bell(127, 5, 1.5);
            b.run(130, 150, 9); b.plat(134, 7, 2); b.plat(137, 5, 2); b.plat(140, 3, 3); b.clips(140, 2, 3); b.spam(138); b.spam(145);
            b.run(153, 175, 9); b.bell(158, 5, 1.5); b.bell(163, 6, 1.5); b.bell(168, 4, 1.5); b.clips(156, 7, 9, 2);
            b.run(175, 177, 8); b.run(177, 179, 7); b.run(179, 181, 6); b.run(181, 196, 6); b.clips(182, 4, 4);
            b.goal(190);
          },
        },
        {
          name: "1-3 회사 로비", theme: 2, cols: 192, goalLabel: "우리 팀",
          build(b) {
            b.run(0, 30, 9); b.clips(5, 7, 5); b.spam(12); b.block(18, 7, 4, 2); b.clips(18, 6, 4); b.spam(25); b.spam(28);
            b.mover(30, 9, 3, "x", 5, 3.6); b.clips(33, 5, 3);
            b.run(38, 56, 9); b.badge(40, 6); b.bell(44, 5, 1.5); b.bell(48, 3, 1.5); b.clips(50, 7, 4);
            b.mover(57, 8, 3, "y", 4, 4);
            b.run(60, 72, 5); b.clips(61, 4, 10); b.spam(64); b.spam(68);
            b.run(72, 74, 6); b.run(74, 76, 7); b.run(76, 78, 8); b.run(78, 92, 9); b.coffee(80, 7); b.check(82); b.spam(86); b.spam(89);
            b.run(95, 98, 9); b.bell(96, 5, 1); b.run(101, 118, 9); b.bell(100, 3, 1); b.clips(93, 6, 2); b.clips(99, 6, 2);
            b.plat(105, 7, 3); b.plat(110, 6, 3); b.plat(115, 5, 3); b.clips(105, 6, 3); b.clips(110, 5, 3); b.clips(115, 4, 3); b.spam(108); b.spam(113);
            b.run(118, 140, 9); b.spam(124); b.block(128, 7, 2, 2); b.bell(132, 4, 2); b.spam(136); b.clips(122, 7, 5);
            b.mover(142, 8, 2, "y", 4, 3, 0); b.mover(146, 8, 2, "y", 4, 3, 0.5); b.clips(144, 3, 2);
            b.run(150, 170, 9); b.spam(154); b.spam(157); b.spam(160); b.bell(165, 4, 1.5); b.clips(152, 6, 8, 2);
            b.run(170, 172, 8); b.run(172, 192, 7); b.coffee(173, 5); b.clips(176, 5, 5);
            b.goal(185);
          },
        },
      ];

      function buildLevel(def) {
        const L = { def, cols: def.cols, grid: new Uint8Array(def.cols * ROWS), spam: [], bells: [], clips: [], items: [], movers: [], checks: [], goal: def.cols * T };
        const set = (c, r, v) => { if (c >= 0 && c < L.cols && r >= 0 && r < ROWS) L.grid[r * L.cols + c] = v; };
        const groundTop = (c) => { for (let r = 0; r < ROWS; r++) if (L.grid[r * L.cols + c]) return r; return ROWS; };
        const b = {
          run(a, z, h) { for (let c = a; c < z; c++) for (let r = h; r < ROWS; r++) set(c, r, 1); },
          block(c, r, w, h) { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) set(c + i, r + j, 2); },
          plat(c, r, len) { for (let i = 0; i < len; i++) set(c + i, r, 3); },
          clips(c, r, n, step = 1, dr = 0) { for (let i = 0; i < n; i++) L.clips.push({ x: (c + i * step) * T + T / 2, y: (r + i * dr) * T + T / 2, got: false }); },
          spam(c) { L.spam.push({ c }); },
          bell(c, r, range = 1.5) { L.bells.push({ x0: c * T + 3, y0: r * T + 3, range: range * T, x: c * T + 3, y: r * T + 3, w: 14, h: 14, t: c * 0.7, dead: 0, alive: true }); },
          coffee(c, r) { L.items.push({ kind: "coffee", x: c * T + T / 2, y: r * T + T / 2, got: false }); },
          badge(c, r) { L.items.push({ kind: "badge", x: c * T + T / 2, y: r * T + T / 2, got: false }); },
          mover(c, r, len, ax, range, period, phase = 0) { L.movers.push({ x0: c * T, y0: r * T, x: c * T, y: r * T, w: len * T, ax, range: range * T, period, phase, dx: 0, dy: 0 }); },
          check(c) { L.checks.push({ x: c * T, on: false }); },
          goal(c) { L.goal = c * T; },
        };
        def.build(b);
        L.spam = L.spam.map(({ c }) => {
          const r = groundTop(c);
          return { x: c * T + 3, y: r * T - 12, w: 14, h: 12, vx: -1, vy: 0, active: false, alive: true, dead: 0, rot: 0, ground: false };
        });
        return L;
      }

      // ───────────────────────── 상태
      let W = 360, H = 230, S = 1, VW = 380, dpr = 1;
      let state = "ready"; // ready | play | clear | dying | over | paused
      let stageIdx = 0, L = null, P = null, camX = 0;
      let lives = 3, score = 0, clipsN = 0, kills = 0, clears = 0, timeLeft = STAGE_TIME;
      let clock = 0, banner = 0, floats = [], respawnX = 2 * T, clearT = 0, clearBonus = 0, dieT = 0, dieKind = "";
      const input = { left: false, right: false, jump: false, jumpPressed: false };

      function newPlayer(x) {
        const r = groundTopAt(Math.floor((x + PW / 2) / T));
        return { x, y: r * T - PH, vx: 0, vy: 0, ground: false, face: 1, coyote: 0, buffer: 0, inv: 1.2, coffee: 0, badge: P ? P.badge : false, onMover: null, run: 0 };
      }
      function groundTopAt(c) { for (let r = 0; r < ROWS; r++) { const t = tile(c, r); if (t === 1 || t === 2) return r; } return 9; }

      function tile(c, r) {
        if (c < 0 || c >= L.cols) return 1;
        if (r < 0 || r >= ROWS) return 0;
        return L.grid[r * L.cols + c];
      }
      const solid = (t) => t === 1 || t === 2;

      // ───────────────────────── 크기
      function resize() {
        const w = Math.round(board.clientWidth || stage.clientWidth || 360);
        const h = Math.round(clamp(w * 0.62, 232, 360));
        dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        W = w; H = h; S = h / VH; VW = w / S;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.height = h + "px";
        if (!over.hidden) fitOver();
        draw();
      }

      // ───────────────────────── 충돌
      function moveX(o, dx) {
        o.x += dx;
        const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
        if (dx > 0) {
          const c = Math.floor((o.x + o.w - 0.01) / T);
          for (let r = top; r <= bot; r++) if (solid(tile(c, r))) { o.x = c * T - o.w; return true; }
        } else if (dx < 0) {
          const c = Math.floor(o.x / T);
          for (let r = top; r <= bot; r++) if (solid(tile(c, r))) { o.x = (c + 1) * T; return true; }
        }
        return false;
      }
      function moveY(o, dy) {
        const prevBottom = o.y + o.h;
        o.y += dy;
        o.ground = false;
        const l = Math.floor(o.x / T), r2 = Math.floor((o.x + o.w - 0.01) / T);
        if (dy > 0) {
          const r = Math.floor((o.y + o.h - 0.01) / T);
          for (let c = l; c <= r2; c++) {
            const t = tile(c, r);
            if (solid(t) || (t === 3 && prevBottom <= r * T + 0.5)) { o.y = r * T - o.h; o.vy = 0; o.ground = true; return; }
          }
        } else if (dy < 0) {
          const r = Math.floor(o.y / T);
          for (let c = l; c <= r2; c++) if (solid(tile(c, r))) { o.y = (r + 1) * T; o.vy = 0; return; }
        }
      }
      const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

      // ───────────────────────── 진행
      function startStage(i, keepTime) {
        stageIdx = i;
        L = buildLevel(STAGES[i]);
        respawnX = 2 * T;
        P = null;
        P = newPlayer(respawnX);
        P.badge = false;
        camX = 0;
        if (!keepTime) timeLeft = STAGE_TIME;
        banner = 2;
        floats = [];
        state = "play";
        updateHud(true);
      }

      function hurt() {
        if (P.inv > 0 || state !== "play") return;
        if (P.badge) {
          P.badge = false; P.inv = 1.6; P.vy = -220; P.vx = -P.face * 120;
          floats.push({ x: P.x, y: P.y - 6, t: 0, text: "사원증 덕분에 버텼어요!", color: "#0284c7" });
          return;
        }
        // 옆에서 닿으면 그 자리에서 목숨 -1 (잠깐 깜빡이며 무적)
        if (lives > 1) {
          lives--;
          P.inv = 2; P.vy = -240; P.vx = -P.face * 140;
          floats.push({ x: P.x, y: P.y - 6, t: 0, text: "앗! 목숨 -1", color: "#dc2626" });
          updateHud(true);
          return;
        }
        loseLife("hit");
      }
      function loseLife(kind) {
        lives--;
        updateHud(true);
        state = "dying"; dieT = 0; dieKind = kind;
        if (kind === "hit") { P.vy = -330; P.vx = 0; }
      }
      function afterDie() {
        if (lives <= 0) return gameOver(false);
        if (dieKind === "time") timeLeft = STAGE_TIME;
        P = newPlayer(respawnX);
        P.badge = false; P.inv = 2;
        camX = clamp(P.x - VW * 0.38, 0, L.cols * T - VW);
        state = "play";
        updateHud(true);
      }

      function addScore(n, x, y, text, color) {
        score += n;
        if (text) floats.push({ x, y, t: 0, text, color: color || "#0b3558" });
        updateHud();
      }

      function update(dt) {
        clock += dt;
        if (banner > 0) banner -= dt;
        floats.forEach((f) => (f.t += dt));
        floats = floats.filter((f) => f.t < 1.1);

        // 움직이는 발판
        L.movers.forEach((m) => {
          const k = 0.5 - 0.5 * Math.cos(((clock / m.period) + m.phase) * Math.PI * 2);
          const nx = m.ax === "x" ? m.x0 + m.range * k : m.x0;
          const ny = m.ax === "y" ? m.y0 - m.range * k : m.y0;
          m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
        });

        if (state === "dying") {
          dieT += dt;
          if (dieKind === "hit") { P.vy += GRAV * dt; P.y += P.vy * dt; }
          if (dieT > 1.3) afterDie();
          return;
        }
        if (state === "clear") {
          clearT += dt;
          if (timeLeft > 0 && clearT > 0.6) {
            const step = Math.min(timeLeft, Math.max(1, Math.ceil(dt * 90)));
            timeLeft -= step; clearBonus += step * 10; score += step * 10;
            updateHud();
          }
          P.vx = 40; P.x += P.vx * dt; P.run += dt * 8;
          if (clearT > 0.6 && timeLeft <= 0 && clearT > 2.2) stageClearCard();
          return;
        }
        if (state !== "play") return;

        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; loseLife("time"); return; }

        // ── 플레이어
        const p = P;
        p.inv = Math.max(0, p.inv - dt);
        p.coffee = Math.max(0, p.coffee - dt);
        const maxV = p.coffee > 0 ? RUN_COFFEE : RUN;
        const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        if (dir) {
          const acc = p.ground ? 1100 : 760;
          if (Math.sign(p.vx) !== dir) p.vx += dir * acc * 1.6 * dt;
          else p.vx += dir * acc * dt;
          p.vx = clamp(p.vx, -maxV, maxV);
          p.face = dir;
        } else if (p.ground) {
          const f = 1500 * dt;
          p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
        } else p.vx *= 1 - 1.5 * dt;
        if (Math.abs(p.vx) > maxV) p.vx = Math.sign(p.vx) * Math.max(maxV, Math.abs(p.vx) - 400 * dt);

        if (input.jumpPressed) { p.buffer = 0.12; input.jumpPressed = false; }
        p.coyote = p.ground ? 0.09 : p.coyote - dt;
        if (p.buffer > 0 && p.coyote > 0) {
          p.vy = -(p.coffee > 0 ? JUMP_V_COFFEE : JUMP_V);
          p.buffer = 0; p.coyote = 0; p.ground = false; p.onMover = null;
        }
        p.buffer -= dt;
        const gmul = p.vy < 0 && !input.jump ? 2.7 : 1;
        p.vy = Math.min(560, p.vy + GRAV * gmul * dt);

        if (p.onMover) { p.x += p.onMover.dx; p.y += p.onMover.dy; }
        const o = { x: p.x, y: p.y, w: PW, h: PH, vy: p.vy, ground: false };
        if (moveX(o, p.vx * dt)) p.vx = 0;
        const prevBottom = o.y + PH;
        moveY(o, p.vy * dt);
        p.x = Math.max(0, o.x); p.y = o.y; p.vy = o.vy; p.ground = o.ground;
        p.onMover = null;
        if (p.vy >= 0) {
          for (const m of L.movers) {
            const tol = Math.abs(m.dy) + 2;
            if (p.x + PW > m.x + 1 && p.x < m.x + m.w - 1 && prevBottom <= m.y + tol && p.y + PH >= m.y) {
              p.y = m.y - PH; p.vy = 0; p.ground = true; p.onMover = m; break;
            }
          }
        }
        p.run += Math.abs(p.vx) * dt * 0.09;

        if (p.y > VH + 30) { loseLife("fall"); return; }

        // 중간 지점
        L.checks.forEach((c) => { if (!c.on && p.x > c.x) { c.on = true; respawnX = c.x; floats.push({ x: c.x, y: 150, t: 0, text: "중간 지점 저장!", color: "#4d7c0f" }); } });

        // 클립·아이템
        const pb = { x: p.x, y: p.y, w: PW, h: PH };
        L.clips.forEach((c) => {
          if (c.got) return;
          if (Math.abs(c.x - (p.x + PW / 2)) < 11 && Math.abs(c.y - (p.y + PH / 2)) < 15) { c.got = true; clipsN++; addScore(10); }
        });
        L.items.forEach((it) => {
          if (it.got) return;
          if (Math.abs(it.x - (p.x + PW / 2)) < 13 && Math.abs(it.y - (p.y + PH / 2)) < 17) {
            it.got = true;
            if (it.kind === "coffee") { p.coffee = 7; floats.push({ x: it.x, y: it.y - 10, t: 0, text: "커피 충전! 잠깐 빨라져요", color: "#92400e" }); }
            else { p.badge = true; floats.push({ x: it.x, y: it.y - 10, t: 0, text: "사원증 착용! 한 번 버텨요", color: "#0284c7" }); }
          }
        });

        // 적
        const near = (x) => x > camX - 60 && x < camX + VW + 60;
        L.spam.forEach((e) => {
          if (!e.alive) { e.dead += dt; return; }
          if (!e.active) { if (e.x < camX + VW + 30) e.active = true; else return; }
          e.vy = Math.min(560, e.vy + GRAV * dt);
          const sp = 30 + stageIdx * 6;
          if (moveX(e, e.vx * sp * dt)) e.vx *= -1;
          moveY(e, e.vy * dt);
          if (e.ground) {
            const fx = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
            const t = tile(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T));
            if (!t) e.vx *= -1;
          }
          e.rot += e.vx * sp * dt * 0.12;
          if (e.y > VH + 40) e.alive = false;
          if (!near(e.x)) return;
          stomp(e, prevBottom);
        });
        L.bells.forEach((e) => {
          if (!e.alive) { e.dead += dt; return; }
          e.t += dt;
          e.x = e.x0 + Math.sin(e.t * 1.2) * e.range;
          e.y = e.y0 + Math.sin(e.t * 3.1) * 5;
          if (near(e.x)) stomp(e, prevBottom);
        });

        // 골인
        if (p.x + PW / 2 >= L.goal + T * 0.6) {
          state = "clear"; clearT = 0; clearBonus = 0; timeLeft = Math.floor(timeLeft);
          clears++; score += 1000;
          floats.push({ x: L.goal, y: 100, t: 0, text: "+1000 도착!", color: "#4d7c0f" });
          updateHud(true);
        }

        // 카메라
        const target = clamp(p.x - VW * 0.38 + p.face * 18, 0, Math.max(0, L.cols * T - VW));
        camX += (target - camX) * Math.min(1, dt * 6);
        updateHud();
      }

      function stomp(e, prevBottom) {
        const p = P;
        const pb = { x: p.x, y: p.y, w: PW, h: PH };
        if (!overlap(pb, e)) return;
        if (p.vy > 0 && prevBottom <= e.y + 7) {
          e.alive = false; e.dead = 0;
          kills++;
          p.vy = input.jump ? -440 : -280;
          p.ground = false;
          addScore(100, e.x, e.y - 6, "+100", "#0b3558");
          return;
        }
        hurt();
      }

      // ───────────────────────── HUD
      const hud = { stage: $("#gm-jp-stage"), lives: $("#gm-jp-lives"), time: $("#gm-jp-time"), timechip: $("#gm-jp-timechip"), clips: $("#gm-jp-clips"), score: $("#gm-jp-score") };
      let hudCache = {};
      function updateHud(force) {
        const t = Math.ceil(timeLeft);
        const v = { stage: STAGES[stageIdx].name, lives, t, clipsN, score };
        if (force || v.stage !== hudCache.stage) hud.stage.textContent = v.stage;
        if (force || v.lives !== hudCache.lives) {
          hud.lives.innerHTML = [0, 1, 2].map((i) => `<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.8-9.2C.6 8.4 2.6 4.5 6.4 4.5c2.3 0 3.9 1.3 5.6 3.3 1.7-2 3.3-3.3 5.6-3.3 3.8 0 5.8 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="${i < lives ? "#ef4444" : "#e2e8f0"}"/></svg>`).join("");
          hud.lives.setAttribute("aria-label", `목숨 ${lives}개`);
        }
        if (force || v.t !== hudCache.t) { hud.time.textContent = t; hud.timechip.classList.toggle("is-warn", t <= 20 && state === "play"); }
        if (force || v.clipsN !== hudCache.clipsN) hud.clips.textContent = clipsN;
        if (force || v.score !== hudCache.score) hud.score.textContent = score.toLocaleString("ko-KR");
        hudCache = v;
      }

      // ───────────────────────── 입력
      function isTyping(t) { return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable); }
      const KEYS = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "jump", Space: "jump", KeyW: "jump", KeyZ: "jump" };
      let overlayAction = null;
      window.addEventListener("keydown", (e) => {
        if (isTyping(e.target)) return;
        if (document.querySelector(".hk-dialog__overlay")) return;
        const k = KEYS[e.code];
        if (!k && e.code !== "Enter" && e.code !== "ArrowDown") return;
        e.preventDefault();
        if (!over.hidden) {
          if ((e.code === "Enter" || e.code === "Space") && !e.repeat && overlayAction) overlayAction();
          return;
        }
        if (!k) return;
        if (k === "jump") { if (!input.jump && !e.repeat) input.jumpPressed = true; input.jump = true; }
        else input[k] = true;
      });
      window.addEventListener("keyup", (e) => {
        const k = KEYS[e.code];
        if (!k) return;
        input[k] = false;
      });
      window.addEventListener("blur", () => { input.left = input.right = input.jump = false; });

      stage.querySelectorAll(".gm-jp-btn").forEach((b) => {
        const k = b.dataset.b;
        b.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          try { b.setPointerCapture(e.pointerId); } catch (_) {}
          b.classList.add("is-down");
          if (!over.hidden) return;
          if (k === "jump") { if (!input.jump) input.jumpPressed = true; input.jump = true; }
          else input[k] = true;
        });
        const up = () => { b.classList.remove("is-down"); input[k] = false; };
        b.addEventListener("pointerup", up);
        b.addEventListener("pointercancel", up);
        b.addEventListener("lostpointercapture", up);
        b.addEventListener("contextmenu", (e) => e.preventDefault());
        b.addEventListener("click", (e) => e.preventDefault());
      });
      board.addEventListener("touchmove", (e) => { if (state === "play") e.preventDefault(); }, { passive: false });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && (state === "play" || state === "dying" || state === "clear")) pause();
      });

      // ───────────────────────── 겹침 화면
      function showOver(html, action) {
        over.innerHTML = html;
        over.hidden = false;
        overlayAction = action || null;
        HKUI.refreshIcons(over);
        const btn = over.querySelector("[data-go]");
        if (btn && action) btn.onclick = action;
        fitOver();
      }
      function fitOver() {
        board.style.minHeight = "";
        if (over.hidden || !over.firstElementChild) return;
        const need = over.firstElementChild.offsetHeight + (W < 480 ? 16 : 28);
        if (need > H) board.style.minHeight = need + "px";
      }
      function hideOver() { over.hidden = true; over.innerHTML = ""; overlayAction = null; board.style.minHeight = ""; }

      function resetGame() {
        lives = 3; score = 0; clipsN = 0; kills = 0; clears = 0;
        input.left = input.right = input.jump = input.jumpPressed = false;
        stageIdx = 0;
        L = buildLevel(STAGES[0]);
        P = null; P = newPlayer(2 * T); P.inv = 0;
        camX = 0; timeLeft = STAGE_TIME; banner = 0; floats = [];
        updateHud(true);
      }

      function showReady() {
        resetGame();
        state = "ready";
        showOver(`<div class="gm-jp-card">
          <span class="gm-jp-badge">${HKUI.icon("flag-triangle-right", 24, "#fff")}</span>
          <h2>출근 점프</h2>
          <p>집에서 회사까지 <b>골목 → 지하철역 → 로비</b> 3구간을 달려요. 스팸 메일·알림 벨은 <b>위에서 밟으면</b> 처치, 옆에서 닿으면 목숨이 줄어요.</p>
          <div class="gm-jp-items">
            <span>${HKUI.icon("paperclip", 14, "#0ea5e9")}클립 +10</span>
            <span>${HKUI.icon("coffee", 14, "#92400e")}커피 = 잠깐 빨라짐</span>
            <span>${HKUI.icon("id-card", 14, "#0284c7")}사원증 = 한 번 버팀</span>
          </div>
          <dl class="gm-jp-keys">
            <dt class="gm-jp-pc">PC</dt><dd class="gm-jp-pc">← → 이동 · 스페이스/↑ 점프 (길게 = 높이)</dd>
            <dt>모바일</dt><dd>아래 ← → 버튼과 점프 버튼</dd>
          </dl>
          <button type="button" class="hk-btn hk-btn--primary" data-go>${HKUI.icon("play", 16, "#fff")} 출근하기</button>
        </div>`, () => { hideOver(); startStage(0); });
        draw();
      }

      function stageClearCard() {
        state = "result";
        const lastStage = stageIdx === STAGES.length - 1;
        if (lastStage) return gameOver(true);
        showOver(`<div class="gm-jp-card">
          <span class="gm-jp-tag">${STAGES[stageIdx].name} 통과</span>
          <h2>${stageIdx === 0 ? "지하철역에 도착했어요" : "회사 앞이에요!"}</h2>
          <ul class="gm-jp-sum">
            <li><span>구간 통과</span><b>+1,000</b></li>
            <li><span>남은 시간 보너스</span><b>+${clearBonus.toLocaleString("ko-KR")}</b></li>
          </ul>
          <div class="gm-jp-big">${score.toLocaleString("ko-KR")}<small>점</small></div>
          <button type="button" class="hk-btn hk-btn--primary" data-go>${HKUI.icon("chevron-right", 16, "#fff")} 다음: ${STAGES[stageIdx + 1].name}</button>
        </div>`, () => { hideOver(); startStage(stageIdx + 1); });
      }

      function gameOver(win) {
        state = "over";
        updateHud(true);
        showOver(`<div class="gm-jp-card">
          <span class="gm-jp-badge">${HKUI.icon(win ? "briefcase" : "alarm-clock-off", 24, "#fff")}</span>
          <h2>${win ? "출근 완료! 오늘도 무사히 도착했어요" : "오늘은 여기까지… 지각이에요"}</h2>
          <ul class="gm-jp-sum">
            <li><span>클립 ${clipsN}개 × 10</span><b>${(clipsN * 10).toLocaleString("ko-KR")}</b></li>
            <li><span>처치 ${kills}번 × 100</span><b>${(kills * 100).toLocaleString("ko-KR")}</b></li>
            <li><span>구간 통과 ${clears}개 × 1,000</span><b>${(clears * 1000).toLocaleString("ko-KR")}</b></li>
            <li><span>남은 시간 보너스</span><b>${(score - clipsN * 10 - kills * 100 - clears * 1000).toLocaleString("ko-KR")}</b></li>
          </ul>
          <div class="gm-jp-big">${score.toLocaleString("ko-KR")}<small>점</small></div>
          <button type="button" class="hk-btn hk-btn--secondary" data-go>${HKUI.icon("rotate-ccw", 16, "currentColor")} 처음부터 다시</button>
        </div>`, showReady);
        ctx.submit(score);
      }

      let pausedFrom = "play";
      function pause() {
        input.left = input.right = input.jump = false;
        pausedFrom = state;
        state = "paused";
        showOver(`<div class="gm-jp-card"><span class="gm-jp-badge">${HKUI.icon("pause", 24, "#fff")}</span><h2>잠시 멈췄어요</h2><p>시간도 같이 멈춰 있어요. 준비되면 이어서 달려요.</p>
          <button type="button" class="hk-btn hk-btn--primary" data-go>${HKUI.icon("play", 16, "#fff")} 계속하기</button></div>`, () => { hideOver(); state = pausedFrom; });
      }

      ctx.onRestart(() => { hideOver(); showReady(); });

      // ───────────────────────── 그리기: 배경
      const THEMES = [
        { sky: ["#7dd3fc", "#e0f2fe"], ground: "#94a3b8", top: "#84cc16", topEdge: "#65a30d", body2: "#a8b3c2", block: "#d6a26b", blockLine: "#b07d45", plank: "#7c5a3a" },
        { sky: ["#e0f2fe", "#f0f9ff"], ground: "#94a3b8", top: "#cbd5e1", topEdge: "#facc15", body2: "#8a97a8", block: "#475569", blockLine: "#334155", plank: "#0ea5e9" },
        { sky: ["#f8fafc", "#eef2f7"], ground: "#d4d4d8", top: "#f4f4f5", topEdge: "#a1a1aa", body2: "#c8c8cf", block: "#334155", blockLine: "#a16207", plank: "#7dd3fc" },
      ];

      function drawBackground(th) {
        const t = THEMES[th];
        const grd = g.createLinearGradient(0, 0, 0, VH);
        grd.addColorStop(0, t.sky[0]); grd.addColorStop(1, t.sky[1]);
        g.fillStyle = grd; g.fillRect(0, 0, VW, VH);
        if (th === 0) {
          // 구름
          g.fillStyle = "rgba(255,255,255,.85)";
          for (let i = 0; i < 12; i++) {
            const x = ((i * 190 - camX * 0.15) % (VW + 200) + VW + 200) % (VW + 200) - 100;
            const y = 24 + hash(i) * 40;
            g.beginPath(); g.arc(x, y, 12, 0, 7); g.arc(x + 14, y - 5, 14, 0, 7); g.arc(x + 30, y, 11, 0, 7); g.fill();
          }
          // 먼 아파트
          for (let i = -1; i < 40; i++) {
            const x = i * 70 - (camX * 0.3) % 70;
            const k = Math.floor(camX * 0.3 / 70) + i;
            const h = 50 + hash(k) * 50;
            g.fillStyle = "#bfdbfe"; g.fillRect(x, 150 - h, 52, h + 40);
            g.fillStyle = "#dbeafe";
            for (let wy = 150 - h + 8; wy < 170; wy += 14) for (let wx = x + 7; wx < x + 48; wx += 13) g.fillRect(wx, wy, 7, 7);
            if (x > VW + 70) break;
          }
          // 가까운 집과 나무
          for (let i = -1; i < 30; i++) {
            const k = Math.floor(camX * 0.6 / 120) + i;
            const x = k * 120 - camX * 0.6;
            if (x > VW + 120) break;
            const hx = x + 10;
            g.fillStyle = hash(k + 3) > 0.5 ? "#fde68a" : "#fecaca";
            g.fillRect(hx, 132, 54, 48);
            g.fillStyle = hash(k + 3) > 0.5 ? "#0ea5e9" : "#64748b";
            g.beginPath(); g.moveTo(hx - 6, 134); g.lineTo(hx + 27, 110); g.lineTo(hx + 60, 134); g.closePath(); g.fill();
            g.fillStyle = "#fff"; g.fillRect(hx + 8, 144, 12, 10); g.fillRect(hx + 34, 144, 12, 10);
            g.fillStyle = "#4d7c0f"; g.fillRect(x + 90, 150, 4, 30);
            g.fillStyle = "#84cc16"; g.beginPath(); g.arc(x + 92, 144, 14, 0, 7); g.fill();
            g.fillStyle = "#a3e635"; g.beginPath(); g.arc(x + 87, 140, 7, 0, 7); g.fill();
          }
        } else if (th === 1) {
          // 타일 벽 + 노선 띠
          g.fillStyle = "#f1f5f9"; g.fillRect(0, 0, VW, VH);
          g.strokeStyle = "#e2e8f0"; g.lineWidth = 1;
          const off = (camX * 0.5) % 16;
          for (let x = -off; x < VW; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, VH); g.stroke(); }
          for (let y = 0; y < VH; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(VW, y); g.stroke(); }
          g.fillStyle = "#0ea5e9"; g.fillRect(0, 62, VW, 10);
          g.fillStyle = "#84cc16"; g.fillRect(0, 72, VW, 5);
          // 기둥과 안내판
          for (let i = -1; i < 30; i++) {
            const k = Math.floor(camX * 0.5 / 160) + i;
            const x = k * 160 - camX * 0.5;
            if (x > VW + 160) break;
            g.fillStyle = "#cbd5e1"; g.fillRect(x, 0, 22, VH);
            g.fillStyle = "#94a3b8"; g.fillRect(x + 18, 0, 4, VH);
            g.fillStyle = "#0f172a"; rr(x + 50, 20, 70, 24, 4); g.fill();
            font(10, 800); g.fillStyle = k % 2 ? "#facc15" : "#a3e635"; g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText(k % 3 === 0 ? "타는 곳 →" : k % 3 === 1 ? "출구 →" : "환승 ←", x + 85, 32);
          }
        } else {
          // 로비: 큰 유리창 너머 도시
          g.fillStyle = "#f8fafc"; g.fillRect(0, 0, VW, VH);
          for (let i = -1; i < 30; i++) {
            const k = Math.floor(camX * 0.45 / 130) + i;
            const x = k * 130 - camX * 0.45;
            if (x > VW + 130) break;
            const sky = g.createLinearGradient(0, 14, 0, 150);
            sky.addColorStop(0, "#7dd3fc"); sky.addColorStop(1, "#e0f2fe");
            g.fillStyle = sky; g.fillRect(x + 8, 14, 110, 136);
            g.fillStyle = "#bae6fd";
            for (let j = 0; j < 4; j++) { const h = 30 + hash(k * 4 + j) * 60; g.fillRect(x + 12 + j * 27, 150 - h, 22, h); }
            g.fillStyle = "#e2e8f0"; g.fillRect(x + 8, 80, 110, 3); g.fillRect(x + 62, 14, 3, 136);
            g.strokeStyle = "#cbd5e1"; g.lineWidth = 3; g.strokeRect(x + 8, 14, 110, 136);
            // 화분
            g.fillStyle = "#a16207"; rr(x + 118, 162, 12, 18, 3); g.fill();
            g.fillStyle = "#65a30d"; g.beginPath(); g.ellipse(x + 124, 152, 8, 13, 0, 0, 7); g.fill();
          }
        }
      }

      function drawTiles(th) {
        const t = THEMES[th];
        const c0 = Math.max(0, Math.floor(camX / T) - 1), c1 = Math.min(L.cols - 1, Math.ceil((camX + VW) / T) + 1);
        for (let c = c0; c <= c1; c++) {
          const x = c * T - camX;
          // 구멍 바닥 표시
          if (!tile(c, ROWS - 1)) {
            if (th === 1) { g.fillStyle = "#334155"; g.fillRect(x, VH - 14, T, 14); g.fillStyle = "#94a3b8"; g.fillRect(x, VH - 10, T, 2); g.fillRect(x, VH - 4, T, 2); }
            else {
              const pg = g.createLinearGradient(0, 9 * T, 0, VH);
              pg.addColorStop(0, "rgba(15,23,42,0)"); pg.addColorStop(1, "rgba(15,23,42,.45)");
              g.fillStyle = pg; g.fillRect(x, 9 * T, T, VH - 9 * T);
            }
          }
          for (let r = 0; r < ROWS; r++) {
            const v = tile(c, r);
            if (!v) continue;
            const y = r * T;
            if (v === 1) {
              const isTop = tile(c, r - 1) !== 1;
              g.fillStyle = t.ground;
              g.fillRect(x, y, T, T);
              if ((c + r) % 2) { g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(x, y, T, T); }
              if (!isTop && hash(c * 13 + r) > 0.7) { g.fillStyle = "rgba(15,23,42,.08)"; g.fillRect(x + 4 + hash(c + r) * 8, y + 6, 3, 2); }
              if (isTop) {
                g.fillStyle = t.top; g.fillRect(x, y, T, 6);
                g.fillStyle = t.topEdge; g.fillRect(x, y + 6, T, 2);
                if (th === 0 && c % 3 === 0) { g.fillStyle = "#a3e635"; g.fillRect(x + 4, y - 2, 2, 3); g.fillRect(x + 12, y - 1, 2, 2); }
                if (th === 2) { g.strokeStyle = "rgba(161,161,170,.5)"; g.lineWidth = 0.8; g.beginPath(); g.moveTo(x + 2, y + 3); g.lineTo(x + 14, y + 5); g.stroke(); }
              }
              if (!tile(c - 1, r) && c > 0) { g.fillStyle = "rgba(15,23,42,.12)"; g.fillRect(x, y, 2, T); }
              if (!tile(c + 1, r) && c < L.cols - 1) { g.fillStyle = "rgba(15,23,42,.12)"; g.fillRect(x + T - 2, y, 2, T); }
            } else if (v === 2) {
              if (th === 0) {
                g.fillStyle = t.block; rr(x + 0.5, y + 0.5, T - 1, T - 1, 3); g.fill();
                g.fillStyle = t.blockLine; g.fillRect(x + 8, y + 1, 4, T - 2);
              } else if (th === 1) {
                g.fillStyle = t.block; rr(x + 1, y + 0.5, T - 2, T - 1, 3); g.fill();
                g.fillStyle = tile(c, r - 1) === 2 ? "#64748b" : "#84cc16"; g.fillRect(x + 4, y + 3, T - 8, 3);
              } else {
                g.fillStyle = t.block; g.fillRect(x, y, T, T);
                if (tile(c, r - 1) !== 2) { g.fillStyle = "#b45309"; g.fillRect(x, y, T, 5); }
              }
            } else if (v === 3) {
              g.fillStyle = t.plank; rr(x, y, T, 7, 2); g.fill();
              g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(x + 2, y + 1, T - 4, 2);
              if (th === 1 && tile(c - 1, r) !== 3) { g.fillStyle = "#64748b"; g.fillRect(x + 3, y + 7, 3, 8); }
              if (th === 1 && tile(c + 1, r) !== 3) { g.fillStyle = "#64748b"; g.fillRect(x + T - 6, y + 7, 3, 8); }
            }
          }
        }
      }

      function drawMover(m, th) {
        const x = m.x - camX;
        if (x > VW + 10 || x + m.w < -10) return;
        if (m.ax === "y") {
          g.strokeStyle = "rgba(100,116,139,.45)"; g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(x + 4, 0); g.lineTo(x + 4, m.y); g.moveTo(x + m.w - 4, 0); g.lineTo(x + m.w - 4, m.y); g.stroke();
        }
        g.fillStyle = th === 2 ? "#64748b" : th === 1 ? "#0369a1" : "#4d7c0f";
        rr(x, m.y, m.w, 8, 3); g.fill();
        g.fillStyle = "#facc15";
        for (let i = 4; i < m.w - 4; i += 8) g.fillRect(x + i, m.y + 2, 4, 3);
      }

      function drawGoal(th) {
        const x = L.goal - camX;
        if (x > VW + 60 || x < -80) return;
        const gy = groundTopAt(Math.floor(L.goal / T)) * T;
        if (th === 0) {
          // 지하철 입구
          g.fillStyle = "#0f172a"; g.fillRect(x, gy - 46, 44, 46);
          g.fillStyle = "#334155";
          for (let i = 0; i < 5; i++) g.fillRect(x + 4, gy - 8 - i * 8, 36 - i * 4, 3);
          g.fillStyle = "#0ea5e9"; rr(x - 4, gy - 66, 52, 18, 4); g.fill();
          font(10, 800); g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("지하철", x + 22, gy - 57);
        } else if (th === 1) {
          // 개찰구와 출구 안내
          g.fillStyle = "#facc15"; rr(x - 6, gy - 74, 58, 18, 4); g.fill();
          font(10, 800); g.fillStyle = "#0f172a"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("출구 3번", x + 23, gy - 65);
          g.fillStyle = "#cbd5e1"; g.fillRect(x, gy - 52, 46, 52);
          g.fillStyle = "#e0f2fe"; g.fillRect(x + 6, gy - 46, 34, 46);
          g.fillStyle = "#475569"; g.fillRect(x - 10, gy - 20, 10, 20); g.fillRect(x + 46, gy - 20, 10, 20);
          g.fillStyle = "#22c55e"; g.fillRect(x - 8, gy - 18, 6, 3);
        } else {
          // 사무실 문
          g.fillStyle = "#e2e8f0"; g.fillRect(x - 6, gy - 62, 56, 62);
          g.fillStyle = "#0369a1"; rr(x, gy - 56, 44, 56, 3); g.fill();
          g.fillStyle = "#bae6fd"; g.fillRect(x + 6, gy - 50, 14, 22); g.fillRect(x + 24, gy - 50, 14, 22);
          g.fillStyle = "#facc15"; g.beginPath(); g.arc(x + 36, gy - 22, 2.5, 0, 7); g.fill();
          g.fillStyle = "#fff"; rr(x + 4, gy - 76, 36, 14, 3); g.fill();
          font(9.5, 800); g.fillStyle = "#0369a1"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("우리 팀", x + 22, gy - 69);
        }
        // 도착 화살표
        const bob = Math.sin(clock * 4) * 3;
        g.fillStyle = "#84cc16";
        g.beginPath(); g.moveTo(x + 22, gy - 82 + bob); g.lineTo(x + 14, gy - 94 + bob); g.lineTo(x + 30, gy - 94 + bob); g.closePath(); g.fill();
      }

      function drawCheck(c) {
        const x = c.x - camX;
        if (x < -20 || x > VW + 20) return;
        const gy = groundTopAt(Math.floor(c.x / T)) * T;
        g.fillStyle = "#475569"; rr(x - 6, gy - 26, 12, 26, 3); g.fill();
        g.fillStyle = c.on ? "#84cc16" : "#94a3b8"; rr(x - 4, gy - 23, 8, 7, 2); g.fill();
        g.fillStyle = "#cbd5e1"; g.fillRect(x - 3, gy - 12, 6, 1.5);
      }

      function drawClip(x, y) {
        g.save(); g.translate(x, y); g.rotate(0.35);
        g.strokeStyle = "#0ea5e9"; g.lineWidth = 1.8; g.lineCap = "round";
        g.beginPath();
        g.moveTo(-1.5, 3); g.lineTo(-1.5, -4); g.arc(0.5, -4, 2, Math.PI, 0); g.lineTo(2.5, 4);
        g.arc(0, 4, 2.5, 0, Math.PI); g.lineTo(-2.5, -5.5); g.arc(0.5, -5.5, 3, Math.PI, 0); g.lineTo(3.5, 1);
        g.stroke();
        g.restore();
      }
      function drawCoffee(x, y) {
        g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x - 6, y - 5); g.lineTo(x + 6, y - 5); g.lineTo(x + 4.5, y + 8); g.lineTo(x - 4.5, y + 8); g.closePath(); g.fill();
        g.strokeStyle = "#cbd5e1"; g.lineWidth = 0.8; g.stroke();
        g.fillStyle = "#92400e"; g.fillRect(x - 5.3, y, 10.6, 4);
        g.fillStyle = "#334155"; rr(x - 7, y - 8, 14, 4, 2); g.fill();
        g.strokeStyle = "rgba(148,163,184,.8)"; g.lineWidth = 1.2;
        const s = Math.sin(clock * 5) * 1.5;
        g.beginPath(); g.moveTo(x - 2, y - 10); g.quadraticCurveTo(x - 4 + s, y - 13, x - 2, y - 16); g.stroke();
        g.beginPath(); g.moveTo(x + 2, y - 10); g.quadraticCurveTo(x + s, y - 13, x + 2, y - 16); g.stroke();
      }
      function drawBadgeItem(x, y, glow) {
        g.strokeStyle = "#0ea5e9"; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(x - 4, y - 12); g.lineTo(x, y - 5); g.lineTo(x + 4, y - 12); g.stroke();
        if (glow) { g.fillStyle = "rgba(132,204,22,.35)"; g.beginPath(); g.arc(x, y, 11, 0, 7); g.fill(); }
        g.fillStyle = "#fff"; rr(x - 6, y - 5, 12, 15, 2); g.fill();
        g.strokeStyle = "#94a3b8"; g.lineWidth = 0.8; g.stroke();
        g.fillStyle = "#0284c7"; g.fillRect(x - 6, y - 5, 12, 4);
        g.fillStyle = "#cbd5e1"; g.fillRect(x - 4, y + 1, 4, 5);
        g.fillStyle = "#94a3b8"; g.fillRect(x + 1, y + 2, 4, 1); g.fillRect(x + 1, y + 5, 3, 1);
      }

      function drawSpam(e) {
        const x = e.x - camX + e.w / 2, y = e.y + e.h / 2;
        if (x < -20 || x > VW + 20) return;
        g.save(); g.translate(x, y);
        if (!e.alive) { g.globalAlpha = Math.max(0, 1 - e.dead * 2.5); g.scale(1.2, 0.4); g.translate(0, 10); }
        else g.rotate(Math.sin(e.rot) * 0.25);
        const w = 16, h = 12;
        g.fillStyle = "#fff"; rr(-w / 2, -h / 2, w, h, 2); g.fill();
        g.strokeStyle = "#ef4444"; g.lineWidth = 1.2; g.stroke();
        g.beginPath(); g.moveTo(-w / 2, -h / 2); g.lineTo(0, 1); g.lineTo(w / 2, -h / 2); g.stroke();
        g.fillStyle = "#ef4444"; g.beginPath(); g.arc(4, 2.5, 2.6, 0, 7); g.fill();
        // 눈
        g.fillStyle = "#0f172a";
        g.fillRect(-5, -1.5, 2, 2.5); g.fillRect(-1.5, -1.5, 2, 2.5);
        g.restore();
      }
      function drawBell(e) {
        const x = e.x - camX + e.w / 2, y = e.y + e.h / 2;
        if (x < -20 || x > VW + 20) return;
        g.save(); g.translate(x, y);
        if (!e.alive) { g.globalAlpha = Math.max(0, 1 - e.dead * 2.5); g.scale(1.3, 0.5); }
        else g.rotate(Math.sin(clock * 10 + e.x0) * 0.25);
        // 날개
        const flap = Math.sin(clock * 22 + e.x0) * 3;
        g.fillStyle = "rgba(255,255,255,.9)";
        g.beginPath(); g.ellipse(-9, -3 + flap * 0.3, 5, 3 + flap * 0.3, -0.4, 0, 7); g.fill();
        g.beginPath(); g.ellipse(9, -3 + flap * 0.3, 5, 3 + flap * 0.3, 0.4, 0, 7); g.fill();
        g.fillStyle = "#facc15";
        g.beginPath(); g.moveTo(-7, 5); g.quadraticCurveTo(-7, -8, 0, -8); g.quadraticCurveTo(7, -8, 7, 5); g.closePath(); g.fill();
        g.fillStyle = "#eab308"; rr(-8, 4, 16, 3, 1.5); g.fill();
        g.fillStyle = "#a16207"; g.beginPath(); g.arc(0, 8.5, 2, 0, 7); g.fill();
        g.fillStyle = "#ef4444"; g.beginPath(); g.arc(5, -6, 3.6, 0, 7); g.fill();
        font(5.5, 800); g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("9", 5, -5.8);
        g.restore();
      }

      function drawPlayer() {
        const p = P;
        if (p.inv > 0 && state === "play" && Math.floor(clock * 14) % 2) return;
        const x = p.x - camX + PW / 2, y = p.y + PH;
        g.save(); g.translate(x, y); g.scale(p.face, 1);
        if (state === "dying" && dieKind === "hit") g.rotate(Math.min(1.5, dieT * 4) * -0.6);
        // 커피 효과
        if (p.coffee > 0) {
          g.strokeStyle = "rgba(146,64,14,.35)"; g.lineWidth = 1.5;
          for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-10 - i * 3, -6 - i * 5); g.lineTo(-18 - i * 3 - Math.abs(p.vx) / 30, -6 - i * 5); g.stroke(); }
        }
        const air = !p.ground && state !== "clear";
        const ph = p.run;
        const moving = Math.abs(p.vx) > 8 || state === "clear";
        const leg = (s) => {
          const a = air ? (s > 0 ? 0.6 : -0.3) : moving ? Math.sin(ph + (s > 0 ? 0 : Math.PI)) * 0.7 : 0;
          g.strokeStyle = s > 0 ? "#334155" : "#1e293b"; g.lineWidth = 3.4; g.lineCap = "round";
          const kx = Math.sin(a) * 4.5, ky = -6 + Math.cos(a) * 3;
          g.beginPath(); g.moveTo(0, -9); g.lineTo(kx, ky); g.lineTo(kx + Math.sin(a * 0.4) * 2, 0); g.stroke();
          g.fillStyle = "#0f172a"; g.fillRect(kx + Math.sin(a * 0.4) * 2 - 1, -1.6, 4.5, 2);
        };
        leg(-1);
        // 몸 (하늘색 셔츠)
        g.fillStyle = "#38bdf8"; rr(-5, -17, 10, 10, 3); g.fill();
        // 팔
        const arm = air ? -1.9 : moving ? -Math.sin(ph) * 0.8 : 0.1;
        g.strokeStyle = "#0ea5e9"; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -15); g.lineTo(Math.sin(arm) * 6, -15 + Math.cos(arm) * 6); g.stroke();
        leg(1);
        // 목줄과 사원증
        g.strokeStyle = "#84cc16"; g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(-2.5, -17); g.lineTo(1.5, -12); g.lineTo(3.5, -17); g.stroke();
        if (p.badge) { g.fillStyle = `rgba(132,204,22,${0.35 + 0.25 * Math.sin(clock * 6)})`; g.beginPath(); g.arc(1.5, -10, 5, 0, 7); g.fill(); }
        g.fillStyle = "#fff"; g.fillRect(-0.5, -12.5, 4, 5);
        g.fillStyle = "#0284c7"; g.fillRect(-0.5, -12.5, 4, 1.6);
        // 머리
        g.fillStyle = "#f6c9a0"; g.beginPath(); g.arc(0.5, -23, 6.5, 0, 7); g.fill();
        g.fillStyle = "#1f2937"; g.beginPath(); g.arc(-0.5, -24.5, 6.6, Math.PI * 0.9, Math.PI * 2.05); g.closePath(); g.fill();
        g.fillStyle = "#0f172a"; g.beginPath(); g.arc(3.6, -22.5, 1, 0, 7); g.fill();
        g.fillStyle = "rgba(239,68,68,.35)"; g.beginPath(); g.arc(3.2, -20.4, 1.4, 0, 7); g.fill();
        // 앞팔
        const arm2 = air ? -2.3 : moving ? Math.sin(ph) * 0.8 : -0.1;
        g.strokeStyle = "#38bdf8"; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -15); g.lineTo(Math.sin(arm2) * 6, -15 + Math.cos(arm2) * 6); g.stroke();
        g.fillStyle = "#f6c9a0"; g.beginPath(); g.arc(Math.sin(arm2) * 7, -15 + Math.cos(arm2) * 7, 1.5, 0, 7); g.fill();
        g.restore();
      }

      function draw() {
        g.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
        if (!L) { g.fillStyle = "#e0f2fe"; g.fillRect(0, 0, VW, VH); return; }
        const th = STAGES[stageIdx].theme;
        drawBackground(th);
        // 1-1 시작 지점: 우리 집
        if (stageIdx === 0) {
          const x = -camX;
          if (x > -80) {
            g.fillStyle = "#fef3c7"; g.fillRect(x, 120, 44, 60);
            g.fillStyle = "#0ea5e9"; g.beginPath(); g.moveTo(x - 6, 122); g.lineTo(x + 22, 98); g.lineTo(x + 50, 122); g.closePath(); g.fill();
            g.fillStyle = "#92400e"; rr(x + 14, 148, 16, 32, 2); g.fill();
            font(8.5, 800); g.fillStyle = "#0b3558"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("우리 집", x + 22, 136);
          }
        }
        drawTiles(th);
        L.checks.forEach(drawCheck);
        drawGoal(th);
        L.movers.forEach((m) => drawMover(m, th));
        L.clips.forEach((c) => { if (!c.got) { const x = c.x - camX; if (x > -10 && x < VW + 10) drawClip(x, c.y + Math.sin(clock * 3 + c.x * 0.05) * 1.5); } });
        L.items.forEach((it) => {
          if (it.got) return;
          const x = it.x - camX; if (x < -20 || x > VW + 20) return;
          const y = it.y + Math.sin(clock * 3 + it.x) * 2;
          g.fillStyle = "rgba(255,255,255,.6)"; g.beginPath(); g.arc(x, y, 11, 0, 7); g.fill();
          if (it.kind === "coffee") drawCoffee(x, y + 1); else drawBadgeItem(x, y + 1, true);
        });
        L.spam.forEach((e) => { if (e.alive || e.dead < 0.4) drawSpam(e); });
        L.bells.forEach((e) => { if (e.alive || e.dead < 0.4) drawBell(e); });
        if (P) drawPlayer();
        // 떠오르는 글자
        floats.forEach((f) => {
          const x = f.x - camX, y = f.y - f.t * 24;
          g.globalAlpha = Math.max(0, 1 - f.t / 1.1);
          font(9.5, 800); g.textAlign = "center"; g.textBaseline = "middle";
          g.lineWidth = 3; g.strokeStyle = "#fff"; g.lineJoin = "round"; g.strokeText(f.text, clamp(x, 60, VW - 60), y);
          g.fillStyle = f.color; g.fillText(f.text, clamp(x, 60, VW - 60), y);
          g.globalAlpha = 1;
        });
        // 상태 표시 (사원증 · 커피)
        if (P && state !== "ready") {
          let ix = 8;
          if (P.badge) { g.fillStyle = "rgba(255,255,255,.88)"; rr(ix, 6, 26, 26, 8); g.fill(); drawBadgeItem(ix + 13, 20, false); ix += 30; }
          if (P.coffee > 0) {
            g.fillStyle = "rgba(255,255,255,.88)"; rr(ix, 6, 26, 26, 8); g.fill(); drawCoffee(ix + 13, 21);
            g.fillStyle = "#92400e"; g.fillRect(ix + 3, 29, 20 * (P.coffee / 7), 2);
          }
        }
        if (banner > 0 && state === "play") {
          const a = Math.min(1, banner * 2);
          g.globalAlpha = a;
          font(20, 800); g.textAlign = "center"; g.textBaseline = "middle";
          const txt = STAGES[stageIdx].name;
          const w = g.measureText(txt).width + 34;
          g.fillStyle = "rgba(11,53,88,.82)"; rr(VW / 2 - w / 2, 70, w, 36, 18); g.fill();
          g.fillStyle = "#fff"; g.fillText(txt, VW / 2, 89);
          g.globalAlpha = 1;
        }
        if (state === "clear") {
          font(18, 800); g.textAlign = "center"; g.textBaseline = "middle";
          const txt = `도착! 남은 시간 보너스 +${clearBonus.toLocaleString("ko-KR")}`;
          const w = g.measureText(txt).width + 30;
          g.fillStyle = "rgba(77,124,15,.9)"; rr(VW / 2 - w / 2, 64, w, 34, 17); g.fill();
          g.fillStyle = "#fff"; g.fillText(txt, VW / 2, 82);
        }
        if (state === "dying") {
          g.fillStyle = `rgba(239,68,68,${Math.max(0, 0.25 - dieT * 0.2)})`; g.fillRect(0, 0, VW, VH);
          font(16, 800); g.textAlign = "center"; g.textBaseline = "middle";
          const txt = dieKind === "time" ? "시간 초과! 목숨 -1" : dieKind === "fall" ? "앗, 떨어졌어요! 목숨 -1" : "부딪혔어요! 목숨 -1";
          const w = g.measureText(txt).width + 30;
          g.fillStyle = "rgba(220,38,38,.9)"; rr(VW / 2 - w / 2, 64, w, 32, 16); g.fill();
          g.fillStyle = "#fff"; g.fillText(txt, VW / 2, 80);
        }
      }

      // ───────────────────────── 루프
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(1 / 30, (now - last) / 1000);
        last = now;
        if (state === "play" || state === "dying" || state === "clear") update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      resize();
      showReady();
      requestAnimationFrame(frame);
      window.__gmJump = {
        get state() { return state; }, get P() { return P; }, get L() { return L; },
        info: () => ({ state, stageIdx, lives, score, clipsN, kills, clears, timeLeft, x: P && P.x, y: P && P.y }),
        warp: (x) => { P.x = x; P.y = 0; P.vy = 0; camX = clamp(x - VW * 0.38, 0, L.cols * T - VW); },
        input,
      };
    },
  });
