<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/_shared/no-zoom.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <title>헬스키퍼 — 꿀알바 시리즈</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/series-art.js"></script>
  <style>
    .hk-sr { --ink: #fef3c7; --night: #120a24; --plum: #2a1b4d; --gold: #fde68a; --red: #ef4444; padding-bottom: 72px; background: var(--night); color: var(--ink); min-height: 100vh; }
    .hk-sr__scene { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .hk-sr__in { max-width: 980px; margin: 0 auto; padding: 0 20px; }
    .hk-sr__lead { margin: 26px 0 26px; text-align: center; font-size: 15.5px; line-height: 1.6; color: #e9d5ff; word-break: keep-all; }
    .hk-sr__board { padding: 18px; background: #5b3a1e; border: 4px solid #2d1a0a; box-shadow: 0 0 0 4px #7c5230; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .hk-sr__job { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 182px; padding: 14px 12px 12px; background: #fef3c7; color: #3f2a14; text-decoration: none; box-shadow: 4px 4px 0 rgba(0,0,0,.35); }
    .hk-sr__job::before { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; background: var(--red); box-shadow: inset -2px -2px 0 #991b1b; }
    .hk-sr__job:nth-child(odd) { transform: rotate(-1deg); }
    .hk-sr__job:nth-child(even) { transform: rotate(.8deg); }
    a.hk-sr__job:hover { transform: translateY(-3px); }
    .hk-sr__ep { font-size: 12px; font-weight: 800; color: #b45309; }
    .hk-sr__job b { font-size: 16.5px; line-height: 1.25; word-break: keep-all; }
    .hk-sr__pay { font-size: 12px; font-weight: 700; color: #7c2d12; }
    .hk-sr__rule { margin-top: auto; padding-top: 6px; border-top: 2px dashed #d6b98a; font-size: 12px; line-height: 1.45; word-break: keep-all; }
    .hk-sr__go { align-self: flex-start; padding: 3px 8px; font-size: 12px; font-weight: 800; color: #fef3c7; background: #7c2d12; }
    .hk-sr__job.is-off { background: #cbbfa4; color: #6b5a42; }
    .hk-sr__job.is-off .hk-sr__go { background: #6b5a42; }
    .hk-sr__mbr { display: none; }
    .hk-sr__back { display: inline-block; margin: 18px 0 0; font-size: 14px; font-weight: 700; color: var(--gold); text-decoration: none; }
    @media (max-width: 640px) { .hk-sr__mbr { display: inline; } }
    @media (max-width: 860px) {
      .hk-sr__board { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px; gap: 12px; }
      .hk-sr__job { min-height: 170px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 꿀알바 시리즈 — 밤거리 인력사무소 벽에 붙은 구인 공고. 회차마다 게임 하나
    const JOBS = [
      { ep: 1, title: "심야 편의점", pay: "시급 수상할 만큼 높음", rule: "아침 6시까지 두꺼비집을 지킬 것", key: "nightshift" },
      { ep: 2, title: "광대를 놓치지 마", pay: "시급 더 높음", rule: "광대에게서 눈을 떼지 말 것", key: "clown" },
      { ep: 3, title: "새벽 우유 배달", pay: "시급 더더욱 높음", rule: "규칙이 금지한 집에 넣지 말 것", key: "milk" },
      { ep: 4, title: "심야 극장 안내", pay: "시급 점점 수상함", rule: "관객이 돌아보면 움직이지 말 것", key: "theater" },
      { ep: 5, title: "신약 시험 보조", pay: "위험 수당 포함", rule: "병에 맞는 약을 제시간에 줄 것", key: "trial" },
      { ep: 6, title: "조용한 공사장", pay: "야간 수당 포함", rule: "소리를 내지 말 것", key: "silent" },
      { ep: 7, title: "야간 퍼레이드", pay: "행사 수당 포함", rule: "빨간 풍선은 건드리지 말 것", key: "parade" },
      { ep: 8, title: "마지막 축제", pay: "???", rule: "지금까지의 규칙을 모두 지킬 것", key: "finale" },
    ];
    function card(j) {
      const body = `<span class="hk-sr__ep">${j.ep}화 공고</span><b>${HKUI.escapeHtml(j.title)}</b><span class="hk-sr__pay">${j.pay || "시급 미정"}</span>
        <span class="hk-sr__rule">규칙 · ${HKUI.escapeHtml(j.rule)}</span><span class="hk-sr__go">${j.key ? "지원하기" : "공고 준비 중"}</span>`;
      return j.key ? `<a class="hk-sr__job" href="/games/${j.key}">${body}</a>` : `<div class="hk-sr__job is-off">${body}</div>`;
    }
    HKMember.mountPage({
      active: "lounge",
      auth: true,
      render: () => `<div class="hk-sr">
          <canvas class="hk-sr__scene" id="sr-scene" width="${HKSeriesArt.width}" height="${HKSeriesArt.height}" role="img" aria-label="꿀알바 시리즈"></canvas>
          <div class="hk-sr__in">
            <p class="hk-sr__lead">밤에만 문을 여는 꿀벌 인력사무소. <br class="hk-sr__mbr">시급은 높고, 규칙은 지켜야 해요.<br>공고를 골라 지원하세요.</p>
            <div class="hk-sr__board">${JOBS.map(card).join("")}</div>
            <a class="hk-sr__back" href="/arcade">‹ 아케이드로</a>
          </div>
        </div>`,
      afterMount: () => {
        const c = document.getElementById("sr-scene");
        let raf = 0, lastDraw = 0;
        const loop = (t) => {
          raf = 0;
          if (t - lastDraw > 80) { lastDraw = t; HKSeriesArt.drawScene(c, t); } // 구름이 흐를 만큼만 — 초당 12번
          if (!document.hidden) raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        document.addEventListener("visibilitychange", () => { if (!document.hidden && !raf) raf = requestAnimationFrame(loop); });
      },
    });
  </script>
</body>
</html>
