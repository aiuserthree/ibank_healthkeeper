<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 마이페이지 · 내 정보</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js?v=20261016"></script>
  <script src="/_shared/api.js?v=20261016"></script>
  <script src="/_shared/member-shell.js?v=20261016"></script>
  <script src="/_shared/fun-stats.js?v=20261016c"></script>
</head>
<body>
  <div id="app"></div>
  <script>

    function fetchUsageHistory(page, pageSize) {
      if (typeof HKApi.myUsageHistory === "function") return HKApi.myUsageHistory(page, pageSize);
      if (typeof HKApi.myLegacyUsages === "function") return HKApi.myLegacyUsages(page, pageSize);
      return HKApi.get(`/me/usage-history?page=${page}&pageSize=${pageSize}`);
    }

    // 이용 내역은 전부 받아 달력으로 보여준다 (API는 한 번에 50건까지)
    async function fetchAllUsageHistory() {
      const items = [];
      for (let page = 1; page <= 20; page++) {
        const data = await fetchUsageHistory(page, 50);
        items.push(...(data.items || []));
        if (page >= (data.totalPages || 0)) break;
      }
      return items;
    }

    function openUsageHistoryModal() {
      HKUI.layerModal("과거 이용 내역", async (bodyEl) => {
        bodyEl.innerHTML = `<div style="text-align:center;padding:32px"><span class="hk-spin"></span></div>`;
        let items;
        try {
          items = await fetchAllUsageHistory();
        } catch (e) {
          bodyEl.innerHTML = `<div class="hk-empty" style="padding:24px 8px;text-align:center">${HKUI.escapeHtml(e.message)}</div>`;
          return;
        }
        if (!items.length) {
          bodyEl.innerHTML = `<div class="hk-empty" style="padding:24px 8px;text-align:center;color:var(--text-secondary)">이용 내역이 없습니다.</div>`;
          return;
        }
        const DOW = ["일", "월", "화", "수", "목", "금", "토"];
        const monthKey = (iso) => iso.slice(0, 7);
        const byDate = {};
        items.forEach((r) => (byDate[r.usageDate] ||= []).push(r));
        const dates = Object.keys(byDate).sort();
        const firstMonth = monthKey(dates[0]);
        const lastMonth = monthKey(dates[dates.length - 1]);
        // 평균 이용 간격 — 첫 이용부터 마지막 이용까지
        const spanDays = Math.round((new Date(dates[dates.length - 1]) - new Date(dates[0])) / 86400000);
        const avgGap = dates.length > 1 ? Math.round(spanDays / (dates.length - 1)) : null;
        const monthCount = {};
        items.forEach((r) => { const k = monthKey(r.usageDate); monthCount[k] = (monthCount[k] || 0) + 1; });
        const usedMonths = Object.keys(monthCount).sort();
        const usedYears = [...new Set(usedMonths.map((k) => k.slice(0, 4)))];
        let ym = lastMonth;
        let picked = null;

        const shiftMonth = (key, n) => {
          const [y, m] = key.split("-").map(Number);
          const d = new Date(y, m - 1 + n, 1);
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        };

        function render() {
          const [y, m] = ym.split("-").map(Number);
          const prevUsedYear = [...usedYears].reverse().find((yy) => Number(yy) < y);
          const nextUsedYear = usedYears.find((yy) => Number(yy) > y);
          const first = new Date(y, m - 1, 1);
          const daysIn = new Date(y, m, 0).getDate();
          const monthItems = items.filter((r) => monthKey(r.usageDate) === ym).sort((a, b) => (a.usageDate + a.startTime).localeCompare(b.usageDate + b.startTime));
          if (!picked && monthItems.length) picked = monthItems[monthItems.length - 1].usageDate;
          const pickedItems = picked ? byDate[picked] || [] : [];
          const pd = picked ? new Date(picked + "T12:00:00") : null;
          const cells = [];
          for (let k = 0; k < first.getDay(); k++) cells.push(`<span class="hk-ucal__cell is-blank"></span>`);
          for (let d = 1; d <= daysIn; d++) {
            const iso = `${ym}-${String(d).padStart(2, "0")}`;
            const used = byDate[iso];
            const dow = (first.getDay() + d - 1) % 7;
            const cls = ["hk-ucal__cell", used ? "is-used" : "", iso === picked ? "is-picked" : "", dow === 0 ? "is-sun" : dow === 6 ? "is-sat" : ""].filter(Boolean).join(" ");
            cells.push(used
              ? `<button type="button" class="${cls}" data-date="${iso}" aria-label="${m}월 ${d}일 ${used[0].startTime} 이용"><span class="hk-ucal__num">${d}</span></button>`
              : `<span class="${cls}"><span class="hk-ucal__num">${d}</span></span>`);
          }
          bodyEl.innerHTML = `
            <div class="hk-ucal">
              <div class="hk-ucal__head">
                <button type="button" class="hk-ucal__nav" data-nav="-1" aria-label="이전 달" ${ym <= firstMonth ? "disabled" : ""}>${HKUI.icon("chevron-left", 18, "currentColor")}</button>
                <b>${y}년 ${m}월</b>
                <button type="button" class="hk-ucal__nav" data-nav="1" aria-label="다음 달" ${ym >= lastMonth ? "disabled" : ""}>${HKUI.icon("chevron-right", 18, "currentColor")}</button>
              </div>
              <div class="hk-ucal__grid">${DOW.map((w, k) => `<span class="hk-ucal__dow${k === 0 ? " is-sun" : k === 6 ? " is-sat" : ""}">${w}</span>`).join("")}${cells.join("")}</div>
              <div class="hk-ucal__detail">${pickedItems.length
              ? `${HKUI.icon("check-circle-2", 17, "var(--color-signal-blue)")}<span><b>${pd.getMonth() + 1}월 ${pd.getDate()}일(${DOW[pd.getDay()]})</b> ${pickedItems.map((r) => `${HKUI.escapeHtml(r.startTime)} – ${HKUI.escapeHtml(r.endTime || r.startTime)}`).join(", ")} 이용</span>`
              : `${HKUI.icon("calendar-x", 17, "var(--text-muted)")}<span style="color:var(--text-secondary)">이 달에는 이용 기록이 없어요.</span>`}</div>
              <div class="hk-ucal__months" aria-label="이용한 달로 이동">
                ${usedYears.length > 1 ? `<span class="hk-ucal__year">
                  <button type="button" class="hk-ucal__ynav" data-year="-1" aria-label="이전 해" ${prevUsedYear ? "" : "disabled"}>${HKUI.icon("chevron-left", 14, "currentColor")}</button>
                  <b>${y}</b>
                  <button type="button" class="hk-ucal__ynav" data-year="1" aria-label="다음 해" ${nextUsedYear ? "" : "disabled"}>${HKUI.icon("chevron-right", 14, "currentColor")}</button>
                </span>` : ""}
                ${usedMonths.filter((k) => k.startsWith(`${y}-`)).map((k) => `<button type="button" class="hk-ucal__month${k === ym ? " is-active" : ""}" data-month="${k}">${Number(k.slice(5))}월 <small>${monthCount[k]}</small></button>`).join("")}
              </div>
              <div class="hk-ucal__summary">
                <span>이 달 <b>${monthItems.length}회</b></span>
                <span>전체 <b>${items.length}회</b></span>
                ${avgGap ? `<span>평균 <b>${avgGap}일</b>마다</span>` : ""}
              </div>
            </div>`;
          bodyEl.querySelectorAll("[data-nav]").forEach((b) => {
            b.onclick = () => { ym = shiftMonth(ym, Number(b.dataset.nav)); picked = null; render(); };
          });
          bodyEl.querySelectorAll("[data-year]").forEach((b) => {
            b.onclick = () => {
              const target = Number(b.dataset.year) > 0 ? nextUsedYear : prevUsedYear;
              if (!target) return;
              // 그 해에 이용한 마지막 달로 이동
              ym = usedMonths.filter((k) => k.startsWith(`${target}-`)).pop();
              picked = null;
              render();
            };
          });
          bodyEl.querySelectorAll("[data-month]").forEach((b) => {
            b.onclick = () => { ym = b.dataset.month; picked = null; render(); };
          });
          bodyEl.querySelectorAll("[data-date]").forEach((b) => {
            b.onclick = () => { picked = b.dataset.date; render(); };
          });
          HKUI.refreshIcons();
        }
        render();
      });
    }

    HKMember.mountPage({
      active: "mypage",
      auth: true,
      mainStyle: "max-width:1200px;margin:0 auto;padding:36px 32px 72px",
      render() {
        return `
          <h1 style="font-size:34px;margin-bottom:4px">마이페이지</h1>
          <p style="font-size:16px;color:var(--text-secondary);margin:0 0 24px">회원 정보를 확인하세요.</p>
          ${HKUI.subNav("profile")}
          <div class="hk-mypage-top" id="mypage-top">
            <div id="my-record" hidden></div>
            <div class="hk-card hk-card--pad hk-sum" id="usage-card"></div>
          </div>
          <div class="hk-card hk-card--pad" id="profile-card"></div>`;
      },
      afterMount: async (profile) => {
        const pos = profile.position || profile.jobTitle || "";
        const dept = profile.department || profile.dept || "-";
        const hasUsageHistory = (profile.usageHistoryTotal ?? 0) > 0;
        document.getElementById("profile-card").innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap">
            <h2 style="font-size:18px;margin:0">기본 정보</h2>
            ${HKUI.teamsBadge()}
          </div>
          <div style="display:flex;align-items:center;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--color-mist)">
            ${HKUI.avatar(profile.name, "lg", profile.avatarUrl || "")}
            <div>
              <div style="font-size:19px;font-weight:700;color:var(--color-midnight-navy)">${HKUI.escapeHtml(profile.name)} ${pos ? `<span style="font-size:14px;font-weight:500;color:var(--text-secondary)">${HKUI.escapeHtml(pos)}</span>` : ""}</div>
              <div style="font-size:14px;color:var(--text-secondary);margin-top:2px">${HKUI.escapeHtml(dept)} · ibank</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px 32px">
            ${HKUI.readField("이름", profile.name)}
            ${HKUI.readField("이메일", profile.email || "-")}
            ${HKUI.readField("부서", dept)}
            ${HKUI.readField("직급", pos || "-")}
          </div>`;
        // 항목 이름 + 물음표 안내 (data-tooltip-root 하나에 안내 하나)
        function tipLabel(label, tooltipHtml) {
          const panelId = `hk-tt-${Math.random().toString(36).slice(2, 9)}`;
          return `<span class="hk-sum__label">${HKUI.escapeHtml(label)}<button type="button" class="hk-tooltip-btn" aria-expanded="false" aria-controls="${panelId}" aria-label="${HKUI.escapeHtml(label)} 안내">${HKUI.icon("circle-help", 14, "currentColor")}</button></span>
            <div id="${panelId}" class="hk-tooltip-panel" role="tooltip" hidden>${tooltipHtml}</div>`;
        }
        function dateLabel(iso) {
          if (!iso) return "-";
          const [y, m, d] = iso.split("-").map(Number);
          return y === new Date().getFullYear() ? `${m}월 ${d}일` : `${y}.${m}.${d}`;
        }
        const total = profile.totalUses || 0;
        const applyTotal = profile.applyTotal != null ? profile.applyTotal : profile.totalUses;
        const nextTier = HKUI.USAGE_BADGES.find(([n]) => total < n);
        const tierNote = [HKUI.tierBenefitsText(total), nextTier ? `${nextTier[1]}까지 ${nextTier[0] - total}회` : ""].filter(Boolean).join(" · ");
        const tile = (iconName, valueHtml, label, tooltipHtml) => `<div class="hk-sum__tile"${tooltipHtml ? " data-tooltip-root" : ""}>
            <div class="hk-sum__tile-value">${HKUI.icon(iconName, 16, "var(--color-signal-blue)")}<span>${valueHtml}</span></div>
            ${tooltipHtml ? tipLabel(label, tooltipHtml) : `<span class="hk-sum__label">${label}</span>`}
          </div>`;
        const row = (label, tooltipHtml, valueHtml, noteText) => `<div class="hk-sum__row" data-tooltip-root>
            ${tipLabel(label, tooltipHtml)}
            <div class="hk-sum__value">${valueHtml}${noteText ? `<small>${HKUI.escapeHtml(noteText)}</small>` : ""}</div>
          </div>`;
        document.getElementById("usage-card").innerHTML = `
          <div class="hk-sum__head">
            <div style="display:flex;align-items:center;gap:10px">
              <div class="hk-fun-stat__icon" style="margin:0;background:var(--color-signal-blue-soft)">${HKUI.icon("clipboard-list", 19, "var(--color-signal-blue)")}</div>
              <b style="font-size:17px;color:var(--color-midnight-navy);white-space:nowrap">내 이용 현황</b>
            </div>
            ${hasUsageHistory ? `<button type="button" class="hk-btn hk-btn--secondary hk-btn--sm" id="usage-history-btn">이용 내역 보기</button>` : ""}
          </div>
          <div class="hk-sum__tiles">
            ${tile("hand-heart", `${total}<small>회</small>`, "누적 이용", HKUI.USAGE_TOTAL_TOOLTIP_HTML)}
            ${tile("file-check", `${applyTotal ?? 0}<small>건</small>`, "누적 신청", HKUI.APPLY_TOTAL_TOOLTIP_HTML)}
            ${tile("calendar-check", dateLabel(profile.lastUsedDate), "마지막 이용일")}
          </div>
          <div class="hk-sum__rows">
            ${row("내 등급", HKUI.tierGuideHtml(total), HKUI.usageBadgeChip(total), tierNote)}
            ${row("우선권", HKUI.PRIORITY_TOOLTIP_HTML, HKUI.badge(profile.lastUsedDate ? "이용 이력 있음" : "이력 없음 · 최우선", "info"))}
          </div>
          <div class="hk-sum__foot">${HKUI.icon("log-in", 14, "currentColor")} 최근 로그인 ${profile.lastLoginAt ? HKUI.formatDateTimeKst(profile.lastLoginAt) : "-"}</div>`;
        HKUI.bindTooltips(document.getElementById("usage-card"));
        HKUI.refreshIcons();
        const historyBtn = document.getElementById("usage-history-btn");
        if (historyBtn) historyBtn.onclick = () => openUsageHistoryModal();
        HKFun.renderMyRecord(document.getElementById("my-record"), profile).then(() => {
          // 기록 카드가 있을 때만 PC에서 요약과 2단으로 놓는다.
          if (!document.getElementById("my-record").hidden) document.getElementById("mypage-top").classList.add("is-split");
        });
      },
    });
  </script>
</body>
</html>
