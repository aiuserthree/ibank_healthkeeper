<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
  <script src="/_shared/coop-story.js"></script>
  <script src="/_shared/mgmt-art.js"></script>
  <script src="/_shared/retro-art.js"></script>
  <script src="/_shared/raid.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // 아케이드 — 소개 페이지처럼: 첫 화면 → 이용 시간 → 게임 모음(대표 + 게임 찾기) → 오늘의 도전 → 자주 묻는 질문
    const GENRE = {
      blocks: "퍼즐", shooter: "슈팅", match3: "퍼즐", stairs: "액션", crossing: "액션", pairs: "퍼즐", bricks: "액션",
      bubble: "캐주얼", sudoku: "퍼즐", chosung: "퀴즈", trivia: "퀴즈", korean: "퀴즈", typing: "어학",
      snake: "액션", stack: "액션", coffee: "액션", mines: "퍼즐", promote: "퍼즐", nightshift: "액션", gomoku: "대전", chess: "대전", escape: "협동", kitchen: "협동", words: "협동", maze: "협동", clown: "액션", milk: "액션", theater: "액션", trial: "액션", silent: "액션", parade: "액션", finale: "액션",
      baseball: "대전", boxes: "대전", quizduel: "대전", gostop: "대전", memory: "대전", soccer: "대전", volley: "대전",
      sketch: "협동", sync: "협동", spotdiff: "협동", bounce: "액션", dodge: "액션",
      fighter: "레트로", vitamin: "레트로", jumper: "레트로", paperjet: "레트로",
      watersort: "퍼즐", rummy: "대전", alkkagi: "대전",
    };
    const esc = (t) => HKUI.escapeHtml(t);
    // 게임 그림 — 서버가 그림을 한 달 동안 캐시하므로, 그림을 바꾸면 여기 숫자를 올려 새 그림을 받게 한다
    const LOUNGE_IMG_V = { bricks: 2, stairs: 2 };
    const loungeImg = (k) => `/assets/lounge/${k}.jpg${LOUNGE_IMG_V[k] ? `?v=${LOUNGE_IMG_V[k]}` : ""}`;

    function tintVars(key) {
      const [c1, c2] = HKPlay.tintStyle(key).match(/#[0-9a-f]{3,8}/gi) || [];
      return c1 ? `--c1:${c1};--c2:${c2 || c1}` : "";
    }

    function liveNote(st) {
      if (!st.open) return `지금은 업무 시간 · 오늘 <b>${st.opensAt}</b>에 다시 열려요`;
      if (HKLunch.isLunchTime()) return `지금 점심시간 · <b>13:00</b>까지`;
      return `점심 11:30~13:00 · 퇴근 후 18:00~ · 주말·공휴일`;
    }

    function heroHtml(games, st) {
      const keys = games.map((g) => g.key);
      const row = (shift) => {
        const list = keys.slice(shift).concat(keys.slice(0, shift));
        const imgs = list.map((k) => `<img src="${loungeImg(k)}" alt="" onerror="this.remove()">`).join("");
        return `<div class="hk-aa-wall__row">${imgs}${imgs}</div>`;
      };
      // 업무 시간에도 버튼은 그대로 — 누르면 안내 창 (아래 click 처리)
      const cta = `<a class="hk-aa-pill" href="#aa-together" data-scroll="aa-together" data-play>지금 플레이</a>`;
      return `<div class="hk-aa-hero">
          <div class="hk-aa-wall" aria-hidden="true">${row(0)}${row(4)}${row(8)}${row(2)}${row(6)}${row(10)}</div>
          <div class="hk-aa-hero__in">
            <h1 class="hk-aa-logo">아케이드</h1>
            <span class="hk-aa-tag">점심엔, 한 판</span>
            <div class="hk-aa-hero__cta">${cta}<span class="hk-aa-hero__note">${liveNote(st)}</span></div>
          </div>
        </div>`;
    }

    function offersHtml(st) {
      const card = (icon, eyebrow, title, desc) => `<div class="hk-aa-offer">
          <span class="hk-aa-offer__eyebrow">${HKUI.icon(icon, 16, "currentColor")} ${eyebrow}</span>
          <b>${title}</b>
          <p>${desc}</p>
        </div>`;
      return `<div class="hk-aa-offers">
          <div class="hk-aa-wrap">
            <h2 class="hk-aa-h2">언제 할 수 있나요.</h2>
            ${st.open ? "" : `<div class="hk-aa-closed">${HKUI.icon("briefcase", 18, "currentColor")}<span>지금은 업무 시간이라 게임을 할 수 없어요 · 오늘 <b>${esc(st.opensAt || "")}</b>에 다시 열려요</span></div>`}
            <div class="hk-aa-offers__grid">
              ${card("utensils", "점심시간", "11:30 ~ 13:00", "점심 먹고 남은 10분,<br>가볍게 한 판.")}
              ${card("moon", "퇴근 후", "18:00 ~", "하루를 마무리하며<br>오늘의 기록 갈아치우기.")}
              ${card("sun", "주말 · 공휴일", "하루 종일", "출근 전(~09:00)에도<br>열려 있어요.")}
            </div>
          </div>
        </div>`;
    }

    // 참여 도장 — 어떤 게임이든 한 판 마치면(일찍 끝나도) 그날 도장 1개, 10개 모일 때마다 무적 쿠폰 (달이 바뀌어도 이어서 · 쿠폰은 한 달 1장)
    function stampHtml(sp) {
      if (!sp) return "";
      const days = sp.days || [];
      const full = sp.count >= sp.goal;
      const md = (iso) => `${Number(iso.slice(5, 7))}.${Number(iso.slice(8, 10))}`;
      const cells = Array.from({ length: sp.goal }, (_, i) => days[i]
        ? `<span class="hk-aa-stamp__cell is-on${i === sp.goal - 1 ? " is-goal" : ""}" style="--r:${((i * 37) % 21) - 10}deg">${HKUI.icon(i === sp.goal - 1 ? "ticket" : "paw-print", 22, "currentColor")}<small>${md(days[i])}</small></span>`
        : `<span class="hk-aa-stamp__cell${i === sp.goal - 1 ? " is-goal" : ""}">${i === sp.goal - 1 ? HKUI.icon("ticket", 20, "currentColor") : `<em>${i + 1}</em>`}</span>`).join("");
      const left = Math.max(0, sp.goal - sp.count);
      const state = sp.done
        ? `${HKUI.icon("party-popper", 16, "currentColor")} 오늘 ${sp.goal}개 완성! 무적 쿠폰을 받았어요 · 내일부터 새 도장판이 시작돼요`
        : sp.pending
        ? `${HKUI.icon("ticket", 16, "currentColor")} 10개 완성! 이번 달 쿠폰은 받아서 다음 달 1일에 들어와요`
        : sp.coupon
        ? `${HKUI.icon("party-popper", 16, "currentColor")} 이번 달 쿠폰을 받았어요 · 다음 쿠폰까지 ${left}개 (다음 달부터)`
        : full ? `${HKUI.icon("ticket", 16, "currentColor")} 도장을 다 모았어요`
        : sp.today ? `${HKUI.icon("check", 16, "currentColor")} 오늘 도장 완료 · 쿠폰까지 ${left}개`
        : `${HKUI.icon("sparkles", 16, "currentColor")} 오늘 한 판 하면 도장 쾅 · 쿠폰까지 ${left}개`;
      return `<div class="hk-aa-stamps">
          <div class="hk-aa-wrap">
            <div class="hk-aa-stamp">
              <div class="hk-aa-stamp__copy">
                <span class="hk-aa-offer__eyebrow">${HKUI.icon("stamp", 16, "currentColor")} 참여 도장</span>
                <h2 class="hk-aa-h2">하루 한 판,<br>도장 하나.</h2>
                <p>어떤 게임이든 <b>한 판</b>을 마치면 그날 도장이 찍혀요.<br><b>${sp.goal}개</b>를 모을 때마다 <b>무적 쿠폰 1장</b>을 드려요.</p>
                <small>모은 도장은 다음 달로 그대로 이어져요 · 쿠폰은 한 달에 1장 ·<br>받은 날부터 30일 동안 쓸 수 있어요.</small>
              </div>
              <div class="hk-aa-stamp__board">
                <div class="hk-aa-stamp__count"><b>${Math.min(sp.count, sp.goal)}</b> / ${sp.goal}</div>
                <div class="hk-aa-stamp__grid">${cells}</div>
                <div class="hk-aa-stamp__state${sp.today || sp.coupon ? " is-done" : ""}">${state}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    // 게임 타일 — 게임 찾기 결과에 쓴다. 바탕은 게임 색(그림이 늦거나 없을 때 보인다)
    function tileHtml(g) {
      // 꿀알바 시리즈 2~8화는 그림 밑에 게임 색 + 아이콘을 깔아 둔다(그림이 늦거나 못 불러오면 아이콘이 보인다)
      const img = `<img src="${loungeImg(g.key)}" alt="" loading="lazy" onerror="this.remove()">`;
      const art = SERIES_ONLY.includes(g.key)
        ? `<span class="hk-aa-tile__art" aria-hidden="true">${HKUI.icon(g.icon || "gamepad-2", 44, "currentColor")}</span>${img}`
        : img;
      return `<a class="hk-aa-tile" href="/games/${g.key}" style="${HKPlay.tintStyle(g.key)}">
          ${art}
          ${SERIES_EPISODES.includes(g.key) ? `<span class="hk-aa-tile__tag">꿀알바 시리즈</span>` : ""}
          <span class="hk-aa-tile__copy"><small>${GENRE[g.key] || "기타"}</small><b>${esc(g.title)}</b></span>
          <span class="hk-aa-pill is-sm is-white hk-aa-tile__go">시작하기</span>
        </a>`;
    }

    // 대표 게임 — 아케이드에 들어올 때마다 무작위로 하나(꿀알바 2~8화는 빼고). 바로 전에 본 게임은 연달아 나오지 않게
    const LEAD_KEY = "hk-aa-lead";
    function randomLead(games) {
      if (!games.length) return null;
      let last = null;
      try { last = localStorage.getItem(LEAD_KEY); } catch (_) { /* 저장 못 해도 무작위는 그대로 */ }
      const pool = games.length > 1 ? games.filter((g) => g.key !== last) : games;
      const lead = pool[Math.floor(Math.random() * pool.length)];
      try { localStorage.setItem(LEAD_KEY, lead.key); } catch (_) { /* 위와 같음 */ }
      return lead;
    }

    // 게임 모음 — 제목 · 대표 게임(무작위) · 게임 찾기(검색칸 + 분류 칩 + 결과)
    function collectionHtml(games, allGames) {
      const lead = randomLead(games);
      return `<div class="hk-aa-collection" id="aa-games">
          <div class="hk-aa-collection__head hk-aa-wrap">
            <h2>블록, 슈팅, 퀴즈 등<br>게임이 고플 땐.</h2>
            <p>줄을 지우는 퍼즐과 세균을 쓸어버리는 슈팅부터 매일 새로 나오는 상식·한국어·건강 퀴즈,<br>영어 타자까지. 판이 끝나면 점수가 바로 사내 순위에 올라가요.</p>
          </div>
          <a class="hk-aa-feature" href="/games/${lead.key}">
            <img src="${loungeImg(lead.key)}" alt="">
            <div class="hk-aa-feature__in hk-aa-wrap">
              <h3>${esc(lead.title)}</h3>
              <span class="hk-aa-feature__cat">${GENRE[lead.key] || ""} · ${esc(lead.desc)}</span>
              <span class="hk-aa-pill is-white">시작하기</span>
            </div>
          </a>
          <div class="hk-aa-wrap">${findHtml(games, allGames)}</div>
        </div>`;
    }

    // ── 게임 찾기 ──────────────────────────────────────────
    // 검색칸(제목 · 장르 · 설명 · 초성)과 분류 칩으로 모든 게임을 고른다. 흐르는 타일 · 「모든 게임 보기」 자리를 대신한다
    // 분류는 GENRE 를 따른다 — 이 순서로, 이 환경에 게임이 있는 분류만 칩을 보인다 (장르가 없으면 기타)
    const FIND_CATS = [["puzzle", "퍼즐"], ["action", "액션"], ["retro", "레트로"], ["shooting", "슈팅"], ["casual", "캐주얼"], ["quiz", "퀴즈"], ["lang", "어학"], ["versus", "대전"], ["coop", "협동"], ["etc", "기타"]];
    // 분류를 가로지르는 묶음 — 오늘의 도전(모두 같은 판) · 꿀알바 시리즈(1화 심야 편의점 + 시리즈 페이지에서만 고르는 2~8화)
    const FIND_SETS = [["daily", "오늘의 도전", "sparkles"], ["series", "꿀알바 시리즈", "moon"]];
    const FIND_SUGGEST = ["puzzle", "quiz", "action"]; // 찾는 게임이 없을 때 권하는 분류
    const FIND_PLACEHOLDERS = ["게임 이름 · 장르로 찾기 (예: 스도쿠, 퍼즐, ㅅㄷㅋ)", "이름 · 장르 · 초성 (예: 스도쿠, ㅅㄷㅋ)", "이름 · 장르 · 초성으로 찾기"]; // 칸 폭에 맞는 첫 문구
    const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
    const JONG = " ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ"; // 받침 (0 은 받침 없음)
    // 겹자음 — 자판은 모음 없이 친 자음 둘을 한 글자로 합쳐 넣는다(ㄱ+ㅅ → ㄳ). 초성 검색에서는 다시 나눈다
    const CHO_SPLIT = { "ㄳ": "ㄱㅅ", "ㄵ": "ㄴㅈ", "ㄶ": "ㄴㅎ", "ㄺ": "ㄹㄱ", "ㄻ": "ㄹㅁ", "ㄼ": "ㄹㅂ", "ㄽ": "ㄹㅅ", "ㄾ": "ㄹㅌ", "ㄿ": "ㄹㅍ", "ㅀ": "ㄹㅎ", "ㅄ": "ㅂㅅ" };
    // 비교용 — 대소문자 · 띄어쓰기 · 가운뎃점 · 문장부호를 무시한다
    const findNorm = (s) => String(s || "").normalize("NFC").toLowerCase().replace(/[\s\p{P}\p{S}ㆍ]+/gu, "");
    // 초성 — 오늘의스도쿠 → ㅇㄴㅇㅅㄷㅋ (한글이 아닌 글자는 그대로)
    const choOf = (s) => Array.from(s, (c) => { const n = c.charCodeAt(0) - 0xac00; return n >= 0 && n < 11172 ? CHO[Math.floor(n / 588)] : c; }).join("");
    const syl = (cho, med, jong) => String.fromCharCode(0xac00 + cho * 588 + med * 28 + jong);
    const find = { items: [], cat: "all", q: "", shown: [] };
    const findCatName = (id) => (FIND_CATS.concat(FIND_SETS).find(([k]) => k === id) || [])[1] || "";
    // 꿀알바 시리즈(1~8화)는 「꿀알바 시리즈」 칩에서만 보인다 — 전체 · 분류 · 오늘의 도전에는 넣지 않는다
    const inFindCat = (it, cat) => cat === "series" ? it.series : !it.series && (cat === "all" || (cat === "daily" ? it.daily : it.cat === cat));

    // 찾기 목록 — 아케이드 게임(서버 순서 = 최근에 만든 게임부터) 뒤에 시리즈 2~8화. 비교용 글자는 미리 만들어 둔다
    function findIndex(games, allGames) {
      const series = SERIES_ONLY.map((k) => allGames.find((g) => g.key === k)).filter(Boolean);
      return games.concat(series).map((g) => {
        const genre = GENRE[g.key] || "기타";
        const cat = (FIND_CATS.find(([, name]) => name === genre) || ["etc"])[0];
        const isSeries = SERIES_EPISODES.includes(g.key);
        const t = findNorm(g.title);
        return {
          g, cat, daily: !!g.dailyOnce, series: isSeries,
          t, c: choOf(t), k: findNorm(g.key), d: findNorm(g.desc),
          tag: findNorm([genre, g.dailyOnce ? "오늘의 도전" : "", isSeries ? "꿀알바 시리즈" : ""].join(" ")),
        };
      });
    }

    // 한글을 조합하는 중인 끝 글자 — 다음 타에 바뀔 수 있는 글자까지 맞는 것으로 보는 정규식 (조합할 게 없으면 "")
    // 벼 → 벽 · 볍 …(받침 · 겹모음이 붙는다), 슫 → 슫 · 스+ㄷ으로 시작하는 글자(받침이 다음 글자 첫소리로 넘어간다), 벽ㄷ → 벽+ㄷ으로 시작하는 글자
    function findTailRe(qn) {
      const head = qn.slice(0, -1).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const last = qn.slice(-1), n = last.charCodeAt(0) - 0xac00;
      const choRange = (c) => `[${syl(c, 0, 0)}-${syl(c, 20, 27)}]`;
      if (n >= 0 && n < 11172) {
        const cho = Math.floor(n / 588), med = Math.floor(n / 28) % 21, jong = n % 28;
        if (!jong) return `${head}[${last}-${syl(cho, { 8: 11, 13: 16, 18: 19 }[med] || med, 27)}]`; // ㅗ → ㅘㅙㅚ, ㅜ → ㅝㅞㅟ, ㅡ → ㅢ
        const j = JONG[jong];
        const grow = Object.keys(CHO_SPLIT).filter((k) => CHO_SPLIT[k][0] === j).map((k) => syl(cho, med, JONG.indexOf(k))); // 달 → 닭 · 닮 …
        const [keep, next] = CHO_SPLIT[j] ? [JONG.indexOf(CHO_SPLIT[j][0]), CHO_SPLIT[j][1]] : [0, j]; // 겹받침이면 뒤 자음만 넘어간다 (닭 → 달+ㄱ)
        const alts = [`[${last}${grow.join("")}]`];
        if (CHO.includes(next)) alts.push(syl(cho, med, keep) + choRange(CHO.indexOf(next)));
        return `${head}(?:${alts.join("|")})`;
      }
      if (qn.length > 1 && CHO.includes(last)) return head + choRange(CHO.indexOf(last));
      return "";
    }

    // 검색어를 맞춰 보는 함수 — 조합 중이면 끝 글자를 넓게 본다 (조합 중에 빈 결과로 깜빡이지 않게)
    function findMatcher(qn, composing) {
      const tail = composing ? findTailRe(qn) : "";
      if (!tail) return { has: (s) => s.includes(qn), starts: (s) => s.startsWith(qn) };
      const re = new RegExp(tail), at0 = new RegExp(`^(?:${tail})`);
      return { has: (s) => re.test(s), starts: (s) => at0.test(s) };
    }

    // 맞는 정도 — 제목 앞부분 > 제목 안 > 초성 > 장르 · 묶음 이름 > 영문 key > 설명. 안 맞으면 -1
    function findRank(it, m, qn, choOnly) {
      if (m.starts(it.t)) return 0;
      if (m.has(it.t)) return 1;
      if (choOnly && it.c.includes(qn)) return 2;
      if (m.has(it.tag)) return 3;
      if (m.has(it.k)) return 4;
      if (m.has(it.d)) return 5;
      return -1;
    }

    function findSearch(cat, q, composing = false) {
      const list = find.items.filter((it) => inFindCat(it, cat));
      if (!q.trim()) return list;
      const qn = findNorm(q).replace(/[ㄳㄵㄶㄺ-ㅀㅄ]/g, (c) => CHO_SPLIT[c]); // ㄳㅌ → ㄱㅅㅌ
      if (!qn) return []; // 문장부호 · 그림 문자만 쳤으면 맞는 게임이 없다
      const choOnly = /^[ㄱ-ㅎ]+$/.test(qn); // ㄱ~ㅎ 만 쳤으면 초성 검색
      const m = findMatcher(qn, composing && !choOnly);
      return list.map((it, i) => ({ it, i, r: findRank(it, m, qn, choOnly) })).filter((x) => x.r >= 0).sort((a, b) => a.r - b.r || a.i - b.i).map((x) => x.it);
    }

    function findHtml(games, allGames) {
      find.items = findIndex(games, allGames);
      const count = (cat) => find.items.filter((it) => inFindCat(it, cat)).length;
      const chip = (id, name, icon) => {
        const n = count(id);
        return n ? `<button type="button" class="hk-aa-find__chip" role="radio" data-find-cat="${id}" aria-checked="${id === "all"}" tabindex="${id === "all" ? 0 : -1}">${icon ? HKUI.icon(icon, 15, "currentColor") : ""}${name}<em>${n}</em></button>` : "";
      };
      const sets = FIND_SETS.map(([id, name, icon]) => chip(id, name, icon)).join("");
      // <section> 은 휴대폰 공통 여백 규칙(main, section { padding 18px })에 걸리므로 div 로 둔다
      return `<div class="hk-aa-find" id="aa-find" role="region" aria-labelledby="aa-find-title">
          <div class="hk-aa-find__panel" id="aa-find-panel">
            <div class="hk-aa-find__top">
              <h3 class="hk-aa-find__title" id="aa-find-title">게임 찾기</h3>
            </div>
            <div class="hk-aa-find__bar" role="search">
              <label class="hk-aa-sr" for="aa-find-q">게임 이름이나 장르로 찾기</label>
              ${HKUI.icon("search", 22, "currentColor")}
              <input class="hk-aa-find__input" id="aa-find-q" type="search" placeholder="${FIND_PLACEHOLDERS[0]}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="40" aria-controls="aa-find-results" aria-describedby="aa-find-count">
              <button type="button" class="hk-aa-find__clear" id="aa-find-clear" aria-label="검색어 지우기" hidden>${HKUI.icon("x", 18, "currentColor")}</button>
            </div>
            <div class="hk-aa-find__chips" id="aa-find-chips" role="radiogroup" aria-label="게임 분류">
              ${chip("all", "전체")}${FIND_CATS.map(([id, name]) => chip(id, name)).join("")}${sets ? `<span class="hk-aa-find__sep" aria-hidden="true"></span>${sets}` : ""}
            </div>
          </div>
          <p class="hk-aa-find__count" id="aa-find-count" aria-live="polite"></p>
          <div class="hk-aa-find__results" id="aa-find-results"></div>
        </div>`;
    }

    // 결과 그리기 — 타일은 한 번 만들어 두고 옮겨 담는다 (다시 그려도 그림을 새로 받지 않게)
    function findRender({ composing = false } = {}) {
      const results = document.getElementById("aa-find-results");
      const countEl = document.getElementById("aa-find-count");
      if (!results) return;
      const { cat, q } = find;
      const list = findSearch(cat, q, composing);
      find.shown = list;
      const name = findCatName(cat);
      const qc = Array.from(q.trim()); // 글자 단위로 자른다 (그림 문자가 반으로 갈리지 않게)
      const qt = qc.slice(0, 30).join("") + (qc.length > 30 ? "…" : "");
      const grid = (items) => {
        const el = document.createElement("div");
        el.className = "hk-aa-find__grid";
        el.append(...items.map((it) => it.el));
        return el;
      };
      countEl.classList.toggle("hk-aa-sr", !list.length);
      if (!list.length) {
        const inAll = cat === "all" ? 0 : findSearch("all", q, composing).length;
        const inSeries = cat === "series" ? 0 : findSearch("series", q, composing).length; // 꿀알바는 시리즈 칩에서만 보이니 거기 있으면 알려 준다
        const sugg = FIND_SUGGEST.filter((id) => id !== cat && find.items.some((it) => it.cat === id));
        countEl.textContent = `‘${qt}’에 맞는 게임이 없어요`;
        results.innerHTML = `<div class="hk-aa-find__empty">
            <span class="hk-aa-find__empty-icon">${HKUI.icon("search-x", 26, "currentColor")}</span>
            <b>‘${esc(qt)}’에 맞는 게임이 없어요</b>
            <p>${inAll ? `${esc(name)} 말고 다른 분류에는 <b>${inAll}개</b> 있어요.` : inSeries ? `<b>꿀알바 시리즈</b>에 <b>${inSeries}개</b> 있어요.` : "낱말을 줄이거나 초성(예: ㅅㄷㅋ)으로 찾아보세요."}</p>
            <div class="hk-aa-find__sugg">
              ${inAll ? `<button type="button" class="hk-aa-find__chip is-strong" data-find-go="all" data-keep-q="1">전체에서 찾기<em>${inAll}</em></button>` : ""}
              ${inSeries ? `<button type="button" class="hk-aa-find__chip${inAll ? "" : " is-strong"}" data-find-go="series" data-keep-q="1">꿀알바 시리즈에서 찾기<em>${inSeries}</em></button>` : ""}
              ${sugg.map((id) => `<button type="button" class="hk-aa-find__chip" data-find-go="${id}">${findCatName(id)} 게임 보기</button>`).join("")}
            </div>
          </div>`;
        HKUI.refreshIcons(results);
        return;
      }
      if (!findNorm(q)) {
        countEl.innerHTML = cat === "all" ? `모든 게임 <b>${list.length}</b>개 · 분류별로 모았어요` : `<b>${esc(name)}</b> 게임 <b>${list.length}</b>개`;
      } else {
        countEl.innerHTML = `${cat === "all" ? "" : `<b>${esc(name)}</b>에서 `}‘${esc(qt)}’ 검색 결과 <b>${list.length}</b>개${list.length === 1 ? `<span class="hk-aa-find__enter"> · Enter를 누르면 바로 시작해요</span>` : ""}`;
      }
      // 전체 + 검색어 없음 → 분류별로 묶어서, 그 밖에는 한 판에 모아서
      if (cat === "all" && !findNorm(q)) {
        results.replaceChildren(...FIND_CATS.map(([id, label]) => {
          const items = list.filter((it) => it.cat === id);
          if (!items.length) return null;
          const sec = document.createElement("div");
          sec.className = "hk-aa-find__group";
          sec.innerHTML = `<h4 class="hk-aa-find__gh">${label}<em>${items.length}</em></h4>`;
          sec.append(grid(items));
          return sec;
        }).filter(Boolean));
      } else {
        results.replaceChildren(grid(list));
      }
    }

    // 고른 분류는 주소 끝(#aa-games?cat=puzzle)에 남긴다 — 게임을 하고 돌아와도 그대로
    function findSetCat(cat, { keepQ = true } = {}) {
      const row = document.getElementById("aa-find-chips");
      const chip = row && row.querySelector(`[data-find-cat="${cat}"]`);
      if (!chip) return;
      find.cat = cat;
      row.querySelectorAll("[data-find-cat]").forEach((b) => {
        const on = b === chip;
        b.setAttribute("aria-checked", String(on));
        b.tabIndex = on ? 0 : -1;
      });
      if (!keepQ) {
        const input = document.getElementById("aa-find-q");
        input.value = find.q = "";
        document.getElementById("aa-find-clear").hidden = true;
      }
      // 휴대폰 — 가로로 밀리는 칩 줄에서 고른 칩이 가운데쯤 보이게
      if (row.scrollWidth > row.clientWidth) row.scrollTo({ left: Math.max(0, chip.offsetLeft - (row.clientWidth - chip.offsetWidth) / 2), behavior: "smooth" });
      try { history.replaceState(history.state, "", cat === "all" ? location.pathname + location.search : `#aa-games?cat=${cat}`); } catch (e) { /* 주소 남기기는 없어도 된다 */ }
      findRender();
    }

    function bindFind(root) {
      const box = root.querySelector("#aa-find");
      if (!box) return;
      const input = box.querySelector("#aa-find-q");
      const clear = box.querySelector("#aa-find-clear");
      const row = box.querySelector("#aa-find-chips");
      const panel = box.querySelector("#aa-find-panel");
      // 타일은 한 번만 만든다
      const pool = document.createElement("div");
      pool.innerHTML = find.items.map((it) => tileHtml(it.g)).join("");
      HKUI.refreshIcons(pool);
      Array.from(pool.children).forEach((el, i) => (find.items[i].el = el));

      // 휴대폰처럼 칸이 좁으면 안내 문구를 줄인다 — 잘려 보이지 않게
      const fitPlaceholder = () => {
        const cs = getComputedStyle(input);
        const pen = document.createElement("canvas").getContext("2d");
        pen.font = `500 ${cs.fontSize} ${cs.fontFamily}`;
        const room = input.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        input.placeholder = FIND_PLACEHOLDERS.find((p) => pen.measureText(p).width <= room) || FIND_PLACEHOLDERS[FIND_PLACEHOLDERS.length - 1];
      };
      fitPlaceholder();
      if (document.fonts) document.fonts.ready.then(fitPlaceholder);
      let fitRaf = 0;
      addEventListener("resize", () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitPlaceholder); });

      let timer = 0;
      const apply = (composing) => {
        clearTimeout(timer);
        find.q = input.value;
        findRender({ composing });
      };
      input.addEventListener("input", (e) => {
        clear.hidden = !input.value;
        clearTimeout(timer);
        const composing = e.isComposing;
        timer = setTimeout(() => apply(composing), 120);
      });
      input.addEventListener("compositionend", () => apply(false)); // 한글 조합이 끝나면 바로 맞춘다
      input.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return; // 조합 중 Enter 는 글자 확정용
        if (e.key === "Enter") {
          e.preventDefault();
          apply(false);
          if (findNorm(find.q) && find.shown.length === 1) return void find.shown[0].el.click(); // 하나뿐이면 바로 연다 (업무 시간 안내는 타일과 같다)
          if (matchMedia("(hover: none)").matches) input.blur(); // 휴대폰 — 자판을 내려 결과를 보이게
        } else if (e.key === "Escape") {
          if (input.value) { e.preventDefault(); input.value = ""; clear.hidden = true; apply(false); } else input.blur();
        }
      });
      clear.addEventListener("click", () => {
        input.value = "";
        clear.hidden = true;
        apply(false);
        input.focus();
      });
      row.addEventListener("click", (e) => {
        const b = e.target.closest("[data-find-cat]");
        if (b && b.getAttribute("aria-checked") !== "true") findSetCat(b.dataset.findCat);
      });
      // 분류 칩 — 화살표 · Home · End 로 옮겨 고른다
      row.addEventListener("keydown", (e) => {
        const chips = Array.from(row.querySelectorAll("[data-find-cat]"));
        const at = chips.indexOf(document.activeElement);
        if (at < 0) return;
        const to = { ArrowRight: at + 1, ArrowDown: at + 1, ArrowLeft: at - 1, ArrowUp: at - 1, Home: 0, End: chips.length - 1 }[e.key];
        if (to == null) return;
        e.preventDefault();
        const next = chips[(to + chips.length) % chips.length];
        next.focus();
        findSetCat(next.dataset.findCat);
      });
      // 결과가 없을 때의 칩 — 전체에서 찾기(검색어 그대로) · 분류 보기(검색어 지움)
      box.querySelector("#aa-find-results").addEventListener("click", (e) => {
        const b = e.target.closest("[data-find-go]");
        if (!b) return;
        findSetCat(b.dataset.findGo, { keepQ: !!b.dataset.keepQ });
        // 누른 칩은 다시 그리면서 사라진다 — 포커스를 검색칸(전체에서 찾기) · 고른 분류 칩으로 옮긴다. 휴대폰은 자판이 뜨지 않게 칩으로
        const to = b.dataset.keepQ && !matchMedia("(hover: none)").matches ? input : row.querySelector('[aria-checked="true"]');
        if (to) to.focus({ preventScroll: true });
        if (panel.getBoundingClientRect().top < 0) panel.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      // PC — 입력칸 밖에서 「/」를 누르면 검색칸으로
      document.addEventListener("keydown", (e) => {
        if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.defaultPrevented) return;
        const t = e.target;
        if (t && (t.isContentEditable || (t.closest && t.closest("input, textarea, select")))) return;
        if (document.querySelector(".hk-dialog__overlay")) return; // 안내 창이 떠 있으면 그대로
        e.preventDefault();
        input.focus({ preventScroll: true });
        const r = panel.getBoundingClientRect();
        if (r.top < 80 || r.bottom > innerHeight) panel.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      const m = /^#aa-games\?cat=([a-z]+)$/.exec(location.hash);
      if (m && row.querySelector(`[data-find-cat="${m[1]}"]`)) {
        findSetCat(m[1]);
        requestAnimationFrame(() => panel.scrollIntoView({ block: "start" }));
      } else findRender();
    }

    // 오늘의 도전 — 모두 같은 문제 · 하루 첫 판만 순위. 오늘 마감까지 남은 시간과 내 참여 여부
    function dailyHtml(games) {
      const daily = games.filter((g) => g.dailyOnce);
      if (!daily.length) return "";
      const done = daily.filter((g) => g.playedToday).length;
      const card = (g) => `<a class="hk-aa-daily" href="/games/${g.key}">
          <span class="hk-aa-daily__art"><img src="${loungeImg(g.key)}" alt="" loading="lazy" onerror="this.remove()"></span>
          <span class="hk-aa-daily__body">
            <small>${GENRE[g.key] || ""}</small>
            <b>${esc(g.title)}</b>
            <p>${esc(g.desc)}</p>
            <span class="hk-aa-daily__foot">
              ${g.playedToday
                ? `<span class="hk-aa-daily__state is-done">${HKUI.icon("check", 14, "currentColor")} 오늘 참여 완료</span>`
                : `<span class="hk-aa-daily__state">${HKUI.icon("sparkles", 14, "currentColor")} 아직 도전 전</span>`}
              <span class="hk-aa-daily__go">${g.playedToday ? "연습하기" : "도전하기"} ›</span>
            </span>
          </span>
        </a>`;
      return `<div class="hk-aa-dark">
          <div class="hk-aa-wrap">
            <div class="hk-aa-dark__eyebrow">오늘의 도전</div>
            <h2>매일 바뀌는 판,<br>단 한 번의 기회.</h2>
            <p>여기 있는 게임은 모두가 <b>같은 판</b>을 받아요. 하루에 <b>처음 시작한 판만</b> 순위에 들어가니, 마음의 준비를 하고 시작해 보세요.</p>
            <div class="hk-aa-daily__status">
              <span class="hk-aa-daily__clock">${HKUI.icon("timer", 18, "currentColor")} 오늘 마감까지 <b id="aa-reset">--:--:--</b></span>
              <span class="hk-aa-daily__progress"><span>오늘 <b>${done}</b> / ${daily.length} 완료</span><i><em style="width:${Math.round((done / daily.length) * 100)}%"></em></i></span>
            </div>
            <div class="hk-aa-dailies">${daily.map(card).join("")}</div>
          </div>
        </div>`;
    }

    // 명예의 전당 — 게임별 1~3위. 지난주(월요일마다) · 이번 달(1일~오늘) · 전체를 골라 본다
    const HOF = {
      week: { tab: "지난주", title: "지난주,<br>게임별 1등은 누구?", sub: "매주 월요일에 지난주(월~일) 기록으로 새로 바뀌어요.", empty: "지난주에는 남은 기록이 없어요." },
      month: { tab: "이번 달", title: "이번 달,<br>게임별 1등은 누구?", sub: "이번 달 1일부터 오늘까지의 기록이에요. 매일 바뀌어요.", empty: "이번 달에는 아직 남은 기록이 없어요." },
      all: { tab: "전체", title: "지금까지,<br>게임별 1등은 누구?", sub: "아케이드가 열린 뒤 남긴 모든 기록 중 최고 기록이에요.", empty: "아직 남은 기록이 없어요." },
    };
    const hofCache = {};
    function hofInner(wk) {
      const md = (iso) => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}`;
      const medal = ["#f5b301", "#a8b3c2", "#cd8a4b"];
      const VARIANT = { sci: "과학", khist: "한국사", whist: "세계사", geo: "지리", econ: "경제·사회", lit: "문학", art: "음악·미술", sport: "스포츠", lang: "언어·어원", life: "생활·건강" }; // 상식 퀴즈 분야 — 어느 분야 기록인지 점수 옆에
      const card = (g) => `<a class="hk-aa-hof" href="/games/${g.key}" style="${tintVars(g.key)}">
          <span class="hk-aa-hof__head"><b>${esc(g.title)}</b><small>${GENRE[g.key] || ""}</small></span>
          <ol>${g.top.map((r) => `<li${r.rank === 1 ? ' class="is-1st"' : ""}>
              <span class="hk-aa-hof__rank" style="--m:${medal[r.rank - 1] || "#cbd5e1"}">${r.rank}</span>
              ${HKUI.avatar(r.name, "sm", r.avatarUrl || "")}
              <span class="hk-aa-hof__who"><b>${esc(r.name)}</b><small>${esc(r.department || "")}</small></span>
              <span class="hk-aa-hof__score">${HKPlay.formatScore(g, r.score)}${VARIANT[r.variant] ? `<small class="hk-aa-hof__var">${VARIANT[r.variant]}</small>` : ""}</span>
            </li>`).join("")}</ol>
        </a>`;
      const t = HOF[wk.period] || HOF.week;
      const range = wk.from ? ` · ${md(wk.from)} ~ ${md(wk.to)}` : ` · ${md(wk.to)}까지`;
      return `<span class="hk-aa-offer__eyebrow">${HKUI.icon("trophy", 16, "currentColor")} 명예의 전당${range}</span>
          <h2 class="hk-aa-h2">${t.title}</h2>
          <p class="hk-aa-hofs__sub">${t.sub}</p>
          ${wk.games && wk.games.length ? `<div class="hk-aa-hofs__grid">${wk.games.map(card).join("")}</div>` : `<div class="hk-aa-hofs__empty">${t.empty}</div>`}`;
    }
    function weeklyHtml(wk) {
      if (!wk) return "";
      hofCache[wk.period || "week"] = wk;
      return `<div class="hk-aa-hofs hk-aa-wrap" id="aa-hof">
          <div class="hk-aa-hofs__tabs" role="tablist">${Object.entries(HOF).map(([k, t]) => `<button type="button" role="tab" data-hof="${k}" aria-selected="${k === (wk.period || "week")}">${t.tab}</button>`).join("")}</div>
          <div id="aa-hof-body">${hofInner(wk)}</div>
        </div>`;
    }
    function bindHof(root) {
      const box = root.querySelector("#aa-hof");
      if (!box) return;
      box.addEventListener("click", async (e) => {
        const b = e.target.closest("[data-hof]");
        if (!b || b.getAttribute("aria-selected") === "true") return;
        const period = b.dataset.hof;
        box.querySelectorAll("[data-hof]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
        const body = box.querySelector("#aa-hof-body");
        try {
          const wk = hofCache[period] || (hofCache[period] = await HKApi.playWeekly(period));
          if (b.getAttribute("aria-selected") !== "true") return; // 그새 다른 탭을 눌렀으면 그대로 둔다
          body.innerHTML = hofInner(wk);
          HKUI.refreshIcons(body);
        } catch (err) {
          HKUI.toast(err.message || "불러오지 못했어요", "error");
        }
      });
    }

    // 흘러가는 썸네일 벽은 화면에 보일 때만 움직인다 — 배터리 절약
    function pauseOffscreen(root) {
      if (!window.IntersectionObserver) return;
      const io = new IntersectionObserver((list) => list.forEach((en) => en.target.classList.toggle("is-offscreen", !en.isIntersecting)));
      root.querySelectorAll(".hk-aa-wall").forEach((el) => io.observe(el));
    }

    // 꿀알바 시리즈 2~8화 — 게임 찾기의 「꿀알바 시리즈」 칩에서만 보인다 (1화 심야 편의점은 다른 분류에도 있다)
    const SERIES_ONLY = ["clown", "milk", "theater", "trial", "silent", "parade", "finale"];

    // 「아케이드」 단추(게임 화면 위 「‹ 아케이드」 · 모음 페이지 본문 「‹ 아케이드」 · 공격하러 가기 …)로 오면 맨 위가 아니라 배너 영역(함께하기 · 매니지먼트 · 레트로 오락실)부터 보여 준다.
    // 표시는 member-shell.js(단추를 누를 때) · play.js goQuit(게임을 나갈 때)가 남긴다(sessionStorage hk-aa-land). 사이트 맨 위 메뉴(GNB) · 휴대폰 메뉴 서랍의 「아케이드」는 표시가 없어 맨 위부터.
    //  · 배너 위 알림(받은 도전 · 내 차례)이 늦게 떠 자리가 밀려도 2.5초 동안은 따라가 맞춘다 — 그사이 사람이 움직이면 그대로
    //  · 게임 찾기 분류(#aa-games?cat=…)가 주소에 있으면 그쪽이 먼저 — 그대로 둔다
    const LAND_KEY = "hk-aa-land";
    function takeLandMark() {
      try { const t = Number(sessionStorage.getItem(LAND_KEY) || 0); sessionStorage.removeItem(LAND_KEY); return t && Date.now() - t < 15000; } catch (_) { return false; } // 누르고 바로 온 경우만(확인 창에서 취소했던 표시가 남아도 오래 가지 않게)
    }
    function bannerY() {
      const to = document.getElementById("aa-together");
      if (!to) return null;
      const head = document.querySelector("header");
      const headH = head && getComputedStyle(head).position === "sticky" ? Math.max(0, head.getBoundingClientRect().bottom) : 0;
      return Math.max(0, to.getBoundingClientRect().top + window.scrollY - headH - 16);
    }
    function settleOnBanner() {
      let moved = false;
      const stop = () => { moved = true; };
      ["wheel", "touchstart", "keydown", "mousedown"].forEach((t) => addEventListener(t, stop, { once: true, passive: true }));
      const until = performance.now() + 2500;
      const tick = () => {
        if (moved || performance.now() > until) return;
        const y = bannerY();
        if (y != null && Math.abs(scrollY - y) > 2) window.scrollTo({ top: y, behavior: "instant" });
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(() => requestAnimationFrame(tick));
    }
    function landOnBanner() {
      if (!takeLandMark() || location.hash) return;
      settleOnBanner();
    }

    // 맨 위로 — 한 화면쯤 내려가면 오른쪽 아래에 나타난다
    function bindTop() {
      if (document.getElementById("aa-top")) return;
      const b = document.createElement("button");
      b.type = "button";
      b.id = "aa-top";
      b.className = "hk-aa-top";
      b.setAttribute("aria-label", "맨 위로");
      b.innerHTML = `${HKUI.icon("arrow-up", 20, "currentColor")}<span>맨 위로</span>`;
      document.body.appendChild(b);
      HKUI.refreshIcons(b);
      let raf = 0;
      const sync = () => { raf = 0; b.classList.toggle("is-on", window.scrollY > Math.max(480, innerHeight * 0.8)); };
      addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(sync); }, { passive: true });
      sync();
      b.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        b.blur();
      });
    }

    // 문구에 게임 이름 · 편 수를 적지 않는다 — 게임이 늘어도 고칠 필요 없게
    function togetherHtml() {

      return `<a class="tg-entry" href="/together">
          <span class="tg-entry__copy"><small>새 카테고리 · 둘이서 하는 게임</small><b>함께하기</b>
            <span>동료를 초대해 같이 해요. 입사 동기의 긴 하루를 그린 협동 시리즈${S ? ` 「${esc(S.series.title)}」` : ""}부터 1:1로 겨루는 대전까지.</span>

    // 대전 알림 — 내 차례이거나 받은 도전이 있으면 도장판 바로 아래 알림 칸(#aa-notices)에 띄운다
    // [게임 key, 이름, 「…러 가기」] — 최근에 만든 게임부터. 실시간 경기(축구 · 배구)의 「내 차례」는 아직 들어가지 않은 경기
    const MATCH_NOTICE = [
      ["rummy", "타일 러미", "두러"], ["alkkagi", "알까기", "두러"], ["volley", "옥상 배구"], ["soccer", "헤딩 축구"], ["memory", "도형 짝맞추기"],
      ["gostop", "고스톱", "치러"], ["quizduel", "1:1 퀴즈", "풀러"], ["boxes", "칸 따먹기"], ["baseball", "숫자 야구"], ["chess", "체스", "두러"], ["gomoku", "오목", "두러"],
    ];
    async function matchNotice(root) {
      const box = root.querySelector("#aa-notices"); // 도장판 바로 아래 알림 칸 (꿀알바 입구는 자주 묻는 질문 위로 옮겼다)
      if (!box) return;
      const [inbox, co] = await Promise.all([HKApi.matchInbox().catch(() => null), HKApi.coopInbox().catch(() => null)]);
      const link = (href, text) => {
        const a = document.createElement("a");
        a.className = "hk-aa-match";
        a.href = href;
        a.textContent = text;
        return a;
      };
      // 대전은 MATCH_NOTICE 순서대로, 그다음 협동(받은 초대 · 같이 할 방) — 모아서 한 번에 넣는다
      const list = [];
      MATCH_NOTICE.forEach(([key, name, verb]) => {
        const n = inbox && inbox[key];
        if (!n || (!n.myTurn && !n.incoming)) return;
        list.push(link(`/games/${key}`, [n.incoming ? `받은 도전 ${n.incoming}개` : "", n.myTurn ? `내 차례 ${n.myTurn}판` : ""].filter(Boolean).join(" · ") + ` · ${name} ${verb || "하러"} 가기 ›`));
      });
      Object.values((co && co.rooms) || {}).forEach((g) => {
        if (!g.incoming && !g.ready) return;
        list.push(link(`/games/${g.page}`, [g.incoming ? `받은 초대 ${g.incoming}개` : "", g.ready ? `같이 할 방 ${g.ready}개` : ""].filter(Boolean).join(" · ") + ` · ${g.title} 하러 가기 ›`));
      });
      if (!list.length) return;
      // 넷 이상이면 둘만 보이고 나머지는 한 줄로 — 휴대폰에서 꿀알바 입구가 너무 밀려나지 않게
      const shown = list.length > 3 ? list.slice(0, 2) : list;
      if (shown.length < list.length) {
        const more = link("/together", `다른 게임 ${list.length - shown.length}개에도 받은 도전 · 초대 · 내 차례가 있어요 · 함께하기에서 보기 ›`);
        more.style.cssText = "background:#f1f5f9;color:#334155";
        shown.push(more);
      }
      box.append(...shown);
    }

    // 한국 시간 자정까지 남은 시간 — 1초마다
    function startResetClock() {
      const el = document.getElementById("aa-reset");
      if (!el) return;
      const tick = () => {
        const kst = new Date(Date.now() + 9 * 3600 * 1000);
        const left = 86400 - (kst.getUTCHours() * 3600 + kst.getUTCMinutes() * 60 + kst.getUTCSeconds());
        const p = (n) => String(n).padStart(2, "0");
        el.textContent = `${p(Math.floor(left / 3600))}:${p(Math.floor((left % 3600) / 60))}:${p(left % 60)}`;
      };
      tick();
      setInterval(tick, 1000);
    }

    const FAQ = [
      ["아케이드는 무엇인가요?", "헬스키퍼 회원이면 누구나 즐기는 사내 미니 게임 모음이에요. 설치 없이 PC와 휴대폰 브라우저에서 바로 할 수 있어요."],

    // 의견 보내기 — 하고 싶은 게임 · 오류 신고 · 개선 의견. 보내면 관리자 「게임 요청」에 쌓인다
    const WISH_KINDS = [
      ["GAME", "하고 싶은 게임", "예: 장기, 끝말잇기, 점심 메뉴 룰렛"],
      ["BUG", "오류 신고", "예: 휴대폰에서 시작을 눌러도 안 넘어가요 — 어떤 상황에서 무엇이 안 됐는지 적어 주세요"],

    ];
    let wishGames = [];
    function wishHtml(games) {
      wishGames = games || [];
      return `<div class="hk-aa-wrap hk-aa-wishwrap">
          <form class="hk-aa-wish" id="aa-wish">
            <div class="hk-aa-wish__copy">
              <span class="hk-aa-offer__eyebrow">${HKUI.icon("lightbulb", 16, "currentColor")} 의견 보내기</span>

              <select id="aa-wish-game" class="hk-aa-wish__game" hidden><option value="">어느 게임인가요? (아케이드 전체면 비워 두세요)</option>${wishGames.map((g) => `<option value="${g.key}">${esc(g.title)}</option>`).join("")}</select>
              <textarea id="aa-wish-text" maxlength="300" rows="4" placeholder="${WISH_KINDS[0][2]}"></textarea>
              <div class="hk-aa-wish__foot">
                <span class="hk-aa-wish__msg" id="aa-wish-msg" aria-live="polite"></span>

              </div>
            </div>
          </form>
        </div>`;
    }

    function bindWish() {
      const form = document.getElementById("aa-wish");
      if (!form) return;
      const text = document.getElementById("aa-wish-text");
      const msg = document.getElementById("aa-wish-msg");
      const btn = document.getElementById("aa-wish-send");
      const gameSel = document.getElementById("aa-wish-game");
      let kind = "GAME";
      form.querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => {
        kind = b.dataset.kind;
        form.querySelectorAll("[data-kind]").forEach((x) => { x.classList.toggle("is-on", x === b); x.setAttribute("aria-checked", x === b ? "true" : "false"); });
        text.placeholder = WISH_KINDS.find(([k]) => k === kind)[2];
        gameSel.hidden = kind === "GAME";
        msg.textContent = "";
      }));
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = text.value.trim();
        if (body.length < 2) {
          msg.className = "hk-aa-wish__msg is-err";
          msg.textContent = kind === "GAME" ? "하고 싶은 게임을 적어 주세요." : "내용을 적어 주세요.";
          return text.focus();
        }
        btn.disabled = true;
        try {
          await HKApi.playRequestGame(body, { kind, game: kind === "GAME" ? null : gameSel.value || null, device: HKUI.deviceInfo() });
          text.value = "";
          msg.className = "hk-aa-wish__msg is-ok";
          msg.textContent = "받았어요, 고마워요!";
        } catch (err) {
          msg.className = "hk-aa-wish__msg is-err";
          msg.textContent = err.message || "보내지 못했어요. 잠시 뒤 다시 해 주세요.";
        } finally {
          btn.disabled = false;
        }
      });
      text.addEventListener("input", () => { if (msg.classList.contains("is-err")) msg.textContent = ""; });
    }

          if (window.HKRaid) HKRaid.renderWidget(document.getElementById("aa-raid")).catch(() => null);
        } catch (e) {
          body.innerHTML = `<div class="hk-aa-wrap" style="padding:48px 32px">${HKUI.alertBox("danger", "불러오기 실패", esc(e.message || "게임 목록을 불러오지 못했어요."))}</div>`;
        }
        body.addEventListener("click", async (e) => {
          // 업무 시간 — 플레이·시작하기(게임 링크)를 누르면 안내 창. 그사이 열렸으면 그대로 진행
          const play = e.target.closest('[data-play], a[href^="/games/"]');
          if (play && !status.open) {
            e.preventDefault();
            status = await HKApi.playStatus().catch(() => status);
            if (!status.open) return closedAlert(status);
            if (play.matches('a[href^="/games/"]')) return void (location.href = play.getAttribute("href"));
          }
          const a = e.target.closest("[data-scroll]");
          if (!a) return;
          e.preventDefault();
          // 지금 플레이 · 맨 아래 게임 고르기 → 배너 영역(함께하기 · 매니지먼트 · 레트로 오락실)부터
          // 위에 붙어 있는 머리(메뉴 줄)에 가리지 않게 그 높이 + 16px 만큼 띄운다
          const to = document.getElementById(a.dataset.scroll || "aa-games") || document.getElementById("aa-games");
          if (!to) return;
          const head = document.querySelector("header");
          const headH = head && getComputedStyle(head).position === "sticky" ? Math.max(0, head.getBoundingClientRect().bottom) : 0;
          window.scrollTo({ top: Math.max(0, to.getBoundingClientRect().top + window.scrollY - headH - 16), behavior: "smooth" });
        });
        startResetClock();
        bindWish();
        bindTop();
        HKUI.refreshIcons();
        landOnBanner();
      },
    });
  </script>
</body>
</html>
