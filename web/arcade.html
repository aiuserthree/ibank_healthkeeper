<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // 아케이드 — 소개 페이지처럼: 첫 화면 → 이용 시간 → 게임 모음(대표 + 흐르는 타일) → 오늘의 도전 → 자주 묻는 질문
    const GENRE = {
      blocks: "퍼즐", shooter: "슈팅", match3: "퍼즐", stairs: "액션", crossing: "액션", pairs: "퍼즐", bricks: "액션",
      bubble: "캐주얼", sudoku: "퍼즐", chosung: "퀴즈", trivia: "퀴즈", korean: "퀴즈", typing: "어학",
      snake: "액션", stack: "액션", coffee: "액션", mines: "퍼즐", promote: "퍼즐", nightshift: "액션", clown: "액션", milk: "액션", theater: "액션", trial: "액션", silent: "액션", parade: "액션", finale: "액션",
    };
    const esc = (t) => HKUI.escapeHtml(t);
    // 게임 그림 — 서버가 그림을 한 달 동안 캐시하므로, 그림을 바꾸면 여기 숫자를 올려 새 그림을 받게 한다
    const LOUNGE_IMG_V = { bricks: 2, stairs: 2 };
    const loungeImg = (k) => `/assets/lounge/${k}.jpg${LOUNGE_IMG_V[k] ? `?v=${LOUNGE_IMG_V[k]}` : ""}`;

    function tintVars(key) {
      const [c1, c2] = HKPlay.tintStyle(key).match(/#[0-9a-f]{3,8}/gi) || [];
      return c1 ? `--c1:${c1};--c2:${c2 || c1}` : "";
    }

    function liveNote(st) {
      if (!st.open) return `지금은 업무 시간 · 오늘 <b>${st.opensAt}</b>에 다시 열려요`;
      if (HKLunch.isLunchTime()) return `지금 점심시간 · <b>13:00</b>까지`;
      return `점심 11:30~13:00 · 퇴근 후 18:00~ · 주말·공휴일`;
    }

    function heroHtml(games, st) {
      const keys = games.map((g) => g.key);
      const row = (shift) => {
        const list = keys.slice(shift).concat(keys.slice(0, shift));
        const imgs = list.map((k) => `<img src="${loungeImg(k)}" alt="">`).join("");
        return `<div class="hk-aa-wall__row">${imgs}${imgs}</div>`;
      };
      // 업무 시간에도 버튼은 그대로 — 누르면 안내 창 (아래 click 처리)
      const cta = `<a class="hk-aa-pill" href="#aa-games" data-scroll data-play>지금 플레이</a>`;
      return `<div class="hk-aa-hero">
          <div class="hk-aa-wall" aria-hidden="true">${row(0)}${row(4)}${row(8)}${row(2)}${row(6)}${row(10)}</div>
          <div class="hk-aa-hero__in">
            <h1 class="hk-aa-logo">아케이드</h1>
            <span class="hk-aa-tag">점심엔, 한 판</span>
            <div class="hk-aa-hero__cta">${cta}<span class="hk-aa-hero__note">${liveNote(st)}</span></div>
          </div>
        </div>`;
    }

    function offersHtml(st) {
      const card = (icon, eyebrow, title, desc) => `<div class="hk-aa-offer">
          <span class="hk-aa-offer__eyebrow">${HKUI.icon(icon, 16, "currentColor")} ${eyebrow}</span>
          <b>${title}</b>
          <p>${desc}</p>
        </div>`;
      return `<div class="hk-aa-offers">
          <div class="hk-aa-wrap">
            <h2 class="hk-aa-h2">언제 할 수 있나요.</h2>
            ${st.open ? "" : `<div class="hk-aa-closed">${HKUI.icon("briefcase", 18, "currentColor")}<span>지금은 업무 시간이라 게임을 할 수 없어요 · 오늘 <b>${esc(st.opensAt || "")}</b>에 다시 열려요</span></div>`}
            <div class="hk-aa-offers__grid">
              ${card("utensils", "점심시간", "11:30 ~ 13:00", "점심 먹고 남은 10분,<br>가볍게 한 판.")}
              ${card("moon", "퇴근 후", "18:00 ~", "하루를 마무리하며<br>오늘의 기록 갈아치우기.")}
              ${card("sun", "주말 · 공휴일", "하루 종일", "출근 전(~09:00)에도<br>열려 있어요.")}
            </div>
          </div>
        </div>`;
    }

    // 참여 도장 — 어떤 게임이든 한 판 마치면(일찍 끝나도) 그날 도장 1개, 10개 모일 때마다 무적 쿠폰 (달이 바뀌어도 이어서 · 쿠폰은 한 달 1장)
    function stampHtml(sp) {
      if (!sp) return "";
      const days = sp.days || [];
      const full = sp.count >= sp.goal;
      const md = (iso) => `${Number(iso.slice(5, 7))}.${Number(iso.slice(8, 10))}`;
      const cells = Array.from({ length: sp.goal }, (_, i) => days[i]
        ? `<span class="hk-aa-stamp__cell is-on${i === sp.goal - 1 ? " is-goal" : ""}" style="--r:${((i * 37) % 21) - 10}deg">${HKUI.icon(i === sp.goal - 1 ? "ticket" : "paw-print", 22, "currentColor")}<small>${md(days[i])}</small></span>`
        : `<span class="hk-aa-stamp__cell${i === sp.goal - 1 ? " is-goal" : ""}">${i === sp.goal - 1 ? HKUI.icon("ticket", 20, "currentColor") : `<em>${i + 1}</em>`}</span>`).join("");
      const left = Math.max(0, sp.goal - sp.count);
      const state = sp.pending
        ? `${HKUI.icon("ticket", 16, "currentColor")} 10개 완성! 이번 달 쿠폰은 받아서 다음 달 1일에 들어와요`
        : sp.coupon
        ? `${HKUI.icon("party-popper", 16, "currentColor")} 이번 달 쿠폰을 받았어요 · 다음 쿠폰까지 ${left}개 (다음 달부터)`
        : full ? `${HKUI.icon("ticket", 16, "currentColor")} 도장을 다 모았어요`
        : sp.today ? `${HKUI.icon("check", 16, "currentColor")} 오늘 도장 완료 · 쿠폰까지 ${left}개`
        : `${HKUI.icon("sparkles", 16, "currentColor")} 오늘 한 판 하면 도장 쾅 · 쿠폰까지 ${left}개`;
      return `<div class="hk-aa-stamps">
          <div class="hk-aa-wrap">
            <div class="hk-aa-stamp">
              <div class="hk-aa-stamp__copy">
                <span class="hk-aa-offer__eyebrow">${HKUI.icon("stamp", 16, "currentColor")} 참여 도장</span>
                <h2 class="hk-aa-h2">하루 한 판,<br>도장 하나.</h2>
                <p>어떤 게임이든 <b>한 판</b>을 마치면 그날 도장이 찍혀요.<br><b>${sp.goal}개</b>를 모을 때마다 <b>무적 쿠폰 1장</b>을 드려요.</p>
                <small>모은 도장은 다음 달로 그대로 이어져요 · 쿠폰은 한 달에 1장 ·<br>받은 날부터 30일 동안 쓸 수 있어요.</small>
              </div>
              <div class="hk-aa-stamp__board">
                <div class="hk-aa-stamp__count"><b>${Math.min(sp.count, sp.goal)}</b> / ${sp.goal}</div>
                <div class="hk-aa-stamp__grid">${cells}</div>
                <div class="hk-aa-stamp__state${sp.today || sp.coupon ? " is-done" : ""}">${state}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function tileHtml(g) {
      return `<a class="hk-aa-tile" href="/games/${g.key}">
          <img src="${loungeImg(g.key)}" alt="" loading="lazy" onerror="this.remove()">
          <span class="hk-aa-tile__copy"><span><small>${GENRE[g.key] || ""}</small><b>${esc(g.title)}</b></span><span class="hk-aa-pill is-sm is-white">시작하기</span></span>
        </a>`;
    }

    // 대표 게임 — 매주 월요일(한국 시간)에 다음 게임으로 바뀐다. 2026-11-02 주(아케이드 공지 주)까지 별까지 계단
    const LEAD_ROTATION = [
      "stairs", "match3", "blocks", "crossing", "bubble", "shooter", "stack", "pairs", "snake",
      "bricks", "coffee", "sudoku", "mines", "promote", "typing", "chosung", "trivia", "korean", "nightshift",
    ];
    function weeklyLead(games) {
      const kstWeek = (ms) => Math.floor((Math.floor((ms + 9 * 3600e3) / 864e5) + 3) / 7); // 월요일 시작 주 번호
      const n = Math.max(0, kstWeek(Date.now()) - kstWeek(Date.UTC(2026, 10, 2) - 9 * 3600e3));
      const order = LEAD_ROTATION.map((k) => games.find((g) => g.key === k)).filter(Boolean);
      if (!order.length) return games[0];
      return order[((n % order.length) + order.length) % order.length];
    }

    // 모든 게임 보기 — 벽돌 깨기를 점심 블록 앞에 둔다 (나머지는 그대로)
    function gridOrder(games) {
      const list = games.filter((g) => g.key !== "bricks");
      const bricks = games.find((g) => g.key === "bricks");
      if (!bricks) return games;
      const at = list.findIndex((g) => g.key === "blocks");
      list.splice(at < 0 ? 0 : at, 0, bricks);
      return list;
    }

    function collectionHtml(games) {
      const lead = weeklyLead(games);
      const rest = games.filter((g) => g !== lead);
      const half = Math.ceil(rest.length / 2);
      const rail = (list, rev) => {
        const tiles = list.map(tileHtml).join("");
        return `<div class="hk-aa-rail__row${rev ? " is-rev" : ""}">${tiles}${tiles}</div>`;
      };
      return `<div class="hk-aa-collection" id="aa-games">
          <div class="hk-aa-collection__head hk-aa-wrap">
            <h2>블록, 슈팅, 퀴즈 등<br>게임이 고플 땐.</h2>
            <p>줄을 지우는 퍼즐과 세균을 쓸어버리는 슈팅부터 매일 새로 나오는 상식·한국어·건강 퀴즈,<br>영어 타자까지. 판이 끝나면 점수가 바로 사내 순위에 올라가요.</p>
          </div>
          <a class="hk-aa-feature" href="/games/${lead.key}">
            <img src="${loungeImg(lead.key)}" alt="">
            <div class="hk-aa-feature__in hk-aa-wrap">
              <h3>${esc(lead.title)}</h3>
              <span class="hk-aa-feature__cat">${GENRE[lead.key] || ""} · ${esc(lead.desc)}</span>
              <span class="hk-aa-pill is-white">시작하기</span>
            </div>
          </a>
          <div class="hk-aa-rail" id="aa-rail">${rail(rest.slice(0, half), false)}${rail(rest.slice(half), true)}</div>
          <div class="hk-aa-wrap">
            <div class="hk-aa-grid" id="aa-grid" hidden>${gridOrder(games).map(tileHtml).join("")}</div>
            <div class="hk-aa-all"><a href="#" id="aa-all">모든 게임 보기 ›</a></div>
          </div>
        </div>`;
    }

    // 오늘의 도전 — 모두 같은 문제 · 하루 첫 판만 순위. 오늘 마감까지 남은 시간과 내 참여 여부
    function dailyHtml(games) {
      const daily = games.filter((g) => g.dailyOnce);
      if (!daily.length) return "";
      const done = daily.filter((g) => g.playedToday).length;
      const card = (g) => `<a class="hk-aa-daily" href="/games/${g.key}">
          <span class="hk-aa-daily__art"><img src="${loungeImg(g.key)}" alt="" loading="lazy" onerror="this.remove()"></span>
          <span class="hk-aa-daily__body">
            <small>${GENRE[g.key] || ""}</small>
            <b>${esc(g.title)}</b>
            <p>${esc(g.desc)}</p>
            <span class="hk-aa-daily__foot">
              ${g.playedToday
                ? `<span class="hk-aa-daily__state is-done">${HKUI.icon("check", 14, "currentColor")} 오늘 참여 완료</span>`
                : `<span class="hk-aa-daily__state">${HKUI.icon("sparkles", 14, "currentColor")} 아직 도전 전</span>`}
              <span class="hk-aa-daily__go">${g.playedToday ? "연습하기" : "도전하기"} ›</span>
            </span>
          </span>
        </a>`;
      return `<div class="hk-aa-dark">
          <div class="hk-aa-wrap">
            <div class="hk-aa-dark__eyebrow">오늘의 도전</div>
            <h2>매일 바뀌는 판,<br>단 한 번의 기회.</h2>
            <p>여기 있는 게임은 모두가 <b>같은 판</b>을 받아요. 하루에 <b>처음 시작한 판만</b> 순위에 들어가니, 마음의 준비를 하고 시작해 보세요.</p>
            <div class="hk-aa-daily__status">
              <span class="hk-aa-daily__clock">${HKUI.icon("timer", 18, "currentColor")} 오늘 마감까지 <b id="aa-reset">--:--:--</b></span>
              <span class="hk-aa-daily__progress"><span>오늘 <b>${done}</b> / ${daily.length} 완료</span><i><em style="width:${Math.round((done / daily.length) * 100)}%"></em></i></span>
            </div>
            <div class="hk-aa-dailies">${daily.map(card).join("")}</div>
          </div>
        </div>`;
    }

    // 지난주 명예의 전당 — 게임별 1~3위 (월요일마다 저절로 바뀜)
    function weeklyHtml(wk) {
      if (!wk || !wk.games || !wk.games.length) return "";
      const md = (iso) => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}`;
      const medal = ["#f5b301", "#a8b3c2", "#cd8a4b"];
      const VARIANT = { sci: "과학", khist: "한국사", whist: "세계사", geo: "지리", econ: "경제·사회", lit: "문학", art: "음악·미술", sport: "스포츠", lang: "언어·어원", life: "생활·건강" }; // 상식 퀴즈 분야 — 어느 분야 기록인지 점수 옆에
      const card = (g) => `<a class="hk-aa-hof" href="/games/${g.key}" style="${tintVars(g.key)}">
          <span class="hk-aa-hof__head"><b>${esc(g.title)}</b><small>${GENRE[g.key] || ""}</small></span>
          <ol>${g.top.map((r) => `<li${r.rank === 1 ? ' class="is-1st"' : ""}>
              <span class="hk-aa-hof__rank" style="--m:${medal[r.rank - 1] || "#cbd5e1"}">${r.rank}</span>
              ${HKUI.avatar(r.name, "sm", r.avatarUrl || "")}
              <span class="hk-aa-hof__who"><b>${esc(r.name)}</b><small>${esc(r.department || "")}</small></span>
              <span class="hk-aa-hof__score">${HKPlay.formatScore(g, r.score)}${VARIANT[r.variant] ? `<small class="hk-aa-hof__var">${VARIANT[r.variant]}</small>` : ""}</span>
            </li>`).join("")}</ol>
        </a>`;
      return `<div class="hk-aa-hofs hk-aa-wrap" id="aa-hof">
          <span class="hk-aa-offer__eyebrow">${HKUI.icon("trophy", 16, "currentColor")} 지난주 명예의 전당 · ${md(wk.from)} ~ ${md(wk.to)}</span>
          <h2 class="hk-aa-h2">지난주,<br>게임별 1등은 누구?</h2>
          <p class="hk-aa-hofs__sub">매주 월요일에 지난주(월~일) 기록으로 새로 바뀌어요.</p>
          <div class="hk-aa-hofs__grid">${wk.games.map(card).join("")}</div>
        </div>`;
    }

    // 흘러가는 썸네일 줄은 화면에 보일 때만 움직인다 — 배터리 절약
    function pauseOffscreen(root) {
      if (!window.IntersectionObserver) return;
      const io = new IntersectionObserver((list) => list.forEach((en) => en.target.classList.toggle("is-offscreen", !en.isIntersecting)));
      root.querySelectorAll(".hk-aa-wall, .hk-aa-rail").forEach((el) => io.observe(el));
    }

    // 꿀알바 시리즈 입구 — 시리즈 게임은 시리즈 페이지에서만 고른다 (1화 심야 편의점은 아케이드에도 있다)
    const SERIES_ONLY = ["clown", "milk", "theater", "trial", "silent", "parade", "finale"];
    function seriesHtml() {
      return `<div class="hk-aa-wrap"><a class="hk-aa-series" href="/series"><small>새 시리즈 · 게임 8편</small><b>꿀알바 시리즈</b><span>밤에만 여는 인력사무소의 구인 공고 보러 가기 ›</span></a></div>`;
    }

    // 한국 시간 자정까지 남은 시간 — 1초마다
    function startResetClock() {
      const el = document.getElementById("aa-reset");
      if (!el) return;
      const tick = () => {
        const kst = new Date(Date.now() + 9 * 3600 * 1000);
        const left = 86400 - (kst.getUTCHours() * 3600 + kst.getUTCMinutes() * 60 + kst.getUTCSeconds());
        const p = (n) => String(n).padStart(2, "0");
        el.textContent = `${p(Math.floor(left / 3600))}:${p(Math.floor((left % 3600) / 60))}:${p(left % 60)}`;
      };
      tick();
      setInterval(tick, 1000);
    }

    const FAQ = [
      ["아케이드는 무엇인가요?", "헬스키퍼 회원이면 누구나 즐기는 사내 미니 게임 모음이에요. 설치 없이 PC와 휴대폰 브라우저에서 바로 할 수 있어요."],
      ["언제 할 수 있나요?", "평일 점심시간(11:30~13:00)과 출근 전(~09:00), 퇴근 후(18:00~), 그리고 주말·공휴일에 열려요.<br>업무 시간에는 게임과 순위가 모두 쉬어요."],
      ["순위는 어떻게 정해지나요?", "게임마다 내 최고 기록으로 오늘 · 이번 주 · 전체 순위를 매겨요. 부서 순위는 이번 주 부서 상위 3명 기록의 평균이에요.<br>판이 끝나면 순위표가 열려요."],
      ["오늘의 도전은 무엇인가요?", "스도쿠·퀴즈·지뢰찾기처럼 직원 모두가 같은 판을 받는 게임이에요. 하루에 처음 시작한 판만 순위에 들어가고,<br>그다음 판은 기록에 안 남아요."],
      ["참여 도장은 어떻게 모으나요?", "어떤 게임이든 한 판을 마치면 그날 도장 1개가 찍혀요. 일찍 끝난 판도 괜찮아요. 하루에 여러 판을 해도 도장은 1개예요.<br>10개를 모을 때마다 무적 쿠폰 1장을 드려요. 모은 도장은 다음 달로 그대로 이어지고, 쿠폰은 한 달에 1장 · 받은 날부터 30일 동안 쓸 수 있어요."],
      ["퀴즈에 시간 제한이 있나요?", "상식 · 한국어 퀴즈는 문제마다 20초, 건강 초성 퀴즈는 40초예요. 빨리 맞힐수록 보너스가 조금 붙어요."],
      ["휴대폰에서도 할 수 있나요?", "네. 화면을 끌거나 눌러서 조작해요. 영어 타자 레이스처럼 키보드를 많이 쓰는 게임은 PC가 더 편해요."],
    ];
    function faqHtml() {
      return `<div class="hk-aa-faq hk-aa-wrap">
          <h2 class="hk-aa-h2">자주 묻는 질문에 대한 답변.</h2>
          ${FAQ.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}
        </div>`;
    }

    // 의견 보내기 — 하고 싶은 게임 · 오류 신고 · 개선 의견. 보내면 관리자 「게임 요청」에 쌓인다
    const WISH_KINDS = [
      ["GAME", "하고 싶은 게임", "예: 오목, 끝말잇기, 점심 메뉴 룰렛"],
      ["BUG", "오류 신고", "예: 휴대폰에서 시작을 눌러도 안 넘어가요 — 어떤 상황에서 무엇이 안 됐는지 적어 주세요"],
      ["IDEA", "개선 의견", "예: 순위표에서 우리 부서만 따로 보고 싶어요"],
    ];
    let wishGames = [];
    function wishHtml(games) {
      wishGames = games || [];
      return `<div class="hk-aa-wrap hk-aa-wishwrap">
          <form class="hk-aa-wish" id="aa-wish">
            <div class="hk-aa-wish__copy">
              <span class="hk-aa-offer__eyebrow">${HKUI.icon("lightbulb", 16, "currentColor")} 의견 보내기</span>
              <h2 class="hk-aa-h2">이런 게임 있으면<br>좋겠어요.</h2>
              <p>하고 싶은 게임, 오류, 바라는 점을<br>편하게 적어 주세요.</p>
            </div>
            <div class="hk-aa-wish__box">
              <div class="hk-aa-wish__kinds" role="radiogroup">${WISH_KINDS.map(([k, l], i) => `<button type="button" class="hk-aa-wish__kind${i ? "" : " is-on"}" data-kind="${k}" role="radio" aria-checked="${i ? "false" : "true"}">${l}</button>`).join("")}</div>
              <select id="aa-wish-game" class="hk-aa-wish__game" hidden><option value="">어느 게임인가요? (아케이드 전체면 비워 두세요)</option>${wishGames.map((g) => `<option value="${g.key}">${esc(g.title)}</option>`).join("")}</select>
              <textarea id="aa-wish-text" maxlength="300" rows="4" placeholder="${WISH_KINDS[0][2]}"></textarea>
              <div class="hk-aa-wish__foot">
                <span class="hk-aa-wish__msg" id="aa-wish-msg" aria-live="polite"></span>
                <button type="submit" class="hk-aa-pill is-sm" id="aa-wish-send">보내기</button>
              </div>
            </div>
          </form>
        </div>`;
    }

    function bindWish() {
      const form = document.getElementById("aa-wish");
      if (!form) return;
      const text = document.getElementById("aa-wish-text");
      const msg = document.getElementById("aa-wish-msg");
      const btn = document.getElementById("aa-wish-send");
      const gameSel = document.getElementById("aa-wish-game");
      let kind = "GAME";
      form.querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => {
        kind = b.dataset.kind;
        form.querySelectorAll("[data-kind]").forEach((x) => { x.classList.toggle("is-on", x === b); x.setAttribute("aria-checked", x === b ? "true" : "false"); });
        text.placeholder = WISH_KINDS.find(([k]) => k === kind)[2];
        gameSel.hidden = kind === "GAME";
        msg.textContent = "";
      }));
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = text.value.trim();
        if (body.length < 2) {
          msg.className = "hk-aa-wish__msg is-err";
          msg.textContent = kind === "GAME" ? "하고 싶은 게임을 적어 주세요." : "내용을 적어 주세요.";
          return text.focus();
        }
        btn.disabled = true;
        try {
          await HKApi.playRequestGame(body, { kind, game: kind === "GAME" ? null : gameSel.value || null, device: HKUI.deviceInfo() });
          text.value = "";
          msg.className = "hk-aa-wish__msg is-ok";
          msg.textContent = "받았어요, 고마워요!";
        } catch (err) {
          msg.className = "hk-aa-wish__msg is-err";
          msg.textContent = err.message || "보내지 못했어요. 잠시 뒤 다시 해 주세요.";
        } finally {
          btn.disabled = false;
        }
      });
      text.addEventListener("input", () => { if (msg.classList.contains("is-err")) msg.textContent = ""; });
    }

    function endHtml() {
      return `<div class="hk-aa-end">
          <div class="hk-aa-wrap">
            <p>점심 먹고 남은 10분,<br>오늘 사내 1위에 도전해 보세요.</p>
            <a class="hk-aa-pill" href="#aa-games" data-scroll>게임 고르기</a>
          </div>
        </div>`;
    }

    let status = { open: true };
    function closedAlert(st) {
      HKUI.confirmDialog(
        "지금은 업무 시간이에요",
        `게임은 <b>점심시간(11:30~13:00)</b>과 <b>퇴근 후(18:00~)</b>, <b>출근 전(~09:00)</b>, 주말·공휴일에 할 수 있어요.${st.opensAt ? `<br>오늘 <b>${esc(st.opensAt)}</b>에 다시 열려요.` : ""}`,
        { hideCancel: true, confirmLabel: "확인" }
      );
    }

    HKMember.mountPage({
      active: "lounge",
      auth: true,
      mainStyle: "padding:0",
      render: () => `<div class="hk-aa" id="arcade-body"><div style="text-align:center;padding:120px 0"><span class="hk-spin"></span></div></div>`,
      afterMount: async () => {
        const body = document.getElementById("arcade-body");
        try {
          const [st, allGames, sp, wk] = await Promise.all([HKApi.playStatus().catch(() => ({ open: true })), HKApi.playGames(), HKApi.playStamps().catch(() => null), HKApi.playWeekly().catch(() => null)]);
          status = st;
          const games = allGames.filter((g) => !SERIES_ONLY.includes(g.key));
          body.innerHTML = heroHtml(games, st) + offersHtml(st) + stampHtml(sp) + seriesHtml() + collectionHtml(games) + dailyHtml(games) + weeklyHtml(wk) + faqHtml() + wishHtml(games) + endHtml();
          pauseOffscreen(body);
        } catch (e) {
          body.innerHTML = `<div class="hk-aa-wrap" style="padding:48px 32px">${HKUI.alertBox("danger", "불러오기 실패", esc(e.message || "게임 목록을 불러오지 못했어요."))}</div>`;
        }
        body.addEventListener("click", async (e) => {
          // 업무 시간 — 플레이·시작하기(게임 링크)를 누르면 안내 창. 그사이 열렸으면 그대로 진행
          const play = e.target.closest('[data-play], a[href^="/games/"]');
          if (play && !status.open) {
            e.preventDefault();
            status = await HKApi.playStatus().catch(() => status);
            if (!status.open) return closedAlert(status);
            if (play.matches('a[href^="/games/"]')) return void (location.href = play.getAttribute("href"));
          }
          const a = e.target.closest("[data-scroll]");
          if (!a) return;
          e.preventDefault();
          document.getElementById("aa-games")?.scrollIntoView({ behavior: "smooth" });
        });
        startResetClock();
        bindWish();
        // 모든 게임 보기 — 흐르는 타일 대신 바둑판으로
        document.getElementById("aa-all")?.addEventListener("click", (e) => {
          e.preventDefault();
          const grid = document.getElementById("aa-grid");
          const open = grid.hidden;
          grid.hidden = !open;
          document.getElementById("aa-rail").hidden = open;
          e.target.textContent = open ? "흐르는 화면으로 보기 ›" : "모든 게임 보기 ›";
        });
        HKUI.refreshIcons();
      },
    });
  </script>
</body>
</html>
