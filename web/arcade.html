<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/logo-mark.svg">
  <title>헬스키퍼 — 아케이드</title>
  <link rel="stylesheet" href="/_ds/healthkeeper-ds-31e44bd2-68dd-4c55-91c3-7ca10811b6be/styles.css">
  <link rel="stylesheet" href="/_shared/responsive.css">
  <link rel="stylesheet" href="/_shared/app.css">
  <script src="/_shared/ui.js"></script>
  <script src="/_shared/api.js"></script>
  <script src="/_shared/member-shell.js"></script>
  <script src="/_shared/play.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // 아케이드 — 소개 페이지처럼: 첫 화면 → 큰 문장 → 이용 시간 → 게임 모음(대표 + 흐르는 타일) → 사내 순위 → 자주 묻는 질문
    const GENRE = {
      blocks: "퍼즐", shooter: "슈팅", match3: "퍼즐", stairs: "액션", crossing: "액션", pairs: "퍼즐", bricks: "액션",
      bubble: "캐주얼", sudoku: "퍼즐", chosung: "퀴즈", trivia: "퀴즈", korean: "퀴즈", typing: "어학",
    };
    const esc = (t) => HKUI.escapeHtml(t);

    function tintVars(key) {
      const [c1, c2] = HKPlay.tintStyle(key).match(/#[0-9a-f]{3,8}/gi) || [];
      return c1 ? `--c1:${c1};--c2:${c2 || c1}` : "";
    }

    function liveNote(st) {
      if (!st.open) return `지금은 업무 시간 · 오늘 <b>${st.opensAt}</b>에 다시 열려요`;
      if (HKLunch.isLunchTime()) return `지금 점심시간 · <b>13:00</b>까지`;
      return `점심 11:30~13:00 · 퇴근 후 18:00~ · 주말·공휴일`;
    }

    function heroHtml(games, st) {
      const keys = games.map((g) => g.key);
      const row = (shift) => {
        const list = keys.slice(shift).concat(keys.slice(0, shift));
        const imgs = list.map((k) => `<img src="/assets/lounge/${k}.jpg" alt="">`).join("");
        return `<div class="hk-aa-wall__row">${imgs}${imgs}</div>`;
      };
      const cta = st.open
        ? `<a class="hk-aa-pill" href="#aa-games" data-scroll>지금 플레이</a>`
        : `<span class="hk-aa-pill is-off">${esc(st.opensAt || "")}에 열려요</span>`;
      return `<div class="hk-aa-hero">
          <div class="hk-aa-wall" aria-hidden="true">${row(0)}${row(4)}${row(8)}${row(2)}${row(6)}${row(10)}</div>
          <div class="hk-aa-hero__in">
            <h1 class="hk-aa-logo">아케이드</h1>
            <span class="hk-aa-tag">점심엔, 한 판</span>
            <div class="hk-aa-hero__cta">${cta}<span class="hk-aa-hero__note">${liveNote(st)}</span></div>
          </div>
        </div>`;
    }

    function propsHtml(games) {
      return `<div class="hk-aa-props hk-aa-wrap">
          <p><em>${games.length}가지</em> 게임을 즐길 수 있는 곳.</p>
          <p><em>점심시간</em>에도, <em>퇴근 후</em>에도<br>PC와 휴대폰을 넘나들며 플레이.</p>
          <p><em>설치도 제로.</em><br>결제도 제로.<br>광고도 제로.</p>
          <p><em>사내 순위</em>로 동료와 함께.</p>
          <p>메뉴의 <span class="hk-aa-inline-icon">${HKUI.icon("gamepad-2", 26, "#fff")}</span> <em>아케이드</em>에서 바로 시작.</p>
        </div>`;
    }

    function offersHtml(st) {
      const card = (icon, eyebrow, title, desc) => `<div class="hk-aa-offer">
          <span class="hk-aa-offer__eyebrow">${HKUI.icon(icon, 16, "currentColor")} ${eyebrow}</span>
          <b>${title}</b>
          <p>${desc}</p>
          <a class="hk-aa-pill is-sm" href="#aa-games" data-scroll>게임 고르기</a>
        </div>`;
      return `<div class="hk-aa-offers">
          <div class="hk-aa-wrap">
            <h2 class="hk-aa-h2">언제 할 수 있나요.</h2>
            ${st.open ? "" : `<div class="hk-aa-closed">${HKUI.icon("briefcase", 18, "currentColor")}<span>지금은 업무 시간이라 게임을 할 수 없어요 · 오늘 <b>${esc(st.opensAt || "")}</b>에 다시 열려요</span></div>`}
            <div class="hk-aa-offers__grid">
              ${card("utensils", "점심시간", "11:30 ~ 13:00", "점심 먹고 남은 10분,<br>가볍게 한 판.")}
              ${card("moon", "퇴근 후", "18:00 ~", "하루를 마무리하며<br>오늘의 기록 갈아치우기.")}
              ${card("sun", "주말 · 공휴일", "하루 종일", "출근 전(~09:00)에도<br>열려 있어요.")}
            </div>
          </div>
        </div>`;
    }

    function tileHtml(g) {
      return `<a class="hk-aa-tile" href="/games/${g.key}">
          <img src="/assets/lounge/${g.key}.jpg" alt="" loading="lazy" onerror="this.remove()">
          <span class="hk-aa-tile__copy"><span><small>${GENRE[g.key] || ""}</small><b>${esc(g.title)}</b></span><span class="hk-aa-pill is-sm is-white">시작하기</span></span>
        </a>`;
    }

    function collectionHtml(games) {
      // 대표 게임 — 그림 왼쪽 아래가 비어 있어 글씨가 잘 읽히는 세균 격파
      const lead = games.find((g) => g.key === "shooter") || games[0];
      const rest = games.filter((g) => g !== lead);
      const half = Math.ceil(rest.length / 2);
      const rail = (list, rev) => {
        const tiles = list.map(tileHtml).join("");
        return `<div class="hk-aa-rail__row${rev ? " is-rev" : ""}">${tiles}${tiles}</div>`;
      };
      return `<div class="hk-aa-collection" id="aa-games">
          <div class="hk-aa-collection__head hk-aa-wrap">
            <h2>블록, 슈팅, 퀴즈 등.<br>게임이 고플 땐.</h2>
            <p>줄을 지우는 퍼즐과 세균을 쓸어버리는 슈팅부터 매일 새로 나오는 상식·한국어·건강 퀴즈, 영어 타자까지. 판이 끝나면 점수가 바로 사내 순위에 올라가요.</p>
          </div>
          <a class="hk-aa-feature" href="/games/${lead.key}">
            <img src="/assets/lounge/${lead.key}.jpg" alt="">
            <div class="hk-aa-feature__in hk-aa-wrap">
              <h3>${esc(lead.title)}</h3>
              <span class="hk-aa-feature__cat">${GENRE[lead.key] || ""} · ${esc(lead.desc)}</span>
              <span class="hk-aa-pill is-white">시작하기</span>
            </div>
          </a>
          <div class="hk-aa-rail" id="aa-rail">${rail(rest.slice(0, half), false)}${rail(rest.slice(half), true)}</div>
          <div class="hk-aa-wrap">
            <div class="hk-aa-grid" id="aa-grid" hidden>${games.map(tileHtml).join("")}</div>
            <div class="hk-aa-all"><a href="#" id="aa-all">모든 게임 보기 ›</a></div>
          </div>
        </div>`;
    }

    function ranksHtml(games, st) {
      const body = !st.open
        ? `<div class="hk-aa-dark__off">업무 시간에는 순위도 쉬어요 · 오늘 ${esc(st.opensAt || "")}에 다시 열려요</div>`
        : `<div class="hk-aa-ranks">${games.map((g) => `<a class="hk-aa-rank" href="/games/${g.key}" style="${tintVars(g.key)}">
              <span class="hk-aa-rank__icon">${HKUI.icon(g.icon || "gamepad-2", 24, "#fff")}</span>
              <span class="hk-aa-rank__text"><small>${esc(g.title)} · 오늘 1위</small>${g.todayTop ? `<b>${esc(g.todayTop.name)}</b>` : `<b class="is-empty">아직 1위가 없어요</b>`}</span>
              ${g.todayTop ? `<span class="hk-aa-rank__score">${HKPlay.formatScore(g, g.todayTop.score)}</span>` : ""}
            </a>`).join("")}</div>`;
      return `<div class="hk-aa-dark">
          <div class="hk-aa-wrap">
            <div class="hk-aa-dark__eyebrow">사내 순위</div>
            <h2>동료와 함께하는 즐거움.</h2>
            <p>게임마다 <b>오늘 · 이번 주 · 전체</b> 순위와 <b>부서 순위</b>가 있어요. 부서 순위는 부서 상위 3명 기록의 평균이라, 인원이 적은 부서도 1위를 노릴 수 있어요.</p>
            ${body}
          </div>
        </div>`;
    }

    const FAQ = [
      ["아케이드는 무엇인가요?", "헬스키퍼 회원이면 누구나 즐기는 사내 미니 게임 모음이에요. 설치 없이 PC와 휴대폰 브라우저에서 바로 할 수 있어요."],
      ["언제 할 수 있나요?", "평일 점심시간(11:30~13:00)과 출근 전(~09:00), 퇴근 후(18:00~), 그리고 주말·공휴일에 열려요. 업무 시간에는 게임과 순위가 모두 쉬어요."],
      ["순위는 어떻게 정해지나요?", "게임마다 내 최고 기록으로 오늘 · 이번 주 · 전체 순위를 매겨요. 부서 순위는 이번 주 부서 상위 3명 기록의 평균이에요. 판이 끝나면 순위표가 열려요."],
      ["오늘의 도전은 무엇인가요?", "스도쿠와 퀴즈처럼 모두가 같은 문제를 받는 게임이에요. 하루에 처음 시작한 판만 순위에 들어가고, 그다음 판은 연습으로 기록돼요."],
      ["퀴즈에 시간 제한이 있나요?", "상식 · 한국어 퀴즈는 문제마다 20초, 건강 초성 퀴즈는 40초예요. 빨리 맞힐수록 보너스가 조금 붙어요."],
      ["휴대폰에서도 할 수 있나요?", "네. 화면을 끌거나 눌러서 조작해요. 영어 타자 레이스처럼 키보드를 많이 쓰는 게임은 PC가 더 편해요."],
    ];
    function faqHtml() {
      return `<div class="hk-aa-faq hk-aa-wrap">
          <h2 class="hk-aa-h2">자주 묻는 질문에 대한 답변.</h2>
          ${FAQ.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}
        </div>`;
    }

    function endHtml() {
      return `<div class="hk-aa-end">
          <div class="hk-aa-wrap">
            <p>점심 먹고 남은 10분,<br>오늘 사내 1위에 도전해 보세요.</p>
            <a class="hk-aa-pill" href="#aa-games" data-scroll>게임 고르기</a>
          </div>
        </div>`;
    }

    HKMember.mountPage({
      active: "lounge",
      auth: true,
      mainStyle: "padding:0",
      render: () => `<div class="hk-aa" id="arcade-body"><div style="text-align:center;padding:120px 0"><span class="hk-spin"></span></div></div>`,
      afterMount: async () => {
        const body = document.getElementById("arcade-body");
        try {
          const [st, games] = await Promise.all([HKApi.playStatus().catch(() => ({ open: true })), HKApi.playGames()]);
          body.innerHTML = heroHtml(games, st) + propsHtml(games) + offersHtml(st) + collectionHtml(games) + ranksHtml(games, st) + faqHtml() + endHtml();
        } catch (e) {
          body.innerHTML = `<div class="hk-aa-wrap" style="padding:48px 32px">${HKUI.alertBox("danger", "불러오기 실패", esc(e.message || "게임 목록을 불러오지 못했어요."))}</div>`;
        }
        body.addEventListener("click", (e) => {
          const a = e.target.closest("[data-scroll]");
          if (!a) return;
          e.preventDefault();
          document.getElementById("aa-games")?.scrollIntoView({ behavior: "smooth" });
        });
        // 모든 게임 보기 — 흐르는 타일 대신 바둑판으로
        document.getElementById("aa-all")?.addEventListener("click", (e) => {
          e.preventDefault();
          const grid = document.getElementById("aa-grid");
          const open = grid.hidden;
          grid.hidden = !open;
          document.getElementById("aa-rail").hidden = open;
          e.target.textContent = open ? "흐르는 화면으로 보기 ›" : "모든 게임 보기 ›";
        });
        HKUI.refreshIcons();
      },
    });
  </script>
</body>
</html>
