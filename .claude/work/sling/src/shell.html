<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/_shared/no-zoom.js"></script>
  <script src="/_shared/mgmt.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>곰돌이 새총 원정대</title>
<style>
@font-face{font-family:'Pretendard';src:url('/assets/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--u:1;--uc:1;--sb:0px;--tbg:linear-gradient(#8fd0f5 0%,#cfeefb 54%,#86cf5e 54%,#4f9a35 100%);--font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d3a52;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#8fd0f5}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none}
.corner{position:absolute;transform:scale(var(--u))}
#tl{left:0;top:0;transform-origin:0 0}
#tc{left:50%;top:0;transform:translateX(-50%) scale(var(--u));transform-origin:50% 0}
#tr{right:0;top:0;transform-origin:100% 0}
#bl{left:0;bottom:var(--sb,0px);transform-origin:0 100%}
#cc{left:50%;top:0;transform:translateX(-50%) scale(var(--u));transform-origin:50% 0}
.p{position:absolute;color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.pill{border-radius:999px;border:4px solid #2a1a0e;box-shadow:0 4px 0 #2a1a0e;padding:6px 18px;font-size:22px;display:flex;align-items:center;gap:8px}
.sq{width:58px;height:58px;border-radius:16px;background:#8a5a2e;border:4px solid #2a1a0e;box-shadow:0 4px 0 #2a1a0e;display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:auto;cursor:pointer}
.sq:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a0e}
.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe680,#f0b000 60%,#b07800);border:2px solid #7a5000;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#7a5000}
#slots{position:absolute;left:22px;bottom:14px;height:110px;width:700px}
.slot{position:absolute;bottom:8px;width:72px;height:72px;border-radius:50%;background:#fff3dc;border:4px solid #2a1a0e;box-shadow:0 4px 0 #2a1a0e;display:flex;align-items:center;justify-content:center;font-size:34px;transition:all .25s}
.slot.on{width:96px;height:96px;bottom:0;background:#ffd23a;border-width:5px;font-size:44px}
.slot.used{opacity:.45;filter:grayscale(1)}
.tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;border-radius:8px;padding:2px 8px;border:2px solid #2a1a0e;white-space:nowrap}
.big{position:absolute;font-weight:900;color:#ffe14a;-webkit-text-stroke:4px #6a2a00;text-shadow:0 6px 0 #6a2a00;letter-spacing:2px;white-space:nowrap}
#enemy{left:50%;transform:translateX(-50%);top:14px;background:#7d45c9;font-size:38px;padding:4px 26px}
#enemy .ok{display:none;width:40px;height:40px;border-radius:50%;background:#3cc24a;border:3px solid #1d5a20;font-size:26px;align-items:center;justify-content:center}
#enemy.zero .ok{display:inline-flex}#enemy.zero .n{display:none}
#minus{left:calc(50% + 112px);top:20px;font-size:34px;color:#ff5a4a;-webkit-text-stroke:2px #5a0000;opacity:0;transition:opacity .2s}
#banner{left:50%;transform:translateX(-50%);top:150px;background:#2c96b0;border-radius:22px;flex-direction:column;gap:2px;padding:10px 34px;transition:opacity .4s}
#banner .t1{font-size:30px}#banner .t2{font-size:17px;font-weight:700}
#crumble{left:50%;top:150px;font-size:86px;transform:translateX(-50%) rotate(-4deg) scale(.4);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .25s}
#crumble.show{opacity:1;transform:translateX(-50%) rotate(-4deg) scale(1)}
#hint{left:50%;transform:translateX(-50%);top:520px;font-size:34px;color:#fff;-webkit-text-stroke:2px #3a2410;text-shadow:0 4px 0 #3a2410;animation:hb 1.2s ease-in-out infinite}
@keyframes hb{50%{transform:translateX(-50%) translateY(-6px)}}
#hand{position:absolute;font-size:56px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));animation:hp 1.6s ease-in-out infinite}
@keyframes hp{0%{transform:translate(0,0)}60%{transform:translate(-26px,70px)}100%{transform:translate(-26px,70px);opacity:0}}
.fl{position:absolute;font-weight:900;color:#fff;-webkit-text-stroke:3px #6a2a00;text-shadow:0 4px 0 #6a2a00;font-size:40px;transform:translate(-50%,-50%) scale(var(--u));pointer-events:none;white-space:nowrap}
.dim{position:absolute;inset:0;background:rgba(20,40,60,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;padding-bottom:var(--sb,0px)}
.card{flex:none;background:#fff4de;border:6px solid #4a2a12;border-radius:26px;box-shadow:0 10px 0 #2a1a0e;overflow:hidden;width:520px;text-align:center;transform:scale(var(--uc,var(--u)));font-weight:900;color:#4a2a12}
.ttl{background:#c8352e;border-bottom:6px solid #4a2a12;color:#fff;font-size:34px;padding:12px;text-shadow:0 3px 0 #6a1010}
.card .body{padding:22px 24px 26px;font-size:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.btns{display:flex;gap:14px;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:900;color:#fff;border-radius:22px;border:4px solid #2a1a0e;box-shadow:0 6px 0 #2a1a0e;text-shadow:0 2px 0 rgba(0,0,0,.3);height:62px;min-width:170px;padding:0 20px;font-size:26px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2a1a0e}
.g{background:linear-gradient(#5be36a,#28b33a)}.b{background:linear-gradient(#a8703c,#7a4a22)}

/* 특수 곰 글씨 */
.fl.sp-b{z-index:3;color:#ffd23a;-webkit-text-stroke:4px #7a2a00;text-shadow:0 6px 0 #7a2a00}
.fl.sp-s{z-index:2;color:#bfe8ff;-webkit-text-stroke:3px #12407a;text-shadow:0 4px 0 #12407a}
.fl.sp-g{z-index:2;color:#ff7a3a;-webkit-text-stroke:3px #5a1a00;text-shadow:0 4px 0 #5a1a00}
#sp{transform:translate(-50%,-100%) scale(var(--u));font-size:28px;padding:4px 14px;border-radius:14px;border:3px solid #2a1a0e;background:#fff3dc;color:#4a2a12;text-shadow:none;animation:spb .7s ease-in-out infinite}
#sp.sp-b{background:#ffe07a}#sp.sp-s{background:#cfeaff}#sp.sp-g{background:#ffc49a}
@keyframes spb{50%{margin-top:-6px}}
#bossbar{left:50%;transform:translateX(-50%);top:92px;background:#3a332e;font-size:18px;padding:4px 16px;gap:2px}
#bossbar .hp{color:#6a5a52;font-size:22px}#bossbar .hp.on{color:#ff4a5a}
/* 결과 · 멈춤 카드 */
.ttl.teal{background:#2c96b0;text-shadow:0 3px 0 #0e4a5a}.ttl.brown{background:#8a5a2e;text-shadow:0 3px 0 #3a2410}
.card.res,.card.pz{width:560px;border-color:#8a5a2e;box-shadow:0 10px 0 #4a2a12}
.card.res .body,.card.pz .body{gap:12px;padding:18px 28px 26px}
.lvname{font-size:24px;color:#8a5a2e}
.stars{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:2px 0 4px}
.star{font-size:62px;line-height:1;color:#d8cbb4;-webkit-text-stroke:3px #4a2a12}.star.on{color:#ffd23a}.star.mid{font-size:84px}
.row{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:4px solid #e9c89a;border-radius:16px;padding:8px 18px;font-size:22px}
.row .ic{width:40px;text-align:center;font-size:26px}.row .lb{flex:1;text-align:center;color:#4a2a12}.row .vl{min-width:110px;text-align:right;font-size:28px}
.row .vl.pur{color:#7d45c9}.row .vl.grn{color:#2fa53c}.row.tip .lb{text-align:left;font-size:19px;font-weight:800}
.bigic{font-size:64px;line-height:1}.left{color:#d0342c;font-size:28px}
.btn.sm{height:54px;min-width:150px;font-size:22px}.btn.wide{min-width:280px;height:72px;font-size:32px;border-radius:26px}
.btn.wide2{min-width:340px;height:58px;font-size:24px}
.rbtn{width:62px;height:62px;border-radius:50%;background:linear-gradient(#a8703c,#7a4a22);border:4px solid #2a1a0e;box-shadow:0 5px 0 #2a1a0e;font-size:26px;display:inline-flex;align-items:center;justify-content:center}
.rbtn.off{filter:grayscale(1);opacity:.55}
.coin{flex:none}
/* 지도 */
.dim.map{background:rgba(20,60,90,.55)}
.card.mapc{width:1180px;border-color:#5a3a1a;box-shadow:0 12px 0 #2a1a0e;background:#f6e6c4}
.mapc .ttl{position:relative;font-size:36px}
.mgold,.mstar{position:absolute;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:8px;background:#3a332e;border-radius:999px;padding:4px 16px 4px 8px;font-size:22px;border:3px solid #2a1a0e;text-shadow:none}
.mgold{right:18px}.mstar{left:18px;color:#ffd23a;padding-left:16px}
.mapbody{position:relative;width:1120px;height:470px;margin:14px auto 0}
.region{position:absolute;top:10px;border-radius:50%;border:5px dashed}
.region.f{left:20px;width:520px;height:450px;background:radial-gradient(#cdeaa4,#a9d77a);border-color:#5aa040}
.region.s{left:570px;width:530px;height:450px;background:radial-gradient(#d9c9ef,#b9a2df);border-color:#7a5aa8}
.rtag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;padding:5px 18px;border-radius:14px;border:4px solid #2a1a0e;box-shadow:0 4px 0 #2a1a0e;white-space:nowrap}
.region.f .rtag{background:#2c96b0}.region.s .rtag{background:#7d45c9}
.mpath{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3dc,#f2c88e);border:5px solid #4a2a12;box-shadow:0 5px 0 #4a2a12;font-size:36px;font-weight:900;color:#4a2a12;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.node.boss{width:104px;height:104px;font-size:40px}
.node.boss .bi{font-size:44px}.node.boss .bn{position:absolute;bottom:-8px;right:-6px;background:#c8352e;color:#fff;font-size:20px;border-radius:12px;padding:0 8px;border:3px solid #2a1a0e}
.node.lock{background:radial-gradient(circle at 40% 35%,#e6e1d8,#b9b2a6);color:#6a625a;font-size:30px;cursor:default}
.node.sel{box-shadow:0 5px 0 #4a2a12,0 0 0 9px #ffe14a,0 0 26px 12px rgba(255,225,74,.8);animation:nsel 1.1s ease-in-out infinite}
@keyframes nsel{50%{box-shadow:0 5px 0 #4a2a12,0 0 0 13px #ffe14a,0 0 34px 16px rgba(255,225,74,.55)}}
.nst{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);display:flex;gap:1px;white-space:nowrap}
.nst .star{font-size:24px;-webkit-text-stroke:2px #4a2a12}
.mapfoot{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0 22px}
.mname{font-size:24px;color:#4a2a12;min-width:300px;text-align:right}
/* 곰 마을(자리만 — 3단계) */
.card.vil{width:760px;border-color:#5a3a1a}.pillg{display:inline-flex;align-items:center;gap:8px;background:#3a332e;color:#fff;border-radius:999px;padding:6px 18px 6px 8px;font-size:24px;border:3px solid #2a1a0e}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.up{background:#fff;border:4px solid #e9c89a;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.upic{font-size:40px}.upn{font-size:24px}.upd{font-size:16px;color:#8a6a4a}.soon{margin-top:4px;background:#b9b2a6;color:#fff;border-radius:14px;padding:4px 16px;font-size:18px}
/* 3단계: 그림 · 첫 화면 · 곰 마을 · 지도 그림 */
.art{display:inline-block;object-fit:contain;vertical-align:middle;flex:none}
img.art{width:1.5em;height:1.5em}.ae{line-height:1}
.slin{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}.slot .tag{z-index:2}
.slot img.art.sl{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;transform:scale(1.08)}
#enemyIc .pi{width:52px;height:52px;margin:-8px 0 -8px -10px}#enemyIc .ae{font-size:38px}
#bossbar img.pi{width:30px;height:30px;margin:-6px 4px -6px -6px}
.row .ic img.art{width:40px;height:40px;margin:-6px 0}
.bigic{display:flex;justify-content:center;align-items:center;height:104px}.bigic img.art.big{width:104px;height:104px}
img.art.bi{width:34px;height:34px;margin:-6px -2px -6px -6px}
.node img.art.nb{width:74px;height:74px;margin-top:-6px}
#banner.low{top:572px;left:auto;right:0;transform:none}
.card.res .body{gap:9px;padding:14px 28px 22px}
.card.res .row{padding:5px 18px}.card.res .row .vl{font-size:25px}
.card.res .star{font-size:54px}.card.res .star.mid{font-size:74px}
.s3tip{font-size:18px;color:#8a5a2e;background:#fde6b4;border-radius:999px;padding:3px 16px;margin-top:-4px}.s3tip.ok{background:#d8f5c8;color:#2a7a2a}
.sc{font-size:18px;color:#6a4a2a;font-weight:800}.sc b{color:#2fa53c;font-weight:900}
/* 곰 마을 — 칸 넷 가로(레퍼런스 LONGHOUSE) */
.card.vil{width:1000px;border-color:#5a3a1a;box-shadow:0 10px 0 #2a1a0e}
.card.vil .body{gap:16px;padding:18px 26px 24px}
.card.vil .ups{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%}
.card.vil .up{background:#fffaf0;border:4px solid #e9c89a;border-radius:20px;padding:14px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.upic{width:92px;height:92px;border-radius:20px;background:#fff3dc;border:4px solid #4a2a12;display:flex;align-items:center;justify-content:center}
.upic img.art{width:84px;height:84px}.upic .ae{font-size:46px}
.upn{font-size:24px;color:#4a2a12}.upd{font-size:16px;color:#8a6a4a;min-height:22px}
.pips{display:flex;gap:6px}.pips i{width:34px;height:12px;border-radius:6px;background:#e6dccb;border:2px solid #b9a88e}.pips i.on{background:#3cc24a;border-color:#1d7a28}
.price{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;height:52px;border-radius:18px;border:4px solid #2a1a0e;box-shadow:0 5px 0 #2a1a0e;background:linear-gradient(#d8d2c8,#aea596);color:#fff;font-size:24px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3);margin-top:4px}
.price.can{background:linear-gradient(#5be36a,#28b33a)}.price.can:active{transform:translateY(4px);box-shadow:0 1px 0 #2a1a0e}
.price.max{background:linear-gradient(#ffd23a,#e0a800);font-size:20px}
.price.shake{animation:shk .32s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pillg b{font-weight:900}
/* 지도 그림 */
.mapbody.img{border-radius:22px;overflow:hidden;border:4px solid #8a6a3a}
.mapimg{position:absolute;inset:-8px;background-size:cover;background-position:center 52%;filter:blur(2.5px) saturate(1.05);opacity:.9}
.mapbody.img::before{content:'';position:absolute;inset:0;background:rgba(255,246,220,.28);z-index:0}
.mapbody.img .region{background:none;border-color:transparent}
.mapbody.img .region .rtag{top:4px}
.mapbody.img .node{z-index:2}.mapbody.img .mpath{z-index:1}
.mapfoot .rbtn{width:56px;height:56px;font-size:24px}
/* 첫 화면 */
.tscr{position:absolute;inset:0;pointer-events:auto;background:#8fd0f5 center/cover no-repeat;overflow:hidden}
.tscr.noimg{background:var(--tbg)}
.tscr::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 34% 60% at 50% 42%,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.tcol{position:absolute;left:50%;top:0;width:520px;transform:translateX(-50%) scale(var(--u));transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;z-index:1}
.tsm{margin-top:34px;font-size:40px;font-weight:900;color:#fff4d6;-webkit-text-stroke:7px #6a2a00;paint-order:stroke fill;text-shadow:0 4px 0 #6a2a00;letter-spacing:8px}
.tbig{font-size:104px;line-height:1.05;font-weight:900;color:#ffd23a;-webkit-text-stroke:14px #6a2a00;paint-order:stroke fill;text-shadow:0 9px 0 #6a2a00,0 16px 20px rgba(0,0,0,.28);white-space:nowrap;letter-spacing:2px}
.btn.tstart{margin-top:30px;min-width:340px;height:86px;font-size:40px;border-radius:28px}
.tpills{display:flex;gap:16px;margin-top:24px}.tpills .pillg{font-size:26px;padding:6px 20px 6px 8px}.tpills .st{color:#ffd23a;padding-left:18px}
.btn.tvil{margin-top:20px;min-width:300px;height:64px;font-size:28px}
.tbest{margin-top:16px;font-size:22px;font-weight:900;color:#fff;background:rgba(42,26,14,.62);border-radius:999px;padding:6px 20px;border:3px solid rgba(42,26,14,.8)}.tbest b{color:#ffd23a}
.tsnd{position:absolute;right:0;bottom:var(--sb,0px);display:flex;gap:14px;padding:0 22px 20px 0;transform:scale(var(--u));transform-origin:100% 100%}
.rinfo,.ract{display:contents}
.mapwrap{position:relative}
/* 낮은 창(무대 높이 ≤ 400px · 가로 휴대폰): 아래 60px(--sb)를 비우고, 카드는 낮게(높이 480 안) · 단추는 크게 */
html.short .card .ttl{font-size:30px;padding:6px}
html.short .tag{font-size:15px;top:-17px}
html.short #banner.low{top:330px}html.short #hint{top:360px}
html.short .mapmain{display:flex;align-items:center;padding:12px 14px}
html.short .mapwrap{width:840px;height:353px;flex:none}
html.short .mapbody{transform:scale(.75);transform-origin:0 0;margin:0}
html.short .mapfoot{flex:1;flex-direction:column;gap:14px;padding:0 0 0 16px}
html.short .mapfoot .mname{order:0;min-width:0;text-align:center;font-size:26px}
html.short .mapfoot .mplay{order:1;height:100px;width:100%;min-width:0;font-size:40px;border-radius:28px}
html.short .mapfoot .btn.sm{order:2;height:76px;width:100%;min-width:0;font-size:28px}
html.short .mapfoot .rbtn{order:3;width:76px;height:76px;font-size:32px}
html.short .node{width:100px;height:100px;font-size:46px}html.short .node.boss{width:124px;height:124px}
html.short .nst{bottom:-30px}html.short .nst .star{font-size:28px}
html.short .card.res{width:1040px}
html.short .card.res .body{flex-direction:row-reverse;align-items:center;gap:26px;padding:14px 26px 18px} /* 단추는 왼쪽(아케이드가 점수 뒤 오른쪽에 순위 창을 띄워도 안 가리게) */
html.short .card.res .rinfo{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
html.short .card.res .ract{display:flex;flex-direction:column;align-items:center;gap:16px;width:340px;flex:none}
html.short .card.res .ract .btns{flex-direction:column;gap:14px;margin:0;width:100%}
html.short .card.res .ract .btn.sm{height:76px;width:100%;font-size:28px}
html.short .card.res .ract .btn.wide{height:98px;width:100%;min-width:0;font-size:38px}
html.short .card.pz .body{gap:12px;padding:14px 28px 18px}
html.short .card.pz .btn.wide{height:84px}html.short .card.pz .btn.wide2{height:70px;font-size:28px}
html.short .card.pz .rbtn{width:72px;height:72px;font-size:30px}
html.short .card.vil .body{gap:10px;padding:12px 22px 16px}
html.short .card.vil .up{padding:8px 8px 10px;gap:4px}
